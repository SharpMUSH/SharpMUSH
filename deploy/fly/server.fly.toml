# SharpMUSH on Fly.io, split: the game server and the world. launch.sh saves this file as
# <game>.server.fly.toml, filling in the game's name, and deploys it as the app
# <game>-server. It has no public address; the edge reaches it on the game's private network.
#
# Deploying this app restarts the server without dropping anyone: the edge keeps players' sockets.
[build]
  image = "sharpmush/sharpmush-server:dev"

[env]
  NATS_URL = "nats://{game}.internal:4222"
  # The edge reaches it from a private address that changes whenever its machine is replaced, and
  # nothing else can reach it.
  ForwardedHeaders__KnownNetworks__0 = "0.0.0.0/0"
  ForwardedHeaders__KnownNetworks__1 = "::/0"
  # Everything it keeps, on the volume.
  SHARPMUSH_LIGHTNING_PATH = "/data/lightning"
  SHARPMUSH_LIGHTNING_SYNC = "periodic"
  SHARPMUSH_BACKUP_PATH = "/data/backup"
  SHARPMUSH_BACKUP_INTERVAL = "6h"
  SHARPMUSH_BACKUP_KEEP = "2"
  Wiki__AssetRoot = "/data/wiki-assets"

[mounts]
  source = "sharpmush_data"
  destination = "/data"
  initial_size = "10gb"

[checks]
  [checks.listening]
    type = "tcp"
    port = 8080
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

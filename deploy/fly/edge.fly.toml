# SharpMUSH on Fly.io, split: the edge. Caddy, NATS and the connection server, which hold every
# player's socket. launch.sh saves this file as <game>.edge.fly.toml, filling in the game's name,
# and deploys it as the app <game>, the only part with a public address.
#
# Deploying this app restarts the edge and drops connected players, so launch.sh deploys it only
# when asked (--update-edge). The server and renderer update without dropping anyone.
[build]
  image = "sharpmush/sharpmush-fly:dev"

[env]
  SHARPMUSH_ROLE = "edge"
  # Set to your own domain once it points at the app (fly certs add <domain>); the setup link in the
  # log uses it. Empty means <game>.fly.dev.
  SHARPMUSH_DOMAIN = ""
  # The other two parts, on the game's private network.
  SHARPMUSH_SERVER_ADDRESS = "{game}-server.internal:8080"
  Rendering__Address = "http://{game}-renderer.internal:5100"

# NATS's store and the first-boot guard's state. The world is on the server's volume.
[mounts]
  source = "sharpmush_edge"
  destination = "/data"
  initial_size = "1gb"

# The portal. Fly ends TLS and hands Caddy plain HTTP.
[http_service]
  internal_port = 8000
  force_https = true
  # A game is always on: never stop the machine for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

# Telnet, as raw TCP: over IPv6, or IPv4 with a dedicated address (launch.sh --dedicated-ipv4).
[[services]]
  internal_port = 4201
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4201

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

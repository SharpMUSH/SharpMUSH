# SharpMUSH on Fly.io: one machine running the all-in-one image, with the world on a volume.
# launch.sh saves this file as <app>.fly.toml, creates the app, its volume and IP addresses, then
# deploys with it. The app name and region come from launch.sh's arguments.

# Every deploy pulls the newest build of this tag and restarts the machine, dropping connected
# players. Nothing deploys on its own. Once SharpMUSH has releases, a release tag
# (sharpmush-allinone:1.0.0) holds the game on one version until you change it here.
[build]
  image = "sharpmush/sharpmush-allinone:dev"

[env]
  # Set to your own domain once it points at the app (fly certs add <domain>); the setup link in the
  # log uses it. Empty means <app>.fly.dev.
  SHARPMUSH_DOMAIN = ""

[mounts]
  source = "sharpmush_data"
  destination = "/data"
  initial_size = "10gb"

# The portal. Fly ends TLS and hands Caddy plain HTTP.
[http_service]
  internal_port = 8000
  force_https = true
  # A game is always on: never stop the machine for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

# Telnet, as raw TCP: over IPv6, or IPv4 with a dedicated address (launch.sh --dedicated-ipv4).
[[services]]
  internal_port = 4201
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4201

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

services:
  nats:
    image: nats:2-alpine
    container_name: sharpmush-nats
    # -c: max_payload (6 MB) — a server-level limit with no CLI flag, so it needs a config file.
    command: ["-js", "-sd", "/data", "-m", "8222", "-c", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"   # NATS client port
      - "8222:8222"   # NATS monitoring port
    networks:
      - sharpmush-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8222/healthz -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  connectionserver:
    restart: unless-stopped
    image: sharpmush/sharpmush-socketserver:dev
    labels:
      - com.centurylinklabs.watchtower.enable=true
    stop_grace_period: 60s
    volumes:
      - render-socket:/run/sharpmush
    environment:
      - Rendering__SocketPath=/run/sharpmush/render.sock
      - NATS_URL=nats://nats:4222
    depends_on:
      renderer:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "4201:4201" # Telnet
      - "4202:4202" # SocketServer WebSocket API
    networks:
      - sharpmush-net

  # Rendering can restart independently; the stable connectionserver service owns client sockets.
  renderer:
    image: sharpmush/sharpmush-connectionserver:dev
    stop_grace_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - Rendering__SocketPath=/run/sharpmush/render.sock
    volumes:
      - render-socket:/run/sharpmush
    network_mode: none
    restart: unless-stopped

  sharpmush-server:
    restart: unless-stopped
    stop_grace_period: 60s
    image: sharpmush/sharpmush-server:dev
    environment:
      # Embedded LMDB world on the app-data volume; no database container needed. See deploy/README.md
      # for the durability setting and the map-size ceiling.
      - SHARPMUSH_DATABASE_PROVIDER=lightning
      - SHARPMUSH_LIGHTNING_PATH=data/lightning
      - SHARPMUSH_LIGHTNING_SYNC=periodic
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      connectionserver:
        condition: service_started
    volumes:
      - app-data:/app/data
    networks:
      - sharpmush-net

volumes:
  nats-data: # Durable connection state, resume credentials and replay
  render-socket: # Private Unix socket shared only by socket owner and rendering worker
  app-data:   # LMDB world + wiki assets

networks:
  sharpmush-net:
    driver: bridge

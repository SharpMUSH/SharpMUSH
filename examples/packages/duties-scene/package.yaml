format: "1.16"
package: duties-scene
title: "Duties in scenes"
version: 1.0.0
authors: [SharpMUSH]
description: "Ties a Duties party to a scene: +duty/start/scene gathers a party with a new scene, +duty/scene ties the party to one already running, and what happens on the duty goes into the scene as narration."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [duties, scene, logging, bridge]
category: Scenes
requires_server: ">=0.1"

# It makes scenes and writes poses through the Scene plugin, so it installs only while the plugin runs.
plugins: [scene]

# Neither package knows about the other. Duties runs the party and tells its extensions what happens; the
# scene package keeps scenes and their poses. This one joins them.
depends:
  - package: duties
    version: ">=1.2"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/duties/
      branch: main
  - package: scene
    version: ">=1.19"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene/
      branch: main

objects:
  # The link. WIZARD because it makes scenes for players, adds them to scenes and writes poses.
  #
  #   DATA`RUN`<run>      the scene party <run> is tied to
  #   DATA`RUN`<run>`BY   the player who tied it, whose name the duty's lines are written under
  - ref: link
    type: thing
    name: Duty Scene Link
    flags: [WIZARD]
    attributes:
      # +duty/start/scene <duty>: once the party is gathered, a scene for it, owned by the leader, in the
      # leader's room, titled after the duty with its description as the pitch.
      FLAG`START`SCENE: |-
        @assert strlen(%<run>); @assert u({{scene/logger}}/FUN`MAY,%<player>,scene.create)=@pemit %<player>=notice(SCENE,u({{scene/logger}}/FUN`DENY,scene.create),error); @assert not(strmatch(setr(ds_scene,scenecreate(loc(%<player>),%<player>,u(%!/FUN`TITLE,%<run>),u(%!/FUN`PITCH,%<run>))),#-1*))=@pemit %<player>=notice(SCENE,%q<ds_scene>,warn); @scene/member %q<ds_scene>/owner=%<player>; @scene/set %q<ds_scene>/status=get({{scene/logger}}/DATA`CONFIG`DEFAULT-STATUS); @trigger {{scene/logger}}/HERE`SYNC=scene(%q<ds_scene>,room); @include/args %!/INC`TIE=scene,%q<ds_scene>,run,%<run>,by,%<player>
      # +duty/scene shows the party's scene; +duty/scene <scene> ties the party to it, for the leader.
      DO`SCENE: |-
        @assert strlen(%<run>)=@pemit %<player>=notice(DUTY,You are not on a duty. +duty lists the ones you can start.,warn); think setq(ds_scene,get(%!/DATA`RUN`%<run>)); @assert strlen(%<arg>)=@pemit %<player>=notice(DUTY,if(strlen(%q<ds_scene>),Your party's duty goes into scene %q<ds_scene>: [scene(%q<ds_scene>,title)].,Your party is not tied to a scene. The leader ties it with +duty/scene <scene>%, or starts with one: +duty/start/scene <duty>.),info); @assert strmatch(get({{duties/store}}/RUN`%<run>`LEADER),objid(%<player>))=@pemit %<player>=notice(DUTY,Only the party's leader can tie it to a scene.,warn); @assert isint(%<arg>)=@pemit %<player>=notice(DUTY,Name the scene by its number: +duty/scene <number>.,warn); @assert not(strmatch(scene(%<arg>,status),#-1*))=@pemit %<player>=notice(SCENE,No such scene: %<arg>,warn); @assert not(match(finished cancelled,scene(%<arg>,status)))=@pemit %<player>=notice(DUTY,Scene %<arg> is over.,warn); @assert not(strmatch(setr(ds_join,scenejoin(%<arg>,%<player>)),#-1*))=@pemit %<player>=notice(SCENE,%q<ds_join>,warn); @include/args %!/INC`TIE=scene,%<arg>,run,%<run>,by,%<player>
      # Ties party %<run> to scene %<scene>, written under %<by>, and puts every member in it.
      INC`TIE: |-
        &DATA`RUN`%<run> %!=%<scene>; &DATA`RUN`%<run>`BY %!=objid(%<by>); @dolist/inline get({{duties/store}}/RUN`%<run>`MEMBERS)={@include/nobreak/args %!/INC`ADD=scene,%<scene>,member,##}; @pemit/list get({{duties/store}}/RUN`%<run>`MEMBERS)=notice(DUTY,What happens on [u(%!/FUN`TITLE,%<run>)] goes into scene %<scene>.,ok)
      # Makes %<member> a member of %<scene> and focuses them on it, so their own poses go there too.
      INC`ADD: |-
        @assert not(strmatch(setr(ds_joined,scenejoin(%<scene>,%<member>)),#-1*))=@pemit %<member>=notice(SCENE,You could not join scene %<scene>: %q<ds_joined>,warn); @scene/focus %<member>=%<scene>; @context/push %<member>=scene_focus,[json(object,scene,%<scene>)]

      # Duties tells this object what happens to a party: see +help duty extensions.
      ON`DUTIES`JOIN: |-
        @assert strlen(setr(ds_scene,get(%!/DATA`RUN`%<run>))); @include/args %!/INC`ADD=scene,%q<ds_scene>,member,%<member>
      ON`DUTIES`LINE: |-
        @assert strlen(setr(ds_scene,get(%!/DATA`RUN`%<run>))); @include/args %!/INC`LINE=scene,%q<ds_scene>,run,%<run>,text,%<text>
      ON`DUTIES`FINISH: |-
        @assert strlen(setr(ds_scene,get(%!/DATA`RUN`%<run>))); @include/nobreak/args %!/INC`LINE=scene,%q<ds_scene>,run,%<run>,text,%<why>; &DATA`RUN`%<run>`BY %!; &DATA`RUN`%<run> %!
      # One line into the scene as narration, shown under the duty's title. A scene that is paused, finished or
      # cancelled records nothing.
      INC`LINE: |-
        @assert not(match(paused finished cancelled,scene(%<scene>,status))); @scene/addpose %<scene>=[get(%!/DATA`RUN`%<run>`BY)],[u(%!/FUN`SHOWAS,%<scene>,%<run>)],[scene(%<scene>,room)],narration,emit,,%<text>

      # %0 a run: its duty's title and description, from the revision the party plays.
      FUN`ROOT: |-
        DUTY`[get({{duties/store}}/RUN`%0)]`R[get({{duties/store}}/RUN`%0`REV)]
      FUN`TITLE: |-
        u({{duties/duties}}/FUN`TITLE,u(%!/FUN`ROOT,%0))
      FUN`PITCH: |-
        get({{duties/store}}/[u(%!/FUN`ROOT,%0)]`DESC)
      # %0 a scene, %1 a run: the name the duty's lines are shown under, the duty's title while the run lasts
      # and the scene's own title after.
      FUN`SHOWAS: |-
        firstof(u(%!/FUN`TITLE,%1),scene(%0,title),Duty)

  # +duty/scene and +duty/start/scene: Duties finds them here. Uninstalling this package takes them away.
  - ref: registration
    target: "{{duties/duties}}"
    attributes:
      EXTENSION`SCENE: |-
        {{link}}

  # The +help topic goes into the duties help. Attached, so uninstalling this package takes it away again.
  # Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: help
    target: "{{duties/duties_help}}"
    attributes:
      HELP`DUTY`SCENE: |-
        A party can play its duty in a scene, so the scene's log holds the duty as it went.

        - `+duty/start/scene <duty>` gathers a party and makes a scene for it, owned by you, in your room,
          titled after the duty.
        - `+duty/scene <number>` ties your party to a scene already running. Only the leader can.
        - `+duty/scene` says which scene your party's duty goes into.

        Everyone in the party joins the scene and is focused on it, and so does each player who joins the
        party later. Setting out, each step's text, each roll, each outcome and the end go into the scene as
        narration under the duty's title. While the scene is paused nothing goes into it.

        Example:

        `+duty/start/scene harbor`

        Output: `\[DUTY\] You gather a party for The Harbor Fire.` and
        `\[DUTY\] What happens on The Harbor Fire goes into scene 12.`

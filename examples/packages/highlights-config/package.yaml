format: "1.16"
package: highlights-config
title: "Favourite poses and highlights: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Favourite poses and highlights settings into +config: registers them with the +config registry, so staff see and change them with +config highlights."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [highlights, config, bridge]
category: Scenes
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. highlights declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: highlights
    version: ">=1.2"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/highlights/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`HIGHLIGHTS: |-
        {{highlights/store}}

      # A select field: key %0, label %1, options %2 as |-separated "<value> <label>".
      WEB`ELEMENT`SELECT: |-
        json(object,kind,json(string,field),key,json(string,%0),label,json(string,%1),type,json(string,select),options,u({{jobs}}/WEB`JSON`ARRAY,iter(%2,u({{jobs}}/WEB`ELEMENT`OPTION,first(%i0),rest(%i0)),|,%r)))
      # The act action without emptying the form, for a form that shows what it saved.
      WEB`ACTION`KEEP: |-
        get({{jobs}}/DATA`WEB`ACTION`KEEP)
      # The act action that keeps the form, as JSON.
      DATA`WEB`ACTION`KEEP: |-
        {"transport":"http","method":"POST","route":"/http/jobs/act","payload":"fields","on_error":{"bind_field_errors":true}}
      WEB`DATA`BUCKET: |-
        setq(page_bucket,u({{jobs}}/WEB`FILTER`BUCKET,%0,%1))[json(object,fields,if(strlen(%q<page_bucket>),json_mod(u({{jobs}}/WEB`DATA`BUCKET`FACTS,%0,%q<page_bucket>),patch,u({{jobs}}/WEB`DATA`BUCKET`SETTINGS,%q<page_bucket>)),json(object)))]
      # Bucket %1's facts for viewer %0, by the labels WEB`SCHEMA`BUCKET`FACTS shows, with its name for the
      # rename field.
      WEB`DATA`BUCKET`FACTS: |-
        json(object,
        Status,u({{jobs}}/WEB`JSON`VALUE,json(string,if(u({{jobs}}/FUN`BUCKET`TAKING,%1),Taking new jobs,Disabled: no new jobs)),1),
        rename,u({{jobs}}/WEB`JSON`VALUE,json(string,name(%1)),1),
        Open jobs,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/WEB`QUEUE`COUNT,%0,BUCKET,%1)),1),
        First answer,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/FUN`WAIT`MEASURED,%1,ANSWER)),1),
        Closed in,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/FUN`WAIT`MEASURED,%1,CLOSE)),1),
        Permission,u({{jobs}}/WEB`JSON`VALUE,json(string,softcode.jobs.[get(%1/SLUG)]),1),
        Role,u({{jobs}}/WEB`JSON`VALUE,json(string,job-admin-[get(%1/SLUG)]),1),
        Hooks,u({{jobs}}/WEB`JSON`VALUE,json(string,firstof(itemize(squish(iter(lattr(%1/ON`*),if(strmatch(get(%1/%i0),@@*),,lcstr(after(%i0,`)))))),None written)),1))
      # Bucket %0's settings and locks, by the keys of the bucket page's fields.
      WEB`DATA`BUCKET`SETTINGS: |-
        json(object,
        description,u({{jobs}}/WEB`JSON`VALUE,json(string,get(%0/DESCRIPTION)),1),
        turnaround,u({{jobs}}/WEB`JSON`VALUE,json(number,firstof(get(%0/TURNAROUND),0)),1),
        reopen,u({{jobs}}/WEB`JSON`VALUE,json(number,firstof(get(%0/REOPEN),0)),1),
        anonymous,u({{jobs}}/WEB`JSON`VALUE,json(string,firstof(get(%0/ANONYMOUS),none)),1),
        priority,u({{jobs}}/WEB`JSON`VALUE,json(string,firstof(get(%0/PRIORITY),normal)),1),
        keep,u({{jobs}}/WEB`JSON`VALUE,json(string,get(%0/KEEP)),1),
        hidden,u({{jobs}}/WEB`JSON`VALUE,u({{jobs}}/WEB`JSON`BOOLEAN,get(%0/HIDDEN)),1),
        acknowledge,u({{jobs}}/WEB`JSON`VALUE,json(string,get(%0/ACKNOWLEDGE)),1),
        audit,u({{jobs}}/WEB`JSON`VALUE,u({{jobs}}/WEB`JSON`BOOLEAN,get(%0/AUDIT)),1),
        checklist,u({{jobs}}/WEB`JSON`VALUE,u({{jobs}}/WEB`JSON`ARRAY,iter(get(%0/CHECKLIST),json(string,trim(%i0)),|,%r)),1),
        file_lock,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/FUN`LOCK`TEXT,%0,file)),1),
        work_lock,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/FUN`LOCK`TEXT,%0,work)),1),
        audit_lock,u({{jobs}}/WEB`JSON`VALUE,json(string,u({{jobs}}/FUN`LOCK`TEXT,%0,audit)),1))

      # ---- lifecycle ------------------------------------------------------------
      # Commands added with @command/add and their hooks, and @functions, last until a restart, so STARTUP
      # sets them on every boot. /noparse and /rsnoparse hand the hooks the text as typed; /inline runs them
      # in place, as a built-in command would run.
      STARTUP: |-
        @dolist/inline +job +jobs +myjob +myjobs +ticket +tickets={@command/add/noparse/rsnoparse ##; @hook/override/inline ##={{jobs}},CMD`JOB}; @command/add/noparse/rsnoparse +request; @hook/override/inline +request={{jobs}},CMD`REQUEST; @dolist/inline +bug +typo +pitch +apply={@command/add/noparse/rsnoparse ##; @hook/override/inline ##={{jobs}},CMD`SHORTCUT}; @dolist/inline +bucket +buckets={@command/add/noparse/rsnoparse ##; @hook/override/inline ##={{jobs}},CMD`BUCKET}; @function job={{jobs}},FUN`API`JOB; @function jobs={{jobs}},FUN`API`JOBS; @function jobentries={{jobs}},FUN`API`JOBENTRIES; &DATA`TICK`RUN {{jobs}}=secs()[rand(100000)]; @trigger {{jobs}}/TRIG`TICK=get({{jobs}}/DATA`TICK`RUN)
      AINSTALL: |-
        @teleport {{jobs}}=#2; @trigger {{jobs}}/STARTUP
      # After an update: the commands, functions and timer again.
      AUPDATE: |-
        @trigger {{jobs}}/STARTUP

  # One THING per job, named Job <n>, lives in here. NO_COMMAND on every job, and INDEX`<n> maps a
  # number to its object. COUNTER is the last number given out; numbers are never reused.
  # OPT`MAIL`<key> holds a person's job-mail choice.
  - ref: store
    type: thing
    name: Job Store
    location: "{{jobs}}"
    flags: [NO_COMMAND]
    attributes:
      COUNTER: |-
        0

  # The buckets live in here, and it is their parent, so a setting a bucket leaves unset comes from
  # these defaults. +bucket/set changes a bucket's own copy.
  - ref: buckets
    type: thing
    name: Job Buckets
    location: "{{jobs}}"
    flags: [NO_COMMAND]
    attributes:
      DESCRIPTION: |-
        A job bucket.
      # Days staff have to answer a new job; 0 sets no due date.
      TURNAROUND: |-
        7
      # Days after closing that the filer's reply opens a job again; 0 never.
      REOPEN: |-
        7
      # none, filer (staff do not see who filed) or staff (players do not see staff names).
      ANONYMOUS: |-
        none
      HIDDEN: |-
        0
      PRIORITY: |-
        normal
      # 1: a job filed here is approved at once (its ON`APPROVE runs), and staff check it afterwards.
      AUDIT: |-
        0

  # A bucket. Its work lock says who works its jobs, its file lock who may file in it. Every
  # ON`<EVENT> hook starts as a comment naming its arguments, with an example: replace the comment
  # with code and it runs, as this bucket, after that change is written. The bucket holds only the
  # privileges a game gives it (@permission/allow Applications=<permission>, @role/assign), and only
  # its controllers write its hooks; +bucket/set never does.
  - ref: applications
    type: thing
    name: Applications
    location: "{{buckets}}"
    parent: "{{buckets}}"
    flags: [NO_COMMAND]
    locks:
      work: "perm^softcode.jobs.admin|perm^softcode.jobs.applications"
      file: "#TRUE"
    attributes:
      DESCRIPTION: |-
        Character applications.
      SLUG: |-
        applications
      ACKNOWLEDGE: |-
        Thanks. Staff have your request and will answer here.
      TURNAROUND: |-
        3
      CHECKLIST: |-
        Sheet checked|Background read|scene:A log of a scene you played
      ON`FILE: |-
        @@ {Runs after a job is filed in this bucket. %<job> (%0): job number. %<filer> (%1): objid of whoever filed it. %<title> (%2): the job's title. %<how> (%3): how it was filed: command, query, portal or api. Example, thanking the filer: @pemit %<filer>=Thanks. Staff answer [name(me)] jobs within [get(me/TURNAROUND)] days.}
      ON`REPLY: |-
        @@ {Runs after someone writes on a job in this bucket. %<job> (%0): job number. %<actor> (%1): objid of the writer. %<entry> (%2): number of the new entry. %<public> (%3): 1 for a public reply, 0 for a staff-only note. Example, telling a staff channel about public replies: @if %<public>=@cemit Staff=Job %<job> has a new reply.}
      ON`CLAIM: |-
        @@ {Runs after a handler is added to or removed from a job in this bucket. %<job> (%0): job number. %<actor> (%1): objid of whoever did it. %<handler> (%2): the handler, an objid or role:<role>. %<added> (%3): 1 when added, 0 when removed. Example, telling a new handler: @if %<added>=@pemit %<handler>=You now handle job %<job>.}
      ON`TURN: |-
        @@ {Runs after a job in this bucket changes whose turn it is. %<job> (%0): job number. %<actor> (%1): objid of whoever acted. %<from> (%2): the old state. %<to> (%3): the new state: new, staff, player or held. Example, nudging the filer: @if strmatch(%<to>,player)=@pemit [job(%<job>,filer)]=Staff are waiting on you about job %<job>.}
      ON`APPROVE: |-
        @@ {Runs after a job in this bucket is approved. %<job> (%0): job number. %<actor> (%1): objid of whoever approved it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the approval text. Example, granting the filer an approved role (allow it on this bucket first: @permission/allow Applications=<permission>): @role/assign %<filer>=approved; @pemit %<filer>=Your application, job %<job>, was approved.}
      ON`DENY: |-
        @@ {Runs after a job in this bucket is denied. %<job> (%0): job number. %<actor> (%1): objid of whoever denied it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @pemit %<filer>=Your job %<job> was denied. +job %<job> says why.}
      ON`COMPLETE: |-
        @@ {Runs after a job in this bucket is completed. %<job> (%0): job number. %<actor> (%1): objid of whoever completed it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example, posting to a channel: @cemit Staff=Job %<job> is done.}
      ON`CANCEL: |-
        @@ {Runs after a job in this bucket is canceled. %<job> (%0): job number. %<actor> (%1): objid of whoever canceled it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example: @pemit %<filer>=Job %<job> is canceled.}
      ON`REOPEN: |-
        @@ {Runs after a closed job in this bucket opens again. %<job> (%0): job number. %<actor> (%1): objid of whoever reopened it. %<byfiler> (%2): 1 when the filer reopened it by replying, 0 when staff did. Example: @if %<byfiler>=@cemit Staff=Job %<job> was reopened by its filer.}
      ON`TRANSFER: |-
        @@ {Runs on both buckets after a job moves between them. %<job> (%0): job number. %<actor> (%1): objid of whoever moved it. %<from> (%2): objid of the old bucket. %<to> (%3): objid of the new bucket. Example: @pemit [job(%<job>,filer)]=Job %<job> moved to [name(%<to>)].}
      ON`DUE: |-
        @@ {Runs after a job's due date in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old due date, in seconds, or empty. %<new> (%3): the new one, or empty. Example: @if strlen(%<new>)=@pemit %<actor>=Job %<job> is due [convsecs(%<new>)].}
      ON`PRIORITY: |-
        @@ {Runs after a job's priority in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old priority. %<new> (%3): the new one: low, normal or high. Example: @if strmatch(%<new>,high)=@cemit Staff=Job %<job> is now high priority.}
      ON`OVERDUE: |-
        @@ {Runs once when a job in this bucket passes its due date while waiting on staff. %<job> (%0): job number. %1: empty, since nobody acted. %<due> (%2): the due date, in seconds. Example, telling the job's handlers: @dolist [job(%<job>,handlers)]=@pemit ##=Job %<job> is overdue.}
      ON`DELETE: |-
        @@ {Runs after a job in this bucket is deleted. %<job> (%0): job number. %<actor> (%1): objid of whoever deleted it. %<title> (%2): the job's title. Example: @cemit Staff=Job %<job> was deleted by [name(%<actor>)].}
      ON`CHECK: |-
        @@ {Runs after a checklist step of a job in this bucket is ticked or unticked, by staff or by attaching a scene log. %<job> (%0): job number. %<actor> (%1): objid of whoever did it. %<step> (%2): the step's number. %<done> (%3): 1 when ticked, 0 when unticked. Example, telling the handlers once every step is done: @if cand(%<done>,eq(job(%<job>,done),job(%<job>,steps)))=@dolist [job(%<job>,handlers)]=@pemit ##=Every step of job %<job> is done.}
      ON`REVERT: |-
        @@ {Runs after staff revert a job this bucket approved at once (+bucket/set <bucket>/audit=yes). Undo here what ON`APPROVE did. %<job> (%0): job number. %<actor> (%1): objid of whoever reverted it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @role/unassign %<filer>=approved; @pemit %<filer>=Job %<job> was reverted. +job %<job> says why.}

  - ref: requests
    type: thing
    name: Requests
    location: "{{buckets}}"
    parent: "{{buckets}}"
    flags: [NO_COMMAND]
    locks:
      work: "perm^softcode.jobs.admin|perm^softcode.jobs.requests"
      file: "#TRUE"
    attributes:
      DESCRIPTION: |-
        Anything you need from staff.
      SLUG: |-
        requests
      ACKNOWLEDGE: |-
        Thanks. Staff have your request and will answer here.
      TURNAROUND: |-
        3
      ON`FILE: |-
        @@ {Runs after a job is filed in this bucket. %<job> (%0): job number. %<filer> (%1): objid of whoever filed it. %<title> (%2): the job's title. %<how> (%3): how it was filed: command, query, portal or api. Example, thanking the filer: @pemit %<filer>=Thanks. Staff answer [name(me)] jobs within [get(me/TURNAROUND)] days.}
      ON`REPLY: |-

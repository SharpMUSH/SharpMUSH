        job_title,trim(u({{jobs}}/WEB`POSTED`FIELD,title))); @assert cand(strlen(%q<file_bucket>),u({{jobs}}/FUN`CAN`FILE,%q<file_bucket>,%<viewer>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,bucket,Pick a bucket you can file in.)); @assert u({{jobs}}/FUN`BUCKET`TAKING,%q<file_bucket>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,bucket,name(%q<file_bucket>) is not taking new jobs.)); think setq(form_check,appfields(get({{jobs}}/FORM),json(object,bucket,json(string,%q<file_bucket>),title,json(string,%q<job_title>),text,json(string,%q<web_text>)))); @assert strmatch(json_query(%q<form_check>,get,ok),true)=think setq(web_answer,%q<form_check>); @include/args {{jobs}}/INC`DO`FILE=filer,%q<actor>,author,,priority,,bucket,%q<file_bucket>,title,%q<job_title>,text,%q<web_text>,format,%q<text_format>,how,portal; think setq(web_answer,json(object,ok,json(boolean,true),message,json(string,Filed job %q<job_number>.),redirect,json(string,/apps/jobs/%q<job_number>)))
      # The posted job, as INC`NEED`JOB finds one for a command.
      WEB`NEED`JOB: |-
        @assert cand(isint(%q<web_job_number>),strlen(setr(job_object,u({{jobs}}/FUN`JOB`FIND,%q<web_job_number>))),u({{jobs}}/FUN`CAN`SEE,%q<job_object>,%<viewer>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,There is no job %q<web_job_number>.)); think setqm(job_number,get(%q<job_object>/JOB`NUM),
        job_bucket,get(%q<job_object>/JOB`BUCKET),
        actor_is_staff,u({{jobs}}/FUN`CAN`WORK,%q<job_bucket>,%<viewer>))
      WEB`NEED`STAFF: |-
        @assert %q<actor_is_staff>=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only staff who work the [name(%q<job_bucket>)] bucket can do that.))
      WEB`NEED`OPEN: |-
        @assert not(strmatch(get(%q<job_object>/JOB`STATE),closed))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> is closed.))
      WEB`ACT`REPLY: |-
        @include {{jobs}}/WEB`NEED`JOB; think setq(reply_kind,if(cand(%q<actor_is_staff>,strmatch(u({{jobs}}/WEB`POSTED`FIELD,kind),note)),note,reply)); @assert strlen(trim(%q<web_text>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,text,Write something first.)); @assert cor(%q<actor_is_staff>,not(strmatch(get(%q<job_object>/JOB`STATE),closed)),u({{jobs}}/FUN`CAN`REOPEN,%q<job_object>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> closed too long ago to answer. File a new request.)); @include/args {{jobs}}/INC`DO`REPLY=kind,%q<reply_kind>,text,%q<web_text>,format,%q<text_format>,mailforce,0; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,if(strmatch(%q<reply_kind>,note),Note added.,Reply sent.),%<viewer>))
      WEB`ACT`CLAIM: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @include {{jobs}}/WEB`NEED`OPEN; @assert not(hasattr(%q<job_object>,JOB`HANDLER`%q<actor_key>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,You already handle job %q<job_number>.)); @include/args {{jobs}}/INC`DO`CLAIM=handler,%q<actor>,add,1; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,You handle job %q<job_number> now.,%<viewer>))
      WEB`ACT`UNCLAIM: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @assert hasattr(%q<job_object>,JOB`HANDLER`%q<actor_key>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,You do not handle job %q<job_number>.)); @include/args {{jobs}}/INC`DO`CLAIM=handler,%q<actor>,add,0; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,You no longer handle job %q<job_number>.,%<viewer>))
      # The message box, when filled, is the closing message, as with +job/approve <#>=<text>.
      WEB`ACT`CLOSE: |-
        @include {{jobs}}/WEB`NEED`JOB; think setq(job_outcome,lcstr(u({{jobs}}/WEB`POSTED`FIELD,outcome))); @assert match(approved denied completed canceled,%q<job_outcome>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,A job closes as approved/denied/completed or canceled.)); @assert cor(%q<actor_is_staff>,cand(strmatch(%q<job_outcome>,canceled),u({{jobs}}/FUN`IS`PARTY,%q<job_object>,%<viewer>)))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only staff who work the [name(%q<job_bucket>)] bucket can do that.)); @include {{jobs}}/WEB`NEED`OPEN; @include/args {{jobs}}/INC`DO`CLOSE=outcome,%q<job_outcome>,text,%q<web_text>,format,%q<text_format>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Job %q<job_number> is closed: %q<job_outcome>.,%<viewer>))
      WEB`ACT`REOPEN: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @assert strmatch(get(%q<job_object>/JOB`STATE),closed)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> is open.)); @include/nobreak/args {{jobs}}/INC`DO`REOPEN=byfiler,0; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Job %q<job_number> is open again.,%<viewer>))
      WEB`ACT`FORMAT: |-
        @include {{jobs}}/WEB`NEED`JOB; think setqm(entry_stored,u({{jobs}}/WEB`POSTED`FIELD,entry),
        text_format,lcstr(u({{jobs}}/WEB`POSTED`FIELD,fmt))); @assert cand(isint(%q<entry_stored>),hasattr(%q<job_object>,JOB`ENTRY`%q<entry_stored>`KIND),not(strmatch(get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`KIND),action)),uargs({{jobs}}/FUN`ENTRY`VISIBLE,job,%q<job_object>,entry,%q<entry_stored>,staff,%q<actor_is_staff>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> has no message %q<entry_stored>.)); @assert cor(%q<actor_is_staff>,strmatch(get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`BY),%q<actor>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only its author or staff can change how a message shows.)); @assert match(markdown softcode,%q<text_format>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,A message shows as markdown or softcode.)); @include/args {{jobs}}/INC`DO`FORMAT=entry,%q<entry_stored>,format,%q<text_format>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Message %q<entry_stored> shows [if(strmatch(%q<text_format>,softcode),as typed,as markdown)] now.,%<viewer>))

      # The update box, as +job/status.
      WEB`ACT`STATUS: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @include {{jobs}}/WEB`NEED`OPEN; think setq(update_text,trim(u({{jobs}}/WEB`POSTED`TEXT,update))); @assert lte(strlen(%q<update_text>),120)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,update,Keep the update to 120 characters.)); @include/nobreak/args {{jobs}}/INC`DO`STATUS=text,%q<update_text>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,if(strlen(%q<update_text>),Update saved.,Update cleared.),%<viewer>))
      # A checklist step's Done and Not done, as +job/check and /uncheck.
      WEB`ACT`CHECK: |-
        @include/args {{jobs}}/WEB`ACT`STEP=done,1
      WEB`ACT`UNCHECK: |-
        @include/args {{jobs}}/WEB`ACT`STEP=done,0
      WEB`ACT`STEP: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @include {{jobs}}/WEB`NEED`OPEN; think setq(step_number,u({{jobs}}/WEB`POSTED`FIELD,step)); @assert member(u({{jobs}}/FUN`STEP`LIST,%q<job_object>),%q<step_number>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> has no step %q<step_number>.)); @assert comp(t(get(%q<job_object>/JOB`CHECK`%q<step_number>`DONE)),%<done>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Step %q<step_number> is [if(%<done>,done already,not done)].)); @include/args {{jobs}}/INC`DO`CHECK=step,%q<step_number>,done,%<done>,scene,; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Step %q<step_number> is [if(%<done>,done,not done)].,%<viewer>))
      # The scene field's Attach, as +job/scene.
      WEB`ACT`SCENE: |-
        @include {{jobs}}/WEB`NEED`JOB; @assert u({{jobs}}/FUN`HAS`SCENES)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,This game keeps no scene logs.)); @assert cor(%q<actor_is_staff>,u({{jobs}}/FUN`IS`PARTY,%q<job_object>,%<viewer>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only staff or whoever filed job %q<job_number> can attach a scene to it.)); @include {{jobs}}/WEB`NEED`OPEN; think setq(scene_number,trim(u({{jobs}}/WEB`POSTED`TEXT,scene))); @assert not(strlen(setr(error_text,u({{jobs}}/FUN`ERROR`SCENE,%q<scene_number>,%<viewer>,%q<actor_is_staff>,%q<job_object>))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,scene,%q<error_text>)); @include/nobreak/args {{jobs}}/INC`DO`SCENE=scene,%q<scene_number>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Scene %q<scene_number> is attached.[if(strlen(%q<scene_step>),%bStep %q<scene_step> is done.)],%<viewer>))
      # Keep approval and Revert, as +job/audit and +job/revert; the message box is the reason.
      WEB`ACT`AUDIT: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @assert strmatch(get(%q<job_object>/JOB`AUDIT`STATE),pending)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Job %q<job_number> is not an approval waiting to be checked.)); @include {{jobs}}/INC`DO`AUDIT`PASS; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Job %q<job_number> is checked: its approval stands.,%<viewer>))
      WEB`ACT`REVERT: |-
        @include {{jobs}}/WEB`NEED`JOB; @include {{jobs}}/WEB`NEED`STAFF; @assert cand(match(pending passed,get(%q<job_object>/JOB`AUDIT`STATE)),strmatch(get(%q<job_object>/JOB`STATE),closed))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only an approval made at once can be reverted.)); @include/args {{jobs}}/INC`DO`REVERT=text,%q<web_text>,format,%q<text_format>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`JOB,Job %q<job_number> is reverted.,%<viewer>))
      # The bucket page's Save: every setting posted at once, checked as +bucket/set checks one. A setting
      # left out of the post stays as it is.
      WEB`ACT`BUCKET: |-
        @include {{jobs}}/WEB`ACT`BUCKET`CHECK; @include {{jobs}}/WEB`ACT`BUCKET`LOCKS; @dolist/inline %q<web_posted_settings>=&## %q<bucket_object>=u({{jobs}}/FUN`SETTING`VALUE,##,u({{jobs}}/WEB`POSTED`SETTING,##)); @dolist/inline %q<web_changed_locks>={@include/nobreak/args {{jobs}}/INC`DO`BUCKET`LOCK=kind,##,key,trim(u({{jobs}}/WEB`POSTED`FIELD,##_lock))}; think setq(web_answer,json(object,ok,json(boolean,true),message,json(string,name(%q<bucket_object>) is saved.)))
      # The bucket page's Save, first: the bucket, in %q<bucket_object>, and the settings posted, in
      # %q<web_posted_settings>, each checked; or stops with the answer.
      WEB`ACT`BUCKET`CHECK: |-
        think setqm(bucket_object,u({{jobs}}/WEB`FILTER`BUCKET,%<viewer>,u({{jobs}}/WEB`POSTED`FIELD,bucket)),
        web_posted_settings,squish(iter(get({{jobs}}/DATA`SETTING`NAMES),if(strlen(json_query(%q<web_body>,get,%i0)),%i0)))); @assert strlen(%q<bucket_object>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only a Job Admin or someone who works that bucket can change it.)); think setq(web_bad_setting,first(squish(iter(%q<web_posted_settings>,if(u({{jobs}}/FUN`SETTING`OK,%i0,u({{jobs}}/WEB`POSTED`SETTING,%i0)),,%i0))))); @assert not(strlen(%q<web_bad_setting>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,%q<web_bad_setting>,get({{jobs}}/DATA`SETTING`%q<web_bad_setting>)))
      # The bucket page's Save, next: the locks posted that differ from the bucket's, in %q<web_changed_locks>,
      # changed only by a Job Admin and each a lock; or stops with the answer.
      WEB`ACT`BUCKET`LOCKS: |-
        think setq(web_changed_locks,squish(iter(file work audit,if(cand(strlen(json_query(%q<web_body>,get,%i0_lock)),comp(trim(u({{jobs}}/WEB`POSTED`FIELD,%i0_lock)),u({{jobs}}/FUN`LOCK`TEXT,%q<bucket_object>,%i0))),%i0)))); @assert cor(not(words(%q<web_changed_locks>)),u({{jobs}}/FUN`IS`ADMIN,%<viewer>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only a Job Admin can change a bucket's locks.)); think setq(web_bad_lock,first(squish(iter(%q<web_changed_locks>,if(u({{jobs}}/FUN`LOCK`OK,%i0,trim(u({{jobs}}/WEB`POSTED`FIELD,%i0_lock))),,%i0))))); @assert not(strlen(%q<web_bad_lock>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,%q<web_bad_lock>_lock,if(strlen(trim(u({{jobs}}/WEB`POSTED`FIELD,%q<web_bad_lock>_lock))),That is not a lock.,Someone has to work the bucket: give it a lock.)))
      # Field %0 as posted, empty when it was not.
      WEB`POSTED`TEXT: |-
        setq(posted_value,u({{jobs}}/WEB`POSTED`FIELD,%0))[if(strmatch(%q<posted_value>,null),,%q<posted_value>)]
      WEB`NEED`ADMIN: |-
        @assert u({{jobs}}/FUN`IS`ADMIN,%<viewer>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,Only a Job Admin can do that.))
      # The posted bucket, as %q<bucket_object>.
      WEB`NEED`BUCKET: |-
        @assert strlen(setr(bucket_object,u({{jobs}}/WEB`FILTER`BUCKET,%<viewer>,u({{jobs}}/WEB`POSTED`TEXT,bucket))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,There is no such bucket.))
      # After a change to bucket %q<bucket_object>: message %0 and its page drawn again for viewer %1. The redirect
      # reloads the sidebar.
      WEB`ANSWER`BUCKET: |-
        json(object,ok,json(boolean,true),message,json(string,%0),schema,u({{jobs}}/WEB`SCHEMA`BUCKET`SEEN,%q<bucket_object>,%1),data,u({{jobs}}/WEB`DATA`BUCKET,%1,get(%q<bucket_object>/SLUG)),redirect,json(string,/apps/jobs/buckets/[get(%q<bucket_object>/SLUG)]))
      # The bucket list's Create bucket, as +bucket/create.
      WEB`ACT`NEWBUCKET: |-
        @include {{jobs}}/WEB`NEED`ADMIN; think setqm(bucket_name,trim(u({{jobs}}/WEB`POSTED`TEXT,new_name)),
        bucket_description,trim(u({{jobs}}/WEB`POSTED`TEXT,new_description))); @assert not(strlen(setr(error_text,u({{jobs}}/FUN`ERROR`NAME,%q<bucket_name>,))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,new_name,%q<error_text>)); @assert u({{jobs}}/FUN`SETTING`OK,description,%q<bucket_description>)=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,new_description,get({{jobs}}/DATA`SETTING`DESCRIPTION))); @include/args {{jobs}}/INC`DO`BUCKET`CREATE=name,%q<bucket_name>,description,%q<bucket_description>; think setq(web_answer,json(object,ok,json(boolean,true),message,json(string,Bucket %q<bucket_name> is ready. The role job-admin-%q<bucket_slug> works it.),redirect,json(string,/apps/jobs/buckets/%q<bucket_slug>)))
      # The bucket page's Manage section, as +bucket/rename, /disable, /enable and /delete.
      WEB`ACT`RENAMEBUCKET: |-
        @include {{jobs}}/WEB`NEED`ADMIN; @include {{jobs}}/WEB`NEED`BUCKET; think setq(bucket_name,trim(u({{jobs}}/WEB`POSTED`TEXT,rename))); @assert comp(%q<bucket_name>,name(%q<bucket_object>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,rename,It is called that already.)); @assert not(strlen(setr(error_text,u({{jobs}}/FUN`ERROR`NAME,%q<bucket_name>,%q<bucket_object>))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,rename,%q<error_text>)); @include/args {{jobs}}/INC`DO`BUCKET`RENAME=name,%q<bucket_name>; think setq(web_answer,u({{jobs}}/WEB`ANSWER`BUCKET,The bucket is called %q<bucket_name> now.,%<viewer>))
      WEB`ACT`DISABLEBUCKET: |-
        @include {{jobs}}/WEB`NEED`ADMIN; @include {{jobs}}/WEB`NEED`BUCKET; @assert not(strlen(setr(error_text,u({{jobs}}/FUN`ERROR`DISABLE,%q<bucket_object>))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,%q<error_text>)); @include/args {{jobs}}/INC`DO`BUCKET`STATE=disabled,1; think setq(web_answer,u({{jobs}}/WEB`ANSWER`BUCKET,name(%q<bucket_object>) takes no new jobs now.,%<viewer>))
      WEB`ACT`ENABLEBUCKET: |-
        @include {{jobs}}/WEB`NEED`ADMIN; @include {{jobs}}/WEB`NEED`BUCKET; @assert not(u({{jobs}}/FUN`BUCKET`TAKING,%q<bucket_object>))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,name(%q<bucket_object>) takes new jobs already.)); @assert not(strlen(get(%q<bucket_object>/DELETING`TO)))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`ERROR,name(%q<bucket_object>) is being deleted.)); @include/args {{jobs}}/INC`DO`BUCKET`STATE=disabled,0; think setq(web_answer,u({{jobs}}/WEB`ANSWER`BUCKET,name(%q<bucket_object>) takes new jobs again.,%<viewer>))
      WEB`ACT`DELETEBUCKET: |-
        @include {{jobs}}/WEB`NEED`ADMIN; @include {{jobs}}/WEB`NEED`BUCKET; think setqm(move_to_slug,u({{jobs}}/WEB`POSTED`TEXT,moveto),
        bucket_move_to,if(strlen(%q<move_to_slug>),u({{jobs}}/FUN`BUCKET`BYSLUG,%q<move_to_slug>)),
        bucket_job_count,words(u({{jobs}}/FUN`SELECT`JOBS,%<viewer>,INBUCKET,%q<bucket_object>))); @assert not(strlen(setr(error_text,u({{jobs}}/FUN`ERROR`DELETE,%q<bucket_object>,%q<bucket_move_to>,%q<move_to_slug>))))=think setq(web_answer,u({{jobs}}/WEB`ANSWER`FIELDERROR,if(%q<bucket_job_count>,moveto,_global),%q<error_text>)); @include/nobreak/args {{jobs}}/INC`DO`BUCKET`DELETE=to,%q<bucket_move_to>; think setq(web_answer,json(object,ok,json(boolean,true),message,json(string,uargs({{jobs}}/FUN`TEXT`DELETED,name,%q<bucket_name>,moved,%q<bucket_moved>,to,%q<bucket_move_to>,pending,%q<bucket_pending>)),redirect,json(string,/apps/jobs/buckets)))
      # Setting %0 as posted, in the words +bucket/set takes. The checklist comes as a list of steps.
      WEB`POSTED`SETTING: |-
        setq(posted_setting,u({{jobs}}/WEB`POSTED`FIELD,%0))[switch(%0,hidden,if(match(true 1 yes on,lcstr(%q<posted_setting>)),yes,no),audit,if(match(true 1 yes on,lcstr(%q<posted_setting>)),yes,no),checklist,u({{jobs}}/WEB`POSTED`CHECKLIST,%q<posted_setting>),if(strmatch(%q<posted_setting>,null),,%q<posted_setting>))]
      # A posted JSON list of steps as the |-separated list +bucket/set takes; a | inside a step becomes a /.
      WEB`POSTED`CHECKLIST: |-
        switch(1,strmatch(json_query(%0),array),if(gt(json_query(%0,size),0),iter(lnum(0,dec(json_query(%0,size))),edit(json_query(json_query(%0,get,%i0),unescape),|,/),%b,|)),strmatch(%0,null),,%0)

      # sidebar: GET /http/jobs/nav
      # Viewer %0's sidebar: staff get the queue's views and the buckets they work, players their own
      # jobs, with counts. Nobody signed in gets no links, and the portal shows the app's own.
      WEB`NAV`ROUTE: |-
        json(object,groups,if(strlen(%0),u({{jobs}}/WEB`JSON`ARRAY,u({{jobs}}/WEB`NAV`[if(u({{jobs}}/FUN`IS`STAFF,%0),STAFF,PLAYER)],%0)),json_array()))
      WEB`NAV`STAFF: |-
        json(object,label,json(string,),items,json(array,u({{jobs}}/WEB`ELEMENT`LINK,Needs attention,/apps/jobs,inbox,u({{jobs}}/WEB`QUEUE`COUNT,%0,DEFAULT)),u({{jobs}}/WEB`ELEMENT`LINK,Handled by me,/apps/jobs?filter=mine,person,u({{jobs}}/WEB`QUEUE`COUNT,%0,MINE)),u({{jobs}}/WEB`ELEMENT`LINK,New,/apps/jobs?filter=new,fiber_new,u({{jobs}}/WEB`QUEUE`COUNT,%0,NEW)),u({{jobs}}/WEB`ELEMENT`LINK,Overdue,/apps/jobs?filter=overdue,alarm,u({{jobs}}/WEB`QUEUE`COUNT,%0,OVERDUE)),u({{jobs}}/WEB`ELEMENT`LINK,To check,/apps/jobs?filter=audit,fact_check,u({{jobs}}/WEB`QUEUE`COUNT,%0,AUDIT)),u({{jobs}}/WEB`ELEMENT`LINK,All open,/apps/jobs?filter=all,view_list,u({{jobs}}/WEB`QUEUE`COUNT,%0,OPEN)),u({{jobs}}/WEB`ELEMENT`LINK,Closed,/apps/jobs?filter=old,inventory_2),u({{jobs}}/WEB`ELEMENT`LINK,New request,/apps/jobs/new,add)))%r[json(object,label,json(string,Buckets),items,u({{jobs}}/WEB`JSON`ARRAY,iter(u({{jobs}}/WEB`BUCKET`WORKED,%0),u({{jobs}}/WEB`ELEMENT`LINK,name(%i0),/apps/jobs?bucket=[get(%i0/SLUG)],if(u({{jobs}}/FUN`BUCKET`TAKING,%i0),folder_open,folder_off),u({{jobs}}/WEB`QUEUE`COUNT,%0,BUCKET,%i0)),%b,%r)%r[u({{jobs}}/WEB`ELEMENT`LINK,Bucket settings,/apps/jobs/buckets,tune)]))]
      WEB`NAV`PLAYER: |-
        json(object,label,json(string,),items,json(array,u({{jobs}}/WEB`ELEMENT`LINK,My open jobs,/apps/jobs,inbox,u({{jobs}}/WEB`QUEUE`COUNT,%0,DEFAULT)),u({{jobs}}/WEB`ELEMENT`LINK,Closed,/apps/jobs?filter=old,inventory_2),u({{jobs}}/WEB`ELEMENT`LINK,New request,/apps/jobs/new,add)))
      # A sidebar link: label %0, path %1, Material icon %2, and count %3 when there is one.
      WEB`ELEMENT`LINK: |-
        if(strlen(%3),json(object,label,json(string,%0),path,json(string,%1),icon,json(string,%2),count,json(number,%3)),json(object,label,json(string,%0),path,json(string,%1),icon,json(string,%2)))
      # How many jobs predicate %1 (with %2) selects for viewer %0.
      WEB`QUEUE`COUNT: |-
        words(u({{jobs}}/FUN`SELECT`JOBS,%0,%1,%2))

      # Bucket settings: /apps/jobs/buckets lists the buckets the viewer works; buckets/<slug> edits one.
      WEB`SCHEMA`BUCKETS: |-

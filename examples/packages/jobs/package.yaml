      INC`JOB`DUE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; @assert %q<cmd_has_equals>=@pemit %#=notice(JOBS,+job/due %q<job_number>=<date>\, +<n>d\, or none,warn); @assert not(strmatch(setr(due_time,u({{jobs}}/FUN`DUE`PARSE,%q<cmd_right_side>)),#-1))=@pemit %#=notice(JOBS,I can't read %q<cmd_right_side> as a date. Try +3d\, +12h or none.,warn); think setq(due_time,if(strmatch(%q<due_time>,none),,%q<due_time>)); @include/args {{jobs}}/INC`DO`DUE=due,%q<due_time>; @pemit %#=notice(JOBS,Job %q<job_number> is [if(strlen(%q<due_time>),due [u({{jobs}}/FUN`TIME`WHEN,%q<due_time>)],not due on any date)].,ok)
      # /priority, and /esc with green, yellow or red.

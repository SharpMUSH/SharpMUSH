        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert strlen(setr(priority_level,u({{jobs}}/FUN`PRIORITY`PARSE,%q<cmd_right_side>)))=@pemit %#=notice(JOBS,Priority is low\, normal or high \(or green\, yellow\, red\).,warn); @include/args {{jobs}}/INC`DO`PRIORITY=priority,%q<priority_level>; @pemit %#=notice(JOBS,Job %q<job_number> is [lcstr(%q<priority_level>)] priority.,ok)
      INC`JOB`NAME: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert cand(strlen(%q<cmd_right_side>),lte(strlen(%q<cmd_right_side>),80))=@pemit %#=notice(JOBS,A title is 1 to 80 characters.,warn); &JOB`TITLE %q<job_object>=%q<cmd_right_side>; @include/args {{jobs}}/INC`DO`LOG=line,Retitled.,code,name; @pemit %#=notice(JOBS,Job %q<job_number> is titled: %q<cmd_right_side>,ok)
      # /trans, and /bucket.
      INC`JOB`TRANS: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert strlen(setr(target_bucket,u({{jobs}}/FUN`BUCKET`FIND,%q<cmd_right_side>)))=@pemit %#=notice(JOBS,There is no bucket called %q<cmd_right_side>.,warn); @assert not(strmatch(%q<target_bucket>,%q<job_bucket>))=@pemit %#=notice(JOBS,Job %q<job_number> is in [name(%q<target_bucket>)] already.,warn); @assert u({{jobs}}/FUN`BUCKET`TAKING,%q<target_bucket>)=@pemit %#=notice(JOBS,name(%q<target_bucket>) is not taking new jobs.,warn); @include/args {{jobs}}/INC`DO`TRANSFER=bucket,%q<target_bucket>; @pemit %#=notice(JOBS,Job %q<job_number> is in [name(%q<target_bucket>)] now.,ok)
      # Job Admin only. The number is never used again.
      INC`JOB`DELETE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`ADMIN; think setq(job_title,get(%q<job_object>/JOB`TITLE)); &INDEX`%q<job_number> {{store}}; @tel %q<job_object>={{jobs}}; @nuke %q<job_object>; @trigger/args %q<job_bucket>/ON`DELETE=0,%q<job_number>,1,%q<actor>,2,%q<job_title>,job,%q<job_number>,actor,%q<actor>,title,%q<job_title>; @pemit %#=notice(JOBS,Job %q<job_number> is deleted.,ok)
      # /merge <from>=<into>: the messages, handlers, watchers and helpers of one job move into another.
      INC`JOB`MERGE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; think setqm(merge_source,%q<job_object>,
        merge_source_number,%q<job_number>,
        merge_source_title,get(%q<job_object>/JOB`TITLE),
        cmd_left_side,%q<cmd_right_side>); @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert not(strmatch(%q<merge_source>,%q<job_object>))=@pemit %#=notice(JOBS,A job can't be merged into itself.,warn); @include {{jobs}}/INC`DO`MERGE; @pemit %#=notice(JOBS,Job %q<merge_source_number> is merged into job %q<job_number>.,ok)
      # Moves job %q<merge_source> (number %q<merge_source_number>, title %q<merge_source_title>) into
      # %q<job_object>: its messages after this one's, its handlers, watchers and helpers, then removes it.
      INC`DO`MERGE: |-
        @dolist/inline lnum(1,firstof(get(%q<merge_source>/JOB`ENTRIES),0))={@include/args {{jobs}}/INC`DO`MERGE`ENTRY=entry,##}; @dolist/inline lattr(%q<merge_source>/JOB`HANDLER`*) [lattr(%q<merge_source>/JOB`HROLE`*)] [lattr(%q<merge_source>/JOB`WATCHER`*)] [lattr(%q<merge_source>/JOB`HELPER`*)]=&## %q<job_object>=get(%q<merge_source>/##); @include/args {{jobs}}/INC`DO`LOG=line,Job %q<merge_source_number> merged into this one: %q<merge_source_title>,code,merge; &INDEX`%q<merge_source_number> {{store}}; @tel %q<merge_source>={{jobs}}; @nuke %q<merge_source>
      # Copies message %<entry> of %q<merge_source> to the end of %q<job_object>.
      INC`DO`MERGE`ENTRY: |-
        think setq(merge_entry,inc(firstof(get(%q<job_object>/JOB`ENTRIES),0))); &JOB`ENTRIES %q<job_object>=%q<merge_entry>; @dolist/inline KIND BY AT TEXT FORMAT ACTION=&JOB`ENTRY`%q<merge_entry>`## %q<job_object>=get(%q<merge_source>/JOB`ENTRY`%<entry>`##)
      # /edit <#>/<entry>=<old>/<new>: your own messages.

        @@ {Runs after a handler is added to or removed from a job in this bucket. %0: job number. %1: objid of whoever did it. %2: the handler, an objid or role:<role>. %3: 1 when added, 0 when removed. Example, telling a new handler: @if %3=@pemit %2=You now handle job %0.}
      ON`TURN: |-
        @@ {Runs after a job in this bucket changes whose turn it is. %0: job number. %1: objid of whoever acted. %2: the old state. %3: the new state: new, staff, player or held. Example, nudging the filer: @if strmatch(%3,player)=@pemit [job(%0,filer)]=Staff are waiting on you about job %0.}
      ON`APPROVE: |-
        @@ {Runs after a job in this bucket is approved. %0: job number. %1: objid of whoever approved it. %2: objid of whoever filed it. %3: number of the entry holding the approval text. Example: @pemit %2=Your job %0 was approved.}
      ON`DENY: |-
        @@ {Runs after a job in this bucket is denied. %0: job number. %1: objid of whoever denied it. %2: objid of whoever filed it. %3: number of the entry holding the reason. Example: @pemit %2=Your job %0 was denied. +job %0 says why.}
      ON`COMPLETE: |-
        @@ {Runs after a job in this bucket is completed. %0: job number. %1: objid of whoever completed it. %2: objid of whoever filed it. %3: number of the entry holding the closing text. Example, posting to a channel: @cemit Staff=Job %0 is done.}
      ON`CANCEL: |-
        @@ {Runs after a job in this bucket is canceled. %0: job number. %1: objid of whoever canceled it. %2: objid of whoever filed it. %3: number of the entry holding the closing text. Example: @pemit %2=Job %0 is canceled.}
      ON`REOPEN: |-
        @@ {Runs after a closed job in this bucket opens again. %0: job number. %1: objid of whoever reopened it. %2: 1 when the filer reopened it by replying, 0 when staff did. Example: @if %2=@cemit Staff=Job %0 was reopened by its filer.}
      ON`TRANSFER: |-
        @@ {Runs on both buckets after a job moves between them. %0: job number. %1: objid of whoever moved it. %2: objid of the old bucket. %3: objid of the new bucket. Example: @pemit [job(%0,filer)]=Job %0 moved to [name(%3)].}
      ON`DUE: |-
        @@ {Runs after a job's due date in this bucket changes. %0: job number. %1: objid of whoever changed it. %2: the old due date, in seconds, or empty. %3: the new one, or empty. Example: @if strlen(%3)=@pemit %1=Job %0 is due [convsecs(%3)].}
      ON`PRIORITY: |-
        @@ {Runs after a job's priority in this bucket changes. %0: job number. %1: objid of whoever changed it. %2: the old priority. %3: the new one: low, normal or high. Example: @if strmatch(%3,high)=@cemit Staff=Job %0 is now high priority.}
      ON`OVERDUE: |-
        @@ {Runs once when a job in this bucket passes its due date while waiting on staff. %0: job number. %1: empty, since nobody acted. %2: the due date, in seconds. Example, telling the job's handlers: @dolist [job(%0,handlers)]=@pemit ##=Job %0 is overdue.}
      ON`DELETE: |-
        @@ {Runs after a job in this bucket is deleted. %0: job number. %1: objid of whoever deleted it. %2: the job's title. Example: @cemit Staff=Job %0 was deleted by [name(%1)].}


        think setq(gone_slug,get(%q<bucket_object>/SLUG)); @role/delete job-admin-%q<gone_slug>; @permission/undefine softcode.jobs.%q<gone_slug>; @tel %q<bucket_object>={{jobs}}; @nuke %q<bucket_object>
      # Bucket %0, being deleted: moves the next batch of its jobs, and deletes it once none are left.
      # Whoever deleted it hears when it is gone.
      TRIG`BUCKET`DRAIN: |-
        @assert cand(isdbref(%0),strlen(get(%0/DELETING`TO))); think setqm(bucket_object,%0,
        target_bucket,get(%0/DELETING`TO),
        actor,get(%0/DELETING`BY),
        bucket_name,name(%0),
        move_batch,get({{jobs}}/DATA`CONFIG`MOVE-BATCH),
        move_jobs,u({{jobs}}/FUN`SELECT`JOBS,%q<actor>,INBUCKET,%0)); @assert isdbref(%q<target_bucket>)={&DELETING`TO %0; @pemit %q<actor>=notice(JOBS,Stopped deleting bucket %q<bucket_name>: the bucket its jobs were moving to is gone. It takes no new jobs. Delete it again to move the rest.,warn)}; @dolist/inline extract(%q<move_jobs>,1,%q<move_batch>)={think setq(job_object,##); @include/args {{jobs}}/INC`DO`TRANSFER=bucket,%q<target_bucket>}; @break gt(words(%q<move_jobs>),%q<move_batch>)=@trigger {{jobs}}/TRIG`BUCKET`DRAIN=%0; think setqm(drain_moved,get(%0/DELETING`MOVED),
        drain_target_name,name(%q<target_bucket>)); @include {{jobs}}/INC`DO`BUCKET`GONE; @pemit %q<actor>=notice(JOBS,Bucket %q<bucket_name> is deleted\, with its role and permission. [u({{jobs}}/FUN`TEXT`JOBCOUNT,%q<drain_moved>)] moved to %q<drain_target_name>.,ok)

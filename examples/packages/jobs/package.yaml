      # ---- portal -----------------------------------------------------------------
      # The jobs-app package shows these at /apps/jobs. The routes on the HTTP handler (below) hand
      # over %q<viewer>, the character the portal signed in as, and run WEB`DATA and WEB`ACT here with
      # @force, so writes run as this object and their "Set." lines never reach the response.
      # Schemas and data are JSON built with json(); lists of JSON values go to WEB`ARR %r-separated,
      # since a row holds spaces and commas but never a line break.
      # A JSON array of the %r-separated JSON values in %0.
      WEB`ARR: |-
        [if(strlen(%0),json_array(%0,%r),json_array())]
      # An empty JSON object.
      WEB`EMPTY: |-
        [chr(123)][chr(125)]
      WEB`B: |-
        [json(boolean,if(t(%0),true,false))]
      # One datum: JSON value %0, shown when %1 is true.
      WEB`V: |-
        [json(object,value,if(t(%1),%0,json(string,)),visible,u({{jobs}}/WEB`B,%1))]
      # Field %0 of the posted JSON in %q<body>, unquoted.
      WEB`GET: |-
        [setq(_g,json_query(%q<body>,get,%0))][if(strmatch(%q<_g>,"*),json_query(%q<_g>,unescape),%q<_g>)]
      # Whether %0 works any bucket.
      WEB`STAFF: |-
        [t(words(squish(iter(lcon({{buckets}}),if(u({{jobs}}/FUN`CAN`WORK,%i0,%0),%i0)))))]
      # A schema document: kind %0, title %1, sections %2 (%r-separated), actions object %3.
      WEB`DOC: |-
        [json(object,kind,json(string,%0),schema_version,json(number,1),title,json(string,%1),pages,json(array,json(object,key,json(string,main),title,json(string,%1),order,json(number,1),sections,u({{jobs}}/WEB`ARR,%2))),actions,firstof(%3,u({{jobs}}/WEB`EMPTY)))]
      # A section: name %0, order %1, elements %2 (%r-separated), %3 columns.
      WEB`SEC: |-
        [json(object,name,json(string,%0),order,json(number,%1),columns,json(number,firstof(%3,1)),elements,u({{jobs}}/WEB`ARR,%2))]
      WEB`MD: |-
        [json(object,kind,json(string,markdown),value,json(string,%0))]
      # A button posting values %1 (a JSON object) to the act action: label %0, color %2, and %3 a question asked first.
      WEB`BTN: |-
        [json(object,kind,json(string,button),label,json(string,%0),action,json(string,act),values,%1,color,json(string,firstof(%2,secondary)),variant,json(string,if(strmatch(%2,primary),filled,outlined)),confirm,json(string,%3))]
      WEB`ACTION: |-
        [json(object,transport,json(string,http),method,json(string,POST),route,json(string,/http/jobs/act),payload,json(string,fields),on_success,json(object,reset_fields,json(boolean,true)),on_error,json(object,bind_field_errors,json(boolean,true)))]
      WEB`OPT: |-
        [json(object,value,json(string,%0),label,json(string,%1))]
      WEB`ERR: |-
        [json(object,ok,json(boolean,false),errors,json(object,_global,json(string,%0)))]
      # An error shown on field %0.
      WEB`ERRF: |-
        [json(object,ok,json(boolean,false),errors,json(object,%0,json(string,%1)))]
      WEB`GO: |-
        [json(object,ok,json(boolean,true),redirect,json(string,%0))]
      # After a change to job %q<n>: message %0, the reply box emptied, and the page drawn again.
      WEB`DONE: |-
        [json(object,ok,json(boolean,true),message,json(string,%0),fields,u({{jobs}}/WEB`EMPTY),schema,u({{jobs}}/WEB`SCHEMA`JOB,%q<viewer>,%q<n>),data,u({{jobs}}/WEB`DATA`JOB,%q<viewer>,%q<n>))]

      # schemas: GET /http/jobs/schema?at=<path>[&filter=<filter>|&bucket=<slug>]
      # Viewer %0, sub-path %1: the queue (filter %2 or bucket %3), new, a job number, buckets, or buckets/<slug>.
      WEB`SCHEMA: |-
        [switch(1,not(strlen(%0)),u({{jobs}}/WEB`SCHEMA`ANON),isint(%1),u({{jobs}}/WEB`SCHEMA`JOB,%0,%1),strmatch(%1,new),u({{jobs}}/WEB`SCHEMA`NEW,%0),strmatch(%1,buckets),u({{jobs}}/WEB`SCHEMA`BUCKETS,%0),strmatch(%1,buckets/*),u({{jobs}}/WEB`SCHEMA`BUCKET,%0,after(%1,/)),u({{jobs}}/WEB`SCHEMA`QUEUE,%0,%2,%3))]
      WEB`SCHEMA`ANON: |-

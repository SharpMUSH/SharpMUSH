        @assert strlen(%q<fb>)=@pemit %#=There is no such bucket. +buckets lists them.; @assert cand(u({{jobs}}/FUN`CAN`FILE,%q<fb>,%#),cor(not(t(get(%q<fb>/HIDDEN))),u({{jobs}}/FUN`CAN`WORK,%q<fb>,%#)))=@pemit %#=You can't file in [name(%q<fb>)].; @assert strlen(%q<title>)=@pemit %#=Give it a title: +request <title>=<text>; @assert lte(strlen(%q<title>),80)=@pemit %#=Keep the title to 80 characters. The rest goes after the =.; @assert strlen(%q<text>)=@pemit %#=Say what you need after the =.; think [setq(actor,objid(%#))][setq(how,command)][setq(author,)][setq(prio,)]; @include {{jobs}}/INC`DO`FILE; @pemit %#=Filed job %q<n> in [name(%q<fb>)]: %q<title>. +job %q<n> shows it.

      # ---- writes, shared with the portal routes and the API -------------------
      # Each takes registers, never arguments, so text with commas in it arrives whole. %q<actor> is
      # who acted (an objid), %q<jo> the job. They write, tell the people involved, and queue the
      # bucket's hook last, so a slow hook never holds up the command or the portal.

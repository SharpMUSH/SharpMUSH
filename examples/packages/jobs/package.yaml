      FORM`FILE: |-
        @include {{jobs}}/FORM`VALIDATE; @assert strmatch(json_query(%q<appdraft_result>,get,ok),true); think setqm(actor,%<draft_actor>,actor_key,u({{jobs}}/FUN`PERSON`KEY,%<draft_actor>),text_format,if(strmatch(u({{jobs}}/FORM`VALUE,%<draft_fields>,softcode),true),softcode,markdown)); @include/args {{jobs}}/INC`DO`FILE=filer,%<draft_actor>,author,,priority,,bucket,%q<file_bucket>,title,u({{jobs}}/FORM`VALUE,%<draft_fields>,title),text,u({{jobs}}/FORM`VALUE,%<draft_fields>,text),format,%q<text_format>,how,application; think setq(appdraft_result,json(object,ok,json(boolean,true),message,json(string,Filed job %q<job_number>.),redirect,json(string,/apps/jobs/%q<job_number>)))
      INC`DRAFT: |-
        think setqm(draft_action,lcstr(first(%q<cmd_argument>)),draft_payload,json(object)); @if strmatch(%q<draft_action>,new)={think setq(draft_payload,json(object,bucket,json(string,get({{jobs}}/DATA`CONFIG`DEFAULT-BUCKET))))}; @if strmatch(%q<draft_action>,set)={think setqm(draft_field,trim(rest(%q<cmd_left_side>)),draft_payload,if(%q<cmd_has_equals>,json(object,%q<draft_field>,if(cand(match(boolean number list multiselect,u({{jobs}}/FORM`VALUE,u({{jobs}}/FORM`FIELD,%q<draft_field>),type)),isjson(%q<cmd_right_side>)),%q<cmd_right_side>,json(string,%q<cmd_right_side>))),json(null)))}; @appdraft/show {{jobs}}/FORM=%q<draft_action>,%q<draft_payload>
      FORM`DISPLAY: |-
        if(strmatch(json_query(%0,get,ok),true),if(strlen(u({{jobs}}/FORM`VALUE,%0,message)),u({{jobs}}/FORM`VALUE,%0,message),box(iter(lnum(0,dec(json_query(get({{jobs}}/FORM),size))),u({{jobs}}/FORM`VALUE,json_query(get({{jobs}}/FORM),get,%i0),label): [u({{jobs}}/FORM`VALUE,json_query(%0,get,fields),u({{jobs}}/FORM`VALUE,json_query(get({{jobs}}/FORM),get,%i0),key))],%b,%r)%r%r+request/draft set <field>=<literal text>%r+request/draft review | back | file | cancel)),json_query(%0,get,errors))
      WEB`DRAFT`DATA: |-
        json(object,fields,fold({{jobs}}/WEB`JSON`MERGE,iter(lnum(0,dec(json_query(get({{jobs}}/FORM),size))),setq(form_key,u({{jobs}}/FORM`VALUE,json_query(get({{jobs}}/FORM),get,%i0),key))[if(json_query(%0,exists,%q<form_key>),json(object,%q<form_key>,u({{jobs}}/WEB`JSON`VALUE,json_query(%0,get,%q<form_key>),1)),json(object))],%b,%r),json(object),%r))
      WEB`DRAFT`REVIEW: |-
        u({{jobs}}/WEB`ELEMENT`DOCUMENT,view,Review request,u({{jobs}}/WEB`ELEMENT`SECTION,,1,iter(lnum(0,dec(json_query(get({{jobs}}/FORM),size))),json_query(get({{jobs}}/FORM),get,%i0),%b,%r)%r[u({{jobs}}/WEB`ELEMENT`BUTTON,Back,lit({"op":"draftback"}))]%r[u({{jobs}}/WEB`ELEMENT`BUTTON,File,json(object,op,json(string,draftfile),operation_id,json(string,%0)),primary)]%r[u({{jobs}}/WEB`ELEMENT`BUTTON,Cancel,lit({"op":"draftcancel"}))]),json(object,act,u({{jobs}}/WEB`ACTION`KEEP)))
      WEB`DRAFT`ANSWER: |-
        json_mod(%0,patch,json(object,schema,if(strmatch(u({{jobs}}/FORM`VALUE,%0,phase),review),u({{jobs}}/WEB`DRAFT`REVIEW,u({{jobs}}/FORM`VALUE,%0,operation_id)),u({{jobs}}/WEB`SCHEMA`NEW,%1)),data,if(strlen(json_query(%0,get,fields)),u({{jobs}}/WEB`DRAFT`DATA,json_query(%0,get,fields)),json(null))))
      WEB`ACT`DRAFTREVIEW: |-
        @appdraft {{jobs}}/FORM=review,%q<web_body>; think setq(web_answer,u({{jobs}}/WEB`DRAFT`ANSWER,%q<appdraft_result>,%<viewer>))
      WEB`ACT`DRAFTBACK: |-
        @appdraft {{jobs}}/FORM=back,json(object); think setq(web_answer,u({{jobs}}/WEB`DRAFT`ANSWER,%q<appdraft_result>,%<viewer>))
      WEB`ACT`DRAFTFILE: |-
        @appdraft {{jobs}}/FORM=file,%q<web_body>; think setq(web_answer,if(strmatch(json_query(%q<appdraft_result>,get,ok),true),%q<appdraft_result>,u({{jobs}}/WEB`DRAFT`ANSWER,%q<appdraft_result>,%<viewer>)))
      WEB`ACT`DRAFTCANCEL: |-
        @appdraft {{jobs}}/FORM=cancel,json(object); think setq(web_answer,if(strmatch(json_query(%q<appdraft_result>,get,ok),true),u({{jobs}}/WEB`ANSWER`REDIRECT,/apps/jobs),%q<appdraft_result>))

      # ---- portal -----------------------------------------------------------------
      # The jobs-app package shows these at /apps/jobs. The routes on the HTTP handler (below) hand
      # over %<viewer>, the character the portal signed in as, and run WEB`DATA`ROUTE and WEB`ACT`ROUTE here with
      # @force, so writes run as this object and their "Set." lines never reach the response. The
      # routes and what they @include read %<viewer>; a u() function gets the viewer as an argument.
      # Schemas and data are JSON built with json(), or lit() where the shape is fixed; lists of JSON values go
      # to WEB`JSON`ARRAY %r-separated, since a row holds spaces and commas but never a line break.
      # A JSON array of the %r-separated JSON values in %0.
      WEB`JSON`ARRAY: |-
        if(strlen(%0),json_array(%0,%r),json_array())
      # An empty JSON object.
      WEB`JSON`EMPTY: |-
        json(object)
      # JSON object %0 with object %1's members added after its own, for fold().
      WEB`JSON`MERGE: |-
        json_mod(%0,patch,%1)
      WEB`JSON`BOOLEAN: |-
        json(boolean,if(%0,true,false))
      # One datum: JSON value %0, shown when %1 is true.
      WEB`JSON`VALUE: |-
        json(object,value,if(%1,%0,json(string,)),visible,u({{jobs}}/WEB`JSON`BOOLEAN,%1))
      # Field %0 of the posted JSON in %q<web_body>, unquoted.
      WEB`POSTED`FIELD: |-
        setq(posted_raw,json_query(%q<web_body>,get,%0))[if(strmatch(%q<posted_raw>,"*),json_query(%q<posted_raw>,unescape),%q<posted_raw>)]
      # Whether %0 works any bucket.
      FUN`IS`STAFF: |-
        t(words(squish(iter(lcon({{buckets}}),if(u({{jobs}}/FUN`CAN`WORK,%i0,%0),%i0)))))
      # A schema document: kind %0, title %1, sections %2 (%r-separated), actions object %3.
      WEB`ELEMENT`DOCUMENT: |-
        json_fill(get({{jobs}}/DATA`WEB`DOCUMENT),/kind,%0,/title,%1,/pages/0/title,%1,/pages/0/sections,u({{jobs}}/WEB`JSON`ARRAY,%2),/actions,firstof(%3,u({{jobs}}/WEB`JSON`EMPTY)))
      # WEB`ELEMENT`DOCUMENT's template: json_fill() puts the kind, title, sections and actions into it.
      DATA`WEB`DOCUMENT: |-
        {"kind":"","schema_version":1,"title":"","pages":[{"key":"main","title":"","order":1,"sections":[]}],"actions":{}}
      # A section: name %0, order %1, elements %2 (%r-separated), %3 columns.
      WEB`ELEMENT`SECTION: |-
        json(object,name,json(string,%0),order,json(number,%1),columns,json(number,firstof(%3,1)),elements,u({{jobs}}/WEB`JSON`ARRAY,%2))
      WEB`ELEMENT`MARKDOWN: |-
        json(object,kind,json(string,markdown),value,json(string,%0))
      # A button posting values %1 (a JSON object) to the act action: label %0, color %2, and %3 a question asked first.
      WEB`ELEMENT`BUTTON: |-
        json(object,kind,json(string,button),label,json(string,%0),action,json(string,act),values,%1,color,json(string,firstof(%2,secondary)),variant,json(string,if(strmatch(%2,primary),filled,outlined)),confirm,json(string,%3))
      WEB`ACTION`RESET: |-
        get({{jobs}}/DATA`WEB`ACTION`RESET)
      # The act action, as JSON.
      DATA`WEB`ACTION`RESET: |-
        {"transport":"http","method":"POST","route":"/http/jobs/act","payload":"fields","on_success":{"reset_fields":true},"on_error":{"bind_field_errors":true}}
      WEB`ELEMENT`OPTION: |-
        json(object,value,json(string,%0),label,json(string,%1))
      WEB`ANSWER`ERROR: |-
        json(object,ok,json(boolean,false),errors,json(object,_global,json(string,%0)))
      # An error shown on field %0.
      WEB`ANSWER`FIELDERROR: |-
        json(object,ok,json(boolean,false),errors,json(object,%0,json(string,%1)))
      WEB`ANSWER`REDIRECT: |-
        json(object,ok,json(boolean,true),redirect,json(string,%0))
      # After a change to job %q<job_number>: message %0, the reply box emptied, and the page drawn again for viewer %1.
      WEB`ANSWER`JOB: |-
        json(object,ok,json(boolean,true),message,json(string,%0),fields,u({{jobs}}/WEB`JSON`EMPTY),schema,u({{jobs}}/WEB`SCHEMA`JOB,%1,%q<job_number>),data,u({{jobs}}/WEB`DATA`JOB,%1,%q<job_number>))

      # schemas: GET /http/jobs/schema?at=<path>[&filter=<filter>|&bucket=<slug>]
      # %<viewer>, sub-path %<at>: the queue (%<filter> or the bucket whose slug is %<bucket>), new, a job

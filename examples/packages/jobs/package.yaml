        wait_turnaround,firstof(get(%0/TURNAROUND),0))[switch(1,cand(get(%0/AUDIT),not(%1)),at once,isint(%q<wait_answer>),u({{jobs}}/FUN`TIME`DURATION,%q<wait_answer>),gt(%q<wait_turnaround>,0),within %q<wait_turnaround> day[if(neq(%q<wait_turnaround>,1),s)],)]
      FUN`WAIT`TEXT: |-
        capstr(u({{jobs}}/FUN`WAIT`SHORT,%0,1))

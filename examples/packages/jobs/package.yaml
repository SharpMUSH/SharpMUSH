  # ---- portal routes ------------------------------------------------------------------
  # Routes on the HTTP handler, as children of http-handler's GET and POST verbs. The portal's jobs
  # application (the jobs-app package) reads /http/jobs/schema and /http/jobs/data with ?at= set to
  # the address after /apps/jobs/, reads its sidebar from /http/jobs/nav, and posts its buttons to
  # /http/jobs/act. %<viewer> is the character the portal signed in as. The handler must be WIZARD (the
  # seeded one is) to @force the Jobs object, which does the work so its "Set." lines never land in the
  # response; the forced @include names the viewer itself rather than counting on the forced command
  # seeing the route's own arguments. The posted JSON is read all through an action (WEB`POSTED`FIELD), so
  # POST`JOBS`ACT puts %<body> in %q<web_body>: a forced command's arguments lose a value's outer braces.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`JOBS`SCHEMA: |-
        @respond/type application/json; think uargs({{jobs}}/WEB`SCHEMA`ROUTE,viewer,%<viewer>,at,%q<form.at>,filter,%q<form.filter>,bucket,%q<form.bucket>)
      GET`JOBS`NAV: |-
        @respond/type application/json; think u({{jobs}}/WEB`NAV`ROUTE,%<viewer>)
      GET`JOBS`DATA: |-
        @force {{jobs}}=@include/args/nobreak {{jobs}}/WEB`DATA`ROUTE=viewer,%<viewer>; @respond/type application/json; think %q<web_answer>
      POST`JOBS`ACT: |-
        think setq(web_body,%<body>); @force {{jobs}}=@include/args/nobreak {{jobs}}/WEB`ACT`ROUTE=viewer,%<viewer>; @respond/type application/json; think %q<web_answer>

  # Each login, handed to the Jobs object to tell the player what waits (TRIG`CONNECT there).
  - ref: login_events
    target: "{{$event_handler}}"
    attributes:
      PLAYER`CONNECT`JOBS: |-
        @trigger/args {{jobs}}/TRIG`CONNECT=player,%<objid>

  # A report of a profile gallery image, sent from the web portal's image viewer: jobs' subscription to
  # the GALLERY`REPORT event, beside any other package's. The portal offers Report only while the event
  # handler answers that event. It hands the report to the Jobs object,
  # which files it (TRIG`GALLERY`REPORT there): INC`API`FILE finds the job store through the Jobs object's
  # own references, so it must run as Jobs, not as the handler.
  - ref: gallery_reports
    target: "{{$event_handler}}"
    attributes:
      GALLERY`REPORT`JOBS: |-
        @trigger/args {{jobs}}/TRIG`GALLERY`REPORT=reporter,%#,objid,%<objid>,url,%<url>,caption,%<caption>,reason,%<reason>

  # ---- help storage -------------------------------------------------------------------
  # A plain thing, not the WIZARD Jobs object: the librarian cannot u() a privileged object's
  # attributes. Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: jobs_help
    type: thing
    name: Jobs Help
    location: "{{jobs}}"
    attributes:
      HELP: |-
        Jobs: asking staff for things, and the queue staff work.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree.
      SEE`JOBS: |-
        request|jobs staff|jobs format|buckets|jobs checklist
      SEE`REQUEST: |-
        jobs|jobs format
      SEE`JOBS`STAFF: |-
        jobs commands|buckets|jobs audit|jobs checklist
      SEE`JOBS`HOOKS: |-
        buckets|jobs api
      SEE`BUCKETS: |-
        jobs roles|jobs hooks|jobs audit|jobs checklist
      SEE`JOBS`ROLES: |-
        buckets
      HELP`JOBS: |-
        Jobs are how you ask staff for something and how staff keep track of it: an application, a
        room fix, a bug, a plot idea. Each job lives in a **bucket**, and each has a running conversation.

        ## Whose turn it is

        A job is always waiting on someone:

        - **New**: just filed, nobody has picked it up.
        - **With staff**: staff owe the next answer.
        - **Waiting on you**: staff answered and are waiting for your reply.
        - **On hold**: parked on purpose.
        - **Closed**: approved, denied, completed or canceled.

        Replying passes the turn. When you reply to a job closed a short while ago, it opens again.

        ## After you file

        - Most buckets answer at once with a first reply saying how soon staff usually answer there. That
          is measured from the bucket's last few jobs; until there are enough, it is the bucket's turnaround.
        - A bucket can approve some requests as soon as they are filed. Staff look them over afterwards and
          can undo one, saying why.
        - Staff may leave an **Update** on the job: one line saying where it stands.
        - A bucket can give each job a **checklist**, such as the steps an application goes through. `+job <#>`
          shows which are done.

        ## Commands

        - `+request <title>=<text>`: ask staff for something. `+request Building/Broken exit=...` files in a bucket by name.
        - `+jobs`: your open jobs, and for staff, what needs them.
        - `+job <#>`: read one. `+job/reply <#>=<text>` answers it.

        `+job`, `+jobs`, `+myjob`, `+myjobs`, `+ticket` and `+tickets` are the same command, so use the one you know.
      HELP`REQUEST: |-
        ## Filing

        - `+request/draft new`: start an optional draft on this connection; ordinary chat still works.
        - `+request/draft set <field>=<literal text>`: edit a declared field. Text stays literal; boolean, number and list fields accept JSON literals.
        - `+request/draft review`, `back`, `file`, `cancel`: review, return to edits, file once, or discard.
          Drafts expire after 30 idle minutes and retire on logout/disconnect; they do not survive restart.
        - `+request <title>=<text>`: files in the Requests bucket.
        - `+request <bucket>/<title>=<text>`: files in a bucket by its full name, such as `+request Applications/Ready for review=...`. The part before the `/` is a bucket only when it is a bucket's whole name, so `+request Help w/ exits=...` is just a title.
        - `+bug`, `+typo`, `+pitch` and `+apply <title>=<text>` file in Bugs, Building, Plots and Applications.
        - `+buckets` lists the buckets you can file in.

        ## Following up

        - `+jobs`: your open jobs. A `*` marks something new.
        - `+jobs/old`: your closed jobs.
        - `+job <#>`: read one.
        - A list longer than your screen comes in pages, and the page is a last switch: `+jobs/old/2`.
        - `+job/reply <#>=<text>`: answer. Within a few days of a job closing, a reply opens it again.
        - `+job/scene <#>=<scene>`: attach the log of a scene you were in, when a checklist asks for one. It
          shows only on games that keep scene logs.
        - `+job/cancel <#>`: withdraw a job you filed.
        - `+job/addhelper <#>=<player>`: let someone else read and answer it. `+job/remhelper <#>=<player>` takes it back; a helper can remove themselves.
        - `+jobs/catchup`: mark everything read.
        - `+job/options mail=off`: stop the @mail copies of staff replies.

        Messages are markdown. Add `/softcode` to show yours exactly as typed: see \[jobs format\].
      HELP`JOBS`STAFF: |-
        ## The queue

        `+jobs` opens on what needs staff in the buckets you work, oldest wait first and high priority on
        top, followed by your own open jobs. A job waiting on its player is never overdue, because the due
        date only counts while it is staff's turn.

        - `+jobs <bucket>`: one bucket. `+jobs/all`: everything open.
        - `+jobs/new`, `/mine`, `/overdue`, `/player`, `/held`.
        - `+jobs/who <player>` \(jobs they handle\), `/from <player>` \(jobs they filed\), `/search <text>`.
        - `+job/old \[<bucket>\]`: closed jobs.
        - `+job/next` reads the next unread job, `+job/scan` lists them, `+job/brief` counts.
        - Every list comes in pages when it outgrows your screen, and the page is a last switch:
          `+jobs/2`, `+jobs/new/2`, `+job/old/3 Requests`.

        ## Working a job

        - `+job <#>`, `+job/all <#>` \(with the log\), `+job/last <#>=<n>`.
        - `+job/reply <#>=<text>`: the player sees it, and it becomes their turn.
        - `+job/note <#>=<text>` \(or `/add`, `/comment`\): staff only.
        - `+job/claim <#>`, `/unclaim`, `/assign <#>=<players and +roles>`.
        - `+job/watch <#>` \(or `/tag`\): hear about every change without handling it.
        - `+job/approve`, `/deny`, `/complete`, `/cancel <#>\[=<text>\]`; `+job/reopen <#>`.
        - `+job/due <#>=+3d`, `+job/priority <#>=high`, `+job/trans <#>=<bucket>`.
        - `+job/status <#>=<text>`: the **Update** line the player reads on the job. Empty clears it.
        - `+job/check <#>=<step>` and `/uncheck`: tick a checklist step, or untick it. See \[jobs checklist\].
        - `+jobs/audit`, `+job/audit <#>`, `+job/revert <#>=<why>`: approvals made at once. See \[jobs audit\].

        Every switch is in \[jobs commands\].
      HELP`JOBS`COMMANDS: |-
        Every `+job` switch, with the AnomalyJobs and Volund spellings it also takes. `<#>` is a job number.

        | Switch | What it does |
        |---|---|
        | \(none\) | `+jobs` lists; `+job <#>` reads; `+jobs <bucket>` lists a bucket |
        | `/list <bucket>` | one bucket's open jobs |
        | `/all` | every open job; `/all <#>` reads one with its log |
        | `/mine` `/new` `/overdue` `/player` `/held` | lists |
        | `/who <player>` `/from <player>` `/search <text>` `/old \[<bucket>\]` | lists |
        | `/<page>` after any list's switches | that page of it: `+jobs/2`, `+job/old/3 <bucket>` |
        | `/next` `/scan` `/brief` `/catchup` | unread jobs |
        | `/last <#>=<n>` `/act <#>` | the last few messages; the log |
        | `/reply <#>=<text>` | public reply |
        | `/note`, `/add`, `/comment <#>=<text>` | staff-only note |
        | `/mail <#>=<text>` | public reply, mailed even to someone who turned mail off |
        | `/claim` `/unclaim <#>` | handle a job, or stop |
        | `/assign <#>=<names>` | set the handlers; `+<role>` assigns a role |
        | `/watch`, `/tag` and `/unwatch`, `/untag <#>` | follow a job |
        | `/addhelper` `/remhelper <#>=<player>` | someone who may read and answer it |
        | `/source <#>` | who filed it \(Job Admin\) |
        | `/state <#>=staff/player/held`, `/hold <#>` | whose turn it is |
        | `/approve` `/deny` `/complete` `/cancel <#>\[=<text>\]` | close it |
        | `/status <#>=<text>` | the one-line update the player reads; empty clears it |
        | `/check` `/uncheck <#>=<step>` | tick or untick a checklist step |
        | `/scene <#>=<scene>` | attach a scene log \(the filer, a helper or staff\) |
        | `/audit` | approvals made at once that nobody has checked |
        | `/audit <#>` `/revert <#>=<why>` | keep one, or undo it |
        | `/reopen`, `/revive <#>` | open it again |
        | `/delete <#>` | remove it \(Job Admin\) |
        | `/due <#>=<when>` | `+3d`, `+12h`, `+1w`, a date, or `none` |
        | `/priority`, `/esc <#>=<level>` | low, normal, high \(green, yellow, red\) |
        | `/name <#>=<title>` | retitle |
        | `/trans`, `/bucket <#>=<bucket>` | move to another bucket |
        | `/merge <from>=<into>` | fold one job into another |
        | `/edit <#>/<entry>=<old>/<new>` | fix your own message |
        | `/format <#>/<entry>=markdown/softcode` | how a message shows |
        | `/create <bucket>/<title>=<text>` | staff open a job |
        | `/query <player>/<title>=<text>` | ask a player something |
        | `/options mail=on/off` | job mail |

        A switch can be shortened to any start that only it has: `/rep` is `/reply`, and `/soft` is `/softcode`.

        Checkout, job locks and progress percentages are not kept: handlers and states say the same.
      HELP`JOBS`FORMAT: |-
        Every message, the one a job is filed with and every reply and note, shows as **markdown**:
        `**bold**`, `*italic*`, lists, links and code. `%%r` starts a new line, as everywhere else.

        Nothing anyone writes in a job is evaluated, so brackets and percent signs are safe.

        ## Softcode view

        Some text has to stay exactly as typed: code, `examine` output, anything full of brackets and
        backticks. Add `/softcode` to the command that writes it and it shows as typed, with nothing rendered:

        - `+request/softcode <title>=<text>`, `+bug/softcode ...`
        - `+job/reply/softcode <#>=<text>`, `+job/note/softcode ...`, `+job/approve/softcode ...`

        `/markdown` is what no switch means.

        ## Changing one later

        `+job/format <#>/<entry>=softcode` or `=markdown` changes how one message shows; its text is
        untouched. Its author or staff who work the bucket can do it. `+job <#>` numbers the messages.
      HELP`BUCKETS: |-
        A **bucket** groups jobs of one kind and says who works them. The game starts with:

        | Bucket | For |
        |---|---|
        | Applications | character applications |
        | Requests | anything else you need from staff; where `+request` goes |
        | Building | rooms, objects, typos \(`+typo`\) |
        | Bugs | code and server problems \(`+bug`\) |
        | Plots | plot and scene proposals \(`+pitch`\) |
        | Feedback | suggestions and complaints; staff do not see who sent them |
        | Staff | staff-only work, hidden from players |

        A bucket is always named by its full name, in any case.

        ## Looking

        - `+buckets`: the buckets you can see, with their open jobs.
        - `+bucket <name>`: what it is for and how it treats a job. Those who work it also see its locks, role and the hooks it runs.

        ## Settings

        `+bucket/set <bucket>/<setting>=<value>`, by a Job Admin or someone who works the bucket:

        - `description`
        - `turnaround`: days to answer a new job before it is overdue; 0 for none
        - `reopen`: days after closing in which the filer's reply opens a job again; 0 for never
        - `anonymous`: `none`, `filer` \(staff do not see who filed\), or `staff` \(players do not see staff names\)
        - `hidden`: `yes` shows the bucket only to those who work it
        - `priority`: what new jobs start at
        - `keep`: days a closed job stays; empty keeps them
        - `acknowledge`: the first reply every new job gets at once, followed by how soon the bucket usually answers. Empty sends none.
        - `checklist`: the steps every new job here gets, separated by `|`. Start a step with `scene:` to ask for a scene log. See \[jobs checklist\].
        - `audit`: `yes` approves a job as soon as it is filed and checks it later. See \[jobs audit\].

        ## How soon

        `+bucket <name>` shows **First answer**, the middle of how long the bucket's last jobs waited for
        staff's first reply, and **Closed in**, the same for closing them. Each counts the last 25 jobs, once
        there are 3; `+config jobs/wait-sample` changes how many. Jobs filed by staff, `/query` jobs and
        approvals made at once are left out. Until a bucket has measured enough, players are told its
        turnaround instead.

        ## Making and removing

        Job Admin only:

        - `+bucket/create <name>=<description>`: makes the bucket, its permission `softcode.jobs.<name>` and its role `job-admin-<name>`.
        - `+bucket/rename <bucket>=<new name>`: its permission and role keep their names.
        - `+bucket/disable <bucket>`: nothing new is filed in it or moved into it. Its jobs stay and are worked as before. `+bucket/enable <bucket>` takes new jobs again.
        - `+bucket/delete <bucket>`: an empty bucket. Its role and permission go with it.
        - `+bucket/delete <bucket>=<other bucket>`: moves its jobs, open and closed, to the other bucket first. A bucket with more jobs than `+config jobs/move-batch` \(10 at first\) stops taking new ones and moves them that many at a time; it is deleted, and you are told, once the last has moved.
        - `+bucket/lock <bucket>/file=<lock>`, `/work=<lock>` and `/audit=<lock>`: who may file, who works it, and whose jobs it approves at once when `audit` is on. They are ordinary locks.

        The bucket `+request` files in can be neither disabled nor deleted. Renaming it keeps `+request` filing there. `+config jobs/default-bucket` points `+request` at another bucket, and `+config jobs` lists the buckets `+bug`, `+typo`, `+pitch`, `+apply` and gallery reports file in.

        The portal's **Bucket settings** page does the same: **New bucket** under the list, and **Manage** on each bucket's page.
      HELP`JOBS`ROLES: |-
        Who works which jobs comes from permissions, held through roles:

        | Permission | Lets you |
        |---|---|
        | `softcode.jobs.admin` | work every bucket, delete jobs, and create and change buckets |
        | `softcode.jobs.<bucket>` | work one bucket's jobs and change its settings |

        The package brings a role for each:

        - `job-admin` \(**Job Admin**\) allows `softcode.jobs.admin`.
        - `job-admin-applications` \(**Job Admin - Applications**\) allows `softcode.jobs.applications`, and so on for every bucket.

        Give someone a bucket with `@role/assign <player>=job-admin-applications`. A role of your own
        can allow the same permission: `@role/allow helper=softcode.jobs.requests`.

        The `wizard` and `royalty` roles hold `softcode.jobs.admin`. Nobody else holds these until
        something allows them.

        A bucket's **work lock** is what is actually checked: by default
        `perm^softcode.jobs.admin|perm^softcode.jobs.<bucket>`. Change it with `+bucket/lock` to add
        anything a lock can test.
      HELP`JOBS`HOOKS: |-
        A bucket runs code when its jobs change. Every bucket has one attribute per event, `` ON`<EVENT> ``,
        which starts out as a comment naming its arguments, with an example. Replace the comment with code
        and it runs, queued, after the change is written.

        Each argument comes both by name and by position: %%\\<job> is %%0, so a hook written for either reads
        the same values: `help named arguments` says more.

        The code runs **as the bucket**, so it can do only what the bucket may. Give the bucket what a hook
        needs with `@permission/allow <bucket>=<permission>` or `@role/assign <bucket>=<role>`. Only the
        bucket's controllers can write its hooks. `+bucket/set` never changes them, so a bucket admin
        cannot write code that runs with the bucket's privileges.

        - `` ON`FILE ``: Runs after a job is filed in this bucket. %%\\<job> \(%%0\): job number. %%\\<filer> \(%%1\): objid of whoever filed it. %%\\<title> \(%%2\): the job's title. %%\\<how> \(%%3\): how it was filed: command, query, portal or api.
        - `` ON`REPLY ``: Runs after someone writes on a job in this bucket. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of the writer. %%\\<entry> \(%%2\): number of the new entry. %%\\<public> \(%%3\): 1 for a public reply, 0 for a staff-only note.
        - `` ON`CLAIM ``: Runs after a handler is added to or removed from a job in this bucket. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever did it. %%\\<handler> \(%%2\): the handler, an objid or role:\\<role>. %%\\<added> \(%%3\): 1 when added, 0 when removed.
        - `` ON`TURN ``: Runs after a job in this bucket changes whose turn it is. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever acted. %%\\<from> \(%%2\): the old state. %%\\<to> \(%%3\): the new state: new, staff, player or held.
        - `` ON`APPROVE ``: Runs after a job in this bucket is approved. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever approved it. %%\\<filer> \(%%2\): objid of whoever filed it. %%\\<entry> \(%%3\): number of the entry holding the approval text.
        - `` ON`DENY ``: Runs after a job in this bucket is denied. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever denied it. %%\\<filer> \(%%2\): objid of whoever filed it. %%\\<entry> \(%%3\): number of the entry holding the reason.
        - `` ON`COMPLETE ``: Runs after a job in this bucket is completed. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever completed it. %%\\<filer> \(%%2\): objid of whoever filed it. %%\\<entry> \(%%3\): number of the entry holding the closing text.
        - `` ON`CANCEL ``: Runs after a job in this bucket is canceled. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever canceled it. %%\\<filer> \(%%2\): objid of whoever filed it. %%\\<entry> \(%%3\): number of the entry holding the closing text.
        - `` ON`REOPEN ``: Runs after a closed job in this bucket opens again. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever reopened it. %%\\<byfiler> \(%%2\): 1 when the filer reopened it by replying, 0 when staff did.
        - `` ON`TRANSFER ``: Runs on both buckets after a job moves between them. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever moved it. %%\\<from> \(%%2\): objid of the old bucket. %%\\<to> \(%%3\): objid of the new bucket.
        - `` ON`DUE ``: Runs after a job's due date in this bucket changes. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever changed it. %%\\<old> \(%%2\): the old due date, in seconds, or empty. %%\\<new> \(%%3\): the new one, or empty.
        - `` ON`PRIORITY ``: Runs after a job's priority in this bucket changes. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever changed it. %%\\<old> \(%%2\): the old priority. %%\\<new> \(%%3\): the new one: low, normal or high.
        - `` ON`OVERDUE ``: Runs once when a job in this bucket passes its due date while waiting on staff. %%\\<job> \(%%0\): job number. %%1: empty, since nobody acted. %%\\<due> \(%%2\): the due date, in seconds.
        - `` ON`DELETE ``: Runs after a job in this bucket is deleted. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever deleted it. %%\\<title> \(%%2\): the job's title.
        - `` ON`CHECK ``: Runs after a checklist step is ticked or unticked, by staff or by attaching a scene log. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever did it. %%\\<step> \(%%2\): the step's number. %%\\<done> \(%%3\): 1 when ticked, 0 when unticked.
        - `` ON`REVERT ``: Runs after staff revert a job this bucket approved at once. %%\\<job> \(%%0\): job number. %%\\<actor> \(%%1\): objid of whoever reverted it. %%\\<filer> \(%%2\): objid of whoever filed it. %%\\<entry> \(%%3\): number of the entry holding the reason.

        `job\(%%<job>, <field>\)` reads the job from inside a hook: see \[jobs api\].

        ## Examples

        Grant the approved role when an application is approved. The bucket must hold `roles.admin` through a role ranked above `approved`, since nobody can manage a role at or above their own highest; \[jobs audit\] shows how:

        ```
        &ON`APPROVE Applications=@role/assign %%<filer>=approved; @pemit %%<filer>=Your application, job %%<job>, was approved.
        ```

        Tell a job's handlers when it goes overdue:

        ```
        &ON`OVERDUE Requests=@dolist \[job\(%%<job>,handlers\)\]=@pemit ##=Job %%<job> is overdue.
        ```

        Post completed bugs to a channel:

        ```
        &ON`COMPLETE Bugs=@cemit Staff=Bug %%<job> is fixed: \[job\(%%<job>,title\)\]
        ```

        Undo what an approval made at once did, in a bucket with `audit` on:

        ```
        &ON`REVERT Applications=@role/unassign %%<filer>=approved
        ```
      HELP`JOBS`API: |-
        ## Reading

        - `job\(<#>, <field>\)`: `number`, `bucket`, `title`, `state`, `outcome`, `priority`, `filer` \(empty when the bucket hides the filer, except to the filer, a Job Admin or the bucket's hooks\), `filed`, `due`, `updated`, `overdue`, `handlers`, `watchers`, `helpers`, `entries`, `update` \(the line players read\), `steps` and `done` \(how many checklist steps it has and has done\), `scenes` \(the scene logs attached\), `audit` \(`pending`, `passed` or `reverted` for an approval made at once\), `answered` \(when staff first replied, in seconds\), `turned` \(when the turn last passed between the filer and staff, in seconds\).
        - `jobs\(\[<bucket>\[, open/all/<state>\]\]\)`: job numbers, newest first.
        - `jobentries\(<#>\[, <viewer>\]\)`: the numbers of the messages `<viewer>` may read.

        They answer for jobs the calling object may see, for holders of `game.see_all`, and for a bucket's own hooks.

        ## Filing from other code

        From a wizard object, such as a chargen's submit command, run the API in place with the job's parts as named arguments. It leaves the new number in `%%q<job>`, empty when the job was refused:

        ```
        @trigger/inline/nobreak/args Jobs/INC`API`FILE=player,%%#,bucket,Applications,title,Application for %%n,text,\[v\(sheet\)\]; @pemit %%#=Filed as job %%q<job>.
        ```

        Text with commas in it arrives whole. Add `format,softcode` to show the text as typed. A refusal stops only the API, never the code that called it.

        - `` INC`API`REPLY `` and `` INC`API`NOTE `` take `job`, `actor` and `text` \(and `format`\): a public reply, or a staff note.
        - `` INC`API`CLOSE `` takes `job`, `actor`, `outcome` \(approved, denied, completed or canceled\) and, when there is one, the closing `text`.

        ## The portal

        The jobs-app package puts the same queue in the web portal at `/apps/jobs`, reading these jobs through the HTTP handler.

        A report of a profile gallery image, sent from the portal's image viewer, files a job in the Staff bucket as whoever reported it, with the image's address, its caption and the reason. `+config jobs/gallery-bucket=<bucket>` sends them elsewhere.
      HELP`JOBS`AUDIT: |-
        A bucket with `audit` on approves a job as soon as it is filed, and staff check it afterwards. Use
        it for requests that are almost always granted, where waiting costs more than the odd mistake.

        ```
        +bucket/set Building/audit=yes
        ```

        Filing in such a bucket closes the job as approved at once, by the bucket, and runs its
        `` ON`APPROVE `` hook the same way staff approving it would. The player is told it is approved and
        that staff look approvals over later.

        `+bucket/lock <bucket>/audit=<lock>` limits who gets it: anyone else's job waits for staff as
        usual. With no lock, everyone does.

        ## Checking

        - `+jobs/audit` lists the approvals nobody has checked yet, in the buckets you work. `+jobs`
          lists them too, as **Approved, to check**.
        - `+job/audit <#>`: the approval stands.
        - `+job/revert <#>=<why>`: undo it. The job shows **Reverted**, the reason goes to the player, and
          the bucket's `` ON`REVERT `` hook runs.

        ## Undoing

        Each bucket undoes its own approvals in `` ON`REVERT ``, since only it knows what `` ON`APPROVE ``
        did. A bucket that grants a role on approval takes it back:

        ```
        &ON`APPROVE Applications=@role/assign %%<filer>=approved
        &ON`REVERT Applications=@role/unassign %%<filer>=approved
        ```

        The hooks run as the bucket, so the bucket needs `roles.admin` through a role of its own, ranked
        above the role it grants:

        ```
        @role/create grants-approved=Jobs/Grants Approved
        @role/priority grants-approved=12
        @role/allow grants-approved=roles.admin
        @role/assign Applications=grants-approved
        ```

        A bucket with `audit` on and no `` ON`REVERT `` written can still be reverted; nothing is undone
        but the job's outcome.
      HELP`JOBS`CHECKLIST: |-
        A bucket can give every new job the same steps to go through, such as what staff check on an
        application:

        ```
        +bucket/set Applications/checklist=Sheet checked|Background read|scene:A log of a scene you played
        ```

        Each job keeps the checklist its bucket had when it was filed. `+job <#>` shows the steps, and
        which are done, by whom and when:

        ```
        1. [x] Sheet checked · God, Oct 15
        2. [ ] Background read
        3. [ ] A log of a scene you played · +job/scene 4=<scene>
        ```

        - `+job/check <#>=<step>` ticks a step; `+job/uncheck <#>=<step>` unticks it. Staff only.
        - The bucket's `` ON`CHECK `` hook runs after each, so code can act once every step is done.

        ## Scene logs

        A step starting with `scene:` asks for the log of a scene. The filer, a helper or staff attach
        one with `+job/scene <#>=<scene>`: it goes on the job as a reply with a link to the log, and ticks
        the first scene step still open. The filer and helpers can attach only scenes they were in.

        Scene logs need the Scene plugin. Without it, `scene:` steps are left out of every job's
        checklist and `+job/scene` is refused.


      # Every switch of +job (JOB) and +bucket (BUCKET), the AnomalyJobs and Volund spellings included.
      DATA`SWITCHES`JOB: |-
        act add addhelper all approve assign audit brief bucket cancel catchup check claim comment complete create delete deny due edit esc format from held hold last list mail merge mine name new next note old options overdue player priority query read remhelper reopen reply revert revive scan scene search source state status tag trans uncheck unclaim untag unwatch view watch who
      DATA`SWITCHES`BUCKET: |-

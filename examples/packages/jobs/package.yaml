      # ---- a job's fields ---------------------------------------------------------------
      # What +job and the portal show above a job's messages: FUN`FIELD`<key> for job %0, viewer %1 (%2 1
      # when they work the bucket), shown only when it has something to say. Staff read every key in
      # DATA`FIELDS`STAFF, everyone else DATA`FIELDS`PLAYER.
      DATA`FIELDS`STAFF: |-
        BUCKET STATUS UPDATE CHECKLIST PRIORITY FILED WAIT DUE AUDIT HANDLERS WATCHERS HELPERS
      DATA`FIELDS`PLAYER: |-
        BUCKET STATUS UPDATE CHECKLIST PRIORITY FILED WAIT HANDLERS HELPERS
      DATA`LABEL`WAIT: |-
        First answer
      FUN`FIELD`LABEL: |-
        firstof(get({{jobs}}/DATA`LABEL`%0),capstr(lcstr(%0)))
      # The keys that have something to say about job %0 for viewer %1 (%2 staff).
      FUN`FIELD`KEYS: |-
        squish(iter(get({{jobs}}/DATA`FIELDS`[if(%2,STAFF,PLAYER)]),if(strlen(u({{jobs}}/FUN`FIELD`%i0,%0,%1,%2)),%i0)))
      FUN`FIELD`BUCKET: |-
        name(get(%0/JOB`BUCKET))
      FUN`FIELD`STATUS: |-
        u({{jobs}}/FUN`STATE`TEXT,%0,%2)[if(cand(%2,u({{jobs}}/FUN`IS`OVERDUE,%0)),%b[tone(error,Overdue)])]
      # The line staff set with +job/status for the player to read.
      FUN`FIELD`UPDATE: |-
        if(strlen(get(%0/JOB`STATUS)),edit(get(%0/JOB`STATUS),%r,%b) [chr(183)] [u({{jobs}}/FUN`TIME`DATE,get(%0/JOB`STATUS`AT))])
      FUN`FIELD`CHECKLIST: |-
        if(words(setr(field_steps,u({{jobs}}/FUN`STEP`LIST,%0))),words(u({{jobs}}/FUN`STEP`DONE,%0)) of [words(%q<field_steps>)] done)
      FUN`FIELD`PRIORITY: |-
        capstr(get(%0/JOB`PRIORITY))
      FUN`FIELD`FILED: |-
        u({{jobs}}/FUN`TIME`WHEN,get(%0/JOB`FILED`AT)) by [u({{jobs}}/FUN`PERSON`NAME,get(%0/JOB`FILED`BY),%0,%1)]
      # How soon the bucket usually answers, while the job waits on staff for an answer.
      FUN`FIELD`WAIT: |-
        if(cand(match(new staff,get(%0/JOB`STATE)),not(get(%0/JOB`ANSWERED`AT))),u({{jobs}}/FUN`WAIT`TEXT,get(%0/JOB`BUCKET)))
      FUN`FIELD`DUE: |-
        if(isint(get(%0/JOB`DUE)),u({{jobs}}/FUN`TIME`WHEN,get(%0/JOB`DUE)),None)
      FUN`FIELD`AUDIT: |-
        switch(get(%0/JOB`AUDIT`STATE),pending,Approved at once\, not checked yet,passed,Checked by [u({{jobs}}/FUN`PERSON`NAME,get(%0/JOB`AUDIT`BY),%0,%1)],reverted,Reverted by [u({{jobs}}/FUN`PERSON`NAME,get(%0/JOB`AUDIT`BY),%0,%1)],)
      FUN`FIELD`HANDLERS: |-
        u({{jobs}}/FUN`HANDLER`NAMES,%0,%1,HANDLER)
      FUN`FIELD`WATCHERS: |-
        if(words(lattr(%0/JOB`WATCHER`*)),u({{jobs}}/FUN`HANDLER`NAMES,%0,%1,WATCHER))
      FUN`FIELD`HELPERS: |-
        if(words(lattr(%0/JOB`HELPER`*)),u({{jobs}}/FUN`HANDLER`NAMES,%0,%1,HELPER))

      # ---- lists ----------------------------------------------------------------
      # Every job person %0 gets from predicate FUN`SELECT`PREDICATE`%1 (job, person, %2).
      FUN`SELECT`JOBS: |-
        squish(iter(u({{jobs}}/FUN`SELECT`CANDIDATES,%1,%2),if(cand(u({{jobs}}/FUN`IS`STORED,%i0),u({{jobs}}/FUN`SELECT`PREDICATE`%1,%i0,%0,%2)),%i0)))
      # The jobs predicate FUN`SELECT`PREDICATE`%0 (with %1) can match, read from the indexes: open jobs sort after
      # "closed", so > closed is every open state.
      FUN`SELECT`CANDIDATES: |-
        switch(%0,NEW,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,=,new),PLAYER,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,=,player),HELD,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,=,held),OLD,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,=,closed),OVERDUE,u({{jobs}}/FUN`SELECT`INDEXED,JOB`DUE,<,secs()),AUDIT,u({{jobs}}/FUN`SELECT`INDEXED,JOB`AUDIT`STATE,=,pending),DEFAULT,setunion(u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),u({{jobs}}/FUN`SELECT`INDEXED,JOB`AUDIT`STATE,=,pending)),BUCKET,u({{jobs}}/FUN`SELECT`INDEXED,JOB`BUCKET,=,%1),INBUCKET,u({{jobs}}/FUN`SELECT`INDEXED,JOB`BUCKET,=,%1),QUEUE,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),OWN,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),OPEN,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),MINE,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),WHO,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),lcon({{store}}))
      # indexed() on a JOB` index, or every job in the store while the index is still being built.
      FUN`SELECT`INDEXED: |-
        if(strmatch(setr(index_result,indexed(%0,%1,%2)),#-1*),lcon({{store}}),%q<index_result>)
      # A job: a live object in the store, so a JOB`STATE set anywhere else is never listed.
      FUN`IS`STORED: |-
        cand(not(hasflag(%0,GOING)),strmatch(objid(loc(%0)),{{store}}))
      # Needs staff, in a bucket the person works.
      FUN`SELECT`PREDICATE`QUEUE: |-
        cand(match(new staff,get(%0/JOB`STATE)),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      # Open, and theirs.
      FUN`SELECT`PREDICATE`OWN: |-
        cand(not(strmatch(get(%0/JOB`STATE),closed)),u({{jobs}}/FUN`IS`PARTY,%0,%1))
      # Approved at once and not checked yet, in a bucket the person works.
      FUN`SELECT`PREDICATE`AUDIT: |-
        cand(strmatch(get(%0/JOB`AUDIT`STATE),pending),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      # What +jobs shows: the queue, approvals to check, and your own open jobs.
      FUN`SELECT`PREDICATE`DEFAULT: |-
        cor(u({{jobs}}/FUN`SELECT`PREDICATE`QUEUE,%0,%1),u({{jobs}}/FUN`SELECT`PREDICATE`AUDIT,%0,%1),u({{jobs}}/FUN`SELECT`PREDICATE`OWN,%0,%1))
      FUN`SELECT`PREDICATE`OPEN: |-
        cand(not(strmatch(get(%0/JOB`STATE),closed)),u({{jobs}}/FUN`CAN`SEE,%0,%1))
      FUN`SELECT`PREDICATE`SEEN: |-
        u({{jobs}}/FUN`CAN`SEE,%0,%1)
      FUN`SELECT`PREDICATE`BUCKET: |-
        cand(strmatch(get(%0/JOB`BUCKET),%2),u({{jobs}}/FUN`SELECT`PREDICATE`OPEN,%0,%1))
      FUN`SELECT`PREDICATE`INBUCKET: |-
        strmatch(get(%0/JOB`BUCKET),%2)
      FUN`SELECT`PREDICATE`MINE: |-
        cand(not(strmatch(get(%0/JOB`STATE),closed)),hasattr(%0,JOB`HANDLER`[u({{jobs}}/FUN`PERSON`KEY,%1)]))
      FUN`SELECT`PREDICATE`NEW: |-
        cand(strmatch(get(%0/JOB`STATE),new),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      FUN`SELECT`PREDICATE`OVERDUE: |-
        cand(u({{jobs}}/FUN`IS`OVERDUE,%0),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      FUN`SELECT`PREDICATE`PLAYER: |-
        cand(strmatch(get(%0/JOB`STATE),player),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      FUN`SELECT`PREDICATE`HELD: |-
        cand(strmatch(get(%0/JOB`STATE),held),u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1))
      FUN`SELECT`PREDICATE`WHO: |-
        cand(u({{jobs}}/FUN`SELECT`PREDICATE`OPEN,%0,%1),hasattr(%0,JOB`HANDLER`[u({{jobs}}/FUN`PERSON`KEY,%2)]))
      FUN`SELECT`PREDICATE`FROM: |-
        cand(strmatch(get(%0/JOB`FILED`BY),%2),u({{jobs}}/FUN`CAN`SEE,%0,%1),u({{jobs}}/FUN`FILER`SHOWN,%0,%1))
      FUN`SELECT`PREDICATE`OLD: |-
        cand(strmatch(get(%0/JOB`STATE),closed),u({{jobs}}/FUN`CAN`SEE,%0,%1),cor(not(strlen(%2)),strmatch(get(%0/JOB`BUCKET),%2)))
      FUN`SELECT`PREDICATE`UNREAD: |-
        cand(u({{jobs}}/FUN`CAN`SEE,%0,%1),u({{jobs}}/FUN`IS`UNREAD,%0,%1))
      # The title or any message the person may read contains %2.
      FUN`SELECT`PREDICATE`SEARCH: |-
        cand(u({{jobs}}/FUN`CAN`SEE,%0,%1),cor(pos(lcstr(%2),lcstr(get(%0/JOB`TITLE))),words(iter(lnum(1,firstof(get(%0/JOB`ENTRIES),0)),if(cand(uargs({{jobs}}/FUN`ENTRY`VISIBLE,job,%0,entry,%i0,staff,u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1)),pos(lcstr(%2),lcstr(get(%0/JOB`ENTRY`%i0`TEXT)))),%i0)))))
      # High priority first, then whoever has waited longest for their turn.
      FUN`SORT`QUEUE: |-
        sortkey({{jobs}}/FUN`SORTKEY`QUEUE,%0)
      FUN`SORTKEY`QUEUE: |-
        switch(get(%0/JOB`PRIORITY),high,1,low,3,2)[rjust(firstof(get(%0/JOB`TURN`AT),0),12,0)]
      # Newest first.
      FUN`SORT`NEWEST: |-
        revwords(sortkey({{jobs}}/FUN`SORTKEY`NUMBER,%0,n))
      FUN`SORTKEY`NUMBER: |-
        get(%0/JOB`NUM)
      # Jobs %0 for person %1, a column at a time. A * before the number marks something unread. Cells are
      # joined with %r and split on a newline, so a title holding a | stays one cell; the title wraps and
      # every other column is shown whole or, on a narrow screen, left out (Bucket and Updated first).
      FUN`DISPLAY`JOBS: |-
        datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r2%r4%r5),min,json(string,%r%r12),priority,json(string,1%r2%r1%r1%r2),grow,json(string,%r%r1)),>[tone(strong,#)]%r[iter(%0,if(u({{jobs}}/FUN`IS`UNREAD,%i0,%1),tone(info,*))[get(%i0/JOB`NUM)],,%r)],tone(strong,Bucket)%r[iter(%0,name(get(%i0/JOB`BUCKET)),,%r)],tone(strong,Title)%r[iter(%0,edit(get(%i0/JOB`TITLE),%r,%b),,%r)],tone(strong,Status)%r[iter(%0,if(cand(setr(row_staff,u({{jobs}}/FUN`CAN`WORK,get(%i0/JOB`BUCKET),%1)),u({{jobs}}/FUN`IS`OVERDUE,%i0)),tone(error,Overdue),u({{jobs}}/FUN`STATE`TEXT,%i0,%q<row_staff>)),,%r)],tone(strong,Updated)%r[iter(%0,u({{jobs}}/FUN`TIME`DATE,get(%i0/[if(u({{jobs}}/FUN`CAN`WORK,get(%i0/JOB`BUCKET),%1),JOB`UPDATED`AT,JOB`PUBLIC`AT)])),,%r)])
      # Every screen is a box() with no sides, corners or tees, as +help's and +wiki's are: a titled line
      # across the top, dividers and a bottom line across the whole width, and nothing beside the text, so
      # a reply copied from a terminal carries no |.
      FUN`DISPLAY`FRAME: |-
        json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
      # %<jobs> for %<viewer> in a box titled %<title>, with %<footer>. No width: each reader gets their own.
      FUN`DISPLAY`LIST: |-
        box(if(words(%<jobs>),u({{jobs}}/FUN`DISPLAY`JOBS,%<jobs>,%<viewer>),No jobs.)[if(strlen(%<footer>),%r[rule()]%r%<footer>)],%<title>,,u({{jobs}}/FUN`DISPLAY`FRAME))
      # Lists the jobs predicate FUN`SELECT`PREDICATE`<%<select>> picks (with %<selarg>) under %<title> and %<footer>.
      INC`SHOW`LIST: |-
        @include/args {{jobs}}/INC`SHOW`PAGE=title,%<title>,footer,%<footer>,jobs,u({{jobs}}/FUN`SORT`QUEUE,u({{jobs}}/FUN`SELECT`JOBS,%#,%<select>,%<selarg>))

      # ---- pages ----------------------------------------------------------------
      # A list longer than the reader's screen comes in pages, and the page is a last switch: +jobs/2,
      # +job/old/3 Requests. No page is the first. The routes that list, and so take one:
      DATA`PAGE`ROUTES: |-
        list all mine new overdue player held scan search who from old audits
      # Rows a page holds: what fits the reader's screen under the title, headings and footer.
      FUN`PAGE`ROWS: |-
        max(5,sub(height(%#,24),9))
      FUN`PAGE`COUNT: |-
        add(1,div(sub(max(1,words(%0)),1),u({{jobs}}/FUN`PAGE`ROWS)))
      # Page %1 of jobs %0.
      FUN`PAGE`OF: |-
        extract(%0,add(1,mul(sub(%1,1),u({{jobs}}/FUN`PAGE`ROWS))),u({{jobs}}/FUN`PAGE`ROWS))
      # Footer %0, and below it, when there is more than one page, which this is (%1 of %2) and how to
      # ask for the next: the command as typed, with the page after its switches.
      FUN`PAGE`FOOTER: |-
        setq(page_footer,if(gt(%2,1),Page %1 of %2[if(lt(%1,%2),%b-%b[if(strlen(%q<cmd_switch>),+job/%q<cmd_switch>,+jobs)]/[add(%1,1)][if(strlen(%q<cmd_argument>),%b%q<cmd_argument>)])]))%0[if(cand(strlen(%0),strlen(%q<page_footer>)),%r)]%q<page_footer>
      # Page %q<cmd_page> of %<jobs>, under %<title> and %<footer>.
      INC`SHOW`PAGE: |-
        think setqm(cmd_page,strfirstof(%q<cmd_page>,1),
        page_count,u({{jobs}}/FUN`PAGE`COUNT,%<jobs>)); @assert gt(%q<cmd_page>,0)=@pemit %#=notice(JOBS,Pages start at 1.,warn); @assert lte(%q<cmd_page>,%q<page_count>)=@pemit %#=notice(JOBS,There [if(gt(%q<page_count>,1),are %q<page_count> pages,is one page)] - you asked for page %q<cmd_page>.,warn); @pemit %#=uargs({{jobs}}/FUN`DISPLAY`LIST,jobs,u({{jobs}}/FUN`PAGE`OF,%<jobs>,%q<cmd_page>),viewer,%#,title,%<title>,footer,u({{jobs}}/FUN`PAGE`FOOTER,%<footer>,%q<cmd_page>,%q<page_count>))

      # ---- one job --------------------------------------------------------------
      # %<job> entry %<entry>, %<staff> 1 for staff, %<mode> empty, all or act. Replies are public, notes
      # staff-only, and the action log shows with /all and /act.
      FUN`ENTRY`VISIBLE: |-
        switch(get(%<job>/JOB`ENTRY`%<entry>`KIND),reply,not(strmatch(%<mode>,act)),note,cand(%<staff>,not(strmatch(%<mode>,act))),action,cand(%<staff>,match(all act,%<mode>)),0)
      # The messages of job %0 a reader numbers, oldest first: replies, and notes for staff (%1 1). The
      # log is never numbered, so nobody's numbers skip, and a player's do not show that notes exist.
      FUN`ENTRY`NUMBERED: |-
        squish(iter(lnum(1,firstof(get(%0/JOB`ENTRIES),0)),if(uargs({{jobs}}/FUN`ENTRY`VISIBLE,job,%0,entry,%i0,staff,%1),%i0)))
      # The entry stored for message %1 of job %0 as a reader (%2 1 for staff) numbers it, or nothing.
      FUN`ENTRY`REAL: |-
        if(cand(isint(%1),gt(%1,0)),extract(u({{jobs}}/FUN`ENTRY`NUMBERED,%0,%2),%1,1))
      # %<job> entry %<entry> for %<viewer> at %<width>, numbered %<number> (0 for a log line, which has no
      # number).
      FUN`DISPLAY`ENTRY: |-
        rule(u({{jobs}}/FUN`PERSON`NAME,get(%<job>/JOB`ENTRY`%<entry>`BY),%<job>,%<viewer>)[switch(get(%<job>/JOB`ENTRY`%<entry>`KIND),note,%b[chr(40)]staff only[chr(41)],action,%b[chr(40)]log[chr(41)],)] [chr(183)] [u({{jobs}}/FUN`TIME`WHEN,get(%<job>/JOB`ENTRY`%<entry>`AT))][if(%<number>,%b[chr(183)] #%<number>)])%r[u({{jobs}}/FUN`MESSAGE`BODY,%<job>,%<entry>,%<width>)]
      # %<job> for %<viewer> whose screen is %<width> wide. %<mode>: empty, all (with the log), act (the log
      # only) or last:<n>. A box: the fields, then each message under a rule naming who wrote it. Messages render at
      # the full width, since the box has no sides. Staff also see Due and Watchers; fields() takes its
      # pairs as arguments, so the two readers get two calls (FUN`DISPLAY`FIELDS).
      FUN`DISPLAY`JOB: |-
        setqm(show_staff,u({{jobs}}/FUN`CAN`WORK,get(%<job>/JOB`BUCKET),%<viewer>),
        numbered_entries,u({{jobs}}/FUN`ENTRY`NUMBERED,%<job>,%q<show_staff>),
        shown_entries,squish(iter(lnum(1,firstof(get(%<job>/JOB`ENTRIES),0)),if(uargs({{jobs}}/FUN`ENTRY`VISIBLE,job,%<job>,entry,%i0,staff,%q<show_staff>,mode,%<mode>),%i0))))[if(strmatch(%<mode>,last:*),setq(shown_entries,revwords(extract(revwords(%q<shown_entries>),1,after(%<mode>,:)))))][box(u({{jobs}}/FUN`DISPLAY`FIELDS,%<job>,%<viewer>,%q<show_staff>)[if(words(u({{jobs}}/FUN`STEP`LIST,%<job>)),%r[rule(Checklist)]%r[u({{jobs}}/FUN`CHECKLIST`SHOW,%<job>,%<viewer>)])][iter(%q<shown_entries>,%r[uargs({{jobs}}/FUN`DISPLAY`ENTRY,job,%<job>,entry,%i0,viewer,%<viewer>,width,max(10,%<width>),number,member(%q<numbered_entries>,%i0))],%b,)]%r[rule()]%r+job/reply [get(%<job>/JOB`NUM)]=<text> answers,Job [get(%<job>/JOB`NUM)]: [get(%<job>/JOB`TITLE)],,u({{jobs}}/FUN`DISPLAY`FRAME))]
      # Job %0's fields for person %1; %2 is 1 for someone who works its bucket. The keys come from
      # FUN`FIELD`KEYS, so lfields() takes the labels and values as two lists.
      FUN`DISPLAY`FIELDS: |-
        setq(field_keys,u({{jobs}}/FUN`FIELD`KEYS,%0,%1,%2))[lfields(,iter(%q<field_keys>,u({{jobs}}/FUN`FIELD`LABEL,%i0),%b,%r),iter(%q<field_keys>,u({{jobs}}/FUN`FIELD`%i0,%0,%1,%2),%b,%r),%r)]

      # ---- guards ---------------------------------------------------------------
      # The job numbered %q<cmd_left_side>, as %q<job_object>, %q<job_number>, its bucket %q<job_bucket> and %q<actor_is_staff>. A job the person may
      # not see reads as missing. An @assert here ends the command that included it.
      INC`NEED`JOB: |-
        @assert isint(%q<cmd_left_side>)=@pemit %#=notice(JOBS,if(cand(strlen(%q<cmd_switch>),hasattr({{jobs}},DATA`USAGE`%q<cmd_route>)),u({{jobs}}/FUN`COMMAND`USAGE),Which job? Give its number\, as in +job 12.),warn); @assert cand(strlen(setr(job_object,u({{jobs}}/FUN`JOB`FIND,%q<cmd_left_side>))),u({{jobs}}/FUN`CAN`SEE,%q<job_object>,%#))=@pemit %#=notice(JOBS,There is no job %q<cmd_left_side>.,warn); think setqm(job_number,get(%q<job_object>/JOB`NUM),
        job_bucket,get(%q<job_object>/JOB`BUCKET),
        actor_is_staff,u({{jobs}}/FUN`CAN`WORK,get(%q<job_object>/JOB`BUCKET),%#))
      INC`NEED`STAFF: |-
        @assert %q<actor_is_staff>=@pemit %#=notice(JOBS,Only staff who work the [name(%q<job_bucket>)] bucket can do that.,error)
      INC`NEED`ADMIN: |-
        @assert u({{jobs}}/FUN`IS`ADMIN,%#)=@pemit %#=notice(JOBS,Only a Job Admin can do that.,error)
      # A closed job: staff are pointed at /reopen, and its filer or a helper at a reply while one still opens it.
      INC`NEED`OPEN: |-
        @assert not(strmatch(get(%q<job_object>/JOB`STATE),closed))=@pemit %#=notice(JOBS,Job %q<job_number> is closed.[switch(1,%q<actor_is_staff>,%b+job/reopen %q<job_number> opens it again.,u({{jobs}}/FUN`CAN`REOPEN,%q<job_object>),%b+job/reply %q<job_number>=<text> opens it again.,)],warn)
      INC`NEED`TEXT: |-
        @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(JOBS,Give the text after an =\, as in +job/%q<cmd_switch> %q<job_number>=<text>.,warn)
      # <job>/<message>: message %q<entry_shown> as +job numbers it for this reader, stored as entry %q<entry_stored>, as well as the job.
      INC`NEED`ENTRY: |-
        @assert cand(strmatch(%q<cmd_left_side>,*/*),isint(trim(after(%q<cmd_left_side>,/))))=@pemit %#=notice(JOBS,u({{jobs}}/FUN`COMMAND`USAGE),warn); think setqm(entry_shown,trim(after(%q<cmd_left_side>,/)),
        cmd_left_side,trim(before(%q<cmd_left_side>,/))); @include {{jobs}}/INC`NEED`JOB; @assert strlen(setr(entry_stored,u({{jobs}}/FUN`ENTRY`REAL,%q<job_object>,%q<entry_shown>,%q<actor_is_staff>)))=@pemit %#=notice(JOBS,Job %q<job_number> has no message %q<entry_shown>. +job %q<job_number> numbers them.,warn)

      # <#>=<step>: a step of the job's checklist that shows, as %q<step_number>.
      INC`NEED`STEP: |-
        @assert cand(%q<cmd_has_equals>,isint(trim(%q<cmd_right_side>)))=@pemit %#=notice(JOBS,u({{jobs}}/FUN`COMMAND`USAGE),warn); @assert member(u({{jobs}}/FUN`STEP`LIST,%q<job_object>),setr(step_number,trim(%q<cmd_right_side>)))=@pemit %#=notice(JOBS,Job %q<job_number> has no step %q<step_number>. +job %q<job_number> lists them.,warn)
      # Why scene %0 can't be attached by %1 (%2 1 for staff) to job %3, or nothing. The scene must be one %1
      # can see, and someone not staff must have been in it.
      FUN`ERROR`SCENE: |-
        setq(scene_typed,trim(%0))[switch(1,not(regmatch(%q<scene_typed>,^\[A-Za-z0-9_-\]+$)),Give the scene's number\, as its page /scenes/<number> shows it.,strmatch(scene(%q<scene_typed>,status),#-1*),There is no scene %q<scene_typed>.,cand(not(%2),strmatch(scenemember(%q<scene_typed>,%1),#-1*)),You were not in scene %q<scene_typed>.,t(member(get(%3/JOB`SCENES),%q<scene_typed>)),Scene %q<scene_typed> is on job [get(%3/JOB`NUM)] already.,)]

      # ---- +job lists ------------------------------------------------------------
      # +jobs: what needs staff in the buckets you work, and your own open jobs. +jobs <bucket> (and +jobs/list <bucket>): one bucket.
      INC`JOB`LIST: |-
        @break strlen(%q<cmd_argument>)=@include {{jobs}}/INC`SHOW`BUCKET; @include/args {{jobs}}/INC`SHOW`LIST=select,DEFAULT,selarg,,title,Jobs,footer,+job <#> reads one [chr(183)] [if(u({{jobs}}/FUN`IS`STAFF,%#),+jobs/all lists every open job,+job/old lists your closed ones)]
      INC`SHOW`BUCKET: |-
        @assert strlen(setr(bucket_object,u({{jobs}}/FUN`BUCKET`SEEN,%q<cmd_argument>,%#)))=@pemit %#=notice(JOBS,There is no bucket called %q<cmd_argument>. +buckets lists them.,warn); @include/args {{jobs}}/INC`SHOW`LIST=select,BUCKET,selarg,%q<bucket_object>,title,Open jobs in [name(%q<bucket_object>)],footer,+job/old [name(%q<bucket_object>)] lists its closed jobs
      INC`JOB`ALL: |-
        @include/args {{jobs}}/INC`SHOW`LIST=select,OPEN,selarg,,title,All open jobs,footer,
      INC`JOB`MINE: |-
        @include/args {{jobs}}/INC`SHOW`LIST=select,MINE,selarg,,title,Jobs you handle,footer,
      INC`JOB`NEW: |-
        @include/args {{jobs}}/INC`SHOW`LIST=select,NEW,selarg,,title,New jobs,footer,
      INC`JOB`OVERDUE: |-
        @include/args {{jobs}}/INC`SHOW`LIST=select,OVERDUE,selarg,,title,Overdue jobs,footer,
      INC`JOB`PLAYER: |-
        @include/args {{jobs}}/INC`SHOW`LIST=select,PLAYER,selarg,,title,Jobs waiting on players,footer,
      INC`JOB`HELD: |-

      INC`DO`DUE: |-
        think [setq(_od,get(%q<jo>/DUE))]; &DUE %q<jo>=%q<due>; &OVERDUE`FIRED %q<jo>=; think [setq(logtext,Due [if(strlen(%q<due>),u({{jobs}}/FUN`WHEN,%q<due>),on no date)].)][setq(logcode,due)]; @include {{jobs}}/INC`DO`LOG; @trigger [get(%q<jo>/BUCKET)]/ON`DUE=[get(%q<jo>/NUM)],%q<actor>,%q<_od>,%q<due>
      INC`DO`PRIORITY: |-
        think [setq(_op,get(%q<jo>/PRIORITY))]; &PRIORITY %q<jo>=%q<prio>; think [setq(logtext,Priority %q<prio>.)][setq(logcode,priority)]; @include {{jobs}}/INC`DO`LOG; @trigger [get(%q<jo>/BUCKET)]/ON`PRIORITY=[get(%q<jo>/NUM)],%q<actor>,%q<_op>,%q<prio>
      # Moves %q<jo> to bucket %q<nb>. Both buckets' ON`TRANSFER run.
      INC`DO`TRANSFER: |-
        think [setq(_ob,get(%q<jo>/BUCKET))]; &BUCKET %q<jo>=%q<nb>; think [setq(logtext,Moved from [name(%q<_ob>)] to [name(%q<nb>)].)][setq(logcode,trans)]; @include {{jobs}}/INC`DO`LOG; @trigger %q<_ob>/ON`TRANSFER=[get(%q<jo>/NUM)],%q<actor>,%q<_ob>,%q<nb>; @trigger %q<nb>/ON`TRANSFER=[get(%q<jo>/NUM)],%q<actor>,%q<_ob>,%q<nb>
      INC`DO`FORMAT: |-
        &ENTRY`%q<ent>`FORMAT %q<jo>=[if(strmatch(%q<fmt>,softcode),softcode)]
      # The line staff see: job %0, actor %1, verb %2.
      FUN`MSG: |-
        [ansi(h,JOBS:)] [u({{jobs}}/FUN`WHO`AS,%1,%0,1,0)] %2 job [get(%0/NUM)] [chr(40)][name(get(%0/BUCKET))][chr(41)]: [get(%0/TITLE)]

      FUN`SETTING`OK: |-
        [switch(%0,description,lte(strlen(%1),200),turnaround,cand(isint(%1),gte(%1,0)),reopen,cand(isint(%1),gte(%1,0)),keep,cor(not(strlen(%1)),cand(isint(%1),gt(%1,0))),anonymous,t(match(none filer staff,lcstr(%1))),hidden,t(match(yes no on off 1 0,lcstr(%1))),priority,t(strlen(u({{jobs}}/FUN`PRIORITY`PARSE,%1))),0)]
      FUN`SETTING`VALUE: |-
        [switch(%0,hidden,t(match(yes on 1,lcstr(%1))),anonymous,lcstr(%1),priority,u({{jobs}}/FUN`PRIORITY`PARSE,%1),%1)]
      # Settings only. Hook code (ON`*) is written by whoever controls the bucket object, not through here.
      INC`BUCKET`SET: |-
        @assert strlen(setr(bk,u({{jobs}}/FUN`BUCKET,before(%q<lhs>,/))))=@pemit %#=+bucket/set <bucket>/<setting>=<value>; @assert cor(u({{jobs}}/FUN`IS`ADMIN,%#),u({{jobs}}/FUN`CAN`WORK,%q<bk>,%#))=@pemit %#=Only a Job Admin or someone who works [name(%q<bk>)] can change it.; @assert t(match(description turnaround reopen anonymous hidden priority keep,setr(set,lcstr(trim(after(%q<lhs>,/))))))=@pemit %#=The settings are description, turnaround, reopen, anonymous, hidden, priority and keep.; @assert u({{jobs}}/FUN`SETTING`OK,%q<set>,%q<rhs>)=@pemit %#=[get({{jobs}}/DATA`SETTING`%q<set>)]; &%q<set> %q<bk>=[u({{jobs}}/FUN`SETTING`VALUE,%q<set>,%q<rhs>)]; @pemit %#=[name(%q<bk>)] %q<set> is [firstof(get(%q<bk>/%q<set>),nothing)].
      # +bucket/create <name>=<description>: the bucket, its permission softcode.jobs.<slug>, and the role job-admin-<slug> allowing it.
      INC`BUCKET`CREATE: |-
        @include {{jobs}}/INC`NEED`ADMIN; think [setq(bname,trim(%q<lhs>))][setq(slug,lcstr(edit(%q<bname>,%b,_,-,_)))]; @assert cand(strlen(%q<bname>),lte(strlen(%q<bname>),20),valid(name,%q<bname>),valid(permission,softcode.jobs.%q<slug>))=@pemit %#=A bucket name is up to 20 letters, digits, spaces and dashes, starting with a letter.; @assert not(strlen(u({{jobs}}/FUN`BUCKET,%q<bname>)))=@pemit %#=There is a %q<bname> bucket already.; think [setq(bk,objid(create(%q<bname>)))]; @tel %q<bk>={{buckets}}; @parent %q<bk>={{buckets}}; &DESCRIPTION %q<bk>=%q<rhs>; &SLUG %q<bk>=%q<slug>; @lock/user:file %q<bk>=#TRUE; @lock/user:work %q<bk>=perm^softcode.jobs.admin|perm^softcode.jobs.%q<slug>; @dolist/inline [get({{jobs}}/DATA`HOOKS)]=&ON`## %q<bk>=[get({{jobs}}/DATA`HOOKDOC`##)]; @permission/define softcode.jobs.%q<slug>=Jobs/Work jobs in the %q<bname> bucket.; @role/create job-admin-%q<slug>=Jobs/Job Admin - %q<bname>; @role/allow job-admin-%q<slug>=softcode.jobs.%q<slug>; @pemit %#=Bucket %q<bname> is ready. The role job-admin-%q<slug> works it: @role/assign <player>=job-admin-%q<slug>
      INC`BUCKET`RENAME: |-
        @include {{jobs}}/INC`NEED`ADMIN; @assert strlen(setr(bk,u({{jobs}}/FUN`BUCKET,%q<lhs>)))=@pemit %#=There is no bucket called %q<lhs>.; @assert cand(lte(strlen(%q<rhs>),20),valid(name,%q<rhs>),not(strlen(u({{jobs}}/FUN`BUCKET,%q<rhs>))))=@pemit %#=Pick a free name of up to 20 characters.; @name %q<bk>=%q<rhs>; @role/rename job-admin-[get(%q<bk>/SLUG)]=Job Admin - %q<rhs>; @pemit %#=The bucket is called %q<rhs> now. Its permission and role keep their names.
      # Empty buckets only.
      INC`BUCKET`DELETE: |-
        @include {{jobs}}/INC`NEED`ADMIN; @assert strlen(setr(bk,u({{jobs}}/FUN`BUCKET,%q<arg>)))=@pemit %#=There is no bucket called %q<arg>.; @assert not(words(u({{jobs}}/FUN`SELECT,%#,INBUCKET,%q<bk>)))=@pemit %#=[name(%q<bk>)] still has jobs. Move or delete them first.; @assert comp(lcstr(name(%q<bk>)),lcstr(get({{jobs}}/DATA`DEFAULT`BUCKET)))=@pemit %#=[name(%q<bk>)] is where +request files. Point DATA`DEFAULT`BUCKET elsewhere first.; think [setq(slug,get(%q<bk>/SLUG))][setq(bname,name(%q<bk>))]; @role/delete job-admin-%q<slug>; @permission/undefine softcode.jobs.%q<slug>; @tel %q<bk>={{jobs}}; @nuke %q<bk>; @pemit %#=Bucket %q<bname> is deleted, with its role and permission.
      # +bucket/lock <bucket>/file|work=<lock>: ordinary locks, so perm^, role^ and the rest all work.
      INC`BUCKET`LOCK: |-
        @include {{jobs}}/INC`NEED`ADMIN; @assert strlen(setr(bk,u({{jobs}}/FUN`BUCKET,before(%q<lhs>,/))))=@pemit %#=+bucket/lock <bucket>/file|work=<lock>; @assert t(match(file work,setr(lk,lcstr(trim(after(%q<lhs>,/))))))=@pemit %#=A bucket has a file lock (who may file) and a work lock (who works it).; @lock/user:%q<lk> %q<bk>=%q<rhs>; @pemit %#=[name(%q<bk>)] %q<lk> lock: [lock(%q<bk>/%q<lk>)]

      # ---- timer, login, functions, API ----------------------------------------------
      FUN`DUE`NOW: |-
        [squish(iter(lcon({{store}}),if(cand(u({{jobs}}/FUN`IS`OVERDUE,%i0),not(get(%i0/OVERDUE`FIRED))),%i0)))]
      FUN`EXPIRED: |-
        [squish(iter(lcon({{store}}),if(cand(strmatch(get(%i0/STATE),closed),gt(setr(_k,firstof(get(get(%i0/BUCKET)/KEEP),0)),0),lt(get(%i0/CLOSED`AT),sub(secs(),mul(%q<_k>,86400)))),%i0)))]
      # Every DATA`TICK seconds: run ON`OVERDUE once for each job newly overdue and tell its handlers,
      # and remove closed jobs older than their bucket's keep. %0 is the run's id; a second STARTUP starts a
      # new run and the old one stops at its next tick.
      TICK: |-
        @assert strmatch(%0,get({{jobs}}/TICK`ID)); @dolist/inline [u({{jobs}}/FUN`DUE`NOW)]={&OVERDUE`FIRED ##=[secs()]; @trigger [get(##/BUCKET)]/ON`OVERDUE=[get(##/NUM)],,[get(##/DUE)]; think [setq(_tj,##)][setq(_th,squish(iter(u({{jobs}}/FUN`HLIST,##,HANDLER),if(strmatch(%i0,role:*),,%i0))))][if(strlen(%q<_th>),pemit(%q<_th>,[ansi(h,JOBS:)] Job [get(%q<_tj>/NUM)] is overdue: [get(%q<_tj>/TITLE)]))]}; @dolist/inline [u({{jobs}}/FUN`EXPIRED)]={&INDEX`[get(##/NUM)] {{store}}=; @tel ##={{jobs}}; @nuke ##}; @wait [get({{jobs}}/DATA`TICK)]=@trigger {{jobs}}/TICK=%0
      # One line at login: what needs staff, for those who work a bucket, and what is new for everyone.
      ACONNECT: |-
        think [setq(_q,words(u({{jobs}}/FUN`SELECT,%#,QUEUE)))][setq(_o,words(u({{jobs}}/FUN`SELECT,%#,OVERDUE)))][setq(_u,words(u({{jobs}}/FUN`SELECT,%#,UNREAD)))]; @assert cor(%q<_q>,%q<_u>); @pemit %#=[ansi(h,JOBS:)] [if(%q<_q>,%q<_q> need staff[if(%q<_o>,%b[chr(40)]%q<_o> overdue[chr(41)])])][if(cand(%q<_q>,%q<_u>),[chr(44)]%b)][if(%q<_u>,%q<_u> with something new)]. +jobs lists them.
      # Whether calling object %1 may read job %0 through job(), jobs() and jobentries(): someone who may
      # see it, a see_all holder, or a bucket's own hook.
      FUN`CALLER`OK: |-
        [cor(u({{jobs}}/FUN`CAN`SEE,%0,%1),t(permission(%1,game.see_all)),strmatch(objid(loc(%1)),{{buckets}}))]
      # job(<#>, <field>): see +help jobs api.
      FUN`API`JOB: |-
        [setq(_j,u({{jobs}}/FUN`JOB,%0))][if(not(cand(strlen(%q<_j>),u({{jobs}}/FUN`CALLER`OK,%q<_j>,%@))),#-1 NO SUCH JOB,switch(lcstr(%1),number,get(%q<_j>/NUM),bucket,name(get(%q<_j>/BUCKET)),title,get(%q<_j>/TITLE),state,get(%q<_j>/STATE),outcome,get(%q<_j>/OUTCOME),priority,get(%q<_j>/PRIORITY),filer,if(u({{jobs}}/FUN`FILER`SHOWN,%q<_j>,%@),get(%q<_j>/FILED`BY)),filed,get(%q<_j>/FILED`AT),due,get(%q<_j>/DUE),updated,get(%q<_j>/UPDATED`AT),overdue,u({{jobs}}/FUN`IS`OVERDUE,%q<_j>),handlers,u({{jobs}}/FUN`HLIST,%q<_j>,HANDLER),watchers,u({{jobs}}/FUN`HLIST,%q<_j>,WATCHER),helpers,u({{jobs}}/FUN`HLIST,%q<_j>,HELPER),entries,get(%q<_j>/ENTRIES),#-1 NO SUCH FIELD))]
      # jobs([<bucket>[, open|all|<state>]]): job numbers, newest first.
      FUN`API`JOBS: |-
        [setq(_ab,if(strlen(%0),u({{jobs}}/FUN`BUCKET,%0)))][setq(_as,lcstr(firstof(%1,open)))][u({{jobs}}/FUN`SORT`NUM,squish(iter(lcon({{store}}),if(cand(not(hasflag(%i0,GOING)),cor(not(strlen(%0)),strmatch(get(%i0/BUCKET),%q<_ab>)),switch(%q<_as>,all,1,open,not(strmatch(get(%i0/STATE),closed)),strmatch(get(%i0/STATE),%q<_as>)),u({{jobs}}/FUN`CALLER`OK,%i0,%@)),get(%i0/NUM)))))]
      # jobentries(<#>[, <viewer>]): the numbers of the messages <viewer> may read.
      FUN`API`JOBENTRIES: |-
        [setq(_j,u({{jobs}}/FUN`JOB,%0))][if(not(cand(strlen(%q<_j>),u({{jobs}}/FUN`CALLER`OK,%q<_j>,%@))),#-1 NO SUCH JOB,squish(iter(lnum(1,firstof(get(%q<_j>/ENTRIES),0)),if(u({{jobs}}/FUN`ENTRY`VISIBLE,%q<_j>,%i0,u({{jobs}}/FUN`CAN`WORK,get(%q<_j>/BUCKET),firstof(%1,%@)),),%i0))))]
      # @include Jobs/INC`API`FILE=<player>,<bucket> files %q<title> / %q<text> for a player and leaves
      # the number in %q<job>. Text goes in registers because @include splits its arguments at commas.
      # Needs a privileged executor (a wizard object), since it writes the job store.
      INC`API`FILE: |-
        think [setq(actor,if(hastype(%0,PLAYER),objid(%0),objid(pmatch(%0))))][setq(fb,u({{jobs}}/FUN`BUCKET,%1))][setq(fmt,firstof(%q<fmt>,markdown))][setq(how,api)][setq(author,)][setq(prio,)][setq(job,)]; @assert cand(strlen(%q<actor>),strlen(%q<fb>),strlen(%q<title>),strlen(%q<text>)); @include {{jobs}}/INC`DO`FILE; think [setq(job,%q<n>)]
      # @include Jobs/INC`API`REPLY=<job>,<actor>: a public reply of %q<text>.
      INC`API`REPLY: |-
        think [setq(jo,u({{jobs}}/FUN`JOB,%0))][setq(actor,objid(%1))][setq(kind,reply)][setq(fmt,firstof(%q<fmt>,markdown))][setq(mailforce,0)]; @assert cand(strlen(%q<jo>),strlen(%q<actor>),strlen(%q<text>)); @include {{jobs}}/INC`DO`REPLY
      # @include Jobs/INC`API`NOTE=<job>,<actor>: a staff note of %q<text>.
      INC`API`NOTE: |-
        think [setq(jo,u({{jobs}}/FUN`JOB,%0))][setq(actor,objid(%1))][setq(kind,note)][setq(fmt,firstof(%q<fmt>,markdown))][setq(mailforce,0)]; @assert cand(strlen(%q<jo>),strlen(%q<actor>),strlen(%q<text>)); @include {{jobs}}/INC`DO`REPLY
      # @include Jobs/INC`API`CLOSE=<job>,<actor>,<approved|denied|completed|canceled>, with %q<text> the closing message.
      INC`API`CLOSE: |-

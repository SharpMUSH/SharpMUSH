        [setq(_j,u({{jobs}}/FUN`JOB,%1))][if(cand(strlen(%q<_j>),u({{jobs}}/FUN`CAN`SEE,%q<_j>,%0)),u({{jobs}}/WEB`SCHEMA`JOB`SEEN,%0,%q<_j>),u({{jobs}}/WEB`SCHEMA`NOJOB,%1))]
      WEB`SCHEMA`NOJOB: |-

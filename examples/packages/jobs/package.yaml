      FUN`STEP`ISSCENE: |-
        strmatch(u({{jobs}}/FUN`STEP`RAW,%0,%1),scene:*)
      # Step %1 of job %0 as it reads, without its scene: mark.
      FUN`STEP`TEXT: |-
        setq(step_raw,u({{jobs}}/FUN`STEP`RAW,%0,%1))[if(strmatch(%q<step_raw>,scene:*),trim(after(%q<step_raw>,:)),%q<step_raw>)]
      # The numbers of job %0's steps that show: all of them, less the scene steps while there are no scene logs.
      FUN`STEP`LIST: |-
        if(strlen(get(%0/JOB`CHECKLIST)),squish(iter(lnum(1,words(get(%0/JOB`CHECKLIST),|)),if(cor(not(u({{jobs}}/FUN`STEP`ISSCENE,%0,%i0)),u({{jobs}}/FUN`HAS`SCENES)),%i0))))
      FUN`STEP`DONE: |-
        squish(iter(u({{jobs}}/FUN`STEP`LIST,%0),if(get(%0/JOB`CHECK`%i0`DONE),%i0)))
      # The first scene step of job %0 that is not done, or nothing.
      FUN`STEP`SCENE`OPEN: |-
        first(squish(iter(u({{jobs}}/FUN`STEP`LIST,%0),if(cand(u({{jobs}}/FUN`STEP`ISSCENE,%0,%i0),not(get(%0/JOB`CHECK`%i0`DONE))),%i0))))
      # Job %0's checklist for %1, a step a line: [x] done, with who did it and when, or [ ] to do.
      FUN`CHECKLIST`SHOW: |-
        iter(u({{jobs}}/FUN`STEP`LIST,%0),%i0. [if(setr(step_done_at,get(%0/JOB`CHECK`%i0`DONE)),chr(91)x[chr(93)],chr(91)%b[chr(93)])] [u({{jobs}}/FUN`STEP`TEXT,%0,%i0)][if(%q<step_done_at>,%b[chr(183)] [u({{jobs}}/FUN`PERSON`NAME,get(%0/JOB`CHECK`%i0`BY),%0,%1)]\, [u({{jobs}}/FUN`TIME`DATE,%q<step_done_at>)][if(strlen(get(%0/JOB`CHECK`%i0`SCENE)),%b[chr(183)] scene [get(%0/JOB`CHECK`%i0`SCENE)])],if(u({{jobs}}/FUN`STEP`ISSCENE,%0,%i0),%b[chr(183)] +job/scene [get(%0/JOB`NUM)]=<scene>))],%b,%r)
      # A bucket's checklist (%0, as stored) as one line, for +bucket.

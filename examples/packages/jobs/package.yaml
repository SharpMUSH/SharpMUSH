      INC`DO`ENTRY: |-
        think [setq(entry,inc(firstof(get(%q<jo>/ENTRIES),0)))]; &ENTRIES %q<jo>=%q<entry>; &ENTRY`%q<entry>`KIND %q<jo>=%q<kind>; &ENTRY`%q<entry>`BY %q<jo>=[firstof(%q<author>,%q<actor>)]; &ENTRY`%q<entry>`AT %q<jo>=[secs()]; &ENTRY`%q<entry>`TEXT %q<jo>=%q<text>; &ENTRY`%q<entry>`FORMAT %q<jo>=[if(strmatch(%q<fmt>,softcode),softcode)]; &ENTRY`%q<entry>`ACTION %q<jo>=%q<action>; &UPDATED`AT %q<jo>=[secs()]; @if strmatch(%q<kind>,reply)={&PUBLIC`AT %q<jo>=[secs()]}; &READ`[u({{jobs}}/FUN`KEY,firstof(%q<author>,%q<actor>))] %q<jo>=[secs()]
      # A line in the job's log (%q<logtext>, %q<logcode>), which staff read with +job/all.
      INC`DO`LOG: |-
        think [setq(le,inc(firstof(get(%q<jo>/ENTRIES),0)))]; &ENTRIES %q<jo>=%q<le>; &ENTRY`%q<le>`KIND %q<jo>=action; &ENTRY`%q<le>`BY %q<jo>=%q<actor>; &ENTRY`%q<le>`AT %q<jo>=[secs()]; &ENTRY`%q<le>`TEXT %q<jo>=%q<logtext>; &ENTRY`%q<le>`ACTION %q<jo>=%q<logcode>; &UPDATED`AT %q<jo>=[secs()]
      # Files a job: %q<actor> (the filer), %q<fb> (bucket objid), %q<title>, %q<text>, %q<fmt>, %q<how>,
      # %q<prio> (optional) and %q<author> (who wrote the opening text, when not the filer). Leaves %q<n>
      # and %q<jo>.
      INC`DO`FILE: |-
        think [setq(n,inc(firstof(get({{store}}/COUNTER),0)))]; &COUNTER {{store}}=%q<n>; think [setq(jo,objid(create(Job %q<n>)))]; @tel %q<jo>={{store}}; @set %q<jo>=NO_COMMAND; &INDEX`%q<n> {{store}}=%q<jo>; &NUM %q<jo>=%q<n>; &BUCKET %q<jo>=%q<fb>; &TITLE %q<jo>=%q<title>; &STATE %q<jo>=new; &PRIORITY %q<jo>=[firstof(%q<prio>,get(%q<fb>/PRIORITY),normal)]; &FILED`AT %q<jo>=[secs()]; &FILED`BY %q<jo>=%q<actor>; &TURN`AT %q<jo>=[secs()]; &DUE %q<jo>=[u({{jobs}}/FUN`DUE`DEFAULT,%q<fb>)]; think [setq(kind,reply)][setq(action,)]; @include {{jobs}}/INC`DO`ENTRY; think [setq(_fa,%q<actor>)][setq(actor,firstof(%q<author>,%q<actor>))][setq(smsg,u({{jobs}}/FUN`MSG,%q<jo>,%q<actor>,if(strlen(%q<author>),opened,filed)))][setq(pmsg,if(strlen(%q<author>),u({{jobs}}/FUN`PMSG,%q<jo>,%q<author>,opened)))][setq(mail,t(strlen(%q<author>)))][setq(mailtext,%q<text>)][setq(mailforce,0)]; @include/nobreak {{jobs}}/INC`DO`NOTIFY; think [setq(actor,%q<_fa>)]; @trigger %q<fb>/ON`FILE=%q<n>,%q<actor>,%q<title>,[firstof(%q<how>,command)]
      # A reply or staff note (%q<kind>) on %q<jo>, with the turn and reopening rules of +job/reply.

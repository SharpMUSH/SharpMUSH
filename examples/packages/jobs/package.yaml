      # WEB`MANAGE's delete for bucket %0, named %q<manage_name>, holding %q<manage_job_count> jobs.
      WEB`MANAGE`DELETE: |-
        u({{jobs}}/WEB`ELEMENT`MARKDOWN,if(%q<manage_job_count>,Deleting %q<manage_name> moves its [u({{jobs}}/FUN`TEXT`JOBCOUNT,%q<manage_job_count>)]\, open and closed\, to the bucket you pick\, then removes the role job-admin-%q<manage_slug> and the permission softcode.jobs.%q<manage_slug>.,Deleting %q<manage_name> removes it with the role job-admin-%q<manage_slug> and the permission softcode.jobs.%q<manage_slug>.))%r[if(%q<manage_job_count>,u({{jobs}}/WEB`ELEMENT`SELECT,moveto,Move its jobs to,iter(setdiff(u({{jobs}}/WEB`BUCKET`MOVABLE),%0),get(%i0/SLUG) [name(%i0)],%b,|))%r)][u({{jobs}}/WEB`ELEMENT`SAVEBUTTON,Delete bucket,json(object,op,json(string,deletebucket),bucket,json(string,%q<manage_slug>)),error,Delete %q<manage_name>? [if(%q<manage_job_count>,Its jobs move to the bucket you picked\, and its,Its)] role and permission go with it.)]
      # The buckets a deleted bucket's jobs can move to: every one taking new jobs. The select names them by slug.
      WEB`BUCKET`MOVABLE: |-
        squish(iter(lcon({{buckets}}),if(u({{jobs}}/FUN`BUCKET`TAKING,%i0),objid(%i0))))
      # A button on a bucket page, which keeps what is typed when it fails: label %0, values %1 (a JSON

      # none, +<n>h, +<n>d, +<n>w, or a date convtime() reads. Seconds, none, or #-1.
      FUN`DUE`PARSE: |-
        setq(due_typed,edit(trim(lcstr(%0)),+,,%b,))[switch(1,t(match(none clear,%q<due_typed>)),none,cand(isint(left(%q<due_typed>,dec(strlen(%q<due_typed>)))),match(h d w,right(%q<due_typed>,1))),add(secs(),mul(left(%q<due_typed>,dec(strlen(%q<due_typed>))),switch(right(%q<due_typed>,1),h,3600,w,604800,86400))),isint(setr(due_converted,convtime(%0))),%q<due_converted>,#-1)]
      FUN`PRIORITY`PARSE: |-
        switch(lcstr(trim(%0)),low,low,green,low,normal,normal,yellow,normal,high,high,red,high,)
      FUN`OUTCOME`HOOK: |-
        switch(%0,approved,APPROVE,denied,DENY,completed,COMPLETE,canceled,CANCEL)
      # A handler is a person (JOB`HANDLER`<key>) or every holder of a role (JOB`HROLE`<role>).
      FUN`HANDLER`ATTRIBUTE: |-
        if(strmatch(%0,role:*),JOB`HROLE`[after(%0,:)],JOB`HANDLER`[u({{jobs}}/FUN`PERSON`KEY,%0)])
      FUN`HANDLER`NAME: |-
        if(strmatch(%0,role:*),+[after(%0,:)],name(%0))
      # Job %0, HANDLER, WATCHER or HELPER: the objids (and role:<role> handlers).
      FUN`HANDLER`LIST: |-
        trim(iter(lattr(%0/JOB`%1`*),u({{jobs}}/FUN`PERSON`OBJID,last(%i0,`))) [if(strmatch(%1,HANDLER),iter(lattr(%0/JOB`HROLE`*),role:[lcstr(last(%i0,`))]))])
      FUN`HANDLER`NAMES: |-
        setq(handler_names,iter(u({{jobs}}/FUN`HANDLER`LIST,%0,%2),if(strmatch(%i0,role:*),+[after(%i0,:)],u({{jobs}}/FUN`PERSON`NAME,%i0,%0,%1)),%b,|))[if(strlen(%q<handler_names>),itemize(%q<handler_names>,|),Nobody)]
      # A bare [text] in a message is text, not a help link; [text](url) stays a link.
      DATA`REGEX`BRACKET: |-
        \[([^\]\[\n]*)\](?![(\[])
      DATA`REGEX`BRACKETREPLACE: |-
        \[$1\]
      # Messages are stored as typed. A markdown one turns %r (a line break), %t and %b into what they stand for, and escapes bare [text], before rendering.
      FUN`MESSAGE`MARKDOWN: |-
        regreplace(edit(%0,\%r,space(2)%r,\%R,space(2)%r,\%t,%t,\%b,space(1)),get({{jobs}}/DATA`REGEX`BRACKET),get({{jobs}}/DATA`REGEX`BRACKETREPLACE))
      # Job %0 entry %1 at width %2: markdown rendered, or a softcode message exactly as typed.
      FUN`MESSAGE`BODY: |-
        if(strmatch(get(%0/JOB`ENTRY`%1`FORMAT),softcode),get(%0/JOB`ENTRY`%1`TEXT),rendermarkdown(u({{jobs}}/FUN`MESSAGE`MARKDOWN,get(%0/JOB`ENTRY`%1`TEXT)),%2))

      # ---- how long a bucket takes ---------------------------------------------------
      # Measured, not set: each bucket keeps how long its latest jobs waited for staff's first answer
      # (STATS`ANSWER) and to close (STATS`CLOSE), in seconds, DATA`CONFIG`WAIT-SAMPLE of each. A job
      # staff filed, a /query and an approval at once are left out (JOB`STATS`SKIP on the job).
      # List %0 with %1 added at the end, cut to the latest DATA`CONFIG`WAIT-SAMPLE. With no %1, the
      # samples a lowered setting still counts.
      FUN`STATS`ADD: |-
        setqm(stats_list,squish(%0 %1),
        stats_sample,get({{jobs}}/DATA`CONFIG`WAIT-SAMPLE))[extract(%q<stats_list>,max(1,sub(words(%q<stats_list>),dec(%q<stats_sample>))),%q<stats_sample>)]
      # The median of bucket %0's STATS`%1 (ANSWER or CLOSE), in seconds, once three jobs have been measured.
      FUN`WAIT`OF: |-
        if(gte(words(setr(wait_samples,u({{jobs}}/FUN`STATS`ADD,get(%0/STATS`%1),))),3),round(lmath(median,%q<wait_samples>),0))
      # %0 seconds in words: under an hour, about 5 hours, about 3 days.
      FUN`TIME`DURATION: |-
        switch(1,lt(%0,3600),under an hour,lt(%0,129600),about [setr(duration_hours,max(1,round(fdiv(%0,3600),0)))] hour[if(neq(%q<duration_hours>,1),s)],about [setr(duration_days,round(fdiv(%0,86400),0))] day[if(neq(%q<duration_days>,1),s)])
      # How soon bucket %0 answers a new job: at once when it approves at once (unless %1 is 1), what it

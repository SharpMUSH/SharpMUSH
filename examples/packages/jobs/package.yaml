format: "1.16"
package: jobs
title: "Jobs"
version: 1.13.2
authors: [SharpMUSH]
description: "Jobs: requests from players to staff, worked in buckets, with the +job/+request commands players of AnomalyJobs and Volund's job system know, and the routes the jobs-app portal application reads."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [jobs, requests, tickets, staff, anomaly]
category: Staff
requires_server: ">=0.1"

# plus-help carries the +help topics; plus-config the +config settings;
# http-handler owns the GET/POST verb routers the portal routes hang off.
depends:
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: http-handler
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

# Who works which bucket is a permission, so it moves with roles. softcode.jobs.admin works every
# bucket and manages them; softcode.jobs.<bucket> works one. Each comes with a role a game assigns:
# @role/assign <player>=job-admin, or =job-admin-applications. The wizard and royalty roles are
# granted softcode.jobs.admin below; God and administrator holders hold them all.
categories:
  roles:
    - name: Jobs
      description: Roles for the people who work the job queue.
  permissions:
    - name: Jobs
      description: Working the job queue and its buckets.
permissions:
  - name: softcode.jobs.admin
    category: Jobs
    description: Work every bucket's jobs, delete jobs, and create, change and remove buckets.
  - name: softcode.jobs.applications
    category: Jobs
    description: Work the Applications bucket's jobs and change its settings.
  - name: softcode.jobs.requests
    category: Jobs
    description: Work the Requests bucket's jobs and change its settings.
  - name: softcode.jobs.building
    category: Jobs
    description: Work the Building bucket's jobs and change its settings.
  - name: softcode.jobs.bugs
    category: Jobs
    description: Work the Bugs bucket's jobs and change its settings.
  - name: softcode.jobs.plots
    category: Jobs
    description: Work the Plots bucket's jobs and change its settings.
  - name: softcode.jobs.feedback
    category: Jobs
    description: Work the Feedback bucket's jobs and change its settings.
  - name: softcode.jobs.staff
    category: Jobs
    description: Work the Staff bucket's jobs and change its settings.
roles:
  - slug: job-admin
    name: Job Admin
    category: Jobs
    priority: 12
    permissions:
      softcode.jobs.admin: allow
  - slug: job-admin-applications
    name: Job Admin - Applications
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.applications: allow
  - slug: job-admin-requests
    name: Job Admin - Requests
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.requests: allow
  - slug: job-admin-building
    name: Job Admin - Building
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.building: allow
  - slug: job-admin-bugs
    name: Job Admin - Bugs
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.bugs: allow
  - slug: job-admin-plots
    name: Job Admin - Plots
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.plots: allow
  - slug: job-admin-feedback
    name: Job Admin - Feedback
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.feedback: allow
  - slug: job-admin-staff
    name: Job Admin - Staff
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.staff: allow

# Indexes on what the lists filter by, so a list reads the jobs it can show instead of every job
# ever filed (FUN`SELECT`CANDIDATES). Only things carry them; the lists still check each job is in the store.
# Wizards and royalty work every bucket. A game that takes this back with
# @role/clear wizard=softcode.jobs.admin keeps it that way through updates.
grants:
  wizard: [softcode.jobs.admin]
  royalty: [softcode.jobs.admin]
attributes:
  JOB`STATE:
    index: type:thing
  JOB`BUCKET:
    index: type:thing
  JOB`AUDIT`STATE:
    index: type:thing
  JOB`DUE:
    index: numeric type:thing

objects:
  # The command object. WIZARD because it creates and changes the job objects, adds the commands
  # (@command/add, @hook) and defines a new bucket's permission and role. Every $-command it carries
  # is an @hook/override/inline target of a command STARTUP adds with /noparse/rsnoparse, so what a
  # player types reaches the code exactly as typed: a /softcode message keeps its brackets and
  # percent signs, and nothing a player wrote is ever evaluated.
  #
  # Every reference to this object is {{jobs}}, never %!, because the portal routes on the HTTP
  # handler @include the same INC`DO` attributes, and there %! is the handler.
  #
  # Trees: CMD` the hooked commands, INC`JOB` / INC`BUCKET` one per switch, INC`NEED` the guards
  # those share, INC`DO` the writes (shared with the portal routes and the API), INC`API` the API,
  # FUN` reads, TRIG` what the timer and the event handler start, WEB` the portal's pages and actions,
  # DATA` fixed data and DATA`CONFIG` the +config settings.
  - ref: jobs
    type: thing
    name: Jobs
    flags: [WIZARD]
    attributes:
      # ---- configuration --------------------------------------------------------
      # The settings +config shows and changes (plus-config): the value, then what +config needs to explain
      # and check it. Code reads each with get({{jobs}}/DATA`CONFIG`<NAME>).
      DATA`CONFIG:
        value: |-
          How the job queue files, measures and tidies its buckets.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Jobs
      # Where +request files when no bucket is named, and where +job/query opens a job.
      DATA`CONFIG`DEFAULT-BUCKET: |-
        Requests
      DATA`CONFIG`DEFAULT-BUCKET`TYPE: |-
        text
      DATA`CONFIG`DEFAULT-BUCKET`DEFAULT: |-
        Requests
      DATA`CONFIG`DEFAULT-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`DEFAULT-BUCKET`DESCRIPTION: |-
        The bucket +request files in when none is named, and +job/query opens jobs in.
      DATA`CONFIG`DEFAULT-BUCKET`LABEL: |-
        Default bucket
      DATA`CONFIG`DEFAULT-BUCKET`EXAMPLE: |-
        Requests
      # +bug, +typo, +pitch and +apply each file in one bucket: CMD`SHORTCUT reads DATA`CONFIG`<word>-BUCKET.
      DATA`CONFIG`BUG-BUCKET: |-
        Bugs
      DATA`CONFIG`BUG-BUCKET`TYPE: |-
        text
      DATA`CONFIG`BUG-BUCKET`DEFAULT: |-
        Bugs
      DATA`CONFIG`BUG-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`BUG-BUCKET`DESCRIPTION: |-
        The bucket +bug files in.
      DATA`CONFIG`BUG-BUCKET`LABEL: |-
        +bug bucket
      DATA`CONFIG`BUG-BUCKET`EXAMPLE: |-
        Bugs
      DATA`CONFIG`TYPO-BUCKET: |-
        Building
      DATA`CONFIG`TYPO-BUCKET`TYPE: |-
        text
      DATA`CONFIG`TYPO-BUCKET`DEFAULT: |-
        Building
      DATA`CONFIG`TYPO-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`TYPO-BUCKET`DESCRIPTION: |-
        The bucket +typo files in.
      DATA`CONFIG`TYPO-BUCKET`LABEL: |-
        +typo bucket
      DATA`CONFIG`TYPO-BUCKET`EXAMPLE: |-
        Building
      DATA`CONFIG`PITCH-BUCKET: |-
        Plots
      DATA`CONFIG`PITCH-BUCKET`TYPE: |-
        text
      DATA`CONFIG`PITCH-BUCKET`DEFAULT: |-
        Plots
      DATA`CONFIG`PITCH-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`PITCH-BUCKET`DESCRIPTION: |-
        The bucket +pitch files in.
      DATA`CONFIG`PITCH-BUCKET`LABEL: |-
        +pitch bucket
      DATA`CONFIG`PITCH-BUCKET`EXAMPLE: |-
        Plots
      DATA`CONFIG`APPLY-BUCKET: |-
        Applications
      DATA`CONFIG`APPLY-BUCKET`TYPE: |-
        text
      DATA`CONFIG`APPLY-BUCKET`DEFAULT: |-
        Applications
      DATA`CONFIG`APPLY-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`APPLY-BUCKET`DESCRIPTION: |-
        The bucket +apply files in.
      DATA`CONFIG`APPLY-BUCKET`LABEL: |-
        +apply bucket
      DATA`CONFIG`APPLY-BUCKET`EXAMPLE: |-
        Applications
      # Where a report of a profile gallery image from the web portal files (TRIG`GALLERY`REPORT, below).
      DATA`CONFIG`GALLERY-BUCKET: |-
        Staff
      DATA`CONFIG`GALLERY-BUCKET`TYPE: |-
        text
      DATA`CONFIG`GALLERY-BUCKET`DEFAULT: |-
        Staff
      DATA`CONFIG`GALLERY-BUCKET`CHECK: |-
        CHECK`CONFIG`BUCKET
      DATA`CONFIG`GALLERY-BUCKET`DESCRIPTION: |-
        The bucket a report of a profile gallery image from the web portal files in.
      DATA`CONFIG`GALLERY-BUCKET`LABEL: |-
        Gallery report bucket
      DATA`CONFIG`GALLERY-BUCKET`EXAMPLE: |-
        Staff
      # How many of a bucket's latest jobs its measured wait counts (FUN`STATS`ADD).
      DATA`CONFIG`WAIT-SAMPLE: |-
        25
      DATA`CONFIG`WAIT-SAMPLE`TYPE: |-
        integer
      DATA`CONFIG`WAIT-SAMPLE`DEFAULT: |-
        25
      DATA`CONFIG`WAIT-SAMPLE`MIN: |-
        3
      DATA`CONFIG`WAIT-SAMPLE`MAX: |-
        200
      DATA`CONFIG`WAIT-SAMPLE`DESCRIPTION: |-
        How many of a bucket's latest jobs its usual wait is measured over.
      DATA`CONFIG`WAIT-SAMPLE`LABEL: |-
        Wait measured over
      DATA`CONFIG`WAIT-SAMPLE`EXAMPLE: |-
        50
      # How many jobs a bucket being deleted moves per queue entry; the rest move in the next one.
      DATA`CONFIG`MOVE-BATCH: |-
        10
      DATA`CONFIG`MOVE-BATCH`TYPE: |-
        integer
      DATA`CONFIG`MOVE-BATCH`DEFAULT: |-
        10
      DATA`CONFIG`MOVE-BATCH`MIN: |-
        1
      DATA`CONFIG`MOVE-BATCH`MAX: |-
        100
      DATA`CONFIG`MOVE-BATCH`DESCRIPTION: |-
        How many jobs a bucket being deleted moves at a time.
      DATA`CONFIG`MOVE-BATCH`LABEL: |-
        Jobs moved at a time
      DATA`CONFIG`MOVE-BATCH`EXAMPLE: |-
        20
      # Time between the checks for overdue jobs and for closed jobs past their bucket's keep (TRIG`TICK).
      DATA`CONFIG`CHECK-INTERVAL: |-
        300
      DATA`CONFIG`CHECK-INTERVAL`TYPE: |-
        duration
      DATA`CONFIG`CHECK-INTERVAL`DEFAULT: |-
        300
      DATA`CONFIG`CHECK-INTERVAL`MIN: |-
        30
      DATA`CONFIG`CHECK-INTERVAL`DESCRIPTION: |-
        How often the queue checks for overdue jobs and removes closed jobs past their bucket's keep.
      DATA`CONFIG`CHECK-INTERVAL`LABEL: |-
        Check every
      DATA`CONFIG`CHECK-INTERVAL`EXAMPLE: |-
        10m
      # The first reply a new job gets from its bucket (ACKNOWLEDGE): what each +bucket/create bucket
      # starts with. Each bucket keeps its own, so emptying one sends none.
      DATA`CONFIG`ACKNOWLEDGE: |-
        Thanks. Staff have your request and will answer here.
      DATA`CONFIG`ACKNOWLEDGE`TYPE: |-
        text
      DATA`CONFIG`ACKNOWLEDGE`DEFAULT: |-
        Thanks. Staff have your request and will answer here.
      DATA`CONFIG`ACKNOWLEDGE`MAX: |-
        500
      DATA`CONFIG`ACKNOWLEDGE`DESCRIPTION: |-
        The first reply every job in a new bucket gets, until +bucket/set changes the bucket's own.
      DATA`CONFIG`ACKNOWLEDGE`LABEL: |-
        New bucket's first reply
      DATA`CONFIG`ACKNOWLEDGE`EXAMPLE: |-
        Thanks. We have your request.
      # The closing message of a job approved as it is filed, in a bucket that approves at once.
      DATA`CONFIG`AUDIT-TEXT: |-
        Approved at once. Staff look over approvals like this one afterwards, and may undo it.
      DATA`CONFIG`AUDIT-TEXT`TYPE: |-
        text
      DATA`CONFIG`AUDIT-TEXT`DEFAULT: |-
        Approved at once. Staff look over approvals like this one afterwards, and may undo it.
      DATA`CONFIG`AUDIT-TEXT`MAX: |-
        500
      DATA`CONFIG`AUDIT-TEXT`DESCRIPTION: |-
        The closing message of a job approved as soon as it is filed.
      DATA`CONFIG`AUDIT-TEXT`LABEL: |-
        Approved-at-once message
      DATA`CONFIG`AUDIT-TEXT`EXAMPLE: |-
        Approved. Staff check these later.
      # The +config check of a bucket setting: %0 names a bucket, or the reason it does not.
      CHECK`CONFIG`BUCKET: |-
        if(strlen(u({{jobs}}/FUN`BUCKET`FIND,%0)),,There is no bucket called %0. +buckets lists them.)

      # The bucket hooks, each an ON`<name> attribute on every bucket.
      DATA`HOOK`NAMES: |-
        FILE REPLY CLAIM TURN APPROVE DENY COMPLETE CANCEL REOPEN TRANSFER DUE PRIORITY OVERDUE DELETE CHECK REVERT
      # What +bucket/create writes on a new bucket.
      DATA`HOOK`DOC`FILE: |-
        @@ {Runs after a job is filed in this bucket. %<job> (%0): job number. %<filer> (%1): objid of whoever filed it. %<title> (%2): the job's title. %<how> (%3): how it was filed: command, query, portal or api. Example, thanking the filer: @pemit %<filer>=Thanks. Staff answer [name(me)] jobs within [get(me/TURNAROUND)] days.}
      DATA`HOOK`DOC`REPLY: |-
        @@ {Runs after someone writes on a job in this bucket. %<job> (%0): job number. %<actor> (%1): objid of the writer. %<entry> (%2): number of the new entry. %<public> (%3): 1 for a public reply, 0 for a staff-only note. Example, telling a staff channel about public replies: @if %<public>=@cemit Staff=Job %<job> has a new reply.}
      DATA`HOOK`DOC`CLAIM: |-
        @@ {Runs after a handler is added to or removed from a job in this bucket. %<job> (%0): job number. %<actor> (%1): objid of whoever did it. %<handler> (%2): the handler, an objid or role:<role>. %<added> (%3): 1 when added, 0 when removed. Example, telling a new handler: @if %<added>=@pemit %<handler>=You now handle job %<job>.}
      DATA`HOOK`DOC`TURN: |-
        @@ {Runs after a job in this bucket changes whose turn it is. %<job> (%0): job number. %<actor> (%1): objid of whoever acted. %<from> (%2): the old state. %<to> (%3): the new state: new, staff, player or held. Example, nudging the filer: @if strmatch(%<to>,player)=@pemit [job(%<job>,filer)]=Staff are waiting on you about job %<job>.}
      DATA`HOOK`DOC`APPROVE: |-
        @@ {Runs after a job in this bucket is approved. %<job> (%0): job number. %<actor> (%1): objid of whoever approved it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the approval text. Example: @pemit %<filer>=Your job %<job> was approved.}
      DATA`HOOK`DOC`DENY: |-
        @@ {Runs after a job in this bucket is denied. %<job> (%0): job number. %<actor> (%1): objid of whoever denied it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @pemit %<filer>=Your job %<job> was denied. +job %<job> says why.}
      DATA`HOOK`DOC`COMPLETE: |-
        @@ {Runs after a job in this bucket is completed. %<job> (%0): job number. %<actor> (%1): objid of whoever completed it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example, posting to a channel: @cemit Staff=Job %<job> is done.}
      DATA`HOOK`DOC`CANCEL: |-
        @@ {Runs after a job in this bucket is canceled. %<job> (%0): job number. %<actor> (%1): objid of whoever canceled it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example: @pemit %<filer>=Job %<job> is canceled.}
      DATA`HOOK`DOC`REOPEN: |-
        @@ {Runs after a closed job in this bucket opens again. %<job> (%0): job number. %<actor> (%1): objid of whoever reopened it. %<byfiler> (%2): 1 when the filer reopened it by replying, 0 when staff did. Example: @if %<byfiler>=@cemit Staff=Job %<job> was reopened by its filer.}
      DATA`HOOK`DOC`TRANSFER: |-
        @@ {Runs on both buckets after a job moves between them. %<job> (%0): job number. %<actor> (%1): objid of whoever moved it. %<from> (%2): objid of the old bucket. %<to> (%3): objid of the new bucket. Example: @pemit [job(%<job>,filer)]=Job %<job> moved to [name(%<to>)].}
      DATA`HOOK`DOC`DUE: |-
        @@ {Runs after a job's due date in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old due date, in seconds, or empty. %<new> (%3): the new one, or empty. Example: @if strlen(%<new>)=@pemit %<actor>=Job %<job> is due [convsecs(%<new>)].}
      DATA`HOOK`DOC`PRIORITY: |-
        @@ {Runs after a job's priority in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old priority. %<new> (%3): the new one: low, normal or high. Example: @if strmatch(%<new>,high)=@cemit Staff=Job %<job> is now high priority.}
      DATA`HOOK`DOC`OVERDUE: |-
        @@ {Runs once when a job in this bucket passes its due date while waiting on staff. %<job> (%0): job number. %1: empty, since nobody acted. %<due> (%2): the due date, in seconds. Example, telling the job's handlers: @dolist [job(%<job>,handlers)]=@pemit ##=Job %<job> is overdue.}
      DATA`HOOK`DOC`DELETE: |-
        @@ {Runs after a job in this bucket is deleted. %<job> (%0): job number. %<actor> (%1): objid of whoever deleted it. %<title> (%2): the job's title. Example: @cemit Staff=Job %<job> was deleted by [name(%<actor>)].}
      DATA`HOOK`DOC`CHECK: |-
        @@ {Runs after a checklist step of a job in this bucket is ticked or unticked, by staff or by attaching a scene log. %<job> (%0): job number. %<actor> (%1): objid of whoever did it. %<step> (%2): the step's number. %<done> (%3): 1 when ticked, 0 when unticked. Example, telling the handlers once every step is done: @if cand(%<done>,eq(job(%<job>,done),job(%<job>,steps)))=@dolist [job(%<job>,handlers)]=@pemit ##=Every step of job %<job> is done.}
      DATA`HOOK`DOC`REVERT: |-
        @@ {Runs after staff revert a job this bucket approved at once (+bucket/set <bucket>/audit=yes). Undo here what ON`APPROVE did. %<job> (%0): job number. %<actor> (%1): objid of whoever reverted it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @role/unassign %<filer>=approved; @pemit %<filer>=Job %<job> was reverted. +job %<job> says why.}
      # Switch spellings from AnomalyJobs and Volund that mean a switch with another name here.
      # /add and /comment are staff-only notes, /tag watches, /revive reopens, /bucket moves, /esc sets the
      # priority. approve, deny, complete and cancel share one routine.
      DATA`ALIAS`ADD: |-
        note
      DATA`ALIAS`COMMENT: |-
        note
      DATA`ALIAS`TAG: |-
        watch
      DATA`ALIAS`UNTAG: |-
        unwatch
      DATA`ALIAS`REVIVE: |-
        reopen
      DATA`ALIAS`BUCKET: |-
        trans
      DATA`ALIAS`ESC: |-
        priority
      DATA`ALIAS`APPROVE: |-
        close
      DATA`ALIAS`DENY: |-
        close
      DATA`ALIAS`COMPLETE: |-
        close
      DATA`ALIAS`CANCEL: |-
        close
      DATA`ALIAS`READ: |-
        view
      DATA`ALIAS`VIEW: |-
        view
      # What +bucket/set says about a value it refuses.
      DATA`SETTING`NAMES: |-
        description turnaround reopen anonymous hidden priority keep acknowledge audit checklist
      DATA`SETTING`DESCRIPTION: |-
        A description is up to 200 characters.
      DATA`SETTING`TURNAROUND: |-
        Turnaround is the number of days staff have to answer a new job, 0 for no due date.
      DATA`SETTING`REOPEN: |-
        Reopen is the number of days after closing that the filer's reply opens a job again, 0 for never.
      DATA`SETTING`ANONYMOUS: |-
        Anonymous is none, filer (staff do not see who filed) or staff (players do not see staff names).
      DATA`SETTING`HIDDEN: |-
        Hidden is yes or no. Only the people who work a hidden bucket see it.
      DATA`SETTING`PRIORITY: |-
        Priority is low, normal or high.
      DATA`SETTING`KEEP: |-
        Keep is how many days closed jobs stay, or empty to keep them forever.
      DATA`SETTING`ACKNOWLEDGE: |-
        Acknowledge is the first reply every new job gets, up to 500 characters. Empty sends none.
      DATA`SETTING`AUDIT: |-
        Audit is yes or no. With yes, a job filed here is approved at once and staff check it afterwards.
      DATA`SETTING`CHECKLIST: |-
        Checklist is up to 20 steps of up to 100 characters, separated by |. Start a step with scene: to ask for a scene log. Empty has none.

      # ---- commands -------------------------------------------------------------
      # +job, +jobs, +myjob, +myjobs, +ticket and +tickets: one command. Which word is typed changes
      # nothing; what a person sees and may do comes from their permissions and the job. %1 is the
      # switches, %2 what follows, both exactly as typed.
      CMD`JOB:
        value: |-
          $(?is)^\+(?\:my)?(?\:jobs?|tickets?)(/\S*)?(?\: +(.*))?$: think u({{jobs}}/FUN`COMMAND`PARSE,%1,%2)[setq(cmd_switch_matched,u({{jobs}}/FUN`SWITCH`MATCH,%q<cmd_switch>,JOB))]; @assert cor(not(strlen(%q<cmd_switch>)),strlen(%q<cmd_switch_matched>))=@pemit %#=notice(JOBS,uargs({{jobs}}/FUN`ERROR`SWITCH,switch,%q<cmd_switch>,kind,JOB,command,+job,topic,jobs commands),warn); think setqm(cmd_switch,%q<cmd_switch_matched>,
          cmd_route,u({{jobs}}/FUN`COMMAND`ROUTE,%q<cmd_switch>,%q<cmd_argument>)); @assert cor(not(strlen(%q<cmd_page>)),member(get({{jobs}}/DATA`PAGE`ROUTES),%q<cmd_route>))=@pemit %#=notice(JOBS,if(strlen(%q<cmd_switch>),+job/%q<cmd_switch>,+job <#>) takes no page number.,warn); @include {{jobs}}/INC`JOB`%q<cmd_route>
        flags: [REGEXP]
      # +request [<bucket>/]<title>=<text>. What comes before the first / names a bucket only when it is
      # a bucket's full name, so "+request Help w/ exits=..." is a title in the default bucket.
      CMD`REQUEST:
        value: |-
          $(?is)^\+request(/\S*)?(?\: +(.*))?$: think u({{jobs}}/FUN`COMMAND`PARSE,%1,%2); @break strmatch(%q<cmd_switch>,draft)={@include {{jobs}}/INC`DRAFT}; @assert not(strlen(%q<cmd_switch>%q<cmd_page>))=@pemit %#=notice(JOBS,+request has no /%q<cmd_switch>%q<cmd_page> switch. Add /softcode to show your text as typed.,warn); @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_left_side>))=@pemit %#=notice(JOBS,+request [chr(91)]<bucket>/[chr(93)]<title>=<text>,warn); think setq(file_bucket,if(strmatch(%q<cmd_left_side>,*/*),u({{jobs}}/FUN`BUCKET`SEEN,before(%q<cmd_left_side>,/),%#))); @include/args {{jobs}}/INC`FILE`CHECKED=bucket,firstof(%q<file_bucket>,u({{jobs}}/FUN`BUCKET`FIND,get({{jobs}}/DATA`CONFIG`DEFAULT-BUCKET))),title,if(strlen(%q<file_bucket>),trim(after(%q<cmd_left_side>,/)),%q<cmd_left_side>),text,%q<cmd_right_side>
        flags: [REGEXP]
      # +bug, +typo, +pitch and +apply <title>=<text>: +request into a set bucket (DATA`CONFIG`<word>-BUCKET).
      CMD`SHORTCUT:
        value: |-
          $(?is)^\+(bug|typo|pitch|apply)(/\S*)?(?\: +(.*))?$: think u({{jobs}}/FUN`COMMAND`PARSE,%2,%3); @assert not(strlen(%q<cmd_switch>%q<cmd_page>))=@pemit %#=notice(JOBS,+[lcstr(%1)] has no /%q<cmd_switch>%q<cmd_page> switch.,warn); @assert strlen(%q<cmd_argument>)=@pemit %#=notice(JOBS,+[lcstr(%1)] <title>=<text>,warn); @include/args {{jobs}}/INC`FILE`CHECKED=bucket,u({{jobs}}/FUN`BUCKET`FIND,get({{jobs}}/DATA`CONFIG`%1-BUCKET)),title,if(%q<cmd_has_equals>,%q<cmd_left_side>,left(%q<cmd_argument>,60)),text,if(%q<cmd_has_equals>,%q<cmd_right_side>,%q<cmd_argument>)
        flags: [REGEXP]
      # +buckets lists buckets, +bucket <name> shows one, and +bucket/<switch> manages them.
      CMD`BUCKET:
        value: |-
          $(?is)^\+buckets?(/\S*)?(?\: +(.*))?$: think u({{jobs}}/FUN`COMMAND`PARSE,%1,%2)[setq(cmd_switch_matched,u({{jobs}}/FUN`SWITCH`MATCH,%q<cmd_switch>,BUCKET))]; @assert cor(not(strlen(%q<cmd_switch>)),strlen(%q<cmd_switch_matched>))=@pemit %#=notice(JOBS,uargs({{jobs}}/FUN`ERROR`SWITCH,switch,%q<cmd_switch>,kind,BUCKET,command,+bucket,topic,buckets),warn); @assert not(strlen(%q<cmd_page>))=@pemit %#=notice(JOBS,+bucket takes no page number.,warn); think setqm(cmd_switch,%q<cmd_switch_matched>,
          cmd_route,firstof(%q<cmd_switch>,if(strlen(%q<cmd_argument>),info,list))); @include {{jobs}}/INC`BUCKET`%q<cmd_route>
        flags: [REGEXP]

      # ---- parsing --------------------------------------------------------------
      # %0 switches, %1 the argument, both raw. Sets %q<cmd_switch> (the first switch that is not /softcode or
      # /markdown), %q<cmd_page> (a last switch of digits, as in +jobs/old/2, or nothing), %q<text_format>, %q<cmd_argument>,
      # %q<cmd_left_side> and %q<cmd_right_side> around the first =, %q<cmd_has_equals> (1 when there was an =), %q<actor_key> (the actor's key)
      # and %q<actor>.
      FUN`COMMAND`PARSE: |-
        setqm(cmd_switch_list,lcstr(trim(edit(%0,/,%b))),
        cmd_page,if(regmatch(last(%q<cmd_switch_list>),^\[0-9\]+$),last(%q<cmd_switch_list>)),
        cmd_switch_list,if(strlen(%q<cmd_page>),ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>)),%q<cmd_switch_list>),
        text_format,if(member(iter(%q<cmd_switch_list>,u({{jobs}}/FUN`SWITCH`FORMAT,%i0)),softcode),softcode,markdown),
        cmd_switch,first(trim(iter(%q<cmd_switch_list>,if(strlen(u({{jobs}}/FUN`SWITCH`FORMAT,%i0)),,%i0)))),
        cmd_argument,trim(%1),
        cmd_has_equals,strmatch(%1,*=*),
        cmd_left_side,trim(before(%1,=)),
        cmd_right_side,trim(after(%1,=)),

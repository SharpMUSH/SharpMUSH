      FUN`PMSG: |-
        [ansi(h,JOBS:)] [u({{jobs}}/FUN`WHO`AS,%1,%0,0,0)] %2 your job [get(%0/NUM)]: [get(%0/TITLE)]. +job [get(%0/NUM)] shows it.
      # Tells staff (%q<smsg>: handlers, watchers, and everyone connected who works the bucket) and the
      # filer and helpers (%q<pmsg>, when the change is theirs to see), never the actor. Mails the filer
      # the public ones (%q<mail>) unless they turned job mail off and this is not a /mail (%q<mailforce>).
      INC`DO`NOTIFY: |-
        think [setq(_nb,get(%q<jo>/BUCKET))][setq(_st,setdiff(setunion(iter(u({{jobs}}/FUN`HLIST,%q<jo>,HANDLER) [u({{jobs}}/FUN`HLIST,%q<jo>,WATCHER)],if(strmatch(%i0,role:*),,%i0)),iter(lwho(),if(u({{jobs}}/FUN`CAN`WORK,%q<_nb>,%i0),objid(%i0)))),%q<actor>))][setq(_pt,if(strlen(%q<pmsg>),setdiff(setunion(get(%q<jo>/FILED`BY),u({{jobs}}/FUN`HLIST,%q<jo>,HELPER)),%q<actor> %q<_st>)))][setq(_fb,get(%q<jo>/FILED`BY))]; @dolist/inline %q<_st>=@pemit ##=%q<smsg>; @dolist/inline %q<_pt>=@pemit ##=%q<pmsg>; @if cand(strlen(%q<pmsg>),%q<mail>,not(strmatch(%q<_fb>,%q<actor>)),cor(%q<mailforce>,not(strmatch(get({{store}}/OPT`MAIL`[u({{jobs}}/FUN`KEY,%q<_fb>)]),off))))={think [mailsend(%q<_fb>,Job [get(%q<jo>/NUM)]: [edit(get(%q<jo>/TITLE),/,-)]/%q<pmsg>%r%r[firstof(%q<mailtext>,)])]}

      # ---- buckets --------------------------------------------------------------
      # Buckets %0 as person %1 sees them; a * marks one they work.
      FUN`BTABLE: |-
        [datacolumns(json(object,delim,json(string,%r),nowrap,json(string,1%r2),min,json(string,%r%r12)),Bucket%r[iter(%0,[name(%i0)][if(u({{jobs}}/FUN`CAN`WORK,%i0,%1),*)],,%r)],>Open%r[iter(%0,words(u({{jobs}}/FUN`SELECT,%1,BUCKET,%i0)),,%r)],What it is for%r[iter(%0,edit(get(%i0/DESCRIPTION),%r,%b),,%r)])]

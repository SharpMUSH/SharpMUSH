        think [setq(b,get(%q<jo>/BUCKET))][setq(n,get(%q<jo>/NUM))][setq(astaff,u({{jobs}}/FUN`CAN`WORK,get(%q<jo>/BUCKET),%q<actor>))][setq(wasclosed,strmatch(get(%q<jo>/STATE),closed))][setq(action,)][setq(author,)]; @include {{jobs}}/INC`DO`ENTRY; think [setq(rentry,%q<entry>)][setq(byp,1)]; @if cand(strmatch(%q<kind>,reply),%q<wasclosed>,not(%q<astaff>))={@include/nobreak {{jobs}}/INC`DO`REOPEN}; think [setq(to,if(cand(strmatch(%q<kind>,reply),not(t(match(closed held,get(%q<jo>/STATE))))),if(%q<astaff>,player,staff)))]; @include/nobreak {{jobs}}/INC`DO`TURN; think [setq(smsg,u({{jobs}}/FUN`MSG,%q<jo>,%q<actor>,if(strmatch(%q<kind>,note),added a staff note to,replied to)))][setq(pmsg,if(strmatch(%q<kind>,reply),u({{jobs}}/FUN`PMSG,%q<jo>,%q<actor>,replied to)))][setq(mail,1)][setq(mailtext,%q<text>)]; @include/nobreak {{jobs}}/INC`DO`NOTIFY; @trigger %q<b>/ON`REPLY=%q<n>,%q<actor>,%q<rentry>,[if(strmatch(%q<kind>,reply),1,0)]
      # Moves %q<jo> to state %q<to>; nothing when it is there already. Include with /nobreak.
      INC`DO`TURN: |-
        @break cor(not(strlen(%q<to>)),strmatch(get(%q<jo>/STATE),%q<to>)); think [setq(from,get(%q<jo>/STATE))][setq(logtext,Moved from [u({{jobs}}/FUN`STATE`NAME,%q<from>)] to [u({{jobs}}/FUN`STATE`NAME,%q<to>)].)][setq(logcode,state:%q<to>)]; &STATE %q<jo>=%q<to>; &TURN`AT %q<jo>=[secs()]; @include {{jobs}}/INC`DO`LOG; @trigger [get(%q<jo>/BUCKET)]/ON`TURN=[get(%q<jo>/NUM)],%q<actor>,%q<from>,%q<to>
      # Opens closed %q<jo> again, waiting on staff with a fresh due date. %q<byp> 1 when its filer did it. Include with /nobreak.
      INC`DO`REOPEN: |-
        @break not(strmatch(get(%q<jo>/STATE),closed)); &OUTCOME %q<jo>=; &CLOSED`AT %q<jo>=; &STATE %q<jo>=staff; &TURN`AT %q<jo>=[secs()]; &OVERDUE`FIRED %q<jo>=; &DUE %q<jo>=[u({{jobs}}/FUN`DUE`DEFAULT,get(%q<jo>/BUCKET))]; think [setq(logtext,Opened again.)][setq(logcode,reopen)]; @include {{jobs}}/INC`DO`LOG; @trigger [get(%q<jo>/BUCKET)]/ON`REOPEN=[get(%q<jo>/NUM)],%q<actor>,[if(%q<byp>,1,0)]
      # Closes %q<jo> with %q<outcome> (approved, denied, completed, canceled) and the public %q<text>.
      INC`DO`CLOSE: |-
        think [setq(b,get(%q<jo>/BUCKET))][setq(n,get(%q<jo>/NUM))][setq(kind,reply)][setq(text,firstof(%q<text>,[capstr(%q<outcome>)].))][setq(fmt,firstof(%q<fmt>,markdown))][setq(action,outcome:%q<outcome>)][setq(author,)][setq(hk,u({{jobs}}/FUN`OUTCOME`HOOK,%q<outcome>))]; @include {{jobs}}/INC`DO`ENTRY; &STATE %q<jo>=closed; &OUTCOME %q<jo>=%q<outcome>; &CLOSED`AT %q<jo>=[secs()]; &TURN`AT %q<jo>=[secs()]; think [setq(smsg,u({{jobs}}/FUN`MSG,%q<jo>,%q<actor>,%q<outcome>))][setq(pmsg,u({{jobs}}/FUN`PMSG,%q<jo>,%q<actor>,%q<outcome>))][setq(mail,1)][setq(mailtext,%q<text>)]; @include/nobreak {{jobs}}/INC`DO`NOTIFY; @trigger %q<b>/ON`%q<hk>=%q<n>,%q<actor>,[get(%q<jo>/FILED`BY)],%q<entry>
      # Adds (%q<add> 1) or removes handler %q<who>: an objid or role:<role>. A new job someone claims needs staff.

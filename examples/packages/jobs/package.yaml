        actor,objid(%<actor>)); @assert cand(strlen(%q<job_object>),strlen(%q<actor>),strlen(%<text>)); @include/args {{jobs}}/INC`DO`REPLY=kind,note,text,%<text>,format,firstof(%<format>,markdown),mailforce,0
      # @trigger/inline/nobreak/args Jobs/INC`API`CLOSE=job,<#>,actor,<actor>,outcome,<approved|denied|completed|canceled>[,text,<text>]

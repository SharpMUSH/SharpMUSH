        @@ {Runs after a job in this bucket changes whose turn it is. %<job> (%0): job number. %<actor> (%1): objid of whoever acted. %<from> (%2): the old state. %<to> (%3): the new state: new, staff, player or held. Example, nudging the filer: @if strmatch(%<to>,player)=@pemit [job(%<job>,filer)]=Staff are waiting on you about job %<job>.}
      ON`APPROVE: |-
        @@ {Runs after a job in this bucket is approved. %<job> (%0): job number. %<actor> (%1): objid of whoever approved it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the approval text. Example: @pemit %<filer>=Your job %<job> was approved.}
      ON`DENY: |-
        @@ {Runs after a job in this bucket is denied. %<job> (%0): job number. %<actor> (%1): objid of whoever denied it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @pemit %<filer>=Your job %<job> was denied. +job %<job> says why.}
      ON`COMPLETE: |-
        @@ {Runs after a job in this bucket is completed. %<job> (%0): job number. %<actor> (%1): objid of whoever completed it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example, posting to a channel: @cemit Staff=Job %<job> is done.}
      ON`CANCEL: |-
        @@ {Runs after a job in this bucket is canceled. %<job> (%0): job number. %<actor> (%1): objid of whoever canceled it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the closing text. Example: @pemit %<filer>=Job %<job> is canceled.}
      ON`REOPEN: |-
        @@ {Runs after a closed job in this bucket opens again. %<job> (%0): job number. %<actor> (%1): objid of whoever reopened it. %<byfiler> (%2): 1 when the filer reopened it by replying, 0 when staff did. Example: @if %<byfiler>=@cemit Staff=Job %<job> was reopened by its filer.}
      ON`TRANSFER: |-
        @@ {Runs on both buckets after a job moves between them. %<job> (%0): job number. %<actor> (%1): objid of whoever moved it. %<from> (%2): objid of the old bucket. %<to> (%3): objid of the new bucket. Example: @pemit [job(%<job>,filer)]=Job %<job> moved to [name(%<to>)].}
      ON`DUE: |-
        @@ {Runs after a job's due date in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old due date, in seconds, or empty. %<new> (%3): the new one, or empty. Example: @if strlen(%<new>)=@pemit %<actor>=Job %<job> is due [convsecs(%<new>)].}
      ON`PRIORITY: |-
        @@ {Runs after a job's priority in this bucket changes. %<job> (%0): job number. %<actor> (%1): objid of whoever changed it. %<old> (%2): the old priority. %<new> (%3): the new one: low, normal or high. Example: @if strmatch(%<new>,high)=@cemit Staff=Job %<job> is now high priority.}
      ON`OVERDUE: |-
        @@ {Runs once when a job in this bucket passes its due date while waiting on staff. %<job> (%0): job number. %1: empty, since nobody acted. %<due> (%2): the due date, in seconds. Example, telling the job's handlers: @dolist [job(%<job>,handlers)]=@pemit ##=Job %<job> is overdue.}
      ON`DELETE: |-
        @@ {Runs after a job in this bucket is deleted. %<job> (%0): job number. %<actor> (%1): objid of whoever deleted it. %<title> (%2): the job's title. Example: @cemit Staff=Job %<job> was deleted by [name(%<actor>)].}
      ON`CHECK: |-
        @@ {Runs after a checklist step of a job in this bucket is ticked or unticked, by staff or by attaching a scene log. %<job> (%0): job number. %<actor> (%1): objid of whoever did it. %<step> (%2): the step's number. %<done> (%3): 1 when ticked, 0 when unticked. Example, telling the handlers once every step is done: @if cand(%<done>,eq(job(%<job>,done),job(%<job>,steps)))=@dolist [job(%<job>,handlers)]=@pemit ##=Every step of job %<job> is done.}
      ON`REVERT: |-
        @@ {Runs after staff revert a job this bucket approved at once (+bucket/set <bucket>/audit=yes). Undo here what ON`APPROVE did. %<job> (%0): job number. %<actor> (%1): objid of whoever reverted it. %<filer> (%2): objid of whoever filed it. %<entry> (%3): number of the entry holding the reason. Example: @role/unassign %<filer>=approved; @pemit %<filer>=Job %<job> was reverted. +job %<job> says why.}


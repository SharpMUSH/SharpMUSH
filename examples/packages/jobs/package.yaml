      INC`JOB`UNWATCH: |-
        @include {{jobs}}/INC`NEED`JOB; @assert hasattr(%q<job_object>,JOB`WATCHER`%q<actor_key>)=@pemit %#=notice(JOBS,You don't watch job %q<job_number>.,warn); &JOB`WATCHER`%q<actor_key> %q<job_object>; @pemit %#=notice(JOBS,You no longer watch job %q<job_number>.,ok)
      # A helper reads the public side of a job and replies to it, as the filer does. Staff and the filer

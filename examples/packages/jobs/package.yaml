      # ---- reads ----------------------------------------------------------------
      # A person's key in attribute names: their objid with # dropped and : as _.
      FUN`PERSON`KEY: |-
        edit(objid(%0),#,,:,_)
      FUN`PERSON`OBJID: |-
        #[edit(%0,_,:)]
      # %0 a player's name as %1 typed it, as an objid, or nothing. me is %1, as it is for a command typed

      # Whether a closed job %0 still opens again on its filer's reply: its bucket reopens (not 0) and the
      # job closed within that many days.
      FUN`CAN`REOPEN: |-
        cand(gt(firstof(get(get(%0/JOB`BUCKET)/REOPEN),0),0),lte(sub(secs(),get(%0/JOB`CLOSED`AT)),mul(86400,firstof(get(get(%0/JOB`BUCKET)/REOPEN),0))))
      # Job %0, person %1: the filer or a helper, who read the public side of a job and reply to it.
      FUN`IS`PARTY: |-
        cor(strmatch(get(%0/JOB`FILED`BY),objid(%1)),hasattr(%0,JOB`HELPER`[u({{jobs}}/FUN`PERSON`KEY,%1)]))
      FUN`CAN`SEE: |-
        cor(u({{jobs}}/FUN`CAN`WORK,get(%0/JOB`BUCKET),%1),u({{jobs}}/FUN`IS`PARTY,%0,%1))
      # How person %0 on job %1 is named to %2. A bucket can hide the filer (ANONYMOUS filer) from
      # everyone else, or staff names (ANONYMOUS staff) from the people who do not work it. You always see
      # your own name. FUN`PERSON`NAMEAS takes the viewer as two answers: %<staff> (works the bucket) and
      # %<self> (is %<person>), for %<person> on %<job>.
      FUN`PERSON`NAME: |-
        uargs({{jobs}}/FUN`PERSON`NAMEAS,person,%0,job,%1,staff,u({{jobs}}/FUN`CAN`WORK,get(%1/JOB`BUCKET),%2),self,strmatch(%0,objid(%2)))
      # A bucket writing (an acknowledgement, an approval at once) is named as itself.

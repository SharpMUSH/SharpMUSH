        @include {{jobs}}/INC`NEED`ENTRY; @assert strmatch(get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`BY),%q<actor>)=@pemit %#=notice(JOBS,You can only edit your own messages.,error); @assert cand(%q<cmd_has_equals>,strmatch(%q<cmd_right_side>,*/*),strlen(before(%q<cmd_right_side>,/)))=@pemit %#=notice(JOBS,+job/edit %q<job_number>/%q<entry_shown>=<old text>/<new text>,warn); @assert isint(pos(before(%q<cmd_right_side>,/),get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`TEXT)))=@pemit %#=notice(JOBS,Message %q<entry_shown> on job %q<job_number> has no "[before(%q<cmd_right_side>,/)]" in it. Nothing changed.,warn); &JOB`ENTRY`%q<entry_stored>`TEXT %q<job_object>=edit(get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`TEXT),before(%q<cmd_right_side>,/),after(%q<cmd_right_side>,/)); &JOB`ENTRY`%q<entry_stored>`EDITED %q<job_object>=secs(); @pemit %#=notice(JOBS,Message %q<entry_shown> on job %q<job_number> is changed.,ok)
      # /format <#>/<entry>=markdown|softcode: how one message shows. The text is untouched.
      INC`JOB`FORMAT: |-
        @include {{jobs}}/INC`NEED`ENTRY; @assert cor(%q<actor_is_staff>,strmatch(get(%q<job_object>/JOB`ENTRY`%q<entry_stored>`BY),%q<actor>))=@pemit %#=notice(JOBS,Only its author or staff can change how a message shows.,error); @assert match(markdown softcode,setr(text_format,lcstr(%q<cmd_right_side>)))=@pemit %#=notice(JOBS,+job/format %q<job_number>/%q<entry_shown>=markdown or softcode,warn); @include/args {{jobs}}/INC`DO`FORMAT=entry,%q<entry_stored>,format,%q<text_format>; @pemit %#=notice(JOBS,Message %q<entry_shown> on job %q<job_number> shows as %q<text_format>.,ok)
      # /create <bucket>/<title>=<text>: staff open a job of their own.
      INC`JOB`CREATE: |-
        @assert cand(%q<cmd_has_equals>,strmatch(%q<cmd_left_side>,*/*))=@pemit %#=notice(JOBS,+job/create <bucket>/<title>=<text>,warn); @assert strlen(setr(file_bucket,u({{jobs}}/FUN`BUCKET`FIND,before(%q<cmd_left_side>,/))))=@pemit %#=notice(JOBS,There is no bucket called [before(%q<cmd_left_side>,/)].,warn); @assert u({{jobs}}/FUN`CAN`WORK,%q<file_bucket>,%#)=@pemit %#=notice(JOBS,Only staff who work the [name(%q<file_bucket>)] bucket can open a job in it.,error); @include/args {{jobs}}/INC`FILE`CHECKED=bucket,%q<file_bucket>,title,trim(after(%q<cmd_left_side>,/)),text,%q<cmd_right_side>
      # /query <player>/<title>=<text>: staff ask a player something. The job is the player's, waiting on them.
      INC`JOB`QUERY: |-
        @assert cand(%q<cmd_has_equals>,strmatch(%q<cmd_left_side>,*/*))=@pemit %#=notice(JOBS,+job/query <player>/<title>=<text>,warn); @assert strlen(setr(target_player,u({{jobs}}/FUN`PERSON`FIND,before(%q<cmd_left_side>,/),%#)))=@pemit %#=notice(JOBS,I don't know a player called [before(%q<cmd_left_side>,/)].,warn); @assert strlen(setr(file_bucket,u({{jobs}}/FUN`BUCKET`FIND,get({{jobs}}/DATA`CONFIG`DEFAULT-BUCKET))))=@pemit %#=notice(JOBS,There is no [get({{jobs}}/DATA`CONFIG`DEFAULT-BUCKET)] bucket.,warn); @assert u({{jobs}}/FUN`CAN`WORK,%q<file_bucket>,%#)=@pemit %#=notice(JOBS,Only staff who work the [name(%q<file_bucket>)] bucket can open a job for a player.,error); @assert cand(strlen(setr(job_title,trim(after(%q<cmd_left_side>,/)))),strlen(%q<cmd_right_side>))=@pemit %#=notice(JOBS,+job/query <player>/<title>=<text>,warn); @include/args {{jobs}}/INC`DO`FILE=filer,objid(%q<target_player>),author,%q<actor>,priority,,bucket,%q<file_bucket>,title,%q<job_title>,text,%q<cmd_right_side>,format,%q<text_format>,how,query; @include/args {{jobs}}/INC`DO`CLAIM=handler,%q<actor>,add,1; @include/nobreak/args {{jobs}}/INC`DO`TURN=to,player; @pemit %#=notice(JOBS,Opened job %q<job_number> for [name(%q<target_player>)]: %q<job_title>,ok)
      # Each person turns job @mail on or off. Staff /mail reaches them either way.
      INC`JOB`OPTIONS: |-

        @assert strmatch(%0,get({{jobs}}/DATA`TICK`RUN)); @dolist/inline u({{jobs}}/FUN`DUE`NOW)={@include/nobreak/args {{jobs}}/INC`TICK`OVERDUE=job,##}; @dolist/inline u({{jobs}}/FUN`JOB`EXPIRED)={&INDEX`[get(##/JOB`NUM)] {{store}}; @tel ##={{jobs}}; @nuke ##}; @wait get({{jobs}}/DATA`CONFIG`CHECK-INTERVAL)=@trigger {{jobs}}/TRIG`TICK=%0

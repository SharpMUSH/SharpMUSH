        [{"kind":"field","key":"bucket","label":"Bucket","type":"select","validation":{"required":true}},{"kind":"field","key":"title","label":"Title","type":"text","validation":{"required":true,"max_length":80}},{"kind":"field","key":"text","label":"What do you need?","type":"textarea","validation":{"required":true}},{"kind":"field","key":"softcode","label":"Show exactly as typed","type":"boolean","default":false}]
      FORM`FIELD: |-
        trim(iter(lnum(0,dec(json_query(get({{jobs}}/FORM),size))),if(strmatch(u({{jobs}}/FORM`VALUE,json_query(get({{jobs}}/FORM),get,%i0),key),%0),json_query(get({{jobs}}/FORM),get,%i0)),%b,%r))
      FORM`VALUE: |-
        setq(form_raw,json_query(%0,get,%1))[if(strmatch(%q<form_raw>,"*),json_query(%q<form_raw>,unescape),%q<form_raw>)]
      FORM`VALIDATE: |-

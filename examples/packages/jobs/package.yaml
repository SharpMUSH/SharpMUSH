      # The new-request form. Its hidden op field makes the submit a file.
      WEB`SCHEMA`NEW: |-
        [setq(_n1,json(object,kind,json(string,field),key,json(string,op),type,json(string,hidden),default,json(string,file)))][setq(_no,u({{jobs}}/WEB`ARR,iter(u({{jobs}}/WEB`FILEABLE,%0),u({{jobs}}/WEB`OPT,name(%i0),[name(%i0)]: [get(%i0/DESCRIPTION)]),%b,%r)))][setq(_n2,json(object,kind,json(string,field),key,json(string,bucket),label,json(string,Bucket),type,json(string,select),options,%q<_no>,default,json(string,get({{jobs}}/DATA`DEFAULT`BUCKET))))][setq(_n3,json(object,kind,json(string,field),key,json(string,title),label,json(string,Title),type,json(string,text),validation,json(object,required,json(boolean,true),max_length,json(number,80))))][setq(_n4,json(object,kind,json(string,field),key,json(string,text),label,json(string,What do you need?),type,json(string,textarea),help,json(string,get({{jobs}}/DATA`WEB`MDHELP)),validation,json(object,required,json(boolean,true))))][setq(_n5,json(object,kind,json(string,field),key,json(string,softcode),label,json(string,Show exactly as typed),type,json(string,boolean),help,json(string,get({{jobs}}/DATA`WEB`CODEHELP))))][setq(_ns,u({{jobs}}/WEB`SEC,,1,%q<_n1>%r%q<_n2>%r%q<_n3>%r%q<_n4>%r%q<_n5>))][u({{jobs}}/WEB`DOC,form,New request,%q<_ns>,json(object,submit,u({{jobs}}/WEB`ACTION)))]
      DATA`WEB`MDHELP: |-

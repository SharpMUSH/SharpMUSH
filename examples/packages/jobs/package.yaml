      INC`JOB`ADDHELPER: |-
        @include {{jobs}}/INC`NEED`JOB; @assert cor(%q<actor_is_staff>,strmatch(get(%q<job_object>/JOB`FILED`BY),%q<actor>))=@pemit %#=notice(JOBS,Only staff or whoever filed job %q<job_number> can add helpers.,error); @assert strlen(%q<cmd_right_side>)=@pemit %#=notice(JOBS,+job/%q<cmd_switch> %q<job_number>=<player>,warn); @assert strlen(setr(target_player,u({{jobs}}/FUN`PERSON`FIND,%q<cmd_right_side>,%#)))=@pemit %#=notice(JOBS,I don't know a player called %q<cmd_right_side>.,warn); @assert not(u({{jobs}}/FUN`IS`PARTY,%q<job_object>,%q<target_player>))=@pemit %#=notice(JOBS,name(%q<target_player>) can read and answer job %q<job_number> already.,warn); &JOB`HELPER`[u({{jobs}}/FUN`PERSON`KEY,%q<target_player>)] %q<job_object>=secs(); @include/args {{jobs}}/INC`DO`LOG=line,Helper added: [name(%q<target_player>)].,code,helper; @pemit %#=notice(JOBS,name(%q<target_player>) can read and answer job %q<job_number> now.,ok)
      INC`JOB`REMHELPER: |-

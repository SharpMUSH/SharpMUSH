        setqm(api_bucket,if(strlen(%0),u({{jobs}}/FUN`BUCKET`FIND,%0)),
        api_state,lcstr(firstof(%1,open)))[u({{jobs}}/FUN`SORT`NEWEST,squish(iter(if(strlen(%0),u({{jobs}}/FUN`SELECT`INDEXED,JOB`BUCKET,=,%q<api_bucket>),switch(%q<api_state>,all,lcon({{store}}),open,u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,>,closed),u({{jobs}}/FUN`SELECT`INDEXED,JOB`STATE,=,%q<api_state>))),if(cand(u({{jobs}}/FUN`IS`STORED,%i0),cor(not(strlen(%0)),strmatch(get(%i0/JOB`BUCKET),%q<api_bucket>)),switch(%q<api_state>,all,1,open,not(strmatch(get(%i0/JOB`STATE),closed)),strmatch(get(%i0/JOB`STATE),%q<api_state>)),u({{jobs}}/FUN`CALLER`OK,%i0,%@)),get(%i0/JOB`NUM)))))]

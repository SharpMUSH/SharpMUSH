        [json(array,json(object,key,json(string,num),label,json(string,#),link,json(string,/apps/jobs/\{number\})),json(object,key,json(string,title),label,json(string,Title),link,json(string,/apps/jobs/\{number\})),json(object,key,json(string,unread),label,json(string,),type,json(string,chip),color_key,json(string,unread_color)),json(object,key,json(string,bucket),label,json(string,Bucket)),json(object,key,json(string,status),label,json(string,Status),type,json(string,chip),color_key,json(string,color)),json(object,key,json(string,priority),label,json(string,Priority)),json(object,key,json(string,updated),label,json(string,Updated)))]
      # The queue for viewer %0: filter %1, or the open jobs of the bucket whose slug is %2, titled with

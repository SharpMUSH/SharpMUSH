        setq(api_job,u({{jobs}}/FUN`JOB`FIND,%0))[if(not(cand(strlen(%q<api_job>),u({{jobs}}/FUN`CALLER`OK,%q<api_job>,%@))),#-1 NO SUCH JOB,squish(iter(lnum(1,firstof(get(%q<api_job>/JOB`ENTRIES),0)),if(uargs({{jobs}}/FUN`ENTRY`VISIBLE,job,%q<api_job>,entry,%i0,staff,u({{jobs}}/FUN`CAN`WORK,get(%q<api_job>/JOB`BUCKET),firstof(%1,%@))),%i0))))]
      # @trigger/inline/nobreak/args Jobs/INC`API`FILE=player,<player>,bucket,<bucket>,title,<title>,text,<text>

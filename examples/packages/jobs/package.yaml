format: 1.2
package: jobs
version: 1.1.1
authors: [SharpMUSH]
description: "Jobs: requests from players to staff, worked in buckets, with the +job/+request commands players of AnomalyJobs and Volund's job system know, and the routes the jobs-app portal application reads."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [jobs, requests, tickets, staff, anomaly]
requires_server: ">=0.1"

# plus-help carries the +help topics;
# http-handler owns the GET/POST verb routers the portal routes hang off.
depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: http-handler
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

# Who works which bucket is a permission, so it moves with roles. softcode.jobs.admin works every
# bucket and manages them; softcode.jobs.<bucket> works one. Each comes with a role a game assigns:
# @role/assign <player>=job-admin, or =job-admin-applications. Nobody holds a custom permission
# until something allows it, wizards included; God and administrator holders hold them all.
categories:
  roles:
    - name: Jobs
      description: Roles for the people who work the job queue.
  permissions:
    - name: Jobs
      description: Working the job queue and its buckets.
permissions:
  - name: softcode.jobs.admin
    category: Jobs
    description: Work every bucket's jobs, delete jobs, and create, change and remove buckets.
  - name: softcode.jobs.applications
    category: Jobs
    description: Work the Applications bucket's jobs and change its settings.
  - name: softcode.jobs.requests
    category: Jobs
    description: Work the Requests bucket's jobs and change its settings.
  - name: softcode.jobs.building
    category: Jobs
    description: Work the Building bucket's jobs and change its settings.
  - name: softcode.jobs.bugs
    category: Jobs
    description: Work the Bugs bucket's jobs and change its settings.
  - name: softcode.jobs.plots
    category: Jobs
    description: Work the Plots bucket's jobs and change its settings.
  - name: softcode.jobs.feedback
    category: Jobs
    description: Work the Feedback bucket's jobs and change its settings.
  - name: softcode.jobs.staff
    category: Jobs
    description: Work the Staff bucket's jobs and change its settings.
roles:
  - slug: job-admin
    name: Job Admin
    category: Jobs
    priority: 12
    permissions:
      softcode.jobs.admin: allow
  - slug: job-admin-applications
    name: Job Admin - Applications
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.applications: allow
  - slug: job-admin-requests
    name: Job Admin - Requests
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.requests: allow
  - slug: job-admin-building
    name: Job Admin - Building
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.building: allow
  - slug: job-admin-bugs
    name: Job Admin - Bugs
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.bugs: allow
  - slug: job-admin-plots
    name: Job Admin - Plots
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.plots: allow
  - slug: job-admin-feedback
    name: Job Admin - Feedback
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.feedback: allow
  - slug: job-admin-staff
    name: Job Admin - Staff
    category: Jobs
    priority: 11
    permissions:
      softcode.jobs.staff: allow

objects:
  # The command object. WIZARD because it creates and changes the job objects, adds the commands
  # (@command/add, @hook) and defines a new bucket's permission and role. Every $-command it carries
  # is an @hook/override/inline target of a command STARTUP adds with /noparse/rsnoparse, so what a
  # player types reaches the code exactly as typed: a /softcode message keeps its brackets and
  # percent signs, and nothing a player wrote is ever evaluated.
  #
  # Every reference to this object is {{jobs}}, never %!, because the portal routes on the HTTP
  # handler @include the same INC`DO` attributes, and there %! is the handler.
  #
  # Trees: CMD` the hooked commands, INC`JOB` / INC`BUCKET` one per switch, INC`NEED` the guards
  # those share, INC`DO` the writes (shared with the portal routes and the API), FUN` reads,
  # DATA` configuration.
  - ref: jobs
    type: thing
    name: Jobs
    flags: [WIZARD]
    attributes:
      # ---- configuration --------------------------------------------------------
      # Where +request files when no bucket is named, and where +job/query opens a job.
      DATA`DEFAULT`BUCKET: |-
        Requests
      # +bug, +typo, +pitch and +apply each file in one bucket.
      DATA`SHORTCUT`BUG: |-
        Bugs
      DATA`SHORTCUT`TYPO: |-
        Building
      DATA`SHORTCUT`PITCH: |-
        Plots
      DATA`SHORTCUT`APPLY: |-
        Applications
      # Seconds between the checks for overdue jobs and for closed jobs past their bucket's keep.
      DATA`TICK: |-
        300
      # The bucket hooks, each an ON`<name> attribute on every bucket.
      DATA`HOOKS: |-
        FILE REPLY CLAIM TURN APPROVE DENY COMPLETE CANCEL REOPEN TRANSFER DUE PRIORITY OVERDUE DELETE
      # What +bucket/create writes on a new bucket.
      DATA`HOOKDOC`FILE: |-
        @@ {Runs after a job is filed in this bucket. %0: job number. %1: objid of whoever filed it. %2: the job's title. %3: how it was filed: command, query, portal or api. Example, thanking the filer: @pemit %1=Thanks. Staff answer [name(me)] jobs within [get(me/TURNAROUND)] days.}
      DATA`HOOKDOC`REPLY: |-
        @@ {Runs after someone writes on a job in this bucket. %0: job number. %1: objid of the writer. %2: number of the new entry. %3: 1 for a public reply, 0 for a staff-only note. Example, telling a staff channel about public replies: @if %3=@cemit Staff=Job %0 has a new reply.}
      DATA`HOOKDOC`CLAIM: |-
        @@ {Runs after a handler is added to or removed from a job in this bucket. %0: job number. %1: objid of whoever did it. %2: the handler, an objid or role:<role>. %3: 1 when added, 0 when removed. Example, telling a new handler: @if %3=@pemit %2=You now handle job %0.}
      DATA`HOOKDOC`TURN: |-
        @@ {Runs after a job in this bucket changes whose turn it is. %0: job number. %1: objid of whoever acted. %2: the old state. %3: the new state: new, staff, player or held. Example, nudging the filer: @if strmatch(%3,player)=@pemit [job(%0,filer)]=Staff are waiting on you about job %0.}
      DATA`HOOKDOC`APPROVE: |-
        @@ {Runs after a job in this bucket is approved. %0: job number. %1: objid of whoever approved it. %2: objid of whoever filed it. %3: number of the entry holding the approval text. Example: @pemit %2=Your job %0 was approved.}
      DATA`HOOKDOC`DENY: |-
        @@ {Runs after a job in this bucket is denied. %0: job number. %1: objid of whoever denied it. %2: objid of whoever filed it. %3: number of the entry holding the reason. Example: @pemit %2=Your job %0 was denied. +job %0 says why.}
      DATA`HOOKDOC`COMPLETE: |-
        @@ {Runs after a job in this bucket is completed. %0: job number. %1: objid of whoever completed it. %2: objid of whoever filed it. %3: number of the entry holding the closing text. Example, posting to a channel: @cemit Staff=Job %0 is done.}
      DATA`HOOKDOC`CANCEL: |-
        @@ {Runs after a job in this bucket is canceled. %0: job number. %1: objid of whoever canceled it. %2: objid of whoever filed it. %3: number of the entry holding the closing text. Example: @pemit %2=Job %0 is canceled.}
      DATA`HOOKDOC`REOPEN: |-
        @@ {Runs after a closed job in this bucket opens again. %0: job number. %1: objid of whoever reopened it. %2: 1 when the filer reopened it by replying, 0 when staff did. Example: @if %2=@cemit Staff=Job %0 was reopened by its filer.}
      DATA`HOOKDOC`TRANSFER: |-
        @@ {Runs on both buckets after a job moves between them. %0: job number. %1: objid of whoever moved it. %2: objid of the old bucket. %3: objid of the new bucket. Example: @pemit [job(%0,filer)]=Job %0 moved to [name(%3)].}
      DATA`HOOKDOC`DUE: |-
        @@ {Runs after a job's due date in this bucket changes. %0: job number. %1: objid of whoever changed it. %2: the old due date, in seconds, or empty. %3: the new one, or empty. Example: @if strlen(%3)=@pemit %1=Job %0 is due [convsecs(%3)].}
      DATA`HOOKDOC`PRIORITY: |-
        @@ {Runs after a job's priority in this bucket changes. %0: job number. %1: objid of whoever changed it. %2: the old priority. %3: the new one: low, normal or high. Example: @if strmatch(%3,high)=@cemit Staff=Job %0 is now high priority.}
      DATA`HOOKDOC`OVERDUE: |-
        @@ {Runs once when a job in this bucket passes its due date while waiting on staff. %0: job number. %1: empty, since nobody acted. %2: the due date, in seconds. Example, telling the job's handlers: @dolist [job(%0,handlers)]=@pemit ##=Job %0 is overdue.}
      DATA`HOOKDOC`DELETE: |-
        @@ {Runs after a job in this bucket is deleted. %0: job number. %1: objid of whoever deleted it. %2: the job's title. Example: @cemit Staff=Job %0 was deleted by [name(%1)].}
      # Switch spellings from AnomalyJobs and Volund that mean a switch with another name here.
      # /add and /comment are staff-only notes, /tag watches, /revive reopens, /bucket moves, /esc sets the
      # priority. approve, deny, complete and cancel share one routine.
      DATA`SW`ADD: |-
        note
      DATA`SW`COMMENT: |-
        note
      DATA`SW`TAG: |-
        watch
      DATA`SW`UNTAG: |-
        unwatch
      DATA`SW`REVIVE: |-
        reopen
      DATA`SW`BUCKET: |-
        trans
      DATA`SW`ESC: |-
        priority
      DATA`SW`APPROVE: |-
        close
      DATA`SW`DENY: |-
        close
      DATA`SW`COMPLETE: |-
        close
      DATA`SW`CANCEL: |-
        close
      DATA`SW`READ: |-
        view
      DATA`SW`VIEW: |-
        view
      # What +bucket/set says about a value it refuses.
      DATA`SETTINGS: |-
        description turnaround reopen anonymous hidden priority keep
      DATA`SETTING`DESCRIPTION: |-
        A description is up to 200 characters.
      DATA`SETTING`TURNAROUND: |-
        Turnaround is the number of days staff have to answer a new job, 0 for no due date.
      DATA`SETTING`REOPEN: |-
        Reopen is the number of days after closing that the filer's reply opens a job again, 0 for never.
      DATA`SETTING`ANONYMOUS: |-
        Anonymous is none, filer (staff do not see who filed) or staff (players do not see staff names).
      DATA`SETTING`HIDDEN: |-
        Hidden is yes or no. Only the people who work a hidden bucket see it.
      DATA`SETTING`PRIORITY: |-
        Priority is low, normal or high.
      DATA`SETTING`KEEP: |-
        Keep is how many days closed jobs stay, or empty to keep them forever.

      # ---- commands -------------------------------------------------------------
      # +job, +jobs, +myjob, +myjobs, +ticket and +tickets: one command. Which word is typed changes
      # nothing; what a person sees and may do comes from their permissions and the job. %1 is the
      # switches, %2 what follows, both exactly as typed.
      CMD`JOB:
        value: |-
          $(?is)^\+(?\:my)?(?\:jobs?|tickets?)(/\S*)?(?\: +(.*))?$: think [u({{jobs}}/FUN`PARSE,%1,%2)]; @assert regmatch(%q<sw>,^\[a-z\]*$)=@pemit %#=[u({{jobs}}/FUN`ERR`SWITCH,%q<sw>)]; @assert strlen(setr(route,u({{jobs}}/FUN`ROUTE,%q<sw>,%q<arg>)))=@pemit %#=[u({{jobs}}/FUN`ERR`SWITCH,%q<sw>)]; @include {{jobs}}/INC`JOB`%q<route>
        flags: [REGEXP]
      # +request [<bucket>/]<title>=<text>. What comes before the first / names a bucket only when it is
      # a bucket's full name, so "+request Help w/ exits=..." is a title in the default bucket.
      CMD`REQUEST:
        value: |-
          $(?is)^\+request(/\S*)?(?\: +(.*))?$: think [u({{jobs}}/FUN`PARSE,%1,%2)]; @assert not(strlen(%q<sw>))=@pemit %#=+request has no /%q<sw> switch. Add /softcode to show your text as typed.; @assert cand(%q<eq>,strlen(%q<lhs>))=@pemit %#=File a request with +request [chr(91)]<bucket>/[chr(93)]<title>=<text>.; think [setq(fb,if(strmatch(%q<lhs>,*/*),u({{jobs}}/FUN`BUCKET`SEEN,before(%q<lhs>,/),%#)))][setq(title,if(strlen(%q<fb>),trim(after(%q<lhs>,/)),%q<lhs>))][setq(fb,firstof(%q<fb>,u({{jobs}}/FUN`BUCKET,get({{jobs}}/DATA`DEFAULT`BUCKET))))][setq(text,%q<rhs>)]; @include {{jobs}}/INC`FILE`CHECKED
        flags: [REGEXP]
      # +bug, +typo, +pitch and +apply <title>=<text>: +request into a set bucket (DATA`SHORTCUT`<word>).
      CMD`SHORTCUT:
        value: |-
          $(?is)^\+(bug|typo|pitch|apply)(/\S*)?(?\: +(.*))?$: think [u({{jobs}}/FUN`PARSE,%2,%3)]; @assert not(strlen(%q<sw>))=@pemit %#=+[lcstr(%1)] has no /%q<sw> switch.; @assert strlen(%q<arg>)=@pemit %#=+[lcstr(%1)] <title>=<text>; think [setq(fb,u({{jobs}}/FUN`BUCKET,get({{jobs}}/DATA`SHORTCUT`%1)))][setq(title,if(%q<eq>,%q<lhs>,left(%q<arg>,60)))][setq(text,if(%q<eq>,%q<rhs>,%q<arg>))]; @include {{jobs}}/INC`FILE`CHECKED
        flags: [REGEXP]
      # +buckets lists buckets, +bucket <name> shows one, and +bucket/<switch> manages them.
      CMD`BUCKET:
        value: |-
          $(?is)^\+buckets?(/\S*)?(?\: +(.*))?$: think [u({{jobs}}/FUN`PARSE,%1,%2)][setq(route,firstof(%q<sw>,if(strlen(%q<arg>),info,list)))]; @assert cand(regmatch(%q<route>,^\[a-z\]+$),hasattr({{jobs}},INC`BUCKET`%q<route>))=@pemit %#=+bucket has no /%q<sw> switch. +help buckets lists them.; @include {{jobs}}/INC`BUCKET`%q<route>
        flags: [REGEXP]

      # ---- parsing --------------------------------------------------------------
      # %0 switches, %1 the argument, both raw. Sets %q<sw> (the first switch that is not /softcode or
      # /markdown), %q<fmt>, %q<arg>, %q<lhs> and %q<rhs> around the first =, %q<eq> (1 when there was an
      # =), %q<me> (the actor's key) and %q<actor>.
      FUN`PARSE: |-
        [setq(sws,lcstr(trim(edit(%0,/,%b))))][setq(fmt,if(member(%q<sws>,softcode),softcode,markdown))][setq(sw,first(trim(iter(%q<sws>,if(t(match(softcode markdown,%i0)),,%i0)))))][setq(arg,trim(%1))][setq(eq,strmatch(%1,*=*))][setq(lhs,trim(before(%1,=)))][setq(rhs,trim(after(%1,=)))][setq(me,u({{jobs}}/FUN`KEY,%#))][setq(actor,objid(%#))]
      # %0 switch, %1 argument. The INC`JOB` routine to run, or nothing. No switch reads a job when given
      # a number and lists otherwise; /all with a number reads a job with its log.
      FUN`ROUTE: |-
        [switch(1,not(strlen(%0)),if(isint(%1),view,list),cand(strmatch(%0,all),isint(%q<lhs>)),view,t(strlen(get({{jobs}}/DATA`SW`%0))),get({{jobs}}/DATA`SW`%0),hasattr({{jobs}},INC`JOB`%0),%0,)]
      FUN`ERR`SWITCH: |-
        +job has no /%0 switch. +help jobs commands lists them.

      # ---- reads ----------------------------------------------------------------
      # A person's key in attribute names: their objid with # dropped and : as _.
      FUN`KEY: |-
        [edit(objid(%0),#,,:,_)]
      FUN`UNKEY: |-
        #[edit(%0,_,:)]
      # The job object numbered %0, or nothing.
      FUN`JOB: |-
        [if(isint(%0),if(cand(hastype(get({{store}}/INDEX`%0),THING),not(hasflag(get({{store}}/INDEX`%0),GOING))),get({{store}}/INDEX`%0)))]
      # The bucket whose full name is %0, matched without regard to case, or nothing.
      FUN`BUCKET: |-
        [first(squish(iter(lcon({{buckets}}),if(not(comp(lcstr(name(%i0)),lcstr(trim(%0)))),objid(%i0)))))]
      # The same, unless the bucket is hidden from %1.
      FUN`BUCKET`SEEN: |-
        [setq(_b,u({{jobs}}/FUN`BUCKET,%0))][if(cand(strlen(%q<_b>),cor(not(t(get(%q<_b>/HIDDEN))),u({{jobs}}/FUN`CAN`WORK,%q<_b>,%1))),%q<_b>)]
      FUN`BUCKETS`SEEN: |-
        [sortkey({{jobs}}/FUN`NAMEKEY,squish(iter(lcon({{buckets}}),if(cor(not(t(get(%i0/HIDDEN))),u({{jobs}}/FUN`CAN`WORK,%i0,%0)),objid(%i0)))))]
      FUN`NAMEKEY: |-
        [name(%0)]
      # Bucket %0, person %1. The bucket's work and file locks decide.
      FUN`CAN`WORK: |-
        [t(elock(%0/work,%1))]
      FUN`CAN`FILE: |-
        [t(elock(%0/file,%1))]
      FUN`IS`ADMIN: |-
        [t(permission(%0,softcode.jobs.admin))]
      # Whether %1 may learn who filed job %0: anyone, unless its bucket hides the filer; then the filer,
      # a Job Admin, or the bucket's own hooks.
      FUN`FILER`SHOWN: |-
        [cor(not(strmatch(get(get(%0/BUCKET)/ANONYMOUS),filer)),strmatch(get(%0/FILED`BY),objid(%1)),u({{jobs}}/FUN`IS`ADMIN,%1),strmatch(objid(loc(%1)),{{buckets}}))]
      # Whether a closed job %0 still opens again on its filer's reply: its bucket reopens (not 0) and the
      # job closed within that many days.
      FUN`CAN`REOPEN: |-
        [cand(gt(firstof(get(get(%0/BUCKET)/REOPEN),0),0),lte(sub(secs(),get(%0/CLOSED`AT)),mul(86400,firstof(get(get(%0/BUCKET)/REOPEN),0))))]
      # Job %0, person %1: the filer or a helper, who read the public side of a job and reply to it.
      FUN`IS`PARTY: |-
        [cor(strmatch(get(%0/FILED`BY),objid(%1)),hasattr(%0,HELPER`[u({{jobs}}/FUN`KEY,%1)]))]
      FUN`CAN`SEE: |-
        [cor(u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1),u({{jobs}}/FUN`IS`PARTY,%0,%1))]
      # How person %0 on job %1 is named to %2. A bucket can hide the filer (ANONYMOUS filer) from
      # everyone else, or staff names (ANONYMOUS staff) from the people who do not work it. You always see
      # your own name. FUN`WHO`AS takes the viewer as two answers: works the bucket, is the person.
      FUN`WHO: |-
        [u({{jobs}}/FUN`WHO`AS,%0,%1,u({{jobs}}/FUN`CAN`WORK,get(%1/BUCKET),%2),strmatch(%0,objid(%2)))]
      FUN`WHO`AS: |-
        [switch(1,not(strlen(%0)),Nobody,%3,name(%0),cand(strmatch(%0,get(%1/FILED`BY)),strmatch(get(get(%1/BUCKET)/ANONYMOUS),filer)),Anonymous,cand(not(%2),strmatch(get(get(%1/BUCKET)/ANONYMOUS),staff),not(strmatch(%0,get(%1/FILED`BY)))),Staff,hastype(%0,PLAYER),name(%0),Someone)]
      # Job %0 state as the list shows it; %1 is 1 for someone who works the bucket.
      FUN`STATE`TEXT: |-
        [switch(get(%0/STATE),new,if(%1,New,With staff),staff,if(%1,Needs staff,With staff),player,if(%1,With player,Waiting on you),held,On hold,closed,capstr(get(%0/OUTCOME)),?)]
      FUN`STATE`NAME: |-
        [switch(%0,new,new,staff,needs staff,player,waiting on the player,held,on hold,closed,closed,%0)]
      # Overdue only counts while it is staff's turn, so a job waiting on its player is never overdue.
      FUN`IS`OVERDUE: |-
        [cand(t(match(new staff,get(%0/STATE))),isint(get(%0/DUE)),lt(get(%0/DUE),secs()))]
      FUN`WHEN: |-
        [if(isint(%0),timefmt($b $d $H:$M,%0),-)]
      FUN`DATE: |-
        [if(isint(%0),timefmt($b $d,%0),-)]
      # Unread is per person: anything newer than their last read that they may see.
      FUN`UNREAD: |-
        [gt(firstof(get(%0/[if(u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1),UPDATED`AT,PUBLIC`AT)]),0),firstof(get(%0/READ`[u({{jobs}}/FUN`KEY,%1)]),0))]
      FUN`DUE`DEFAULT: |-
        [if(gt(setr(_t,firstof(get(%0/TURNAROUND),0)),0),add(secs(),mul(%q<_t>,86400)))]
      # none, +<n>h, +<n>d, +<n>w, or a date convtime() reads. Seconds, none, or #-1.
      FUN`DUE`PARSE: |-
        [setq(_x,edit(trim(lcstr(%0)),+,,%b,))][switch(1,t(match(none clear,%q<_x>)),none,cand(isint(left(%q<_x>,dec(strlen(%q<_x>)))),t(match(h d w,right(%q<_x>,1)))),add(secs(),mul(left(%q<_x>,dec(strlen(%q<_x>))),switch(right(%q<_x>,1),h,3600,w,604800,86400))),isint(setr(_c,convtime(%0))),%q<_c>,#-1)]
      FUN`PRIORITY`PARSE: |-
        [switch(lcstr(trim(%0)),low,low,green,low,normal,normal,yellow,normal,high,high,red,high,)]
      FUN`OUTCOME`HOOK: |-
        [switch(%0,approved,APPROVE,denied,DENY,completed,COMPLETE,canceled,CANCEL)]
      # A handler is a person (HANDLER`<key>) or every holder of a role (HROLE`<role>).
      FUN`HATTR: |-
        [if(strmatch(%0,role:*),HROLE`[after(%0,:)],HANDLER`[u({{jobs}}/FUN`KEY,%0)])]
      FUN`HNAME: |-
        [if(strmatch(%0,role:*),+[after(%0,:)],name(%0))]
      # Job %0, HANDLER, WATCHER or HELPER: the objids (and role:<role> handlers).
      FUN`HLIST: |-
        [trim([iter(lattr(%0/%1`*),u({{jobs}}/FUN`UNKEY,last(%i0,`)))] [if(strmatch(%1,HANDLER),iter(lattr(%0/HROLE`*),role:[lcstr(last(%i0,`))]))])]
      FUN`NAMES: |-
        [setq(_n,iter(u({{jobs}}/FUN`HLIST,%0,%2),if(strmatch(%i0,role:*),+[after(%i0,:)],u({{jobs}}/FUN`WHO,%i0,%0,%1)),%b,|))][if(strlen(%q<_n>),itemize(%q<_n>,|),Nobody)]
      # A bare [text] in a message is text, not a help link; [text](url) stays a link.
      DATA`RE`BRACKET: |-
        \[([^\]\[\n]*)\](?![(\[])
      DATA`RE`BRACKETTO: |-
        \[$1\]
      # Messages are stored as typed. A markdown one turns %r (a line break), %t and %b into what they stand for, and escapes bare [text], before rendering.
      FUN`MDTEXT: |-
        [regreplace(edit(%0,\%r,[space(2)]%r,\%R,[space(2)]%r,\%t,%t,\%b,space(1)),get({{jobs}}/DATA`RE`BRACKET),get({{jobs}}/DATA`RE`BRACKETTO))]
      # Job %0 entry %1 at width %2: markdown rendered, or a softcode message exactly as typed.
      FUN`BODY: |-
        [if(strmatch(get(%0/ENTRY`%1`FORMAT),softcode),get(%0/ENTRY`%1`TEXT),rendermarkdown(u({{jobs}}/FUN`MDTEXT,get(%0/ENTRY`%1`TEXT)),%2))]

      # ---- lists ----------------------------------------------------------------
      # Every job person %0 gets from predicate FUN`P`%1 (job, person, %2).
      FUN`SELECT: |-
        [squish(iter(lcon({{store}}),if(cand(not(hasflag(%i0,GOING)),u({{jobs}}/FUN`P`%1,%i0,%0,%2)),%i0)))]
      # Needs staff, in a bucket the person works.
      FUN`P`QUEUE: |-
        [cand(t(match(new staff,get(%0/STATE))),u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))]
      # Open, and theirs.
      FUN`P`OWN: |-
        [cand(not(strmatch(get(%0/STATE),closed)),u({{jobs}}/FUN`IS`PARTY,%0,%1))]
      # What +jobs shows: the queue, and your own open jobs.
      FUN`P`DEFAULT: |-
        [cor(u({{jobs}}/FUN`P`QUEUE,%0,%1),u({{jobs}}/FUN`P`OWN,%0,%1))]
      FUN`P`OPEN: |-
        [cand(not(strmatch(get(%0/STATE),closed)),u({{jobs}}/FUN`CAN`SEE,%0,%1))]
      FUN`P`SEEN: |-
        [u({{jobs}}/FUN`CAN`SEE,%0,%1)]
      FUN`P`BUCKET: |-
        [cand(strmatch(get(%0/BUCKET),%2),u({{jobs}}/FUN`P`OPEN,%0,%1))]
      FUN`P`INBUCKET: |-
        [strmatch(get(%0/BUCKET),%2)]
      FUN`P`MINE: |-
        [cand(not(strmatch(get(%0/STATE),closed)),hasattr(%0,HANDLER`[u({{jobs}}/FUN`KEY,%1)]))]
      FUN`P`NEW: |-
        [cand(strmatch(get(%0/STATE),new),u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))]
      FUN`P`OVERDUE: |-
        [cand(u({{jobs}}/FUN`IS`OVERDUE,%0),u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))]
      FUN`P`PLAYER: |-
        [cand(strmatch(get(%0/STATE),player),u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))]
      FUN`P`HELD: |-
        [cand(strmatch(get(%0/STATE),held),u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))]
      FUN`P`WHO: |-
        [cand(u({{jobs}}/FUN`P`OPEN,%0,%1),hasattr(%0,HANDLER`[u({{jobs}}/FUN`KEY,%2)]))]
      FUN`P`FROM: |-
        [cand(strmatch(get(%0/FILED`BY),%2),u({{jobs}}/FUN`CAN`SEE,%0,%1),u({{jobs}}/FUN`FILER`SHOWN,%0,%1))]
      FUN`P`OLD: |-
        [cand(strmatch(get(%0/STATE),closed),u({{jobs}}/FUN`CAN`SEE,%0,%1),cor(not(strlen(%2)),strmatch(get(%0/BUCKET),%2)))]
      FUN`P`UNREAD: |-
        [cand(u({{jobs}}/FUN`CAN`SEE,%0,%1),u({{jobs}}/FUN`UNREAD,%0,%1))]
      # The title or any message the person may read contains %2.
      FUN`P`SEARCH: |-
        [cand(u({{jobs}}/FUN`CAN`SEE,%0,%1),cor(t(pos(lcstr(%2),lcstr(get(%0/TITLE)))),t(words(iter(lnum(1,firstof(get(%0/ENTRIES),0)),if(cand(u({{jobs}}/FUN`ENTRY`VISIBLE,%0,%i0,u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1),),t(pos(lcstr(%2),lcstr(get(%0/ENTRY`%i0`TEXT))))),%i0))))))]
      # High priority first, then whoever has waited longest for their turn.
      FUN`SORT: |-
        [sortkey({{jobs}}/FUN`SORTKEY,%0)]
      FUN`SORTKEY: |-
        [switch(get(%0/PRIORITY),high,1,low,3,2)][rjust(firstof(get(%0/TURN`AT),0),12,0)]
      # Newest first.
      FUN`SORT`NUM: |-
        [revwords(sortkey({{jobs}}/FUN`NUMKEY,%0,n))]
      FUN`NUMKEY: |-
        [get(%0/NUM)]
      # Jobs %0 for person %1, a column at a time. A * before the number marks something unread. Cells are
      # joined with %r and split on a newline, so a title holding a | stays one cell; the title wraps and
      # every other column is shown whole or, on a narrow screen, left out (Bucket and Updated first).
      FUN`TABLE: |-
        [datacolumns(json(object,delim,json(string,%r),nowrap,json(string,1%r2%r4%r5),min,json(string,%r%r12),priority,json(string,1%r2%r1%r1%r2)),>#%r[iter(%0,[if(u({{jobs}}/FUN`UNREAD,%i0,%1),*)][get(%i0/NUM)],,%r)],Bucket%r[iter(%0,name(get(%i0/BUCKET)),,%r)],Title%r[iter(%0,edit(get(%i0/TITLE),%r,%b),,%r)],Status%r[iter(%0,if(cand(setr(_w,u({{jobs}}/FUN`CAN`WORK,get(%i0/BUCKET),%1)),u({{jobs}}/FUN`IS`OVERDUE,%i0)),ansi(hr,Overdue),u({{jobs}}/FUN`STATE`TEXT,%i0,%q<_w>)),,%r)],Updated%r[iter(%0,u({{jobs}}/FUN`DATE,get(%i0/[if(u({{jobs}}/FUN`CAN`WORK,get(%i0/BUCKET),%1),UPDATED`AT,PUBLIC`AT)])),,%r)])]
      # Jobs %0 for person %1 in a box titled %2, with footer %3. No width: each reader gets their own.
      FUN`LIST: |-
        [box([if(words(%0),u({{jobs}}/FUN`TABLE,%0,%1),No jobs.)][if(strlen(%3),%r[rule()]%r%3)],%2)]
      # Lists predicate %q<sel> (with %q<selarg>) under %q<ltitle> and %q<lfoot>.
      INC`SHOW`LIST: |-
        @pemit %#=[u({{jobs}}/FUN`LIST,u({{jobs}}/FUN`SORT,u({{jobs}}/FUN`SELECT,%#,%q<sel>,%q<selarg>)),%#,%q<ltitle>,%q<lfoot>)]

      # ---- one job --------------------------------------------------------------
      # Job %0 entry %1, %2 1 for staff, %3 the mode. Replies are public, notes staff-only, and the action
      # log shows with /all and /act.
      FUN`ENTRY`VISIBLE: |-
        [switch(get(%0/ENTRY`%1`KIND),reply,not(strmatch(%3,act)),note,cand(%2,not(strmatch(%3,act))),action,cand(%2,t(match(all act,%3))),0)]
      FUN`ENTRY: |-
        [rule([u({{jobs}}/FUN`WHO,get(%0/ENTRY`%1`BY),%0,%2)][switch(get(%0/ENTRY`%1`KIND),note,%b[chr(40)]staff only[chr(41)],action,%b[chr(40)]log[chr(41)],)] [chr(183)] [u({{jobs}}/FUN`WHEN,get(%0/ENTRY`%1`AT))] [chr(183)] #%1)]%r[u({{jobs}}/FUN`BODY,%0,%1,%3)]
      # Job %0 for person %1 whose screen is %2 wide. %3: empty, all (with the log), act (the log only) or
      # last:<n>. A box: the fields, then each message under a rule naming who wrote it. Messages render at
      # the width inside the box. Staff also see Due and Watchers; fields() takes its pairs as arguments,
      # so the two readers get two calls (FUN`SHOW`FIELDS).
      FUN`SHOW: |-
        [setq(_s,u({{jobs}}/FUN`CAN`WORK,get(%0/BUCKET),%1))][setq(_v,squish(iter(lnum(1,firstof(get(%0/ENTRIES),0)),if(u({{jobs}}/FUN`ENTRY`VISIBLE,%0,%i0,%q<_s>,%3),%i0))))][if(strmatch(%3,last:*),setq(_v,revwords(extract(revwords(%q<_v>),1,after(%3,:)))))][box([u({{jobs}}/FUN`SHOW`FIELDS,%0,%1,%q<_s>)][iter(%q<_v>,%r[u({{jobs}}/FUN`ENTRY,%0,%i0,%1,max(10,sub(%2,4)))],%b,)]%r[rule()]%r+job/reply [get(%0/NUM)]=<text> answers,Job [get(%0/NUM)]: [get(%0/TITLE)])]
      # Job %0's fields for person %1; %2 is 1 for someone who works its bucket.
      FUN`SHOW`FIELDS: |-
        [setq(_st,[u({{jobs}}/FUN`STATE`TEXT,%0,%2)][if(cand(%2,u({{jobs}}/FUN`IS`OVERDUE,%0)),%b[ansi(hr,Overdue)])])][setq(_fi,[u({{jobs}}/FUN`WHEN,get(%0/FILED`AT))] by [u({{jobs}}/FUN`WHO,get(%0/FILED`BY),%0,%1)])][if(%2,fields(,Bucket,name(get(%0/BUCKET)),Status,%q<_st>,Priority,capstr(get(%0/PRIORITY)),Filed,%q<_fi>,Due,if(isint(get(%0/DUE)),u({{jobs}}/FUN`WHEN,get(%0/DUE)),None),Handlers,u({{jobs}}/FUN`NAMES,%0,%1,HANDLER),Watchers,u({{jobs}}/FUN`NAMES,%0,%1,WATCHER),Helpers,u({{jobs}}/FUN`NAMES,%0,%1,HELPER)),fields(,Bucket,name(get(%0/BUCKET)),Status,%q<_st>,Priority,capstr(get(%0/PRIORITY)),Filed,%q<_fi>,Handlers,u({{jobs}}/FUN`NAMES,%0,%1,HANDLER),Helpers,u({{jobs}}/FUN`NAMES,%0,%1,HELPER)))]

      # ---- guards ---------------------------------------------------------------
      # The job numbered %q<lhs>, as %q<jo>, %q<n>, its bucket %q<b> and %q<staff>. A job the person may
      # not see reads as missing. An @assert here ends the command that included it.
      INC`NEED`JOB: |-
        @assert isint(%q<lhs>)=@pemit %#=Which job? Give its number, as in +job 12.; @assert cand(strlen(setr(jo,u({{jobs}}/FUN`JOB,%q<lhs>))),u({{jobs}}/FUN`CAN`SEE,%q<jo>,%#))=@pemit %#=There is no job %q<lhs>.; think [setq(n,get(%q<jo>/NUM))][setq(b,get(%q<jo>/BUCKET))][setq(staff,u({{jobs}}/FUN`CAN`WORK,get(%q<jo>/BUCKET),%#))]
      INC`NEED`STAFF: |-
        @assert %q<staff>=@pemit %#=Only staff who work the [name(%q<b>)] bucket can do that.
      INC`NEED`ADMIN: |-
        @assert u({{jobs}}/FUN`IS`ADMIN,%#)=@pemit %#=Only a Job Admin can do that.
      INC`NEED`OPEN: |-
        @assert not(strmatch(get(%q<jo>/STATE),closed))=@pemit %#=Job %q<n> is closed. +job/reopen %q<n> opens it again.
      INC`NEED`TEXT: |-
        @assert cand(%q<eq>,strlen(%q<rhs>))=@pemit %#=Give the text after an =, as in +job/%q<sw> %q<n>=<text>.
      # <job>/<entry>: the message %q<ent> as well as the job.
      INC`NEED`ENTRY: |-
        think [setq(ent,trim(after(%q<lhs>,/)))][setq(lhs,trim(before(%q<lhs>,/)))]; @include {{jobs}}/INC`NEED`JOB; @assert cand(isint(%q<ent>),hasattr(%q<jo>,ENTRY`%q<ent>`KIND),u({{jobs}}/FUN`ENTRY`VISIBLE,%q<jo>,%q<ent>,%q<staff>,),not(strmatch(get(%q<jo>/ENTRY`%q<ent>`KIND),action)))=@pemit %#=Job %q<n> has no message %q<ent>. +job %q<n> numbers them.

      # ---- +job lists ------------------------------------------------------------
      # +jobs: what needs staff in the buckets you work, and your own open jobs. +jobs <bucket> (and +jobs/list <bucket>): one bucket.
      INC`JOB`LIST: |-
        @break strlen(%q<arg>)=@include {{jobs}}/INC`JOB`BUCKETLIST; think [setq(sel,DEFAULT)][setq(selarg,)][setq(ltitle,Jobs)][setq(lfoot,+job <#> reads one [chr(183)] [if(u({{jobs}}/WEB`STAFF,%#),+jobs/all lists every open job,+job/old lists your closed ones)])]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`BUCKETLIST: |-
        @assert strlen(setr(selarg,u({{jobs}}/FUN`BUCKET`SEEN,%q<arg>,%#)))=@pemit %#=There is no bucket called %q<arg>. +buckets lists them.; think [setq(sel,BUCKET)][setq(ltitle,Open jobs in [name(%q<selarg>)])][setq(lfoot,+job/old [name(%q<selarg>)] lists its closed jobs)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`ALL: |-
        think [setq(sel,OPEN)][setq(selarg,)][setq(ltitle,All open jobs)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`MINE: |-
        think [setq(sel,MINE)][setq(selarg,)][setq(ltitle,Jobs you handle)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`NEW: |-
        think [setq(sel,NEW)][setq(selarg,)][setq(ltitle,New jobs)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`OVERDUE: |-
        think [setq(sel,OVERDUE)][setq(selarg,)][setq(ltitle,Overdue jobs)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`PLAYER: |-
        think [setq(sel,PLAYER)][setq(selarg,)][setq(ltitle,Jobs waiting on players)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`HELD: |-
        think [setq(sel,HELD)][setq(selarg,)][setq(ltitle,Jobs on hold)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`SCAN: |-
        think [setq(sel,UNREAD)][setq(selarg,)][setq(ltitle,Jobs with something new)][setq(lfoot,+job/next reads the first)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`SEARCH: |-
        @assert strlen(%q<arg>)=@pemit %#=Search for what? +jobs/search <text>; think [setq(sel,SEARCH)][setq(selarg,%q<arg>)][setq(ltitle,Jobs mentioning %q<arg>)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`WHO: |-
        @assert isdbref(setr(tp,pmatch(%q<arg>)))=@pemit %#=I don't know a player called %q<arg>.; think [setq(sel,WHO)][setq(selarg,[objid(%q<tp>)])][setq(ltitle,Jobs [name(%q<tp>)] handles)][setq(lfoot,)]; @include {{jobs}}/INC`SHOW`LIST
      INC`JOB`FROM: |-
        @assert isdbref(setr(tp,pmatch(%q<arg>)))=@pemit %#=I don't know a player called %q<arg>.; @pemit %#=[u({{jobs}}/FUN`LIST,u({{jobs}}/FUN`SORT`NUM,u({{jobs}}/FUN`SELECT,%#,FROM,objid(%q<tp>))),%#,Jobs filed by [name(%q<tp>)],)]
      # +myjobs/old and +job/old [<bucket>]: closed jobs, newest first.
      INC`JOB`OLD: |-
        think [setq(selarg,if(strlen(%q<arg>),u({{jobs}}/FUN`BUCKET`SEEN,%q<arg>,%#)))]; @assert cor(not(strlen(%q<arg>)),strlen(%q<selarg>))=@pemit %#=There is no bucket called %q<arg>.; @pemit %#=[u({{jobs}}/FUN`LIST,u({{jobs}}/FUN`SORT`NUM,u({{jobs}}/FUN`SELECT,%#,OLD,%q<selarg>)),%#,Closed jobs[if(strlen(%q<selarg>),%bin [name(%q<selarg>)])],+job <#> reads one)]
      INC`JOB`NEXT: |-
        @assert words(setr(nx,u({{jobs}}/FUN`SORT,u({{jobs}}/FUN`SELECT,%#,UNREAD))))=@pemit %#=Nothing is unread.; think [setq(lhs,get(first(%q<nx>)/NUM))][setq(sw,)]; @include {{jobs}}/INC`JOB`VIEW
      INC`JOB`BRIEF: |-
        @pemit %#=[ansi(h,JOBS:)] [words(u({{jobs}}/FUN`SELECT,%#,QUEUE))] need staff, [words(u({{jobs}}/FUN`SELECT,%#,OVERDUE))] overdue, [words(u({{jobs}}/FUN`SELECT,%#,UNREAD))] unread, [words(u({{jobs}}/FUN`SELECT,%#,OWN))] of yours open.
      INC`JOB`CATCHUP: |-
        @dolist/inline [u({{jobs}}/FUN`SELECT,%#,UNREAD)]=&READ`%q<me> ##=[secs()]; @pemit %#=Every job is marked read.

      # ---- +job, reading one -------------------------------------------------------
      INC`JOB`VIEW: |-
        @include {{jobs}}/INC`NEED`JOB; @pemit %#=[u({{jobs}}/FUN`SHOW,%q<jo>,%#,width(%#),if(strmatch(%q<sw>,all),all,))]; &READ`%q<me> %q<jo>=[secs()]
      INC`JOB`LAST: |-
        @include {{jobs}}/INC`NEED`JOB; @assert isint(setr(cnt,firstof(%q<rhs>,5)))=@pemit %#=+job/last %q<n>=<how many>; @pemit %#=[u({{jobs}}/FUN`SHOW,%q<jo>,%#,width(%#),last:%q<cnt>)]; &READ`%q<me> %q<jo>=[secs()]
      INC`JOB`ACT: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @pemit %#=[u({{jobs}}/FUN`SHOW,%q<jo>,%#,width(%#),act)]
      # Who filed a job, even in a bucket that hides it.
      INC`JOB`SOURCE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`ADMIN; @pemit %#=Job %q<n> was filed by [name(get(%q<jo>/FILED`BY))] [chr(40)][get(%q<jo>/FILED`BY)][chr(41)].

      # ---- +job, writing ----------------------------------------------------------
      # A public reply. Staff replying hands the turn to the player; the filer or a helper replying hands
      # it to staff, and opens a closed job again within its bucket's reopen window.
      INC`JOB`REPLY: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`TEXT; @assert cor(%q<staff>,not(strmatch(get(%q<jo>/STATE),closed)),u({{jobs}}/FUN`CAN`REOPEN,%q<jo>))=@pemit %#=Job %q<n> [if(gt(firstof(get(%q<b>/REOPEN),0),0),closed more than [firstof(get(%q<b>/REOPEN),0)] days ago,is closed)]. File a new one with +request and mention job %q<n>.; think [setq(wasclosed,strmatch(get(%q<jo>/STATE),closed))][setq(kind,reply)][setq(text,%q<rhs>)][setq(mailforce,0)]; @include {{jobs}}/INC`DO`REPLY; @pemit %#=You replied to job %q<n>[if(cand(%q<wasclosed>,not(%q<staff>)),%band opened it again)].
      # /note, and /add and /comment: staff only.
      INC`JOB`NOTE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`TEXT; think [setq(kind,note)][setq(text,%q<rhs>)][setq(mailforce,0)]; @include {{jobs}}/INC`DO`REPLY; @pemit %#=You added a staff note to job %q<n>.
      # A public reply mailed to the filer even when they turned job mail off.
      INC`JOB`MAIL: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`TEXT; think [setq(kind,reply)][setq(text,%q<rhs>)][setq(mailforce,1)]; @include {{jobs}}/INC`DO`REPLY; @pemit %#=You replied to job %q<n> and mailed it.
      # /approve, /deny, /complete, /cancel [=<text>]. The filer may cancel their own job.
      INC`JOB`CLOSE: |-
        @include {{jobs}}/INC`NEED`JOB; think [setq(outcome,switch(%q<sw>,approve,approved,deny,denied,complete,completed,canceled))]; @assert cor(%q<staff>,cand(strmatch(%q<outcome>,canceled),u({{jobs}}/FUN`IS`PARTY,%q<jo>,%#)))=@pemit %#=Only staff who work the [name(%q<b>)] bucket can %q<sw> a job.; @include {{jobs}}/INC`NEED`OPEN; think [setq(text,%q<rhs>)]; @include {{jobs}}/INC`DO`CLOSE; @pemit %#=Job %q<n> is closed: %q<outcome>.
      # /reopen, and /revive.
      INC`JOB`REOPEN: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert strmatch(get(%q<jo>/STATE),closed)=@pemit %#=Job %q<n> is open.; think [setq(byp,0)]; @include/nobreak {{jobs}}/INC`DO`REOPEN; @pemit %#=Job %q<n> is open again and waiting on staff.
      INC`JOB`STATE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; @assert t(match(staff player held,setr(to,lcstr(%q<rhs>))))=@pemit %#=+job/state %q<n>=staff, player or held.; @include/nobreak {{jobs}}/INC`DO`TURN; @pemit %#=Job %q<n> is [u({{jobs}}/FUN`STATE`NAME,%q<to>)].
      INC`JOB`HOLD: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; think [setq(to,held)]; @include/nobreak {{jobs}}/INC`DO`TURN; @pemit %#=Job %q<n> is on hold.
      INC`JOB`CLAIM: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; @assert not(hasattr(%q<jo>,HANDLER`%q<me>))=@pemit %#=You already handle job %q<n>.; think [setq(who,%q<actor>)][setq(add,1)]; @include {{jobs}}/INC`DO`CLAIM; @pemit %#=You handle job %q<n> now.
      INC`JOB`UNCLAIM: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert hasattr(%q<jo>,HANDLER`%q<me>)=@pemit %#=You don't handle job %q<n>.; think [setq(who,%q<actor>)][setq(add,0)]; @include {{jobs}}/INC`DO`CLAIM; @pemit %#=You no longer handle job %q<n>.
      # /assign <#>=<names>: replaces the handlers. +<role> assigns every holder of a role.
      INC`JOB`ASSIGN: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; @assert strlen(%q<rhs>)=@pemit %#=+job/assign %q<n>=<players and +roles>; think [setq(hl,iter(edit(%q<rhs>,chr(44),%b),if(strmatch(%i0,+*),if(valid(rolename,lcstr(rest(%i0,+))),role:[lcstr(rest(%i0,+))],#-1),firstof(objid(pmatch(%i0)),#-1))))]; @assert not(t(member(%q<hl>,#-1)))=@pemit %#=Assign players by name and roles as +<role>.; @dolist/inline [lattr(%q<jo>/HANDLER`*)] [lattr(%q<jo>/HROLE`*)]=&## %q<jo>=; @dolist/inline %q<hl>={think [setq(who,##)][setq(add,1)]; @include {{jobs}}/INC`DO`CLAIM}; @pemit %#=Job %q<n> is handled by [u({{jobs}}/FUN`NAMES,%q<jo>,%#,HANDLER)].
      # /watch, and /tag: told of every change without handling it.
      INC`JOB`WATCH: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; &WATCHER`%q<me> %q<jo>=[secs()]; @pemit %#=You watch job %q<n>.
      INC`JOB`UNWATCH: |-
        @include {{jobs}}/INC`NEED`JOB; &WATCHER`%q<me> %q<jo>=; @pemit %#=You no longer watch job %q<n>.
      # A helper reads the public side of a job and replies to it, as the filer does.
      INC`JOB`ADDHELPER: |-
        @include {{jobs}}/INC`NEED`JOB; @assert cor(%q<staff>,strmatch(get(%q<jo>/FILED`BY),%q<actor>))=@pemit %#=Only staff or whoever filed job %q<n> can add helpers.; @assert isdbref(setr(tp,pmatch(%q<rhs>)))=@pemit %#=I don't know a player called %q<rhs>.; &HELPER`[u({{jobs}}/FUN`KEY,%q<tp>)] %q<jo>=[secs()]; think [setq(logtext,Helper added: [name(%q<tp>)].)][setq(logcode,helper)]; @include {{jobs}}/INC`DO`LOG; @pemit %#=[name(%q<tp>)] can read and answer job %q<n> now.
      INC`JOB`REMHELPER: |-
        @include {{jobs}}/INC`NEED`JOB; @assert cor(%q<staff>,strmatch(get(%q<jo>/FILED`BY),%q<actor>))=@pemit %#=Only staff or whoever filed job %q<n> can remove helpers.; @assert isdbref(setr(tp,pmatch(%q<rhs>)))=@pemit %#=I don't know a player called %q<rhs>.; &HELPER`[u({{jobs}}/FUN`KEY,%q<tp>)] %q<jo>=; @pemit %#=[name(%q<tp>)] is no longer a helper on job %q<n>.
      INC`JOB`DUE: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @include {{jobs}}/INC`NEED`OPEN; @assert %q<eq>=@pemit %#=+job/due %q<n>=<date>, +<n>d, or none; @assert not(strmatch(setr(due,u({{jobs}}/FUN`DUE`PARSE,%q<rhs>)),#-1))=@pemit %#=I can't read %q<rhs> as a date. Try +3d, +12h or none.; think [setq(due,if(strmatch(%q<due>,none),,%q<due>))]; @include {{jobs}}/INC`DO`DUE; @pemit %#=Job %q<n> is [if(strlen(%q<due>),due [u({{jobs}}/FUN`WHEN,%q<due>)],not due on any date)].
      # /priority, and /esc with green, yellow or red.
      INC`JOB`PRIORITY: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert strlen(setr(prio,u({{jobs}}/FUN`PRIORITY`PARSE,%q<rhs>)))=@pemit %#=Priority is low, normal or high (or green, yellow, red).; @include {{jobs}}/INC`DO`PRIORITY; @pemit %#=Job %q<n> is [lcstr(%q<prio>)] priority.
      INC`JOB`NAME: |-
        @include {{jobs}}/INC`NEED`JOB; @include {{jobs}}/INC`NEED`STAFF; @assert cand(strlen(%q<rhs>),lte(strlen(%q<rhs>),80))=@pemit %#=A title is 1 to 80 characters.; &TITLE %q<jo>=%q<rhs>; think [setq(logtext,Retitled.)][setq(logcode,name)]; @include {{jobs}}/INC`DO`LOG; @pemit %#=Job %q<n> is titled: %q<rhs>
      # /trans, and /bucket.
      INC`JOB`TRANS: |-

format: "1.16"
package: staff-help
title: "Staff list: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Staff list topics into +help: registers the staff package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [staff, help, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. staff keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: staff
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/staff/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: staff_help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`STAFF: |-
        {{staff/staff_help}}

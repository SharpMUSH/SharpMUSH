format: "1.16"
package: gmcp-char-config
title: "GMCP character data: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the GMCP character data settings into +config: registers them with the +config registry, so staff see and change them with +config gmcp-char."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [gmcp-char, config, bridge]
category: MUD clients
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. gmcp-char declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: gmcp-char
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/gmcp-char/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`GMCP-CHAR: |-
        {{gmcp-char/gmcp_char}}

format: "1.20"
package: scene-rooms-config
title: "Scene System: room copies +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the scene room copy settings into +config: registers them with the +config registry, so staff see and change them with +config scene-rooms."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [scene-rooms, config, bridge]
category: Scenes
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. scene-rooms declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: scene-rooms
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene-rooms/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`SCENE-ROOMS: |-
        {{scene-rooms/rooms}}

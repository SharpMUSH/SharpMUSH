format: "1.16"
package: time
title: "Time and time zones"
version: 1.5.0
authors: [SharpMUSH]
description: "+time and +timezone: the game's time and each player's own, a time converted between zones, and an IC date and clock the game sets."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [time, timezone, clock, calendar, ic]
category: Community
requires_server: ">=0.1"


objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook) and sets
  # a player's TZ attribute.
  #
  # +time and +timezone are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # A player's time zone is their TZ attribute, as PennMUSH keeps it, so time(*<player>) reads it too.
  # Everything a game sets, and every function another package reads, is on the Clock beside it.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC` one routine per command
  # form. FUN`READ` reads a typed time, FUN`SCREEN` draws each screen, FUN`DISPLAY` the shared pieces.
  # FILTER`TIME`SCREEN`<name>, when another package adds one, adds to the +time screen.
  - ref: time
    type: thing
    name: Time
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # Which INC` routine each command runs: DATA`ROUTE`<table>`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch.
      DATA: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`TIME`BARE: |-
        SHOW
      DATA`ROUTE`TIME`ARG: |-
        ARG
      DATA`ROUTE`TIMEZONE`BARE: |-
        ZONE`SHOW
      DATA`ROUTE`TIMEZONE`ARG: |-
        ZONE`SET
      DATA`ROUTE`TIMEZONE`CLEAR: |-
        ZONE`CLEAR
      DATA`ROUTE`TIMEZONE`HIDE: |-
        ZONE`HIDE
      DATA`ROUTE`TIMEZONE`UNHIDE: |-
        ZONE`UNHIDE
      DATA`ROUTE`TIMEZONE`DETECT: |-
        ZONE`DETECT
      DATA`ROUTE`TIMEZONE`MATCH: |-
        ZONE`MATCH

      # ---- commands -------------------------------------------------------------
      # Each command word: %1 the switches and %2 what follows, exactly as typed.
      CMD`TIME:
        value: |-
          $(?is)^\+time(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,time,table,TIME,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`TIMEZONE:
        value: |-
          $(?is)^\+timezone(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,timezone,table,TIMEZONE,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(TIME,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(TIME,+%q<cmd_word> has no /%q<cmd_switch> switch. +help time lists them.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word,
      # cmd_switch_list, cmd_switch, cmd_argument (spaces squeezed), cmd_route (the INC` routine to run), now
      # (secs()), viewer_zone (the player's zone, empty when they set none) and game_zone.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(squish(%3)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          now,secs(),
          viewer_zone,u({{clock}}/FUN`ZONE`CHECK,get(%#/TZ)),
          game_zone,u({{clock}}/FUN`ZONE`GAME))
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 typed text: the objid of the player it names, or nothing.
      FUN`PLAYER:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 an instant and %1 a zone: the time there and the zone's name, the way every screen shows a time.
      FUN`DISPLAY`AT:
        value: |-
          u({{clock}}/FUN`OOC`SHOW,%0,%1) [tone(muted,· [u({{clock}}/FUN`ZONE`LABEL,%1,%0)])]
        flags: [funsyntax]
      # %0 an instant: how far it is from now, as in 3h 20m or 2d ago.
      FUN`DISPLAY`FROMNOW:
        value: |-
          case(1,lt(abs(sub(%0,%q<now>)),60),now,gt(%0,%q<now>),in [trim(etime(sub(%0,%q<now>),6))],[trim(etime(sub(%q<now>,%0),6))] ago)
        flags: [funsyntax]
      # %0 seconds between two zones, %1 a name: how far ahead of or behind the reader that is.
      FUN`DISPLAY`DIFFERENCE:
        value: |-
          case(sign(%0),0,%1 keeps the same time as you,1,%1 is [u(%!/FUN`DISPLAY`HOURS,%0)] ahead of you,%1 is [u(%!/FUN`DISPLAY`HOURS,%0)] behind you)
        flags: [funsyntax]
      # %0 seconds: so many hours, 5 hours or 5.5 hours.
      FUN`DISPLAY`HOURS:
        value: |-
          fdiv(abs(%0),3600) hour[if(neq(abs(%0),3600),s)]
        flags: [funsyntax]
      # Every screen is a box() with no sides, corners or tees, as +finger's and +help's are, so a time copied
      # from a terminal carries no |.
      FUN`DISPLAY`FRAME:
        value: |-
          json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
        flags: [funsyntax]
      # The FILTER`TIME`SCREEN`<name> attributes on this object, in name order, for chain().
      FUN`DISPLAY`FILTERS:
        value: |-
          iter(lattr(%!/FILTER`TIME`SCREEN`*),%!/%i0)
        flags: [funsyntax]

      # ---- +time ----------------------------------------------------------------
      # +time: the game's time, the player's own and the IC date.
      INC`SHOW:
        value: |-
          @pemit %#=u(%!/FUN`SCREEN`NOW)
        flags: [cmdsyntax]
      FUN`SCREEN`NOW:
        value: |-
          box(chain(u(%!/FUN`DISPLAY`FILTERS),u(%!/FUN`SCREEN`NOWFIELDS),%#,%q<now>)%r[rule()]%r[tone(muted,+time <time> converts a time · +timezone <zone> sets yours)],Time,,u(%!/FUN`DISPLAY`FRAME))
        flags: [funsyntax]
      # Game time, your time and, when the game shows one, the IC date, split by a marked separator, %*<|>.
      FUN`SCREEN`NOWFIELDS:
        value: |-
          lfields(,Game time%*<|>Your time[if(get({{clock}}/DATA`CONFIG`IC-SHOW),%*<|>IC date)],[u(%!/FUN`DISPLAY`AT,%q<now>,%q<game_zone>)]%*<|>[if(strlen(%q<viewer_zone>),u(%!/FUN`DISPLAY`AT,%q<now>,%q<viewer_zone>),tone(muted,not set · +timezone <zone> sets it))][if(get({{clock}}/DATA`CONFIG`IC-SHOW),%*<|>[u({{clock}}/FUN`IC`DATE,%q<now>)])],%*<|>)
        flags: [funsyntax]
      # +time <time> or +time <name>: a time when it reads as one, or when it starts with a digit or a date and no
      # player has that name (a name may start with a digit, as 7of9 does); else a player.
      INC`ARG:
        value: |-
          think u(%!/FUN`READ`TIME,%q<cmd_argument>)[setq(read_error,u(%!/FUN`READ`ERROR))]; @break cor(not(strlen(%q<read_error>)),cand(cor(u(%!/FUN`READ`ISDATE,first(%q<cmd_argument>)),isint(left(%q<cmd_argument>,1))),not(strlen(u(%!/FUN`PLAYER,%q<cmd_argument>)))))={@include %!/INC`CONVERT}; @include %!/INC`PLAYER
        flags: [cmdsyntax]

      # ---- +time <name> -----------------------------------------------------------
      INC`PLAYER:
        value: |-
          think setq(target,u(%!/FUN`PLAYER,%q<cmd_argument>)); @assert strlen(%q<target>)=@pemit %#=notice(TIME,There is no player called '%q<cmd_argument>'.,warn); @assert cor(not(u(%!/FUN`ZONE`HIDDEN,%q<target>)),controls(%#,%q<target>))=@pemit %#=notice(TIME,[name(%q<target>)] keeps their time zone to themselves.,warn); think setq(target_zone,u({{clock}}/FUN`ZONE`CHECK,get(%q<target>/TZ))); @assert strlen(%q<target_zone>)=@pemit %#=notice(TIME,[name(%q<target>)] has not set a time zone.,warn); @pemit %#=u(%!/FUN`SCREEN`PLAYER)
        flags: [cmdsyntax]
      # The time where %q<target> is, the reader's own, and how far apart they are.
      FUN`SCREEN`PLAYER:
        value: |-
          box(lfields(,[name(%q<target>)]%*<|>You[if(strlen(%q<viewer_zone>),%*<|>Difference)],[u(%!/FUN`DISPLAY`AT,%q<now>,%q<target_zone>)]%*<|>[if(strlen(%q<viewer_zone>),[u(%!/FUN`DISPLAY`AT,%q<now>,%q<viewer_zone>)]%*<|>[u(%!/FUN`DISPLAY`DIFFERENCE,sub(u({{clock}}/FUN`ZONE`OFFSET,%q<target_zone>,%q<now>),u({{clock}}/FUN`ZONE`OFFSET,%q<viewer_zone>,%q<now>)),name(%q<target>))],tone(muted,not set · +timezone <zone> sets it))],%*<|>),Time for [name(%q<target>)],,u(%!/FUN`DISPLAY`FRAME))
        flags: [funsyntax]

      # ---- +time <time> -----------------------------------------------------------
      # +time [<date>] <time> [<zone>]
      INC`CONVERT:
        value: |-
          think u(%!/FUN`READ`TIME,%q<cmd_argument>); @assert not(strlen(setr(read_error,u(%!/FUN`READ`ERROR))))=@pemit %#=notice(TIME,%q<read_error>,warn); @pemit %#=u(%!/FUN`SCREEN`CONVERT)
        flags: [cmdsyntax]
      # %0 a typed time, [<date>] <time>[ am or pm] [<zone>]. Sets read_date (the date given, else today's in the
      # zone), read_clock (the time as typed), read_ampm, read_hour and read_minute as typed, read_hour24,
      # read_zone_typed, read_zone (the zone given, else the reader's, else the game's; empty when the one
      # given is unknown) and read_instant (that moment, in seconds).
      FUN`READ`TIME:
        value: |-
          setqm(read_words,%0,
          read_date,if(u(%!/FUN`READ`ISDATE,first(%0)),first(%0)),
          read_words,if(strlen(%q<read_date>),rest(%q<read_words>),%q<read_words>),
          read_clock,lcstr(first(%q<read_words>)),
          read_words,rest(%q<read_words>),
          read_clock,if(match(am pm,first(%q<read_words>)),%q<read_clock>[lcstr(first(%q<read_words>))],%q<read_clock>),
          read_words,if(match(am pm,first(%q<read_words>)),rest(%q<read_words>),%q<read_words>),
          read_zone_typed,%q<read_words>,
          read_ampm,if(cor(strmatch(%q<read_clock>,*am),strmatch(%q<read_clock>,*pm)),right(%q<read_clock>,2)),
          read_core,if(strlen(%q<read_ampm>),left(%q<read_clock>,sub(strlen(%q<read_clock>),2)),%q<read_clock>),
          read_hour,first(%q<read_core>,:),
          read_minute,if(strmatch(%q<read_core>,*:*),rest(%q<read_core>,:),00),
          read_hour24,if(strlen(%q<read_ampm>),add(mod(%q<read_hour>,12),if(strmatch(%q<read_ampm>,pm),12,0)),%q<read_hour>),
          read_zone,if(strlen(%q<read_zone_typed>),u({{clock}}/FUN`ZONE`FIND,%q<read_zone_typed>),firstof(%q<viewer_zone>,%q<game_zone>)),
          read_date,firstof(%q<read_date>,timefmt($Y-$m-$d,%q<now>,firstof(%q<read_zone>,UTC))),
          read_instant,u({{clock}}/FUN`DATE`INSTANT,%q<read_date>,%q<read_hour24>,%q<read_minute>,firstof(%q<read_zone>,UTC)))
        flags: [funsyntax]
      # %0 a word: 1 when it is a date, written 2026-10-20.
      FUN`READ`ISDATE:
        value: |-
          cand(strmatch(%0,????-??-??),isint(edit(%0,-,)))
        flags: [funsyntax]
      # 1 when %q<read_hour> and %q<read_minute> make a time: 0 to 23, or 1 to 12 with am or pm, and 00 to 59.
      FUN`READ`CLOCKOK:
        value: |-
          cand(isint(%q<read_hour>),isint(%q<read_minute>),eq(strlen(%q<read_minute>),2),gte(%q<read_minute>,0),lte(%q<read_minute>,59),if(strlen(%q<read_ampm>),cand(gte(%q<read_hour>,1),lte(%q<read_hour>,12)),cand(gte(%q<read_hour>,0),lte(%q<read_hour>,23))))
        flags: [funsyntax]
      # What is wrong with the time FUN`READ`TIME read, or nothing. A time the clocks skip when summer time starts
      # reads back as another hour, and is refused.
      FUN`READ`ERROR:
        value: |-
          case(1,not(u(%!/FUN`READ`CLOCKOK)),'[firstof(%q<read_clock>,%q<cmd_argument>)]' is not a time. Write 20:00%, 8pm or 8:30 am.,gt(words(%q<read_zone_typed>),1),Give one time zone after the time%, such as America/New_York.,cand(strlen(%q<read_zone_typed>),not(strlen(%q<read_zone>))),There is no time zone called '%q<read_zone_typed>'. +help timezone says how they are named.,not(isnum(%q<read_instant>)),'%q<read_date>' is not a date. Write it as 2026-10-20.,comp(timefmt($H:$M,%q<read_instant>,%q<read_zone>),[rjust(%q<read_hour24>,2,0)]:%q<read_minute>),There is no [rjust(%q<read_hour24>,2,0)]:%q<read_minute> on %q<read_date> in %q<read_zone>: the clocks go forward past it.)
        flags: [funsyntax]
      # The moment FUN`READ`TIME read, in its zone, the game's, the reader's, how far off it is, and, when the Clock's
      # DATA`CONFIG`DISCORD-LINE is on, a Discord timestamp, which Discord shows to each reader in their own time.
      FUN`SCREEN`CONVERT:
        value: |-
          setq(convert_discord,get({{clock}}/DATA`CONFIG`DISCORD-LINE))[box(lfields(,%q<read_zone>[if(comp(%q<read_zone>,%q<game_zone>),%*<|>Game time)][if(cand(strlen(%q<viewer_zone>),comp(%q<read_zone>,%q<viewer_zone>)),%*<|>Your time)]%*<|>When[if(%q<convert_discord>,%*<|>Discord)],[u({{clock}}/FUN`OOC`SHOW,%q<read_instant>,%q<read_zone>)] [tone(muted,· UTC[timefmt($Z,%q<read_instant>,%q<read_zone>)])][if(comp(%q<read_zone>,%q<game_zone>),%*<|>[u(%!/FUN`DISPLAY`AT,%q<read_instant>,%q<game_zone>)])][if(cand(strlen(%q<viewer_zone>),comp(%q<read_zone>,%q<viewer_zone>)),%*<|>[u(%!/FUN`DISPLAY`AT,%q<read_instant>,%q<viewer_zone>)])]%*<|>[u(%!/FUN`DISPLAY`FROMNOW,%q<read_instant>)][if(%q<convert_discord>,%*<|><t:%q<read_instant>:F>)],%*<|>)[if(%q<convert_discord>,%r[rule()]%r[tone(muted,Paste the Discord line into Discord: each reader sees it in their own time.)])],[timefmt($H:$M,%q<read_instant>,%q<read_zone>)] on [timefmt($a $d $b,%q<read_instant>,%q<read_zone>)],,u(%!/FUN`DISPLAY`FRAME))]
        flags: [funsyntax]

      # ---- +timezone --------------------------------------------------------------
      # %0 a player: 1 when they set a zone and hid it. Their TZ is then not visual, so only they, staff and this
      # object read it, and the Clock's functions answer nothing for them.
      FUN`ZONE`HIDDEN:
        value: |-
          cand(hasattr(%0,TZ),not(hasflag(%0/TZ,visual)))
        flags: [funsyntax]
      INC`ZONE`SHOW:
        value: |-
          @assert strlen(%q<viewer_zone>)=@pemit %#=notice(TIME,You have not set a time zone. [if(strlen(setr(client_zone,u(%!/FUN`ZONE`CLIENT,%#))),Your client says yours is %q<client_zone>: +timezone/detect sets it.,[if(u(%!/FUN`LOOKUP`OK,%#),+timezone/detect looks yours up from where you connect.%b)]+timezone <zone> sets it%, such as +timezone America/New_York%, and +timezone/match <your time> finds yours from the time where you are.)]); @pemit %#=notice(TIME,Your time zone is [u({{clock}}/FUN`ZONE`LABEL,%q<viewer_zone>,%q<now>)]. It is [u({{clock}}/FUN`OOC`SHOW,%q<now>,%q<viewer_zone>)] for you.[if(u(%!/FUN`ZONE`HIDDEN,%#),%bOnly you and staff see it.)])
        flags: [cmdsyntax]
      # +timezone <zone>. The zone is kept in TZ, which the engine makes visual, so other packages read it through
      # the Clock. God is beyond any object's reach, so the write is checked.
      INC`ZONE`SET:
        value: |-
          think setq(zone_found,u({{clock}}/FUN`ZONE`FIND,%q<cmd_argument>)); @assert strlen(%q<zone_found>)=@pemit %#=notice(TIME,There is no time zone called '%q<cmd_argument>'. +help timezone says how they are named.,warn); &TZ %#=%q<zone_found>; @assert strmatch(get(%#/TZ),%q<zone_found>)=@pemit %#=notice(TIME,Your TZ attribute could not be set. &TZ me=%q<zone_found> sets it.,error); @pemit %#=notice(TIME,Your time zone is [u({{clock}}/FUN`ZONE`LABEL,%q<zone_found>,%q<now>)]. It is [u({{clock}}/FUN`OOC`SHOW,%q<now>,%q<zone_found>)] for you.,ok)
        flags: [cmdsyntax]
      # +timezone/hide and +timezone/unhide: TZ's visual flag. A zone changed while hidden stays hidden.
      INC`ZONE`HIDE:
        value: |-
          @assert hasattr(%#,TZ)=@pemit %#=notice(TIME,You have not set a time zone.,warn); @assert not(u(%!/FUN`ZONE`HIDDEN,%#))=@pemit %#=notice(TIME,Your time zone is already hidden.,warn); @set %#/TZ=!visual; @assert u(%!/FUN`ZONE`HIDDEN,%#)=@pemit %#=notice(TIME,Your TZ attribute could not be changed. @set me/TZ=!visual hides it.,error); @pemit %#=notice(TIME,Only you and staff see your time zone now. +time <your name> tells others you keep it to yourself.,ok)
        flags: [cmdsyntax]
      INC`ZONE`UNHIDE:
        value: |-
          @assert u(%!/FUN`ZONE`HIDDEN,%#)=@pemit %#=notice(TIME,Your time zone is not hidden.,warn); @set %#/TZ=visual; @assert not(u(%!/FUN`ZONE`HIDDEN,%#))=@pemit %#=notice(TIME,Your TZ attribute could not be changed. @set me/TZ=visual shows it.,error); @pemit %#=notice(TIME,Everyone sees your time zone again.,ok)
        flags: [cmdsyntax]
      INC`ZONE`CLEAR:
        value: |-
          @assert hasattr(%#,TZ)=@pemit %#=notice(TIME,You have not set a time zone.,warn); &TZ %#; @pemit %#=notice(TIME,Your time zone is cleared. Times are shown in the game's.,ok)
        flags: [cmdsyntax]

      # %0 a player: the zone their client reported (clientzone()), or nothing.
      FUN`ZONE`CLIENT:
        value: |-
          u({{clock}}/FUN`ZONE`CHECK,clientzone(%0))
        flags: [funsyntax]
      # %0 a zone and where it came from, client or ip: the sentence that offers it.
      FUN`ZONE`SUGGESTED:
        value: |-
          switch(%1,ip,Where you connect from suggests your time zone is %0,Your client says your time zone is %0)
        flags: [funsyntax]
      # %0 client or ip: where a zone set without the player typing it came from.
      FUN`ZONE`SOURCE:
        value: |-
          switch(%0,ip,guessed from where you connect,from your client)
        flags: [funsyntax]
      # +timezone/detect: the zone the player's client reported, set as if they had typed it. With none, and
      # DATA`CONFIG`DETECT-IP not off, asks the zone service where they connect from (INC`ZONE`LOOKUP).
      INC`ZONE`DETECT:
        value: |-
          think setq(client_zone,u(%!/FUN`ZONE`CLIENT,%#)); @assert cor(strlen(%q<client_zone>),not(u(%!/FUN`LOOKUP`OK,%#)))=@include/args %!/INC`ZONE`LOOKUP=player,%:,mode,detect; @assert strlen(%q<client_zone>)=@pemit %#=notice(TIME,Your client has not reported a time zone. +timezone/match <your time> finds yours from the time where you are%, such as +timezone/match 8:15pm.,warn); @include/args %!/INC`ZONE`TAKE=player,%:,zone,%q<client_zone>,from,client
        flags: [cmdsyntax]
      # %<player>, %<zone> and %<from> (client or ip): sets the zone the player asked for with +timezone/detect.
      INC`ZONE`TAKE:
        value: |-
          think setq(now,secs()); @assert comp(%<zone>,get(%<player>/TZ))=@pemit %<player>=notice(TIME,Your time zone is already %<zone>.); &TZ %<player>=%<zone>; @assert strmatch(get(%<player>/TZ),%<zone>)=@pemit %<player>=notice(TIME,Your TZ attribute could not be set. &TZ me=%<zone> sets it.,error); @pemit %<player>=notice(TIME,Your time zone is [u({{clock}}/FUN`ZONE`LABEL,%<zone>,%q<now>)]%, [u(%!/FUN`ZONE`SOURCE,%<from>)]. It is [u({{clock}}/FUN`OOC`SHOW,%q<now>,%<zone>)] for you.,ok)
        flags: [cmdsyntax]
      # +timezone/match <time>: the zones on the Clock's match-zones list whose clock reads that time now, each a
      # link to +timezone <zone>. A player types a round time a few minutes off, so the nearest time within half an
      # hour counts; zones that share an offset share it, so every zone at the nearest one is listed.
      INC`ZONE`MATCH:
        value: |-
          @assert strlen(%q<cmd_argument>)=@pemit %#=notice(TIME,Give the time where you are: +timezone/match 8:15pm.,warn); think u(%!/FUN`READ`TIME,%q<cmd_argument>); @assert cand(u(%!/FUN`READ`CLOCKOK),not(strlen(%q<read_zone_typed>)),not(u(%!/FUN`READ`ISDATE,first(%q<cmd_argument>))))=@pemit %#=notice(TIME,'%q<cmd_argument>' is not a time. Write the time where you are%, such as 20:15%, 8pm or 8:15 pm.,warn); think u(%!/FUN`MATCH`FIND,add(mul(%q<read_hour24>,60),%q<read_minute>)); @assert words(%q<match_found>)=@pemit %#=notice(TIME,No zone on the game's list is at [rjust(%q<read_hour24>,2,0)]:%q<read_minute> now. +timezone <zone> sets yours by name: +help timezone.,warn); @pemit %#=u(%!/FUN`SCREEN`MATCH)
        flags: [cmdsyntax]
      # %0 a time of day in minutes. Sets match_minutes, match_zones (the Clock's list), match_offsets (how many
      # minutes each zone's clock is ahead of that time, -720 to 719), match_nearest (the offset nearest 0) and
      # match_found (the zones at it, or nothing when it is half an hour or more away).
      FUN`MATCH`FIND:
        value: |-
          setqm(match_minutes,%0,
          match_zones,filterbool({{clock}}/FUN`ZONE`VALID,get({{clock}}/DATA`CONFIG`MATCH-ZONES)),
          match_offsets,iter(%q<match_zones>,u(%!/FUN`MATCH`OFFSET,%i0)),
          match_nearest,extract(%q<match_offsets>,match(iter(%q<match_offsets>,abs(%i0)),first(sort(iter(%q<match_offsets>,abs(%i0)),n))),1),
          match_found,if(lt(abs(%q<match_nearest>),30),squish(iter(%q<match_zones>,if(eq(extract(%q<match_offsets>,inum(0),1),%q<match_nearest>),%i0)))))
        flags: [funsyntax]
      # %0 a zone: how many minutes its clock is ahead of %q<match_minutes> now, -720 to 719.
      FUN`MATCH`OFFSET:
        value: |-
          sub(mod(add(mul(timefmt($H,%q<now>,%0),60),timefmt($M,%q<now>,%0),sub(2160,%q<match_minutes>)),1440),720)
        flags: [funsyntax]
      # The zones FUN`MATCH`FIND found, each a link that sets it.
      FUN`SCREEN`MATCH:
        value: |-
          notice(TIME,It is [timefmt($H:$M,%q<now>,first(%q<match_found>))] now in [if(eq(words(%q<match_found>),1),this zone,these zones)]. Choose yours:)%r[bullets(iter(%q<match_found>,[cmdlink(+timezone %i0,+timezone %i0,Set your time zone to %i0)] [tone(muted,· UTC[timefmt($Z,%q<now>,%i0)])],,%*<|>),%*<|>)]
        flags: [funsyntax]

      # ---- detected zones ---------------------------------------------------------
      # From player`connect (login 1) and socket`timezone (login 0): %<player>, %<zone> (the client's, or nothing)
      # and, at login, %<address>. A player who set a zone is left alone. With no client zone, a login asks the zone
      # service where the player connects from (INC`ZONE`LOOKUP).
      EVENT`ZONE:
        value: |-
          @break cor(not(hastype(%<player>,player)),hasattr(%<player>,TZ),not(cor(strlen(%<zone>),%<login>))); @assert strlen(%<zone>)=@include/args %!/INC`ZONE`LOOKUP=player,%<player>,mode,login; @include/args %!/INC`ZONE`SETTLE=player,%<player>,zone,%<zone>,from,client,login,%<login>
        flags: [cmdsyntax]
      # %<player>, %<zone>, %<from> (client or ip) and %<login>. Fills an empty TZ when the setting for that source
      # (DATA`CONFIG`DETECT for the client's, DATA`CONFIG`DETECT-IP for the address's) is set, hidden, since the
      # player did not choose to share where they are; when it is offer, says so once a login.
      INC`ZONE`SETTLE:
        value: |-
          think setq(zone_detect,get({{clock}}/DATA`CONFIG`[if(strmatch(%<from>,ip),DETECT-IP,DETECT)])); @break cor(strmatch(%q<zone_detect>,off),not(hastype(%<player>,player)),hasattr(%<player>,TZ),not(u({{clock}}/FUN`ZONE`VALID,%<zone>))); @break cand(strmatch(%q<zone_detect>,offer),not(%<login>)); @assert strmatch(%q<zone_detect>,set)=@pemit %<player>=notice(TIME,[u(%!/FUN`ZONE`SUGGESTED,%<zone>,%<from>)]. +timezone/detect sets it.); &TZ %<player>=%<zone>; @set %<player>/TZ=!visual; @assert strmatch(get(%<player>/TZ),%<zone>); @pemit %<player>=notice(TIME,Your time zone is now [u({{clock}}/FUN`ZONE`LABEL,%<zone>,secs())]%, [u(%!/FUN`ZONE`SOURCE,%<from>)]. Only you and staff see it: +timezone/unhide shares it%, and +timezone <zone> changes it.,ok)
        flags: [cmdsyntax]

      # ---- the zone service --------------------------------------------------------
      # Only when DATA`CONFIG`DETECT-IP is not off: the player's address goes to the service DATA`CONFIG`IP-SERVICE
      # names, over https. A private or unknown address is never sent.

      # %0 a player: 1 when a lookup may run for them now: the setting is on and they connect from a public address.
      FUN`LOOKUP`OK:
        value: |-
          cand(not(strmatch(get({{clock}}/DATA`CONFIG`DETECT-IP),off)),u(%!/FUN`ADDRESS`PUBLIC,ipaddr(%0)))
        flags: [funsyntax]
      # %0 an address: 1 unless it is no IPv4 or IPv6 address, or a loopback, private or link-local one, which no
      # service can place.
      FUN`ADDRESS`PUBLIC:
        value: |-
          cand(cor(strmatch(%0,*.*.*.*),strmatch(%0,*:*)),ncor(strmatch(%0,#-*),strmatch(%0,127.*),strmatch(%0,10.*),strmatch(%0,192.168.*),strmatch(%0,169.254.*),strmatch(%0,0.*),cand(strmatch(%0,172.*.*.*),gte(elements(%0,2,.),16),lte(elements(%0,2,.),31)),strmatch(%0,::1),strmatch(%0,fc*:*),strmatch(%0,fd*:*),strmatch(%0,fe80:*)))
        flags: [funsyntax]
      # %0 a player: the attribute the zone service's reply to them runs, LOOKUP`<key>, keyed by objid as
      # 12_1790888816538 (an objid cannot be part of an attribute name).
      FUN`LOOKUP`ATTR:
        value: |-
          LOOKUP`[edit(after(objid(%0),#),:,_)]
        flags: [funsyntax]
      # %<player> and %<mode> (login or detect): sends the player's address to the zone service. The reply runs
      # LOOKUP`<key>, written here for this player, which hands it to INC`ZONE`REPLY and is then cleared.
      # Escape %0 while writing the callback: the HTTP body arrives later. Pass it by name before /args overlays positions.
      INC`ZONE`LOOKUP:
        value: |-
          @assert u(%!/FUN`LOOKUP`OK,%<player>); think setqm(lookup_attr,u(%!/FUN`LOOKUP`ATTR,%<player>),
          lookup_url,edit(get({{clock}}/DATA`CONFIG`IP-SERVICE),<ip>,urlencode(ipaddr(%<player>)))); @assert strmatch(%q<lookup_url>,https://*); &%q<lookup_attr> %!=@include/args %!/INC`ZONE`REPLY=body,\%0,player,%<player>,mode,%<mode>; @http %!/%q<lookup_attr>=%q<lookup_url>
        flags: [cmdsyntax]
      # The zone service's reply: %<body>, %<status>, with %<player> and %<mode>. A zone the server knows, at
      # the reply's DATA`CONFIG`IP-FIELD, is settled as a login's (INC`ZONE`SETTLE) or taken for +timezone/detect.
      INC`ZONE`REPLY:
        value: |-
          &[u(%!/FUN`LOOKUP`ATTR,%<player>)] %!; think setq(zone_found,if(eq(%<status>,200),u({{clock}}/FUN`ZONE`CHECK,json_query(%<body>,extract,$.[get({{clock}}/DATA`CONFIG`IP-FIELD)])))); @assert strmatch(%<mode>,detect)=@include/args %!/INC`ZONE`SETTLE=player,%<player>,zone,%q<zone_found>,from,ip,login,1; @assert strlen(%q<zone_found>)=@pemit %<player>=notice(TIME,Your client has not reported a time zone%, and where you connect from did not give one. +timezone/match <your time> finds yours from the time where you are%, such as +timezone/match 8:15pm.,warn); @include/args %!/INC`ZONE`TAKE=player,%<player>,zone,%q<zone_found>,from,ip
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @dolist/inline time timezone={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The Clock: what a game sets, and the functions any code reads the time through, u(<Clock>/FUN`IC`DATE) and
  # the rest. A plain VISUAL thing rather than the WIZARD Time object, so a player's code and other packages can
  # u() it: nothing on it is secret, and it reads nothing a player has not made visible.
  - ref: clock
    type: thing
    name: Clock
    location: "{{time}}"
    flags: [no_command, visual]
    attributes:
      # The settings +config shows and changes (plus-config); the code reads each with get(%!/DATA`CONFIG`<NAME>).
      # The IC clock: at IC-ANCHOR, in seconds since 1970 (2026-01-01 00:00 UTC by default), it reads the same as
      # the real one; from there it runs IC-RATIO times as fast. IC-DAYS moves the IC date that many days on (or
      # back, below 0), and IC-YEARS adds to the year it shows.
      DATA`CONFIG: |-
        The game's time zone, how times are written, and the IC clock.
      DATA`CONFIG`LABEL: |-
        Time and the IC clock
      DATA`CONFIG`ZONE: |-
        UTC
      DATA`CONFIG`ZONE`TYPE: |-
        timezone
      DATA`CONFIG`ZONE`DEFAULT: |-
        UTC
      DATA`CONFIG`ZONE`DESCRIPTION: |-
        The game's time zone, the one +time calls game time.
      DATA`CONFIG`ZONE`LABEL: |-
        Game time zone
      DATA`CONFIG`ZONE`EXAMPLE: |-
        Europe/London
      DATA`CONFIG`FORMAT: |-
        $a $d $b $Y, $H:$M
      DATA`CONFIG`FORMAT`TYPE: |-
        text
      DATA`CONFIG`FORMAT`DEFAULT: |-
        $a $d $b $Y, $H:$M
      DATA`CONFIG`FORMAT`MAX: |-
        100
      DATA`CONFIG`FORMAT`DESCRIPTION: |-
        How a time is written, in timefmt()'s codes.
      DATA`CONFIG`FORMAT`LABEL: |-
        Time format
      DATA`CONFIG`FORMAT`EXAMPLE: |-
        $d/$m/$Y $H:$M
      DATA`CONFIG`IC-SHOW: |-
        1
      DATA`CONFIG`IC-SHOW`TYPE: |-
        boolean
      DATA`CONFIG`IC-SHOW`DEFAULT: |-
        1
      DATA`CONFIG`IC-SHOW`DESCRIPTION: |-
        Whether +time shows the IC date.
      DATA`CONFIG`IC-SHOW`LABEL: |-
        Show the IC date
      DATA`CONFIG`IC-SHOW`EXAMPLE: |-
        no
      DATA`CONFIG`IC-ANCHOR: |-
        1767225600
      DATA`CONFIG`IC-ANCHOR`TYPE: |-
        integer
      DATA`CONFIG`IC-ANCHOR`DEFAULT: |-
        1767225600
      DATA`CONFIG`IC-ANCHOR`DESCRIPTION: |-
        A moment, in seconds since 1970, when the IC clock reads the same as the real one.
      DATA`CONFIG`IC-ANCHOR`LABEL: |-
        IC anchor
      DATA`CONFIG`IC-ANCHOR`EXAMPLE: |-
        1772323200
      DATA`CONFIG`IC-RATIO: |-
        1
      DATA`CONFIG`IC-RATIO`TYPE: |-
        number
      DATA`CONFIG`IC-RATIO`DEFAULT: |-
        1
      DATA`CONFIG`IC-RATIO`MIN: |-
        0
      DATA`CONFIG`IC-RATIO`DESCRIPTION: |-
        How many IC seconds pass each real second.
      DATA`CONFIG`IC-RATIO`LABEL: |-
        IC speed
      DATA`CONFIG`IC-RATIO`EXAMPLE: |-
        2
      DATA`CONFIG`IC-DAYS: |-
        0
      DATA`CONFIG`IC-DAYS`TYPE: |-
        integer
      DATA`CONFIG`IC-DAYS`DEFAULT: |-
        0
      DATA`CONFIG`IC-DAYS`DESCRIPTION: |-
        Days added to the IC date; below 0 goes back.
      DATA`CONFIG`IC-DAYS`LABEL: |-
        IC days added
      DATA`CONFIG`IC-DAYS`EXAMPLE: |-
        -3
      DATA`CONFIG`IC-YEARS: |-
        0
      DATA`CONFIG`IC-YEARS`TYPE: |-
        integer
      DATA`CONFIG`IC-YEARS`DEFAULT: |-
        0
      DATA`CONFIG`IC-YEARS`DESCRIPTION: |-
        Years added to the IC year shown.
      DATA`CONFIG`IC-YEARS`LABEL: |-
        IC years added
      DATA`CONFIG`IC-YEARS`EXAMPLE: |-
        300
      DATA`CONFIG`IC-MONTHS: |-

      DATA`CONFIG`IC-MONTHS`TYPE: |-
        list
      DATA`CONFIG`IC-MONTHS`DEFAULT: |-

      DATA`CONFIG`IC-MONTHS`DELIMITER: |-
        |
      DATA`CONFIG`IC-MONTHS`MAX: |-
        12
      DATA`CONFIG`IC-MONTHS`CHECK: |-
        CHECK`IC`NAMES
      DATA`CONFIG`IC-MONTHS`DESCRIPTION: |-
        The twelve IC month names, January's first. Empty uses the real ones.
      DATA`CONFIG`IC-MONTHS`LABEL: |-
        IC month names
      DATA`CONFIG`IC-WEEKDAYS: |-

      DATA`CONFIG`IC-WEEKDAYS`TYPE: |-
        list
      DATA`CONFIG`IC-WEEKDAYS`DEFAULT: |-

      DATA`CONFIG`IC-WEEKDAYS`DELIMITER: |-
        |
      DATA`CONFIG`IC-WEEKDAYS`MAX: |-
        7
      DATA`CONFIG`IC-WEEKDAYS`CHECK: |-
        CHECK`IC`NAMES
      DATA`CONFIG`IC-WEEKDAYS`DESCRIPTION: |-
        The seven IC weekday names, Sunday's first. Empty uses the real ones.
      DATA`CONFIG`IC-WEEKDAYS`LABEL: |-
        IC weekday names
      DATA`CONFIG`DETECT: |-
        set
      DATA`CONFIG`DETECT`TYPE: |-
        choice
      DATA`CONFIG`DETECT`CHOICES: |-
        set offer off
      DATA`CONFIG`DETECT`DEFAULT: |-
        set
      DATA`CONFIG`DETECT`DESCRIPTION: |-
        What a zone a player's client reports does when they set none: set fills it in, hidden; offer tells them at login; off does nothing.
      DATA`CONFIG`DETECT`LABEL: |-
        Zone from the client
      DATA`CONFIG`DETECT`EXAMPLE: |-
        offer
      DATA`CONFIG`DETECT-IP: |-
        off
      DATA`CONFIG`DETECT-IP`TYPE: |-
        choice
      DATA`CONFIG`DETECT-IP`CHOICES: |-
        set offer off
      DATA`CONFIG`DETECT-IP`DEFAULT: |-
        off
      DATA`CONFIG`DETECT-IP`DESCRIPTION: |-
        What to do for a player who set no zone and whose client reports none: set fills it in from where they connect, hidden; offer tells them at login; off does nothing. Anything but off sends each such player's address to the zone service, ip-service.
      DATA`CONFIG`DETECT-IP`LABEL: |-
        Zone from where a player connects
      DATA`CONFIG`DETECT-IP`EXAMPLE: |-
        offer
      DATA`CONFIG`IP-SERVICE: |-
        https://ipinfo.io/<ip>/json
      DATA`CONFIG`IP-SERVICE`TYPE: |-
        text
      DATA`CONFIG`IP-SERVICE`DEFAULT: |-
        https://ipinfo.io/<ip>/json
      DATA`CONFIG`IP-SERVICE`CHECK: |-
        CHECK`IP`SERVICE
      DATA`CONFIG`IP-SERVICE`DESCRIPTION: |-
        The https address that answers with the zone of an address, as JSON, <ip> standing for the address. Used only when detect-ip is not off.
      DATA`CONFIG`IP-SERVICE`LABEL: |-
        Zone service
      DATA`CONFIG`IP-SERVICE`EXAMPLE: |-
        https://ipwho.is/<ip>
      DATA`CONFIG`IP-FIELD: |-
        timezone
      DATA`CONFIG`IP-FIELD`TYPE: |-
        text
      DATA`CONFIG`IP-FIELD`DEFAULT: |-
        timezone
      DATA`CONFIG`IP-FIELD`DESCRIPTION: |-
        Where the zone is in the zone service's reply, as a JSON path: timezone for ipinfo.io, timezone.id for ipwho.is.
      DATA`CONFIG`IP-FIELD`LABEL: |-
        Zone in the reply
      DATA`CONFIG`IP-FIELD`EXAMPLE: |-
        timezone.id
      DATA`CONFIG`DISCORD-LINE: |-
        1
      DATA`CONFIG`DISCORD-LINE`TYPE: |-
        boolean
      DATA`CONFIG`DISCORD-LINE`DEFAULT: |-
        1
      DATA`CONFIG`DISCORD-LINE`DESCRIPTION: |-
        Whether +time <time> shows a Discord timestamp for the time it converts, to paste into Discord.
      DATA`CONFIG`DISCORD-LINE`LABEL: |-
        Discord timestamp
      DATA`CONFIG`DISCORD-LINE`EXAMPLE: |-
        no
      DATA`CONFIG`MATCH-ZONES: |-
        Pacific/Honolulu America/Anchorage America/Los_Angeles America/Vancouver America/Phoenix America/Denver America/Mexico_City America/Chicago America/Bogota America/New_York America/Toronto America/Halifax America/St_Johns America/Sao_Paulo America/Argentina/Buenos_Aires Atlantic/Azores UTC Europe/London Europe/Dublin Europe/Lisbon Africa/Lagos Europe/Paris Europe/Berlin Europe/Madrid Europe/Rome Europe/Amsterdam Europe/Stockholm Europe/Warsaw Africa/Johannesburg Africa/Cairo Europe/Athens Europe/Helsinki Europe/Istanbul Europe/Moscow Asia/Tehran Asia/Dubai Asia/Karachi Asia/Kolkata Asia/Kathmandu Asia/Dhaka Asia/Bangkok Asia/Jakarta Asia/Singapore Asia/Shanghai Asia/Manila Australia/Perth Asia/Seoul Asia/Tokyo Australia/Darwin Australia/Adelaide Australia/Brisbane Australia/Sydney Pacific/Auckland
      DATA`CONFIG`MATCH-ZONES`TYPE: |-
        list
      DATA`CONFIG`MATCH-ZONES`DEFAULT: |-
        Pacific/Honolulu America/Anchorage America/Los_Angeles America/Vancouver America/Phoenix America/Denver America/Mexico_City America/Chicago America/Bogota America/New_York America/Toronto America/Halifax America/St_Johns America/Sao_Paulo America/Argentina/Buenos_Aires Atlantic/Azores UTC Europe/London Europe/Dublin Europe/Lisbon Africa/Lagos Europe/Paris Europe/Berlin Europe/Madrid Europe/Rome Europe/Amsterdam Europe/Stockholm Europe/Warsaw Africa/Johannesburg Africa/Cairo Europe/Athens Europe/Helsinki Europe/Istanbul Europe/Moscow Asia/Tehran Asia/Dubai Asia/Karachi Asia/Kolkata Asia/Kathmandu Asia/Dhaka Asia/Bangkok Asia/Jakarta Asia/Singapore Asia/Shanghai Asia/Manila Australia/Perth Asia/Seoul Asia/Tokyo Australia/Darwin Australia/Adelaide Australia/Brisbane Australia/Sydney Pacific/Auckland
      DATA`CONFIG`MATCH-ZONES`MIN: |-
        1
      DATA`CONFIG`MATCH-ZONES`CHECK: |-
        CHECK`ZONES
      DATA`CONFIG`MATCH-ZONES`DESCRIPTION: |-
        The zones +timezone/match offers, in the order it lists them.
      DATA`CONFIG`MATCH-ZONES`LABEL: |-
        Zones to match a time against
      DATA`CONFIG`MATCH-ZONES`EXAMPLE: |-
        America/New_York Europe/London Asia/Tokyo
      # +config's CHECK for MATCH-ZONES (%0 the zones): every one a zone the server knows.
      CHECK`ZONES: |-
        if(every(%!/FUN`ZONE`VALID,%0,%b,zone_unknown),,The server knows no zone called [itemize(%q<zone_unknown>)].)
      # +config's CHECK for IP-SERVICE (%0 the address): https, with <ip> in it.
      CHECK`IP`SERVICE: |-
        if(cand(strmatch(%0,https://*),strmatch(%0,*<ip>*)),,Give an https address with <ip> where the address goes%, such as https://ipinfo.io/<ip>/json.)
      # +config's CHECK for IC-MONTHS and IC-WEEKDAYS (%0 the names, %1 the setting): every name or none.
      CHECK`IC`NAMES: |-
        setq(ic_need,if(strmatch(%1,ic-months),12,7))[if(cand(words(%0,|),neq(words(%0,|),%q<ic_need>)),Give all %q<ic_need> names%, or none for the real ones.)]

      # How the IC date is written. Evaluated with %<year>, %<month> (1 to 12), %<monthname>, %<day>,
      # %<weekday> (its name), %<hour>, %<minute> and %<second>.
      FORMAT`IC: |-
        %<weekday>, %<day> %<monthname> %<year>, %<hour>:%<minute>

      # Names a player may give +timezone for a zone, one leaf each: ALIAS`<name>=<zone>. A name here wins over a
      # zone with the same name, so EST is New York's time, summer time and all, not a fixed UTC-5.
      ALIAS: |-
        Short names for zones. One leaf per name.
      ALIAS`EASTERN: |-
        America/New_York
      ALIAS`EST: |-
        America/New_York
      ALIAS`EDT: |-
        America/New_York
      ALIAS`CENTRAL: |-
        America/Chicago
      ALIAS`CST: |-
        America/Chicago
      ALIAS`CDT: |-
        America/Chicago
      ALIAS`MOUNTAIN: |-
        America/Denver
      ALIAS`MST: |-
        America/Denver
      ALIAS`MDT: |-
        America/Denver
      ALIAS`ARIZONA: |-
        America/Phoenix
      ALIAS`PACIFIC: |-
        America/Los_Angeles
      ALIAS`PST: |-
        America/Los_Angeles
      ALIAS`PDT: |-
        America/Los_Angeles
      ALIAS`ALASKA: |-
        America/Anchorage
      ALIAS`HAWAII: |-
        Pacific/Honolulu
      ALIAS`GMT: |-
        Europe/London
      ALIAS`BST: |-
        Europe/London
      ALIAS`UK: |-
        Europe/London
      ALIAS`CET: |-
        Europe/Paris
      ALIAS`CEST: |-
        Europe/Paris
      ALIAS`EET: |-
        Europe/Athens
      ALIAS`JST: |-
        Asia/Tokyo
      ALIAS`AEST: |-
        Australia/Sydney
      ALIAS`AEDT: |-
        Australia/Sydney
      ALIAS`NZST: |-
        Pacific/Auckland
      ALIAS`NZDT: |-
        Pacific/Auckland
      ALIAS`Z: |-
        UTC

      # ---- time zones -----------------------------------------------------------
      # %0 a zone: 1 when the server knows it.
      FUN`ZONE`VALID:
        value: |-
          cand(strlen(%0),not(strmatch(timefmt($Z,0,%0),#-1*)))
        flags: [funsyntax]
      # %0 a zone: itself when the server knows it, else nothing.
      FUN`ZONE`CHECK:
        value: |-
          if(u(%!/FUN`ZONE`VALID,%0),%0)
        flags: [funsyntax]
      # %0 a zone as a player typed it: the zone it names, or nothing. An ALIAS` name first, then as typed, then
      # with each part capitalised (america/new_york), then with the region in capitals (us/eastern), then all in
      # capitals (est5edt).
      FUN`ZONE`FIND:
        value: |-
          if(cand(strlen(%0),not(strmatch(%0,* *))),first(filterbool(%!/FUN`ZONE`VALID,if(not(strmatch(%0,*/*)),get(%!/ALIAS`%0)) %0 [u(%!/FUN`ZONE`TITLE,%0)] [ucstr(first(%0,/))][if(strmatch(%0,*/*),/[u(%!/FUN`ZONE`TITLE,rest(%0,/))])] [ucstr(%0)])))
        flags: [funsyntax]
      # %0 a zone name: each part between / and _ capitalised.
      FUN`ZONE`TITLE:
        value: |-
          iter(%0,iter(%i0,capstr(lcstr(%i0)),_,_),/,/)
        flags: [funsyntax]
      # The game's zone, UTC when DATA`CONFIG`ZONE names none the server knows.
      FUN`ZONE`GAME:
        value: |-
          firstof(u(%!/FUN`ZONE`CHECK,get(%!/DATA`CONFIG`ZONE)),UTC)
        flags: [funsyntax]
      # %0 an object: the zone in its TZ, or nothing when it set none (or keeps it hidden).
      FUN`ZONE`OF:
        value: |-
          u(%!/FUN`ZONE`CHECK,get(%0/TZ))
        flags: [funsyntax]
      # %0 a zone and %1 an instant: how far the zone's clock is ahead of UTC then, in seconds.
      FUN`ZONE`OFFSET:
        value: |-
          sub(convtime(timefmt($a $b $d $H:$M:$S $Y,%1,%0),UTC),%1)
        flags: [funsyntax]
      # %0 a zone and %1 an instant: the zone's name and its offset then, America/New_York (UTC-04:00).
      FUN`ZONE`LABEL:
        value: |-
          if(strmatch(%0,UTC),UTC,%0 \(UTC[timefmt($Z,%1,%0)]\))
        flags: [funsyntax]

      # ---- real time ------------------------------------------------------------
      # %0 an instant and %1 a zone (the game's when empty): the time there, as DATA`CONFIG`FORMAT writes it.
      FUN`OOC`SHOW:
        value: |-
          timefmt(get(%!/DATA`CONFIG`FORMAT),%0,firstof(%1,u(%!/FUN`ZONE`GAME)))
        flags: [funsyntax]
      # %0 an instant and %1 a reader: the time in the reader's zone, else in the game's.
      FUN`OOC`FOR:
        value: |-
          u(%!/FUN`OOC`SHOW,%0,u(%!/FUN`ZONE`OF,%1))
        flags: [funsyntax]
      # %0 a date (2026-10-20), %1 an hour (0 to 23), %2 a minute and %3 a zone: that moment, in seconds.
      # Read through the zone's own rules, so a date in summer time gets summer time's offset.
      FUN`DATE`INSTANT:
        value: |-
          convtime(timefmt($a $b $d $H:$M:$S $Y,convtime(%0T[rjust(%1,2,0)]:[rjust(%2,2,0)]:00Z),UTC),%3)
        flags: [funsyntax]

      # ---- IC time --------------------------------------------------------------
      # %0 an instant (now when empty): the IC clock's instant then, in seconds, before DATA`CONFIG`IC-YEARS.
      FUN`IC`SECS:
        value: |-
          round(add(get(%!/DATA`CONFIG`IC-ANCHOR),mul(sub(if(strlen(%0),%0,secs()),get(%!/DATA`CONFIG`IC-ANCHOR)),get(%!/DATA`CONFIG`IC-RATIO)),mul(get(%!/DATA`CONFIG`IC-DAYS),86400)),0)
        flags: [funsyntax]
      # %0 an instant (now when empty): the IC date and time, as FORMAT`IC writes it.
      FUN`IC`DATE:
        value: |-
          u(%!/FUN`IC`WRITE,timefmt($Y $m $d $w $H $M $S,u(%!/FUN`IC`SECS,%0),UTC))
        flags: [funsyntax]
      # %0 the year, month, day, weekday (0 for Sunday), hour, minute and second, split by spaces: FORMAT`IC of them.
      FUN`IC`WRITE:
        value: |-
          uargs(%!/FORMAT`IC,year,add(first(%0),get(%!/DATA`CONFIG`IC-YEARS)),month,add(0,extract(%0,2,1)),monthname,u(%!/FUN`IC`MONTHNAME,add(0,extract(%0,2,1))),day,add(0,extract(%0,3,1)),weekday,u(%!/FUN`IC`WEEKDAYNAME,extract(%0,4,1)),hour,extract(%0,5,1),minute,extract(%0,6,1),second,extract(%0,7,1))
        flags: [funsyntax]
      # %0 a month, 1 to 12: its IC name.
      FUN`IC`MONTHNAME:
        value: |-
          firstof(extract(get(%!/DATA`CONFIG`IC-MONTHS),%0,1,|),timefmt($B,convtime(2026-[rjust(%0,2,0)]-01T00:00:00Z),UTC))
        flags: [funsyntax]
      # %0 a weekday, 0 for Sunday to 6: its IC name. 1970-01-04 was a Sunday.
      FUN`IC`WEEKDAYNAME:
        value: |-
          firstof(extract(get(%!/DATA`CONFIG`IC-WEEKDAYS),inc(%0),1,|),timefmt($A,add(259200,mul(%0,86400)),UTC))
        flags: [funsyntax]

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: time_help
    type: thing
    name: Time Help
    location: "{{time}}"
    attributes:
      HELP: |-
        The game's time, your own, and the IC date: +time and +timezone.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`TIME: |-
        timezone
      SEE`TIMEZONE: |-
        time
      HELP`TIME: |-
        `+time` shows the game's time, your own and the IC date, and converts a time from one zone to another.

        - `+time` shows the game's time, yours, and the IC date.
        - `+time <name>` shows another player's time, and how far ahead of you or behind it is.
        - `+time <time>` reads a time in your zone and shows it in the game's: `+time 8pm`, `+time 20:30`, `+time 8:30 am`.
        - `+time <time> <zone>` reads it in another zone: `+time 8pm pacific`.
        - `+time <date> <time> \[<zone>\]` reads it on another day, the date written year first: `+time 2026-10-20 8pm`.

        A converted time also shows how long until it, or how long ago it was, and a Discord timestamp such as `<t:1792540800:F>`, unless the game turns that line off. Paste that into Discord and each reader sees the time in their own zone.

        For example, from a player whose zone is America/New_York:

        `+time 2026-07-15 8:30 pm pacific`

        Output: a box titled `20:30 on Wed 15 Jul` with the time in America/Los_Angeles, the game time, your time, how far off it is, and the line for Discord.

        Until you set your zone with `+timezone`, a time you type is read in the game's. See `+help timezone`.
      LOCK`TIME`SETTINGS: |-
        perm^config.admin
      HELP`TIME`SETTINGS: |-
        `+config time` lists the settings and `+config time/<setting>=<value>` changes one \(`config.admin`\):

        - `zone`: the game's time zone, the one `+time` calls game time. `UTC` by default.
        - `format`: how a time is written, in `timefmt\(\)`'s codes. `$a $d $b $Y, $H:$M` by default, which writes `Thu 15 Oct 2026, 20:00`.
        - `detect`: what a zone a player's client reports does when they set none. `set`, the default, fills it in, hidden, and tells them; `offer` tells them at login, and `+timezone/detect` sets it; `off` does nothing. See `+help timezone client`.
        - `detect-ip`: what to do for a player who set no zone and whose client reports none. `off`, the default, does nothing. `set` and `offer` ask the zone service where the player connects from, at login, and then work as for `detect`. Anything but `off` sends those players' addresses to that service, so say so in your game's privacy policy. A guess from an address is often wrong behind a VPN, a proxy or a mobile network, so `offer` suits it better than `set`.
        - `ip-service`: the zone service, an https address with `<ip>` where the address goes. `https://ipinfo.io/<ip>/json` by default, which needs no account but limits how many lookups it answers. `https://ipwho.is/<ip>` is another. A private address, such as a player on the same network as the game, is never sent.
        - `ip-field`: where the zone is in the service's reply, as a JSON path. `timezone` by default, for ipinfo.io; `timezone.id` for ipwho.is.
        - `discord-line`: whether `+time <time>` shows a Discord timestamp for the time it converts. `yes` by default; `no` leaves the line out, for a game that does not use Discord.
        - `match-zones`: the zones `+timezone/match` offers, in the order it lists them. Each must be a zone the server knows. About fifty by default, at least one for each offset most players live in.

        Short names a player may give `+timezone` or `+time` are attributes on the Clock object, inside the Time object in the master room: `` ALIAS`<name> ``, one each, its value the zone. A short name wins over a zone of the same name.

        For example, to keep the game on London time and let players type `irish`:

        `+config time/zone=Europe/London`

        `` &ALIAS`IRISH <Clock>=Europe/Dublin ``

        The IC date has its own settings: see `+help time ic`.
      LOCK`TIME`IC: |-
        perm^config.admin
      HELP`TIME`IC: |-
        The IC date `+time` shows comes from these settings, changed with `+config time/<setting>=<value>`:

        - `ic-anchor`: a moment, in seconds since 1970, when the IC clock reads the same as the real one. `1767225600`, 1 January 2026 at midnight UTC, by default.
        - `ic-ratio`: how many IC seconds pass each real second. `1` by default; `2` makes an IC day pass in twelve real hours.
        - `ic-days`: days added to the IC date. Below 0 goes back.
        - `ic-years`: years added to the year shown.
        - `ic-months`: the twelve month names, January's first, split by `|`. Empty uses the real ones.
        - `ic-weekdays`: the seven weekday names, Sunday's first, split by `|`. Empty uses the real ones.
        - `ic-show`: `no` takes the IC date off `+time`.

        How the date is written is `` FORMAT`IC `` on the Clock object. It is evaluated with `%%<year>`, `%%<month>` \(1 to 12\), `%%<monthname>`, `%%<day>`, `%%<weekday>` \(its name\), `%%<hour>`, `%%<minute>` and `%%<second>`.

        For example, a game set 300 years on, whose IC days run twice as fast from 1 March 2026. `convtime\(\)` turns the date into seconds:

        `think convtime\(2026-03-01T00:00:00Z\)`

        Output: `1772323200`

        `+config time/ic-anchor=1772323200`

        `+config time/ic-ratio=2`

        `+config time/ic-years=300`

        The IC calendar is the real one's: twelve months of the real lengths. A calendar of its own, with other month lengths, is a game's own code in `` FORMAT`IC ``.
      HELP`TIME`CODE: |-
        Other code reads the time through functions on the Clock object, with `u\(\)`. The Clock is VISUAL, so any object may call them.

        - `` u\(<Clock>/FUN`IC`DATE\) ``: the IC date now, as `` FORMAT`IC `` writes it. Give a moment in seconds for another time: `` u\(<Clock>/FUN`IC`DATE,<seconds>\) ``.
        - `` u\(<Clock>/FUN`IC`SECS,<seconds>\) ``: the IC clock's moment, in seconds, before the years are added.
        - `` u\(<Clock>/FUN`OOC`FOR,<seconds>,<player>\) ``: that moment in the player's zone, or the game's when they set none.
        - `` u\(<Clock>/FUN`OOC`SHOW,<seconds>,<zone>\) ``: that moment in a zone, the game's when it is left empty.
        - `` u\(<Clock>/FUN`ZONE`OF,<player>\) ``: the player's zone, or nothing.
        - `` u\(<Clock>/FUN`ZONE`GAME\) ``: the game's zone.
        - `` u\(<Clock>/FUN`ZONE`FIND,<text>\) ``: the zone a player's text names, short names included, or nothing.
        - `` u\(<Clock>/FUN`DATE`INSTANT,<date>,<hour>,<minute>,<zone>\) ``: a date such as `2026-10-20` at that hour and minute in that zone, in seconds.

        For example, with the shipped settings:

        `` think u\(<Clock>/FUN`IC`DATE,1767225600\) ``

        Output: `Thursday, 1 January 2026, 00:00`

        ## Adding to +time

        Another package adds lines to the `+time` screen with a filter on the Time object: an attribute named `` FILTER`TIME`SCREEN`<name> ``. Filters run in name order with `chain\(\)`, each given the screen so far as `%%0`, the player reading as `%%1` and the moment as `%%2`, and each returns the screen with its own lines added:

        `` &FILTER`TIME`SCREEN`WEATHER <Time>=%%0%%r\[fields\(,Weather,Light rain\)\] ``
      HELP`TIMEZONE: |-
        `+timezone` sets your time zone, the one `+time` shows your time in and reads a time you type in.

        - `+timezone` shows yours.
        - `+timezone <zone>` sets it: `+timezone America/New_York`.
        - `+timezone/clear` clears it. Times are then shown and read in the game's.
        - `+timezone/hide` keeps your zone to you and staff: `+time <name>` tells anyone else you keep it to yourself, and other packages read nothing. `+timezone/unhide` shows it again.
        - `+timezone/detect` sets the zone your client reported. When it reported none, a game may look up where you connect from instead.
        - `+timezone/match <time>` lists the zones where it is that time now, each a link that sets it: `+timezone/match 8:15pm`.

        A zone is named the way the tz database names it: a region and a city, such as `America/Chicago`, `Europe/Berlin` or `Australia/Perth`, or `UTC`. Capitals are put in for you, so `america/new_york` works. Short names work too:

        - `eastern`, `est`, `edt`: America/New_York
        - `central`, `cst`, `cdt`: America/Chicago
        - `mountain`, `mst`, `mdt`: America/Denver
        - `arizona`: America/Phoenix
        - `pacific`, `pst`, `pdt`: America/Los_Angeles
        - `alaska`: America/Anchorage
        - `hawaii`: Pacific/Honolulu
        - `uk`, `gmt`, `bst`: Europe/London
        - `cet`, `cest`: Europe/Paris
        - `eet`: Europe/Athens
        - `jst`: Asia/Tokyo
        - `aest`, `aedt`: Australia/Sydney
        - `nzst`, `nzdt`: Pacific/Auckland

        `est` is New York's time, which moves to summer time and back, not a clock fixed five hours behind UTC. A game may keep more short names: see `+help time settings`.

        For example:

        `+timezone pacific`

        Output: `\[TIME\] Done: Your time zone is America/Los_Angeles \(UTC-07:00\). It is <the time there> for you.`

        `+timezone/match` suits a client that reports no zone: type the time where you are, rounded as you like, and pick your zone from the list.

        `+timezone/match 9pm`

        Output: `\[TIME\] It is 21:04 now in these zones. Choose yours:` and a line for each zone, such as `+timezone Europe/Paris · UTC+02:00`.

        See `+help timezone client` for the zone your client reports.

        Your zone is your `TZ` attribute, as PennMUSH keeps it, so `time\(*<name>\)` reads it too. Everyone can read it unless you hide it, which clears the attribute's `visual` flag. A zone you hide stays hidden when you change it.
      HELP`TIMEZONE`CLIENT: |-
        Some clients tell the game which time zone they are in. When you have not set one, the game uses it:

        - The web portal always reports your browser's zone.
        - BSD telnet and inetutils telnet report it when you type `environ define TZ Europe/Paris` and then `environ export TZ` at the `telnet>` prompt, before you open the game.
        - PuTTY reports it when you add `TZ` with your zone, such as `Europe/Paris`, under Connection, Data, Environment variables.
        - Mudlet, TinTin++, MUSHclient and most other MUD clients report none. Use `+timezone/match` or `+timezone <zone>`.

        When your client reports no zone, a game may look one up from where you connect from, by asking a zone service on the internet. Staff decide whether it does and which service it asks. The guess is often wrong behind a VPN or on a mobile network.

        A zone set this way is hidden, since you did not choose to share it: `+timezone/unhide` shares it. A zone you set yourself is never changed. A game may only tell you what it found, and leave setting it to `+timezone/detect`, or ignore it: see `+help time settings`.

        Output, on logging in from the web portal in Paris with no zone set: `\[TIME\] Done: Your time zone is now Europe/Paris \(UTC+02:00\), from your client. Only you and staff see it: +timezone/unhide shares it, and +timezone <zone> changes it.`

  # A client's zone (clientzone()), at login and whenever a client reports one, handed to the Time object.
  - ref: events
    target: "{{$event_handler}}"
    attributes:
      PLAYER`CONNECT`TIME: |-
        @trigger/args {{time}}/EVENT`ZONE=player,%<objid>,zone,clientzone(%<descriptor>),login,1
      SOCKET`TIMEZONE`TIME: |-
        @assert strlen(%<player>); @trigger/args {{time}}/EVENT`ZONE=player,%<player>,zone,%<zone>,login,0

      INC`WATCH`ANNOUNCEOFF:
        value: |-
          @assert get({{store}}/WATCH`%<key>`ANNOUNCED); &WATCH`%<key>`ANNOUNCED {{store}}; think setq(watch_hearers,filterbool(%!/FUN`WATCH`HEARS,u(%!/FUN`WATCH`CONNECTED,get({{store}}/WATCH`%<key>`BY)),,,%<target>)); @assert words(%q<watch_hearers>); @pemit/list %q<watch_hearers>=notice(RP,name(%<target>) has disconnected.)
        flags: [cmdsyntax]

      # ---- connect and disconnect -----------------------------------------------
      # Master room ACONNECT and ADISCONNECT run for every player, as this object, with %# the player and %1
      # how many connections they have. Only the first connection and the last disconnection count.
      ACONNECT:
        value: |-
          @assert cand(eq(%1,1),hastype(%#,player)); @include/nobreak/args %!/INC`WATCH`ANNOUNCE=target,%#,event,connected; @include/nobreak %!/INC`CONNECT`WATCHED; @include/nobreak %!/INC`CONNECT`ANSWERS
        flags: [cmdsyntax]
      ADISCONNECT:
        value: |-
          @assert cand(eq(%1,0),hastype(%#,player)); think setq(viewer_key,u(%!/FUN`KEY,%#)); @include/nobreak/args %!/INC`WATCH`ANNOUNCE=target,%#,event,disconnected; @assert hasattr({{store}},LFRP`%q<viewer_key>); @include/args %!/INC`LFRP`CLEAR=key,%q<viewer_key>
        flags: [cmdsyntax]
      # At login: who of those the player watches is on, unless they muted the watch list.
      INC`CONNECT`WATCHED:
        value: |-
          think setq(viewer_key,u(%!/FUN`KEY,%#)); @break get({{store}}/WATCH`%q<viewer_key>`MUTE); think setq(watch_online,u(%!/FUN`WATCH`ONLINE,u(%!/FUN`WATCH`LIST,%q<viewer_key>))); @assert words(%q<watch_online>); @pemit %#=notice(RP,On now of those you watch: [u(%!/FUN`DISPLAY`NAMES,%q<watch_online>)].)
        flags: [cmdsyntax]
      # At login: the answers the player has not read to their open calls.
      INC`CONNECT`ANSWERS:
        value: |-
          think setq(call_unread,squish(iter(u(%!/FUN`CALL`OPENOF,u(%!/FUN`KEY,%#)),if(get({{store}}/CALL`%i0`NEW),%i0)))); @assert words(%q<call_unread>); @pemit %#=notice(RP,Your open [if(eq(words(%q<call_unread>),1),call %q<call_unread> has,calls [itemize(%q<call_unread>)] have)] new answers. +call <number> reads them.)
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot. Defining the feed kind
      # again changes nothing; its age and length follow DATA`CALL`DAYS and DATA`CALL`LENGTH.
      STARTUP:
        value: |-
          @feed/define rpcall=%!; @feed/describe rpcall=Open RP calls posted with +call/post.; @feed/set rpcall/max_messages=0; @feed/set rpcall/max_age=[get(%!/DATA`CALL`DAYS)]d; @feed/set rpcall/max_length=get(%!/DATA`CALL`LENGTH); @feed/set rpcall/style=say; @dolist/inline lfrp call calls watch friend={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # Every record: statuses, open calls and their answers, and watch lists. Inside the RP Finder, so no
  # player can reach it, and no_command, so nothing kept on it is ever matched as a command.
  - ref: store
    type: thing
    name: RP Finder Store
    location: "{{finder}}"
    flags: [no_command]
    attributes:
      LFRP: |-
        Looking-for-RP statuses, one branch per player key.
      CALL: |-
        Open calls, one branch per call number.
      POSTED: |-
        Each poster's open call numbers, one leaf per player key.
      WATCH: |-
        Watch lists, one branch per player key.
      COUNTER: |-
        Counters.
      COUNTER`CALL: |-
        0
      SENDING: |-
        The call being posted, while the rpcall feed delivers it.

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: finder_help
    type: thing
    name: RP Finder Help
    location: "{{finder}}"
    attributes:
      HELP: |-
        Finding roleplay: +lfrp, open calls and the watch list.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`LFRP: |-
        calls|watch
      SEE`CALLS: |-
        lfrp|watch
      SEE`WATCH: |-
        lfrp|calls
      HELP`LFRP: |-
        `+lfrp` tells the game you are looking for roleplay, and shows who else is.

        - `+lfrp <text>` says what you would like to play, in a line others read in character: `+lfrp Stacking wood by the cabin, glad of company`.
        - `+lfrp/note <text>` adds an OOC note: what kind of scene, how long you have, what you would rather not play.
        - `+lfrp/place <text>` says where to find you. `+lfrp/place here` shows wherever you are standing, as you move.
        - `+lfrp/off` ends it.

        Leave the text out of `/note` or `/place` to clear it. Your status lasts a few hours from when you last changed it \(four, unless the game changed it\), and ends when you log off.

        ## Finding someone

        - `+lfrp` lists everyone connected who is looking, least idle first. A long list comes in pages: `+lfrp/2`.
        - `+lfrp/show <name>` shows one person's status with their note. `+lfrp/show` on its own shows yours.

        The list shows only who you could see in `WHO`.
      HELP`CALLS: |-
        An **open call** is a request anyone may answer: a scene you would like to run, a character you want to meet, a plot hook.

        - `+call/post <text>` posts one. You may have a few open at a time \(three, unless the game changed it\), and each stays up for a week.
        - `+calls` lists the open calls, newest first, and `+call <number>` reads one.
        - `+call/answer <number>=<text>` answers it. The poster hears at once if they are connected, and otherwise when they next log in. Answering again replaces your answer.
        - `+call/close <number>` closes your own call.
        - `+calls/mine` lists your own open calls and how many new answers each has.
        - `+calls/on` sends you each new call as it is posted, and `+calls/off` stops them.

        Answers are private: the poster reads them all, and everyone else sees only their own.
      HELP`WATCH: |-
        The **watch list** tells you when people you want to play with connect and leave.

        - `+watch/add <name>` watches someone, and `+watch/del <name>` stops.
        - `+watch` lists the people you watch who are on, with where they are and what they are looking for. `+watch/list` lists them all, with when each was last on.
        - `+watch/mute` stops the connect and disconnect lines but keeps your list, and `+watch/unmute` starts them again.

        `+friend` is the same command, so `+friend/add` and `+friend/del` work too.

        ## Privacy

        - `+watch/watchers` shows who watches you.
        - `+watch/hide` keeps you out of everyone's watch lines and their `+watch`. `+watch/unhide` undoes it.
        - Someone your page lock keeps out is never told when you connect. See `help @lock/page`.
        - Nobody hears of you while you are DARK or connected hidden, and someone who cannot locate you sees no room for you in `+watch`.
      HELP`RP: |-
        The RP finder helps you find someone to play with.

        - `+lfrp` says what you are looking for, and lists who else is looking. See \[lfrp\].
        - `+call/post` puts up an open call anyone may answer, and `+calls` lists them. See \[calls\].
        - `+watch` tells you when the people you follow connect. See \[watch\].
      HELP`RP`STAFF: |-
        Staff with the `softcode.rp_finder.moderate` permission, which the `rp-moderator` role allows, look after the finder:

        - `+call/close <number>` closes anyone's call, and `+call <number>` shows them every answer to it.
        - `+lfrp/off <name>` clears someone's status, and tells them.

        ## Settings

        Each setting is an attribute on the RP Finder object in the master room:

        - `` DATA`LFRP`HOURS ``: how long a status lasts. 4 by default.
        - `` DATA`CALL`DAYS ``, `` DATA`CALL`MAX `` and `` DATA`CALL`LENGTH ``: how long a call stays up, how many one player may have open, and the longest call or answer. 7, 3 and 1000.
        - `` DATA`WATCH`MAX ``: how many people one player may watch. 100.
        - `` DATA`WATCH`QUIET ``: seconds before a player's connect is announced again, so a dropped connection does not announce itself each time. 300.
        - `` DATA`LFRP`MORE ``: a line shown under `+lfrp`, such as where longer requests are posted. Unset by default.

        A change to the call settings reaches the open-call feed at the next restart.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`RP-FINDER: |-
        {{finder_help}}

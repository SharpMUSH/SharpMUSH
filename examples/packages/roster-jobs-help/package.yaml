format: "1.16"
package: roster-jobs-help
title: "Roster applications through jobs: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Roster applications through jobs topics into +help: registers the roster-jobs package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [roster-jobs, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. roster-jobs keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: roster-jobs
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/roster-jobs/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`ROSTER-JOBS: |-
        {{roster-jobs/roster_jobs_help}}

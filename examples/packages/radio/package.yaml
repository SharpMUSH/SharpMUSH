        @assert strlen(setr(target_player,u({{radio}}/FUN`PLAYER,%q<cmd_right>)))=@pemit %#=notice(RADIO,I don't know a player called '%q<cmd_right>'.,warn); @assert not(u({{radio}}/FUN`ON,%q<frequency_id>,%q<target_player>,%<list>))=@pemit %#=notice(RADIO,[name(%q<target_player>)] is one of the %<listword> of [u({{radio}}/FUN`NAME,%q<frequency_id>)] already.,warn); &DATA`FREQUENCY`%q<frequency_id>`LIST`%<list> {{radio}}=squish(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LIST`%<list>) %q<target_player>); @pemit %#=notice(RADIO,[name(%q<target_player>)] is one of the %<listword> of [u({{radio}}/FUN`NAME,%q<frequency_id>)] now.,ok)
      INC`DO`LISTREM: |-
        @assert strlen(setr(target_player,u({{radio}}/FUN`PLAYER,%q<cmd_right>)))=@pemit %#=notice(RADIO,I don't know a player called '%q<cmd_right>'.,warn); @assert u({{radio}}/FUN`ON,%q<frequency_id>,%q<target_player>,%<list>)=@pemit %#=notice(RADIO,[name(%q<target_player>)] is not one of the %<listword> of [u({{radio}}/FUN`NAME,%q<frequency_id>)].,warn); &DATA`FREQUENCY`%q<frequency_id>`LIST`%<list> {{radio}}=remove(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LIST`%<list>),%q<target_player>); @pemit %#=notice(RADIO,[name(%q<target_player>)] is no longer one of the %<listword> of [u({{radio}}/FUN`NAME,%q<frequency_id>)].,ok)

      # ---- admins ---------------------------------------------------------------

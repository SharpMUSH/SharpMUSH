        @include {{radio}}/INC`NEED`JOINED; think setq(title_length,u({{radio}}/FUN`CONFIG,TITLE-LENGTH)); @assert lte(strlen(%q<cmd_right>),%q<title_length>)=@pemit %#=notice(RADIO,A title is up to %q<title_length> characters.,warn); &DATA`PLAYER`%q<viewer_key>`TITLE`%q<frequency_id> {{radio}}=%q<cmd_right>; @pemit %#=notice(RADIO,if(strlen(%q<cmd_right>),Your title on [u({{radio}}/FUN`NAME,%q<frequency_id>)] is now %q<cmd_right>.,You have no title on [u({{radio}}/FUN`NAME,%q<frequency_id>)] now.),ok)

      INC`MODADD: |-
        @include {{radio}}/INC`NEED`ADMIN; @include/args {{radio}}/INC`DO`LISTADD=list,MODERATOR,listword,moderators
      INC`MODREM: |-
        @include {{radio}}/INC`NEED`ADMIN; @include/args {{radio}}/INC`DO`LISTREM=list,MODERATOR,listword,moderators
      INC`ADMADD: |-
        @include {{radio}}/INC`NEED`ADMIN; @include/args {{radio}}/INC`DO`LISTADD=list,ADMIN,listword,admins
      INC`ADMREM: |-
        @include {{radio}}/INC`NEED`ADMIN; @include/args {{radio}}/INC`DO`LISTREM=list,ADMIN,listword,admins

        @assert u({{radio}}/FUN`CAN`CREATE,%#)=@pemit %#=notice(RADIO,Only a radio admin can create frequencies.,error); @include {{radio}}/INC`NEED`FREENAME; think setq(frequency_id,inc(get({{radio}}/DATA`COUNTER))); &DATA`COUNTER {{radio}}=%q<frequency_id>; &DATA`FREQUENCY`%q<frequency_id>`NAME {{radio}}=%q<cmd_left>; &DATA`FREQUENCY`%q<frequency_id>`CATEGORY {{radio}}=%q<cmd_right>; &DATA`FREQUENCY`%q<frequency_id>`LIST`ADMIN {{radio}}=objid(%#); @pemit %#=notice(RADIO,Created %q<cmd_left>. +radio/join %q<cmd_left> tunes in.,ok)
      # %q<cmd_left> as a new name: letters, digits, spaces, . and -, no longer than NAME-LENGTH, and no frequency

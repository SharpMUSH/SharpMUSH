      INC`RENAME: |-
        @include {{radio}}/INC`NEED`ADMIN; think setqm(old_name,u({{radio}}/FUN`NAME,%q<frequency_id>),
        cmd_left,%q<cmd_right>); @include {{radio}}/INC`NEED`FREENAME; &DATA`FREQUENCY`%q<frequency_id>`NAME {{radio}}=%q<cmd_left>; @pemit %#=notice(RADIO,%q<old_name> is called %q<cmd_left> now.,ok)
      INC`CATEGORY: |-
        @include {{radio}}/INC`NEED`ADMIN; &DATA`FREQUENCY`%q<frequency_id>`CATEGORY {{radio}}=%q<cmd_right>; @pemit %#=notice(RADIO,[u({{radio}}/FUN`NAME,%q<frequency_id>)] is in [firstof(%q<cmd_right>,no category)] now.,ok)
      INC`DESC: |-
        @include {{radio}}/INC`NEED`ADMIN; &DATA`FREQUENCY`%q<frequency_id>`DESC {{radio}}=%q<cmd_right>; @pemit %#=notice(RADIO,Set the description of [u({{radio}}/FUN`NAME,%q<frequency_id>)].,ok)
      # /delete <frequency> asks; /delete <frequency>=<its name> deletes it, its lines and everyone's settings.
      INC`DELETE: |-
        @include {{radio}}/INC`NEED`ADMIN; think setq(frequency_name,u({{radio}}/FUN`NAME,%q<frequency_id>)); @assert strmatch(%q<cmd_right>,%q<frequency_name>)=@pemit %#=notice(RADIO,This deletes %q<frequency_name> with everything said on it. Type +radio/delete %q<frequency_name>=%q<frequency_name> to do it.,warn); @feed/delete radio/%q<frequency_id>; @wipe {{radio}}/DATA`FREQUENCY`%q<frequency_id>`**; &DATA`FREQUENCY`%q<frequency_id> {{radio}}; @dolist/inline lattr({{radio}}/DATA`PLAYER`*`*`%q<frequency_id>)=&## {{radio}}; @pemit %#=notice(RADIO,Deleted %q<frequency_name>.,ok)
      # /lock <frequency>/<talk|moderate|admin>=<lock>; /unlock puts back the default.

        rule(u({{radio}}/FUN`NAME,%q<frequency_id>))%r[fields(,Category,firstof(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`CATEGORY),none),About,firstof(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`DESC),none),You,switch(u({{radio}}/FUN`STATE,%q<frequency_id>,%#),on,tuned in,gagged,tuned in and gagged,not tuned in),Title,firstof(get({{radio}}/DATA`PLAYER`%q<viewer_key>`TITLE`%q<frequency_id>),none),Alterego,firstof(get({{radio}}/DATA`PLAYER`%q<viewer_key>`ALTEREGO`%q<frequency_id>),none),Listening,u({{radio}}/FUN`NAMES,iter(feedwho(radio/%q<frequency_id>,active),if(hasflag(%i0,connected),%i0))),Admins,u({{radio}}/FUN`NAMES,get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LIST`ADMIN)),Moderators,u({{radio}}/FUN`NAMES,get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LIST`MODERATOR)),Members,u({{radio}}/FUN`NAMES,get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LIST`MEMBER)))][if(u({{radio}}/FUN`IS`ADMIN,%q<frequency_id>,%#),%r[fields(,Talk lock,firstof(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LOCK`TALK),everyone),Moderate lock,firstof(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LOCK`MODERATE),get({{radio}}/DATA`LOCK`MODERATE)),Admin lock,firstof(get({{radio}}/DATA`FREQUENCY`%q<frequency_id>`LOCK`ADMIN),get({{radio}}/DATA`LOCK`ADMIN)),Keeps,feedinfo(radio/%q<frequency_id>,max_messages) lines)])]%r[rule()]
      # +radio/recall[/<page>] <frequency>[=<lines>]: the last lines, the newest page first.

        think setqm(lock_name,ucstr(after(%q<cmd_left>,/)),
        cmd_left,before(%q<cmd_left>,/)); @include {{radio}}/INC`NEED`ADMIN; @assert member(TALK MODERATE ADMIN,%q<lock_name>)=@pemit %#=notice(RADIO,+radio/lock <frequency>/talk=<lock> %(or /moderate or /admin%),warn); @assert strlen(%q<cmd_right>)=@pemit %#=notice(RADIO,Give a lock%, such as role^police. +radio/unlock puts back the default.,warn); @assert not(strmatch(testlock(%q<cmd_right>,%#),#-*))=@pemit %#=notice(RADIO,'%q<cmd_right>' is not a lock.,warn); &DATA`FREQUENCY`%q<frequency_id>`LOCK`%q<lock_name> {{radio}}=%q<cmd_right>; @pemit %#=notice(RADIO,The [lcstr(%q<lock_name>)] lock of [u({{radio}}/FUN`NAME,%q<frequency_id>)] is %q<cmd_right> now.,ok)
      INC`UNLOCK: |-
        think setqm(lock_name,ucstr(after(%q<cmd_left>,/)),
        cmd_left,before(%q<cmd_left>,/)); @include {{radio}}/INC`NEED`ADMIN; @assert member(TALK MODERATE ADMIN,%q<lock_name>)=@pemit %#=notice(RADIO,+radio/unlock <frequency>/talk %(or /moderate or /admin%),warn); &DATA`FREQUENCY`%q<frequency_id>`LOCK`%q<lock_name> {{radio}}; @pemit %#=notice(RADIO,The [lcstr(%q<lock_name>)] lock of [u({{radio}}/FUN`NAME,%q<frequency_id>)] is the default now.,ok)
      # /options <frequency>/<keep|age|length>=<value>: the feed's own limits, set on its feed.
      INC`OPTIONS: |-
        think setqm(option_name,lcstr(after(%q<cmd_left>,/)),
        cmd_left,before(%q<cmd_left>,/)); @include {{radio}}/INC`NEED`ADMIN; @assert member(keep age length,%q<option_name>)=@pemit %#=notice(RADIO,+radio/options <frequency>/keep=<lines>%, /age=<30d> or /length=<characters>. Nothing after = puts back the default.,warn); @feed/set radio/%q<frequency_id>/[switch(%q<option_name>,keep,max_messages,age,max_age,max_length)]=%q<cmd_right>; @pemit %#=notice(RADIO,[u({{radio}}/FUN`NAME,%q<frequency_id>)]: %q<option_name> is [firstof(%q<cmd_right>,the default)].,ok)

      # ---- lifecycle ------------------------------------------------------------
      # A player's gags end when they disconnect. The radio sits in the master room, so this runs for everyone.
      ADISCONNECT: |-
        @dolist/inline feedsof(%#,radio)=@feed/ungag ##=%#
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot. Defining the kind
      # again changes nothing.
      STARTUP: |-
        @feed/define radio={{radio}}; @feed/describe radio=The +radio frequencies.; @command/add/noparse/rsnoparse +radio; @hook/override/inline +radio={{radio}},CMD`RADIO
      AINSTALL: |-
        @teleport {{radio}}=#2; @trigger {{radio}}/STARTUP

  # The +help topics. A plain thing, not the WIZARD radio: the librarian cannot u() a privileged object's
  # attributes. Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: radio_help
    type: thing
    name: Radio Help
    location: "{{radio}}"
    attributes:
      HELP: |-
        Radio: frequencies to tune in to and speak on.
      SEE`RADIO: |-
        radio moderators|radio admins|radio settings
      SEE`RADIO`MODERATORS: |-
        radio|radio admins
      SEE`RADIO`ADMINS: |-
        radio|radio moderators|radio settings
      SEE`RADIO`SETTINGS: |-
        radio|radio admins|config
      HELP`RADIO: |-
        The radio is a set of **frequencies**. Tune in to one and you hear everything said on it, wherever you are, and you can speak on it yourself.

        - `+radio` lists the frequencies you can tune in to, a screen at a time: `+radio/2` is the second page.
        - `+radio/join <frequency>` tunes in, and `+radio/leave <frequency>` tunes out.
        - `+radio <frequency>=<message>` speaks. Start the message with `:` to pose or `;` to pose without a space.
        - `+radio/recall <frequency>\[=<lines>\]` shows what was said last, 50 lines unless you ask for another number. A long recall comes a screen at a time, the newest first: `+radio/recall/2 <frequency>` shows the lines before.
        - `+radio/examine <frequency>` shows a frequency, who is listening, and your settings on it.

        You only have to type enough of a frequency's name to tell it from the others you are tuned in to: `+radio pol=Unit 4, respond.`

        ## Your settings

        - `+radio/gag <frequency>` stops what you hear on it until you `+radio/ungag` it or disconnect. `+radio/gag all` gags every frequency.
        - `+radio/title <frequency>=<title>` puts a title before your name on that frequency.
        - `+radio/alterego <frequency>=<name>` speaks under another name there, such as a callsign. What you said keeps that name in the recall.
        - `+radio/color <frequency>=<colour>` shows that frequency's name in a colour of your choosing: a theme colour such as `info`, `primary` or `success`, which follows your `@theme`, a colour such as `+red` or `#ff8800`, or ansi() codes such as `hg`. See `help tone\(\)` and `help ansi\(\)`.

        Leave the part after `=` empty to clear a setting.
      HELP`RADIO`MODERATORS: |-
        A frequency's moderators keep order on it. Whoever holds the `radio-moderator` role moderates every frequency.

        - `+radio/restrict <frequency>=<player>/<duration>` stops a player speaking there, for `30m`, `2h` or `7d`. With no duration it lasts until lifted. They can still listen.
        - `+radio/unrestrict <frequency>=<player>` lifts it.
        - `+radio/memadd <frequency>=<player>` and `+radio/memrem` put a player on the frequency's members list or take them off.

        Members can always tune in and speak, whatever the talk lock says. That is how a closed frequency lets its people in: lock it to nobody else and add them as members.
      HELP`RADIO`ADMINS: |-
        A frequency's admins run it. A radio admin, the `radio-admin` role, runs every frequency and creates new ones.

        - `+radio/create <name>\[=<category>\]` creates a frequency, with you as its first admin. A name is up to 30 letters, digits, spaces, dots and dashes, or as many as the `name-length` setting allows.
        - `+radio/rename <frequency>=<name>`, `+radio/category <frequency>=<category>` and `+radio/desc <frequency>=<text>` change how it is listed. Renaming keeps everything said on it.
        - `+radio/delete <frequency>` deletes it, with everything said on it, once you confirm by typing its name after `=`.
        - `+radio/modadd`, `+radio/modrem`, `+radio/admadd` and `+radio/admrem <frequency>=<player>` change who moderates and runs it.

        ## Locks

        `+radio/lock <frequency>/talk=<lock>` decides who else may tune in and speak; with no talk lock, everyone may. `/moderate` and `/admin` decide who else moderates and runs it; by default the wizard role and radio admins do, and radio moderators moderate. Being on a list always passes its lock. `+radio/unlock <frequency>/talk` puts back the default. Any lock works, such as `role^police` or `perm^softcode.radio.admin`.

        ## What it keeps

        `+radio/options <frequency>/keep=<lines>` sets how many lines a frequency keeps for recall, 500 unless set. `/age=30d` drops lines older than that, and `/length=<characters>` refuses longer messages. Leave the part after `=` empty to put back the default.
      LOCK`RADIO`SETTINGS: |-
        perm^config.admin
      HELP`RADIO`SETTINGS: |-
        Staff change how the radio works with `+config radio`, which lists its settings. `+config radio/<setting>=<value>` changes one, and `+config/reset radio/<setting>` puts back its default.

        - `color`: the colour of a frequency's name for a listener who chose none, `info` unless set.
        - `recall`: how many lines `+radio/recall` shows when no number is given, 50 unless set.
        - `recall-max`: the most lines a player may ask `+radio/recall` for, 500 unless set.
        - `name-length`, `title-length` and `alterego-length`: the longest frequency name, title and alterego, in characters.

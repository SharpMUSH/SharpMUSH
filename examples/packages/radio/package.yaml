        @include {{radio}}/INC`NEED`ANY; @assert u({{radio}}/FUN`CAN`JOIN,%q<frequency_id>,%#)=@pemit %#=notice(RADIO,You may not tune in to [u({{radio}}/FUN`NAME,%q<frequency_id>)].,error); think setqm(recall_count,firstof(%q<cmd_right>,u({{radio}}/FUN`CONFIG,RECALL)),
        recall_most,u({{radio}}/FUN`CONFIG,RECALL-MAX)); @assert cand(isint(%q<recall_count>),gt(%q<recall_count>,0),lte(%q<recall_count>,%q<recall_most>))=@pemit %#=notice(RADIO,Recall takes a number of lines from 1 to %q<recall_most>.,warn); think setq(recall_ids,feedrecall(radio/%q<frequency_id>,%q<recall_count>)); @assert words(%q<recall_ids>)=@pemit %#=notice(RADIO,Nothing has been said on [u({{radio}}/FUN`NAME,%q<frequency_id>)].); @include/args {{radio}}/INC`PAGE=count,words(%q<recall_ids>),frame,3; @pemit %#=u({{radio}}/FUN`SCREEN`RECALL)

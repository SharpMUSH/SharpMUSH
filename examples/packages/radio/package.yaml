        recall_first,max(1,sub(%q<recall_last>,dec(%q<page_size>))))[rule(Recall: [u({{radio}}/FUN`NAME,%q<frequency_id>)])]%r[iter(extract(%q<recall_ids>,%q<recall_first>,inc(sub(%q<recall_last>,%q<recall_first>))),uargs({{radio}}/FUN`LINE,id,%i0,frequency,%q<frequency_id>,speaker,feedmsg(%i0,speaker),name,firstof(feedmsg(%i0,display),feedmsg(%i0,name)),style,feedmsg(%i0,style),text,feedmsg(%i0,text),reader,%#),%b,%r)]%r[rule(End of recall[u({{radio}}/FUN`PAGE`FOOTER,+radio/recall/[inc(%q<page_number>)] %q<cmd_left>[if(strlen(%q<cmd_right>),=%q<cmd_right>)] for the lines before)])]


format: "1.16"
package: radio
title: "Radio"
version: 1.5.0
authors: [SharpMUSH]
description: "Radio: +radio frequencies players tune in to, speak on and recall, with moderators, admins and their own locks. Built on @feed: the engine keeps each frequency's lines and listeners; this package keeps the names, lists and rules."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [radio, channels, comms, feed]
category: Community
requires_server: ">=0.1"


# Who may create frequencies, and who moderates and runs every one of them, is a permission, so it
# moves with roles: @role/assign <player>=radio-admin, or radio-moderator to moderate every frequency.
# Wizards pass the default locks too.
categories:
  roles:
    - name: Radio
      description: Roles for the people who run the radio.
  permissions:
    - name: Radio
      description: Running the radio and its frequencies.
permissions:
  - name: softcode.radio.admin
    category: Radio
    description: Create radio frequencies, and moderate and run every one of them.
  - name: softcode.radio.moderate
    category: Radio
    description: Moderate every radio frequency.
roles:
  - slug: radio-admin
    name: Radio Admin
    category: Radio
    priority: 10
    permissions:
      softcode.radio.admin: allow
  - slug: radio-moderator
    name: Radio Moderator
    category: Radio
    priority: 5
    permissions:
      softcode.radio.moderate: allow

objects:
  # The radio: the @feed kind's owner, so its attributes are the kind's tie-ins, and the command object.
  # WIZARD because it defines the feed kind and adds the +radio command and its hook.
  # +radio is an @hook/override/inline target of a command STARTUP adds with /noparse/rsnoparse, so what a
  # player types reaches the code as typed and nothing a player wrote is evaluated.
  #
  # What the engine keeps, per frequency: the feed radio/<id> (its lines within its limits, who is tuned
  # in, who is gagged). What this object keeps, in attributes: everything that is only how +radio works.
  #   DATA`FREQUENCY`<id>`NAME, `CATEGORY, `DESC      the frequency; <id> never changes, so a rename is one attribute
  #   DATA`FREQUENCY`<id>`LOCK`TALK|MODERATE|ADMIN    its locks; an unset one falls back to DATA`LOCK`<name>
  #   DATA`FREQUENCY`<id>`LIST`MEMBER|MODERATOR|ADMIN objids on its lists; a list always passes its lock
  #   DATA`FREQUENCY`<id>`RESTRICT`<key>              when a restriction ends, in seconds, or 0 for never
  #   DATA`PLAYER`<key>`TITLE|ALTEREGO|COLOR`<id>     a player's own settings on a frequency
  #   DATA`COUNTER                                    the highest frequency id given out; ids are never reused
  #   EXT`<switch>                                    another package's switch: the object whose INC`<switch> runs it
  #
  # Trees: CMD` the hooked command, INC`COMMAND` its parse and dispatch, INC` one routine per switch, FUN` the
  # reads, FUN`SCREEN` the paged screens, DATA`CONFIG` the settings +config radio shows.
  - ref: radio
    type: thing
    name: Radio
    flags: [WIZARD]
    attributes:
      # Everything this object keeps. NO_COMMAND, so a title or a name a player typed is never matched as a
      # $-command; restrictive flags reach every leaf under it.
      DATA:
        value: |-
          The radio's settings and records: frequencies, players' settings on them, and the locks and switches.
        flags: [no_command]

      # ---- settings: +config radio ------------------------------------------------
      # Each DATA`CONFIG`<NAME> is the value; the leaves under it tell +config what it accepts. The code reads the
      # value with get(); see plus-config's README.
      DATA`CONFIG: |-
        How frequencies look, how much +radio/recall shows, and how long names, titles and alteregos may be.
      DATA`CONFIG`LABEL: |-
        Radio
      DATA`CONFIG`COLOR: |-
        info
      DATA`CONFIG`COLOR`TYPE: |-
        text
      DATA`CONFIG`COLOR`DEFAULT: |-
        info
      DATA`CONFIG`COLOR`CHECK: |-
        CHECK`COLOR
      DATA`CONFIG`COLOR`DESCRIPTION: |-
        The colour of a frequency's name for a listener who chose none: a theme colour such as info, which each listener sees in their own @theme, or ansi() codes.
      DATA`CONFIG`COLOR`LABEL: |-
        Frequency colour
      DATA`CONFIG`COLOR`EXAMPLE: |-
        primary
      DATA`CONFIG`RECALL: |-
        50
      DATA`CONFIG`RECALL`TYPE: |-
        integer
      DATA`CONFIG`RECALL`DEFAULT: |-
        50
      DATA`CONFIG`RECALL`MIN: |-
        1
      DATA`CONFIG`RECALL`MAX: |-
        10000
      DATA`CONFIG`RECALL`DESCRIPTION: |-
        How many lines +radio/recall shows when no number is given.
      DATA`CONFIG`RECALL`LABEL: |-
        Lines recalled
      DATA`CONFIG`RECALL`EXAMPLE: |-
        20
      DATA`CONFIG`RECALL-MAX: |-
        500
      DATA`CONFIG`RECALL-MAX`TYPE: |-
        integer
      DATA`CONFIG`RECALL-MAX`DEFAULT: |-
        500
      DATA`CONFIG`RECALL-MAX`MIN: |-
        1
      DATA`CONFIG`RECALL-MAX`MAX: |-
        10000
      DATA`CONFIG`RECALL-MAX`DESCRIPTION: |-
        The most lines a player may ask +radio/recall for.
      DATA`CONFIG`RECALL-MAX`LABEL: |-
        Most lines recalled
      DATA`CONFIG`RECALL-MAX`EXAMPLE: |-
        200
      DATA`CONFIG`NAME-LENGTH: |-
        30
      DATA`CONFIG`NAME-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`NAME-LENGTH`DEFAULT: |-
        30
      DATA`CONFIG`NAME-LENGTH`MIN: |-
        3
      DATA`CONFIG`NAME-LENGTH`MAX: |-
        60
      DATA`CONFIG`NAME-LENGTH`DESCRIPTION: |-
        The longest name a frequency may have, in characters.
      DATA`CONFIG`NAME-LENGTH`LABEL: |-
        Longest frequency name
      DATA`CONFIG`NAME-LENGTH`EXAMPLE: |-
        20
      DATA`CONFIG`TITLE-LENGTH: |-
        40
      DATA`CONFIG`TITLE-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`TITLE-LENGTH`DEFAULT: |-
        40
      DATA`CONFIG`TITLE-LENGTH`MIN: |-
        1
      DATA`CONFIG`TITLE-LENGTH`MAX: |-
        200
      DATA`CONFIG`TITLE-LENGTH`DESCRIPTION: |-
        The longest title a player may put before their name on a frequency, in characters.
      DATA`CONFIG`TITLE-LENGTH`LABEL: |-
        Longest title
      DATA`CONFIG`TITLE-LENGTH`EXAMPLE: |-
        60
      DATA`CONFIG`ALTEREGO-LENGTH: |-
        30
      DATA`CONFIG`ALTEREGO-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`ALTEREGO-LENGTH`DEFAULT: |-
        30
      DATA`CONFIG`ALTEREGO-LENGTH`MIN: |-
        1
      DATA`CONFIG`ALTEREGO-LENGTH`MAX: |-
        100
      DATA`CONFIG`ALTEREGO-LENGTH`DESCRIPTION: |-
        The longest alterego a player may speak under on a frequency, in characters.
      DATA`CONFIG`ALTEREGO-LENGTH`LABEL: |-
        Longest alterego
      DATA`CONFIG`ALTEREGO-LENGTH`EXAMPLE: |-
        20
      # +config's CHECK for COLOR (%0 the value): a theme colour or ansi() codes.
      CHECK`COLOR: |-
        if(u(%!/FUN`COLOUR`VALID,%0),,'%0' is not a colour. Use a theme colour such as info or success%, or ansi() codes such as hg or +red.)

      # ---- configuration --------------------------------------------------------
      # Who passes the moderate and admin locks of a frequency that sets none, and who may create one: the wizard
      # role, and the permissions the radio roles carry.
      DATA`LOCK`MODERATE: |-
        role^wizard|perm^softcode.radio.moderate
      DATA`LOCK`ADMIN: |-
        role^wizard|perm^softcode.radio.admin
      # The switches +radio takes; each is INC`<SWITCH>. A package that adds one (radio-scene adds /log)
      # sets EXT`<SWITCH> here to its own object (a ref the package manager fills in, so it is read with u()).
      # +radio includes that object's INC`<SWITCH> with the same registers, %q<extension_object> that object, and
      # cmd_left, cmd_right and viewer_key as INC`COMMAND`PARSE sets them; INC`NEED`JOINED and INC`NEED`ANY set
      # frequency_id. The radio is still the executor, so the included code names the radio %! and its own object
      # %q<extension_object>.
      DATA`SWITCHES: |-
        join leave gag ungag title alterego color examine recall restrict unrestrict create rename category desc delete lock unlock options memadd memrem modadd modrem admadd admrem
      # What +radio says when a page of 0 is asked for: the command's usage line, one per paged route.
      DATA`USAGE`LIST: |-
        +radio lists the frequencies you can tune in to, a page at a time: +radio/2 is the second page.
      DATA`USAGE`RECALL: |-
        +radio/recall <frequency>=<lines> shows what was said last, a page at a time: +radio/recall/2 <frequency> is the page before.
      DATA`COUNTER: |-
        0

      # ---- the command ----------------------------------------------------------
      # %1 is the switches and %2 what follows, both as typed.
      CMD`RADIO:
        value: |-
          $(?is)^\+radio(/\S*)?(?\: +(.*))?$: think u({{radio}}/FUN`COMMAND`PARSE,%1,%2); @include {{radio}}/INC`COMMAND`CHECK; @include %q<extension_object>/INC`%q<cmd_route>
        flags: [REGEXP]
      # %0 the switches and %1 what follows, as typed. Sets cmd_switches (every switch, lower case), cmd_page (a last
      # switch of digits, the page asked for), cmd_switch (the switches without it), cmd_argument, cmd_equals (1 when
      # it has an =), cmd_left and cmd_right (either side of the =), cmd_route (the INC` routine to run) and
      # viewer_key (where the player's settings are filed).
      FUN`COMMAND`PARSE: |-
        setqm(cmd_switches,lcstr(after(%0,/)),
        cmd_page,if(regmatch(last(%q<cmd_switches>,/),^\[0-9\]+$),last(%q<cmd_switches>,/)),
        cmd_switch,if(strlen(%q<cmd_page>),revwords(rest(revwords(%q<cmd_switches>,/),/),/),%q<cmd_switches>),
        cmd_argument,trim(%1),
        cmd_equals,strmatch(%q<cmd_argument>,*=*),
        cmd_left,trim(before(%q<cmd_argument>,=)),
        cmd_right,trim(after(%q<cmd_argument>,=)),
        cmd_route,ucstr(firstof(%q<cmd_switch>,if(%q<cmd_equals>,SEND,if(strlen(%q<cmd_argument>),USAGE,LIST)))),
        viewer_key,u({{radio}}/FUN`KEY,%#))
      # The switch is one the radio or another package takes, a page goes only with a paged route, and a page of 0
      # answers with the usage line. Sets extension_object, the object whose INC`<route> runs.
      INC`COMMAND`CHECK: |-
        @assert cor(not(strlen(%q<cmd_switch>)),member(get({{radio}}/DATA`SWITCHES),%q<cmd_switch>),hasattr({{radio}},EXT`%q<cmd_switch>))=@pemit %#=notice(RADIO,+radio has no /%q<cmd_switch> switch. +help radio lists them.,warn); @assert cor(not(strlen(%q<cmd_page>)),match(LIST RECALL,%q<cmd_route>))=@pemit %#=notice(RADIO,+radio/%q<cmd_switch> takes no page number.,warn); @assert cor(not(strlen(%q<cmd_page>)),%q<cmd_page>)=@pemit %#=notice(RADIO,get({{radio}}/DATA`USAGE`%q<cmd_route>),warn); think setq(extension_object,if(cand(strlen(%q<cmd_switch>),hasattr({{radio}},EXT`%q<cmd_switch>)),u({{radio}}/EXT`%q<cmd_switch>),{{radio}}))

      # ---- reads ----------------------------------------------------------------
      # %0 a player: the key their settings are filed under.
      FUN`KEY: |-
        edit(objid(%0),#,,:,_)
      # Every frequency id.
      FUN`IDS: |-
        sort(iter(lattr({{radio}}/DATA`FREQUENCY`*`NAME),extract(%i0,3,1,`)),n)
      # %0 a frequency id: its name.
      FUN`NAME: |-
        get({{radio}}/DATA`FREQUENCY`%0`NAME)
      # %0 a player: the ids of the frequencies they are tuned in to.
      FUN`JOINED: |-
        squish(iter(feedsof(%0,radio),after(%i0,/)))
      # %0 what was typed, %1 the ids to look in: the id whose name it is, else the one name it begins,
      # else #-2 when it begins several and #-1 when none.
      FUN`FIND: |-
        setqm(find_exact,squish(iter(%1,if(strmatch(get({{radio}}/DATA`FREQUENCY`%i0`NAME),%0),%i0))),
        find_prefix,squish(iter(%1,if(strmatch(get({{radio}}/DATA`FREQUENCY`%i0`NAME),%0*),%i0))))[cond(eq(words(%q<find_exact>),1),%q<find_exact>,eq(words(%q<find_prefix>),1),%q<find_prefix>,words(%q<find_prefix>),#-2,#-1)]
      # %0 what was typed: the objid of the player it names, or nothing.
      FUN`PLAYER: |-
        if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
      # %0 id, %1 player, %2 MEMBER, MODERATOR or ADMIN: 1 when the player is on that list.
      FUN`ON: |-
        t(member(get({{radio}}/DATA`FREQUENCY`%0`LIST`%2),objid(%1)))
      # %0 id, %1 player, %2 TALK, MODERATE or ADMIN: 1 when the player passes that lock. A lock the
      # frequency does not set is DATA`LOCK`<name>, and an empty one passes everyone.
      FUN`PASS: |-
        setq(pass_lock,if(hasattr({{radio}},DATA`FREQUENCY`%0`LOCK`%2),get({{radio}}/DATA`FREQUENCY`%0`LOCK`%2),get({{radio}}/DATA`LOCK`%2)))[if(strlen(%q<pass_lock>),t(testlock(%q<pass_lock>,%1)),1)]
      FUN`IS`ADMIN: |-
        cor(u({{radio}}/FUN`ON,%0,%1,ADMIN),u({{radio}}/FUN`PASS,%0,%1,ADMIN))
      FUN`IS`MOD: |-
        cor(u({{radio}}/FUN`IS`ADMIN,%0,%1),u({{radio}}/FUN`ON,%0,%1,MODERATOR),u({{radio}}/FUN`PASS,%0,%1,MODERATE))
      # Who may tune in and recall: moderators, members, and whoever passes the talk lock.
      FUN`CAN`JOIN: |-
        cor(u({{radio}}/FUN`IS`MOD,%0,%1),u({{radio}}/FUN`ON,%0,%1,MEMBER),u({{radio}}/FUN`PASS,%0,%1,TALK))
      # Who may speak: whoever may tune in and is not restricted.
      FUN`CAN`TALK: |-
        cand(u({{radio}}/FUN`CAN`JOIN,%0,%1),not(u({{radio}}/FUN`RESTRICTED,%0,%1)))
      FUN`RESTRICTED: |-
        setq(restrict_until,get({{radio}}/DATA`FREQUENCY`%0`RESTRICT`[u({{radio}}/FUN`KEY,%1)]))[cand(isint(%q<restrict_until>),cor(eq(%q<restrict_until>,0),gt(%q<restrict_until>,secs())))]
      # Who may create frequencies.
      FUN`CAN`CREATE: |-
        t(testlock(get({{radio}}/DATA`LOCK`ADMIN),%0))
      # %0 id, %1 player: on, gagged, or - when not tuned in.
      FUN`STATE: |-
        if(feedmember(radio/%0,%1),if(feedmember(radio/%0,%1,gag),gagged,on),-)
      # %0 a duration, 30m, 2h or 7d: its seconds; 0 for none given, -1 for one that is not a duration.
      FUN`SECS: |-
        if(not(strlen(%0)),0,if(regmatch(%0,^\[0-9\]+\[mhd\]$),mul(left(%0,dec(strlen(%0))),switch(right(%0,1),m,60,h,3600,86400)),-1))
      # %0 a list of objids: their names.
      FUN`NAMES: |-
        firstof(itemize(iter(%0,name(%i0),,|),|),none)
      # %0 a setting: its value, as +config keeps it.
      FUN`CONFIG: |-
        get({{radio}}/DATA`CONFIG`%0)

      # ---- the line -------------------------------------------------------------
      # Named arguments: id (the line's id, when it has one), frequency (its id), speaker (objid), name (the name the
      # line is under), style, text, and reader (who reads it). The frequency's name in the reader's colour, then the
      # speaker's title on it. A line goes to every listener in one queue entry, so the parts that are the same for
      # all of them (title, speaker, frequency name) and the last painted name are kept in LINE_* registers, and
      # each listener after the first pays only for their colour.
      FUN`LINE: |-
        if(cor(not(strlen(%<id>)),comp(%q<line_id>,%<frequency>/%<id>)),setqm(line_id,%<frequency>/%<id>,
        line_title,get({{radio}}/DATA`PLAYER`[u({{radio}}/FUN`KEY,%<speaker>)]`TITLE`%<frequency>),
        line_speaker,if(strlen(%q<line_title>),%q<line_title>%b)%<name>,
        line_frequency,get({{radio}}/DATA`FREQUENCY`%<frequency>`NAME),
        line_painted_colour,#-1))[setq(line_colour,firstof(get({{radio}}/DATA`PLAYER`[edit(objid(%<reader>),#,,:,_)]`COLOR`%<frequency>),get({{radio}}/DATA`CONFIG`COLOR)))][if(comp(%q<line_painted_colour>,%q<line_colour>),setqm(line_painted_colour,%q<line_colour>,
        line_painted,u({{radio}}/FUN`PAINT,%q<line_colour>,%q<line_frequency>)))]<%q<line_painted>> [switch(%<style>,pose,%q<line_speaker> %<text>,semipose,%q<line_speaker>%<text>,emit,%<text>,announce,%<text>,%q<line_speaker> says\, "%<text>")]
      # %0 a colour, %1 text — the text in a theme colour when %0 names one (tone()), so each reader sees it in
      # their own @theme, and in ansi() codes otherwise. tone() is asked first: "info" also reads as ansi() codes.
      FUN`PAINT: |-
        if(strmatch(setr(paint_toned,tone(%0,%1)),#-*),ansi(%0,%1),%q<paint_toned>)
      # %0 a colour as typed: 1 when it is a theme colour tone() knows, a colour colors() knows (+red, #ff8800,
      # <255 136 0>, +xterm123), or ansi()'s letter codes (hg, hcB). ansi() itself ignores what it does not know,
      # so it cannot tell, and neither can colors() for a bare word: it reads "sparkly" as letter codes.
      FUN`COLOUR`VALID: |-
        cand(strlen(%0),cor(not(strmatch(tone(%0,x),#-*)),cand(regmatch(%0,^\[+#<0-9\]),not(strmatch(colors(%0,hex),#-*))),regmatch(%0,^\[fhiunxXrRgGyYbBmMcCwW\]+$)))
      # The feed's tie-in: each listener's copy of a line, read by name (help @feed tie-ins): key the
      # frequency's id, recipient the listener, name the alterego it was sent under.
      FEED`RADIO`FORMAT: |-
        uargs({{radio}}/FUN`LINE,id,%<id>,frequency,%<key>,speaker,%<speaker>,name,firstof(%<name>,name(%<speaker>)),style,%<style>,text,%<text>,reader,%<recipient>)

      # ---- pages ----------------------------------------------------------------
      # %<count> things to show, %<frame> the lines the screen takes besides them: sets page_size (the rows that fit
      # the reader's screen), page_count and page_number (the page asked for, 1 when none), and stops at a page past
      # the end.
      INC`PAGE: |-
        think setqm(page_size,max(5,sub(height(%#,24),%<frame>)),
        page_count,ceil(fdiv(%<count>,%q<page_size>)),
        page_number,if(strlen(%q<cmd_page>),%q<cmd_page>,1)); @assert lte(%q<page_number>,%q<page_count>)=@pemit %#=notice(RADIO,There [if(gt(%q<page_count>,1),are %q<page_count> pages,is one page)] - you asked for page %q<page_number>.,warn)
      # %0 the command for the next page: the page's place, and that command while there is one after it.
      FUN`PAGE`FOOTER: |-
        if(gt(%q<page_count>,1),%b· page %q<page_number> of %q<page_count>[if(lt(%q<page_number>,%q<page_count>),%b- %0)])

      # ---- players --------------------------------------------------------------
      INC`USAGE: |-
        @pemit %#=notice(RADIO,+radio <frequency>=<message> speaks. +help radio lists the rest.,warn)
      # Sets %q<frequency_id> from %q<cmd_left>: any frequency, or one the player is tuned in to.
      INC`NEED`ANY: |-
        think setq(frequency_id,u({{radio}}/FUN`FIND,%q<cmd_left>,u({{radio}}/FUN`IDS))); @assert strlen(%q<cmd_left>)=@pemit %#=notice(RADIO,Which frequency?,warn); @assert not(strmatch(%q<frequency_id>,#-2))=@pemit %#=notice(RADIO,'%q<cmd_left>' begins more than one frequency's name. Type more of it.,warn); @assert isint(%q<frequency_id>)=@pemit %#=notice(RADIO,There is no frequency called '%q<cmd_left>'.,warn)
      INC`NEED`JOINED: |-
        think setq(frequency_id,u({{radio}}/FUN`FIND,%q<cmd_left>,u({{radio}}/FUN`JOINED,%#))); @assert strlen(%q<cmd_left>)=@pemit %#=notice(RADIO,Which frequency?,warn); @assert not(strmatch(%q<frequency_id>,#-2))=@pemit %#=notice(RADIO,'%q<cmd_left>' begins more than one of your frequencies. Type more of it.,warn); @assert isint(%q<frequency_id>)=@pemit %#=notice(RADIO,You are not tuned in to a frequency called '%q<cmd_left>'. +radio lists them.,warn)
      INC`NEED`MOD: |-
        @include {{radio}}/INC`NEED`ANY; @assert u({{radio}}/FUN`IS`MOD,%q<frequency_id>,%#)=@pemit %#=notice(RADIO,Only a moderator of [u({{radio}}/FUN`NAME,%q<frequency_id>)] can do that.,error)
      INC`NEED`ADMIN: |-
        @include {{radio}}/INC`NEED`ANY; @assert u({{radio}}/FUN`IS`ADMIN,%q<frequency_id>,%#)=@pemit %#=notice(RADIO,Only an admin of [u({{radio}}/FUN`NAME,%q<frequency_id>)] can do that.,error)
      # +radio[/<page>]: the frequencies the player may tune in to, a page at a time.
      INC`LIST: |-
        think setq(listed_ids,squish(iter(u({{radio}}/FUN`IDS),if(u({{radio}}/FUN`CAN`JOIN,%i0,%#),%i0)))); @assert words(%q<listed_ids>)=@pemit %#=notice(RADIO,There are no frequencies you can tune in to.); @include/args {{radio}}/INC`PAGE=count,words(%q<listed_ids>),frame,4; @pemit %#=u({{radio}}/FUN`SCREEN`LIST)
      # One page of %q<listed_ids>: name, category, the reader's state and the description.
      FUN`SCREEN`LIST: |-
        setq(page_ids,extract(%q<listed_ids>,inc(mul(dec(%q<page_number>),%q<page_size>)),%q<page_size>))[rule(Radio)]%r[datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r3),grow,json(string,%r%r%r1)),[tone(strong,Frequency)]%r[iter(%q<page_ids>,u({{radio}}/FUN`NAME,%i0),,%r)],[tone(strong,Category)]%r[iter(%q<page_ids>,firstof(get({{radio}}/DATA`FREQUENCY`%i0`CATEGORY),-),,%r)],[tone(strong,You)]%r[iter(%q<page_ids>,u({{radio}}/FUN`STATE,%i0,%#),,%r)],[tone(strong,About)]%r[iter(%q<page_ids>,firstof(edit(get({{radio}}/DATA`FREQUENCY`%i0`DESC),%r,%b),-),,%r)])]%r[rule(+radio/join <frequency> tunes in[u({{radio}}/FUN`PAGE`FOOTER,+radio/[inc(%q<page_number>)] for the next)])]
      INC`SEND: |-
        @include {{radio}}/INC`NEED`JOINED; @assert u({{radio}}/FUN`CAN`TALK,%q<frequency_id>,%#)=@pemit %#=notice(RADIO,You may not speak on [u({{radio}}/FUN`NAME,%q<frequency_id>)].,error); @assert strlen(%q<cmd_right>)=@pemit %#=notice(RADIO,What do you want to say?,warn); @assert cor(not(feedinfo(radio/%q<frequency_id>,max_length)),lte(strlen(%q<cmd_right>),feedinfo(radio/%q<frequency_id>,max_length)))=@pemit %#=notice(RADIO,[u({{radio}}/FUN`NAME,%q<frequency_id>)] takes messages of up to [feedinfo(radio/%q<frequency_id>,max_length)] characters.,warn); think setq(alterego,get({{radio}}/DATA`PLAYER`%q<viewer_key>`ALTEREGO`%q<frequency_id>)); @if strlen(%q<alterego>)={@feed/send/as radio/%q<frequency_id>=%q<alterego>/%q<cmd_right>},{@feed/send radio/%q<frequency_id>=%q<cmd_right>}
      INC`JOIN: |-
        @include {{radio}}/INC`NEED`ANY; @assert not(feedmember(radio/%q<frequency_id>,%#))=@pemit %#=notice(RADIO,You are already tuned in to [u({{radio}}/FUN`NAME,%q<frequency_id>)].,warn); @assert u({{radio}}/FUN`CAN`JOIN,%q<frequency_id>,%#)=@pemit %#=notice(RADIO,You may not tune in to [u({{radio}}/FUN`NAME,%q<frequency_id>)].,error); @feed/join radio/%q<frequency_id>=%#; @pemit %#=notice(RADIO,You tune in to [u({{radio}}/FUN`NAME,%q<frequency_id>)].,ok)
      INC`LEAVE: |-
        @include {{radio}}/INC`NEED`JOINED; @feed/leave radio/%q<frequency_id>=%#; @pemit %#=notice(RADIO,You tune out of [u({{radio}}/FUN`NAME,%q<frequency_id>)].,ok)
      # /gag and /ungag take a frequency or all. Every gag ends when the player disconnects (ADISCONNECT).
      INC`GAG: |-
        @assert strlen(%q<cmd_left>)=@pemit %#=notice(RADIO,+radio/gag <frequency> or +radio/gag all,warn); @if strmatch(%q<cmd_left>,all)={@dolist/inline feedsof(%#,radio)=@feed/gag ##=%#; @pemit %#=notice(RADIO,You hear none of your frequencies until you ungag them or disconnect.,ok)},{@include {{radio}}/INC`NEED`JOINED; @feed/gag radio/%q<frequency_id>=%#; @pemit %#=notice(RADIO,You hear nothing from [u({{radio}}/FUN`NAME,%q<frequency_id>)] until you ungag it or disconnect.,ok)}
      INC`UNGAG: |-
        @assert strlen(%q<cmd_left>)=@pemit %#=notice(RADIO,+radio/ungag <frequency> or +radio/ungag all,warn); @if strmatch(%q<cmd_left>,all)={@dolist/inline feedsof(%#,radio)=@feed/ungag ##=%#; @pemit %#=notice(RADIO,You hear all of your frequencies again.,ok)},{@include {{radio}}/INC`NEED`JOINED; @feed/ungag radio/%q<frequency_id>=%#; @pemit %#=notice(RADIO,You hear [u({{radio}}/FUN`NAME,%q<frequency_id>)] again.,ok)}

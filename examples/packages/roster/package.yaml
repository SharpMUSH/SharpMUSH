format: "1.16"
package: roster
title: "Roster"
version: 1.2.0
authors: [SharpMUSH]
description: "Roster: characters kept for players to take on. Staff add characters to the roster, hand them to an account and take them back; players see who is available. The roster defines no way to apply: a game says how in a setting, or installs roster-jobs."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [roster, characters, accounts, canon, staff]
category: Characters
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

# Who manages the roster is a permission, so it moves with roles: @role/assign <player>=roster-admin, or
# @permission/allow <player>=softcode.roster.manage for one person. Nobody holds it until something allows
# it, wizards included; God and administrator holders hold every permission.
categories:
  roles:
    - name: Roster
      description: Roles for the people who manage the character roster.
  permissions:
    - name: Roster
      description: Managing the character roster.
permissions:
  - name: softcode.roster.manage
    category: Roster
    description: Add, change, hand out, take back and remove roster characters, and read their staff notes.
roles:
  - slug: roster-admin
    name: Roster Admin
    category: Roster
    priority: 10
    permissions:
      softcode.roster.manage: allow

objects:
  # The command object, in the master room. WIZARD because it adds the command (@command/add, @hook), links
  # characters to accounts and takes them off (@account/link, @account/unlink), resets a returned character's
  # password (@newpassword) and drops its connections (@boot), and reads every character's account (account()).
  #
  # +roster is added with /noparse/rsnoparse and hooked to CMD`ROSTER, so what a player types reaches the code
  # exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked command, INC`COMMAND` the shared parse and dispatch, INC`CMD`<ROUTE> one routine per
  # switch, INC`PAGE` and FUN`PAGE` the pages of a long list, INC`API` what other code calls, INC`STATE` and
  # INC`HISTORY` the writes everything shares, EVENT` the link and unlink events. FUN` reads: FUN`ENTRY` the
  # records, FUN`DISPLAY` the screens. DATA`CONFIG` the +config settings, DATA` the fixed data. Every record is kept on the Roster Store, never on a character, so nobody can rewrite their
  # own entry.
  #
  # Other objects call the API with @trigger/inline, so each step runs as the Roster, where {{roster}} and
  # {{store}} resolve, and hands its Q-registers back.
  - ref: roster
    type: thing
    name: Roster
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # The settings +config shows and changes (plus-config). Code reads each with get({{roster}}/DATA`CONFIG`<NAME>).
      DATA`CONFIG:
        value: |-
          How many roster characters an account may hold, when a held one counts as idle, and what players are told.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Roster
      DATA`CONFIG`MAX-PER-ACCOUNT: |-
        1
      DATA`CONFIG`MAX-PER-ACCOUNT`TYPE: |-
        integer
      DATA`CONFIG`MAX-PER-ACCOUNT`DEFAULT: |-
        1
      DATA`CONFIG`MAX-PER-ACCOUNT`MIN: |-
        0
      DATA`CONFIG`MAX-PER-ACCOUNT`LABEL: |-
        Characters per account
      DATA`CONFIG`MAX-PER-ACCOUNT`DESCRIPTION: |-
        How many roster characters one account may hold at once. 0 is no limit.
      DATA`CONFIG`MAX-PER-ACCOUNT`EXAMPLE: |-
        2
      DATA`CONFIG`IDLE-DAYS: |-
        60
      DATA`CONFIG`IDLE-DAYS`TYPE: |-
        integer
      DATA`CONFIG`IDLE-DAYS`DEFAULT: |-
        60
      DATA`CONFIG`IDLE-DAYS`MIN: |-
        1
      DATA`CONFIG`IDLE-DAYS`LABEL: |-
        Idle after days
      DATA`CONFIG`IDLE-DAYS`DESCRIPTION: |-
        The days +roster/idle uses when given none: held characters nobody has played for this long.
      DATA`CONFIG`IDLE-DAYS`EXAMPLE: |-
        30
      DATA`CONFIG`HOW-TO-GET: |-
        Ask staff how to take on a roster character.
      DATA`CONFIG`HOW-TO-GET`TYPE: |-
        text
      DATA`CONFIG`HOW-TO-GET`DEFAULT: |-
        Ask staff how to take on a roster character.
      DATA`CONFIG`HOW-TO-GET`MAX: |-
        500
      DATA`CONFIG`HOW-TO-GET`LABEL: |-
        How to get one
      DATA`CONFIG`HOW-TO-GET`DESCRIPTION: |-
        Shown under +roster and under an available character: how a player gets one. A package that adds a way to apply shows its own line instead while it is installed.
      DATA`CONFIG`HOW-TO-GET`EXAMPLE: |-
        Page a roster admin with the character's name.
      DATA`CONFIG`RETURN-MESSAGE: |-
        Its password has been changed, so it is no longer yours to play.
      DATA`CONFIG`RETURN-MESSAGE`TYPE: |-
        text
      DATA`CONFIG`RETURN-MESSAGE`DEFAULT: |-
        Its password has been changed, so it is no longer yours to play.
      DATA`CONFIG`RETURN-MESSAGE`MAX: |-
        500
      DATA`CONFIG`RETURN-MESSAGE`LABEL: |-
        Told on return
      DATA`CONFIG`RETURN-MESSAGE`DESCRIPTION: |-
        Told to the account's characters when one of theirs goes back to the roster.
      DATA`CONFIG`RETURN-MESSAGE`EXAMPLE: |-
        Staff will mail you about what happens next.
      DATA`CONFIG`FIELD-ORDER: |-
        GROUP SUMMARY
      DATA`CONFIG`FIELD-ORDER`TYPE: |-
        list
      DATA`CONFIG`FIELD-ORDER`DEFAULT: |-
        GROUP SUMMARY
      DATA`CONFIG`FIELD-ORDER`LABEL: |-
        Fields shown first
      DATA`CONFIG`FIELD-ORDER`DESCRIPTION: |-
        The fields an entry shows first, in this order. Others follow in name order; NOTES last, to staff only.
      DATA`CONFIG`FIELD-ORDER`EXAMPLE: |-
        GROUP FACTION SUMMARY
      # Fields +roster/set may not write: the roster keeps them itself.
      DATA`FIELDS`RESERVED: |-
        STATE HOLDER ACCOUNTNAME SINCE ADDED
      # Which routine each switch runs: DATA`ROUTE`<switch> names INC`CMD`<route>. BARE is +roster alone, ARG
      # +roster <name>. A route with a / in it names an attribute on another object, which is how another
      # package adds a switch: roster-jobs sets DATA`ROUTE`APPLY to its own routine.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`BARE: |-
        LIST
      DATA`ROUTE`ARG: |-
        SHOW
      DATA`ROUTE`ALL: |-
        ALL
      DATA`ROUTE`ADD: |-
        ADD
      DATA`ROUTE`REMOVE: |-
        REMOVE
      DATA`ROUTE`SET: |-
        SET
      DATA`ROUTE`ASSIGN: |-
        ASSIGN
      DATA`ROUTE`RETURN: |-
        RETURN
      DATA`ROUTE`CLOSE: |-
        CLOSE
      DATA`ROUTE`OPEN: |-
        OPEN
      DATA`ROUTE`IDLE: |-
        IDLE
      DATA`ROUTE`HISTORY: |-
        HISTORY
      # The routines only roster staff may run.
      DATA`STAFF`ROUTES: |-
        ADD REMOVE SET ASSIGN RETURN CLOSE OPEN IDLE HISTORY
      # The routines that list, and so take a page as their last switch: +roster/2, +roster/all/3,
      # +roster/history/2 <name>.
      DATA`PAGE`ROUTES: |-
        LIST ALL IDLE HISTORY

      # ---- command --------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`ROSTER:
        value: |-
          $(?is)^\+roster(/\S*)?(?\: +(.*))?$:@include/args {{roster}}/INC`COMMAND`RUN=switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch and who may use it, and runs
      # the routine.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(ROSTER,Only players use the roster.,warn); think u({{roster}}/FUN`COMMAND`PARSE,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(ROSTER,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(ROSTER,+roster has no /%q<cmd_switch> switch. +help roster lists them.,warn); @assert cor(not(member(get({{roster}}/DATA`STAFF`ROUTES),%q<cmd_route>)),u({{roster}}/FUN`IS`STAFF,%#))=@pemit %#=notice(ROSTER,Only roster staff can use +roster/%q<cmd_switch>.,error); @assert cor(not(strlen(%q<cmd_page>)),member(get({{roster}}/DATA`PAGE`ROUTES),%q<cmd_route>))=@pemit %#=notice(ROSTER,if(strlen(%q<cmd_switch>),+roster/%q<cmd_switch>,+roster <name>) takes no page number.,warn); @break strmatch(%q<cmd_route>,*/*)={@trigger/inline/nobreak/spoof %q<cmd_route>}; @include {{roster}}/INC`CMD`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the switches and %1 the argument, as typed. Sets cmd_page (a last switch of digits), cmd_switch_list
      # (the others), cmd_switch (the one switch), cmd_argument, cmd_left_side and cmd_right_side around the
      # first =, cmd_has_equals and cmd_route (the routine to run). A switch of anything but letters has no route.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_switch_list,lcstr(trim(edit(%0,/,%b))),
          cmd_page,if(regmatch(last(%q<cmd_switch_list>),^%[0-9%]+$),last(%q<cmd_switch_list>)),
          cmd_switch_list,if(strlen(%q<cmd_page>),ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>)),%q<cmd_switch_list>),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%1),
          cmd_has_equals,strmatch(%1,*=*),
          cmd_left_side,trim(before(%1,=)),
          cmd_right_side,trim(after(%1,=)),
          cmd_route,if(strlen(%q<cmd_switch>),if(regmatch(%q<cmd_switch>,^%[a-z%]+$),u({{roster}}/DATA`ROUTE`[ucstr(%q<cmd_switch>)])),u({{roster}}/DATA`ROUTE`[if(strlen(%q<cmd_argument>),ARG,BARE)])))
        flags: [funsyntax]
      # %0 a player: 1 when they may manage the roster.
      FUN`IS`STAFF:
        value: |-
          permission(%0,softcode.roster.manage)
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 an object: the key its records are filed under. An objid cannot be part of an attribute name, so
      # #12:1790888816538 is filed as 12_1790888816538.
      FUN`ENTRY`KEY:
        value: |-
          edit(objid(%0),#,,:,_)
        flags: [funsyntax]
      # %0 typed text: the objid of the character it names, or nothing.
      FUN`ENTRY`CHARACTER:
        value: |-
          if(isdbref(setr(roster_found,pmatch(%0))),objid(%q<roster_found>))
        flags: [funsyntax]
      # %0 a character: 1 when it is on the roster.
      FUN`ENTRY`HAS:
        value: |-
          cand(strlen(%0),hasattr({{store}},ENTRY`[u({{roster}}/FUN`ENTRY`KEY,%0)]))
        flags: [funsyntax]
      # %0 a character, %1 a field: that field of its entry.
      FUN`ENTRY`GET:
        value: |-
          get({{store}}/ENTRY`[u({{roster}}/FUN`ENTRY`KEY,%0)]`%1)
        flags: [funsyntax]
      # %0 a character: available, held or closed. A character on an account is held whatever its entry says,
      # so a link made from the portal shows at once.
      FUN`ENTRY`STATE:
        value: |-
          if(strlen(account(%0)),held,firstof(u({{roster}}/FUN`ENTRY`GET,%0,STATE),available))
        flags: [funsyntax]
      # Every character on the roster that still exists.
      FUN`ENTRY`ALL:
        value: |-
          filterbool({{roster}}/FUN`ENTRY`EXISTS,iter(lattr({{store}}/ENTRY`*),get({{store}}/%i0)))
        flags: [funsyntax]
      FUN`ENTRY`EXISTS:
        value: |-
          cand(isdbref(%0),hastype(%0,player))
        flags: [funsyntax]
      # %0 a state: the roster characters in it.
      FUN`ENTRY`INSTATE:
        value: |-
          filterbool({{roster}}/FUN`ENTRY`ISSTATE,u({{roster}}/FUN`ENTRY`ALL),,,%0)
        flags: [funsyntax]
      FUN`ENTRY`ISSTATE:
        value: |-
          strmatch(u({{roster}}/FUN`ENTRY`STATE,%0),%1)
        flags: [funsyntax]
      # %0 characters: sorted by group, characters with no group last, then by name.
      FUN`ENTRY`SORT:
        value: |-
          sortkey({{roster}}/FUN`ENTRY`SORTKEY,%0)
        flags: [funsyntax]
      FUN`ENTRY`SORTKEY:
        value: |-
          setq(roster_sort_group,u({{roster}}/FUN`ENTRY`GET,%0,GROUP))[if(strlen(%q<roster_sort_group>),0,1)][lcstr(%q<roster_sort_group>)]|[lcstr(name(%0))]
        flags: [funsyntax]
      # %0 an account's name: the roster characters it holds now.
      FUN`ENTRY`HELDBY:
        value: |-
          filterbool({{roster}}/FUN`ENTRY`ISHELDBY,u({{roster}}/FUN`ENTRY`ALL),,,%0)
        flags: [funsyntax]
      FUN`ENTRY`ISHELDBY:
        value: |-
          strmatch(account(%0,name),%1)
        flags: [funsyntax]
      # %0 a character: when it was last played, in seconds: its last login or logout, whichever is later, or
      # when it was handed out when it has been neither since.
      FUN`ENTRY`LASTPLAYED:
        value: |-
          max(firstof(u({{roster}}/FUN`ENTRY`GET,%0,SINCE),0),u({{roster}}/FUN`TIME`SECONDS,get(%0/LAST)),u({{roster}}/FUN`TIME`SECONDS,get(%0/LASTLOGOUT)))
        flags: [funsyntax]
      # %0 a time as LAST holds it: seconds, or 0 when there is none.
      FUN`TIME`SECONDS:
        value: |-
          if(isint(setr(roster_seconds,convtime(%0))),%q<roster_seconds>,0)
        flags: [funsyntax]
      # %0 typed text: the name of the account it means. A character on an account means that account; anything
      # else is taken as an account's name, and must look like one, since it is handed to @account/link.
      FUN`ACCOUNT`NAMED:
        value: |-
          if(isdbref(setr(roster_named,pmatch(%0))),firstof(account(%q<roster_named>,name),u({{roster}}/FUN`ACCOUNT`WORD,%0)),u({{roster}}/FUN`ACCOUNT`WORD,%0))
        flags: [funsyntax]
      FUN`ACCOUNT`WORD:
        value: |-
          if(regmatch(%0,^%[A-Za-z0-9_.@+-%]+$),%0)
        flags: [funsyntax]
      # %0 a character: the connected characters on its account, itself left out.
      FUN`ACCOUNT`CONNECTED:
        value: |-
          filterbool({{roster}}/FUN`IS`CONNECTED,setdiff(accountchars(%0),objid(%0)))
        flags: [funsyntax]
      FUN`IS`CONNECTED:
        value: |-
          gte(conn(%0),0)
        flags: [funsyntax]

      # ---- API ------------------------------------------------------------------
      # What other code calls, from a WIZARD object. Each step takes named arguments, leaves %q<roster_error>
      # empty when it worked and the reason when it did not, and tells nobody: the caller says what happened.
      # Call them with @trigger/inline/nobreak/args, which runs them as the Roster and hands %q<roster_error> back. They run the same checks and the
      # same ON` steps as the commands.
      #
      # @trigger/inline/nobreak/args Roster/INC`API`ASSIGN=character,<name or objid>,to,<character or account>,actor,<objid>[,reason,<text>]
      INC`API`ASSIGN:
        value: |-
          @include {{roster}}/INC`API`START; @assert u({{roster}}/FUN`ENTRY`HAS,%q<roster_char>)={think setq(roster_error,name(%q<roster_char>) is not on the roster.)}; @assert not(strlen(account(%q<roster_char>)))={think setq(roster_error,name(%q<roster_char>) is already held by account [account(%q<roster_char>,name)]. Return it to the roster first.)}; @assert strlen(setr(roster_to,u({{roster}}/FUN`ACCOUNT`NAMED,%<to>)))={think setq(roster_error,'%<to>' is not a character on an account%, or an account's name.)}; @include {{roster}}/INC`API`LIMIT; think setq(roster_key,u({{roster}}/FUN`ENTRY`KEY,%q<roster_char>)); &ENTRY`%q<roster_key>`STATE {{store}}=assigning; @force/inline me=@account/link %q<roster_to>=%q<roster_char>; @assert strlen(setr(roster_account,account(%q<roster_char>)))={think setq(roster_error,There is no account called '%q<roster_to>'.); &ENTRY`%q<roster_key>`STATE {{store}}=available}; @include/args {{roster}}/INC`STATE`HELD=character,%q<roster_char>,account,%q<roster_account>,actor,%<actor>,reason,%<reason>; @if words(setr(roster_told,u({{roster}}/FUN`ACCOUNT`CONNECTED,%q<roster_char>)))={@pemit/list %q<roster_told>=notice(ROSTER,name(%q<roster_char>) is yours now. Play it from your account: play [name(%q<roster_char>)])}
        flags: [cmdsyntax]
      # Stops an assign that would give account %q<roster_to> more roster characters than
      # +config roster/max-per-account allows.
      INC`API`LIMIT:
        value: |-
          think setq(roster_limit,get({{roster}}/DATA`CONFIG`MAX-PER-ACCOUNT)); @assert cor(not(%q<roster_limit>),lt(words(u({{roster}}/FUN`ENTRY`HELDBY,%q<roster_to>)),%q<roster_limit>))={think setq(roster_error,Account %q<roster_to> already holds [words(u({{roster}}/FUN`ENTRY`HELDBY,%q<roster_to>))] roster [if(eq(%q<roster_limit>,1),character,characters)]%, the most one account may.)}
        flags: [cmdsyntax]
      # @trigger/inline/nobreak/args Roster/INC`API`RETURN=character,<name or objid>,actor,<objid>[,reason,<text>]
      INC`API`RETURN:
        value: |-
          @include {{roster}}/INC`API`START; @assert u({{roster}}/FUN`ENTRY`HAS,%q<roster_char>)={think setq(roster_error,name(%q<roster_char>) is not on the roster.)}; @assert strlen(setr(roster_account,account(%q<roster_char>)))={think setq(roster_error,name(%q<roster_char>) is not held by anyone.)}; think setqm(roster_account_name,account(%q<roster_char>,name),
          roster_told,u({{roster}}/FUN`ACCOUNT`CONNECTED,%q<roster_char>)); &ENTRY`[u({{roster}}/FUN`ENTRY`KEY,%q<roster_char>)]`HOLDER {{store}}; @force/inline me=@account/unlink %q<roster_account_name>=%q<roster_char>; @assert not(strlen(account(%q<roster_char>)))={think setq(roster_error,name(%q<roster_char>) could not be taken off account %q<roster_account_name>.); &ENTRY`[u({{roster}}/FUN`ENTRY`KEY,%q<roster_char>)]`HOLDER {{store}}=%q<roster_account>}; @include/args {{roster}}/INC`STATE`FREE=character,%q<roster_char>,account,%q<roster_account>,accountname,%q<roster_account_name>,actor,%<actor>,reason,%<reason>,event,returned; @if words(%q<roster_told>)={@pemit/list %q<roster_told>=notice(ROSTER,name(%q<roster_char>) has gone back to the roster[if(strlen(%<reason>),: %<reason>,.)] [get({{roster}}/DATA`CONFIG`RETURN-MESSAGE)])}
        flags: [cmdsyntax]
      # @trigger/inline/nobreak/args Roster/INC`API`ADD=character,<name or objid>,actor,<objid>[,group,<group>]
      INC`API`ADD:
        value: |-
          @include {{roster}}/INC`API`START; @assert not(u({{roster}}/FUN`ENTRY`HAS,%q<roster_char>))={think setq(roster_error,name(%q<roster_char>) is already on the roster.)}; @assert not(cor(strmatch(num(%q<roster_char>),#1),hasrole(%q<roster_char>,wizard),hasrole(%q<roster_char>,royalty)))={think setq(roster_error,name(%q<roster_char>) is staff. Staff characters never go on the roster.)}; think setq(roster_key,u({{roster}}/FUN`ENTRY`KEY,%q<roster_char>)); &ENTRY`%q<roster_key> {{store}}=%q<roster_char>; &ENTRY`%q<roster_key>`ADDED {{store}}=secs(); @if strlen(%<group>)={&ENTRY`%q<roster_key>`GROUP {{store}}=%<group>}; @break strlen(setr(roster_account,account(%q<roster_char>)))={@include/args {{roster}}/INC`STATE`HELD=character,%q<roster_char>,account,%q<roster_account>,actor,%<actor>,reason,On an account when it was added.,event,added,step,ADD}; &ENTRY`%q<roster_key>`STATE {{store}}=available; &ENTRY`%q<roster_key>`SINCE {{store}}=secs(); @newpassword/generate %q<roster_char>; @include/args {{roster}}/INC`HISTORY`ADD=character,%q<roster_char>,event,added,actor,%<actor>,reason,%<reason>; @include/args {{roster}}/INC`ON`RUN=step,ADD,character,%q<roster_char>,actor,%<actor>,reason,%<reason>
        flags: [cmdsyntax]
      # @trigger/inline/nobreak/args Roster/INC`API`REMOVE=character,<name or objid>,actor,<objid>[,reason,<text>]
      # The character, its account and its history stay; only its entry goes.
      INC`API`REMOVE:
        value: |-
          @include {{roster}}/INC`API`START; @assert u({{roster}}/FUN`ENTRY`HAS,%q<roster_char>)={think setq(roster_error,name(%q<roster_char>) is not on the roster.)}; @include/args {{roster}}/INC`HISTORY`ADD=character,%q<roster_char>,event,removed,actor,%<actor>,reason,%<reason>; @include/args {{roster}}/INC`ON`RUN=step,REMOVE,character,%q<roster_char>,actor,%<actor>,reason,%<reason>; @wipe {{store}}/ENTRY`[u({{roster}}/FUN`ENTRY`KEY,%q<roster_char>)]
        flags: [cmdsyntax]
      # Every API step's start: clears roster_error and finds %<character>, leaving its objid in roster_char.
      INC`API`START:
        value: |-
          think setqm(roster_error,,
          roster_char,if(cand(isdbref(%<character>),hastype(%<character>,player)),objid(%<character>),u({{roster}}/FUN`ENTRY`CHARACTER,%<character>))); @assert strlen(%q<roster_char>)={think setq(roster_error,There is no character called '%<character>'.)}
        flags: [cmdsyntax]
      # Reads for other code: u(Roster/FUN`API`STATE,<character>) is available, held or closed, and empty off
      # the roster; u(Roster/FUN`API`FIELD,<character>,<field>) one field; u(Roster/FUN`API`LIST[,<state>])
      # the roster's characters, in one state when given.
      FUN`API`STATE:
        value: |-
          u({{roster}}/FUN`API`STATEOF,if(isdbref(%0),objid(%0),u({{roster}}/FUN`ENTRY`CHARACTER,%0)))
        flags: [funsyntax]
      FUN`API`STATEOF:
        value: |-
          if(u({{roster}}/FUN`ENTRY`HAS,%0),u({{roster}}/FUN`ENTRY`STATE,%0))
        flags: [funsyntax]
      FUN`API`FIELD:
        value: |-
          u({{roster}}/FUN`API`FIELDOF,if(isdbref(%0),objid(%0),u({{roster}}/FUN`ENTRY`CHARACTER,%0)),ucstr(%1))
        flags: [funsyntax]
      FUN`API`FIELDOF:
        value: |-
          if(u({{roster}}/FUN`ENTRY`HAS,%0),u({{roster}}/FUN`ENTRY`GET,%0,%1))
        flags: [funsyntax]
      FUN`API`LIST:
        value: |-
          if(strlen(%0),u({{roster}}/FUN`ENTRY`INSTATE,lcstr(%0)),u({{roster}}/FUN`ENTRY`ALL))
        flags: [funsyntax]

      # ---- state changes --------------------------------------------------------
      # %<character> is held by %<account> (an account id): records the holder, adds the history line (%<event>,
      # assigned when not given) and runs the ON`ASSIGN steps.
      INC`STATE`HELD:
        value: |-
          think setq(roster_key,u({{roster}}/FUN`ENTRY`KEY,%<character>)); &ENTRY`%q<roster_key>`HOLDER {{store}}=%<account>; &ENTRY`%q<roster_key>`STATE {{store}}=held; &ENTRY`%q<roster_key>`ACCOUNTNAME {{store}}=account(%<character>,name); &ENTRY`%q<roster_key>`SINCE {{store}}=secs(); @include/args {{roster}}/INC`HISTORY`ADD=character,%<character>,event,firstof(%<event>,assigned),actor,%<actor>,reason,%<reason>; @include/args {{roster}}/INC`ON`RUN=step,firstof(%<step>,ASSIGN),character,%<character>,actor,%<actor>,reason,%<reason>
        flags: [cmdsyntax]
      # %<character> has left account %<account> (%<accountname>): available again, its password changed so
      # nobody logs in to it by name, its connections dropped, the history line added (%<event>) and the
      # ON`RETURN steps run.
      INC`STATE`FREE:
        value: |-

  # matched as a command.
  #
  # ENTRY`<key> holds the character's objid; beneath it STATE (available, held or closed), HOLDER (the account
  # id holding it), ACCOUNTNAME, SINCE (when it was handed out or came back, in seconds), ADDED, and the fields:
  # GROUP, SUMMARY, NOTES and any +roster/set adds. HISTORY`<key> counts its history lines, each one
  # HISTORY`<key>`<n> with TIME, EVENT, ACCOUNT, ACTOR, ACTORNAME and REASON beneath it. History stays when an
  # entry is removed.
  - ref: store
    type: thing
    name: Roster Store
    location: "{{roster}}"
    flags: [no_command]
    attributes:
      ENTRY: |-
        Roster entries, one branch per character key.
      HISTORY: |-
        Roster history, one branch per character key.

  # The links and unlinks made anywhere, handed to the Roster to run as itself.
  - ref: events
    target: "{{$event_handler}}"
    attributes:
      PLAYER`LINK`ROSTER: |-
        @trigger/args {{roster}}/EVENT`LINK=objid,%<objid>,account,%<account>
      PLAYER`UNLINK`ROSTER: |-
        @trigger/args {{roster}}/EVENT`UNLINK=objid,%<objid>,account,%<account>

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies are
  # evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: roster_help
    type: thing
    name: Roster Help
    location: "{{roster}}"
    attributes:
      HELP: |-
        The character roster.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      HELP`ROSTER: |-
        The **roster** is the game's characters kept for players to take on: canon characters, or ones a player left behind.

        - `+roster` lists the characters available now, by group.
        - `+roster <name>` shows one: its group, its summary and anything else staff wrote about it, and how to get it.
        - `+roster/all` lists every roster character, with whether it is available, held or closed.

        A list longer than your screen comes in pages: add the page as a last switch, as in `+roster/2` or `+roster/all/2`.

        A character is **available** when nobody holds it, **held** when it is on someone's account, and **closed** when the game keeps it listed but is not offering it.

        A character you are given is linked to your account. Play it from your account like any other: `play <name>` at the account menu, or the character list in the web portal. Its password is the game's, not yours.

        How you ask for a character is up to the game. `+roster` says how, under the list.
      LOCK`ROSTER`STAFF: |-
        perm^softcode.roster.manage
      HELP`ROSTER`STAFF: |-
        Staff with the `softcode.roster.manage` permission, which the `roster-admin` role allows, manage the roster.

        - `+roster/add <name>\[=<group>\]` puts a character on the roster. One on nobody's account is available, and its password is changed, so only an account it is given to can play it. One already on an account is held, by that account. God, wizards and royalty are refused.
        - `+roster/set <name>/<field>=<text>` writes a field: `group`, `summary`, `notes` \(shown to staff only\) or any other a game wants, such as `faction` or `played_by`. Leave the text out to clear it.
        - `+roster/assign <name>=<character or account>` links it to an account: the account a character you name is on, or the account with that name. An account holds at most one roster character unless the game changed that.
        - `+roster/return <name>\[=<reason>\]` takes it off its account and back to available. Its password is changed and its connections closed, and the account's connected characters are told.
        - `+roster/close <name>` keeps it listed but not offered, and `+roster/open <name>` offers it again.
        - `+roster/remove <name>` takes it off the roster. The character and its account stay as they are.
        - `+roster/idle \[<days>\]` lists held characters nobody has played for that many days, 60 unless the game changed it.
        - `+roster/history <name>` shows who held it and who changed it, newest first.

        `/idle` and `/history` come in pages too: `+roster/idle/2`, `+roster/history/2 <name>`.

        A character linked or unlinked some other way, by `@account/link`, a claim or the web portal, is held or available on the roster at once, and its history says so.
      LOCK`ROSTER`SETTINGS: |-
        perm^config.admin
      HELP`ROSTER`SETTINGS: |-
        `+config roster` shows the settings and changes them:

        - `max-per-account`: how many roster characters one account may hold at once. 1 by default; 0 is no limit.
        - `idle-days`: the days `+roster/idle` uses when given none. 60.
        - `how-to-get`: the line under `+roster` and under an available character saying how a player gets one.
        - `return-message`: what the account's characters are told when one of theirs goes back to the roster.
        - `field-order`: the fields an entry shows first, in order. `GROUP SUMMARY`.

        For example:

        `+config roster/max-per-account=2`
      HELP`ROSTER`CODE: |-
        Code on a WIZARD object can change the roster the way the commands do, and read it.

        - ``@trigger/inline/nobreak/args Roster/INC`API`ASSIGN=character,<name>,to,<character or account>,actor,<objid>\[,reason,<text>\]`` gives a character to an account. `` INC`API`RETURN ``, `` INC`API`ADD `` \(with `group`\) and `` INC`API`REMOVE `` take the same arguments. Each leaves `\%q<roster_error>` empty when it worked and says why when it did not, and tells nobody.
        - ``u\(Roster/FUN`API`STATE,<character>\)`` is available, held or closed, and empty off the roster. ``u\(Roster/FUN`API`FIELD,<character>,<field>\)`` reads one field. ``u\(Roster/FUN`API`LIST\[,<state>\]\)`` lists the roster's characters.

        ## Steps

        After a change, the Roster runs every `` ON`<STEP>`<name> `` attribute on itself, in name order, each queued with `\%<character>`, `\%<actor>`, `\%<reason>` and `\%<account>` \(the account's id\). The steps are `ADD`, `ASSIGN`, `RETURN` and `REMOVE`. Wiping a returned character's notes, welcoming a new holder by mail or posting to a channel belongs here:

        ``&ON`RETURN`WIPE Roster=&NOTES \%<character>``

        ## Switches

        `` DATA`ROUTE`<SWITCH> `` on the Roster names the routine a switch runs, `` INC`CMD`<ROUTE> ``. A value with a / in it is an attribute on another object, run with `@trigger/inline/spoof` as the command runs, so another package adds a switch without changing the roster. A package that adds a way to apply says so under `+roster` by setting `` DATA`HOWTOGET`<its name> `` on the Roster.
      HELP`ROSTER`HOW: |-
        The roster has no way to apply built in, because games choose differently. Three common ones:

        - Players ask staff, and staff use `+roster/assign`. Say how to ask with `+config roster/how-to-get=<text>`.
        - Players apply through the job queue: install the `roster-jobs` package, which adds `+roster/apply`.
        - A game's own code calls `` INC`API`ASSIGN `` when its own process says yes. See `+help roster code`.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`ROSTER: |-
        {{roster_help}}

  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`ROSTER: |-
        {{roster}}

format: "1.16"
package: who-where
title: "+who and +where"
version: 1.10.0
authors: [SharpMUSH]
description: "+who and +where commands drawn with layout functions. +who lists name, alias, idle, connected, gender and location, by name or by idle, or matching a name; +where groups players under a line per location, or lists them by location or by name."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [who, where, social]
category: Community
requires_server: ">=0.1"


objects:
  - ref: ww_global
    type: thing
    name: Who-Where Global Object
    location: "{{$master_room}}"
    parent: "{{ww_functions}}"
    attributes:
      # +who: in the order the who-order setting names.
      CMD`WHO: |-
        $+who:@pemit %#=u({{ww_functions}}/FUN`WHO,mwho(),get({{ww_functions}}/DATA`CONFIG`WHO-ORDER),); @dolist/delimit | %q<screen_parts>|-=@pemit %#=u({{ww_functions}}/FUN`PART`DRAW,##)
      # +who/idle: the least idle first. +who/name: by name.
      CMD`WHO`SWITCH: |-
        $+who/*:@assert member(idle name,lcstr(%0))=@pemit %#=notice(WHO,+who has no /%0 switch. +who/idle lists the least idle first%, +who/name by name.,warn); @pemit %#=u({{ww_functions}}/FUN`WHO,mwho(),lcstr(%0),); @dolist/delimit | %q<screen_parts>|-=@pemit %#=u({{ww_functions}}/FUN`PART`DRAW,##)
      # +who <name>: only the players whose name or alias starts with it.
      CMD`WHO`MATCH: |-
        $+who *:@pemit %#=u({{ww_functions}}/FUN`WHO,mwho(),name,%0); @dolist/delimit | %q<screen_parts>|-=@pemit %#=u({{ww_functions}}/FUN`PART`DRAW,##)
      # +where: the view the where-view setting names.
      CMD`WHERE: |-
        $+where:@pemit %#=u({{ww_functions}}/FUN`WHERE`[ucstr(firstof(get({{ww_functions}}/DATA`CONFIG`WHERE-VIEW),grouped))],mwho()); @dolist/delimit | %q<screen_parts>|-=@pemit %#=u({{ww_functions}}/FUN`PART`DRAW,##)
      # +where/grouped, +where/room and +where/name: a switch is the FUN`WHERE`<SWITCH> it runs.
      CMD`WHERE`SWITCH: |-
        $+where/*:@assert member(grouped room name,lcstr(%0))=@pemit %#=notice(WHERE,+where has no /%0 switch. +where/grouped lists under a line per location%, +where/room by location%, +where/name by name.,warn); @pemit %#=u({{ww_functions}}/FUN`WHERE`[ucstr(%0)],mwho()); @dolist/delimit | %q<screen_parts>|-=@pemit %#=u({{ww_functions}}/FUN`PART`DRAW,##)
      # Command palette entries (help palette entries): both are useful anywhere, so they are staples.
      PALETTE`WHO: |-
        {"label":"Who is on","line":"+who","always":true,"icon":"Groups","keywords":"online players"}
      PALETTE`WHERE: |-
        {"label":"Where is everyone","line":"+where","always":true,"icon":"Map","keywords":"players rooms"}

  - ref: ww_functions
    type: thing
    name: Who-Where Function Object
    flags: [no_command]
    attributes:
      # Every screen is a heading or a box() as wide as the reader's screen; no width is given, so each
      # reader gets it at their own width, and the web portal draws a card.
      # ---- Parts ---------------------------------------------------------------------
      # Every screen is sent in parts, so it works however many players are connected. A command's
      # @pemit runs the screen's FUN`<SCREEN> with the players: it sends nothing, or a heading, and
      # sets screen_view, the screen, and screen_parts, its runs of players or locations split by |.
      # @dolist then sends FUN`PART`DRAW for each run, and for - after the last. Each queued run has its
      # own function_invocation_limit, so the cost of one never adds to another's. Runs are a few hundred
      # players or a hundred locations (DATA`PART`PLAYERS and DATA`PART`ROOMS), so a screen takes few of
      # the player_queue_limit (100) commands an owner may have queued: two for most games.
      DATA`PART`PLAYERS: |-
        250
      DATA`PART`ROOMS: |-
        100
      # %0 a screen (WHO, WHERE, WHERE`ROOM or WHERE`NAME): starts it, setting screen_view, and screen_key
      # and screen_row_separator for a table.
      FUN`SCREEN`START: |-
        setqm(screen_view,%0,
        screen_key,after(%#,#)_[rand(1000000000)],
        screen_row_separator,%*<|>,
        screen_idle_after,v(DATA`CONFIG`IDLE-AFTER))
      # %0 a list, %1 how many to a run, %2 the list's delimiter (a space when empty): the runs, split by |.
      FUN`PART`SPLIT: |-
        setq(split_delimiter,if(strlen(%2),%2,%b))[if(words(%0,%q<split_delimiter>),iter(lnum(0,dec(ceil(fdiv(words(%0,%q<split_delimiter>),%1)))),extract(%0,inc(mul(%i0,%1)),%1,%q<split_delimiter>),,|))]
      # %0 a run from screen_parts, or - after the last: one @pemit of the screen's @dolist, drawn by the
      # screen's FUN`<SCREEN>`PART.
      FUN`PART`DRAW: |-
        u(%!/FUN`%q<screen_view>`PART,%0)
      # A table is built on this object while its runs are sent, one row per player in
      # DATA`ROWS`<screen_key>: the cells split by %r, which no name holds, and the rows by a marked
      # separator (screen_row_separator). The key is the reader and a random number, so two screens built
      # at once keep apart.
      # %0 rows: added to the table.
      FUN`ROWS`ADD: |-
        if(strlen(%0),attrib_set(%!/DATA`ROWS`%q<screen_key>,if(hasattr(%!,DATA`ROWS`%q<screen_key>),xget(%!,DATA`ROWS`%q<screen_key>)%q<screen_row_separator>)%0))
      # The table's rows, none when no run added any, which are then cleared.
      FUN`ROWS`TAKE: |-
        if(hasattr(%!,DATA`ROWS`%q<screen_key>),xget(%!,DATA`ROWS`%q<screen_key>)[attrib_set(%!/DATA`ROWS`%q<screen_key>)])
      # Short columns are nowrap and the Location and Status columns grow into the spare width, so a
      # table fills the box. On a narrow screen the columns of least priority go first (Gender, then
      # Alias, then Connected); in the portal, a phone shows only the priority-1 columns. A Status column
      # is priority 1: another package put it there to be seen.
      # %0 the nowrap columns, %1 the priorities, %2 each column's share of spare width, %3 each column's
      # least width, each split by %r.
      FUN`DISPLAY`OPTIONS: |-
        json(object,delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1),grow,json(string,%2),min,json(string,%3))
      # %0 the footer's text, under a rule.
      FUN`DISPLAY`FOOTER: |-
        %r[rule()]%r[tone(muted,%0)]
      # ---- Settings: +config who-where -------------------------------------------
      # Each DATA`CONFIG`<NAME> is the value; the leaves under it tell +config what it accepts. The code
      # reads the value with v() or get(); see plus-config's README.
      DATA`CONFIG:
        value: |-
          What +who and +where show.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Who and Where
      DATA`CONFIG`IDLE-AFTER: |-
        3600
      DATA`CONFIG`IDLE-AFTER`TYPE: |-
        duration
      DATA`CONFIG`IDLE-AFTER`DEFAULT: |-
        3600
      DATA`CONFIG`IDLE-AFTER`MIN: |-
        60
      DATA`CONFIG`IDLE-AFTER`DESCRIPTION: |-
        How long a player is idle before +who draws their name muted.
      DATA`CONFIG`IDLE-AFTER`LABEL: |-
        Idle after
      DATA`CONFIG`IDLE-AFTER`EXAMPLE: |-
        45m
      DATA`CONFIG`WHO-ORDER: |-
        name
      DATA`CONFIG`WHO-ORDER`TYPE: |-
        choice
      DATA`CONFIG`WHO-ORDER`CHOICES: |-
        name idle
      DATA`CONFIG`WHO-ORDER`DEFAULT: |-
        name
      DATA`CONFIG`WHO-ORDER`DESCRIPTION: |-
        The order +who lists players in. +who/name and +who/idle pick one.
      DATA`CONFIG`WHO-ORDER`LABEL: |-
        Bare +who order
      DATA`CONFIG`WHO-ORDER`EXAMPLE: |-
        idle
      DATA`CONFIG`WHERE-VIEW: |-
        grouped
      DATA`CONFIG`WHERE-VIEW`TYPE: |-
        choice
      DATA`CONFIG`WHERE-VIEW`CHOICES: |-
        grouped room name
      DATA`CONFIG`WHERE-VIEW`DEFAULT: |-
        grouped
      DATA`CONFIG`WHERE-VIEW`DESCRIPTION: |-
        What +where shows: players under a line per location, or one per line by room or by name.
      DATA`CONFIG`WHERE-VIEW`LABEL: |-
        Bare +where view
      DATA`CONFIG`WHERE-VIEW`EXAMPLE: |-
        room
      # %0 a player, %1 their idle seconds: their name, muted when they have been idle the idle-after
      # setting or longer (screen_idle_after, read once by FUN`SCREEN`START).
      FUN`DISPLAY`NAME: |-
        if(gte(%1,%q<screen_idle_after>),tone(muted,name(%0)),name(%0))
      # ---- +who ---------------------------------------------------------------------
      # +who: %0 the players, %1 the order (name when empty, or idle), %2 the start of a name, to show only
      # the players whose name or alias starts with it: name, alias, idle, connected, gender and location.
      # A Status column joins the table when some player has a status. Another package fills it without
      # editing this one: it attaches FILTER`WHO`STATUS`<NAME> to this object, and chain() runs every such
      # filter in name order, each getting the status so far as %0 and the player as %1.
      FUN`WHO: |-
        u(%!/FUN`SCREEN`START,WHO)[setqm(who_prefix,%2,
        who_filters,u(%!/FUN`FILTER`LIST,WHO`STATUS),
        screen_parts,u(%!/FUN`PART`SPLIT,u(%!/FUN`ORDER`[firstof(%1,name)],%0),v(DATA`PART`PLAYERS)))]
      # %0 a run of players, or -: their rows, or the screen.
      FUN`WHO`PART: |-
        case(%0,-,u(%!/FUN`WHO`SCREEN,u(%!/FUN`ROWS`TAKE)),null(u(%!/FUN`ROWS`ADD,iter(u(%!/FUN`WHO`KEEP,%0),u(%!/FUN`WHO`ROW,%i0),,%q<screen_row_separator>))))
      # %0 players: those to show.
      FUN`WHO`KEEP: |-
        if(strlen(%q<who_prefix>),u(%!/FUN`MATCH`PLAYERS,%0,%q<who_prefix>),%0)
      # %0 a player: their row.
      FUN`WHO`ROW: |-
        unmark(u(%!/FUN`DISPLAY`NAME,%0,setr(row_idle,idle(%0)))%r[first(get(%0/ALIAS),;)]%r[etime(%q<row_idle>,3)]%r[etime(conn(%0),3)]%r[firstof(ucstr(left(get(%0/SEX),1)),?)]%r[u(%!/FUN`ROOM`NAME,u(%!/FUN`ROOM`OF,%0))]%r[chain(%q<who_filters>,,%0)])
      # %0 the rows: the box, or a warning when +who <name> matched nobody.
      FUN`WHO`SCREEN: |-
        if(strlen(%0),box(u(%!/FUN`WHO`TABLE,%0)[u(%!/FUN`DISPLAY`FOOTER,u(%!/FUN`WHO`COUNT,words(%0,%q<screen_row_separator>)))],Who's Online),notice(WHO,Nobody connected has a name starting with %q<who_prefix>.,warn))
      # %0 the rows: the table, with a Status column when any status is set. Without one, every row ends
      # in an empty cell, which is taken off.
      FUN`WHO`TABLE: |-
        setq(who_bare_rows,edit(%0%q<screen_row_separator>,%r%q<screen_row_separator>,%q<screen_row_separator>))[if(eq(sub(strlen(%0%q<screen_row_separator>),strlen(%q<who_bare_rows>)),mul(words(%0,%q<screen_row_separator>),strlen(%r))),ldatatable(u(%!/FUN`DISPLAY`OPTIONS,1%r2%r3%r4%r5,1%r3%r1%r2%r4%r1,%r%r%r%r%r1,%r%r%r%r%r12),tone(strong,Name)%r[tone(strong,Alias)]%r>[tone(strong,Idle)]%r>[tone(strong,Conn)]%r[tone(strong,G)]%r[tone(strong,Location)],left(%q<who_bare_rows>,dec(strlen(%q<who_bare_rows>))),%q<screen_row_separator>),ldatatable(u(%!/FUN`DISPLAY`OPTIONS,1%r2%r3%r4%r5,1%r3%r1%r2%r4%r1%r1,%r%r%r%r%r1%r1,%r%r%r%r%r12%r12),tone(strong,Name)%r[tone(strong,Alias)]%r>[tone(strong,Idle)]%r>[tone(strong,Conn)]%r[tone(strong,G)]%r[tone(strong,Location)]%r[tone(strong,Status)],%0,%q<screen_row_separator>))]
      # %0 players: by name.
      FUN`ORDER`NAME: |-
        sort(%0,namei)
      # %0 players: the least idle first, and by name among the equally idle.
      FUN`ORDER`IDLE: |-
        sortkey(%!/FUN`ORDER`IDLE`KEY,sort(%0,namei),n)
      FUN`ORDER`IDLE`KEY: |-
        idle(%0)
      # %0 players, %1 the start of a name: the players whose name or first alias starts with it, ignoring
      # case. Compared as text, so a * or ? in it is a character, not a wildcard.
      FUN`MATCH`PLAYERS: |-
        squish(iter(%0,if(cor(u(%!/FUN`MATCH`STARTS,name(%i0),%1),u(%!/FUN`MATCH`STARTS,first(get(%i0/ALIAS),;),%1)),%i0)))
      # %0 a name, %1 a start: whether %0 starts with %1, ignoring case.
      FUN`MATCH`STARTS: |-
        not(comp(lcstr(left(%0,strlen(%1))),lcstr(%1)))
      # %0 how many are shown: and of how many when +who <name> left some out.
      FUN`WHO`COUNT: |-
        %0[if(neq(%0,words(mwho())),%bof [words(mwho())])] connected
      # %0 a point, %1 what would be shown, %2 the player: what every FILTER`<point>`<NAME> on this object
      # makes of it, in name order. With no filters, %1 unchanged.
      FUN`FILTER`APPLY: |-
        chain(u(%!/FUN`FILTER`LIST,%0),%1,%2)
      # %0 a point: its filters, as the chain() list.
      FUN`FILTER`LIST: |-
        iter(lattr(%!/FILTER`%0`*),%!/%i0)
      # ---- +where -------------------------------------------------------------------
      # One pass groups the players by room: json_group_by() looks up each player's room once and answers
      # {"<room>":["<player>",...],...}, the players under each room in name order. One json_map() pass
      # lists the rooms and keeps each room's players in a q-register (where_room_<number>), which the @dolist
      # runs carry, so the cost grows with players plus rooms, never players times rooms.
      # %0 a player: the room they stand in, or #-1 when they or a place they are in is unfindable.
      # room() answers an objid, or #-1 PERMISSION DENIED; the dbref before the colon is the answer.
      FUN`ROOM`OF: |-
        first(first(room(%0)),:)
      # %0 players: the groups, each room with its players by name.
      FUN`ROOM`GROUPS: |-
        json_group_by(%!/FUN`ROOM`OF,sort(%0,namei))
      # json_map() over the groups: a room's key, its players kept in where_room_<number> (where_room_-1 for #-1).
      FUN`ROOM`KEEP: |-
        setq(where_room_[after(%2,#)],%1)%2
      # %0 groups: their rooms, by name, and #-1 last when someone cannot be located.
      FUN`ROOM`LIST: |-
        setq(where_rooms,json_map(%!/FUN`ROOM`KEEP,%0))[trim(sort(remove(%q<where_rooms>,#-1),namei)[if(member(%q<where_rooms>,#-1),%b#-1)])]
      # %0 a room from FUN`ROOM`LIST: the players in it, by name. The group is a JSON array of dbrefs, which
      # hold no character JSON escapes.
      FUN`ROOM`PLAYERS: |-
        edit(r(where_room_[after(%0,#)]),\[,,\],,",,\,,%b)
      # %0 a room or #-1: its name, or - for a player who cannot be located.
      FUN`ROOM`NAME: |-
        case(%0,#-1,-,name(%0))
      # +where: the heading; its runs are locations, each a rule with its name on the left and how many are
      # there on the right, and the players there under it in as many columns as fit; the count is last.
      FUN`WHERE: |-
        u(%!/FUN`SCREEN`START,WHERE)[setqm(where_rooms,u(%!/FUN`ROOM`LIST,u(%!/FUN`ROOM`GROUPS,%0)),
        screen_parts,u(%!/FUN`PART`SPLIT,%q<where_rooms>,v(DATA`PART`ROOMS)),
        where_footer,u(%!/FUN`WHERE`COUNT,%0,%q<where_rooms>))][rule(Where)]
      # %0 a run of rooms, or -: their groups, or the count.
      FUN`WHERE`PART: |-
        case(%0,-,rule()%r[tone(muted,%q<where_footer>)],iter(%0,u(%!/FUN`WHERE`GROUP,%i0,u(%!/FUN`ROOM`PLAYERS,%i0)),,%r))
      # %0 players, %1 their rooms: how many are connected, and in how many locations.
      FUN`WHERE`COUNT: |-
        setq(where_places,words(remove(%1,#-1)))[words(%0)] connected in %q<where_places> [if(eq(%q<where_places>,1),location,locations)]
      # %0 a room or #-1, %1 its players: its rule and its players. The rule's options put the location
      # on the left and the count on the right; the count is a right title, so a narrow screen drops it
      # first.
      FUN`WHERE`GROUP: |-
        rule(case(%0,#-1,Unfindable,name(%0)),,json(object,title,json(string,left),titles,json(array,json(object,text,json(string,setr(where_count,words(%1)) [case(%q<where_count>,1,player,players)]),side,json(string,right)))))%r[grid(iter(%1,u(%!/FUN`DISPLAY`NAME,%i0,idle(%i0)),,|),|)]
      # +where/grouped: under a line per location.
      FUN`WHERE`GROUPED: |-
        u(%!/FUN`WHERE,%0)
      # +where/room: one row per player, by location and then by name; its runs are locations.
      FUN`WHERE`ROOM: |-
        u(%!/FUN`SCREEN`START,WHERE`ROOM)[setqm(where_title,Where by location,
        screen_parts,u(%!/FUN`PART`SPLIT,u(%!/FUN`ROOM`LIST,u(%!/FUN`ROOM`GROUPS,%0)),v(DATA`PART`ROOMS)))]
      # %0 a run of rooms, or -: their rows, or the screen.
      FUN`WHERE`ROOM`PART: |-
        case(%0,-,u(%!/FUN`WHERE`SCREEN,u(%!/FUN`ROWS`TAKE)),null(u(%!/FUN`ROWS`ADD,iter(%0,u(%!/FUN`WHERE`ROOM`ROWS,%i0),,%q<screen_row_separator>))))
      # %0 a room: a row for each of its players, its name looked up once.
      FUN`WHERE`ROOM`ROWS: |-
        setq(where_place,u(%!/FUN`ROOM`NAME,%0))[iter(u(%!/FUN`ROOM`PLAYERS,%0),u(%!/FUN`WHERE`ROW,%i0,%q<where_place>),,%q<screen_row_separator>)]
      # +where/name: one row per player, by name; its runs are players.
      FUN`WHERE`NAME: |-
        u(%!/FUN`SCREEN`START,WHERE`NAME)[setqm(where_title,Where by name,
        screen_parts,u(%!/FUN`PART`SPLIT,sort(%0,namei),v(DATA`PART`PLAYERS)))]
      # %0 a run of players, or -: their rows, or the screen.
      FUN`WHERE`NAME`PART: |-
        case(%0,-,u(%!/FUN`WHERE`SCREEN,u(%!/FUN`ROWS`TAKE)),null(u(%!/FUN`ROWS`ADD,iter(%0,u(%!/FUN`WHERE`ROW,%i0,u(%!/FUN`ROOM`NAME,u(%!/FUN`ROOM`OF,%i0))),,%q<screen_row_separator>))))
      # %0 a player, %1 where they are: their row, with how long they have been idle.
      FUN`WHERE`ROW: |-
        unmark(u(%!/FUN`DISPLAY`NAME,%0,setr(row_idle,idle(%0)))%r%1%r[etime(%q<row_idle>,3)])
      # %0 the rows: the box with the table and the count.
      FUN`WHERE`SCREEN: |-
        box(ldatatable(u(%!/FUN`DISPLAY`OPTIONS,1%r3,1%r1%r2,%r1,%r12),tone(strong,Name)%r[tone(strong,Location)]%r>[tone(strong,Idle)],%0,%q<screen_row_separator>)[u(%!/FUN`DISPLAY`FOOTER,words(%0,%q<screen_row_separator>) connected)],%q<where_title>)

  # ---- +help topics ---------------------------------------------------------
  # On the function object, which is unflagged — the librarian cannot u() a privileged object's
  # attribute. See plus-help's README for that rule and for how an evaluated body is escaped.
  - ref: ww_help
    type: thing
    name: Who-Where Help
    attributes:
      HELP: |-
        Seeing who is connected and where they are.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WHO: |-
        where
      SEE`WHERE: |-
        who
      HELP`WHO: |-
        `+who` lists everyone connected, by name, with their alias, how long they have been idle and
        connected, the first letter of their `@sex`, and where they are.

        - `+who` lists everyone, by name unless the game has set another order.
        - `+who/name` lists them by name, and `+who/idle` the least idle first.
        - `+who <name>` lists only the players whose name or alias starts with `<name>`.

        A name is drawn muted once its player has been idle an hour, or as long as the game sets. A player who is unfindable, or
        is in an unfindable room, is at `-`. The footer counts who is shown.

        Example:

        ```
        > +who mi
        +==============================< Who's Online >==============================+
        | Name  Alias  Idle  Conn  G  Location                                       |
        | -------------------------------------------------------------------------- |
        | Mira  Mi      29m   29m  F  The Old Mill                                   |
        +============================================================================+
        | 1 of 8 connected                                                           |
        +============================================================================+
        ```

        Output: a box with one row per player and the count under it.

        It shows what a mortal may see, so anyone hiding from the who list is absent from yours as
        well as from theirs. A Status column appears when another package gives some player a status,
        such as `+status lfrp`.
      LOCK`WHO`FILTERS: |-
        perm^packages.admin
      HELP`WHO`FILTERS: |-
        A package can put a status in `+who` without editing who-where. It adds a **filter** to the
        Who-Where Function Object: an attribute named `` FILTER`WHO`STATUS`<name> ``. For each player,
        `+who` runs every such filter in name order with `chain\(\)`. Each gets the status so far as
        `%%0`, empty to begin with, and the player as `%%1`, and returns the status to show; the next
        filter gets that. The Status column appears when any player's status is not empty.

        A filter runs as the Who-Where Function Object, with `%%#` the player reading. For example,
        to mark staff:

        `` &FILTER`WHO`STATUS`STAFF <object>=if\(hasrole\(%%1,wizard\),Staff,%%0\) ``

        A filter a package attaches goes away when the package is uninstalled.
      HELP`WHERE: |-
        `+where` shows where everyone connected is standing.

        - `+where/grouped` gives each location a line with its name and how many are there, and lists
          the players there under it, by name. `+where` shows this view unless the game has set another.
        - `+where/room` lists one player per line, sorted by location.
        - `+where/name` lists one player per line, sorted by name.

        A player who is unfindable, or is in an unfindable room, is listed under Unfindable, or at `-`
        in the one-per-line views.

        Example:

        ```
        > +where
        ===================================< Where >==================================
        =< Harbour Watch >===============================================< 1 player >=
        Bram
        =< Market Square >==============================================< 3 players >=
        Ash     Sorrel  Tomas
        =< Room Zero >===================================================< 1 player >=
        God
        =< The Old Mill >===============================================< 2 players >=
        Elin  Mira
        =< Unfindable >==================================================< 1 player >=
        Kit
        ==============================================================================
        8 connected in 4 locations
        ```

        Output: a heading, a line per location with the players there under it, and the count.

      LOCK`WHO`SETTINGS: |-
        perm^config.admin
      HELP`WHO`SETTINGS: |-
        Staff change what `+who` and `+where` show with `+config who-where`:

        - `idle-after`: how long a player is idle before their name is drawn muted. An hour by default.
        - `who-order`: the order a bare `+who` uses, `name` or `idle`.
        - `where-view`: the view a bare `+where` shows, `grouped`, `room` or `name`.

        Example:

        ```
        > +config who-where/where-view=room
        \[CONFIG\] Done: who-where/where-view is now room, was grouped.
        ```

        Output: one line saying what the setting is now and what it was.

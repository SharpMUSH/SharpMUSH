format: 1
package: who-where
version: 1.1.0
authors: [SharpMUSH]
description: "+who and +where commands with a shared formatting object, drawn as layout tables."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [who, where, social]
convention_prefix: WW_
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: ww_global
    type: thing
    name: Who-Where Global Object
    parent: "{{ww_functions}}"
    attributes:
      CMD_+WHO: |-
        $+who:@pemit %#=[u({{ww_functions}}/WW_FN_WHO,mwho())]
      CMD_+WHERE: |-
        $+where:@pemit %#=[u({{ww_functions}}/WW_FN_WHERE,mwho())]

  - ref: ww_functions
    type: thing
    name: Who-Where Function Object
    flags: [no_command]
    attributes:
      # Each screen is a box() round a datacolumns() table, one iter() per column. No width is given,
      # so every reader gets it at their own width, and the web portal draws a card with a table.
      # Columns are joined with %r and the delimiter is a newline (WW_FN_OPTS), so a room name with a |
      # in it stays one cell; WW_FN_OPTS takes the nowrap columns and the priorities split the same way.
      # Every column is nowrap, so a narrow screen drops the lower-priority columns instead of breaking
      # names across lines.
      WW_FN_OPTS: |-
        json(object,delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1))
      WW_FN_FOOT: |-
        %r[rule()]%r[words(%0)] connected
      WW_FN_WHO: |-
        box(datacolumns(u(%!/WW_FN_OPTS,1%r2%r3,1%r1%r2),Name%r[iter(%0,name(%i0),,%r)],>Idle%r[iter(%0,trim(timestring(idle(%i0))),,%r)],>Connected%r[iter(%0,trim(timestring(conn(%i0))),,%r)])[u(%!/WW_FN_FOOT,%0)],Who's Online)
      WW_FN_WHERE: |-
        box(datacolumns(u(%!/WW_FN_OPTS,1%r2,1%r2),Name%r[iter(%0,name(%i0),,%r)],Location%r[iter(%0,firstof(name(loc(%i0)),-),,%r)])[u(%!/WW_FN_FOOT,%0)],Where)

  # ---- +help topics ---------------------------------------------------------
  # On the function object, which is unflagged — the librarian cannot u() a privileged object's
  # attribute. See plus-help's README for that rule and for how an evaluated body is escaped.
  - ref: ww_help
    type: thing
    name: Who-Where Help
    attributes:
      HELP: |-
        Seeing who is connected and where they are.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WHO: |-
        where
      SEE`WHERE: |-
        who
      HELP`WHO: |-
        `+who` lists everyone connected and how long each has been idle.

        It shows what a mortal may see, so anyone hiding from the who list is absent from yours as
        well as from theirs.
      HELP`WHERE: |-
        `+where` lists everyone connected and the room each is standing in.

        A player in an unfindable room, or one who has made themselves unfindable, is listed without
        a location rather than being hidden outright.

  - ref: ww_help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WHO-WHERE: |-
        {{ww_help}}

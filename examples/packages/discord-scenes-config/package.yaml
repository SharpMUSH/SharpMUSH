format: "1.16"
package: discord-scenes-config
title: "Discord scheduled scenes: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Discord scheduled scenes settings into +config: registers them with the +config registry, so staff see and change them with +config discord-scenes."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [discord-scenes, config, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. discord-scenes declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: discord-scenes
    version: ">=1.2"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/discord-scenes/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`DISCORD-SCENES: |-
        {{discord-scenes/publisher}}

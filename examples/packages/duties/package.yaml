        u(%!/FUN`RUNREGS,%0)[box(switch(%q<state>,lobby,u(%!/FUN`SCREEN`LOBBY,%0),switch(%q<kind>,challenge,u(%!/FUN`SCREEN`CHALLENGE,%0,%1),u(%!/FUN`SCREEN`STEPTEXT,%1)[if(strmatch(%q<kind>,narration),%r[rule()]%r[tone(muted,if(strmatch(%q<leader>,%1),+duty/go to go on.,Waiting for [name(%q<leader>)] to go on.))])])),u(%!/FUN`TITLE,%q<root>)[if(cand(strlen(%q<node>),strlen(setr(srl,get({{store}}/%q<root>`N`%q<node>`LABEL)))),%b- %q<srl>)])]

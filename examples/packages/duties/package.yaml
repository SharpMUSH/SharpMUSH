        @include %!/INC`NEED`DUTY; @assert u(%!/FUN`CANEDIT,%#,%q<id>)=@pemit %#=notice(DUTY,Permission denied. Only its author or a duty reviewer may read %q<id>'s steps.,error); @pemit %#=u(%!/FUN`SCREEN`DOC,%q<id>,u(%!/FUN`ROOT,%q<id>))

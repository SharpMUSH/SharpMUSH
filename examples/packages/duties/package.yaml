        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; @assert strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)=think setq(do_msg,%q<id> is not waiting for review.); think setq(do_prob,u(%!/FUN`PROBLEMS,%q<id>,u(%!/FUN`ROOT,%q<id>))); @assert not(strlen(%q<do_prob>))=think setq(do_msg,%q<id> needs work:); think setq(old,get({{store}}/DUTY`%q<id>`LIVE)); &DUTY`%q<id>`LIVE {{store}}=get({{store}}/DUTY`%q<id>`DRAFT); &DUTY`%q<id>`DRAFT {{store}}; &DUTY`%q<id>`STATE {{store}}; &DUTY`%q<id>`NOTE {{store}}; @include/nobreak %!/INC`DO`DROPREV; @pemit get({{store}}/DUTY`%q<id>`AUTHOR)=notice(DUTY,Your duty %q<id> is approved.,ok); think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is approved. +duty/roster %q<id>=on puts it on the active roster.)
      INC`DO`RETURN: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; @assert strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)=think setq(do_msg,%q<id> is not waiting for review.); @assert strlen(trim(%q<do_text>))=think setq(do_msg,if(strlen(%q<sw>),Say what needs changing: +duty/return %q<id>=<note>.,Say what needs changing.)); &DUTY`%q<id>`STATE {{store}}=returned; &DUTY`%q<id>`NOTE {{store}}=%q<do_text>; @pemit get({{store}}/DUTY`%q<id>`AUTHOR)=notice(DUTY,Your duty %q<id> needs changes: %q<do_text>,warn); think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> goes back to its author with your note.)
      # A reviewer's note on one step (do_key), shown with it to the author. Empty removes it.
      INC`DO`NOTE: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; think setqm(root,u(%!/FUN`ROOT,%q<id>),key,lcstr(trim(%q<do_key>))); @assert u(%!/FUN`HASNODE,%q<root>,%q<key>)=think setq(do_msg,%q<id> has no step called %q<key>. +duty/show %q<id> lists them.); &%q<root>`REMARK`%q<key> {{store}}=%q<do_text>; think setqm(do_ok,1,do_tone,ok,do_msg,if(strlen(%q<do_text>),Noted on %q<key>.,The note on %q<key> is gone.))
      # Puts duty do_id on the active roster or takes it off (do_text on or off).
      INC`DO`ROSTER: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; think setq(do_on,lcstr(trim(%q<do_text>))); @assert member(on off,%q<do_on>)=think setq(do_msg,if(strlen(%q<sw>),+duty/roster %q<id>=on or off,Say on or off.)); @assert cor(strmatch(%q<do_on>,off),cand(get({{store}}/DUTY`%q<id>`LIVE),not(get({{store}}/DUTY`%q<id>`RETIRED))))=think setq(do_msg,Only an approved duty that is not retired goes on the roster.); &ROSTER`%q<id> {{store}}=strmatch(%q<do_on>,on); think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is %q<do_on> the active roster.)
      # The days duty do_id is on the roster: do_from and do_to (YYYY-MM-DD, or MM-DD when do_yearly), either
      # empty for no limit. do_set is 0 when the command had no =.
      INC`DO`WINDOW: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; @assert cor(not(strlen(%q<sw>)),%q<do_set>)=think setq(do_msg,+duty/window %q<id>=<from>%,<to>%[%,yearly%]); think setqm(wf,trim(%q<do_from>),wt,trim(%q<do_to>),wy,if(%q<do_yearly>,1,0)); @assert cand(u(%!/FUN`DATEOK,%q<wf>,%q<wy>),u(%!/FUN`DATEOK,%q<wt>,%q<wy>))=think setq(do_msg,if(%q<wy>,Yearly days are MM-DD%, such as 12-01.,Days are YYYY-MM-DD%, such as 2026-12-01[if(strlen(%q<sw>),%, or add %,yearly for MM-DD)].)); &ROSTER`%q<id>`FROM {{store}}=%q<wf>; &ROSTER`%q<id>`TO {{store}}=%q<wt>; &ROSTER`%q<id>`YEARLY {{store}}=%q<wy>; think setqm(do_ok,1,do_tone,ok,do_msg,u(%!/FUN`WINDOW,%q<id>))
      INC`DO`RETIRE: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; @assert get({{store}}/DUTY`%q<id>`LIVE)=think setq(do_msg,%q<id> has never been approved.); &DUTY`%q<id>`RETIRED {{store}}=1; think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is retired. Parties already on it finish it.)
      INC`DO`RESTORE: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; @include %!/INC`DO`NEED; @assert get({{store}}/DUTY`%q<id>`RETIRED)=think setq(do_msg,%q<id> is not retired.); &DUTY`%q<id>`RETIRED {{store}}; think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is back among the approved duties.)
      # Ends party do_run without rewards; when do_id names a duty, only a party on it.
      INC`DO`END: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED`STAFF; think setq(run,trim(%q<do_run>)); @assert cand(isint(%q<run>),hasattr({{store}},RUN`%q<run>))=think setq(do_msg,There is no party %q<run>.); @assert cor(not(strlen(%q<do_id>)),strmatch(get({{store}}/RUN`%q<run>),lcstr(trim(%q<do_id>))))=think setq(do_msg,Party %q<run> is not on [lcstr(trim(%q<do_id>))].); think u(%!/FUN`RUNREGS,%q<run>); think setqm(do_ok,1,do_tone,ok,do_msg,Party %q<run> is ended.); @include/args %!/INC`RUN`FINISH=why,A duty reviewer ends the duty. Nobody earns its rewards.

      # ---- Portal ---------------------------------------------------------------------------
      # The duties-app package shows these at /apps/duties. The routes on the HTTP handler (at the end of the
      # package) read WEB`SCHEMA and WEB`DATA through u(), and run WEB`ACT here with @force, so writes run as
      # this object and their "Set." lines never reach the response. %<viewer> is the character the portal
      # signed in as. Pages, by the address after /apps/duties/: nothing, the viewer's duties, the ones
      # waiting for review and the approved ones (for a reviewer) and a form to start one; a duty's id, its
      # editor, with its roster for a reviewer once it is approved.
      #
      # The editor's steps are one graph field, steps: { start, nodes: [{ key, kind, label, x, y, fields }],
      # edges: [{ from, port, to, weight, min, max, share, requires }] }. A step's fields are text, seen,
      # combine, result, critsuccess, success, partial, fail, critfail, options (rows { id, label, trait,
      # difficulty, successes, failures, trained, note }) and rewards (rows { kind, repeat, ...details }).
      # Saving rewrites the revision being edited from it, through the same checks +duty applies.
      WEB`JSON`ARRAY: |-
        if(strlen(setr(web_ja,trim(squish(%0,%r),b,%r))),json_array(%q<web_ja>,%r),json_array())
      WEB`JSON`BOOLEAN: |-
        json(boolean,if(%0,true,false))
      # %0 %r-separated JSON objects: one object holding every member.
      WEB`JSON`OBJECT: |-
        if(strlen(%0),fold(%!/WEB`JSON`MERGE,%0,json(object),%r),json(object))
      WEB`JSON`MERGE: |-
        json_mod(%0,patch,%1)
      # %0 an object, %1 a key, %2 a JSON value, %3 1 to add it: the object, with that member when %3.
      WEB`JSON`PUT: |-
        if(%3,json_mod(%0,patch,json(object,%1,%2)),%0)
      # One datum for the data payload: key %0, JSON value %1, shown when %2.
      WEB`JSON`MEMBER: |-
        json(object,%0,json(object,value,if(%2,%1,json(string,)),visible,u(%!/WEB`JSON`BOOLEAN,%2)))
      # Field %0 of the posted JSON in %q<body>: a string unquoted, anything else as JSON, nothing when missing.
      WEB`BODY`GET: |-
        setq(web_got,json_query(%q<body>,get,%0))[switch(%q<web_got>,null,,"*,json_query(%q<web_got>,unescape),%q<web_got>)]
      WEB`RESULT`ERROR: |-
        json(object,ok,json(boolean,false),errors,json(object,_global,json(string,%0)))
      # The answer when an INC`DO` routine refused: its message, and the problems it found.
      WEB`RESULT`FAIL: |-
        u(%!/WEB`RESULT`ERROR,%q<do_msg>[if(strlen(%q<do_prob>),%b[edit(trim(%q<do_prob>,b,%r),%r,%b)])])
      # The answer after a change to duty id: message %0, the page drawn again and its data.
      WEB`RESULT`PAGE: |-
        json(object,ok,json(boolean,true),message,json(string,%0),schema,u(%!/WEB`SCHEMA`DUTY,%q<web_viewer>,%q<id>),data,json(object,fields,u(%!/WEB`DATA`DUTY,%q<web_viewer>,%q<id>)))

      # schemas: GET /http/duties/schema?at=<path>
      WEB`SCHEMA: |-
        setq(web_at,lcstr(trim(%<at>,b,/)))[switch(1,not(cand(strlen(%<viewer>),hastype(%<viewer>,player))),u(%!/WEB`SCHEMA`SAY,Duties,Sign in with a character to write duties.),not(strlen(%q<web_at>)),u(%!/WEB`SCHEMA`HOME,%<viewer>),not(cand(u(%!/FUN`EXISTS,%q<web_at>),u(%!/FUN`CANEDIT,%<viewer>,%q<web_at>))),u(%!/WEB`SCHEMA`SAY,Duties,There is no duty called %q<web_at> that you can change.),u(%!/WEB`SCHEMA`DUTY,%<viewer>,%q<web_at>))]
      # A page that only says something: title %0, text %1.
      WEB`SCHEMA`SAY: |-
        json_fill(v(DATA`WEB`SAY),/title,%0,/pages/0/sections/0/elements/0/value,%1)
      DATA`WEB`SAY: |-
        {"kind":"view","schema_version":1,"title":"","pages":[{"key":"main","title":"Duties","order":1,"sections":[{"name":"","order":1,"elements":[{"kind":"markdown","value":""}]}]}],"actions":{}}
      # %0 the viewer: their duties, the ones waiting for review when they review duties, and a new one.
      WEB`SCHEMA`HOME: |-
        json(object,kind,json(string,form),schema_version,json(number,1),title,json(string,Duties),pages,json(array,json(object,key,json(string,main),title,json(string,Duties),order,json(number,1),sections,u(%!/WEB`JSON`ARRAY,v(DATA`WEB`HOME`PLAY)%r[v(DATA`WEB`HOME`MINE)][if(u(%!/FUN`STAFF,%0),%r[v(DATA`WEB`HOME`REVIEW)]%r[v(DATA`WEB`HOME`ROSTER)])]%r[v(DATA`WEB`HOME`NEW)]))),actions,json(object,act,v(DATA`WEB`ACT)))
      DATA`WEB`HOME`PLAY: |-
        {"name":"Duties you can start","order":0,"elements":[{"kind":"table","rows_field":"play","empty":"No duties are on the active roster now.","columns":[{"key":"title","label":"Duty"},{"key":"id","label":"Id"},{"key":"about","label":"About"},{"key":"party","label":"Party"},{"key":"rewards","label":"Rewards"},{"key":"challenges","label":"Challenges seen"},{"key":"explored","label":"Explored"}]},{"kind":"markdown","value":"Start one in the game with `+duty/start` and its id. With the Duties in scenes package, `+duty/start/scene` plays it in a scene of its own."}]}
      DATA`WEB`HOME`MINE: |-
        {"name":"Your duties","order":1,"elements":[{"kind":"table","rows_field":"mine","empty":"You have not written a duty yet.","columns":[{"key":"title","label":"Duty","link":"/apps/duties/{id}"},{"key":"id","label":"Id"},{"key":"status","label":"Status","type":"chip","color_key":"color"}]}]}
      DATA`WEB`HOME`REVIEW: |-
        {"name":"Waiting for review","order":2,"elements":[{"kind":"table","rows_field":"review","empty":"No duty is waiting for review.","columns":[{"key":"title","label":"Duty","link":"/apps/duties/{id}"},{"key":"id","label":"Id"},{"key":"author","label":"Author"}]}]}
      DATA`WEB`HOME`ROSTER: |-
        {"name":"Approved duties","order":3,"elements":[{"kind":"table","rows_field":"approved","empty":"No duty has been approved yet.","columns":[{"key":"title","label":"Duty","link":"/apps/duties/{id}"},{"key":"id","label":"Id"},{"key":"roster","label":"Roster","type":"chip","color_key":"color"},{"key":"days","label":"Days"},{"key":"now","label":"Now"},{"key":"parties","label":"Parties"}]}]}
      DATA`WEB`HOME`NEW: |-
        {"name":"Write a new duty","order":4,"columns":2,"elements":[{"kind":"field","key":"new_title","label":"Title","type":"text","validation":{"required":false,"max_length":80}},{"kind":"field","key":"new_id","label":"Id","type":"text","help":"A short name for commands: a letter, then letters, digits or _, 24 at most.","validation":{"required":false,"max_length":24}},{"kind":"button","label":"Create","action":"act","values":{"op":"create"},"color":"primary","variant":"filled"}]}
      DATA`WEB`ACT: |-
        {"transport":"http","method":"POST","route":"/http/duties/act","payload":"fields","on_error":{"bind_field_errors":true}}
      DATA`WEB`CHECK: |-
        {"transport":"http","method":"POST","route":"/http/duties/check","payload":"fields","on_error":{"bind_field_errors":true}}
      DATA`WEB`NOTE: |-
        {"transport":"http","method":"POST","route":"/http/duties/note","payload":"fields","on_error":{"bind_field_errors":true}}

      # %0 the viewer, %1 a duty they may change: its editor. Sets web_state, web_edit (they may change it
      # now) and web_review (a reviewer, and it waits for review).
      WEB`SCHEMA`DUTY: |-
        setqm(web_state,get({{store}}/DUTY`%1`STATE),
        web_edit,cand(u(%!/FUN`CANEDIT,%0,%1),not(strmatch(get({{store}}/DUTY`%1`STATE),submitted))),
        web_review,cand(u(%!/FUN`STAFF,%0),strmatch(get({{store}}/DUTY`%1`STATE),submitted)))[json(object,kind,json(string,form),schema_version,json(number,1),title,json(string,u(%!/FUN`TITLE,u(%!/FUN`ROOT,%1))),pages,json(array,json(object,key,json(string,main),title,json(string,Duty),order,json(number,1),sections,u(%!/WEB`JSON`ARRAY,v(DATA`WEB`DUTY`STATUS)%r[v(if(%q<web_edit>,DATA`WEB`DUTY`ABOUT,DATA`WEB`DUTY`ABOUTVIEW))]%r[json(object,name,json(string,Steps),order,json(number,3),elements,json(array,u(%!/WEB`GRAPH`FIELD,%q<web_edit>,%q<web_review>)))]%r[u(%!/WEB`SCHEMA`BUTTONS,%0,%1)][if(cand(u(%!/FUN`STAFF,%0),get({{store}}/DUTY`%1`LIVE)),%r[u(%!/WEB`SCHEMA`ROSTER,%1)])]))),actions,json(object,act,v(DATA`WEB`ACT),check,v(DATA`WEB`CHECK),note,v(DATA`WEB`NOTE)))]
      DATA`WEB`DUTY`STATUS: |-
        {"name":"","order":1,"elements":[{"kind":"keyvalue","fields":["Status","Reviewer's note"]}]}
      DATA`WEB`DUTY`ABOUT: |-
        {"name":"About it","order":2,"columns":2,"elements":[{"kind":"field","key":"duty","type":"hidden"},{"kind":"field","key":"title","label":"Title","type":"text","span":2,"validation":{"required":true,"max_length":80}},{"kind":"field","key":"description","label":"Description","type":"textarea","span":2,"help":"What players read before they start."},{"kind":"field","key":"min","label":"Smallest party","type":"number","validation":{"required":true,"min":1}},{"kind":"field","key":"max","label":"Largest party","type":"number","validation":{"required":true,"min":1}},{"kind":"field","key":"repeat","label":"Each character can do it","type":"select","default":"every","options":[{"value":"once","label":"Once"},{"value":"every","label":"Again and again"}]}]}
      DATA`WEB`DUTY`ABOUTVIEW: |-
        {"name":"About it","order":2,"elements":[{"kind":"field","key":"duty","type":"hidden"},{"kind":"keyvalue","fields":["Title","Description","Party","Each character can do it"]}]}
      # %0 the viewer, %1 the duty: the buttons for what they may do with it now.
      WEB`SCHEMA`BUTTONS: |-
        json(object,name,json(string,),order,json(number,4),elements,u(%!/WEB`JSON`ARRAY,if(%q<web_edit>,u(%!/WEB`BUTTON,Save,save,primary)%r[u(%!/WEB`BUTTON,Submit for review,submit,success,Submit %1 for review? It cannot be changed while it waits.)][if(cand(get({{store}}/DUTY`%1`LIVE),get({{store}}/DUTY`%1`DRAFT)),%r[u(%!/WEB`BUTTON,Discard changes,discard,error,Drop the changes and keep the approved duty?)])])[if(cand(strmatch(%q<web_state>,submitted),strmatch(get({{store}}/DUTY`%1`AUTHOR),objid(%0))),u(%!/WEB`BUTTON,Withdraw,withdraw,secondary))][if(%q<web_review>,%r[v(DATA`WEB`RETURNNOTE)]%r[u(%!/WEB`BUTTON,Return with note,return,warning)]%r[u(%!/WEB`BUTTON,Approve,approve,success,Approve %1? It can then go on the active roster.)])]))
      # A button: label %0, the op it posts %1, colour %2, a question asked first %3.
      WEB`BUTTON: |-
        json(object,kind,json(string,button),label,json(string,%0),action,json(string,act),values,json(object,op,json(string,%1)),color,json(string,%2),variant,json(string,if(match(primary success,%2),filled,outlined)),confirm,json(string,%3))
      DATA`WEB`RETURNNOTE: |-
        {"kind":"field","key":"return_note","label":"What needs changing","type":"textarea","help":"Sent to the author with the duty."}

      # %0 an approved duty: for a reviewer, three sections: its place on the roster, the days it is on, and
      # the parties on it.
      WEB`SCHEMA`ROSTER: |-
        setq(web_runs,u(%!/FUN`RUNSOF,%0))[json(object,name,json(string,On the roster),order,json(number,5),elements,u(%!/WEB`JSON`ARRAY,v(DATA`WEB`ROSTER`STATE)%r[if(get({{store}}/DUTY`%0`RETIRED),u(%!/WEB`BUTTON,Restore,restore,success),if(get({{store}}/ROSTER`%0),u(%!/WEB`BUTTON,Take off the roster,rosteroff,warning),u(%!/WEB`BUTTON,Put on the roster,rosteron,success))%r[u(%!/WEB`BUTTON,Retire,retire,error,Retire %0? Players can no longer start it. Parties on it now finish it.)])]))][if(not(get({{store}}/DUTY`%0`RETIRED)),%r[json(object,name,json(string,The days it is on),order,json(number,6),columns,json(number,3),elements,u(%!/WEB`JSON`ARRAY,v(DATA`WEB`ROSTER`FROM)%r[v(DATA`WEB`ROSTER`TO)]%r[v(DATA`WEB`ROSTER`YEARLY)]%r[u(%!/WEB`BUTTON,Save the days,window,primary)]))])]%r[json(object,name,json(string,Parties on it),order,json(number,7),elements,u(%!/WEB`JSON`ARRAY,v(DATA`WEB`ROSTER`PARTIES)[if(words(%q<web_runs>),%r[json_fill(v(DATA`WEB`ROSTER`END),/options,u(%!/WEB`RUNOPTIONS,%q<web_runs>))]%r[u(%!/WEB`BUTTON,End the party,end,error,End this party? Nobody earns the duty's rewards.)])]))]
      DATA`WEB`ROSTER`STATE: |-
        {"kind":"keyvalue","fields":["Roster","Days","Now"]}
      DATA`WEB`ROSTER`FROM: |-
        {"kind":"field","key":"window_from","label":"From","type":"text","help":"YYYY-MM-DD, or MM-DD with Every year. Empty: no first day.","validation":{"required":false,"max_length":10}}
      DATA`WEB`ROSTER`TO: |-
        {"kind":"field","key":"window_to","label":"Until","type":"text","help":"The last day it is on, written the same way. Empty: no last day.","validation":{"required":false,"max_length":10}}
      DATA`WEB`ROSTER`YEARLY: |-
        {"kind":"field","key":"window_yearly","label":"Every year","type":"boolean"}
      DATA`WEB`ROSTER`PARTIES: |-
        {"kind":"table","rows_field":"parties","empty":"No party is on it.","columns":[{"key":"party","label":"Party"},{"key":"leader","label":"Leader"},{"key":"members","label":"Members"},{"key":"step","label":"Where they are"}]}
      DATA`WEB`ROSTER`END: |-
        {"kind":"field","key":"end_run","label":"Party to end","type":"select","options":[]}
      # %0 parties: each as a choice for the party to end.
      WEB`RUNOPTIONS: |-
        u(%!/WEB`JSON`ARRAY,iter(%0,json(object,value,json(string,%i0),label,json(string,Party %i0%, led by [name(get({{store}}/RUN`%i0`LEADER))])),%b,%r))

      # The steps: a graph field, read-only unless %0, with pinned notes when %1 (a reviewer reviewing).
      WEB`GRAPH`FIELD: |-
        u(%!/WEB`JSON`PUT,json_fill(v(DATA`WEB`GRAPH),/graph/kinds,json(array,u(%!/WEB`KIND,CHALLENGE),u(%!/WEB`KIND,NARRATION),u(%!/WEB`KIND,END)),/graph/readonly,u(%!/WEB`JSON`BOOLEAN,not(%0))),graph,json(object,note_action,json(string,note)),%1)
      DATA`WEB`GRAPH: |-
        {"kind":"field","key":"steps","label":"Steps","type":"graph","graph":{"kinds":[],"check":"check","issues_field":"issues","notes_field":"notes","changes_field":"changes","readonly":false}}
      # A kind of step: its template, with the reward kinds and, on a challenge, the sheet system's traits.
      WEB`KIND: |-
        setq(web_kd,json_fill(v(DATA`WEB`KIND`%0),/fields/[v(DATA`WEB`KIND`%0`REWARDS)],u(%!/WEB`REWARDS`FIELD)))[if(strlen(v(DATA`WEB`KIND`%0`OPTIONS)),json_fill(%q<web_kd>,/fields/[v(DATA`WEB`KIND`%0`OPTIONS)]/item_fields/2/options,u(%!/WEB`TRAITS`OPTIONS)),%q<web_kd>)]

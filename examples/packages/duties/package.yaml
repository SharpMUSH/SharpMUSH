        kind,lcstr(%q<rhs>)); @assert cand(u(%!/FUN`IDOK,%q<key>),not(strmatch(%q<key>,improvise)))=@pemit %#=notice(DUTY,A step's name is a letter then letters%, digits or _%, 24 at most.,warn); @assert member(v(DATA`KINDS),%q<kind>)=@pemit %#=notice(DUTY,A step is a challenge%, a narration or an end.,warn); @assert cor(u(%!/FUN`HASNODE,%q<root>,%q<key>),lt(words(u(%!/FUN`NODES,%q<root>)),v(DATA`CONFIG`MAXNODES)))=@pemit %#=notice(DUTY,A duty has [v(DATA`CONFIG`MAXNODES)] steps at most.,warn); &%q<root>`N`%q<key> {{store}}=%q<kind>; @pemit %#=notice(DUTY,%q<key> is a %q<kind>.[if(strlen(get({{store}}/%q<root>`START)),,%b%q<id> starts there.)],ok); @assert strlen(get({{store}}/%q<root>`START))={&%q<root>`START {{store}}=%q<key>}

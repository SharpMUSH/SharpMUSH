      WEB`ACT`CHECK: |-
        @include/nobreak %!/INC`WEB`CHECK; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,if(strlen(u(%!/FUN`PROBLEMS,%q<id>,u(%!/FUN`ROOT,%q<id>))),%q<id> needs work. The guidance says what.,%q<id> is ready to submit.)))
      INC`WEB`CHECK: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED; @assert u(%!/FUN`CANEDIT,%q<do_viewer>,%q<id>)=think setqm(do_msg,Permission denied. Only its author or a duty reviewer may check %q<id>.,do_tone,error); @break strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)={think setq(do_ok,1)}; @include %!/INC`WEB`SAVE
      WEB`ACT`SUBMIT: |-
        @include/nobreak %!/INC`WEB`SAVE; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); @include/nobreak %!/INC`DO`SUBMIT; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`WITHDRAW: |-
        @include/nobreak %!/INC`DO`WITHDRAW; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`DISCARD: |-
        @include/nobreak %!/INC`DO`DISCARD; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`APPROVE: |-
        @include/nobreak %!/INC`DO`APPROVE; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`RETURN: |-
        think setq(do_text,u(%!/WEB`BODY`GET,return_note)); @include/nobreak %!/INC`DO`RETURN; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`NOTE: |-
        think setqm(do_key,u(%!/WEB`BODY`GET,node),
        do_text,u(%!/WEB`BODY`GET,text)); @include/nobreak %!/INC`DO`NOTE; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))
      WEB`ACT`ROSTERON: |-
        think setq(do_text,on); @include %!/INC`WEB`STAFFDO=ROSTER
      WEB`ACT`ROSTEROFF: |-
        think setq(do_text,off); @include %!/INC`WEB`STAFFDO=ROSTER
      WEB`ACT`WINDOW: |-
        think setqm(do_from,u(%!/WEB`BODY`GET,window_from),
        do_to,u(%!/WEB`BODY`GET,window_to),
        do_yearly,strmatch(u(%!/WEB`BODY`GET,window_yearly),true)); @include %!/INC`WEB`STAFFDO=WINDOW
      WEB`ACT`RETIRE: |-
        @include %!/INC`WEB`STAFFDO=RETIRE
      WEB`ACT`RESTORE: |-
        @include %!/INC`WEB`STAFFDO=RESTORE
      WEB`ACT`END: |-
        think setq(do_run,u(%!/WEB`BODY`GET,end_run)); @include %!/INC`WEB`STAFFDO=END
      # Runs INC`DO`<%0> and answers with the page drawn again, or what it refused.
      INC`WEB`STAFFDO: |-
        @include/nobreak %!/INC`DO`%0; @assert %q<do_ok>=think setq(web_response,u(%!/WEB`RESULT`FAIL)); think setq(web_response,u(%!/WEB`RESULT`PAGE,%q<do_msg>))

      # Saves the posted duty (do_viewer, do_id, and the fields in %q<body>) into the revision being edited,
      # starting one from the approved duty when there is none. Nothing is written unless all of it passes.
      INC`WEB`SAVE: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED; @assert u(%!/FUN`CANEDIT,%q<do_viewer>,%q<id>)=think setqm(do_msg,Permission denied. Only its author or a duty reviewer may change %q<id>.,do_tone,error); @break strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)=think setq(do_msg,%q<id> is waiting for review. Withdraw it to change it.); think setqm(web_title,trim(u(%!/WEB`BODY`GET,title)),
        web_desc,u(%!/WEB`BODY`GET,description),
        web_repeat,lcstr(firstof(u(%!/WEB`BODY`GET,repeat),every)),
        web_min,u(%!/WEB`BODY`GET,min),
        web_max,u(%!/WEB`BODY`GET,max),
        web_g,u(%!/WEB`BODY`GET,steps)); think setqm(web_gn,if(strmatch(json_query(%q<web_g>,type),object),json_query(%q<web_g>,extract,$.nodes)),
        web_ge,if(strmatch(json_query(%q<web_g>,type),object),json_query(%q<web_g>,extract,$.edges))); think setqm(web_nn,if(strmatch(json_query(%q<web_gn>,type),array),json_query(%q<web_gn>,size),0),
        web_en,if(strmatch(json_query(%q<web_ge>,type),array),json_query(%q<web_ge>,size),0)); think setqm(web_keys,iter(lnum(%q<web_nn>),firstof(edit(lcstr(trim(json_query(%q<web_gn>,extract,$%[%i0%].key))),%b,_),-)),
        web_kinds,iter(lnum(%q<web_nn>),firstof(edit(lcstr(trim(json_query(%q<web_gn>,extract,$%[%i0%].kind))),%b,_),-))); think setq(do_prob,u(%!/WEB`SAVE`PROBLEMS)); @assert not(strlen(%q<do_prob>))=think setq(do_msg,%q<id> was not saved:); @include/nobreak %!/INC`DO`DRAFT; think setq(root,DUTY`%q<id>`R[get({{store}}/DUTY`%q<id>`DRAFT)]); @include %!/INC`WEB`WRITE; think setqm(do_ok,1,
        do_tone,ok,
        do_msg,Saved.)
      # What is wrong with the posted duty, a line each.
      WEB`SAVE`PROBLEMS: |-
        setq(web_pr,[if(not(strlen(%q<web_title>)),Give it a title.~)][if(gt(strlen(%q<web_title>),80),Keep its title to 80 characters.~)][if(not(match(once every,%q<web_repeat>)),Each character can do it once or again and again.~)][if(not(cand(u(%!/FUN`INTIN,%q<web_min>,1,v(DATA`CONFIG`MAXPARTY)),u(%!/FUN`INTIN,%q<web_max>,1,v(DATA`CONFIG`MAXPARTY)))),The party is 1 to [v(DATA`CONFIG`MAXPARTY)] characters.~,if(gt(%q<web_min>,%q<web_max>),Its smallest party is larger than its largest.~))][if(not(strmatch(json_query(%q<web_g>,type),object)),The steps could not be read.~)][if(gt(%q<web_nn>,v(DATA`CONFIG`MAXNODES)),A duty has [v(DATA`CONFIG`MAXNODES)] steps at most.~)][if(neq(words(%q<web_keys>),words(setunion(%q<web_keys>,%q<web_keys>))),Two steps have the same key.~)][if(cand(strlen(setr(web_start,lcstr(json_query(%q<web_g>,extract,$.start)))),not(member(%q<web_keys>,%q<web_start>))),It starts at a step it does not have.~)][iter(lnum(%q<web_nn>),u(%!/WEB`SAVE`STEP,%i0),%b,~)][iter(lnum(%q<web_en>),u(%!/WEB`SAVE`LINK,%i0),%b,~)])[edit(trim(squish(%q<web_pr>,~),b,~),~,%r)]
      # %0 a step's place in the posted list: what is wrong with it.
      WEB`SAVE`STEP: |-
        setq(web_sn,json_query(%q<web_gn>,get,%0))[setq(web_sk,extract(%q<web_keys>,inc(%0),1))][setq(web_skind,extract(%q<web_kinds>,inc(%0),1))][if(not(cand(u(%!/FUN`IDOK,%q<web_sk>),not(strmatch(%q<web_sk>,improvise)))),A step's key is a letter then letters%, digits or _%, 24 at most: '[json_query(%q<web_sn>,extract,$.key)]'.~,if(not(member(v(DATA`KINDS),%q<web_skind>)),%q<web_sk> is not a challenge%, narration or end.~))][if(strmatch(%q<web_skind>,challenge),u(%!/WEB`SAVE`OPTIONS))][u(%!/WEB`SAVE`REWARDS)]
      # The options of the step in web_sn.
      WEB`SAVE`OPTIONS: |-
        setq(web_so,json_query(%q<web_sn>,extract,$.fields.options))[setq(web_son,if(strmatch(json_query(%q<web_so>,type),array),json_query(%q<web_so>,size),0))][setq(web_soids,iter(lnum(%q<web_son>),u(%!/WEB`OPTION`ID,%q<web_so>,%i0)))][if(neq(words(%q<web_soids>),words(setunion(%q<web_soids>,%q<web_soids>))),Two of %q<web_sk>'s ways to beat it have the same name.~)][iter(lnum(%q<web_son>),u(%!/WEB`SAVE`OPTION,json_query(%q<web_so>,get,%i0),extract(%q<web_soids>,inc(%i0),1)),%b,~)]
      # %0 an option, %1 its name: what is wrong with it.
      WEB`SAVE`OPTION: |-
        if(not(cand(u(%!/FUN`IDOK,%1),not(strmatch(%1,improvise)))),The name of a way to beat %q<web_sk> is a letter then letters%, digits or _%, 24 at most%, and not improvise: '%1'.~)[if(not(member(v(DATA`DIFFICULTIES),lcstr(json_query(%0,extract,$.difficulty)))),%q<web_sk>/%1 needs a difficulty.~)][if(cand(strlen(u(%!/FUN`PROVIDER)),not(member(u(%!/FUN`TRAITKEYS),lcstr(json_query(%0,extract,$.trait))))),%q<web_sk>/%1 needs a trait the sheet system has.~)][if(not(cand(u(%!/FUN`INTIN,firstof(json_query(%0,extract,$.successes),1),1,20),u(%!/FUN`INTIN,firstof(json_query(%0,extract,$.failures),1),1,20))),%q<web_sk>/%1 needs 1 to 20 successes and failures.~)]
      # %0 a step's options, %1 a place among them: the option's name, o<place> when it has none.
      WEB`OPTION`ID: |-
        firstof(lcstr(trim(json_query(%0,extract,$%[%1%].id))),o[inc(%1)])
      # The rewards of the step in web_sn.
      WEB`SAVE`REWARDS: |-
        setq(web_sr,json_query(%q<web_sn>,extract,$.fields.rewards))[iter(lnum(if(strmatch(json_query(%q<web_sr>,type),array),json_query(%q<web_sr>,size),0)),u(%!/WEB`SAVE`REWARD,json_query(%q<web_sr>,get,%i0)),%b,~)]
      WEB`SAVE`REWARD: |-
        if(not(member(u(%!/FUN`REWARDKINDS),lcstr(json_query(%0,extract,$.kind)))),A reward on %q<web_sk> is a kind the sheet system does not give.~)[if(not(match(once every,lcstr(firstof(json_query(%0,extract,$.repeat),once)))),A reward on %q<web_sk> is given once or every time.~)][if(not(cand(isint(setr(web_rs,firstof(json_query(%0,extract,$.success),0))),gte(%q<web_rs>,0),lte(%q<web_rs>,100))),A reward on %q<web_sk> needs a success of 0 to 100.~)]
      # %0 a link's place in the posted list: what is wrong with it.
      WEB`SAVE`LINK: |-
        setq(web_le,json_query(%q<web_ge>,get,%0))[setq(web_lf,lcstr(json_query(%q<web_le>,extract,$.from)))][setq(web_lt,lcstr(json_query(%q<web_le>,extract,$.to)))][setq(web_lp,lcstr(json_query(%q<web_le>,extract,$.port)))][if(not(cand(member(%q<web_keys>,%q<web_lf>),member(%q<web_keys>,%q<web_lt>))),A link joins a step that is not there.~,if(not(member(v(DATA`PORTS`[extract(%q<web_kinds>,match(%q<web_keys>,%q<web_lf>),1)]),%q<web_lp>)),%q<web_lf> cannot lead on by %q<web_lp>.~))][if(not(u(%!/WEB`SAVE`NUMBER,weight,1,100)),A link's weight is 1 to 100.~)][if(not(cand(u(%!/WEB`SAVE`NUMBER,min,0,20),u(%!/WEB`SAVE`NUMBER,max,0,20))),How many succeeded is 0 to 20.~)][if(not(u(%!/WEB`SAVE`NUMBER,share,0,100)),A share is 0 to 100.~)][if(cand(strlen(setr(web_lr,lcstr(json_query(%q<web_le>,extract,$.requires)))),not(u(%!/WEB`SAVE`HASOPTION,%q<web_lf>,%q<web_lr>))),A link from %q<web_lf> needs a way to beat it that is not there.~)]
      # Setting %0 of the link in web_le: 1 when it is missing or a whole number from %1 to %2.
      WEB`SAVE`NUMBER: |-
        cor(not(strlen(setr(web_ln,json_query(%q<web_le>,extract,$.%0)))),u(%!/FUN`INTIN,%q<web_ln>,%1,%2))
      # %0 a posted step's key, %1 an option's name: 1 when the step has it.
      WEB`SAVE`HASOPTION: |-
        setq(web_ho,json_query(json_query(%q<web_gn>,get,dec(match(%q<web_keys>,%0))),extract,$.fields.options))[t(member(iter(lnum(if(strmatch(json_query(%q<web_ho>,type),array),json_query(%q<web_ho>,size),0)),u(%!/WEB`OPTION`ID,%q<web_ho>,%i0)),%1))]

      # Writes the checked post into root: the duty's fields, then its steps and links afresh. A reviewer's
      # notes stay.
      INC`WEB`WRITE: |-
        &%q<root> {{store}}=%q<web_title>; &%q<root>`DESC {{store}}=%q<web_desc>; &%q<root>`REPEAT {{store}}=%q<web_repeat>; &%q<root>`MIN {{store}}=%q<web_min>; &%q<root>`MAX {{store}}=%q<web_max>; &%q<root>`START {{store}}=lcstr(json_query(%q<web_g>,extract,$.start)); @wipe {{store}}/%q<root>`START`*; think setqm(web_sx,json_query(%q<web_g>,extract,$.start_x),web_sy,json_query(%q<web_g>,extract,$.start_y)); @switch/inline cand(isnum(%q<web_sx>),isnum(%q<web_sy>))=1,{&%q<root>`START`X {{store}}=round(%q<web_sx>,0); &%q<root>`START`Y {{store}}=round(%q<web_sy>,0)}; @dolist/inline lattr({{store}}/%q<root>`N`*) lattr({{store}}/%q<root>`E`*)={@wipe {{store}}/##}; &%q<root>`EN {{store}}=%q<web_en>; &%q<root>`WN {{store}}=0; @dolist/inline lnum(%q<web_nn>)={think setq(web_i,##); @include %!/INC`WEB`WRITE`STEP}; @dolist/inline lnum(%q<web_en>)={think setq(web_i,##); @include %!/INC`WEB`WRITE`LINK}
      INC`WEB`WRITE`STEP: |-
        think setqm(web_n,json_query(%q<web_gn>,get,%q<web_i>),
        web_kind,extract(%q<web_kinds>,inc(%q<web_i>),1),
        web_p,%q<root>`N`[extract(%q<web_keys>,inc(%q<web_i>),1)]); &%q<web_p> {{store}}=%q<web_kind>; &%q<web_p>`LABEL {{store}}=json_query(%q<web_n>,extract,$.label); &%q<web_p>`X {{store}}=round(firstof(json_query(%q<web_n>,extract,$.x),0),0); &%q<web_p>`Y {{store}}=round(firstof(json_query(%q<web_n>,extract,$.y),0),0); &%q<web_p>`TEXT {{store}}=json_query(%q<web_n>,extract,$.fields.text); &%q<web_p>`SEEN {{store}}=json_query(%q<web_n>,extract,$.fields.seen); &%q<web_p>`COMBINE {{store}}=if(strmatch(%q<web_kind>,challenge),lcstr(firstof(json_query(%q<web_n>,extract,$.fields.combine),majority))); &%q<web_p>`RESULT {{store}}=if(strmatch(%q<web_kind>,end),lcstr(firstof(json_query(%q<web_n>,extract,$.fields.result),success))); @dolist/inline CRITSUCCESS SUCCESS PARTIAL FAIL CRITFAIL={&%q<web_p>`T`## {{store}}=if(strmatch(%q<web_kind>,challenge),json_query(%q<web_n>,extract,$.fields.[lcstr(##)]))}; think setqm(web_wo,if(strmatch(%q<web_kind>,challenge),json_query(%q<web_n>,extract,$.fields.options)),
        web_wr,json_query(%q<web_n>,extract,$.fields.rewards)); @dolist/inline lnum(if(strmatch(json_query(%q<web_wo>,type),array),json_query(%q<web_wo>,size),0))={think setq(web_j,##); @include %!/INC`WEB`WRITE`OPTION}; @dolist/inline lnum(if(strmatch(json_query(%q<web_wr>,type),array),json_query(%q<web_wr>,size),0))={think setq(web_j,##); @include %!/INC`WEB`WRITE`REWARD}
      INC`WEB`WRITE`OPTION: |-
        think setqm(web_o,json_query(%q<web_wo>,get,%q<web_j>),
        web_opath,%q<web_p>`O`[u(%!/WEB`OPTION`ID,%q<web_wo>,%q<web_j>)]); think setq(web_ot,lcstr(json_query(%q<web_o>,extract,$.trait))); &%q<web_opath> {{store}}=firstof(trim(json_query(%q<web_o>,extract,$.label)),u(%!/FUN`TRAITLABEL,%q<web_ot>),last(%q<web_opath>,`)); &%q<web_opath>`TRAIT {{store}}=%q<web_ot>; &%q<web_opath>`DIFF {{store}}=lcstr(json_query(%q<web_o>,extract,$.difficulty)); &%q<web_opath>`SUCC {{store}}=firstof(json_query(%q<web_o>,extract,$.successes),1); &%q<web_opath>`FAIL {{store}}=firstof(json_query(%q<web_o>,extract,$.failures),1); &%q<web_opath>`TRAINED {{store}}=t(match(true 1,json_query(%q<web_o>,extract,$.trained))); &%q<web_opath>`NOTE {{store}}=json_query(%q<web_o>,extract,$.note)
      INC`WEB`WRITE`REWARD: |-
        think setqm(web_r,json_query(%q<web_wr>,get,%q<web_j>),
        web_w,inc(firstof(get({{store}}/%q<root>`WN),0))); &%q<root>`WN {{store}}=%q<web_w>; &%q<web_p>`W`%q<web_w> {{store}}=lcstr(json_query(%q<web_r>,extract,$.kind)); &%q<web_p>`W`%q<web_w>`REPEAT {{store}}=lcstr(firstof(json_query(%q<web_r>,extract,$.repeat),once)); &%q<web_p>`W`%q<web_w>`SUCCESS {{store}}=if(gt(firstof(json_query(%q<web_r>,extract,$.success),0),0),json_query(%q<web_r>,extract,$.success)); &%q<web_p>`W`%q<web_w>`DETAILS {{store}}=json_mod(%q<web_r>,patch,json(object,kind,null,repeat,null,success,null))
      INC`WEB`WRITE`LINK: |-
        think setqm(web_l,json_query(%q<web_ge>,get,%q<web_i>),
        web_lp,%q<root>`E`[inc(%q<web_i>)]); &%q<web_lp> {{store}}=lcstr(json_query(%q<web_l>,extract,$.from)); &%q<web_lp>`PORT {{store}}=lcstr(json_query(%q<web_l>,extract,$.port)); &%q<web_lp>`TO {{store}}=lcstr(json_query(%q<web_l>,extract,$.to)); &%q<web_lp>`WEIGHT {{store}}=json_query(%q<web_l>,extract,$.weight); &%q<web_lp>`MIN {{store}}=json_query(%q<web_l>,extract,$.min); &%q<web_lp>`MAX {{store}}=json_query(%q<web_l>,extract,$.max); &%q<web_lp>`SHARE {{store}}=json_query(%q<web_l>,extract,$.share); &%q<web_lp>`REQ {{store}}=lcstr(json_query(%q<web_l>,extract,$.requires))

      # ---- Lifecycle --------------------------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP: |-
        @command/add/noparse/rsnoparse +duty; @hook/override/inline +duty=%!,CMD`DUTY; @command/add/noparse/rsnoparse +duties; @hook/override/inline +duties=%!,CMD`DUTIES
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP
      PALETTE`DUTY: |-
        {"label":"Duties","line":"+duty","always":true,"icon":"Explore","keywords":"duties adventures quests party"}

  # Everything duties keep, inside the Duties object so no player can reach it, and no_command so
  # nothing kept here is ever matched as a command.
  #
  # DUTY`<ID> a duty: AUTHOR, LIVE (the approved revision), DRAFT (the one being edited), STATE (editing,
  # submitted or returned), NOTE, RETIRED, NEXT. Each revision DUTY`<ID>`R<n> holds the title, with DESC,
  # START (with X and Y, where the editor draws it), REPEAT, MIN, MAX, steps N`<KEY> (the kind, with LABEL TEXT SEEN COMBINE RESULT, T`<TIER>
  # outcome texts, options O`<OPT> and rewards W`<n>, with REPEAT DETAILS SUCCESS), links E`<n> (the step it leaves, with PORT TO
  # WEIGHT MIN MAX SHARE REQ), and reviewers' notes REMARK`<KEY>.
  # ROSTER`<ID> the active roster. RUN`<n> a party. Per character key: INRUN, SEEN, GOT, DONE.
  - ref: store
    type: thing
    name: Duty Store
    location: "{{duties}}"
    flags: [no_command]
    attributes:
      DUTY: |-
        Every duty, one branch each.
      ROSTER: |-
        The active roster: ROSTER`<ID> is 1 while the duty is on it.
      RUN: |-
        The parties on a duty, one branch each.
      NEXTRUN: |-
        0

  # Routes on the HTTP handler, as children of http-handler's GET and POST verbs. The duties-app package
  # reads /http/duties/schema and /http/duties/data with ?at= set to the address after /apps/duties/, and
  # posts to /http/duties/act, /check and /note. %<viewer> is the character the portal signed in as. The
  # handler must be WIZARD (the seeded one is) to @force the Duties object, which does the work so its
  # "Set." lines never land in the response. Each POST puts %<body> in %q<body>: a forced command's
  # arguments lose a value's outer braces.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`DUTIES`SCHEMA: |-
        @respond/type application/json; think uargs({{duties}}/WEB`SCHEMA,viewer,%<viewer>,at,%q<form.at>)
      GET`DUTIES`DATA: |-
        @respond/type application/json; think uargs({{duties}}/WEB`DATA,viewer,%<viewer>,at,%q<form.at>)
      POST`DUTIES`ACT: |-
        think setq(body,%<body>); @force {{duties}}=@include/args/nobreak {{duties}}/WEB`ACT=viewer,%<viewer>; @respond/type application/json; think %q<web_response>
      POST`DUTIES`CHECK: |-
        think setq(body,%<body>); @force {{duties}}=@include/args/nobreak {{duties}}/WEB`ACT=viewer,%<viewer>,op,check; @respond/type application/json; think %q<web_response>
      POST`DUTIES`NOTE: |-
        think setq(body,%<body>); @force {{duties}}=@include/args/nobreak {{duties}}/WEB`ACT=viewer,%<viewer>,op,note; @respond/type application/json; think %q<web_response>

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: duties_help
    type: thing
    name: Duties Help
    location: "{{duties}}"
    attributes:
      HELP: |-
        Duties: short adventures a party plays through together.
      HELP`DUTY: |-
        A **duty** is a short adventure for a party. The party goes from challenge to challenge: at each one
        everyone rolls, and how the party did picks the way on. A duty can hand out rewards on the way and at
        its end.

        - `+duty/list`, or `+duties`, lists the duties you can start and the parties gathering.
        - `+duty` shows your party's duty, or the list when you are not on one.
        - `+duty <duty>` shows one duty: what it is about, the party it wants, and your progress: the rewards
          you have received, the challenges you have seen and how much of it you have explored.
        - `+duty/start <duty>` gathers a party. Others join with `+duty/join <number>`.
        - `+duty/info <duty>` shows what you have learned from it.

        **Explored** is the share of its steps you have been to, on any run.

        Example:

        `+duties`

        Output: a box titled `Duties` with a row per duty you can start, such as
        `harbor | The Harbor Fire | 1-4 | 0 of 2 | 1 of 5 | 25%`.
      HELP`DUTY`PLAYING: |-
        Once the party is gathered, its leader sets out with `+duty/go`.

        - At a challenge everyone rolls once each round with `+duty/try <option>`. `+duty` lists the options:
          the trait each rolls, its difficulty and how many successes it still needs.
        - `+duty/try improvise` is always there, so everyone can roll something. It is one step harder than
          the hardest option.
        - An option that needs more successes than one round gave is rolled again: everyone rolls another round.
        - Then the challenge has its outcome, and the party goes on. Steps nobody in the party has seen are
          favoured.
        - At a narration, the leader goes on with `+duty/go`.
        - `+duty/leave` leaves the party. The leader can roll for someone with `+duty/force <name>`, send
          someone away with `+duty/kick <name>`, or give up with `+duty/abandon`.

        There is no time limit. When the leader leaves, the longest-standing member leads.

        Example:

        ```
        > +duty/try climb
        \[DUTY\] Ana tries Climb the wall with Athletics at hard: 17 vs 15 Success
        ```

        Output: a line to the whole party for each roll.
      HELP`DUTY`WRITING: |-
        Every player can write a duty. It stays a draft until you submit it, and a duty reviewer approves it.

        - `+duty/create <id>=<title>` starts one. The id is a letter then letters, digits or `_`.
        - `+duty/set <duty>/<field>=<value>` sets `title`, `description`, `start`, `repeat` \(once or every\),
          `min` and `max` \(the party's size\).
        - `+duty/node <duty>/<step>=<kind>` adds a step: a `challenge`, a `narration` or an `end`. The first
          step is where it starts.
        - `+duty/steps <duty>` shows every step, option, link and reward. `+duty/check <duty>` says what is
          missing.
        - `+duty/submit <duty>` sends it for review. `+duty/withdraw <duty>` takes it back.
        - `+duty/mine` lists your duties. `+duty/delete <duty>` deletes one never approved.

        Changing an approved duty makes a new draft beside it. Players keep playing the approved one until the
        new draft is approved. `+duty/discard <duty>` drops the draft.

        See `+help duty steps`, `+help duty links` and `+help duty rewards`.
      HELP`DUTY`STEPS: |-
        A step's fields are set with `+duty/set <duty>/<step>/<field>=<value>`:

        - `label`: its name in the box title. `text`: what the party reads. `seen`: what someone who has been
          there before reads instead.
        - On a challenge: `combine`, how the members' results make the party's: `majority` \(the default\),
          `best` or `worst`; and an outcome text per result: `crit-success`, `success`, `partial`, `fail` and
          `crit-fail`.
        - On an end: `result`, `success` or `fail`. Reaching a successful end finishes the duty.

        A challenge's options are added with `+duty/option <duty>/<step>/<option>=<trait> <difficulty>
        \[<successes> \[<failures>\]\] \[trained\]`. The difficulty is trivial, easy, standard, hard or extreme.
        An option succeeds after that many successes and is lost after that many failures; both are 1 when not
        given. `trained` lets only those trained in the trait roll it. Every challenge needs an option anyone
        can roll: an untrained one on a trait the sheet system lets everyone use. `+duty/unoption` removes one.

        Example:

        ```
        > +duty/option harbor/wall/climb=athletics hard 2
        \[DUTY\] Done: wall/climb rolls athletics at hard.
        ```

        Output: one line naming the trait and difficulty.
      HELP`DUTY`LINKS: |-
        A link leads from one step to another: `+duty/link <duty>/<from>/<port>=<to> \[<settings>\]`.

        - A challenge leaves by `success` or `fail`, and by `crit-success`, `partial` or `crit-fail` when it
          has links there; without them those go by success or fail.
        - A narration leaves by `continue`. An end leads nowhere.
        - Settings: `weight=<n>` \(1 to 100\), `min=<n>` and `max=<n>` \(how many members succeeded\),
          `share=<percent>` \(of the party\), and `requires=<option>` \(an option that must have succeeded\).
          A link is used only when all of them hold.
        - Several links on one port are a choice: the steps the fewest members have seen first, then by weight.
          One link is a fixed way.
        - A challenge needs a link on success and one on fail with no settings, so there is always a way on.
        - `+duty/unlink <duty>/<number>` removes one. `+duty/steps` numbers them.

        Example:

        `+duty/link harbor/wall/success=roof min=2`

        Output: `\[DUTY\] Done: Link 3: wall on success leads to roof.`
      HELP`DUTY`REWARDS: |-
        Any step can hand out rewards: `+duty/reward <duty>/<step>=<kind> \[once|every\] <details>`.

        - `info` is something learned: the details are its text, and `+duty/info` shows it again later.
        - The sheet system adds its own kinds, such as coin or items. The details are a JSON object of its
          fields, or the value of its first field.
        - `once` gives it to each character only the first time; `every` each time. `once` when not given.
        - `success=<percent>` gives it only when the party has succeeded at that share of the duty's
          challenges so far: `success=75` needs three of four. A duty with no challenges counts as 100.
          The notice at the end says how many the party succeeded at.
        - A challenge gives its rewards to the members who succeeded. A narration or an end gives them to
          everyone there.
        - `+duty/unreward <duty>/<step>/<number>` removes one.

        Example:

        `+duty/reward harbor/end=info every The fire was set on purpose.`

        Output: `\[DUTY\] Done: Reward 1 on end: info, every.`

        `+duty/reward harbor/end=info once success=75 The harbourmaster paid them.`

        Output: `\[DUTY\] Done: Reward 2 on end: info, once, at 75% success or more.`
      LOCK`DUTY`REVIEW: |-
        perm^softcode.duties.review
      HELP`DUTY`REVIEW: |-
        Duty reviewers approve the duties players write.

        - `+duty/review` lists the duties waiting. `+duty/review <duty>` shows one with every step.
        - `+duty/approve <duty>` approves it. `+duty/return <duty>=<note>` sends it back with a note.
        - `+duty/note <duty>/<step>=<note>` leaves a note on one step for the author.
        - `+duty/retire <duty>` takes an approved duty out of use; `+duty/restore <duty>` brings it back.
        - `+duty/end <number>` ends any party's duty.

        Approving a duty does not put it on the active roster: see `+help duty roster`.
      LOCK`DUTY`ROSTER: |-
        perm^softcode.duties.review
      HELP`DUTY`ROSTER: |-
        Players can start an approved duty only while it is on the **active roster**.

        - `+duty/roster` lists the approved duties, whether each is on the roster, and its window.
        - `+duty/roster <duty>=on` puts one on; `=off` takes it off.
        - `+duty/window <duty>=<from>,<to>` limits it to those days, YYYY-MM-DD. `+duty/window
          <duty>=<from>,<to>,yearly` makes them days of every year, MM-DD, and a window may wrap the new year.
          Either day may be empty. `+duty/window <duty>=` clears it.

        Example:

        `+duty/window frost=12-01,01-06,yearly`

        Output: `\[DUTY\] Done: From 12-01 to 01-06 every year`
      LOCK`DUTY`SYSTEMS: |-
        perm^packages.admin
      HELP`DUTY`SYSTEMS: |-
        Duties roll with a **sheet system**, installed as a bridge package such as `duties-d20` or
        `duties-fate`. Without one, duties can be written but not checked or played. With several,
        `+config duties/system` picks one by name.

        A bridge attaches `` PROVIDER`<NAME> `` to the Duties object, holding its system's object. That object
        answers:

        - `` FN`DUTIES`TRAITS ``: a JSON array of `{"key","label","group","always"}`. `always` marks traits
          everyone can roll.
        - `` FN`DUTIES`CHECK ``: one roll, given `%%<roller>`, `%%<trait>`, `%%<difficulty>`, `%%<mods>` and
          `%%<context>`. It returns `{"tier","text"}`, the tier one of crit-fail, fail, partial, success or
          crit-success.
        - `` FN`DUTIES`REWARDS ``: a JSON array of `{"kind","label","fields":\[{"key","type"}\]}`.
        - `` ON`DUTIES`GRANT ``: triggered with `%%<roller>`, `%%<reward>` \(JSON with `kind`, `repeat` and
          the fields\) and `%%<context>`.
        - Optional: `` FN`DUTIES`TRAINED `` and `` FN`DUTIES`CAN `` \(1 or 0 for `%%<roller>` and `%%<trait>`\),
          and `` FN`DUTIES`FALLBACK `` \(the trait Improvise rolls\).

        Other bridges add to `+duty` through `` EXTENSION`<NAME> `` on the same object; see
        `+help duty extensions`.
      HELP`DUTY`EXTENSIONS: |-
        A bridge package adds to `+duty` by attaching `` EXTENSION`<NAME> `` to the Duties object, holding its
        own object. Duties triggers these on it, each given its values by name:

        - `` DO`<SWITCH> ``: a switch Duties does not have, with `%%<player>`, `%%<arg>` and `%%<run>` \(the
          player's party, or nothing\).
        - `` FLAG`<SWITCH>`<OPTION> ``: `+duty/<switch>/<option>`, once the switch has done its work, with the
          same values.
        - `` ON`DUTIES`JOIN ``: a member joined a party, with `%%<run>` and `%%<member>`.
        - `` ON`DUTIES`LINE ``: something happened to a party, with `%%<run>` and `%%<text>`, one line of
          prose: setting out, each step's text, each roll and each outcome.
        - `` ON`DUTIES`FINISH ``: the party's run is over, with `%%<run>` and `%%<why>`.

        `duties-scene` is one: `+duty/start/scene` and `+duty/scene` tie a party to a scene.

        Example:

        `+duty/start/scene harbor`

        Output: the party is gathered and a scene is made for it.

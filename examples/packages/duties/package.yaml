        think setq(node,%q<next>)[setq(kind,get({{store}}/%q<root>`N`%q<next>))]; &RUN`%q<run>`NODE {{store}}=%q<node>; &RUN`%q<run>`FRESH {{store}}=squish(iter(%q<mem>,if(hasattr({{store}},SEEN`[u(%!/FUN`KEY,%i0)]`%q<id>`%q<node>),,%i0))); &RUN`%q<run>`ROUND {{store}}=1; @wipe {{store}}/RUN`%q<run>`ROLL; @wipe {{store}}/RUN`%q<run>`LAST; @wipe {{store}}/RUN`%q<run>`OK; @wipe {{store}}/RUN`%q<run>`BAD; @dolist/inline %q<mem>={&SEEN`[u(%!/FUN`KEY,%i0)]`%q<id>`%q<node> {{store}}=secs()}; @dolist/inline %q<mem>={@pemit %i0=u(%!/FUN`SCREEN`RUN,%q<run>,%i0)}; @include/args %!/INC`RUN`EVENT=event,LINE,text,[u(%!/FUN`LINE`STEP,%q<root>,%q<node>)]; @break strmatch(%q<kind>,challenge); think setqm(gnode,%q<node>,
        gwho,%q<mem>); @include/nobreak %!/INC`RUN`GRANT; @assert strmatch(%q<kind>,end); @assert strmatch(get({{store}}/%q<root>`N`%q<node>`RESULT),success)={@include/args %!/INC`RUN`FINISH=why,The duty is over. It ends in failure.[u(%!/FUN`TALLY,%q<run>)]}; @dolist/inline %q<mem>={&DONE`[u(%!/FUN`KEY,%i0)]`%q<id> {{store}}=secs()}; @include/args %!/INC`RUN`FINISH=why,The duty is over. It ends in success.[u(%!/FUN`TALLY,%q<run>)]
      # %<roller> rolls %<opt> at the current challenge.
      INC`RUN`ROLL: |-
        think setq(rk,u(%!/FUN`KEY,%<roller>))[setq(ctx,json(object,duty,json(string,%q<id>),run,%q<run>,node,json(string,%q<node>),option,json(string,%<opt>),round,get({{store}}/RUN`%q<run>`ROUND)))][setq(rtrait,if(strmatch(%<opt>,improvise),u(%!/FUN`IMPROVTRAIT,%<roller>,%q<ctx>),get({{store}}/%q<root>`N`%q<node>`O`%<opt>`TRAIT)))][setq(rdiff,if(strmatch(%<opt>,improvise),u(%!/FUN`IMPROVDIFF,%q<root>,%q<node>),get({{store}}/%q<root>`N`%q<node>`O`%<opt>`DIFF)))][setq(rres,uargs(%q<prov>/FN`DUTIES`CHECK,roller,%<roller>,trait,%q<rtrait>,difficulty,%q<rdiff>,mods,json(object,helpers,json(array),invokes,0),context,%q<ctx>))][setq(rtier,u(%!/FUN`TIER,json_query(%q<rres>,extract,$.tier)))][setq(rgood,u(%!/FUN`GOOD,%q<rtier>))]; &RUN`%q<run>`ROLL`%q<rk> {{store}}=%<opt>; &RUN`%q<run>`LAST`%q<rk> {{store}}=%<opt>; &RUN`%q<run>`LAST`%q<rk>`TIER {{store}}=%q<rtier>; &RUN`%q<run>`OK`%<opt> {{store}}=add(firstof(get({{store}}/RUN`%q<run>`OK`%<opt>),0),%q<rgood>); &RUN`%q<run>`BAD`%<opt> {{store}}=add(firstof(get({{store}}/RUN`%q<run>`BAD`%<opt>),0),not(%q<rgood>)); @pemit/list %q<mem>=notice(DUTY,name(%<roller>) tries [if(strmatch(%<opt>,improvise),Improvise,get({{store}}/%q<root>`N`%q<node>`O`%<opt>))] with [u(%!/FUN`TRAITLABEL,%q<rtrait>)] at %q<rdiff>: [json_query(%q<rres>,extract,$.text)] [badge(u(%!/FUN`TIERLABEL,%q<rtier>),if(%q<rgood>,ok,warn))],info); @include/args %!/INC`RUN`EVENT=event,LINE,text,[name(%<roller>)] tries [if(strmatch(%<opt>,improvise),Improvise,get({{store}}/%q<root>`N`%q<node>`O`%<opt>))] with [u(%!/FUN`TRAITLABEL,%q<rtrait>)] at %q<rdiff>: [json_query(%q<rres>,extract,$.text)] %([u(%!/FUN`TIERLABEL,%q<rtier>)]%)
      # When everyone has rolled: another round while an option rolled this round is still open, else the

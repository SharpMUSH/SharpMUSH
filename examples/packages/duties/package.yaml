      INC`DO`SUBMIT: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED; @assert u(%!/FUN`CANEDIT,%q<do_viewer>,%q<id>)=think setqm(do_msg,Permission denied. Only its author or a duty reviewer may submit %q<id>.,do_tone,error); @assert member(editing returned,get({{store}}/DUTY`%q<id>`STATE))=think setq(do_msg,%q<id> has no changes to submit.); think setq(do_prob,u(%!/FUN`PROBLEMS,%q<id>,u(%!/FUN`ROOT,%q<id>))); @assert not(strlen(%q<do_prob>))=think setq(do_msg,%q<id> needs work:); &DUTY`%q<id>`STATE {{store}}=submitted; &DUTY`%q<id>`SUBMITTED {{store}}=secs(); think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is waiting for a duty reviewer.)
      INC`DO`WITHDRAW: |-
        @include %!/INC`DO`BEGIN; @include %!/INC`DO`NEED; @assert u(%!/FUN`CANEDIT,%q<do_viewer>,%q<id>)=think setqm(do_msg,Permission denied. Only its author or a duty reviewer may withdraw %q<id>.,do_tone,error); @assert strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)=think setq(do_msg,%q<id> is not waiting for review.); &DUTY`%q<id>`STATE {{store}}=editing; think setqm(do_ok,1,do_tone,ok,do_msg,%q<id> is back with you to change.)

        @assert eq(%q<pn>,2)=@pemit %#=notice(DUTY,+duty/unnode <duty>/<step>,warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; @wipe {{store}}/%q<root>`N`%q<key>; @dolist/inline u(%!/FUN`EDGES,%q<root>)={@include/nobreak/args %!/INC`DO`UNLINKIF=edge,%i0}; @pemit %#=notice(DUTY,%q<key> is gone%, with the links to and from it.,ok); @assert not(strmatch(get({{store}}/%q<root>`START),%q<key>))={&%q<root>`START {{store}}}
      INC`DO`UNLINKIF: |-
        @assert member(get({{store}}/%q<root>`E`%<edge>) get({{store}}/%q<root>`E`%<edge>`TO),%q<key>); @wipe {{store}}/%q<root>`E`%<edge>
      DO`OPTION: |-
        @assert cand(%q<eq>,eq(%q<pn>,3))=@pemit %#=notice(DUTY,+duty/option <duty>/<step>/<option>=<trait> <difficulty> %[<successes> %[<failures>%]%] %[trained%],warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; @assert strmatch(%q<kind>,challenge)=@pemit %#=notice(DUTY,Only a challenge has options.,warn); think setq(opt,%q<p3>)[setq(ow,lcstr(%q<rhs>))][setq(otr,first(%q<ow>))][setq(odf,extract(%q<ow>,2,1))][setq(orest,rest(rest(%q<ow>)))][setq(onums,squish(iter(%q<orest>,if(isint(%i0),%i0))))][setq(oodd,squish(iter(%q<orest>,if(cor(isint(%i0),strmatch(%i0,trained)),,%i0))))][setq(osu,firstof(first(%q<onums>),1))][setq(ofa,firstof(extract(%q<onums>,2,1),1))][setq(prov,u(%!/FUN`PROVIDER))]; @assert cand(u(%!/FUN`IDOK,%q<opt>),not(strmatch(%q<opt>,improvise)))=@pemit %#=notice(DUTY,An option's name is a letter then letters%, digits or _%, 24 at most%, and not improvise.,warn); @assert member(v(DATA`DIFFICULTIES),%q<odf>)=@pemit %#=notice(DUTY,A difficulty is [itemize(v(DATA`DIFFICULTIES),,or)].,warn); @assert cor(not(strlen(%q<prov>)),member(u(%!/FUN`TRAITKEYS),%q<otr>))=@pemit %#=notice(DUTY,The sheet system has no trait called %q<otr>. It has [itemize(u(%!/FUN`TRAITKEYS))].,warn); @assert cand(not(strlen(%q<oodd>)),lte(words(%q<onums>),2),gte(%q<osu>,1),lte(%q<osu>,20),gte(%q<ofa>,1),lte(%q<ofa>,20))=@pemit %#=notice(DUTY,After the difficulty come the successes needed and the failures allowed%, 1 to 20 each%, and trained.,warn); &%q<root>`N`%q<key>`O`%q<opt> {{store}}=firstof(get({{store}}/%q<root>`N`%q<key>`O`%q<opt>),u(%!/FUN`TRAITLABEL,%q<otr>)); &%q<root>`N`%q<key>`O`%q<opt>`TRAIT {{store}}=%q<otr>; &%q<root>`N`%q<key>`O`%q<opt>`DIFF {{store}}=%q<odf>; &%q<root>`N`%q<key>`O`%q<opt>`SUCC {{store}}=%q<osu>; &%q<root>`N`%q<key>`O`%q<opt>`FAIL {{store}}=%q<ofa>; &%q<root>`N`%q<key>`O`%q<opt>`TRAINED {{store}}=t(member(%q<ow>,trained)); @pemit %#=notice(DUTY,%q<key>/%q<opt> rolls %q<otr> at %q<odf>.,ok)
      DO`UNOPTION: |-
        @assert eq(%q<pn>,3)=@pemit %#=notice(DUTY,+duty/unoption <duty>/<step>/<option>,warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; @assert u(%!/FUN`HASOPT,%q<root>,%q<key>,%q<p3>)=@pemit %#=notice(DUTY,%q<key> has no option called %q<p3>.,warn); @wipe {{store}}/%q<root>`N`%q<key>`O`%q<p3>; @pemit %#=notice(DUTY,%q<key>/%q<p3> is gone.,ok)
      DO`LINK: |-
        @assert cand(%q<eq>,eq(%q<pn>,3))=@pemit %#=notice(DUTY,+duty/link <duty>/<from>/<port>=<to> %[weight=<n>%] %[min=<n>%] %[max=<n>%] %[share=<percent>%] %[requires=<option>%],warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; think setq(lport,%q<p3>)[setq(lw,lcstr(%q<rhs>))][setq(lto,first(%q<lw>))][setq(lbad,squish(iter(rest(%q<lw>),if(u(%!/FUN`LINKOK,%i0,%q<root>,%q<key>),,%i0))))]; @assert member(v(DATA`PORTS`%q<kind>),%q<lport>)=@pemit %#=notice(DUTY,if(words(v(DATA`PORTS`%q<kind>)),A %q<kind> leads on by [itemize(v(DATA`PORTS`%q<kind>),,or)].,An end leads nowhere.),warn); @assert u(%!/FUN`HASNODE,%q<root>,%q<lto>)=@pemit %#=notice(DUTY,%q<id> has no step called %q<lto>.,warn); @assert not(words(%q<lbad>))=@pemit %#=notice(DUTY,Not understood: %q<lbad>. weight is 1 to 100%, min and max 0 to 20%, share 0 to 100%, requires one of %q<key>'s options.,warn); think setq(edge,add(firstof(get({{store}}/%q<root>`EN),0),1)); &%q<root>`EN {{store}}=%q<edge>; &%q<root>`E`%q<edge> {{store}}=%q<key>; &%q<root>`E`%q<edge>`PORT {{store}}=%q<lport>; &%q<root>`E`%q<edge>`TO {{store}}=%q<lto>; @dolist/inline rest(%q<lw>)={&%q<root>`E`%q<edge>`[v(DATA`LINK`[ucstr(before(%i0,=))])] {{store}}=after(%i0,=)}; @pemit %#=notice(DUTY,Link %q<edge>: %q<key> on %q<lport> leads to %q<lto>.,ok)
      DO`UNLINK: |-
        @assert eq(%q<pn>,2)=@pemit %#=notice(DUTY,+duty/unlink <duty>/<link number>,warn); @include %!/INC`NEED`EDIT; @assert cand(isint(%q<p2>),hasattr({{store}},%q<root>`E`%q<p2>))=@pemit %#=notice(DUTY,%q<id> has no link %q<p2>. +duty/show %q<id> numbers them.,warn); @wipe {{store}}/%q<root>`E`%q<p2>; @pemit %#=notice(DUTY,Link %q<p2> is gone.,ok)
      # +duty/reward <duty>/<step>=<kind> [once|every] <details>. Details are text for info; for a sheet
      # system's kind, a JSON object of its fields or the value of its first field.
      DO`REWARD: |-
        @assert cand(%q<eq>,eq(%q<pn>,2))=@pemit %#=notice(DUTY,+duty/reward <duty>/<step>=<kind> %[once|every%] %[success=<percent>%] <details>,warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; think setq(rkind,lcstr(first(%q<rhs>)))[setq(rrep,if(member(once every,lcstr(extract(%q<rhs>,2,1))),lcstr(extract(%q<rhs>,2,1))))][setq(rtext,trim(if(strlen(%q<rrep>),rest(rest(%q<rhs>)),rest(%q<rhs>))))][setq(rsucc,if(strmatch(first(%q<rtext>),success=*),after(first(%q<rtext>),=)))][if(strmatch(first(%q<rtext>),success=*),setq(rtext,rest(%q<rtext>)))][setq(prov,u(%!/FUN`PROVIDER))]; @assert member(u(%!/FUN`REWARDKINDS),%q<rkind>)=@pemit %#=notice(DUTY,A reward is [itemize(u(%!/FUN`REWARDKINDS),,or)].,warn); @assert cor(not(strlen(%q<rsucc>)),cand(isint(%q<rsucc>),gte(%q<rsucc>,0),lte(%q<rsucc>,100)))=@pemit %#=notice(DUTY,success is 0 to 100: the share of the duty's challenges the party must have succeeded at.,warn); @assert strlen(%q<rtext>)=@pemit %#=notice(DUTY,Say what the reward is after its kind.,warn); think setq(rjson,u(%!/FUN`REWARDJSON,%q<rkind>,%q<rtext>)); @assert strlen(%q<rjson>)=@pemit %#=notice(DUTY,A %q<rkind> reward takes a JSON object of its fields.,warn); think setq(rrow,add(firstof(get({{store}}/%q<root>`WN),0),1)); &%q<root>`WN {{store}}=%q<rrow>; &%q<root>`N`%q<key>`W`%q<rrow> {{store}}=%q<rkind>; &%q<root>`N`%q<key>`W`%q<rrow>`REPEAT {{store}}=firstof(%q<rrep>,once); &%q<root>`N`%q<key>`W`%q<rrow>`DETAILS {{store}}=%q<rjson>; &%q<root>`N`%q<key>`W`%q<rrow>`SUCCESS {{store}}=if(gt(%q<rsucc>,0),%q<rsucc>); @pemit %#=notice(DUTY,Reward %q<rrow> on %q<key>: %q<rkind>%, [firstof(%q<rrep>,once)][if(gt(%q<rsucc>,0),%, at %q<rsucc>%% success or more)].,ok)
      DO`UNREWARD: |-
        @assert eq(%q<pn>,3)=@pemit %#=notice(DUTY,+duty/unreward <duty>/<step>/<reward number>,warn); @include %!/INC`NEED`EDIT; @include %!/INC`NEED`NODE; @assert cand(isint(%q<p3>),hasattr({{store}},%q<root>`N`%q<key>`W`%q<p3>))=@pemit %#=notice(DUTY,%q<key> has no reward %q<p3>.,warn); @wipe {{store}}/%q<root>`N`%q<key>`W`%q<p3>; @pemit %#=notice(DUTY,Reward %q<p3> is gone.,ok)
      # The steps, options, links and rewards, for the author and reviewers.

      # ---- The lifecycle, shared by +duty and the portal ------------------------------------------
      # Each INC`DO`<VERB> reads do_viewer (an objid), do_id and, where it needs them, do_key and do_text,
      # all from registers so nothing a player wrote is ever part of a command. It writes nothing unless it
      # succeeds, and leaves do_ok (1 when it did), do_msg, do_tone and do_prob (problems, a line each). The
      # caller includes it with /nobreak and says the outcome: INC`DO`TELL in the game, WEB`RESULT` on the web.
      INC`DO`BEGIN: |-

format: "1.16"
package: duties
title: "Duties"
version: 1.0.0
authors: [SharpMUSH]
description: "Duties: short adventures a party plays through with +duty, from challenge to challenge. Everyone rolls at each challenge, the outcome picks the way on, and the steps nobody in the party has seen are favoured. Players write duties and submit them, a duty reviewer approves them, and staff choose which approved duties are on the active roster and when. The rolls come from a sheet system's bridge, such as duties-d20 or duties-fate."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [duties, adventures, quests, challenges, rolls]
category: Roleplay
requires_server: ">=0.1"

# One permission, for the people who approve duties and return them with notes. A game hands it out with
# the role below (@role/assign <player>=duty-reviewer) or to one player (@permission/allow
# <player>=softcode.duties.review). Every player may write and submit duties.
categories:
  roles:
    - name: Duties
      description: Roles for the people who review duties.
  permissions:
    - name: Duties
      description: Reviewing duties and choosing the active roster.
permissions:
  - name: softcode.duties.review
    category: Duties
    description: Approve submitted duties or return them with notes, retire them, put them on the active roster and end any party's run.
roles:
  - slug: duty-reviewer
    name: Duty Reviewer
    category: Duties
    priority: 10
    permissions:
      softcode.duties.review: allow

objects:
  # The command object, in the master room. WIZARD because it triggers the sheet system's grant on the
  # system's own object and tells party members wherever they are.
  #
  # +duty is added with /noparse/rsnoparse and hooked to CMD`DUTY, so what a player types reaches the code
  # exactly as typed and nothing a player wrote is ever evaluated: player text is only ever read with get().
  #
  # A sheet system's bridge attaches PROVIDER`<NAME> here, holding its object. +config duties/system picks
  # one when several are installed. Without one, duties can be written but not checked or played.
  #
  # Trees: CMD`DUTY the command, DO`<SWITCH> one routine per switch, INC`NEED` the guards they share,
  # INC` the writes and the runner, FUN` the reads, FUN`SCREEN` the screens. DATA`CONFIG` the settings.
  - ref: duties
    type: thing
    name: Duties
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- Settings: +config duties ------------------------------------------------
      DATA`CONFIG:
        value: |-
          The sheet system duties roll with, their limits, and the active roster.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Duties
      DATA`CONFIG`SYSTEM: |-

      DATA`CONFIG`SYSTEM`TYPE: |-
        text
      DATA`CONFIG`SYSTEM`DEFAULT: |-

      DATA`CONFIG`SYSTEM`MAX: |-
        30
      DATA`CONFIG`SYSTEM`LABEL: |-
        Sheet system
      DATA`CONFIG`SYSTEM`DESCRIPTION: |-
        Which installed sheet system duties roll with, by name, such as d20. Empty uses the only one installed.
      DATA`CONFIG`SYSTEM`EXAMPLE: |-
        d20
      DATA`CONFIG`MAXNODES: |-
        60
      DATA`CONFIG`MAXNODES`TYPE: |-
        integer
      DATA`CONFIG`MAXNODES`DEFAULT: |-
        60
      DATA`CONFIG`MAXNODES`MIN: |-
        2
      DATA`CONFIG`MAXNODES`MAX: |-
        500
      DATA`CONFIG`MAXNODES`LABEL: |-
        Steps per duty
      DATA`CONFIG`MAXNODES`DESCRIPTION: |-
        The most steps one duty may have.
      DATA`CONFIG`MAXNODES`EXAMPLE: |-
        80
      DATA`CONFIG`MAXPARTY: |-
        6
      DATA`CONFIG`MAXPARTY`TYPE: |-
        integer
      DATA`CONFIG`MAXPARTY`DEFAULT: |-
        6
      DATA`CONFIG`MAXPARTY`MIN: |-
        1
      DATA`CONFIG`MAXPARTY`MAX: |-
        20
      DATA`CONFIG`MAXPARTY`LABEL: |-
        Largest party
      DATA`CONFIG`MAXPARTY`DESCRIPTION: |-
        The most characters one party may have. A duty asks for its own size within this.
      DATA`CONFIG`MAXPARTY`EXAMPLE: |-
        4
      # The active roster, a +config table: ROSTER`<ID> on the store, 1 while the approved duty is on it,
      # with FROM and TO for a window and YEARLY when the window comes back every year.
      DATA`CONFIG`ROSTER`TYPE: |-
        table
      DATA`CONFIG`ROSTER`LABEL: |-
        Active roster
      DATA`CONFIG`ROSTER`DESCRIPTION: |-
        Which approved duties players can start, and when. +duty/roster and +duty/window change it too.
      DATA`CONFIG`ROSTER`STORE: |-
        {{store}}
      DATA`CONFIG`ROSTER`PATH: |-
        ROSTER
      DATA`CONFIG`ROSTER`ENTRY: |-
        on
      DATA`CONFIG`ROSTER`FIELDS: |-
        on from to yearly
      DATA`CONFIG`ROSTER`KEYPATTERN: |-
        ^[a-z][a-z0-9_]*$
      DATA`CONFIG`ROSTER`FIELD`ON`TYPE: |-
        boolean
      DATA`CONFIG`ROSTER`FIELD`ON`DEFAULT: |-
        1
      DATA`CONFIG`ROSTER`FIELD`ON`LABEL: |-
        On the roster
      DATA`CONFIG`ROSTER`FIELD`ON`DESCRIPTION: |-
        Whether players can start it, inside its window.
      DATA`CONFIG`ROSTER`FIELD`ON`EXAMPLE: |-
        yes
      DATA`CONFIG`ROSTER`FIELD`FROM`TYPE: |-
        text
      DATA`CONFIG`ROSTER`FIELD`FROM`DEFAULT: |-

      DATA`CONFIG`ROSTER`FIELD`FROM`MAX: |-
        10
      DATA`CONFIG`ROSTER`FIELD`FROM`LABEL: |-
        From
      DATA`CONFIG`ROSTER`FIELD`FROM`DESCRIPTION: |-
        The first day it can be started: YYYY-MM-DD, or MM-DD when yearly. Empty for no start.
      DATA`CONFIG`ROSTER`FIELD`FROM`EXAMPLE: |-
        12-01
      DATA`CONFIG`ROSTER`FIELD`TO`TYPE: |-
        text
      DATA`CONFIG`ROSTER`FIELD`TO`DEFAULT: |-

      DATA`CONFIG`ROSTER`FIELD`TO`MAX: |-
        10
      DATA`CONFIG`ROSTER`FIELD`TO`LABEL: |-
        To
      DATA`CONFIG`ROSTER`FIELD`TO`DESCRIPTION: |-
        The last day it can be started: YYYY-MM-DD, or MM-DD when yearly. Empty for no end.
      DATA`CONFIG`ROSTER`FIELD`TO`EXAMPLE: |-
        01-06
      DATA`CONFIG`ROSTER`FIELD`YEARLY`TYPE: |-
        boolean
      DATA`CONFIG`ROSTER`FIELD`YEARLY`DEFAULT: |-
        0
      DATA`CONFIG`ROSTER`FIELD`YEARLY`LABEL: |-
        Every year
      DATA`CONFIG`ROSTER`FIELD`YEARLY`DESCRIPTION: |-
        Whether From and To are days of every year, MM-DD.
      DATA`CONFIG`ROSTER`FIELD`YEARLY`EXAMPLE: |-
        yes

      # ---- Data the code reads ------------------------------------------------------
      DATA`TIERS: |-
        crit-fail fail partial success crit-success
      DATA`DIFFICULTIES: |-
        trivial easy standard hard extreme
      DATA`KINDS: |-
        challenge narration end
      DATA`PORTS`CHALLENGE: |-
        success fail crit-success partial crit-fail
      DATA`PORTS`NARRATION: |-
        continue
      DATA`PORTS`END: |-

      # The fields +duty/set changes, by level, and the leaf under the duty, step or option each is kept in.
      DATA`FIELDS`DUTY: |-
        title description start repeat min max
      DATA`FIELDS`NODE: |-
        label text seen combine result crit-success success partial fail crit-fail
      DATA`FIELDS`OPTION: |-
        label note
      DATA`LEAF`DUTY`TITLE: |-

      DATA`LEAF`DUTY`DESCRIPTION: |-
        `DESC
      DATA`LEAF`DUTY`START: |-
        `START
      DATA`LEAF`DUTY`REPEAT: |-
        `REPEAT
      DATA`LEAF`DUTY`MIN: |-
        `MIN
      DATA`LEAF`DUTY`MAX: |-
        `MAX
      DATA`LEAF`NODE`LABEL: |-
        `LABEL
      DATA`LEAF`NODE`TEXT: |-
        `TEXT
      DATA`LEAF`NODE`SEEN: |-
        `SEEN
      DATA`LEAF`NODE`COMBINE: |-
        `COMBINE
      DATA`LEAF`NODE`RESULT: |-
        `RESULT
      DATA`LEAF`NODE`CRITSUCCESS: |-
        `T`CRITSUCCESS
      DATA`LEAF`NODE`SUCCESS: |-
        `T`SUCCESS
      DATA`LEAF`NODE`PARTIAL: |-
        `T`PARTIAL
      DATA`LEAF`NODE`FAIL: |-
        `T`FAIL
      DATA`LEAF`NODE`CRITFAIL: |-
        `T`CRITFAIL
      DATA`LEAF`OPTION`LABEL: |-

      DATA`LEAF`OPTION`NOTE: |-
        `NOTE
      # +duty/link's settings and the leaf each is kept in.
      DATA`LINK`WEIGHT: |-
        WEIGHT
      DATA`LINK`MIN: |-
        MIN
      DATA`LINK`MAX: |-
        MAX
      DATA`LINK`SHARE: |-
        SHARE
      DATA`LINK`REQUIRES: |-
        REQ

      # ---- The command --------------------------------------------------------------
      # %0 the switches and %1 what follows, exactly as typed. A switch names a DO` routine; a bare +duty
      # shows the party's duty or the roster, +duty <id> one duty.
      CMD`DUTY:
        value: |-
          $(?is)^\+duty(/\S*)?(?\: +(.*))?$:think u(%!/FUN`PARSE,%1,%2); @assert hastype(%#,player)=@pemit %#=notice(DUTY,Only players take on duties.,warn); @assert cor(not(strlen(%q<sw>)),cand(regmatch(%q<sw>,^%[A-Z%]+$),hasattr(%!,DO`%q<sw>)))=@pemit %#=notice(DUTY,+duty has no /[lcstr(%q<sw>)] switch. +help duty lists them.,warn); @include %!/DO`[if(strlen(%q<sw>),%q<sw>,if(strlen(%q<arg>),SHOW,HOME))]
        flags: [regexp]
      # Sets sw (the switch, upper case), arg, eq (1 with an =), lhs and rhs around the first =, p1 to p4 and
      # pn the /-separated parts of lhs (lower case), me and pk (the player's objid and key), staff.
      FUN`PARSE: |-
        setqm(sw,ucstr(trim(after(%0,/))),
        arg,trim(%1),
        eq,strmatch(%1,*=*),
        lhs,trim(before(%1,=)),
        rhs,trim(after(%1,=)),
        me,objid(%#),
        pk,u(%!/FUN`KEY,%#),
        staff,u(%!/FUN`STAFF,%#))[setqm(p1,lcstr(trim(extract(%q<lhs>,1,1,/))),
        p2,lcstr(trim(extract(%q<lhs>,2,1,/))),
        p3,lcstr(trim(extract(%q<lhs>,3,1,/))),
        p4,lcstr(trim(extract(%q<lhs>,4,1,/))),
        pn,words(%q<lhs>,/))]

      # ---- Guards ---------------------------------------------------------------------
      # p1 names a duty: sets id.
      INC`NEED`DUTY: |-
        think setq(id,%q<p1>); @assert strlen(%q<id>)=@pemit %#=notice(DUTY,Name a duty: +duty/[lcstr(%q<sw>)] <duty>.,warn); @assert u(%!/FUN`EXISTS,%q<id>)=@pemit %#=notice(DUTY,There is no duty called %q<id>.,warn)
      # The player may change duty id and it is not waiting for review: sets root, the revision being edited,
      # starting a new one from the approved duty when there is none.
      INC`NEED`EDIT: |-
        @include %!/INC`NEED`DUTY; @assert u(%!/FUN`CANEDIT,%#,%q<id>)=@pemit %#=notice(DUTY,Permission denied. Only its author or a duty reviewer may change %q<id>.,error); @break strmatch(get({{store}}/DUTY`%q<id>`STATE),submitted)=@pemit %#=notice(DUTY,%q<id> is waiting for review. +duty/withdraw %q<id> takes it back to change it.,warn); @include/nobreak %!/INC`DO`DRAFT; think setq(root,DUTY`%q<id>`R[get({{store}}/DUTY`%q<id>`DRAFT)])
      # p2 names a step of root: sets key and kind.
      INC`NEED`NODE: |-
        think setq(key,%q<p2>)[setq(kind,get({{store}}/%q<root>`N`%q<p2>))]; @assert u(%!/FUN`HASNODE,%q<root>,%q<key>)=@pemit %#=notice(DUTY,%q<id> has no step called %q<key>. +duty/show %q<id> lists them.,warn)
      INC`NEED`STAFF: |-
        @assert %q<staff>=@pemit %#=notice(DUTY,Permission denied. Only a duty reviewer may do that.,error)
      # A sheet system is installed: sets prov.
      INC`NEED`PROVIDER: |-
        think setq(prov,u(%!/FUN`PROVIDER)); @assert strlen(%q<prov>)=@pemit %#=notice(DUTY,No sheet system is installed for duties yet%, so they cannot be played. +help duty systems,warn)
      # The player is in a party: sets run, id, root, node, kind, mem (the members), leader, state and prov.
      INC`NEED`RUN: |-
        think setq(run,u(%!/FUN`INRUN,%#)); @assert strlen(%q<run>)=@pemit %#=notice(DUTY,You are not on a duty. +duty lists the ones you can start.,warn); think u(%!/FUN`RUNREGS,%q<run>); @include %!/INC`NEED`PROVIDER
      INC`NEED`LEADER: |-
        @assert strmatch(%q<leader>,%q<me>)=@pemit %#=notice(DUTY,Only the party's leader%, [name(%q<leader>)]%, can do that.,warn)
      # The party is at a challenge: everyone rolls.
      INC`NEED`CHALLENGE: |-
        @assert strmatch(%q<state>,play)=@pemit %#=notice(DUTY,Your party has not set out yet. The leader starts with +duty/go.,warn); @assert strmatch(%q<kind>,challenge)=@pemit %#=notice(DUTY,There is nothing to roll here. The leader goes on with +duty/go.,warn)
      # opt is an option %q<who> can roll at the current challenge.
      INC`NEED`OPTION: |-
        think setq(oimp,strmatch(%q<opt>,improvise)); @assert cor(%q<oimp>,u(%!/FUN`HASOPT,%q<root>,%q<node>,%q<opt>))=@pemit %#=notice(DUTY,There is no option %q<opt> here. Try [itemize(u(%!/FUN`OPEN,%q<run>,%q<root>,%q<node>) improvise,,or)].,warn); @assert cor(%q<oimp>,strmatch(u(%!/FUN`OPTSTATE,%q<run>,%q<root>,%q<node>,%q<opt>),open))=@pemit %#=notice(DUTY,%q<opt> is settled. Try [itemize(u(%!/FUN`OPEN,%q<run>,%q<root>,%q<node>) improvise,,or)].,warn); think setq(otrait,get({{store}}/%q<root>`N`%q<node>`O`%q<opt>`TRAIT)); @assert cor(%q<oimp>,not(get({{store}}/%q<root>`N`%q<node>`O`%q<opt>`TRAINED)),not(hasattr(%q<prov>,FN`DUTIES`TRAINED)),uargs(%q<prov>/FN`DUTIES`TRAINED,roller,%q<who>,trait,%q<otrait>))=@pemit %#=notice(DUTY,%q<opt> needs training in [u(%!/FUN`TRAITLABEL,%q<otrait>)]. Try another option or improvise.,warn); @assert cor(%q<oimp>,not(hasattr(%q<prov>,FN`DUTIES`CAN)),uargs(%q<prov>/FN`DUTIES`CAN,roller,%q<who>,trait,%q<otrait>))=@pemit %#=notice(DUTY,You cannot roll [u(%!/FUN`TRAITLABEL,%q<otrait>)]. Try another option or improvise.,warn)

      # ---- Playing ----------------------------------------------------------------------
      DO`HOME: |-
        @pemit %#=if(strlen(setr(home_run,u(%!/FUN`INRUN,%#))),u(%!/FUN`SCREEN`RUN,%q<home_run>,%q<me>),u(%!/FUN`SCREEN`ROSTER,%q<me>))
      DO`SHOW: |-
        @include %!/INC`NEED`DUTY; @assert cor(get({{store}}/DUTY`%q<id>`LIVE),u(%!/FUN`CANEDIT,%#,%q<id>))=@pemit %#=notice(DUTY,There is no duty called %q<id>.,warn); @pemit %#=u(%!/FUN`SCREEN`DUTY,%q<id>,%q<me>)
      DO`START: |-
        think setq(p1,lcstr(%q<arg>)); @include %!/INC`NEED`DUTY; @include %!/INC`NEED`PROVIDER; @assert not(strlen(u(%!/FUN`INRUN,%#)))=@pemit %#=notice(DUTY,You are already on a duty. +duty shows it.,warn); @assert u(%!/FUN`ACTIVE,%q<id>)=@pemit %#=notice(DUTY,%q<id> is not on the active roster now.,warn); @assert u(%!/FUN`MAYTAKE,%q<pk>,%q<id>)=@pemit %#=notice(DUTY,You have finished %q<id> and it is done only once.,warn); think setq(run,add(firstof(get({{store}}/NEXTRUN),0),1)); &NEXTRUN {{store}}=%q<run>; &RUN`%q<run> {{store}}=%q<id>; &RUN`%q<run>`REV {{store}}=get({{store}}/DUTY`%q<id>`LIVE); &RUN`%q<run>`LEADER {{store}}=%q<me>; &RUN`%q<run>`MEMBERS {{store}}=%q<me>; &RUN`%q<run>`STATE {{store}}=lobby; &INRUN`%q<pk> {{store}}=%q<run>; think u(%!/FUN`RUNREGS,%q<run>); @pemit %#=notice(DUTY,You gather a party for [u(%!/FUN`TITLE,%q<root>)]. Others join with +duty/join %q<run>. +duty/go sets out once [get({{store}}/%q<root>`MIN)] [if(eq(get({{store}}/%q<root>`MIN),1),is,are)] here.,ok)
      DO`JOIN: |-
        think setq(run,trim(%q<arg>)); @include %!/INC`NEED`PROVIDER; @assert cand(isint(%q<run>),hasattr({{store}},RUN`%q<run>))=@pemit %#=notice(DUTY,There is no party %q<run>. +duty lists the parties gathering.,warn); @assert not(strlen(u(%!/FUN`INRUN,%#)))=@pemit %#=notice(DUTY,You are already on a duty. +duty shows it.,warn); think u(%!/FUN`RUNREGS,%q<run>); @assert strmatch(%q<state>,lobby)=@pemit %#=notice(DUTY,Party %q<run> has already set out.,warn); @assert lt(words(%q<mem>),get({{store}}/%q<root>`MAX))=@pemit %#=notice(DUTY,Party %q<run> is full.,warn); @assert u(%!/FUN`MAYTAKE,%q<pk>,%q<id>)=@pemit %#=notice(DUTY,You have finished %q<id> and it is done only once.,warn); &RUN`%q<run>`MEMBERS {{store}}=%q<mem> %q<me>; &INRUN`%q<pk> {{store}}=%q<run>; @pemit/list %q<mem> %q<me>=notice(DUTY,name(%#) joins the party for [u(%!/FUN`TITLE,%q<root>)].,info)
      DO`GO: |-
        @include %!/INC`NEED`RUN; @include %!/INC`NEED`LEADER; @break strmatch(%q<state>,lobby)={@assert gte(words(%q<mem>),get({{store}}/%q<root>`MIN))=@pemit %#=notice(DUTY,[u(%!/FUN`TITLE,%q<root>)] needs at least [get({{store}}/%q<root>`MIN)] in the party.,warn); &RUN`%q<run>`STATE {{store}}=play; think setq(next,get({{store}}/%q<root>`START)); @include %!/INC`RUN`ENTER}; @assert strmatch(%q<kind>,narration)=@pemit %#=notice(DUTY,Everyone rolls here first. Waiting on [itemize(iter(u(%!/FUN`WAITING,%q<run>),name(%i0),,|),|)].,warn); think setqm(count,words(%q<mem>),
        share,100,
        won,)[setq(next,u(%!/FUN`PICK,%q<root>,%q<node>,continue))]; @assert strlen(%q<next>)={@include/args %!/INC`RUN`FINISH=why,The way on is missing%, so the duty ends here.}; @include %!/INC`RUN`ENTER
      DO`TRY: |-
        @include %!/INC`NEED`RUN; @include %!/INC`NEED`CHALLENGE; @assert not(hasattr({{store}},RUN`%q<run>`ROLL`%q<pk>))=@pemit %#=notice(DUTY,You have rolled this round. Waiting on [itemize(iter(u(%!/FUN`WAITING,%q<run>),name(%i0),,|),|)].,warn); think setqm(opt,lcstr(%q<arg>),
        who,%q<me>); @assert strlen(%q<opt>)=@pemit %#=notice(DUTY,Choose an option: +duty/try <option>. +duty shows them.,warn); @include %!/INC`NEED`OPTION; @include/args %!/INC`RUN`ROLL=roller,%q<me>,opt,%q<opt>; @include/nobreak %!/INC`RUN`SETTLE
      DO`FORCE: |-
        @include %!/INC`NEED`RUN; @include %!/INC`NEED`LEADER; @include %!/INC`NEED`CHALLENGE; think setq(who,u(%!/FUN`MEMBERNAMED,%q<mem>,%q<arg>)); @assert strlen(%q<who>)=@pemit %#=notice(DUTY,Nobody called %q<arg> is in your party.,warn); @assert not(hasattr({{store}},RUN`%q<run>`ROLL`[u(%!/FUN`KEY,%q<who>)]))=@pemit %#=notice(DUTY,[name(%q<who>)] has rolled this round.,warn); @pemit/list %q<mem>=notice(DUTY,name(%#) rolls for [name(%q<who>)].,info); @include/args %!/INC`RUN`ROLL=roller,%q<who>,opt,improvise; @include/nobreak %!/INC`RUN`SETTLE
      DO`KICK: |-
        @include %!/INC`NEED`RUN; @include %!/INC`NEED`LEADER; think setq(gone,u(%!/FUN`MEMBERNAMED,%q<mem>,%q<arg>)); @assert strlen(%q<gone>)=@pemit %#=notice(DUTY,Nobody called %q<arg> is in your party.,warn); @assert not(strmatch(%q<gone>,%q<me>))=@pemit %#=notice(DUTY,To leave your own party%, use +duty/leave.,warn); @pemit/list %q<mem>=notice(DUTY,name(%#) sends [name(%q<gone>)] away from the party.,info); @include %!/INC`RUN`DROP
      DO`LEAVE: |-
        @include %!/INC`NEED`RUN; think setq(gone,%q<me>); @pemit/list %q<mem>=notice(DUTY,name(%#) leaves the party.,info); @include %!/INC`RUN`DROP
      DO`ABANDON: |-
        @include %!/INC`NEED`RUN; @include %!/INC`NEED`LEADER; @include/args %!/INC`RUN`FINISH=why,name(%#) abandons the duty. Nobody earns its rewards.
      # +duty/info <duty>: what the player has learned from it.
      DO`INFO: |-
        think setq(p1,lcstr(%q<arg>)); @include %!/INC`NEED`DUTY; @assert strlen(setr(root,u(%!/FUN`LIVEROOT,%q<id>)))=@pemit %#=notice(DUTY,%q<id> is not approved.,warn); think setq(info,u(%!/FUN`LEARNED,%q<pk>,%q<id>,%q<root>)); @pemit %#=box(if(strlen(%q<info>),%q<info>,tone(muted,You have learned nothing from this duty yet.)),u(%!/FUN`TITLE,%q<root>))

      # ---- Writing ----------------------------------------------------------------------
      DO`CREATE: |-
        @assert cand(%q<eq>,eq(%q<pn>,1))=@pemit %#=notice(DUTY,+duty/create <id>=<title>,warn); think setq(id,%q<p1>); @assert u(%!/FUN`IDOK,%q<id>)=@pemit %#=notice(DUTY,A duty's id is a letter then letters%, digits or _%, 24 at most.,warn); @assert not(hasattr({{store}},DUTY`%q<id>))=@pemit %#=notice(DUTY,There is already a duty called %q<id>.,warn); think setq(why,u(%!/FUN`BAD`TITLE,%q<rhs>)); @assert not(strlen(%q<why>))=@pemit %#=notice(DUTY,%q<why>,warn); &DUTY`%q<id> {{store}}=secs(); &DUTY`%q<id>`AUTHOR {{store}}=%q<me>; &DUTY`%q<id>`DRAFT {{store}}=1; &DUTY`%q<id>`NEXT {{store}}=2; &DUTY`%q<id>`STATE {{store}}=editing; &DUTY`%q<id>`R1 {{store}}=%q<rhs>; &DUTY`%q<id>`R1`REPEAT {{store}}=every; &DUTY`%q<id>`R1`MIN {{store}}=1; &DUTY`%q<id>`R1`MAX {{store}}=v(DATA`CONFIG`MAXPARTY); &DUTY`%q<id>`R1`EN {{store}}=0; @pemit %#=notice(DUTY,Created %q<id>. Add its first step with +duty/node %q<id>/<step>=challenge.,ok)
      DO`SET: |-

format: "1.16"
package: census-config
title: "Census: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Census settings and dimensions into +config: registers them with the +config registry, so staff see and change them with +config census."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [census, config, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. census declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: census
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/census/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: census_config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`CENSUS: |-
        {{census/census}}

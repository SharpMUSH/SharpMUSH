format: "1.20"
package: gmcp-mudlet-help
title: "GMCP for Mudlet: +help topics"
version: 1.0.1
authors: [SharpMUSH]
description: "Puts the GMCP for Mudlet topics into +help: registers the gmcp-mudlet package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [gmcp-mudlet, help, bridge]
category: MUD clients
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. gmcp-mudlet keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: gmcp-mudlet
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/gmcp-mudlet/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`GMCP-MUDLET: |-
        {{gmcp-mudlet/client}}

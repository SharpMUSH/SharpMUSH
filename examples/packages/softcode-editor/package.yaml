format: 1
package: softcode-editor
version: 1.0.0
authors: [SharpMUSH]
description: "@editor — an @input-driven line editor for function and command softcode."
license: MIT
keywords: [editor, softcode, input]
requires_server: ">=0.1"

# Active editors call these attributes by name. Finish them before upgrading,
# rolling back or uninstalling this package.
objects:
  - ref: editor
    type: thing
    name: Softcode Editor
    flags: [WIZARD]
    attributes:
      DATA:
        value: |-
          Per-descriptor editor state. A normal exit removes its branch.
        flags: [no_command]

      STARTUP: |-
        @command/add/noparse/rsnoparse @editor; @hook/override/inline @editor=%!,CMD`EDITOR
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP

      CMD`EDITOR:
        value: |-
          $(?is)^@editor +([^=]+?)(?\:=(function|command))? *$: think [setq(spec,trim(%1))][setq(mode,lcstr(trim(%2)))]; @assert strmatch(%q<spec>,*/*)=@pemit/port %d=Usage: @editor <object>/<attribute>[=function|command]; think [setq(obj,locate(%#,before(%q<spec>,/),*))][setq(attr,ucstr(after(%q<spec>,/)))]; @assert cand(isdbref(%q<obj>),valid(attrname,%q<attr>))=@pemit/port %d=I cannot find that object or attribute name.; @assert controls(%#,%q<obj>)=@pemit/port %d=Permission denied.; think [setq(new,not(hasattr(%q<obj>,%q<attr>)))][setq(mode,firstof(%q<mode>,if(hasattr(%q<obj>,%q<attr>),switch(1,hasflag(%q<obj>/%q<attr>,cmdsyntax),command,hasflag(%q<obj>/%q<attr>,funsyntax),function))))]; @assert member(function command,%q<mode>)=@pemit/port %d=Use =function or =command for a new or unflagged attribute.; &DATA`%d`OBJECT %!=[objid(%q<obj>)]; &DATA`%d`ATTRIBUTE %!=%q<attr>; &DATA`%d`MODE %!=%q<mode>; &DATA`%d`NEW %!=%q<new>; &DATA`%d`ORIGINAL %!=[if(%q<new>,,get(%q<obj>/%q<attr>))]; &DATA`%d`ORIGINALCMD %!=[and(not(%q<new>),hasflag(%q<obj>/%q<attr>,cmdsyntax))]; &DATA`%d`ORIGINALFUN %!=[and(not(%q<new>),hasflag(%q<obj>/%q<attr>,funsyntax))]; &DATA`%d`DRAFT %!=[if(%q<new>,,get(%q<obj>/%q<attr>))]; &DATA`%d`APPENDED %!=0; &DATA`%d`UNDO %!; &DATA`%d`UNDOAPPENDED %!; @pemit/port %d=[u(%!/FUN`LIST,%d)]; @include %!/INPUT`START
        flags: [regexp, cmdsyntax]

      INPUT`START: |-
        @input/start/regex Code> (.h help, .sq save+quit)=^\\.(sq|q!?)$,INPUT`EXIT,^\\.s$,INPUT`SAVE,^\\.c$,INPUT`CHECK,^\\.l$,INPUT`LIST,^\\.u$,INPUT`UNDO,^\\.h$,INPUT`HELP,^\\.\\..*$,INPUT`DOT,*,INPUT`LINE,3600
      INPUT`LINE: |-
        think [setq(old,get(%!/DATA`%d`DRAFT))][setq(oldlines,get(%!/DATA`%d`APPENDED))]; &DATA`%d`DRAFT %!=[get(%!/DATA`%d`DRAFT)][if(or(strlen(get(%!/DATA`%d`DRAFT)),%q<oldlines>),%r)]%0; &DATA`%d`APPENDED %!=[add(%q<oldlines>,1)]; &DATA`%d`UNDO %!=%q<old>; &DATA`%d`UNDOAPPENDED %!=%q<oldlines>; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`DOT: |-
        think [setq(old,get(%!/DATA`%d`DRAFT))][setq(oldlines,get(%!/DATA`%d`APPENDED))]; &DATA`%d`DRAFT %!=[get(%!/DATA`%d`DRAFT)][if(or(strlen(get(%!/DATA`%d`DRAFT)),%q<oldlines>),%r)][rest(%0,.)]; &DATA`%d`APPENDED %!=[add(%q<oldlines>,1)]; &DATA`%d`UNDO %!=%q<old>; &DATA`%d`UNDOAPPENDED %!=%q<oldlines>; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`LIST: |-
        @pemit/port %d=[u(%!/FUN`LIST,%d)]; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`HELP: |-
        @pemit/port %d=.s save | .sq save and quit | .q quit | .q! discard | .c check | .l list | .u undo | .h help | .. inserts one leading dot; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`UNDO: |-
        @assert hasattr(%!,DATA`%d`UNDO)=@pemit/port %d=Nothing to undo.; think [setq(now,get(%!/DATA`%d`DRAFT))][setq(nowlines,get(%!/DATA`%d`APPENDED))]; &DATA`%d`DRAFT %!=[get(%!/DATA`%d`UNDO)]; &DATA`%d`APPENDED %!=[get(%!/DATA`%d`UNDOAPPENDED)]; &DATA`%d`UNDO %!=%q<now>; &DATA`%d`UNDOAPPENDED %!=%q<nowlines>; @pemit/port %d=Undone.; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`CHECK: |-
        think [setq(diag,syntaxdiagnostics(%!/DATA`%d`DRAFT,get(%!/DATA`%d`MODE)))]; @pemit/port %d=[if(not(json_query(%q<diag>,size)),Syntax OK.,json_map(%!/FUN`DIAGROW,%q<diag>,%r))]; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`SAVE: |-
        @include/args %!/INC`SAVE=mode,stay; @input/prompt Code> (.h help, .sq save+quit)
      INPUT`EXIT: |-
        @assert not(strmatch(r(reason,args),timeout))={@pemit/port %d=Editor timed out; changes discarded.; @wipe %!/DATA`%d`**}; @assert strmatch(r(0,args),.sq)={@pemit/port %d=Editor closed without saving.; @wipe %!/DATA`%d`**}; @include/args %!/INC`SAVE=mode,exit; @wipe %!/DATA`%d`**

      INC`SAVE: |-
        think [setq(saved,0)][setq(diag,syntaxdiagnostics(%!/DATA`%d`DRAFT,get(%!/DATA`%d`MODE)))]; @assert not(json_query(%q<diag>,size))={@pemit/port %d=[json_map(%!/FUN`DIAGROW,%q<diag>,%r)]; @pemit/port %d=Not saved.; @switch/inline strmatch(%<mode>,exit)=1,@include %!/INPUT`START}; think [setq(obj,get(%!/DATA`%d`OBJECT))][setq(attr,get(%!/DATA`%d`ATTRIBUTE))][setq(current,if(hasattr(%q<obj>,%q<attr>),get(%q<obj>/%q<attr>)))]; @assert controls(%#,%q<obj>)={@pemit/port %d=Permission denied.; @switch/inline strmatch(%<mode>,exit)=1,@include %!/INPUT`START}; @assert if(get(%!/DATA`%d`NEW),not(hasattr(%q<obj>,%q<attr>)),cand(hasattr(%q<obj>,%q<attr>),not(strcmp(%q<current>,get(%!/DATA`%d`ORIGINAL))),eq(hasflag(%q<obj>/%q<attr>,cmdsyntax),get(%!/DATA`%d`ORIGINALCMD)),eq(hasflag(%q<obj>/%q<attr>,funsyntax),get(%!/DATA`%d`ORIGINALFUN))))={@pemit/port %d=Editor conflict: the attribute or syntax mode changed after it was opened.; @switch/inline strmatch(%<mode>,exit)=1,@include %!/INPUT`START}; think [setq(draft,get(%!/DATA`%d`DRAFT))][setq(syntax,switch(get(%!/DATA`%d`MODE),command,cmdsyntax,funsyntax))][setq(other,switch(get(%!/DATA`%d`MODE),command,funsyntax,cmdsyntax))]; @force/inline %#={&%q<attr> %q<obj>=[escape(%q<draft>)]; @set %q<obj>/%q<attr>=%q<syntax>}; @force/inline %#=@set %q<obj>/%q<attr>=!%q<other>; &DATA`%d`ORIGINAL %!=%q<draft>; &DATA`%d`ORIGINALCMD %!=[strmatch(get(%!/DATA`%d`MODE),command)]; &DATA`%d`ORIGINALFUN %!=[strmatch(get(%!/DATA`%d`MODE),function)]; &DATA`%d`APPENDED %!=0; &DATA`%d`NEW %!=0; think [setq(saved,1)]; @pemit/port %d=%q<attr> saved.
        flags: [cmdsyntax]

      FUN`LIST:
        value: |-
          [if(strlen(get(%!/DATA`%0`DRAFT)),get(%!/DATA`%0`DRAFT),(empty))]
        flags: [funsyntax]
      FUN`DIAGROW:
        value: |-
          Error at [json_query(%1,get,line)]:[json_query(%1,get,column)]: [json_query(%1,get,message)]
        flags: [funsyntax]

      HELP`EDITOR: |-
        @editor <object>/<attribute> edits an existing FUNSYNTAX or CMDSYNTAX attribute.
        @editor <object>/<attribute>=function or =command selects the syntax and permits a new attribute.

        Inside the editor: .s saves, .sq saves and exits, .q or .q! exits without saving,
        .c checks syntax, .l lists the buffer, .u swaps with the one-level undo buffer,
        .h shows help, and .. at the start inserts one literal dot.

        Finish active editor sessions before upgrading, rolling back or uninstalling this package.

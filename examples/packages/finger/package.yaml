format: 1.2
package: finger
version: 1.1.0
authors: [SharpMUSH]
description: "+finger and +oocfinger: a character's IC and OOC profile, from a field list the game edits one attribute at a time."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [finger, profile, character, ooc]
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  # The settings are registered with +config: +config finger lists them.
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

# One permission, for staff who keep profiles: set anyone's fields, and the fields only staff set. Hand it to one
# player with @permission/allow <player>=softcode.finger.edit.
categories:
  permissions:
    - name: Finger
      description: Looking after +finger profiles.
permissions:
  - name: softcode.finger.edit
    category: Finger
    description: Set anyone's +finger fields, and the fields only staff set.

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook) and
  # reads and writes every player's PROFILE`<key> attributes.
  #
  # +finger and +oocfinger are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # The fields are the FIELD` tree: FIELD`<view>`<order>`<KEY>, its value the label. <view> is IC (+finger) or
  # OOC (+oocfinger), <order> sorts them, and a player's value is their PROFILE`<KEY> attribute, which the
  # portal's profile reads too. A field with a SHOW`<KEY> beside it is worked out by the game instead.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC` one routine per switch.
  # FUN`FIELD` reads the field list, FUN`CARD` draws a profile, FUN`FIELDS` the field list. DATA`CONFIG` the settings +config finger shows, DATA`ROUTE` the switches.
  - ref: finger
    type: thing
    name: Finger
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      FIELD: |-
        The fields, one leaf each: FIELD`<IC or OOC>`<order>`<KEY>=<label>.
      FIELD`IC`010`FULLNAME: |-
        Full Name
      FIELD`IC`020`ALIAS: |-
        Alias
      FIELD`IC`030`AGE: |-
        Age
      FIELD`IC`040`SPECIES: |-
        Species
      FIELD`IC`050`OCCUPATION: |-
        Occupation
      FIELD`IC`060`QUOTE: |-
        Quote
      FIELD`OOC`010`PRONOUNS: |-
        Pronouns
      FIELD`OOC`020`TIMEZONE: |-
        Time zone
      FIELD`OOC`030`LASTON: |-
        Last on
      FIELD`OOC`040`PLAYTIMES: |-
        Usually on
      FIELD`OOC`050`RPPREFS: |-
        RP preferences
      # Fields the game works out, one per key: %<target> the player, %<viewer> who is reading. Empty hides the
      # field from everyone but the player and staff.
      SHOW: |-
        Worked-out fields, one leaf per key.
      SHOW`ALIAS: |-
        alias(%<target>)
      SHOW`LASTON: |-
        u(%!/FUN`DISPLAY`LASTON,%<target>,%<viewer>)

      DATA: |-
        Settings and constants.
      # ---- Settings: +config finger --------------------------------------------
      # Each DATA`CONFIG`<NAME> is the value; the leaves under it tell +config what it accepts. The code
      # reads the value with get(); see plus-config's README.
      DATA`CONFIG:
        value: |-
          What +finger and +oocfinger show, and who sets which field.
        flags: [no_command]
      DATA`CONFIG`SECTIONS: |-
        QUOTE RPPREFS
      DATA`CONFIG`SECTIONS`TYPE: |-
        list
      DATA`CONFIG`SECTIONS`DEFAULT: |-
        QUOTE RPPREFS
      DATA`CONFIG`SECTIONS`CHECK: |-
        CHECK`FIELDS
      DATA`CONFIG`SECTIONS`DESCRIPTION: |-
        Fields shown under the rest, each below a line with its label: for text longer than a line.
      DATA`CONFIG`LOCKED: |-

      DATA`CONFIG`LOCKED`TYPE: |-
        list
      DATA`CONFIG`LOCKED`DEFAULT: |-

      DATA`CONFIG`LOCKED`CHECK: |-
        CHECK`FIELDS
      DATA`CONFIG`LOCKED`DESCRIPTION: |-
        Fields only staff set.
      DATA`CONFIG`COLUMNS: |-
        2
      DATA`CONFIG`COLUMNS`TYPE: |-
        integer
      DATA`CONFIG`COLUMNS`DEFAULT: |-
        2
      DATA`CONFIG`COLUMNS`MIN: |-
        1
      DATA`CONFIG`COLUMNS`MAX: |-
        4
      DATA`CONFIG`COLUMNS`DESCRIPTION: |-
        How many columns the other fields are dealt into. They stack on a narrow screen.
      DATA`CONFIG`LENGTH: |-
        1000
      DATA`CONFIG`LENGTH`TYPE: |-
        integer
      DATA`CONFIG`LENGTH`DEFAULT: |-
        1000
      DATA`CONFIG`LENGTH`MIN: |-
        1
      DATA`CONFIG`LENGTH`MAX: |-
        8000
      DATA`CONFIG`LENGTH`DESCRIPTION: |-
        The longest value a field takes, in characters.
      # %0 a list of field keys, as +config stores it: why some are not fields, or nothing.
      CHECK`FIELDS:
        value: |-
          setq(check_unknown,squish(trim(iter(%0,if(u(%!/FUN`FIELD`KEYED,%i0),,%i0),%b,%b))))[if(words(%q<check_unknown>),[itemize(%q<check_unknown>)] [if(eq(words(%q<check_unknown>),1),is not a field,are not fields)]. +finger/fields lists them.)]
        flags: [funsyntax]
      # Which INC` routine each switch runs. BARE is the command alone, ARG the command with something after it.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`BARE: |-
        SHOW
      DATA`ROUTE`ARG: |-
        SHOW
      DATA`ROUTE`SET: |-
        SET
      DATA`ROUTE`FIELDS: |-
        FIELDS
      DATA`ROUTE`HIDE: |-
        HIDE
      DATA`ROUTE`UNHIDE: |-
        UNHIDE

      # ---- commands -------------------------------------------------------------
      # Each command word: %1 the switches and %2 what follows, exactly as typed.
      CMD`FINGER:
        value: |-
          $(?is)^\+finger(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,finger,view,IC,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`OOCFINGER:
        value: |-
          $(?is)^\+oocfinger(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,oocfinger,view,OOC,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(FINGER,Only players use +%<word>.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<view>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(FINGER,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(FINGER,+%q<cmd_word> has no /%q<cmd_switch> switch. +help finger lists them.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its view, %2 the switches and %3 the argument, as typed. Sets cmd_word, cmd_view,
      # cmd_switch_list, cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_route (the INC` routine to run), viewer_objid and viewer_is_editor.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_view,%1,
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          viewer_objid,objid(%#),
          viewer_is_editor,permission(%#,softcode.finger.edit))
        flags: [funsyntax]

      # ---- the field list -------------------------------------------------------
      # %0 a view, IC or OOC: its fields, as FIELD` attribute names, in order.
      FUN`FIELD`IN:
        value: |-
          sort(lattr(%!/FIELD`%0`*`*))
        flags: [funsyntax]
      # Every field, +finger's then +oocfinger's.
      FUN`FIELD`ALL:
        value: |-
          [u(%!/FUN`FIELD`IN,IC)] [u(%!/FUN`FIELD`IN,OOC)]
        flags: [funsyntax]
      # %0 typed text: the field it names, by key or by label, spaces and case ignored. Empty when none does.
      FUN`FIELD`FIND:
        value: |-
          first(filterbool(%!/FUN`FIELD`NAMED,u(%!/FUN`FIELD`ALL),,,lcstr(edit(%0,%b,))))
        flags: [funsyntax]
      # %0 a field, %1 a name, lower case without spaces: 1 when the field's key or label is that name.
      FUN`FIELD`NAMED:
        value: |-
          cor(not(comp(lcstr(last(%0,`)),%1)),not(comp(lcstr(edit(get(%!/%0),%b,)),%1)))
        flags: [funsyntax]
      # %0 a key: 1 when it is a field's.
      FUN`FIELD`KEYED:
        value: |-
          cand(regmatch(%0,^%[A-Za-z0-9_-%]+$),words(lattr(%!/FIELD`*`*`%0)))
        flags: [funsyntax]
      # %0 a key: 1 when the game works the field out.
      FUN`FIELD`WORKEDOUT:
        value: |-
          hasattr(%!,SHOW`%0)
        flags: [funsyntax]
      # %0 a key: 1 when only staff set it.
      FUN`FIELD`LOCKED:
        value: |-
          member(ucstr(get(%!/DATA`CONFIG`LOCKED)),ucstr(%0))
        flags: [funsyntax]
      # %0 a player, %1 a key: 1 when the player set the field but nobody else may read it.
      FUN`FIELD`HIDDEN:
        value: |-
          cand(hasattr(%0,PROFILE`%1),not(cand(hasflag(%0/PROFILE`%1,visual),hasflag(%0/PROFILE,visual))))
        flags: [funsyntax]
      # The field %<key> of %<target> as %<viewer> may read it: worked out, or the player's PROFILE`<key>, read
      # with get() and never evaluated, and only when the viewer may see that attribute or is staff who edit profiles.
      FUN`FIELD`VALUE:
        value: |-
          if(u(%!/FUN`FIELD`WORKEDOUT,%<key>),uargs(%!/SHOW`%<key>,target,%<target>,viewer,%<viewer>),if(cor(visible(%<viewer>,%<target>/PROFILE`%<key>),permission(%<viewer>,softcode.finger.edit)),get(%<target>/PROFILE`%<key>)))
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 typed text: the objid of the player it names, or nothing.
      FUN`PLAYER:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 seconds: a short duration, 5m or 2h.
      FUN`DISPLAY`DURATION:
        value: |-
          trim(etime(max(0,%0),3))
        flags: [funsyntax]
      # %0 a player, %1 the reader: on now and how idle, when the reader can see them connected; else how long
      # ago they left; else nothing.
      FUN`DISPLAY`LASTON:
        value: |-
          if(member(lwho(%1),num(%0)),on now · idle [u(%!/FUN`DISPLAY`DURATION,idle(%0))],if(isint(setr(last_logout,convtime(get(%0/LASTLOGOUT)))),[u(%!/FUN`DISPLAY`DURATION,sub(secs(),%q<last_logout>))] ago))
        flags: [funsyntax]
      # Every screen is a box() with no sides, corners or tees, as +help's and +scene's are, so a quote copied
      # from a terminal carries no |.
      FUN`DISPLAY`FRAME:
        value: |-
          json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
        flags: [funsyntax]
      # Table options, every list split by a new line: %0 the columns that never wrap, %1 each column's
      # priority, %2 each column's share of the spare width.
      FUN`DISPLAY`TABLEOPTIONS:
        value: |-
          json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1),grow,json(string,%2))
        flags: [funsyntax]

      # ---- +finger and +oocfinger -------------------------------------------------
      # +finger [<player>], +oocfinger [<player>]
      INC`SHOW:
        value: |-
          think setq(card_target,if(strlen(%q<cmd_argument>),u(%!/FUN`PLAYER,%q<cmd_argument>),%q<viewer_objid>)); @assert strlen(%q<card_target>)=@pemit %#=notice(FINGER,There is no player called '%q<cmd_argument>'.,warn); think u(%!/FUN`CARD`PREPARE,%q<card_target>,%#,%q<cmd_view>); @assert words(%q<card_rows>)=@pemit %#=notice(FINGER,[name(%q<card_target>)] has nothing on their +%q<cmd_word>. [u(%!/FUN`CARD`OTHER)] shows the rest.); @pemit %#=u(%!/FUN`CARD`DRAW)
        flags: [cmdsyntax]
      # %0 the player, %1 the reader, %2 the view. Sets card_target, card_viewer, card_view, card_full (the
      # reader is the player or staff, and sees every field, set or not), card_rows (the fields to show) and
      # card_inline and card_sections (those shown side by side, and those shown under them).
      FUN`CARD`PREPARE:
        value: |-
          setqm(card_target,%0,
          card_viewer,%1,
          card_view,%2,
          card_full,cor(not(comp(objid(%0),objid(%1))),permission(%1,softcode.finger.edit)),
          card_rows,filterbool(%!/FUN`CARD`SHOWN,u(%!/FUN`FIELD`IN,%2)),
          card_inline,filterbool(%!/FUN`CARD`INLINE,%q<card_rows>),
          card_sections,filterbool(%!/FUN`CARD`SECTION,%q<card_rows>))
        flags: [funsyntax]
      # %0 a field: what the reader reads in it.
      FUN`CARD`VALUE:
        value: |-
          uargs(%!/FUN`FIELD`VALUE,target,%q<card_target>,viewer,%q<card_viewer>,key,last(%0,`))
        flags: [funsyntax]
      # %0 a field: 1 when it is shown: it has a value the reader may read, or the reader sees every field.
      FUN`CARD`SHOWN:
        value: |-
          cor(%q<card_full>,strlen(u(%!/FUN`CARD`VALUE,%0)))
        flags: [funsyntax]
      FUN`CARD`SECTION:
        value: |-
          member(ucstr(get(%!/DATA`CONFIG`SECTIONS)),last(%0,`))
        flags: [funsyntax]
      FUN`CARD`INLINE:
        value: |-
          not(u(%!/FUN`CARD`SECTION,%0))
        flags: [funsyntax]
      # %0 a field: its value, - when it has none, and (hidden) beside one only the player and staff can read.
      FUN`CARD`SHOW:
        value: |-
          if(strlen(setr(card_value,u(%!/FUN`CARD`VALUE,%0))),%q<card_value>[if(cand(%q<card_full>,u(%!/FUN`FIELD`HIDDEN,%q<card_target>,last(%0,`))),%b[tone(muted,\(hidden\))])],tone(muted,-))
        flags: [funsyntax]
      # The prepared profile: the fields side by side, each section under its own line, and a footer.
      FUN`CARD`DRAW:
        value: |-
          box([if(words(%q<card_inline>),lfields(json(object,cols,firstof(get(%!/DATA`CONFIG`COLUMNS),1)),iter(%q<card_inline>,get(%!/%i0),,chr(30)),iter(%q<card_inline>,u(%!/FUN`CARD`SHOW,%i0),,chr(30)),chr(30)))][iter(%q<card_sections>,[if(cor(words(%q<card_inline>),gt(inum(0),1)),%r)][rule(get(%!/%i0))]%r[u(%!/FUN`CARD`SHOW,%i0)],,)]%r[rule()]%r[tone(muted,u(%!/FUN`CARD`FOOTER))],u(%!/FUN`CARD`TITLE),,u(%!/FUN`DISPLAY`FRAME))
        flags: [funsyntax]
      FUN`CARD`TITLE:
        value: |-
          name(%q<card_target>)[if(strmatch(%q<card_view>,OOC),%b· OOC)]
        flags: [funsyntax]
      # The command for the other view of the same player.
      FUN`CARD`OTHER:
        value: |-
          [if(strmatch(%q<card_view>,IC),+oocfinger,+finger)] [name(%q<card_target>)]
        flags: [funsyntax]
      FUN`CARD`FOOTER:
        value: |-
          u(%!/FUN`CARD`OTHER)[if(not(comp(objid(%q<card_target>),objid(%q<card_viewer>))),%b· +finger/set <field>=<text> · +finger/fields)]
        flags: [funsyntax]

      # ---- +finger/fields ---------------------------------------------------------
      INC`FIELDS:
        value: |-
          @pemit %#=box([u(%!/FUN`FIELDS`TABLE,u(%!/FUN`FIELD`ALL))]%r[rule()]%r[tone(muted,+finger/set <field>=<text> sets one · +finger/set <field>= clears it · +finger/hide <field> keeps it to you and staff)],Finger fields,,u(%!/FUN`DISPLAY`FRAME))
        flags: [cmdsyntax]
      # %0 fields: label, key, command, and what the player running it has in each.
      FUN`FIELDS`TABLE:
        value: |-
          datacolumns(u(%!/FUN`DISPLAY`TABLEOPTIONS,1%r2%r3,1%r3%r4%r2,%r%r%r1),[ansi(h,Field)]%r[iter(%0,get(%!/%i0),,%r)],[ansi(h,Key)]%r[iter(%0,lcstr(last(%i0,`)),,%r)],[ansi(h,Shown by)]%r[iter(%0,if(strmatch(extract(%i0,2,1,`),IC),+finger,+oocfinger),,%r)],[ansi(h,Yours)]%r[iter(%0,u(%!/FUN`FIELDS`YOURS,last(%i0,`)),,%r)])
        flags: [funsyntax]
      # %0 a key: whether the player running the command set it.
      FUN`FIELDS`YOURS:
        value: |-
          case(1,u(%!/FUN`FIELD`WORKEDOUT,%0),worked out,u(%!/FUN`FIELD`HIDDEN,%#,%0),set · hidden,hasattr(%#,PROFILE`%0),set,u(%!/FUN`FIELD`LOCKED,%0),staff set it,-)
        flags: [funsyntax]

      # ---- setting a field --------------------------------------------------------
      # Sets set_target (a player), set_field (a FIELD` attribute) and set_key from %q<cmd_left_side>, which is
      # <field> or, for staff, <player>/<field>.
      INC`NEEDFIELD:
        value: |-
          @assert strlen(%q<cmd_left_side>)=@pemit %#=notice(FINGER,Which field? +%q<cmd_word>/%q<cmd_switch> <field>[if(strmatch(%q<cmd_switch>,set),=<text>)],warn); think u(%!/FUN`SET`PARSE,%q<cmd_left_side>); @assert strlen(%q<set_target>)=@pemit %#=notice(FINGER,There is no player called '[before(%q<cmd_left_side>,/)]'.,warn); @assert cor(%q<viewer_is_editor>,not(comp(%q<set_target>,%q<viewer_objid>)))=@pemit %#=notice(FINGER,Only staff change someone else's fields.,error); think setq(set_field,u(%!/FUN`FIELD`FIND,%q<set_typed>)); @assert strlen(%q<set_field>)=@pemit %#=notice(FINGER,There is no field called '%q<set_typed>'. +finger/fields lists them.,warn); think setqm(set_key,last(%q<set_field>,`),set_label,get(%!/%q<set_field>),set_whose,if(comp(%q<set_target>,%q<viewer_objid>),[name(%q<set_target>)]'s,your)); @assert not(u(%!/FUN`FIELD`WORKEDOUT,%q<set_key>))=@pemit %#=notice(FINGER,%q<set_label> is worked out by the game: nobody sets it.,warn)
        flags: [cmdsyntax]
      # %0 <field> or <player>/<field>: sets set_target (the player, empty when no player has that name) and
      # set_typed (the field as typed).
      FUN`SET`PARSE:
        value: |-
          setqm(set_by_name,strmatch(%0,*/*),
          set_target,if(%q<set_by_name>,u(%!/FUN`PLAYER,before(%0,/)),%q<viewer_objid>),
          set_typed,if(%q<set_by_name>,after(%0,/),%0))
        flags: [funsyntax]
      # +finger/set [<player>/]<field>=<text>. Nothing after the = clears it.
      INC`SET:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(FINGER,+%q<cmd_word>/set <field>=<text> sets a field. +finger/fields lists them.,warn); @include %!/INC`NEEDFIELD; @assert cor(%q<viewer_is_editor>,not(u(%!/FUN`FIELD`LOCKED,%q<set_key>)))=@pemit %#=notice(FINGER,Only staff set %q<set_label>.,error); @assert lte(strlen(%q<cmd_right_side>),get(%!/DATA`CONFIG`LENGTH))=@pemit %#=notice(FINGER,Keep %q<set_label> to [get(%!/DATA`CONFIG`LENGTH)] characters.,warn); @break strlen(%q<cmd_right_side>)={@include %!/INC`SET`STORE}; @assert hasattr(%q<set_target>,PROFILE`%q<set_key>)=@pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label> is not set.,warn); &PROFILE`%q<set_key> %q<set_target>; @pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label> is cleared.,ok); @include %!/INC`SET`TELL
        flags: [cmdsyntax]
      # Stores %q<cmd_right_side>. A new value is readable by everyone, its PROFILE root too; one already set keeps
      # its flags, so a field the player hid stays hidden.
      INC`SET`STORE:
        value: |-
          think setq(set_new,not(hasattr(%q<set_target>,PROFILE`%q<set_key>))); &PROFILE`%q<set_key> %q<set_target>=%q<cmd_right_side>; @if %q<set_new>={@set %q<set_target>/PROFILE`%q<set_key>=visual; @set %q<set_target>/PROFILE=visual}; @pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label>: %q<cmd_right_side>,ok); @include %!/INC`SET`TELL
        flags: [cmdsyntax]
      # Tells a player when staff changed one of their fields.
      INC`SET`TELL:
        value: |-
          @break not(comp(%q<set_target>,%q<viewer_objid>)); @pemit %q<set_target>=notice(FINGER,[name(%#)] changed your %q<set_label>.)
        flags: [cmdsyntax]
      # +finger/hide <field>
      INC`HIDE:
        value: |-
          @include %!/INC`NEEDFIELD; @assert hasattr(%q<set_target>,PROFILE`%q<set_key>)=@pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label> is not set.,warn); @assert not(u(%!/FUN`FIELD`HIDDEN,%q<set_target>,%q<set_key>))=@pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label> is already hidden.,warn); @set %q<set_target>/PROFILE`%q<set_key>=!visual; @pemit %#=notice(FINGER,Only [if(comp(%q<set_target>,%q<viewer_objid>),name(%q<set_target>),you)] and staff see %q<set_whose> %q<set_label> now.,ok)
        flags: [cmdsyntax]
      # +finger/unhide <field>
      INC`UNHIDE:
        value: |-
          @include %!/INC`NEEDFIELD; @assert u(%!/FUN`FIELD`HIDDEN,%q<set_target>,%q<set_key>)=@pemit %#=notice(FINGER,[capstr(%q<set_whose>)] %q<set_label> is not hidden.,warn); @set %q<set_target>/PROFILE`%q<set_key>=visual; @set %q<set_target>/PROFILE=visual; @pemit %#=notice(FINGER,Everyone sees %q<set_whose> %q<set_label> again.,ok)
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @dolist/inline finger oocfinger={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: finger_help
    type: thing
    name: Finger Help
    location: "{{finger}}"
    attributes:
      HELP: |-
        Character profiles: +finger and +oocfinger.
      HELP`FINGER: |-
        `+finger` shows a character's in-character profile, and `+oocfinger` the player's out-of-character one.

        - `+finger` and `+oocfinger` show your own.
        - `+finger <name>` and `+oocfinger <name>` show someone else's.
        - `+finger/fields` lists every field, which command shows it, and whether you have set it.

        A field nobody has filled in is left out, except on your own, where it shows as `-`.

        ## Filling it in

        - `+finger/set <field>=<text>` sets a field: `+finger/set age=32`. A field is named by its key or its label: `+finger/set full name=Wren Ash`.
        - `+finger/set <field>=` with nothing after the `=` clears it.

        What you type is kept as typed, less the spaces around the =: brackets and percent signs are plain text. Some fields, such as Alias and Last on, are worked out by the game, and some a game keeps for staff to set.

        ## Hiding a field

        - `+finger/hide <field>` keeps a field you set to you and staff. On your own profile it is marked `\(hidden\)`.
        - `+finger/unhide <field>` shows it to everyone again.

        A field you hide stays hidden when you change it. It is the attribute's `visual` flag, so `` @set me/PROFILE`AGE=!visual `` hides it too.
      HELP`FINGER`STAFF: |-
        Staff with the `softcode.finger.edit` permission set anyone's fields. A game hands it out: `@role/allow wizard=softcode.finger.edit` gives it to every wizard, and `@permission/allow <player>=softcode.finger.edit` to one player.

        - `+finger/set <player>/<field>=<text>` sets one, and tells the player.
        - `+finger <player>` shows them every field, set or not, and which are hidden.

        A player's value is their `` PROFILE`<KEY> `` attribute, so the portal's profile page and other code read the same text.
      HELP`FINGER`FIELDS: |-
        The fields are attributes on the Finger object in the master room, one each, named `` FIELD`<view>`<order>`<KEY> `` with the label as the value:

        - `<view>` is `IC` for `+finger` or `OOC` for `+oocfinger`.
        - `<order>` sorts them. The shipped fields count in tens, so a new one fits between two.
        - `<KEY>` names the player's attribute, `` PROFILE`<KEY> ``, and is what `+finger/set` takes.

        To add a Height field to `+finger`, after Age:

        `` &FIELD`IC`035`HEIGHT <Finger>=Height ``

        To take Species away, clear its attribute: `` &FIELD`IC`040`SPECIES <Finger> ``. Players' values stay on them.

        ## Worked-out fields

        A field with a `` SHOW`<KEY> `` attribute beside it is worked out instead of set. It is evaluated with `%%<target>` the player and `%%<viewer>` the reader, and an empty result hides it from everyone but the player and staff. For example, the month the character was made:

        `` &FIELD`OOC`015`SINCE <Finger>=Playing since ``

        `` &SHOW`SINCE <Finger>=timefmt\($B $Y,csecs\(%%<target>\)\) ``

        ## Settings

        `+config finger` lists them, and `+config finger/<setting>=<value>` changes one.

        - `sections`: field keys shown under the rest, each below a line with its label, for text longer than a line. `QUOTE RPPREFS` by default.
        - `locked`: field keys only staff set. None by default; `+config/add finger/locked=occupation` adds one.
        - `columns`: how many columns the other fields are dealt into, 1 to 4. 2 by default.
        - `length`: the longest value, in characters. 1000 by default.


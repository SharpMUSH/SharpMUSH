format: "1.16"
package: world-grid-help
title: "World grid: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the +map topic into +help: registers the world-grid package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [world-grid, help, bridge]
category: Building
requires_server: ">=0.1"

# A bridge: world-grid keeps its topic on its World Grid object, and plus-help reads any object registered with its
# librarian. This package is only that registration.
depends:
  - package: world-grid
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/world-grid/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WORLD-GRID: |-
        {{world-grid/grid}}

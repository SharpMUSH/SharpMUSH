format: "1.10"
package: http-handler
version: 1.0.4
authors: [SharpMUSH]
description: "Inbound HTTP verb routers (GET/POST/…) for the configured http_handler object."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [http, api, router]
category: Web portal
requires_server: ">=0.1"

# Attach mode (decision 20.3): manages the verb-router attributes on the
# existing http_handler object ({{$http_handler}}, #8 by default). The base of
# the HTTP API — feature packages (e.g. profile-handler) depend on this and add
# their own routes as backtick children of these verbs.
objects:
  - ref: handler
    target: "{{$http_handler}}"
    attributes:
      # The handler passes the request by name: %<path> = path+query, %<body> =
      # the body (also %0 and %1). formq() decodes the query string into
      # %q<form.*>; @assert maps the path to VERB`PATH`SEGMENTS and 404s on a
      # missing route; @include runs the sub-handler with %0 = raw body, and
      # passes the named arguments (%<viewer>, %<hdr.<name>>, ...) on to it.
      GET: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,GET`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/GET`%q<attrpath>=%<body>
      POST: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,POST`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/POST`%q<attrpath>=%<body>
      PUT: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,PUT`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/PUT`%q<attrpath>=%<body>
      DELETE: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,DELETE`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/DELETE`%q<attrpath>=%<body>
      PATCH: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,PATCH`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/PATCH`%q<attrpath>=%<body>
      HEAD: |-
        think setq(fields,formq(after(%<path>,?))); @assert cand(setr(attrpath,edit(before(rest(%<path>,/),?),/,`)),hasattr(me,HEAD`%q<attrpath>))=@respond 404 API NOT FOUND; @include me/HEAD`%q<attrpath>=%<body>

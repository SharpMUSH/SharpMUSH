format: 1
package: common-functions
version: 1.1.0
authors: [SharpMUSH]
description: "Global UI-helper functions: header(), footer(), line() — titled rules across the reader's width, built on rule() so every reader, the web portal and screen readers get a real divider."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [ui, formatting, functions]
requires_server: ">=0.1"

# Create mode: a single owned thing carries the softcode the global functions evaluate. AINSTALL
# registers them once at install; STARTUP re-registers them on every boot (the global-function
# registry is in-memory) by walking the FUN` tree, so adding one is adding its subtree.
#
# Each function is self-describing via its FUN` attribute subtree:
#   FUN`<NAME>                  — the function body
#   FUN`<NAME>`MINARGS / MAXARGS — arg counts, read by @function so the registration has one source
#
# All three are rule() underneath, so they are layouts: an empty width draws at each reader's own
# width (a room @remit included), the game's layout_border option picks the style, a client without
# Unicode is sent ASCII, and the web portal draws a divider. A title too long for the line is cut by
# rule() itself.
objects:
  - ref: functions
    type: thing
    name: Common Functions
    attributes:
      # header(<title>[, <width>][, <type>]) — a rule with an optional title.
      #   width: empty (the usual) is each reader's own width; a number fixes it for everyone.
      #   type : center (default) | left | right — where the title sits.
      FUN`HEADER: |-
        rule(%0,%1,json(object,title,json(string,lcstr(firstof(%2,center)))))
      FUN`HEADER`MINARGS: |-
        0
      FUN`HEADER`MAXARGS: |-
        3

      # footer(<title>[, <width>][, <type>]) — the same rule, drawn at the bottom of a block.
      FUN`FOOTER: |-
        rule(%0,%1,json(object,title,json(string,lcstr(firstof(%2,center)))))
      FUN`FOOTER`MINARGS: |-
        0
      FUN`FOOTER`MAXARGS: |-
        3

      # line(<title>[, <width>]) — a lighter divider: the single style, sent as '-' to an ASCII client.
      FUN`LINE: |-
        rule(%0,%1,json(object,border,"single"))
      FUN`LINE`MAXARGS: |-
        2
      FUN`LINE`MINARGS: |-
        0

      # AINSTALL (once): just run STARTUP.
      AINSTALL: |-
        @trigger %!/STARTUP
      # STARTUP (every boot): re-establish the in-memory global-function registrations by WALKING the
      # FUN` tree, not by naming each function again here.
      #
      # lattr(FUN`*) lists the branch heads only — "*" does not cross a backtick — so FUN`HEADER is
      # listed and FUN`HEADER`MINARGS below it is not. Adding a function is adding its subtree, and
      # one cannot be half-added: declared as a subtree but forgotten in a registration list.
      #
      # after(%iL,FUN`), not rest(%iL,`): the backtick is part of one attribute name, not a list
      # delimiter, so the name is cut at a known prefix instead of split on it. %iL, not ##: ## is
      # spliced in as TEXT before evaluation; %iL substitutes the value.
      STARTUP: |-
        @dolist [lattr(%!/FUN`*)]={@function [lcstr(after(%iL,FUN`))]=%!,%iL,[get(%!/%iL`MINARGS)],[get(%!/%iL`MAXARGS)]}

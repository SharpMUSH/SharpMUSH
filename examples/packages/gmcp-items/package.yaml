format: "1.16"
package: gmcp-items
title: "GMCP inventory"
version: 1.2.0
authors: [SharpMUSH]
description: "Sends MUD clients the GMCP Char.Items package: what a player carries and what lies in their room, as Char.Items.List when asked or on arrival, and Char.Items.Add and Char.Items.Remove as things come and go."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [gmcp, mudlet, inventory, items, mud-kit]
category: MUD clients
requires_server: ">=0.1"


# The shapes are Iron Realms' (IRE), as TelnetNegotiationCore's ItemsList and ItemChange types write
# them. A location is inv (what the player carries) or room (the room they stand in):
#
#   Char.Items.Inv     client to server, no body: asks for the inventory
#   Char.Items.Room    client to server, no body: asks for the room's things
#   Char.Items.List    {"location":"inv","items":[{"id":"1234","name":"a lantern"}]}
#   Char.Items.Add     {"location":"room","item":{"id":"1234","name":"a lantern"}}
#   Char.Items.Remove  {"location":"room","item":{"id":"1234","name":"a lantern"}}
#
# id is the thing's dbref number as a string of digits, as Iron Realms sends it. Things only: a player
# is in Room.Players (gmcp-room), and an exit in Room.Info's exits. A DARK thing in a room is listed
# only to a player who may see everything; your own inventory lists everything you carry.
#
# Every send is oob(..., supported): Mudlet lists Char.Items; a client that listed nothing is sent
# everything.
objects:
  - ref: handler
    target: "{{$event_handler}}"
    attributes:
      # ── Settings ─────────────────────────────────────────────────────────
      FUN`GMCPITEMS`SETTING: |-
        get({{gmcp_items}}/DATA`CONFIG`%0)

      # ── Who and what ─────────────────────────────────────────────────────
      # %0 an object: a connected player, the only thing anything is sent to.
      FUN`GMCPITEMS`VIEWER: |-
        cand(hastype(%0,player),hasflag(%0,CONNECTED))
      # %0 a thing, %1 the viewer: whether the viewer sees it lying in a room.
      FUN`GMCPITEMS`SEEN: |-
        cor(not(hasflag(%0,DARK)),orflags(%1,Wr),haspower(%1,See_All))
      # %0 a viewer, %1 a thing: the same, with the viewer first, for filterbool().
      FUN`GMCPITEMS`WITNESS: |-
        u(me/FUN`GMCPITEMS`SEEN,%1,%0)
      # %0 a location word (inv or room), %1 the viewer: the things there they see.
      FUN`GMCPITEMS`THINGS: |-
        if(strmatch(%0,inv),lthings(%1),filterbool(me/FUN`GMCPITEMS`SEEN,lthings(loc(%1)),,,%1))
      # %0 a location word: whether the room setting lets it be sent.
      FUN`GMCPITEMS`SENDS: |-
        cor(strmatch(%0,inv),u(me/FUN`GMCPITEMS`SETTING,ROOM))

      # ── Payloads ─────────────────────────────────────────────────────────
      # One item: %0 a thing.
      FUN`GMCPITEMS`ITEM: |-
        json(object,id,json(string,after(num(%0),#)),name,json(string,name(%0)))
      # Char.Items.List: %0 the location word, %1 the viewer.
      FUN`GMCPITEMS`LIST: |-
        json(object,location,json(string,%0),items,json_array(iter(u(me/FUN`GMCPITEMS`THINGS,%0,%1),u(me/FUN`GMCPITEMS`ITEM,%i0),,%r),%r))
      # Char.Items.Add or Remove: %0 the location word, %1 the thing.
      FUN`GMCPITEMS`CHANGE: |-
        json(object,location,json(string,%0),item,u(me/FUN`GMCPITEMS`ITEM,%1))

      # ── Sending ──────────────────────────────────────────────────────────
      # %0 where to send (a player or a descriptor), %1 the viewer, %2 the location word: the list.
      FUN`GMCPITEMS`SENDLIST: |-
        if(u(me/FUN`GMCPITEMS`SENDS,%2),null(oob(%0,Char.Items.List,u(me/FUN`GMCPITEMS`LIST,%2,%1),supported)))
      # %0 Add or Remove, %1 a container the thing left or reached, %2 the thing. A player holding it is
      # sent an inv change; the connected players in a room who see it, a room change.
      FUN`GMCPITEMS`MOVED: |-
        switch(type(%1),PLAYER,u(me/FUN`GMCPITEMS`TELL,%0,inv,%1,%2),ROOM,if(u(me/FUN`GMCPITEMS`SENDS,room),u(me/FUN`GMCPITEMS`TELL,%0,room,filterbool(me/FUN`GMCPITEMS`WITNESS,filterbool(me/FUN`GMCPITEMS`VIEWER,lplayers(%1)),,,%2),%2)))
      # %0 Add or Remove, %1 the location word, %2 the players, %3 the thing.
      FUN`GMCPITEMS`TELL: |-
        null(oob(%2,Char.Items.%0,u(me/FUN`GMCPITEMS`CHANGE,%1,%3),supported))

      # ── The handlers ─────────────────────────────────────────────────────
      # A connected player who moved is sent the things in their new room. A thing that moved is taken
      # out of where it was and added where it went.
      OBJECT`MOVE`GMCPITEMS: |-
        think switch(type(%<objid>),PLAYER,if(u(me/FUN`GMCPITEMS`VIEWER,%<objid>),u(me/FUN`GMCPITEMS`SENDLIST,%<objid>,%<objid>,room)),THING,u(me/FUN`GMCPITEMS`MOVED,Remove,%<origin>,%<objid>)[u(me/FUN`GMCPITEMS`MOVED,Add,%<destination>,%<objid>)])
      # A new connection is sent both lists on its own descriptor.
      PLAYER`CONNECT`GMCPITEMS: |-
        think u(me/FUN`GMCPITEMS`SENDLIST,%<descriptor>,%<objid>,inv)[u(me/FUN`GMCPITEMS`SENDLIST,%<descriptor>,%<objid>,room)]
      # The client asks: Char.Items.Inv or Char.Items.Room, from a logged-in connection. The answer goes
      # to the descriptor that asked.
      SOCKET`GMCP`GMCPITEMS: |-
        @assert cand(strlen(%<player>),match(Char.Items.Inv Char.Items.Room,%<package>)); think u(me/FUN`GMCPITEMS`SENDLIST,%<descriptor>,%<player>,switch(%<package>,Char.Items.Inv,inv,room))

  # ---- settings and help ----------------------------------------------------
  - ref: gmcp_items
    type: thing
    name: GMCP Items
    flags: [no_command]
    attributes:
      DATA`CONFIG:
        value: |-
          What the GMCP Items package tells a client about things.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        GMCP Items
      DATA`CONFIG`ROOM: |-
        1
      DATA`CONFIG`ROOM`TYPE: |-
        boolean
      DATA`CONFIG`ROOM`DEFAULT: |-
        1
      DATA`CONFIG`ROOM`DESCRIPTION: |-
        Whether a client is told the things lying in its player's room, or only what they carry.
      DATA`CONFIG`ROOM`LABEL: |-
        Room things
      DATA`CONFIG`ROOM`EXAMPLE: |-
        off
      HELP: |-
        What you carry and what lies about, for a MUD client's inventory window, over GMCP.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`GMCP`ITEMS: |-
        gmcp room|gmcp char
      HELP`GMCP`ITEMS: |-
        A MUD client such as **Mudlet** can show what you carry and what lies in the room in a window of its own, from the GMCP **Char.Items** package:

        - When you connect, and when your client asks, it is sent **Char.Items.List**: what you carry, and what lies in your room.
        - When you move, it is sent the things in your new room.
        - When a thing reaches or leaves your hands or your room, it is sent **Char.Items.Add** or **Char.Items.Remove**.

        Players are not items: your client lists them from the Room package. See `+help gmcp room`.

        Staff: `+config gmcp-items`.

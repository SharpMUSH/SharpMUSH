format: "1.16"
package: timeline-help
title: "IC timeline: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the IC timeline topics into +help: registers the timeline package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [timeline, help, bridge]
category: Scenes
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. timeline keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: timeline
    version: ">=1.1"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/timeline/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`TIMELINE: |-
        {{timeline/timeline_help}}

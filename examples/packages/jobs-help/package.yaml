format: "1.16"
package: jobs-help
title: "Jobs: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Jobs topics into +help: registers the jobs package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [jobs, help, bridge]
category: Staff
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. jobs keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: jobs
    version: ">=1.15"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/jobs/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`JOBS: |-
        {{jobs/jobs_help}}

format: "1.16"
package: jobs-config
title: "Jobs: +config settings"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Jobs settings into +config: registers them with the +config registry, so staff see and change them with +config jobs, and points its messages at +config."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [jobs, config, bridge]
category: Staff
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. jobs declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the leaf that tells the +config registry where they are, and the lines that point its messages at +config.
depends:
  - package: jobs
    version: ">=1.16"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/jobs/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`JOBS: |-
        {{jobs/jobs}}

  # Lines the jobs package's messages end with when +config is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{jobs/jobs}}"
    attributes:
      HINT`DEFAULT-BUCKET: |-
        Point +config jobs/default-bucket elsewhere first.

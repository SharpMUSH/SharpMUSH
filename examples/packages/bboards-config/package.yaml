format: "1.16"
package: bboards-config
title: "Bulletin boards: +config settings"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Bulletin boards settings into +config: registers them with the +config registry, so staff see and change them with +config bboards, and points its messages at +config."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [bboards, config, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. bboards declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the leaf that tells the +config registry where they are, and the lines that point its messages at +config.
depends:
  - package: bboards
    version: ">=1.7"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/bboards/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`BBOARDS: |-
        {{bboards/bboards}}

  # Lines the bboards package's messages end with when +config is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{bboards/bboards}}"
    attributes:
      HINT`DEFAULTS: |-
        ·%b+config bboards changes the defaults.
      HINT`DEFAULT: |-
        +config bboards/default-%0=<value> changes it.

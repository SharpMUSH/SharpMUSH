format: "1.20"
package: casefiles-help
title: "Case files: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the case file topics into +help: registers the casefiles package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [casefile, wiki, help, bridge]
category: Roleplay
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. casefiles keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: casefiles
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/casefiles/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: casefiles_help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`CASEFILES: |-
        {{casefiles/casefiles_help}}

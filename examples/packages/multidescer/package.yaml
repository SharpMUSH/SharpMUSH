format: "1.16"
package: multidescer
title: "Multi-descer"
version: 1.1.0
authors: [SharpMUSH]
description: "+desc, +wear and +remove: save whole descriptions and pieces of one, wear them alone or layered by slot, keep outfits, and set a +shortdesc."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [desc, description, outfit, wardrobe, roleplay]
category: Characters
requires_server: ">=1.0"

depends:
  - package: http-handler
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main


objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # the MULTIDESC tree and DESCRIBE on characters, and tells a room about a /noisy change with @remit/spoof.
  #
  # +desc, +wear, +remove and +shortdesc are added with @command/add and hooked to CMD`<word>, so what a player
  # types is evaluated once, as that player, as a built-in command's argument is. The hook runs with
  # /localize/clearregs, so a register the argument sets never reaches the code.
  #
  # A character keeps their own wardrobe, its root flagged wizard and no_command the first time it is written, so
  # only this object changes it:
  #   MULTIDESC`PIECE`<id>`NAME, SLOT, TEXT   a saved piece; a whole description is a piece in the whole slot
  #   MULTIDESC`OUTFIT`<id>`NAME, PIECES     a saved set of piece ids
  #   MULTIDESC`WORN                          the piece ids worn now, in the order they were put on
  # TEXT holds decompose() of what was typed, so DESCRIBE, which look evaluates, gives back what the player typed
  # and never runs it a second time. A piece saved from the player's own @describe keeps its code as written.
  # Every change writes the pieces worn, in slot order, into DESCRIBE, so look and the portal read it as usual.
  # SHORTDESC is a plain attribute on the character, the text as typed.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC`<section>` one routine per
  # switch, FUN`PIECE`, FUN`OUTFIT`, FUN`WORN` and FUN`SLOT` read the data, FUN`ASSEMBLE` builds a description,
  # FUN`DISPLAY` draws. DATA`CONFIG` the settings +config multidescer shows, DATA`ROUTE` the switches.
  - ref: multidescer
    type: thing
    name: Multi-descer
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      DATA: |-
        Settings and constants.
      # ---- Settings: +config multidescer ---------------------------------------
      DATA`CONFIG:
        value: |-
          Saved descriptions, pieces, outfits and short descriptions.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Multi-descer
      DATA`CONFIG`NAME-LENGTH: |-
        30
      DATA`CONFIG`NAME-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`NAME-LENGTH`DEFAULT: |-
        30
      DATA`CONFIG`NAME-LENGTH`MIN: |-
        1
      DATA`CONFIG`NAME-LENGTH`MAX: |-
        60
      DATA`CONFIG`NAME-LENGTH`DESCRIPTION: |-
        The longest name of a piece or outfit, in characters.
      DATA`CONFIG`NAME-LENGTH`LABEL: |-
        Longest name
      DATA`CONFIG`LENGTH: |-
        8000
      DATA`CONFIG`LENGTH`TYPE: |-
        integer
      DATA`CONFIG`LENGTH`DEFAULT: |-
        8000
      DATA`CONFIG`LENGTH`MIN: |-
        1
      DATA`CONFIG`LENGTH`MAX: |-
        1000000
      DATA`CONFIG`LENGTH`DESCRIPTION: |-
        The longest text of one piece, in characters. The game's own limit on an attribute's length caps it too.
      DATA`CONFIG`LENGTH`LABEL: |-
        Longest piece
      DATA`CONFIG`MAX-ENTRIES: |-
        100
      DATA`CONFIG`MAX-ENTRIES`TYPE: |-
        integer
      DATA`CONFIG`MAX-ENTRIES`DEFAULT: |-
        100
      DATA`CONFIG`MAX-ENTRIES`MIN: |-
        1
      DATA`CONFIG`MAX-ENTRIES`MAX: |-
        1000
      DATA`CONFIG`MAX-ENTRIES`DESCRIPTION: |-
        How many pieces and outfits one character may keep, counted together.
      DATA`CONFIG`MAX-ENTRIES`LABEL: |-
        Pieces and outfits per character
      DATA`CONFIG`SHORT-LENGTH: |-
        100
      DATA`CONFIG`SHORT-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`SHORT-LENGTH`DEFAULT: |-
        100
      DATA`CONFIG`SHORT-LENGTH`MIN: |-
        10
      DATA`CONFIG`SHORT-LENGTH`MAX: |-
        400
      DATA`CONFIG`SHORT-LENGTH`DESCRIPTION: |-
        The longest +shortdesc, in characters. A longer one is refused, not cut.
      DATA`CONFIG`SHORT-LENGTH`LABEL: |-
        Longest short description
      # The slots a piece is worn in, a +config table: entries on the store under SLOT`, each holding its order,
      # with PARAGRAPH, COVERS and MAX beneath.
      DATA`CONFIG`SLOTS`TYPE: |-
        table
      DATA`CONFIG`SLOTS`LABEL: |-
        Slots
      DATA`CONFIG`SLOTS`DESCRIPTION: |-
        Where a piece is worn, in the order a description is put together.
      DATA`CONFIG`SLOTS`STORE: |-
        {{store}}
      DATA`CONFIG`SLOTS`PATH: |-
        SLOT
      DATA`CONFIG`SLOTS`ENTRY: |-
        order
      DATA`CONFIG`SLOTS`FIELDS: |-
        order paragraph covers max
      DATA`CONFIG`SLOTS`KEYPATTERN: |-
        ^[A-Za-z0-9_]{1,20}$
      DATA`CONFIG`SLOTS`FIELD`ORDER`TYPE: |-
        integer
      DATA`CONFIG`SLOTS`FIELD`ORDER`MIN: |-
        1
      DATA`CONFIG`SLOTS`FIELD`ORDER`MAX: |-
        998
      DATA`CONFIG`SLOTS`FIELD`ORDER`LABEL: |-
        Order
      DATA`CONFIG`SLOTS`FIELD`ORDER`DESCRIPTION: |-
        Where its pieces come in the description. Lower comes first.
      DATA`CONFIG`SLOTS`FIELD`PARAGRAPH`TYPE: |-
        text
      DATA`CONFIG`SLOTS`FIELD`PARAGRAPH`MAX: |-
        20
      DATA`CONFIG`SLOTS`FIELD`PARAGRAPH`LABEL: |-
        Paragraph
      DATA`CONFIG`SLOTS`FIELD`PARAGRAPH`DESCRIPTION: |-
        Slots with the same paragraph share one, their pieces joined by a space. Another paragraph starts after a blank line.
      DATA`CONFIG`SLOTS`FIELD`COVERS`TYPE: |-
        list
      DATA`CONFIG`SLOTS`FIELD`COVERS`LABEL: |-
        Covers
      DATA`CONFIG`SLOTS`FIELD`COVERS`DESCRIPTION: |-
        Slots whose pieces are hidden while something is worn in this one.
      DATA`CONFIG`SLOTS`FIELD`MAX`TYPE: |-
        integer
      DATA`CONFIG`SLOTS`FIELD`MAX`DEFAULT: |-
        0
      DATA`CONFIG`SLOTS`FIELD`MAX`MIN: |-
        0
      DATA`CONFIG`SLOTS`FIELD`MAX`MAX: |-
        100
      DATA`CONFIG`SLOTS`FIELD`MAX`LABEL: |-
        Max
      DATA`CONFIG`SLOTS`FIELD`MAX`DESCRIPTION: |-
        How many pieces may be worn in it at once; putting on another takes off the oldest. 0 is no limit, shown as none.
      # %0 a length in characters: no more than an attribute holds, which is the game's
      # max_attribute_value_length.
      FUN`CAP: |-
        min(%0,config(max_attribute_value_length))
      # What a character's root attribute says when the package first writes it.
      DATA`ROOT: |-
        A character's saved descriptions: PIECE`<id> (NAME, SLOT, TEXT), OUTFIT`<id> (NAME, PIECES) and WORN. Written by the Multi-descer.
      # The piece a character's own description is saved as the first time they use the package.
      DATA`ORIGINAL: |-
        original
      # Which INC` routine each switch runs, per command. BARE is the command alone, ARG the command with something
      # after it, SET the same with an =.
      DATA`ROUTE: |-
        Which routine each switch runs. One branch per command, one leaf per switch.
      DATA`ROUTE`DESC`BARE: |-
        LIST`SHOW
      DATA`ROUTE`DESC`ARG: |-
        WEAR`ONLY
      DATA`ROUTE`DESC`SET: |-
        PIECE`SAVE
      DATA`ROUTE`DESC`SAVE: |-
        PIECE`SAVE
      DATA`ROUTE`DESC`REPLACE: |-
        PIECE`REPLACE
      DATA`ROUTE`DESC`VIEW: |-
        LIST`VIEW
      DATA`ROUTE`DESC`RENAME: |-
        ENTRY`RENAME
      DATA`ROUTE`DESC`DELETE: |-
        ENTRY`DELETE
      DATA`ROUTE`DESC`OUTFIT: |-
        OUTFIT`SAVE
      DATA`ROUTE`DESC`SLOTS: |-
        LIST`SLOTS
      DATA`ROUTE`WEAR`BARE: |-
        LIST`SHOW
      DATA`ROUTE`WEAR`ARG: |-
        WEAR`ADD
      DATA`ROUTE`REMOVE`BARE: |-
        REMOVE`NOTHING
      DATA`ROUTE`REMOVE`ARG: |-
        REMOVE`SOME
      DATA`ROUTE`REMOVE`ALL: |-
        REMOVE`ALL
      DATA`ROUTE`SHORTDESC`BARE: |-
        SHORT`SHOW
      DATA`ROUTE`SHORTDESC`ARG: |-
        SHORT`SET
      DATA`ROUTE`SHORTDESC`CLEAR: |-
        SHORT`CLEAR
      # The routines /noisy may be given with: they change what the character has on.
      DATA`NOISY: |-
        WEAR`ONLY WEAR`ADD REMOVE`SOME REMOVE`ALL

      # Every routine works on %q<md_who>, the player, and tells %q<md_tell>: both %# for a typed command, and for
      # the portal the viewer and this object, which hears nothing. FUN`NOTICE is the line a routine tells: %0 the
      # text, %1 warn or error for a refusal. It keeps the lines in %q<md_said>, one per line, and sets %q<md_refused>
      # on a refusal, so the portal can answer with them.
      FUN`NOTICE:
        value: |-
          setq(md_said,if(strlen(%q<md_said>),%q<md_said>%r)%0)[if(member(warn error,%1),setq(md_refused,1))][if(strlen(%1),notice(DESC,%0,%1),notice(DESC,%0))]
        flags: [funsyntax]

      # ---- commands -------------------------------------------------------------
      # Each command word: %1 the switches and %2 what follows, exactly as typed.
      CMD`DESC:
        value: |-
          $(?is)^\+desc(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,desc,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`WEAR:
        value: |-
          $(?is)^\+wear(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,wear,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`REMOVE:
        value: |-
          $(?is)^\+remove(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,remove,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`SHORTDESC:
        value: |-
          $(?is)^\+shortdesc(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,shortdesc,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(DESC,Only players use +%<word>.,warn); think setq(md_who,%#)[setq(md_tell,%#)]; think u(%!/FUN`COMMAND`PARSE,%<word>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %q<md_tell>=u(%!/FUN`NOTICE,Use one switch at a time%, besides /noisy.,warn); @assert strlen(%q<cmd_route>)=@pemit %q<md_tell>=u(%!/FUN`NOTICE,+%q<cmd_word> has no /%q<cmd_switch> switch. +help %q<cmd_word> lists them.,warn); @assert cor(not(%q<cmd_noisy>),member(v(DATA`NOISY),%q<cmd_route>))=@pemit %q<md_tell>=u(%!/FUN`NOTICE,/noisy goes with a change to what you have on.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 the switches and %2 the argument, as typed. Sets cmd_word, cmd_switch_list, cmd_noisy (1 when
      # /noisy was given, which is then left out of the list), cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side
      # and cmd_right_side around the first =, cmd_has_slash, cmd_slot and cmd_name around the first / of the left
      # side, and cmd_route, the INC` routine to run.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_switch_list,lcstr(trim(edit(%1,/,%b))),
          cmd_noisy,t(member(%q<cmd_switch_list>,noisy)),
          cmd_switch_list,trim(squish(iter(%q<cmd_switch_list>,if(comp(%i0,noisy),%i0)))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%2),
          cmd_has_equals,t(pos(=,%2)),
          cmd_left_side,trim(before(%2,=)),
          cmd_right_side,trim(after(%2,=)),
          cmd_has_slash,t(pos(/,%q<cmd_left_side>)),
          cmd_slot,if(%q<cmd_has_slash>,lcstr(trim(before(%q<cmd_left_side>,/)))),
          cmd_name,if(%q<cmd_has_slash>,trim(after(%q<cmd_left_side>,/)),%q<cmd_left_side>),
          cmd_route,if(regmatch(%q<cmd_switch>,^%[a-z%]*$),get(%!/DATA`ROUTE`[ucstr(%q<cmd_word>)]`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(%q<cmd_has_equals>,SET,if(strlen(%q<cmd_argument>),ARG,BARE)))])))
        flags: [funsyntax]

      # ---- slots ------------------------------------------------------------------
      # %0 a slot name, any case: 1 when the game has it.
      FUN`SLOT`EXISTS:
        value: |-
          cand(lte(strlen(%0),20),regmatch(%0,^%[A-Za-z0-9_%]+$),hasattr({{store}},SLOT`%0))
        flags: [funsyntax]
      # The slot names, in order.
      FUN`SLOT`NAMES:
        value: |-
          lcstr(sortkey(%!/FUN`SLOT`ORDER,iter(lattr({{store}}/SLOT`*),after(%i0,`)),n))
        flags: [funsyntax]
      # %0 a slot name: its order. A slot the game no longer has comes last.
      FUN`SLOT`ORDER:
        value: |-
          if(u(%!/FUN`SLOT`EXISTS,%0),get({{store}}/SLOT`%0),999)
        flags: [funsyntax]
      # %0 a slot name: its paragraph, or the slot's own name when it has none. A slot the game no longer has is a
      # paragraph of its own.
      FUN`SLOT`PARAGRAPH:
        value: |-
          if(u(%!/FUN`SLOT`EXISTS,%0),firstof(get({{store}}/SLOT`%0`PARAGRAPH),%0),~%0)
        flags: [funsyntax]
      FUN`SLOT`COVERS:
        value: |-
          if(u(%!/FUN`SLOT`EXISTS,%0),lcstr(get({{store}}/SLOT`%0`COVERS)))
        flags: [funsyntax]
      FUN`SLOT`MAX:
        value: |-
          if(u(%!/FUN`SLOT`EXISTS,%0),firstof(get({{store}}/SLOT`%0`MAX),0),0)
        flags: [funsyntax]

      # ---- reading the wardrobe ---------------------------------------------------
      # All of these read the character running the command, %q<md_who>.
      # %0 PIECE or OUTFIT: the ids of that kind.
      FUN`ENTRY`IDS:
        value: |-
          iter(lattr(%q<md_who>/MULTIDESC`%0`*`NAME),extract(%i0,3,1,`))
        flags: [funsyntax]
      # %0 PIECE or OUTFIT: the next free id of that kind. MULTIDESC`TOP`<kind> holds the highest id deleted, so an
      # id is never given out twice and a page left open on a deleted entry cannot reach a new one.
      FUN`ENTRY`NEXT:
        value: |-
          inc(lmath(max,[firstof(get(%q<md_who>/MULTIDESC`TOP`%0),0)] [u(%!/FUN`ENTRY`IDS,%0)]))
        flags: [funsyntax]
      # How many pieces and outfits there are.
      FUN`ENTRY`COUNT:
        value: |-
          add(words(u(%!/FUN`ENTRY`IDS,PIECE)),words(u(%!/FUN`ENTRY`IDS,OUTFIT)))
        flags: [funsyntax]
      # Every entry, as PIECE`<id> or OUTFIT`<id>: a reference that is also the start of its attribute names.
      FUN`ENTRY`REFS:
        value: |-
          trim(iter(u(%!/FUN`ENTRY`IDS,PIECE),PIECE`%i0) [iter(u(%!/FUN`ENTRY`IDS,OUTFIT),OUTFIT`%i0)])
        flags: [funsyntax]
      # %0 a reference: its name.
      FUN`ENTRY`NAME:
        value: |-
          get(%q<md_who>/MULTIDESC`%0`NAME)
        flags: [funsyntax]
      FUN`ENTRY`ISOUTFIT:
        value: |-
          strmatch(%0,OUTFIT`*)
        flags: [funsyntax]
      # %0 a typed name: the entry with exactly that name, any case.
      FUN`ENTRY`EXACT:
        value: |-
          first(filterbool(%!/FUN`ENTRY`NAMED,u(%!/FUN`ENTRY`REFS),,,lcstr(%0)))
        flags: [funsyntax]
      # %0 a typed name: the entry with that name, or the only one whose name starts with it.
      FUN`ENTRY`FIND:
        value: |-
          firstof(u(%!/FUN`ENTRY`EXACT,%0),if(eq(words(setr(entry_prefixed,filterbool(%!/FUN`ENTRY`STARTS,u(%!/FUN`ENTRY`REFS),,,lcstr(%0)))),1),%q<entry_prefixed>))
        flags: [funsyntax]
      FUN`ENTRY`NAMED:
        value: |-
          not(comp(lcstr(u(%!/FUN`ENTRY`NAME,%0)),%1))
        flags: [funsyntax]
      FUN`ENTRY`STARTS:
        value: |-
          not(comp(lcstr(left(u(%!/FUN`ENTRY`NAME,%0),strlen(%1))),%1))
        flags: [funsyntax]
      # %0 a reference: the piece ids it stands for. A piece is itself, an outfit its pieces that still exist.
      FUN`ENTRY`PIECES:
        value: |-
          if(u(%!/FUN`ENTRY`ISOUTFIT,%0),filterbool(%!/FUN`PIECE`EXISTS,get(%q<md_who>/MULTIDESC`%0`PIECES)),after(%0,`))
        flags: [funsyntax]
      # %0 a name as typed: why it cannot name a piece or outfit, or nothing.
      FUN`NAME`PROBLEM:
        value: |-
          cond(not(strlen(%0)),Give it a name.,gt(strlen(%0),get(%!/DATA`CONFIG`NAME-LENGTH)),Keep a name to [get(%!/DATA`CONFIG`NAME-LENGTH)] characters.,not(regmatch(%0,^%[A-Za-z0-9%]%[A-Za-z0-9 _'-%]*$)),A name is letters%, digits%, spaces%, _ ' and -%, and starts with a letter or digit.,)
        flags: [funsyntax]
      # %0 text: why it cannot be kept as a piece, or nothing.
      FUN`TEXT`PROBLEM:
        value: |-
          cond(not(strlen(%0)),A piece needs some text.,gt(strlen(%0),u(%!/FUN`CAP,get(%!/DATA`CONFIG`LENGTH))),Keep a piece to [u(%!/FUN`CAP,get(%!/DATA`CONFIG`LENGTH))] characters. That one is [strlen(%0)].,)
        flags: [funsyntax]
      # 1 when %0 more attributes fit on the character.
      FUN`ROOM:
        value: |-
          lte(add(nattr(%q<md_who>/**),%0),config(max_attrs_per_obj))
        flags: [funsyntax]
      # %0 a piece id.
      FUN`PIECE`EXISTS:
        value: |-
          cand(isint(%0),hasattr(%q<md_who>,MULTIDESC`PIECE`%0`NAME))
        flags: [funsyntax]
      FUN`PIECE`NAME:
        value: |-
          get(%q<md_who>/MULTIDESC`PIECE`%0`NAME)
        flags: [funsyntax]
      FUN`PIECE`SLOT:
        value: |-
          lcstr(get(%q<md_who>/MULTIDESC`PIECE`%0`SLOT))
        flags: [funsyntax]
      FUN`PIECE`TEXT:
        value: |-
          get(%q<md_who>/MULTIDESC`PIECE`%0`TEXT)
        flags: [funsyntax]
      # %0 a piece id, %1 a slot: 1 when the piece is worn in it.
      FUN`PIECE`INSLOT:
        value: |-
          not(comp(u(%!/FUN`PIECE`SLOT,%0),%1))
        flags: [funsyntax]
      # %0 piece ids: their names, as a sentence.
      FUN`PIECE`NAMES:
        value: |-
          itemize(iter(%0,u(%!/FUN`PIECE`NAME,%i0),%b,|),|)
        flags: [funsyntax]
      # The piece ids worn now, in the order they were put on.
      FUN`WORN:
        value: |-
          filterbool(%!/FUN`PIECE`EXISTS,get(%q<md_who>/MULTIDESC`WORN))
        flags: [funsyntax]
      # %0 piece ids: each once, where it first comes.
      FUN`WORN`UNIQUE:
        value: |-
          squish(iter(%0,if(eq(match(%0,%i0),inum(0)),%i0)))
        flags: [funsyntax]
      # %0 piece ids in the order put on: those that stay on when a slot holds no more than its MAX. The latest
      # stay; the oldest come off.
      FUN`WORN`LIMIT:
        value: |-
          squish(iter(%0,if(cor(not(setr(limit_max,u(%!/FUN`SLOT`MAX,setr(limit_slot,u(%!/FUN`PIECE`SLOT,%i0))))),lt(words(filterbool(%!/FUN`PIECE`INSLOT,extract(%0,inc(inum(0)),words(%0)),,,%q<limit_slot>)),%q<limit_max>)),%i0)))
        flags: [funsyntax]
      # %0 piece ids worn: the slots their slots cover.
      FUN`WORN`COVERED:
        value: |-
          setunion(iter(%0,u(%!/FUN`SLOT`COVERS,u(%!/FUN`PIECE`SLOT,%i0))),)
        flags: [funsyntax]
      # %0 a piece id, %1 piece ids coming off: 1 when %0 stays on.
      FUN`WORN`KEEP:
        value: |-
          not(member(%1,%0))
        flags: [funsyntax]
      # %0 piece ids worn, %1 the slots covered: 1 when piece %0 shows.
      FUN`WORN`SHOWS:
        value: |-
          not(member(%1,u(%!/FUN`PIECE`SLOT,%0)))
        flags: [funsyntax]

      # ---- putting a description together -----------------------------------------
      # %0 piece ids worn: those that show, in slot order, and in the order put on within a slot.
      FUN`ASSEMBLE`ORDER:
        value: |-
          setq(assemble_covered,u(%!/FUN`WORN`COVERED,%0))[iter(sort(iter(filterbool(%!/FUN`WORN`SHOWS,%0,,,%q<assemble_covered>),rjust(u(%!/FUN`SLOT`ORDER,u(%!/FUN`PIECE`SLOT,%i0)),3,0)[rjust(match(%0,%i0),4,0)]~%i0)),after(%i0,~))]
        flags: [funsyntax]
      # %0 piece ids worn: the description, as code for DESCRIBE. Each piece is a u() of its own TEXT, so it is
      # evaluated on its own as look evaluates a description (a piece saved from code that starts with a call still
      # calls it), and DESCRIBE stays short however long the pieces are. Pieces in one paragraph are joined by a
      # space, and a blank line comes between paragraphs.
      FUN`ASSEMBLE:
        value: |-
          setq(assemble_ids,u(%!/FUN`ASSEMBLE`ORDER,%0))[iter(%q<assemble_ids>,if(gt(inum(0),1),if(comp(u(%!/FUN`SLOT`PARAGRAPH,u(%!/FUN`PIECE`SLOT,extract(%q<assemble_ids>,dec(inum(0)),1))),u(%!/FUN`SLOT`PARAGRAPH,u(%!/FUN`PIECE`SLOT,%i0))),%r%r,%b))%[u%(%%!/MULTIDESC`PIECE`%i0`TEXT%)%],%b,)]
        flags: [funsyntax]

      # ---- display ----------------------------------------------------------------
      DATA`TEMPLATE`DISPLAY`TABLEOPTIONS: |-
        {"rule":"","delim":"","nowrap":"","priority":"","grow":""}
      # Table options, every list split by a new line: %0 the columns that never wrap, %1 each column's
      # priority, %2 each column's share of the spare width.
      FUN`DISPLAY`TABLEOPTIONS:
        value: |-
          json_fill(v(DATA`TEMPLATE`DISPLAY`TABLEOPTIONS),/delim,%r,/nowrap,%0,/priority,%1,/grow,%2)
        flags: [funsyntax]
      DATA`TEMPLATE`DISPLAY`FRAME: |-
        {"side":"","corner":"","teel":"","teer":"","pad":0}
      # A card: %<body>, %<title> and a muted %<footer> under a line; %<copied> 1 for text a reader copies, which
      # is drawn without sides.
      FUN`DISPLAY`CARD:
        value: |-
          setq(card_body,%<body>%r[rule()]%r[tone(muted,%<footer>)])[if(%<copied>,box(%q<card_body>,%<title>,,v(DATA`TEMPLATE`DISPLAY`FRAME)),box(%q<card_body>,%<title>))]
        flags: [funsyntax]
      # %0 a piece id: worn, covered, or nothing.
      FUN`DISPLAY`STATE:
        value: |-
          cond(not(member(%q<list_worn>,%0)),-,member(%q<list_covered>,u(%!/FUN`PIECE`SLOT,%0)),covered,worn)
        flags: [funsyntax]
      # The pieces, in slot order then by name, and then the outfits by name.
      FUN`DISPLAY`ROWS:
        value: |-
          trim(iter(sortkey(%!/FUN`DISPLAY`PIECEKEY,u(%!/FUN`ENTRY`IDS,PIECE)),PIECE`%i0) [iter(sortkey(%!/FUN`DISPLAY`OUTFITKEY,u(%!/FUN`ENTRY`IDS,OUTFIT)),OUTFIT`%i0)])
        flags: [funsyntax]
      FUN`DISPLAY`PIECEKEY:
        value: |-

      # below) run WEB`SCHEMA, WEB`DATA, WEB`ACT and WEB`ANSWER here with @force, so they run as this object, with
      # %<viewer> the character the portal signed in as. They set %q<md_who> to the viewer and %q<md_tell> to this
      # object, so a change from the portal runs the very routines the commands do, and what those routines tell the
      # player comes back in %q<md_said> for the answer. Each leaves its JSON in %q<web_answer>.
      #
      # The sub-path %q<form.at> is empty for the list, piece/<id> for a piece, outfit/<id> for an outfit.
      WEB`SCHEMA:
        value: |-
          think setq(md_who,%<viewer>)[setq(web_answer,u(%!/WEB`SCHEMA`FOR,%q<form.at>))]
        flags: [cmdsyntax]
      WEB`DATA:

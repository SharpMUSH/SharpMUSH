      WEB`GUIDE`ORDER:
        value: |-
          u(%!/FUN`SLOT`ORDER,extract(%0,2,1,~))
        flags: [funsyntax]
      WEB`GUIDE`PLAIN:
        value: |-
          not(strlen(u(%!/FUN`SLOT`COVERS,extract(%0,2,1,~))))
        flags: [funsyntax]
      WEB`GUIDE`HIDES:
        value: |-
          t(strlen(u(%!/FUN`SLOT`COVERS,extract(%0,2,1,~))))
        flags: [funsyntax]
      WEB`GUIDE`COVERED:
        value: |-
          t(member(%1,extract(%0,2,1,~)))
        flags: [funsyntax]
      WEB`GUIDE`SHOWN:
        value: |-
          not(member(%1,extract(%0,2,1,~)))
        flags: [funsyntax]
      # %0 entries: their text joined as a description is, a space within a paragraph and a blank line between.
      WEB`GUIDE`JOIN:
        value: |-
          iter(%0,[if(gt(inum(0),1),if(comp(u(%!/FUN`SLOT`PARAGRAPH,extract(extract(%0,dec(inum(0)),1,|),2,1,~)),u(%!/FUN`SLOT`PARAGRAPH,extract(%i0,2,1,~))),%r%r,%b))][extract(%i0,3,1,~)],|,)
        flags: [funsyntax]
      # %0 entries: their names in bold, as a sentence.
      WEB`GUIDE`NAMES:
        value: |-
          itemize(iter(%0,**[extract(%i0,1,1,~)]**,|,|),|)
        flags: [funsyntax]
      # A step: key %0, title %1, order %2, one section named %3 holding elements %4.
      WEB`GUIDE`PAGE:
        value: |-
          json(object,key,json(string,%0),title,json(string,%1),order,%2,sections,u(%!/WEB`ARRAY,u(%!/WEB`SECTION,%3,1,%4)))
        flags: [funsyntax]
      WEB`MD:
        value: |-
          json(object,kind,json(string,markdown),value,json(string,%0))
        flags: [funsyntax]
      WEB`GUIDE`PIECES:
        value: |-
          u(%!/WEB`GUIDE`PAGE,pieces,Pieces,1,What a piece is,v(DATA`WEB`EL`BACK)%r[u(%!/WEB`MD,v(DATA`WEB`GUIDE`PIECES))][if(words(%q<g_base>,|),%r[u(%!/WEB`MD,v(DATA`WEB`GUIDE`PIECES`EXAMPLE))]%r[v(DATA`WEB`EL`GUIDEEXAMPLE)]%r[u(%!/WEB`MD,v(DATA`WEB`GUIDE`PIECES`TOGETHER))]%r[u(%!/WEB`PREVIEW,u(%!/WEB`GUIDE`JOIN,%q<g_base>),)])])
        flags: [funsyntax]

        flags: [funsyntax]
      WEB`GUIDE`HIDING:
        value: |-
          u(%!/WEB`GUIDE`PAGE,hiding,Hiding and limits,3,When slots meet,u(%!/WEB`MD,v(DATA`WEB`GUIDE`HIDING))%r[if(cand(words(%q<g_tops>,|),words(%q<g_hidden>,|)),[u(%!/WEB`MD,Add [u(%!/WEB`GUIDE`NAMES,%q<g_tops>)] to the example. [u(%!/WEB`GUIDE`NAMES,%q<g_hidden>)] [if(gt(words(%q<g_hidden>,|),1),stay,stays)] on but drop[if(gt(words(%q<g_hidden>,|),1),,s)] out of the description while it is worn:)]%r[u(%!/WEB`PREVIEW,u(%!/WEB`GUIDE`JOIN,%q<g_shown>),)],u(%!/WEB`MD,if(strlen(u(%!/WEB`GUIDE`ANYHIDES)),The Slots step names the slots that hide others.,In this game no slot hides another.)))])
        flags: [funsyntax]

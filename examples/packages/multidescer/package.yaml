      WEB`GUIDE`ANYHIDES:
        value: |-
          filterbool(%!/WEB`GUIDE`SLOTHIDES,u(%!/FUN`SLOT`NAMES))
        flags: [funsyntax]
      WEB`GUIDE`SLOTHIDES:
        value: |-
          t(strlen(u(%!/FUN`SLOT`COVERS,%0)))
        flags: [funsyntax]
      WEB`GUIDE`WEARING:
        value: |-
          u(%!/WEB`GUIDE`PAGE,wearing,Wearing and outfits,4,Putting it on,u(%!/WEB`MD,v(DATA`WEB`GUIDE`WEARING))%r[v(DATA`WEB`EL`GUIDEDONE)])
        flags: [funsyntax]
      # The example pieces, name~slot~text, |-separated. One whose slot the game does not have is left out.
      DATA`WEB`GUIDE`EXAMPLE: |-
        build~body~Tall and lean, with salt-weathered hands.|eyes~face~Grey eyes, steady and patient.|braid~hair~Dark hair in a single braid.|shirt~top~A linen shirt, sleeves rolled to the elbow.|oilskin~outer~An oilskin coat, grey with old spray.|boots~feet~Salt-stained boots.
      DATA`WEB`GUIDE`PIECES: |-
        Your **description** is what other players read when they look at you. Here you keep it as **pieces**: a few lines each about one part of you, such as your build, your eyes or a coat.

        You choose which pieces to wear, and the game joins the ones you wear into your description. Change one piece and only that part of your description changes. Keep two coats and you can switch between them without writing anything again.
      DATA`WEB`GUIDE`PIECES`EXAMPLE: |-
        Say you have saved these pieces:
      DATA`WEB`GUIDE`PIECES`TOGETHER: |-
        Worn together, they read as below. The clothes start a new paragraph; the next step shows why.
      DATA`WEB`GUIDE`SLOTS: |-
        Every piece sits in a **slot**. The slot says which part of you the piece is about, and so where its text goes when your pieces are joined:

        - Pieces are joined in the order of their slots, from the top of this list down.
        - The slots under one heading share a paragraph, so their pieces run on together. The next heading starts a new paragraph.
        - **whole description** comes first. It is for a complete description written as one piece, as you would with @describe.

        This game's slots:
      DATA`WEB`GUIDE`SLOTS`STAFF: |-
        Staff choose the slots, so another game may have other ones.
      DATA`WEB`GUIDE`HIDING: |-
        Two settings change what a slot does. Both are in the list on the Slots step.

        - **Hides**: while you wear a piece in this slot, the pieces in the slots it hides drop out of your description. They stay on, and come back when you take the hiding piece off. The page marks them **covered**.
        - **Max**: how many pieces the slot holds, or none for no limit. When it is full, putting on another piece takes off the one you put on first.
      DATA`WEB`GUIDE`WEARING: |-
        Open a piece from the list to wear it:

        - **Put it on** adds it to what you wear.
        - **Wear only this** takes everything else off first. Use it to switch between whole descriptions.
        - **Take it off** removes it.

        Turn on **Tell the room when I change** to let the people with you know.

        An **outfit** is a set of pieces saved under one name. Put on the pieces you want, give the set a name under **Outfits** and save it. Later, **Wear only this outfit** puts the whole set back on. Deleting an outfit keeps its pieces.

        What you type is kept exactly as written. Tick **Run it as code when someone looks** only for text with softcode in it, such as `[v(mood)]`, that should run each time someone looks.
      DATA`WEB`EL`GUIDEEXAMPLE: |-
        {"kind":"table","rows_field":"guide_example","columns":[{"key":"name","label":"Piece"},{"key":"slot","label":"Slot"},{"key":"text","label":"Text"}]}
      DATA`WEB`EL`GUIDESLOTS: |-
        {"kind":"table","rows_field":"guide_slots","columns":[{"key":"slot","label":"Slot"},{"key":"hides","label":"Hides"},{"key":"max","label":"Max"}]}
      DATA`WEB`EL`GUIDEDONE: |-
        {"kind":"markdown","value":"[Go to your descriptions](/apps/descs)"}

      # ---- portal: pieces of a page ---------------------------------------------------------
      # A document: title %0, sections %1 (%r-separated).
      WEB`DOCUMENT:
        value: |-
          json(object,kind,json(string,form),schema_version,1,title,json(string,%0),pages,json_array(json(object,key,json(string,main),title,json(string,%0),order,1,sections,u(%!/WEB`ARRAY,%1)),%r),actions,v(DATA`WEB`ACTIONS))
        flags: [funsyntax]
      # A section: name %0, order %1, elements %2 (%r-separated), in %3 columns.
      WEB`SECTION:
        value: |-
          json(object,name,json(string,%0),order,%1,columns,firstof(%3,1),elements,u(%!/WEB`ARRAY,%2))
        flags: [funsyntax]
      # The JSON values in %0, one per line, as an array.
      WEB`ARRAY:
        value: |-
          if(strlen(%0),json_array(%0,%r),json_array())
        flags: [funsyntax]
      # One datum, shown.
      WEB`VALUE:
        value: |-
          json(object,value,%0,visible,json(boolean,true))
        flags: [funsyntax]
      # Text %0 with its colour, as the terminal draws it, or %1 in grey when %0 is empty.
      WEB`PREVIEW:
        value: |-
          json(object,kind,json(string,markdown),format,json(string,mstring),value,json(markupstring,if(strlen(%0),%0,tone(muted,%1))))
        flags: [funsyntax]
      # Pieces %0 put together and evaluated as the player, as look would show them. objevals() evaluates what its
      # argument gives, so the register holding the code is evaluated as the player. objevals() runs as the caller
      # when the caller does not control the player, so for a player this object does not control, the code as written.
      FUN`EVALUATED:
        value: |-
          if(controls(%!,%q<md_who>),[setq(page_code,u(%!/FUN`ASSEMBLE,%0))][objevals(%q<md_who>,%q<page_code>)],iter(%0,u(%!/FUN`PIECE`TEXT,%i0),%b,%r%r))
        flags: [funsyntax]
      # A button for the page's piece or outfit (%q<page_target>): label %0, op %1, colour %2, %3 a question asked first.
      WEB`BUTTON:
        value: |-
          json(object,kind,json(string,button),label,json(string,%0),action,json(string,act),values,json(object,op,json(string,%1),target,json(string,%q<page_target>)),color,json(string,firstof(%2,secondary)),variant,json(string,if(strmatch(%2,primary),filled,outlined)),confirm,json(string,%3))
        flags: [funsyntax]
      # The slot select, keyed %0: whole first, then the game's slots in order, each with what it hides and how many
      # it holds.
      WEB`SLOT`FIELD:
        value: |-
          json(object,kind,json(string,field),key,json(string,%0),label,json(string,Slot),type,json(string,select),help,json(string,The part of you the piece is about. Worn pieces are joined in slot order%, whole description first.),options,u(%!/WEB`ARRAY,iter(whole [remove(u(%!/FUN`SLOT`NAMES),whole)],json(object,value,json(string,%i0),label,json(string,u(%!/WEB`SLOT`OPTION,%i0))),%b,%r)))
        flags: [funsyntax]
      # %0 a slot: its name as the page shows it.
      WEB`SLOT`LABEL:
        value: |-
          if(strmatch(%0,whole),whole description,%0)
        flags: [funsyntax]
      # %0 a slot: what sets it apart, |-separated: the slots it hides and how many it holds.
      WEB`SLOT`HINTS:
        value: |-
          trim([if(strlen(setr(hint_covers,u(%!/FUN`SLOT`COVERS,%0))),hides [itemize(%q<hint_covers>)])]|[switch(u(%!/FUN`SLOT`MAX,%0),0,,1,one at a time,up to #$ at once)],|)
        flags: [funsyntax]
      # %0 a list, |-separated with empty items: the items, joined by a dot.
      WEB`DOTS:
        value: |-
          edit(trim(squish(%0,|),|),|,%b·%b)
        flags: [funsyntax]
      WEB`SLOT`OPTION:
        value: |-
          u(%!/WEB`DOTS,[u(%!/WEB`SLOT`LABEL,%0)]|[u(%!/WEB`SLOT`HINTS,%0)])
        flags: [funsyntax]
      # %0 a slot: the slots of the pieces worn now that hide it.
      WEB`SLOT`COVEREDBY:
        value: |-
          setunion(iter(%q<list_worn>,if(member(u(%!/FUN`SLOT`COVERS,setr(cb_slot,u(%!/FUN`PIECE`SLOT,%i0))),%0),%q<cb_slot>)),)
        flags: [funsyntax]
      # The slot board's order, as <slot>~<stack>: the slots in order, except that a slot which hides others comes
      # with them stacked under it, all with its name as their stack. A slot hidden by one that never comes (only in
      # a chain of hiding) is added at the end on its own.
      WEB`BOARD`ORDER:
        value: |-
          setqm(bo_names,u(%!/FUN`SLOT`NAMES),
          bo_hidden,setunion(iter(%q<bo_names>,u(%!/FUN`SLOT`COVERS,%i0)),),
          bo_out,squish(iter(%q<bo_names>,if(member(%q<bo_hidden>,%i0),,u(%!/WEB`BOARD`STACK,%i0)))))[trim([%q<bo_out>] [iter(%q<bo_names>,if(member(iter(%q<bo_out>,before(%i0,~)),%i0),,%i0~))])]
        flags: [funsyntax]
      # %0 a slot no other hides: itself, then the slots it hides in slot order, stacked under its name.
      WEB`BOARD`STACK:
        value: |-
          if(words(setr(bs_under,iter(%q<bo_names>,if(member(u(%!/FUN`SLOT`COVERS,%0),%i0),%i0)))),%0~%0 [iter(%q<bs_under>,%i0~%0)],%0~)
        flags: [funsyntax]
      # %0 a slot, %1 its stack (see WEB`BOARD`ORDER): its tile on the list, naming what is worn in it, what hides it or
      # what it hides, and how many it holds.
      WEB`TILE`SLOT:
        value: |-
          setqm(tile_ids,filterbool(%!/FUN`PIECE`INSLOT,%q<list_worn>,,,%0),
          tile_by,u(%!/WEB`SLOT`COVEREDBY,%0))[json(object,stack,json(string,%1),label,json(string,u(%!/WEB`SLOT`LABEL,%0)),value,json(string,if(words(%q<tile_ids>),u(%!/FUN`PIECE`NAMES,%q<tile_ids>),—)),caption,json(string,u(%!/WEB`DOTS,[if(strlen(%q<tile_by>),hidden under [itemize(%q<tile_by>)])]|[u(%!/WEB`SLOT`HINTS,%0)])),color,json(string,if(words(%q<tile_ids>),if(strlen(%q<tile_by>),warning,success),default)))]
        flags: [funsyntax]
      # %0 a piece: its tiles, for its slot, whether it is on, and the outfits it is in.
      WEB`FACTS`PIECE:
        value: |-
          setqm(fact_slot,u(%!/FUN`PIECE`SLOT,%0),
          fact_state,u(%!/FUN`DISPLAY`STATE,%0),
          fact_outfits,filterbool(%!/WEB`OUTFIT`HAS,u(%!/FUN`ENTRY`IDS,OUTFIT),,,%0))[u(%!/WEB`ARRAY,json(object,label,json(string,Slot),value,json(string,u(%!/WEB`SLOT`LABEL,%q<fact_slot>)),caption,json(string,u(%!/WEB`DOTS,[u(%!/WEB`SLOT`PLACE,%q<fact_slot>)]|[u(%!/WEB`SLOT`HINTS,%q<fact_slot>)])),color,json(string,info))%r[json(object,label,json(string,Now),value,json(string,u(%!/WEB`STATE`LABEL,%0)),caption,json(string,switch(%q<fact_state>,covered,hidden under [itemize(u(%!/WEB`SLOT`COVEREDBY,%q<fact_slot>))],worn,in your description,not in your description)),color,json(string,u(%!/WEB`STATE`COLOR,%0)))]%r[json(object,label,json(string,In outfits),value,json(string,words(%q<fact_outfits>)),caption,json(string,if(words(%q<fact_outfits>),itemize(iter(%q<fact_outfits>,u(%!/FUN`ENTRY`NAME,OUTFIT`%i0),%b,|),|),none)),color,json(string,default))])]
        flags: [funsyntax]
      # %0 a slot: where it comes, after the slot before it.
      WEB`SLOT`PLACE:
        value: |-
          if(gt(setr(place_at,match(setr(place_names,u(%!/FUN`SLOT`NAMES)),%0)),1),comes after [u(%!/WEB`SLOT`LABEL,extract(%q<place_names>,dec(%q<place_at>),1))],comes first)
        flags: [funsyntax]
      # %0 an outfit id, %1 a piece id: 1 when the outfit holds the piece.
      WEB`OUTFIT`HAS:
        value: |-
          t(member(get(%q<md_who>/MULTIDESC`OUTFIT`%0`PIECES),%1))
        flags: [funsyntax]
      # %0 a piece: the start of how it reads, on one line.
      WEB`EXCERPT:
        value: |-
          setq(ex_text,squish(edit(stripansi(u(%!/FUN`EVALUATED,%0)),%r,%b)))[if(gt(strlen(%q<ex_text>),70),[trim(left(%q<ex_text>,69))]…,%q<ex_text>)]
        flags: [funsyntax]
      # A table row for piece %0, grouped by its slot.
      WEB`ROW`PIECE:
        value: |-
          json(object,id,json(string,%0),name,json(string,u(%!/FUN`PIECE`NAME,%0)),looks,json(string,u(%!/WEB`EXCERPT,%0)),group,json(string,u(%!/FUN`PIECE`SLOT,%0)),state,json(string,u(%!/WEB`STATE`LABEL,%0)),state_color,json(string,u(%!/WEB`STATE`COLOR,%0)))
        flags: [funsyntax]
      WEB`ROW`OUTFIT:
        value: |-
          json(object,id,json(string,%0),name,json(string,u(%!/FUN`ENTRY`NAME,OUTFIT`%0)),pieces,json(string,firstof(u(%!/FUN`PIECE`NAMES,u(%!/FUN`ENTRY`PIECES,OUTFIT`%0)),nothing left)))
        flags: [funsyntax]
      # Chips for pieces %0 in slot order; %1 1 to say of each whether it is worn, covered or not worn.
      WEB`CHIPS:
        value: |-
          u(%!/WEB`ARRAY,iter(sortkey(%!/FUN`DISPLAY`PIECEKEY,%0),if(%1,json(object,text,json(string,u(%!/FUN`PIECE`NAME,%i0)%b·%b[u(%!/WEB`STATE`LABEL,%i0)]),color,json(string,u(%!/WEB`STATE`COLOR,%i0))),json(object,text,json(string,u(%!/FUN`PIECE`NAME,%i0)[if(strmatch(u(%!/FUN`DISPLAY`STATE,%i0),covered),%b· covered)]),color,json(string,u(%!/WEB`STATE`COLOR,%i0)))),%b,%r))
        flags: [funsyntax]
      WEB`STATE`LABEL:
        value: |-
          switch(u(%!/FUN`DISPLAY`STATE,%0),worn,worn,covered,covered,not worn)
        flags: [funsyntax]
      WEB`STATE`COLOR:
        value: |-
          switch(u(%!/FUN`DISPLAY`STATE,%0),worn,success,covered,warning,default)
        flags: [funsyntax]
      # The one action every button dispatches. A save empties the new-piece and outfit boxes.
      DATA`WEB`ACTIONS: |-
        {"act":{"transport":"http","method":"POST","route":"/http/descs/act","payload":"fields","on_success":{"reset_fields":["new_name","new_text","new_code","outfit_name"]},"on_error":{"bind_field_errors":true}}}
      DATA`WEB`EL`MISSING: |-
        {"kind":"markdown","value":"**That piece or outfit is not here.** It was deleted, or it belongs to someone else. Here is everything you keep."}
      DATA`WEB`EL`BACK: |-
        {"kind":"markdown","value":"[All your descriptions](/apps/descs)"}
      DATA`WEB`EL`INTRO: |-
        {"kind":"markdown","value":"Your description is the pieces you wear, joined in slot order. [How pieces and slots work](/apps/descs/guide)"}
      DATA`WEB`EL`START: |-
        {"kind":"markdown","value":"**Your description is made of pieces.** A piece is a few lines about one part of you, such as your build, your eyes or a coat. Each piece sits in a **slot**, and the slots set the order: wear a few pieces and the game joins them, slot by slot, into what others read when they look at you.\n\n1. Write your first piece under **New piece** and choose its slot.\n2. Open it from **Pieces** and press **Put it on**.\n3. When you like what you wear, save it as an **outfit**.\n\n[Read the short guide to pieces and slots](/apps/descs/guide)"}
      DATA`WEB`EL`SLOTSINTRO: |-
        {"kind":"markdown","value":"Each slot holds one part of how you look, and worn pieces are joined in this order. A slot you wear something in is marked. A slot that hides another sits on top of it, and the one underneath says when it is hidden."}
      DATA`WEB`EL`SLOTS: |-
        {"kind":"stats","rows_field":"slots","empty":"This game has no slots."}
      DATA`WEB`EL`FACTS: |-
        {"kind":"stats","rows_field":"facts"}
      DATA`WEB`EL`OUTFITPIECES: |-
        {"kind":"chips","src_field":"pieces","label":"Pieces","empty":"No pieces."}
      DATA`WEB`EL`NOISY: |-
        {"kind":"field","key":"noisy","label":"Tell the room when I change","type":"boolean"}
      DATA`WEB`EL`REMOVEALL: |-
        {"kind":"button","label":"Take everything off","action":"act","values":{"op":"removeall","target":""},"color":"error","variant":"outlined","confirm":"Take everything off? Your description stays empty until you wear something."}
      DATA`WEB`EL`PIECES: |-
        {"kind":"table","rows_field":"pieces","empty":"Nothing saved yet. Write your first piece below.","columns":[{"key":"name","label":"Piece","link":"/apps/descs/piece/{id}"},{"key":"looks","label":"Reads"},{"key":"state","label":"Now","type":"chip","color_key":"state_color"}]}
      DATA`WEB`EL`OUTFITS: |-
        {"kind":"table","rows_field":"outfits","empty":"No outfits yet. Wear some pieces, then save them as one here.","columns":[{"key":"name","label":"Outfit","link":"/apps/descs/outfit/{id}"},{"key":"pieces","label":"Pieces"}]}
      DATA`WEB`EL`OUTFITNAME: |-
        {"kind":"field","key":"outfit_name","label":"Outfit name","type":"text","placeholder":"evening"}
      DATA`WEB`EL`OUTFITSAVE: |-
        {"kind":"button","label":"Save what I wear now as an outfit","action":"act","values":{"op":"outfit","target":""},"color":"secondary","variant":"outlined"}
      DATA`WEB`EL`NEWNAME: |-
        {"kind":"field","key":"new_name","label":"Name","type":"text","placeholder":"winter coat"}
      DATA`WEB`EL`NEWTEXT: |-
        {"kind":"field","key":"new_text","label":"Text","type":"textarea","placeholder":"A long grey coat, buttoned to the throat.","span":2}
      DATA`WEB`EL`NEWCODE: |-
        {"kind":"field","key":"new_code","label":"Run it as code when someone looks","type":"boolean","help":"Off keeps the text exactly as written. On, brackets and percent signs run as softcode, as they do in an @describe.","span":2}
      DATA`WEB`EL`NEWSAVE: |-
        {"kind":"button","label":"Save the piece","action":"act","values":{"op":"save","target":""},"color":"primary","variant":"filled"}
      DATA`WEB`EL`SHORT: |-
        {"kind":"field","key":"shortdesc","label":"Short description","type":"text","placeholder":"A tall woman in grey wool.","help":"One line about how you look at a glance, for other pages and commands to show."}
      DATA`WEB`EL`SHORTSAVE: |-
        {"kind":"button","label":"Save the short description","action":"act","values":{"op":"short","target":""},"color":"secondary","variant":"outlined"}
      DATA`WEB`EL`NAME: |-
        {"kind":"field","key":"name","label":"Name","type":"text"}
      DATA`WEB`EL`TEXT: |-
        {"kind":"field","key":"text","label":"Text","type":"textarea","span":2}
      DATA`WEB`EL`CODE: |-
        {"kind":"field","key":"code","label":"Run it as code when someone looks","type":"boolean","help":"Off keeps the text exactly as written. On, brackets and percent signs run as softcode, as they do in an @describe.","span":2}

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot. /nobreak keeps a refusal from
      # stopping the rest of an action list that ran the command.
      STARTUP:
        value: |-
          @dolist/inline +desc +wear +remove +shortdesc={@command/add ##; @hook/override/inline/localize/clearregs/nobreak ##=%!,CMD`[ucstr(after(##,+))]}
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The slots a piece is worn in. Inside the Multi-descer, so no player can reach it, and no_command, so nothing kept
  # on it is ever matched as a command.
  #
  # A slot is SLOT`<NAME>, its value its order, with PARAGRAPH (slots sharing one are joined by a space), COVERS
  # (slots hidden while one of its pieces is worn) and MAX (how many may be worn at once, 0 for no limit) beneath. Staff
  # change them with +config multidescer/slots. whole is where a piece saved without a slot goes.
  - ref: store
    type: thing
    name: Multi-descer Store
    location: "{{multidescer}}"
    flags: [no_command]
    attributes:
      SLOT: |-
        The slots a piece is worn in, one branch each, named as a player types it.
      SLOT`WHOLE: |-
        10
      SLOT`WHOLE`PARAGRAPH: |-
        description
      SLOT`WHOLE`MAX: |-
        0
      SLOT`BODY: |-
        20
      SLOT`BODY`PARAGRAPH: |-
        body
      SLOT`BODY`MAX: |-
        0
      SLOT`FACE: |-
        30
      SLOT`FACE`PARAGRAPH: |-
        body
      SLOT`FACE`MAX: |-
        0
      SLOT`HAIR: |-
        40
      SLOT`HAIR`PARAGRAPH: |-
        body
      SLOT`HAIR`MAX: |-
        1
      SLOT`TOP: |-
        50
      SLOT`TOP`PARAGRAPH: |-
        clothes
      SLOT`TOP`MAX: |-
        0
      SLOT`BOTTOM: |-
        60
      SLOT`BOTTOM`PARAGRAPH: |-
        clothes
      SLOT`BOTTOM`MAX: |-
        0
      SLOT`FEET: |-
        70
      SLOT`FEET`PARAGRAPH: |-
        clothes
      SLOT`FEET`MAX: |-
        1
      SLOT`OUTER: |-
        55
      SLOT`OUTER`PARAGRAPH: |-
        clothes
      SLOT`OUTER`COVERS: |-
        top
      SLOT`OUTER`MAX: |-
        1
      SLOT`ACCESSORY: |-
        90
      SLOT`ACCESSORY`PARAGRAPH: |-
        clothes
      SLOT`ACCESSORY`MAX: |-
        0

  # The portal's routes, on the HTTP handler: GET /http/descs/schema and /http/descs/data, each with ?at=<sub-path>,
  # and POST /http/descs/act. They run the Multi-descer's WEB` routines with @force, so its writes run as it and its
  # "Set." lines never reach the response. %<viewer> is the character the portal signed in as.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`DESCS`SCHEMA: |-
        @force {{multidescer}}=@include/args/nobreak {{multidescer}}/WEB`SCHEMA=viewer,%<viewer>; @respond/type application/json; think %q<web_answer>
      GET`DESCS`DATA: |-
        @force {{multidescer}}=@include/args/nobreak {{multidescer}}/WEB`DATA=viewer,%<viewer>; @respond/type application/json; think %q<web_answer>
      POST`DESCS`ACT: |-
        think setq(web_body,%<body>); @force {{multidescer}}=@include/args/nobreak {{multidescer}}/WEB`ACT=viewer,%<viewer>; @force {{multidescer}}=@include/args/nobreak {{multidescer}}/WEB`ANSWER=viewer,%<viewer>; @respond/type application/json; think %q<web_answer>

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: multidescer_help
    type: thing
    name: Multi-descer Help
    location: "{{multidescer}}"
    attributes:
      HELP: |-
        Saving and changing descriptions: +desc, +wear, +remove and +shortdesc.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`DESC: |-
        wear shortdesc
      SEE`WEAR: |-
        desc
      SEE`SHORTDESC: |-
        desc
      HELP`DESC: |-
        `+desc` keeps more than one description for your character and changes between them.

        - `+desc <name>=<text>` saves a description. `+desc/save <name>=<text>` does the same.
        - `+desc/save <name>` saves the description you have now, written with `@describe` or any other way, code and all.
        - `+desc <name>` wears it: your description becomes that text.
        - `+desc` on its own lists what you have saved and what you are wearing.

        When you wear something and your description was written another way, such as with `@describe`, it is saved first, as `original` the first time and as `kept-<number>` after that, so nothing is lost.

        What you type is evaluated as you, as `say` is. To keep `\[`, `\]` or `%%` as they are, put a `\\` before each.

        Example:

        ```
        > +desc winter=A tall woman bundled in grey wool.
        \[DESC\] Saved the description 'winter'. +desc winter wears it.
        > +desc winter
        \[DESC\] You now wear winter.
        ```

        Output: one line for each command, and `look me` shows the new description.

        ## Combining

        `+desc <name> + <name>` wears several together, joined in the order of the slots they are in. Two whole descriptions are joined by a space.

        ## Pieces and slots

        A description can be put together from pieces, each in a slot: `body`, `hair`, `top`, `feet` and so on. `+desc/slots` lists the game's slots and the order they come in.

        - `+desc/save <slot>/<name>=<text>` saves a piece in a slot. A piece saved without a slot is in `whole`, which comes first.
        - `+wear <name>` puts a piece on over what you are wearing. See `+help wear`.
        - Slots in the same paragraph are joined by a space; a new paragraph starts after a blank line.

        Example:

        ```
        > +desc/save body/build=She is broad-shouldered and quick.
        > +desc/save top/shirt=A linen shirt is rolled to the elbows.
        > +desc build + shirt
        \[DESC\] You now wear build and shirt.
        ```

        Output: your description is the two pieces, `build` and then `shirt`, each in its own paragraph.

        ## Outfits

        `+desc/outfit <name>` saves the pieces you are wearing as an outfit. `+desc <outfit>` wears exactly those pieces, and `+wear <outfit>` adds them. Saving over an outfit's name replaces it.

        ## Changing what is saved

        - `+desc/view <name>` shows a piece, or an outfit put together, as `look` would.
        - `+desc/replace <name>=<text>` gives a piece new text. `+desc/replace <slot>/<name>=<text>` moves it to another slot too. A piece you are wearing changes your description at once.
        - `+desc/rename <name>=<new name>` renames a piece or outfit.
        - `+desc/delete <name>` deletes one. A deleted piece comes off and out of every outfit. A deleted outfit's pieces stay.

        A name is letters, digits, spaces, `_`, `'` and `-`, up to 30 characters unless the game sets another limit. To wear or view one, you can type the start of a name when only one starts that way. Replace, rename and delete need the whole name.

        ## Telling the room

        Add `/noisy` to `+desc`, `+wear` or `+remove` and the room is told, such as `Mira changes into winter.` Without it only you are told.

        ## In the portal

        When the game has the Descriptions page, it is under Play in the portal. It shows what you wear now, your pieces by slot and your outfits, and it writes, changes, wears and deletes them as these commands do. Text written there is kept exactly as written, unless you tick that it is code.
      HELP`WEAR: |-
        `+wear` and `+remove` change one piece of your description and leave the rest. Pieces are saved with `+desc/save <slot>/<name>=<text>`; see `+help desc`.

        - `+wear <name>` puts a piece or an outfit on over what you are wearing. `+wear <name> + <name>` puts on several.
        - `+remove <name>` takes a piece off. An outfit's name takes off its pieces.
        - `+remove/all` takes everything off, which leaves your description empty until you wear something.
        - `+wear` on its own lists what you have, as `+desc` does.

        Some slots hold one piece at a time, such as `feet`: putting on new shoes takes the old ones off. Some cover others: while something is worn in `outer`, what is worn in `top` does not show. `+desc/slots` lists each slot's rules.

        Add `/noisy` to tell the room: `Mira puts on red coat.`

        Example:

        ```
        > +wear red coat
        \[DESC\] You put on red coat.
        > +remove red coat
        \[DESC\] You took off red coat.
        ```

        Output: one line each, and your description changes at once.
      HELP`SHORTDESC: |-
        `+shortdesc <text>` sets a short description: a line about how you look at a glance, for other commands and pages to show.

        - `+shortdesc` on its own shows yours.
        - `+shortdesc/clear` clears it.

        It is kept as typed, up to 100 characters or as many as the game sets, and it does not change with `+desc` or `+wear`.

        Example:

        ```
        > +shortdesc A tall woman in grey wool.
        \[DESC\] Your short description is now: A tall woman in grey wool.
        ```

        Output: one line saying what it is now.
      LOCK`DESC`STAFF: |-
        perm^config.admin
      HELP`DESC`STAFF: |-
        Staff who can change the game's configuration \(the `config.admin` permission\) set the slots and limits with `+config`.

        ## Slots

        - `+config multidescer/slots` lists them, and `+config multidescer/slots/<slot>` shows one.
        - `+config multidescer/slots/<slot>/order=<number>` sets where its pieces come. Lower comes first.
        - `+config multidescer/slots/<slot>/paragraph=<name>` puts it in a paragraph. Slots with the same paragraph are joined by a space.
        - `+config multidescer/slots/<slot>/covers=<slots>` hides the pieces of those slots while one of its pieces is worn.
        - `+config multidescer/slots/<slot>/max=<number>` sets how many may be worn at once. `0` is no limit, shown as none.
        - `+config/add multidescer/slots/<slot>=<order>` adds one, and `+config/remove multidescer/slots/<slot>` takes one away. Pieces saved in a slot that is taken away stay, and come last in a description.

        A changed slot shows the next time a player changes what they wear.

        The slots are kept on the Multi-descer Store, inside the Multi-descer object in the master room, as `` SLOT`<NAME> `` holding the order, with `PARAGRAPH`, `COVERS` and `MAX` beneath.

        ## Settings

        `+config multidescer` lists them and `+config multidescer/<setting>=<value>` changes one:

        - `name-length`: the longest name of a piece or outfit. 30.
        - `length`: the longest text of one piece. 8000, and never more than the game's own limit on an attribute.
        - `max-entries`: how many pieces and outfits one character may keep. 100.
        - `short-length`: the longest `+shortdesc`. 100.

        Example:

        ```
        > +config multidescer/max-entries=50
        \[CONFIG\] Done: multidescer/max-entries is now 50, was 100.
        ```

        Output: one line saying what the setting is now and what it was.

        A character's wardrobe is kept on the character, under `MULTIDESC`, flagged `wizard` so only the Multi-descer changes it. The short description is `SHORTDESC` on the character.

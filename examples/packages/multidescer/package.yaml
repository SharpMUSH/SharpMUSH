        flags: [funsyntax]
      WEB`DATA`GUIDE:
        value: |-
          [u(%!/WEB`GUIDE`SETUP)][json(object,fields,json(object,guide_example,u(%!/WEB`VALUE,u(%!/WEB`ARRAY,iter(%q<g_base>,json(object,name,json(string,extract(%i0,1,1,~)),slot,json(string,u(%!/WEB`SLOT`LABEL,extract(%i0,2,1,~))),text,json(string,extract(%i0,3,1,~))),|,%r))),guide_slots,u(%!/WEB`VALUE,u(%!/WEB`ARRAY,iter(u(%!/FUN`SLOT`NAMES),json(object,slot,json(string,u(%!/WEB`SLOT`LABEL,%i0)),group,json(string,u(%!/FUN`SLOT`PARAGRAPH,%i0) paragraph),hides,json(string,firstof(itemize(u(%!/FUN`SLOT`COVERS,%i0)),—)),max,json(string,firstof(u(%!/FUN`SLOT`MAX,%i0),none))),%b,%r)))))]
        flags: [funsyntax]
      # The example as name~slot~text entries, |-separated: g_all every one, in slot order; g_base those in slots that
      # hide nothing; g_tops those in slots that do; g_hidden those g_tops hide; g_shown what is left of g_all.
      WEB`GUIDE`SETUP:
        value: |-
          setqm(g_all,sortkey(%!/WEB`GUIDE`ORDER,filterbool(%!/WEB`GUIDE`HAS,v(DATA`WEB`GUIDE`EXAMPLE),|,|),n,|,|),
          g_base,filterbool(%!/WEB`GUIDE`PLAIN,%q<g_all>,|,|),
          g_tops,filterbool(%!/WEB`GUIDE`HIDES,%q<g_all>,|,|),
          g_covers,setunion(iter(%q<g_tops>,u(%!/FUN`SLOT`COVERS,extract(%i0,2,1,~)),|),),
          g_hidden,filterbool(%!/WEB`GUIDE`COVERED,%q<g_all>,|,|,%q<g_covers>),
          g_shown,filterbool(%!/WEB`GUIDE`SHOWN,%q<g_all>,|,|,%q<g_covers>))
        flags: [funsyntax]
      WEB`GUIDE`HAS:
        value: |-
          u(%!/FUN`SLOT`EXISTS,extract(%0,2,1,~))

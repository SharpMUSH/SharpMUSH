format: "1.16"
package: radio-help
title: "Radio: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Radio topics into +help: registers the radio package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [radio, help, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. radio keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: radio
    version: ">=1.6"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/radio/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`RADIO: |-
        {{radio/radio_help}}

  # Lines the radio package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{radio/radio}}"
    attributes:
      HINT`SWITCHES: |-
        +help radio lists them.
      HINT`USAGE: |-
        +help radio lists the rest.

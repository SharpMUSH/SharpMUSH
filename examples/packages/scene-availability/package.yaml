format: "1.10"
package: scene-availability
version: 2.0.0
authors: [SharpMUSH]
description: "Availability in scenes: +avail/scene finds a time a scene's cast is all free, a scheduled scene's card shows who of its cast is free at its time, and +avail/find offers to book the first time as a scene."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [scene, availability, calendar, schedule, bridge]
category: Scenes
requires_server: ">=0.1"

# +avail/scene and the card read scenes through the Scene plugin's functions, so it installs only while the plugin
# runs.
plugins: [scene]

# A bridge: it joins two packages that do not know about each other. The availability package keeps when each
# character is busy or free and finds times a group is all free; the scene package keeps scenes. This one attaches
# the scene parts to both: a /scene route, a setting and a footer filter on the Availability object, a card filter
# on the Scene Logger, and a help topic. Uninstalling it takes them all away and leaves +avail as it was.
depends:
  - package: availability
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/availability/
      branch: main
  - package: scene
    version: ">=1.6"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene/
      branch: main

objects:
  # On the Availability object, which runs them: +avail includes INC`<route> with its registers (cmd_left,
  # cmd_right, viewer_zone, now), and the Scene Logger's card filter u()s FUN`SCENE`CARD. They name the
  # Availability object %!, since it is the executor; a {{ref}} here would be looked up on it, and it holds none
  # of this package's.
  - ref: availability_scene
    target: "{{availability/availability}}"
    attributes:
      # +avail/scene runs INC`FIND`SCENE.
      DATA`ROUTE`SCENE: |-
        FIND`SCENE
      # +avail/scene <id>[=<length>]: the scene's cast, and the reader.
      INC`FIND`SCENE:
        value: |-
          @assert strlen(%q<cmd_left>)=@pemit %#=notice(AVAIL,Which scene? +avail/scene <id>.,warn); @assert not(strmatch(scene(%q<cmd_left>,status),#-1*))=@pemit %#=notice(AVAIL,No such scene: %q<cmd_left>,warn); @include/args %!/INC`FIND`RUN=players,setunion(%:,iter(scenemembers(%q<cmd_left>),objid(%i0))),title,Free times for scene %q<cmd_left>
        flags: [cmdsyntax]

      # How long a scheduled scene is taken to last; +config avail lists it beside the other settings.
      DATA`CONFIG`SCENE-LENGTH: |-
        7200
      DATA`CONFIG`SCENE-LENGTH`DESCRIPTION: |-
        How long a scheduled scene is taken to last, for who of its cast is free at its time.
      DATA`CONFIG`SCENE-LENGTH`TYPE: |-
        duration
      DATA`CONFIG`SCENE-LENGTH`DEFAULT: |-
        7200
      DATA`CONFIG`SCENE-LENGTH`LABEL: |-
        Scene length on its card
      DATA`CONFIG`SCENE-LENGTH`EXAMPLE: |-
        3h
      DATA`CONFIG`SCENE-LENGTH`MIN: |-
        900
      DATA`CONFIG`SCENE-LENGTH`MAX: |-
        43200

      # %0 a scene: who of its cast is free at its time, for its card. Nothing when it has no time to come, or no
      # cast.
      FUN`SCENE`CARD:
        value: |-
          if(cand(strlen(setr(scene_card_at,scene(%0,scheduledfor))),isint(%q<scene_card_at>),gt(setr(scene_card_start,div(%q<scene_card_at>,1000)),secs()),words(setr(scene_card_cast,iter(scenemembers(%0),objid(%i0))))),%r[rule(Free at its time)]%r[u(%!/FUN`SCENE`CARD`FIELDS,%q<scene_card_start>,add(%q<scene_card_start>,u(%!/FUN`CONFIG,SCENE-LENGTH)),%q<scene_card_cast>)])
        flags: [funsyntax]
      # %0 and %1 instants, %2 the cast: Free, Busy and Not set, each the names in it.
      FUN`SCENE`CARD`FIELDS:
        value: |-
          setq(scene_card_answers,iter(%2,%i0^[if(strlen(setr(scene_card_free,u(%!/FUN`FREE`AT,%i0,%0,%1))),%q<scene_card_free>,-)]))[lfields(,Free%*<|>Busy%*<|>Not set,iter(1 0 -,firstof(itemize(squish(iter(%q<scene_card_answers>,if(strmatch(rest(%i0,^),%i1),name(first(%i0,^))),,|),|),|),tone(muted,nobody)),,%*<|>),%*<|>)]
        flags: [funsyntax]

      # +avail/find's footer (FUN`SCREEN`FIND`FOOT): %0 the footer so far, %1 the runs, start:end. Adds the line
      # that books the first time as a scene, written in seconds, which +scene/schedule reads.
      FILTER`AVAIL`FIND`SCENE: |-
        %0[if(words(%1),%r[tone(muted,Book the first: +scene/schedule [first(first(%1),:)]/<title>=<pitch>)])]

  # A scheduled scene's card shows who of its cast is free at its time (+help scene filters).
  - ref: scene_card
    target: "{{scene/logger}}"
    attributes:
      FILTER`CARD`AVAILABILITY: |-
        %0[u({{availability/availability}}/FUN`SCENE`CARD,%1)]

  # The help topic joins +help avail as a subtopic. Bodies are evaluated, so brackets, parentheses and percent
  # signs are escaped.
  - ref: availability_help_scene
    target: "{{availability/availability_help}}"
    attributes:
      SEE`AVAIL`SCENE: |-
        avail find|scene schedule
      HELP`AVAIL`SCENE: |-
        With the scene package, `+avail` knows about scenes:

        - `+avail/scene <id>\[=<length>\]` lists the times a scene's cast is all free: its owner and everyone who joined it, and you. It reads like `+avail/find`.
        - `+avail/find` and `+avail/scene` end with a line that books the first time as a scene, the time written in seconds, which `+scene/schedule` reads.
        - `+scene <id>` for a scene scheduled for a time still to come shows, under its cast, who is free at its time, who is busy, and who has set no times.

        A scene is taken to last two hours, or as long as the `scene-length` setting says: `+config avail/scene-length=3h`.

format: "1.10"
package: highlights-app
version: 1.0.1
kind: application
authors: [SharpMUSH]
description: "Registers the highlights (the highlights package) as a portal page at /apps/highlights: the poses players favourited most, each credited to its writer with a link to its scene, the viewer's own favourites at /apps/highlights/mine, and a button under each pose to favourite it or take it back."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [portal, application, scene, highlights, favourites]
category: Scenes
requires_server: ">=0.1"

# An application package owns no objects. The highlights package serves the routes it points at:
# GET /http/highlights/schema and /http/highlights/data, and POST /http/highlights/act. What the page shows
# is decided by that softcode for the character viewing it: a visitor who is not signed in sees the
# highlights of public scenes and no buttons.
depends:
  - package: highlights
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/highlights/
      branch: main

# Anyone may open it, signed in or not. {path} is what follows /apps/highlights/: nothing or a page number
# for the highlights, mine or mine/<page> for the viewer's favourites.
application:
  slug: highlights
  display_name: Highlights
  icon: star
  type: page
  schema_url: http/highlights/schema?at={path}
  data_url: http/highlights/data?at={path}
  submit_route: http/highlights/act
  minimum_role: guest
  nav_placement: Community
  order: 35

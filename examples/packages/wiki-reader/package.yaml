format: 1
package: wiki-reader
version: 1.4.0
authors: [SharpMUSH]
description: "+wiki — a reading front end for @wiki: paged listings, a rendered article view, and an editorial audit for staff."
license: MIT
keywords: [wiki, help, navigation, ui]
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: wiki_global
    type: thing
    name: Wiki Reader
    location: "{{$master_room}}"
    # Send_OOB is what cmdlink() asks of whoever writes a command link, as PennMUSH asks it of XCH_CMD.
    powers: [Send_OOB]
    attributes:

      FUN:
        value: |-
          Reads. GET lookups, IS predicates, DISPLAY formatting.
        flags: [no_command]
      INC:
        value: |-
          Reusable command steps. IS assertions, DO effects, DISPLAY output.
        flags: [no_command]

      # CODEBLOCK and TABLE are left unset on purpose: their defaults already
      # syntax-highlight and lay out better than a template would here.
      RENDERMARKUP`H1:
        value: |-
          [ansi(hw,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H2:
        value: |-
          [ansi(hc,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H3:
        value: |-
          [ansi(hb,%0)]
        flags: [funsyntax]
      RENDERMARKUP`LISTITEM:
        value: |-
          [if(%0,[ansi(hc,%1.)],[ansi(hc,*)])] %2
        flags: [funsyntax]
      RENDERMARKUP`QUOTE:
        value: |-
          [ansi(hy,%0)]
        flags: [funsyntax]
      # [[Page]] in an article body becomes a +wiki command for a client that
      # can click one, and stays highlighted prose for everyone else. A RENDERMARKUP
      # template runs as the READER, who has no Send_OOB for cmdlink(), so it goes
      # through wikilink(): a global @function, which runs as this object.
      RENDERMARKUP`WIKILINK:
        value: |-
          [ansi(hc,[wikilink(%0,%1,%2)])]
        flags: [funsyntax]
      # wikilink(<text>, <page>[, <hint>]) — registered globally by STARTUP. It can only ever
      # write a link running "+wiki <page>", which is why lending this object's Send_OOB to
      # every caller through it lends nothing more.
      FUN`WIKILINK:
        value: |-
          [@@(%0 the text · %1 a page reference · %2 the hint, optional)][cmdlink(%0,+wiki %1,%2)]
        flags: [funsyntax]
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP
      STARTUP: |-
        @function wikilink=%!,FUN`WIKILINK,2,3

      INC`DISPLAY`WARN:
        value: |-
          @@ %0 the message — a mistake in what was typed, reported as a warning; @pemit %#=[notice(WIKI,%0,warn)]
        flags: [cmdsyntax]
      INC`DISPLAY`DENIED:
        value: |-
          @@ %0 the message - a refusal for want of permission, reported as an error; @pemit %#=[notice(WIKI,%0,error)]
        flags: [cmdsyntax]
      INC`DISPLAY`INFO:
        value: |-
          @@ %0 the message — for an empty result, which is not a failure; @pemit %#=[notice(WIKI,%0)]
        flags: [cmdsyntax]

      # The namespaces @wiki knows (WikiNamespace). Named once so the index, the listing
      # validator and anything else agree on the set. A category's own page lives in "category".
      FUN`GET`NAMESPACES:
        value: |-
          main help character system category
        flags: [funsyntax]
      FUN`GET`NSDESC:
        value: |-
          [@@(%0 a namespace — what it holds, for the index)][switch(%0,main,Articles,help,Help pages,character,Character biographies,system,Staff pages,category,What each category is for)]
        flags: [funsyntax]
      # Every screen is a box() with no sides, corners or tees, as +help's are: a titled line across
      # the top, dividers and a bottom line across the whole width, and nothing beside the text, so a
      # line copied from a terminal carries no |. Each table gives one column the spare width (grow),
      # so it spans the screen rather than stopping at its content. Table headings are bold.
      FUN`GET`FRAME:
        value: |-
          [@@(no arguments — the options every screen's box is drawn with)][json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)]
        flags: [funsyntax]

      FUN`GET`ROWS:
        value: |-
          [@@(no arguments — listing rows that fit the reader's screen, under the box's title, headings, footer and edges)][max(5,sub(height(%#,24),8))]
        flags: [funsyntax]
      # Half a screen: the audit prints two of these sections, and a wiki with a hundred untagged
      # pages should tell a staffer that rather than scroll the count off the top of their terminal.
      FUN`GET`AUDITROWS:
        value: |-
          max(5,div(u(%!/FUN`GET`ROWS),2))
        flags: [funsyntax]
      FUN`GET`NPAGES:
        value: |-
          [@@(%0 refs — how many pages the reader's screen splits them into)][add(1,div(sub(max(1,words(%0)),1),u(%!/FUN`GET`ROWS)))]
        flags: [funsyntax]
      FUN`GET`SLICE:
        value: |-
          [@@(%0 refs · %1 page number — the refs shown on that page)][extract(%0,add(1,mul(sub(%1,1),u(%!/FUN`GET`ROWS))),u(%!/FUN`GET`ROWS))]
        flags: [funsyntax]

      FUN`IS`NAMESPACE:
        value: |-
          [@@(%0 a namespace name — case-insensitive, false for anything @wiki would not accept)][member(u(%!/FUN`GET`NAMESPACES),lcstr(%0))]
        flags: [funsyntax]
      # wiki() answers #-1 NO SUCH WIKI PAGE for a missing page AND for a draft.
      FUN`IS`PAGE:
        value: |-
          [@@(%0 a page reference — false for a missing page and for a draft alike)][not(strmatch(wiki(%0,title),#-1*))]
        flags: [funsyntax]
      # Categories are a list the page holds, the same in every translation; wiki() answers them
      # as keys, space-separated.
      FUN`IS`UNCATEGORISED:
        value: |-
          not(words(wiki(%0,categories)))
        flags: [funsyntax]
      FUN`IS`CATEGORY:
        value: |-
          [@@(%0 a category name — true when a published page is in it)][words(wikicategory(%0))]
        flags: [funsyntax]

      # A page named without its namespace is looked for in the others when main has none, so
      # "+wiki god" opens character:god. Several namespaces holding the name answer none, and
      # FUN`GET`ELSEWHERE lists them.
      FUN`GET`ELSEWHERE:
        value: |-
          [@@(%0 a page name with no namespace — the references in each namespace that has one by that name)][if(strmatch(%0,*:*),,trim(squish(iter(u(%!/FUN`GET`NAMESPACES),if(u(%!/FUN`IS`PAGE,%i0:%0),%i0:%0),%b,%b))))]
        flags: [funsyntax]
      FUN`GET`RESOLVE:
        value: |-
          [@@(%0 a page reference as typed — the page it names, or the one page of that name in another namespace, or nothing)][if(u(%!/FUN`IS`PAGE,%0),%0,if(eq(words(setr(e,u(%!/FUN`GET`ELSEWHERE,%0))),1),%q<e>))]
        flags: [funsyntax]
      # Every category any page is in, and every one with a page of its own, by key.
      FUN`GET`CATEGORIES:
        value: |-
          [@@(no arguments — every category key, sorted)][setunion(iter(wikilist(),wiki(%i0,categories),%b,%b),iter(wikilist(category),after(%i0,:),%b,%b))]
        flags: [funsyntax]
      # "category:setting" names the category setting, as its page's reference does.
      FUN`GET`CATKEY:
        value: |-
          [@@(%0 a category name as typed — its key)][edit(lcstr(trim(if(strmatch(trim(%0),category:*),after(%0,:),%0))),%b,_)]
        flags: [funsyntax]
      # A page number is a whole number from 1; =0, =-1 and =abc are mistakes, not page 1.
      FUN`IS`PAGENUM:
        value: |-
          [@@(%0 a page number as typed)][cand(isint(%0),gt(%0,0))]
        flags: [funsyntax]

      FUN`DISPLAY`COUNT:
        value: |-
          [@@(%0 a count · %1 the singular noun · %2 the plural — English does not pluralise by appending s, and "3 entrys" is what pretending it does looks like)]%0 [if(eq(%0,1),%1,%2)]
        flags: [funsyntax]
      # A category's name is the title of its page in the category namespace, which wiki() answers in
      # the reader's language. A category with no page shows its key as MediaWiki would: underscores
      # become spaces and the first letter is capitalised.
      FUN`DISPLAY`CATLABEL:
        value: |-
          [@@(%0 a category key)][if(u(%!/FUN`IS`PAGE,category:%0),wiki(category:%0,title),capstr(edit(%0,_,%b)))]
        flags: [funsyntax]
      FUN`DISPLAY`CATREF:
        value: |-
          [@@(%0 a category key — clickable where the client can take a command)][cmdlink(u(%!/FUN`DISPLAY`CATLABEL,%0),+wiki/category %0,Pages in [u(%!/FUN`DISPLAY`CATLABEL,%0)])]
        flags: [funsyntax]
      # The category bar under an article, as MediaWiki puts it under the page. Empty for a page in none.
      FUN`DISPLAY`CATBAR:
        value: |-
          [@@(%0 a page reference)][if(words(setr(c,wiki(%0,categories))),[rule()]%r[ansi(h,Categories:)]%b[iter(%q<c>,u(%!/FUN`DISPLAY`CATREF,%i0),%b,%b·%b)]%r)]
        flags: [funsyntax]
      FUN`DISPLAY`REF:
        value: |-
          [@@(%0 a page reference — clickable where the client can take a command)][cmdlink(%0,+wiki %0,Read %0)]
        flags: [funsyntax]
      FUN`DISPLAY`TABLE:
        value: |-
          [@@(%0 page references — a table of each page and its title, joined with %r and split on a newline so a title holding a | stays one cell. The title takes the spare width)][datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1),min,json(string,%r12),grow,json(string,%r1)),[ansi(h,Page)]%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],[ansi(h,Title)]%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)])]
        flags: [funsyntax]
      FUN`DISPLAY`CATTABLE:
        value: |-
          [@@(%0 category keys — each category, clickable, and how many pages are in it)][datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r2),min,json(string,12),grow,json(string,1)),[ansi(h,Category)]%r[iter(%0,u(%!/FUN`DISPLAY`CATREF,%i0),%b,%r)],>[ansi(h,Pages)]%r[iter(%0,words(wikicategory(%i0)),%b,%r)])]
        flags: [funsyntax]
      FUN`DISPLAY`RECENTTABLE:
        value: |-
          [@@(%0 page references — same as TABLE with the last edit's age)][datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r3),min,json(string,%r12),priority,json(string,1%r1%r2),grow,json(string,%r1)),[ansi(h,Page)]%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],[ansi(h,Title)]%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)],[ansi(h,Edited)]%r[iter(%0,[trim(timestring(sub(secs(),wiki(%i0,updated))))] ago,%b,%r)])]
        flags: [funsyntax]

      FUN`DISPLAY`LISTING:
        value: |-
          [@@(%0 title · %1 refs · %2 page · %3 table attribute · %4 paging stem — reads %q<pages>)][box([u(%!/%3,u(%!/FUN`GET`SLICE,%1,%2))]%r[rule()]%r[u(%!/FUN`DISPLAY`COUNT,words(%1),entry,entries)]%b-%bpage %2 of %q<pages>[if(lt(%2,%q<pages>),%b-%b%4=[add(%2,1)])],%0,,u(%!/FUN`GET`FRAME))]
        flags: [funsyntax]
      FUN`DISPLAY`ARTICLE:
        value: |-
          [@@(%0 a page reference — the whole article in a box titled with it. Literal brackets and parens below are percent-escaped, which is the only spelling that works; this comment cannot show you one, because @@ parses its own argument too)][box([rendermarkdowncustom(wiki(%0,markdown),%!,max(10,width(%#,78)))]%r[u(%!/FUN`DISPLAY`CATBAR,%0)][rule()]%rrev [wiki(%0,revision)]%b%[[wiki(%0,locale)]%]%b-%b[trim(timestring(sub(secs(),wiki(%0,updated))))] ago,[wiki(%0,title)]%b%([wiki(%0,namespace)]%),,u(%!/FUN`GET`FRAME))]
        flags: [funsyntax]
      FUN`DISPLAY`FIELDS:
        value: |-
          [@@(%0 a page reference — its metadata as a field list)][box([fields(,Title,firstof(wiki(%0,title),-),Namespace,firstof(wiki(%0,namespace),-),Revision,firstof(wiki(%0,revision),-),Locale,firstof(wiki(%0,locale),-),Categories,if(words(setr(c,wiki(%0,categories))),iter(%q<c>,u(%!/FUN`DISPLAY`CATREF,%i0),%b,%b·%b),-),Author,if(isdbref(setr(a,wiki(%0,author))),[name(%q<a>)]%b%(%q<a>%),firstof(%q<a>,-)),Updated,[trim(timestring(sub(secs(),wiki(%0,updated))))] ago)]%r[rule()]%r[cmdlink(+wiki %0,+wiki %0,Read %0)]%b·%b[cmdlink(+wiki/category,+wiki/category,Every category)],wiki(%0,title),,u(%!/FUN`GET`FRAME))]
        flags: [funsyntax]
      FUN`DISPLAY`AUDITSECTION:
        value: |-
          [@@(%0 heading · %1 refs — one capped section of the audit, empty when there is nothing to report)][if(words(%1),[rule(%0)]%r[u(%!/FUN`DISPLAY`TABLE,extract(%1,1,u(%!/FUN`GET`AUDITROWS)))]%r[if(gt(words(%1),u(%!/FUN`GET`AUDITROWS)),... and [sub(words(%1),u(%!/FUN`GET`AUDITROWS))] more%r)])]
        flags: [funsyntax]
      FUN`DISPLAY`AUDIT:
        value: |-
          [@@(%0 published · %1 uncategorised — the section only appears when it has something in it, so a clean wiki reads as two counts)][box([fields(,Published pages,words(%0),Without a category,words(%1))]%r[u(%!/FUN`DISPLAY`AUDITSECTION,Uncategorised,%1)][rule()]%rdrafts are invisible to softcode - use @wiki/list,Wiki audit,,u(%!/FUN`GET`FRAME))]
        flags: [funsyntax]
      FUN`DISPLAY`INDEX:
        value: |-
          [@@(no arguments — each namespace, clickable to its listing, with what it holds and how many pages. What it holds is left out first on a narrow screen)][box([datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r3),min,json(string,%r12),priority,json(string,1%r2%r1),grow,json(string,%r1)),[ansi(h,Namespace)]%r[iter(u(%!/FUN`GET`NAMESPACES),cmdlink(%i0,+wiki/list %i0,Pages in %i0),%b,%r)],[ansi(h,Holds)]%r[iter(u(%!/FUN`GET`NAMESPACES),u(%!/FUN`GET`NSDESC,%i0),%b,%r)],>[ansi(h,Pages)]%r[iter(u(%!/FUN`GET`NAMESPACES),words(wikilist(%i0)),%b,%r)])]%r[rule()]%r+wiki <page>%b·%b+wiki/info <page>%b·%b+wiki/search <text>%r+wiki/list %[<namespace>%]%b·%b+wiki/category %[<name>%]%b·%b+wiki/recent %[<n>%],Wiki,,u(%!/FUN`GET`FRAME))]
        flags: [funsyntax]

      # Reads registers rather than arguments: @include splits its arguments on commas, and a title
      # carries what the reader typed.
      INC`DO`LISTING:
        value: |-
          @@ no arguments — lists %q<list> with the table %q<table> under the title %q<title>, page %q<page>, paging with %q<stem>=<n>; @assert words(%q<list>)=@include %!/INC`DISPLAY`INFO=Nothing to show.; think [setq(pages,u(%!/FUN`GET`NPAGES,%q<list>))]; @assert lte(%q<page>,%q<pages>)=@include %!/INC`DISPLAY`WARN=There [if(gt(%q<pages>,1),are %q<pages> pages,is one page)] — you asked for page %q<page>.; @pemit %#=[u(%!/FUN`DISPLAY`LISTING,%q<title>,%q<list>,%q<page>,%q<table>,%q<stem>)]
        flags: [cmdsyntax]
      INC`DISPLAY`USAGE:
        value: |-
          @@ no arguments — the usage of switch %q<sw>; @pemit %#=[notice(WIKI,Usage: [trim(+wiki/%q<sw> [u(%!/FUN`GET`USAGE,%q<sw>)])],warn)]
        flags: [cmdsyntax]
      INC`DISPLAY`BADSWITCH:
        value: |-
          @@ no arguments — %q<typed> is a switch naming no single one; @pemit %#=[notice(WIKI,[if(not(strlen(%q<typed>)),+wiki/ needs a switch.,if(words(setr(c,graball(u(%!/FUN`GET`SWITCHES),%q<typed>*))),+wiki/%q<typed> could be [itemize(iter(%q<c>,/%i0,%b,|),|,or)].,+wiki has no /%q<typed> switch.))] Switches: [iter(u(%!/FUN`GET`SWITCHES,%#),cmdlink(/%i0,+wiki/%i0),%b,%b)],warn)]
        flags: [cmdsyntax]

      INC`IS`NAMESPACE:
        value: |-
          @@ no arguments — validates the optional %q<namespace> a listing was asked for. No commas in the message: @include splits its right side on them, so itemize() here would report "Try main" and stop.; @assert cor(not(%q<namespace>),u(%!/FUN`IS`NAMESPACE,%q<namespace>))=@include %!/INC`DISPLAY`WARN=No such namespace: %q<namespace>. Try one of: [u(%!/FUN`GET`NAMESPACES)].
        flags: [cmdsyntax]

      INC`IS`ADMIN:
        value: |-
          @@ no arguments — staff only, checked against the caller's flags; @assert orflags(%#,Wr)=@include %!/INC`DISPLAY`DENIED=Staff only.
        flags: [cmdsyntax]
      INC`IS`PAGE:
        value: |-
          @@ no arguments — validates %q<ref>, which the calling command stages, and resolves it to the page it names; @assert strlen(%q<ref>)=@include %!/INC`DISPLAY`WARN=Which page? Try +wiki/list.; think [setq(found,u(%!/FUN`GET`RESOLVE,%q<ref>))]; @assert cor(strlen(%q<found>),lte(words(setr(also,u(%!/FUN`GET`ELSEWHERE,%q<ref>))),1))=@pemit %#=[notice(WIKI,There is no main page called %q<ref>. Did you mean [itemize(iter(%q<also>,u(%!/FUN`DISPLAY`REF,%i0),%b,|),|,or)]?,warn)]; @assert strlen(%q<found>)=@include %!/INC`DISPLAY`WARN=No such wiki page: %q<ref>; think [setq(ref,%q<found>)]
        flags: [cmdsyntax]

      # Non-capturing groups are "(?\:" — a bare colon would end the pattern.
      CMD`INDEX:
        value: |-
          $^\+wiki\s*$:@pemit %#=[u(%!/FUN`DISPLAY`INDEX)]
        flags: [regexp, cmdsyntax]

      CMD`READ:
        value: |-
          $(?s)^\+wiki\s+(?<ref>\S.*)$:think [setq(ref,trim(r(ref,args)))]; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`ARTICLE,%q<ref>)]
        flags: [regexp, cmdsyntax]

      # Every switch comes through here, named in full or by any beginning only it has (/l is /list),
      # and runs its INC`SW leaf with %q<rest>, whatever followed the switch. Matching every switch in
      # one pattern is what lets a mistyped one answer rather than fall through to Huh?.
      CMD`SWITCH:
        value: |-
          $(?s)^\+wiki/(?<sw>[^\s=]*)(?<rest>.*)$:think [setq(typed,lcstr(r(sw,args)),rest,r(rest,args))][setq(sw,u(%!/FUN`GET`SWITCH,%q<typed>))]; @assert strlen(%q<sw>)=@include %!/INC`DISPLAY`BADSWITCH; @include %!/INC`SW`[ucstr(%q<sw>)]
        flags: [regexp, cmdsyntax]
      FUN`GET`SWITCHES:
        value: |-
          [@@(%0 the reader, optional — the switches, the staff one too when %0 is staff or not given)]list search category recent info[if(cor(not(strlen(%0)),orflags(%0,Wr)),%baudit)]
        flags: [funsyntax]
      FUN`GET`SWITCH:
        value: |-
          [@@(%0 a switch as typed — the one it names, whole or by a beginning no other switch has, or nothing)][if(regmatch(%0,^\[a-z\]+$),if(member(setr(l,u(%!/FUN`GET`SWITCHES)),%0),%0,if(eq(words(setr(c,graball(%q<l>,%0*))),1),%q<c>)))]
        flags: [funsyntax]
      FUN`GET`USAGE:
        value: |-
          [@@(%0 a switch — what follows it)][switch(%0,list,\[<namespace>\]\[=<page>\],search,<text>\[=<page>\],category,\[<name>\]\[=<page>\],recent,\[<n>\]\[=<page>\],info,<page>,audit,)]
        flags: [funsyntax]
      # Splits what followed a switch into its argument and the page after an =. A listing's = always
      # starts the page; a search's only when a number (or nothing) follows its last one, so a search
      # for text holding an = is still a search.
      FUN`GET`PAGED:
        value: |-
          [@@(%0 what followed a switch · %1 1 when every = starts the page — sets %q<arg> and %q<page>)][setq(p,if(%1,after(%0,=),last(%0,=)))][if(cand(strmatch(%0,*=*),cor(%1,isint(%q<p>),not(strlen(%q<p>)))),setq(arg,trim(left(%0,sub(strlen(%0),inc(strlen(%q<p>))))),page,%q<p>),setq(arg,trim(%0),page,1))]
        flags: [funsyntax]

      INC`SW`LIST:
        value: |-
          @@ %q<rest> — \[<namespace>\]\[=<page>\]; think [u(%!/FUN`GET`PAGED,%q<rest>,1)][setq(namespace,%q<arg>)]; @assert cand(lte(words(%q<namespace>),1),u(%!/FUN`IS`PAGENUM,%q<page>))=@include %!/INC`DISPLAY`USAGE; @include %!/INC`IS`NAMESPACE; think [setq(list,wikilist(%q<namespace>),title,Pages[if(strlen(%q<namespace>),: %q<namespace>)],table,FUN`DISPLAY`TABLE,stem,trim(+wiki/list %q<namespace>))]; @include %!/INC`DO`LISTING
        flags: [cmdsyntax]
      # A * or ? in the text is a wildcard, as in +help/search: wikisearch() takes them.
      INC`SW`SEARCH:
        value: |-
          @@ %q<rest> — <text>\[=<page>\]; think [u(%!/FUN`GET`PAGED,%q<rest>)][setq(query,%q<arg>)]; @assert cand(strlen(%q<query>),u(%!/FUN`IS`PAGENUM,%q<page>))=@include %!/INC`DISPLAY`USAGE; think [setq(list,wikisearch(%q<query>),title,Search: %q<query>,table,FUN`DISPLAY`TABLE,stem,+wiki/search %q<query>)]; @include %!/INC`DO`LISTING
        flags: [cmdsyntax]
      # Categories are not in a page's name: a category is a list of pages, read with wikicategory().
      # With no name, the categories themselves.
      INC`SW`CATEGORY:
        value: |-
          @@ %q<rest> — \[<name>\]\[=<page>\]; think [u(%!/FUN`GET`PAGED,%q<rest>,1)][setq(key,u(%!/FUN`GET`CATKEY,%q<arg>))]; @assert u(%!/FUN`IS`PAGENUM,%q<page>)=@include %!/INC`DISPLAY`USAGE; think [if(strlen(%q<key>),setq(list,wikicategory(%q<key>),title,Category: [u(%!/FUN`DISPLAY`CATLABEL,%q<key>)],table,FUN`DISPLAY`TABLE,stem,+wiki/category %q<key>),setq(list,u(%!/FUN`GET`CATEGORIES),title,Categories,table,FUN`DISPLAY`CATTABLE,stem,+wiki/category))]; @include %!/INC`DO`LISTING
        flags: [cmdsyntax]
      # wikirecent() takes 1 to 50.
      INC`SW`RECENT:
        value: |-
          @@ %q<rest> — \[<n>\]\[=<page>\]; think [u(%!/FUN`GET`PAGED,%q<rest>,1)][setq(count,strfirstof(%q<arg>,10))]; @assert cand(isint(%q<count>),gt(%q<count>,0),lte(%q<count>,50),u(%!/FUN`IS`PAGENUM,%q<page>))=@include %!/INC`DISPLAY`USAGE; think [setq(list,wikirecent(%q<count>),title,Recently edited,table,FUN`DISPLAY`RECENTTABLE,stem,+wiki/recent %q<count>)]; @include %!/INC`DO`LISTING
        flags: [cmdsyntax]
      INC`SW`INFO:
        value: |-
          @@ %q<rest> — <page>; think [setq(ref,trim(%q<rest>))]; @assert strlen(%q<ref>)=@include %!/INC`DISPLAY`USAGE; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`FIELDS,%q<ref>)]
        flags: [cmdsyntax]
      # Drafts never appear in wikilist(), so this audits published pages only.
      INC`SW`AUDIT:
        value: |-
          @@ %q<rest> — nothing; @include %!/INC`IS`ADMIN; @assert not(strlen(trim(%q<rest>)))=@include %!/INC`DISPLAY`USAGE; think [setq(published,wikilist())]; @assert %q<published>=@include %!/INC`DISPLAY`INFO=No published pages to audit yet.; think [setq(uncategorised,filterq(categorised,%!/FUN`IS`UNCATEGORISED,%q<published>))]; @pemit %#=[u(%!/FUN`DISPLAY`AUDIT,%q<published>,%q<uncategorised>)]
        flags: [cmdsyntax]

      # ---- +help topics -------------------------------------------------------
      # These sit on wiki_global itself, which is fine because it carries no privileged flag — the
      # librarian cannot u() a privileged object's attribute, so a package whose command object must
      # be WIZARD (scene's Logger) needs a plain one for its help instead.
      HELP: |-
        Reading the wiki from in-game.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WIKI`AUDIT: |-
        wiki
      HELP`WIKI: |-
        The wiki holds this game's longer-form writing — setting, theme, policy — and `+wiki` reads
        it without leaving the game. Staff edit it with `@wiki` or through the portal.

        - `+wiki` — what is there, by namespace
        - `+wiki <page>` — read one, rendered
        - `+wiki/list %[<namespace>%]` — every published page, or one namespace's
        - `+wiki/search <text>` — pages matching the text; `*` and `?` are wildcards
        - `+wiki/recent %[<n>%]` — what changed lately, 1 to 50 pages
        - `+wiki/category %[<name>%]` — the pages in a category, or every category
        - `+wiki/info <page>` — a page's title, categories and revision

        The namespaces are `main`, `help`, `character`, `system` and `category`. A page is named
        `<namespace>:<slug>` (`help:markdown_guide`); a main page by its slug alone. A slug main has
        no page for is looked for in the others, so `+wiki god` opens `character:god`. Its categories
        are not part of its name: they are listed under the article, the same in every language,
        and staff set them with `@wiki/category <page>=<name>, <name>`. Long listings page with
        `=<n>`: `+wiki/list main=2`.

        A switch can be cut short to any beginning no other switch has: `+wiki/c` is `+wiki/category`.

        Drafts are invisible here — a page appears once it is published.
      HELP`WIKI`AUDIT: |-
        `+wiki/audit` is a staff verb. It counts the published pages and lists the ones in no
        category, which is what makes a wiki hard to navigate as it grows.

        It sees published pages only. For drafts, use `@wiki/list`.

  # ---- +help registration -----------------------------------------------------
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WIKI-READER: |-
        {{wiki_global}}

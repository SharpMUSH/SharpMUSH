format: 1
package: wiki-reader
version: 1.2.0
authors: [SharpMUSH]
description: "+wiki — a reading front end for @wiki: paged listings, a rendered article view, and an editorial audit for staff."
license: MIT
keywords: [wiki, help, navigation, ui]
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: wiki_global
    type: thing
    name: Wiki Reader
    location: "{{$master_room}}"
    # Send_OOB is what cmdlink() asks of whoever writes a command link, as PennMUSH asks it of XCH_CMD.
    powers: [Send_OOB]
    attributes:

      FUN:
        value: |-
          Reads. GET lookups, IS predicates, DISPLAY formatting.
        flags: [no_command]
      INC:
        value: |-
          Reusable command steps. IS assertions, DO effects, DISPLAY output.
        flags: [no_command]

      # CODEBLOCK and TABLE are left unset on purpose: their defaults already
      # syntax-highlight and lay out better than a template would here.
      RENDERMARKUP`H1:
        value: |-
          [ansi(hw,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H2:
        value: |-
          [ansi(hc,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H3:
        value: |-
          [ansi(hb,%0)]
        flags: [funsyntax]
      RENDERMARKUP`LISTITEM:
        value: |-
          [if(%0,[ansi(hc,%1.)],[ansi(hc,*)])] %2
        flags: [funsyntax]
      RENDERMARKUP`QUOTE:
        value: |-
          [ansi(hy,%0)]
        flags: [funsyntax]
      # [[Page]] in an article body becomes a +wiki command for a client that
      # can click one, and stays highlighted prose for everyone else. A RENDERMARKUP
      # template runs as the READER, who has no Send_OOB for cmdlink(), so it goes
      # through wikilink(): a global @function, which runs as this object.
      RENDERMARKUP`WIKILINK:
        value: |-
          [ansi(hc,[wikilink(%0,%1,%2)])]
        flags: [funsyntax]
      # wikilink(<text>, <page>[, <hint>]) — registered globally by STARTUP. It can only ever
      # write a link running "+wiki <page>", which is why lending this object's Send_OOB to
      # every caller through it lends nothing more.
      FUN`WIKILINK:
        value: |-
          [@@(%0 the text · %1 a page reference · %2 the hint, optional)][cmdlink(%0,+wiki %1,%2)]
        flags: [funsyntax]
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP
      STARTUP: |-
        @function wikilink=%!,FUN`WIKILINK,2,3

      INC`DISPLAY`ERROR:
        value: |-
          @@ %0 the message — every failure in this package is reported through here; @pemit %#=[notice(WIKI,%0,error)]
        flags: [cmdsyntax]
      INC`DISPLAY`INFO:
        value: |-
          @@ %0 the message — for an empty result, which is not a failure; @pemit %#=[notice(WIKI,%0)]
        flags: [cmdsyntax]

      # The namespaces @wiki knows (WikiNamespace). Named once so the index, the listing
      # validator and anything else agree on the set. A category's own page lives in "category".
      FUN`GET`NAMESPACES:
        value: |-
          main help character system category
        flags: [funsyntax]

      FUN`GET`ROWS:
        value: |-
          [@@(no arguments — listing rows that fit the reader's screen, under the box's title, headings, footer and edges)][max(5,sub(height(%#,24),8))]
        flags: [funsyntax]
      # Half a screen: the audit prints two of these sections, and a wiki with a hundred untagged
      # pages should tell a staffer that rather than scroll the count off the top of their terminal.
      FUN`GET`AUDITROWS:
        value: |-
          max(5,div(u(%!/FUN`GET`ROWS),2))
        flags: [funsyntax]
      FUN`GET`NPAGES:
        value: |-
          [@@(%0 refs — how many pages the reader's screen splits them into)][add(1,div(sub(max(1,words(%0)),1),u(%!/FUN`GET`ROWS)))]
        flags: [funsyntax]
      FUN`GET`SLICE:
        value: |-
          [@@(%0 refs · %1 page number — the refs shown on that page)][extract(%0,add(1,mul(sub(%1,1),u(%!/FUN`GET`ROWS))),u(%!/FUN`GET`ROWS))]
        flags: [funsyntax]

      FUN`IS`NAMESPACE:
        value: |-
          [@@(%0 a namespace name — case-insensitive, false for anything @wiki would not accept)][member(u(%!/FUN`GET`NAMESPACES),lcstr(%0))]
        flags: [funsyntax]
      # wiki() answers #-1 NO SUCH WIKI PAGE for a missing page AND for a draft.
      FUN`IS`PAGE:
        value: |-
          [@@(%0 a page reference — false for a missing page and for a draft alike)][not(strmatch(wiki(%0,title),#-1*))]
        flags: [funsyntax]
      # Categories are a list the page holds, the same in every translation; wiki() answers them
      # as keys, space-separated.
      FUN`IS`UNCATEGORISED:
        value: |-
          not(words(wiki(%0,categories)))
        flags: [funsyntax]
      FUN`IS`CATEGORY:
        value: |-
          [@@(%0 a category name — true when a published page is in it)][words(wikicategory(%0))]
        flags: [funsyntax]

      FUN`DISPLAY`COUNT:
        value: |-
          [@@(%0 a count · %1 the singular noun · %2 the plural — English does not pluralise by appending s, and "3 entrys" is what pretending it does looks like)]%0 [if(eq(%0,1),%1,%2)]
        flags: [funsyntax]
      # A category's name is the title of its page in the category namespace, which wiki() answers in
      # the reader's language. A category with no page shows its key as MediaWiki would: underscores
      # become spaces and the first letter is capitalised.
      FUN`DISPLAY`CATLABEL:
        value: |-
          [@@(%0 a category key)][if(u(%!/FUN`IS`PAGE,category:%0),wiki(category:%0,title),capstr(edit(%0,_,%b)))]
        flags: [funsyntax]
      FUN`DISPLAY`CATREF:
        value: |-
          [@@(%0 a category key — clickable where the client can take a command)][cmdlink(u(%!/FUN`DISPLAY`CATLABEL,%0),+wiki/category %0,Pages in [u(%!/FUN`DISPLAY`CATLABEL,%0)])]
        flags: [funsyntax]
      # The category bar under an article, as MediaWiki puts it under the page. Empty for a page in none.
      FUN`DISPLAY`CATBAR:
        value: |-
          [@@(%0 a page reference)][if(words(setr(c,wiki(%0,categories))),[rule()]%r[ansi(h,Categories:)]%b[iter(%q<c>,u(%!/FUN`DISPLAY`CATREF,%i0),%b,%b·%b)]%r)]
        flags: [funsyntax]
      FUN`DISPLAY`REF:
        value: |-
          [@@(%0 a page reference — clickable where the client can take a command)][cmdlink(%0,+wiki %0,Read %0)]
        flags: [funsyntax]
      FUN`DISPLAY`TABLE:
        value: |-
          [@@(%0 page references — a table of each page and its title, joined with %r and split on a newline so a title holding a | stays one cell)][datacolumns(json(object,delim,json(string,%r),nowrap,json(string,1),min,json(string,%r12)),Page%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],Title%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)])]
        flags: [funsyntax]
      FUN`DISPLAY`RECENTTABLE:
        value: |-
          [@@(%0 page references — same as TABLE with the last edit's age)][datacolumns(json(object,delim,json(string,%r),nowrap,json(string,1%r3),min,json(string,%r12),priority,json(string,1%r1%r2)),Page%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],Title%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)],Edited%r[iter(%0,[trim(timestring(sub(secs(),wiki(%i0,updated))))] ago,%b,%r)])]
        flags: [funsyntax]

      FUN`DISPLAY`LISTING:
        value: |-
          [@@(%0 title · %1 refs · %2 page · %3 table attribute · %4 paging stem — reads %q<pages>)][box([u(%!/%3,u(%!/FUN`GET`SLICE,%1,%2))]%r[rule()]%r[u(%!/FUN`DISPLAY`COUNT,words(%1),entry,entries)]%b-%bpage %2 of %q<pages>[if(lt(%2,%q<pages>),%b-%b%4=[add(%2,1)])],%0)]
        flags: [funsyntax]
      FUN`DISPLAY`ARTICLE:
        value: |-
          [@@(%0 a page reference — the whole article in a box titled with it. Literal brackets and parens below are percent-escaped, which is the only spelling that works; this comment cannot show you one, because @@ parses its own argument too)][box([rendermarkdowncustom(wiki(%0,markdown),%!,max(10,sub(width(%#,78),4)))]%r[u(%!/FUN`DISPLAY`CATBAR,%0)][rule()]%rrev [wiki(%0,revision)]%b%[[wiki(%0,locale)]%]%b-%b[trim(timestring(sub(secs(),wiki(%0,updated))))] ago,[wiki(%0,title)]%b%([wiki(%0,namespace)]%))]
        flags: [funsyntax]
      FUN`DISPLAY`FIELDS:
        value: |-
          [@@(%0 a page reference — its metadata as a field list)][box([fields(,Title,firstof(wiki(%0,title),-),Namespace,firstof(wiki(%0,namespace),-),Revision,firstof(wiki(%0,revision),-),Locale,firstof(wiki(%0,locale),-),Categories,if(words(setr(c,wiki(%0,categories))),iter(%q<c>,u(%!/FUN`DISPLAY`CATREF,%i0),%b,%b·%b),-),Author,if(isdbref(setr(a,wiki(%0,author))),[name(%q<a>)]%b%(%q<a>%),firstof(%q<a>,-)),Updated,[trim(timestring(sub(secs(),wiki(%0,updated))))] ago)]%r[rule()]%r%0,wiki(%0,title))]
        flags: [funsyntax]
      FUN`DISPLAY`AUDITSECTION:
        value: |-
          [@@(%0 heading · %1 refs — one capped section of the audit, empty when there is nothing to report)][if(words(%1),[rule(%0)]%r[u(%!/FUN`DISPLAY`TABLE,extract(%1,1,u(%!/FUN`GET`AUDITROWS)))]%r[if(gt(words(%1),u(%!/FUN`GET`AUDITROWS)),... and [sub(words(%1),u(%!/FUN`GET`AUDITROWS))] more%r)])]
        flags: [funsyntax]
      FUN`DISPLAY`AUDIT:
        value: |-
          [@@(%0 published · %1 uncategorised — the section only appears when it has something in it, so a clean wiki reads as two counts)][box([fields(,Published pages,words(%0),Without a category,words(%1))]%r[u(%!/FUN`DISPLAY`AUDITSECTION,Uncategorised,%1)][rule()]%rdrafts are invisible to softcode - use @wiki/list,Wiki audit)]
        flags: [funsyntax]
      FUN`DISPLAY`INDEX:
        value: |-
          [box([datacolumns(json(object,nowrap,"1|2"),Namespace|[iter(u(%!/FUN`GET`NAMESPACES),%i0,%b,|)],>Pages|[iter(u(%!/FUN`GET`NAMESPACES),words(wikilist(%i0)),%b,|)])]%r[rule()]%r+wiki <page>%b·%b+wiki/info <page>%b·%b+wiki/search <text>%r+wiki/list %[<namespace>%]%b·%b+wiki/category <name>%b·%b+wiki/recent %[<n>%],Wiki)]
        flags: [funsyntax]

      INC`DO`LISTING:
        value: |-
          @@ %0 title · %1 refs · %2 page · %3 row attribute · %4 paging stem; @assert %1=@include %!/INC`DISPLAY`INFO=Nothing to show.; think [setq(pages,u(%!/FUN`GET`NPAGES,%1))]; @assert lte(%2,%q<pages>)=@include %!/INC`DISPLAY`ERROR=There [if(gt(%q<pages>,1),are %q<pages> pages,is one page)] — you asked for page %2.; @pemit %#=[u(%!/FUN`DISPLAY`LISTING,%0,%1,%2,%3,%4)]
        flags: [cmdsyntax]

      INC`IS`NAMESPACE:
        value: |-
          @@ no arguments — validates the optional %q<namespace> a listing was asked for. No commas in the message: @include splits its right side on them, so itemize() here would report "Try main" and stop.; @assert cor(not(%q<namespace>),u(%!/FUN`IS`NAMESPACE,%q<namespace>))=@include %!/INC`DISPLAY`ERROR=No such namespace: %q<namespace>. Try one of: [u(%!/FUN`GET`NAMESPACES)].
        flags: [cmdsyntax]

      INC`IS`ADMIN:
        value: |-
          @@ no arguments — staff only, checked against the caller's flags; @assert orflags(%#,Wr)=@include %!/INC`DISPLAY`ERROR=Staff only.
        flags: [cmdsyntax]
      INC`IS`PAGE:
        value: |-
          @@ no arguments — validates %q<ref>, which the calling command stages; @assert %q<ref>=@include %!/INC`DISPLAY`ERROR=Which page? Try +wiki/list.; @assert u(%!/FUN`IS`PAGE,%q<ref>)=@include %!/INC`DISPLAY`ERROR=No such wiki page: %q<ref>
        flags: [cmdsyntax]

      # Non-capturing groups are "(?\:" — a bare colon would end the pattern.
      CMD`INDEX:
        value: |-
          $^\+wiki\s*$:@pemit %#=[u(%!/FUN`DISPLAY`INDEX)]
        flags: [regexp, cmdsyntax]

      CMD`READ:
        value: |-
          $(?s)^\+wiki\s+(?<ref>\S.*)$:think [setq(ref,trim(r(ref,args)))]; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`ARTICLE,%q<ref>)]
        flags: [regexp, cmdsyntax]

      CMD`LIST:
        value: |-
          $^\+wiki/list(?\:\s+(?<ns>[^\s=]+))?(?\:=(?<page>\d+))?$:think [setq(namespace,r(ns,args),page,strfirstof(r(page,args),1))]; @include %!/INC`IS`NAMESPACE; think [setq(refs,wikilist(%q<namespace>),title,Pages[if(%q<namespace>,: %q<namespace>)],hint,trim(+wiki/list %q<namespace>))]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`TABLE,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`SEARCH:
        value: |-
          $(?s)^\+wiki/search\s+(?<q>\S.*?)(?\:=(?<page>\d+))?$:think [setq(query,r(q,args),page,strfirstof(r(page,args),1))]; think [setq(refs,wikisearch(%q<query>),title,Search: %q<query>,hint,+wiki/search %q<query>)]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`TABLE,%q<hint>
        flags: [regexp, cmdsyntax]

      # Categories are not in a page's name: a category is a list of pages, read with wikicategory().
      CMD`CATEGORY:
        value: |-
          $^\+wiki/category\s+(?<name>[^=]*\S)(?\:=(?<page>\d+))?$:think [setq(category,trim(r(name,args)),page,strfirstof(r(page,args),1))]; think [setq(refs,wikicategory(%q<category>),title,Category: [u(%!/FUN`DISPLAY`CATLABEL,edit(lcstr(%q<category>),%b,_))],hint,+wiki/category %q<category>)]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`TABLE,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`RECENT:
        value: |-
          $^\+wiki/recent(?\:\s+(?<count>\d+))?(?\:=(?<page>\d+))?$:think [setq(count,strfirstof(r(count,args),10),page,strfirstof(r(page,args),1))]; think [setq(refs,wikirecent(%q<count>),title,Recently edited,hint,+wiki/recent %q<count>)]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`RECENTTABLE,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`INFO:
        value: |-
          $(?s)^\+wiki/info\s+(?<ref>\S.*)$:think [setq(ref,trim(r(ref,args)))]; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`FIELDS,%q<ref>)]
        flags: [regexp, cmdsyntax]

      CMD`USAGE:
        value: |-
          $^\+wiki/(?<sw>search|info|category)\s*$:@include %!/INC`DISPLAY`ERROR=Usage: +wiki/[r(sw,args)] [switch(r(sw,args),info,<page>,category,<name>,<text>)]
        flags: [regexp, cmdsyntax]

      # Drafts never appear in wikilist(), so this audits published pages only.
      CMD`AUDIT:
        value: |-
          $^\+wiki/audit$:@include %!/INC`IS`ADMIN; think [setq(published,wikilist())]; @assert %q<published>=@include %!/INC`DISPLAY`INFO=No published pages to audit yet.; think [setq(uncategorised,filterq(categorised,%!/FUN`IS`UNCATEGORISED,%q<published>))]; @pemit %#=[u(%!/FUN`DISPLAY`AUDIT,%q<published>,%q<uncategorised>)]
        flags: [regexp, cmdsyntax]

      # ---- +help topics -------------------------------------------------------
      # These sit on wiki_global itself, which is fine because it carries no privileged flag — the
      # librarian cannot u() a privileged object's attribute, so a package whose command object must
      # be WIZARD (scene's Logger) needs a plain one for its help instead.
      HELP: |-
        Reading the wiki from in-game.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WIKI`AUDIT: |-
        wiki
      HELP`WIKI: |-
        The wiki holds this game's longer-form writing — setting, theme, policy — and `+wiki` reads
        it without leaving the game. Staff edit it with `@wiki` or through the portal.

        - `+wiki` — what is there, by namespace
        - `+wiki <page>` — read one, rendered
        - `+wiki/list %[<namespace>%]` — every published page, or one namespace's
        - `+wiki/search <text>` — pages matching the text
        - `+wiki/recent %[<n>%]` — what changed lately
        - `+wiki/category <name>` — the pages in a category
        - `+wiki/info <page>` — a page's title, categories and revision

        The namespaces are `main`, `help`, `character`, `system` and `category`. A page is named
        `<namespace>:<slug>` (`help:markdown_guide`); a main page by its slug alone. Its categories
        are not part of its name: they are listed under the article, the same in every language,
        and staff set them with `@wiki/category <page>=<name>, <name>`. Long listings page with
        `=<n>`: `+wiki/list main=2`.

        Drafts are invisible here — a page appears once it is published.
      HELP`WIKI`AUDIT: |-
        `+wiki/audit` is a staff verb. It counts the published pages and lists the ones in no
        category, which is what makes a wiki hard to navigate as it grows.

        It sees published pages only. For drafts, use `@wiki/list`.

  # ---- +help registration -----------------------------------------------------
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WIKI-READER: |-
        {{wiki_global}}

format: 1
package: wiki-reader
version: 1.1.0
authors: [SharpMUSH]
description: "+wiki — a reading front end for @wiki: paged listings, a rendered article view, and an editorial audit for staff."
license: MIT
keywords: [wiki, help, navigation, ui]
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: common-functions
    version: ">=1.1"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/common-functions/
      branch: main
      # common-functions ships here, not in SharpMUSH.Packages, so this points
      # at the server repo where the other examples point at the package repo.

objects:
  - ref: wiki_global
    type: thing
    name: Wiki Reader
    location: "{{$master_room}}"
    attributes:

      FUN:
        value: |-
          Reads. GET lookups, IS predicates, DISPLAY formatting.
        flags: [no_command]
      INC:
        value: |-
          Reusable command steps. IS assertions, DO effects, DISPLAY output.
        flags: [no_command]

      # CODEBLOCK and TABLE are left unset on purpose: their defaults already
      # syntax-highlight and lay out better than a template would here.
      RENDERMARKUP`H1:
        value: |-
          [ansi(hw,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H2:
        value: |-
          [ansi(hc,%0)]
        flags: [funsyntax]
      RENDERMARKUP`H3:
        value: |-
          [ansi(hb,%0)]
        flags: [funsyntax]
      RENDERMARKUP`LISTITEM:
        value: |-
          [if(%0,[ansi(hc,%1.)],[ansi(hc,*)])] %2
        flags: [funsyntax]
      RENDERMARKUP`QUOTE:
        value: |-
          [ansi(hy,%0)]
        flags: [funsyntax]
      # [[Page]] in an article body becomes a +wiki command for a client that
      # can click one, and stays highlighted prose for everyone else.
      RENDERMARKUP`WIKILINK:
        value: |-
          [if(pueblo(%#),[tagwrap(a,xch_cmd="+wiki %1" xch_hint="%2",%0)],[ansi(hc,%0)])]
        flags: [funsyntax]

      INC`DISPLAY`ERROR:
        value: |-
          @@ %0 the message — every failure in this package is reported through here; @pemit %#=[ansi(hr,Wiki>)] %0
        flags: [cmdsyntax]
      INC`DISPLAY`INFO:
        value: |-
          @@ %0 the message — for an empty result, which is not a failure; @pemit %#=[ansi(hc,Wiki>)] %0
        flags: [cmdsyntax]

      FUN`GET`ROWS:
        value: |-
          max(5,sub(height(%#,24),6))
        flags: [funsyntax]
      FUN`GET`NPAGES:
        value: |-
          [@@(%0 refs — how many pages the reader's screen splits them into)][add(1,div(sub(max(1,words(%0)),1),u(%!/FUN`GET`ROWS)))]
        flags: [funsyntax]
      FUN`GET`SLICE:
        value: |-
          [@@(%0 refs · %1 page number — the refs shown on that page)][extract(%0,add(1,mul(sub(%1,1),u(%!/FUN`GET`ROWS))),u(%!/FUN`GET`ROWS))]
        flags: [funsyntax]

      # wiki() answers #-1 NO SUCH WIKI PAGE for a missing page AND for a draft.
      FUN`IS`PAGE:
        value: |-
          [@@(%0 a page reference — false for a missing page and for a draft alike)][not(strmatch(wiki(%0,title),#-1*))]
        flags: [funsyntax]
      FUN`IS`UNCATEGORISED:
        value: |-
          not(wiki(%0,category))
        flags: [funsyntax]
      FUN`IS`UNTAGGED:
        value: |-
          not(wiki(%0,tags))
        flags: [funsyntax]

      # xch_cmd requires the Send_OOB @power; without it the ref still prints.
      FUN`DISPLAY`REF:
        value: |-
          [@@(%0 a page reference — clickable where the client can take a command)][if(pueblo(%#),[tagwrap(a,xch_cmd="+wiki %0" xch_hint="Read %0",%0)],%0)]
        flags: [funsyntax]
      FUN`DISPLAY`ROW:
        value: |-
          [@@(%0 a page reference)][ljust(u(%!/FUN`DISPLAY`REF,%0),34)][wiki(%0,title)]
        flags: [funsyntax]
      FUN`DISPLAY`RECENTROW:
        value: |-
          [@@(%0 a page reference — same as ROW with the last edit's age)][ljust(u(%!/FUN`DISPLAY`REF,%0),34)][ljust(wiki(%0,title),28)][timestring(sub(secs(),wiki(%0,updated)))] ago
        flags: [funsyntax]

      FUN`DISPLAY`LISTING:
        value: |-
          [@@(%0 title · %1 refs · %2 page · %3 row attribute · %4 paging stem — reads %q<pages>)][header(%0)]%r[iter(u(%!/FUN`GET`SLICE,%1,%2),u(%!/%3,%i0),%b,%r)]%r[footer([words(%1)] entries%b-%b page %2 of %q<pages>[if(lt(%2,%q<pages>),%b-%b %4=[add(%2,1)])])]
        flags: [funsyntax]
      FUN`DISPLAY`ARTICLE:
        value: |-
          [@@(%0 a page reference — the whole article between chrome)][header([wiki(%0,title)]%b([wiki(%0,namespace)][if(wiki(%0,category),:[wiki(%0,category)])]))]%r[rendermarkdowncustom(wiki(%0,markdown),%!,width(%#,78))]%r[footer(rev [wiki(%0,revision)]%b[[]wiki(%0,locale)[]]%b-%b[timestring(sub(secs(),wiki(%0,updated)))] ago)]
        flags: [funsyntax]
      FUN`DISPLAY`FIELDS:
        value: |-
          [@@(%0 a page reference — its metadata as a field list)][header([wiki(%0,title)])]%r[iter(title namespace category tags revision locale author,[ljust(ucstr(%i0),12)][wiki(%0,%i0)],%b,%r)]%r[ljust(UPDATED,12)][timestring(sub(secs(),wiki(%0,updated)))] ago%r[footer(%0)]
        flags: [funsyntax]
      FUN`DISPLAY`AUDIT:
        value: |-
          [@@(%0 published · %1 uncategorised · %2 untagged)][header(Wiki audit)]%r[ljust(Published pages,24)][words(%0)]%r[ljust(Without a category,24)][words(%1)]%r[ljust(Without tags,24)][words(%2)]%r[line(Uncategorised)]%r[iter(%1,u(%!/FUN`DISPLAY`ROW,%i0),%b,%r)]%r[footer(drafts are invisible to softcode - use @wiki/list)]
        flags: [funsyntax]
      FUN`DISPLAY`INDEX:
        value: |-
          [header(Wiki)]%r[iter(main help character system,[ljust(%i0,12)][rjust(words(wikilist(%i0)),4)] pages,%b,%r)]%r[line()]%r+wiki <page>%b·%b+wiki/list [<namespace>]%b·%b+wiki/search <text>%b·%b+wiki/recent%r[footer()]
        flags: [funsyntax]

      INC`DO`LISTING:
        value: |-
          @@ %0 title · %1 refs · %2 page · %3 row attribute · %4 paging stem; @assert %1=@include %!/INC`DISPLAY`INFO=Nothing to show.; think [setq(pages,u(%!/FUN`GET`NPAGES,%1))]; @assert lte(%2,%q<pages>)=@include %!/INC`DISPLAY`ERROR=There [if(gt(%q<pages>,1),are %q<pages> pages,is one page)] — you asked for page %2.; @pemit %#=[u(%!/FUN`DISPLAY`LISTING,%0,%1,%2,%3,%4)]
        flags: [cmdsyntax]

      INC`IS`ADMIN:
        value: |-
          @@ no arguments — staff only, checked against the caller's flags; @assert orflags(%#,Wr)=@include %!/INC`DISPLAY`ERROR=Staff only.
        flags: [cmdsyntax]
      INC`IS`PAGE:
        value: |-
          @@ no arguments — validates %q<ref>, which the calling command stages; @assert %q<ref>=@include %!/INC`DISPLAY`ERROR=Which page? Try +wiki/list.; @assert u(%!/FUN`IS`PAGE,%q<ref>)=@include %!/INC`DISPLAY`ERROR=No such wiki page: %q<ref>
        flags: [cmdsyntax]

      # Non-capturing groups are "(?\:" — a bare colon would end the pattern.
      CMD`INDEX:
        value: |-
          $^\+wiki$:@pemit %#=[u(%!/FUN`DISPLAY`INDEX)]
        flags: [regexp, cmdsyntax]

      CMD`READ:
        value: |-
          $^\+wiki\s+(?<ref>.+)$:think [setq(ref,trim(r(ref,args)))]; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`ARTICLE,%q<ref>)]
        flags: [regexp, cmdsyntax]

      CMD`LIST:
        value: |-
          $^\+wiki/list(?\:\s+(?<ns>\S+))?(?\:=(?<page>\d+))?$:think [setq(namespace,r(ns,args),page,strfirstof(r(page,args),1))]; think [setq(refs,wikilist(%q<namespace>),title,Pages[if(%q<namespace>,: %q<namespace>)],hint,trim(+wiki/list %q<namespace>))]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`ROW,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`SEARCH:
        value: |-
          $^\+wiki/search\s+(?<q>.+?)(?\:=(?<page>\d+))?$:think [setq(query,r(q,args),page,strfirstof(r(page,args),1))]; think [setq(refs,wikisearch(%q<query>),title,Search: %q<query>,hint,+wiki/search %q<query>)]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`ROW,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`RECENT:
        value: |-
          $^\+wiki/recent(?\:\s+(?<count>\d+))?(?\:=(?<page>\d+))?$:think [setq(count,strfirstof(r(count,args),10),page,strfirstof(r(page,args),1))]; think [setq(refs,wikirecent(%q<count>),title,Recently edited,hint,+wiki/recent %q<count>)]; @include %!/INC`DO`LISTING=%q<title>,%q<refs>,%q<page>,FUN`DISPLAY`RECENTROW,%q<hint>
        flags: [regexp, cmdsyntax]

      CMD`INFO:
        value: |-
          $^\+wiki/info\s+(?<ref>.+)$:think [setq(ref,trim(r(ref,args)))]; @include %!/INC`IS`PAGE; @pemit %#=[u(%!/FUN`DISPLAY`FIELDS,%q<ref>)]
        flags: [regexp, cmdsyntax]

      # Drafts never appear in wikilist(), so this audits published pages only.
      CMD`AUDIT:
        value: |-
          $^\+wiki/audit$:@include %!/INC`IS`ADMIN; think [setq(published,wikilist())]; @assert %q<published>=@include %!/INC`DISPLAY`INFO=No published pages to audit yet.; think [setq(uncategorised,filterq(categorised,%!/FUN`IS`UNCATEGORISED,%q<published>),untagged,filterq(tagged,%!/FUN`IS`UNTAGGED,%q<published>))]; @pemit %#=[u(%!/FUN`DISPLAY`AUDIT,%q<published>,%q<uncategorised>,%q<untagged>)]
        flags: [regexp, cmdsyntax]

      # ---- +help topics -------------------------------------------------------
      # These sit on wiki_global itself rather than on a separate storage object, which is fine
      # BECAUSE wiki_global carries no privileged flag: u() on a privileged object's attribute is
      # refused unless the evaluator is privileged too, and the librarian is not. A package whose
      # command object must be WIZARD — scene's Logger, say — needs a plain object for its help.
      #
      # Bodies are evaluated, so they are written like any other softcode: escape what should be
      # shown, leave alone what should be run. That is also how a \[cross-reference\] is spelled.
      HELP: |-
        Reading the wiki from in-game.
      HELP`WIKI: |-
        The wiki holds this game's longer-form writing — setting, theme, policy — and `+wiki` reads
        it without leaving the game. Staff edit it with `@wiki` or through the portal.

        - `+wiki` — what is there, by namespace
        - `+wiki <page>` — read one, rendered
        - `+wiki/list [<namespace>]` — every published page, or one namespace's
        - `+wiki/search <text>` — pages matching the text
        - `+wiki/recent [<n>]` — what changed lately
        - `+wiki/info <page>` — a page's title, category, tags and revision

        A page is named `<namespace>:<category>:<slug>`, and long listings page with `=<n>`:
        `+wiki/list main=2`.

        Drafts are invisible here — a page appears once it is published.

        See also \[wiki audit\].
      HELP`WIKI`AUDIT: |-
        `+wiki/audit` is a staff verb. It counts the published pages and lists the ones missing a
        category or tags, which is what makes a wiki hard to navigate as it grows.

        It sees published pages only. For drafts, use `@wiki/list`.

        See also \[wiki\].

  # ---- +help registration -----------------------------------------------------
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WIKI-READER: |-
        {{wiki_global}}

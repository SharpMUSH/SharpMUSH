format: "1.10"
package: wiki-reader
version: 1.7.2
authors: [SharpMUSH]
description: "+wiki — a reading front end for @wiki: paged listings, a rendered article view, and an editorial audit for staff."
license: MIT
keywords: [wiki, help, navigation, ui]
category: Community
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.6"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: wiki_global
    type: thing
    name: Wiki Reader
    location: "{{$master_room}}"
    # Send_OOB is what cmdlink() asks of whoever writes a command link, as PennMUSH asks it of XCH_CMD.
    # Functions lets STARTUP register wikilink().
    powers: [Send_OOB, Functions]
    attributes:

      FUN:
        value: |-
          Reads. GET lookups, IS predicates, DISPLAY formatting.
        flags: [no_command]
      INC:
        value: |-
          Reusable command steps. IS assertions, DO effects, DISPLAY output.
        flags: [no_command]

      # CODEBLOCK and TABLE are left unset on purpose: their defaults already
      # syntax-highlight and lay out better than a template would here.
      RENDERMARKUP`H1:
        value: |-
          tone(strong,%0)
        flags: [funsyntax]
      RENDERMARKUP`H2:
        value: |-
          tone(primary,%0)
        flags: [funsyntax]
      RENDERMARKUP`H3:
        value: |-
          tone(secondary,%0)
        flags: [funsyntax]
      RENDERMARKUP`LISTITEM:
        value: |-
          tone(primary,if(%0,%1.,*)) %2
        flags: [funsyntax]
      RENDERMARKUP`QUOTE:
        value: |-
          tone(muted,%0)
        flags: [funsyntax]
      # [[Page]] in an article body becomes a +wiki command for a client that
      # can click one, and stays highlighted prose for everyone else. A RENDERMARKUP
      # template runs as the READER, who has no Send_OOB for cmdlink(), so it goes
      # through wikilink(): a global @function, which runs as this object.
      RENDERMARKUP`WIKILINK:
        value: |-
          tone(info,wikilink(%0,%1,%2))
        flags: [funsyntax]
      # wikilink(<text>, <page>[, <hint>]) — registered globally by STARTUP. It can only ever
      # write a link running "+wiki <page>", which is why lending this object's Send_OOB to
      # every caller through it lends nothing more.
      # %0 the text · %1 a page reference · %2 the hint, optional
      FUN`LINK`WIKI:
        value: |-
          cmdlink(%0,+wiki %1,%2)
        flags: [funsyntax]
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP
      STARTUP: |-
        @function wikilink=%!,FUN`LINK`WIKI,2,3

      # %0 the message — a mistake in what was typed, reported as a warning.
      INC`DISPLAY`WARN:
        value: |-
          @pemit %#=notice(WIKI,%0,warn)
        flags: [cmdsyntax]
      # %0 the message — a refusal for want of permission, reported as an error.
      INC`DISPLAY`DENIED:
        value: |-
          @pemit %#=notice(WIKI,%0,error)
        flags: [cmdsyntax]
      # %0 the message — for an empty result, which is not a failure.
      INC`DISPLAY`INFO:
        value: |-
          @pemit %#=notice(WIKI,%0)
        flags: [cmdsyntax]

      # The namespaces @wiki knows (WikiNamespace). Named once so the index, the listing
      # validator and anything else agree on the set. A category's own page lives in "category".
      FUN`GET`NAMESPACES:
        value: |-
          main help character system category
        flags: [funsyntax]
      # %0 a namespace — what it holds, for the index
      FUN`NAMESPACE`DESCRIPTION:
        value: |-
          switch(%0,main,Articles,help,Help pages,character,Character biographies,system,Staff pages,category,What each category is for)
        flags: [funsyntax]
      # Every screen is a box() with no sides, corners or tees, as +help's are, drawn with the
      # librarian's FUN`GET`FRAME: a titled line across the top, dividers and a bottom line across the
      # whole width, and nothing beside the text, so a line copied from a terminal carries no |. Each
      # table gives one column the spare width (grow), so it spans the screen rather than stopping at
      # its content. Table headings are bold.
      #
      # Paging is +help's too: the librarian's FUN`PAGE`ROWS, FUN`PAGE`COUNT, FUN`PAGE`SLICE,
      # FUN`GET`PAGE, FUN`IS`PAGE and FUN`GET`SWITCH, read with u() so they run as the librarian.
      # Half a screen: the audit prints two of these sections, and a wiki with a hundred untagged
      # pages should tell a staffer that rather than scroll the count off the top of their terminal.
      FUN`PAGE`AUDITROWS:
        value: |-
          max(5,div(u({{plus-help/librarian}}/FUN`PAGE`ROWS),2))
        flags: [funsyntax]

      # %0 a namespace name — case-insensitive, false for anything @wiki would not accept
      FUN`IS`NAMESPACE:
        value: |-
          member(u(%!/FUN`GET`NAMESPACES),lcstr(%0))
        flags: [funsyntax]
      # wiki() answers #-1 NO SUCH WIKI PAGE for a missing page AND for a draft.
      # %0 a page reference — false for a missing page and for a draft alike
      FUN`IS`PAGE:
        value: |-
          not(strmatch(wiki(%0,title),#-1*))
        flags: [funsyntax]
      # Categories are a list the page holds, the same in every translation; wiki() answers them
      # as keys, space-separated. A category namespace page defines a category rather than sitting
      # in one, and main:home is the wiki's front page, reached without a category, so neither counts.
      FUN`IS`UNCATEGORISED:
        value: |-
          cand(not(words(wiki(%0,categories))),not(match(category,lcstr(wiki(%0,namespace)))),not(match(main:home,lcstr(%0))))
        flags: [funsyntax]
      # %0 a category name — true when a published page is in it
      FUN`IS`CATEGORY:
        value: |-
          words(wikicategory(%0))
        flags: [funsyntax]

      # A page named without its namespace is looked for in the others when main has none, so
      # "+wiki god" opens character:god. Several namespaces holding the name answer none, and
      # FUN`GET`ELSEWHERE lists them.
      # %0 a page name with no namespace — the references in each namespace that has one by that name
      FUN`GET`ELSEWHERE:
        value: |-
          if(strmatch(%0,*:*),,trim(squish(iter(u(%!/FUN`GET`NAMESPACES),if(u(%!/FUN`IS`PAGE,%i0:%0),%i0:%0),%b,%b))))
        flags: [funsyntax]
      # %0 a page reference as typed — the page it names, or the one page of that name in another namespace,
      # or nothing
      FUN`GET`RESOLVE:
        value: |-
          if(u(%!/FUN`IS`PAGE,%0),%0,if(eq(words(setr(wiki_elsewhere,u(%!/FUN`GET`ELSEWHERE,%0))),1),%q<wiki_elsewhere>))
        flags: [funsyntax]
      # Every category any page is in, and every one with a page of its own, by key.
      # no arguments — every category key, sorted
      FUN`GET`CATEGORIES:
        value: |-
          setunion(iter(wikilist(),wiki(%i0,categories),%b,%b),iter(wikilist(category),after(%i0,:),%b,%b))
        flags: [funsyntax]
      # "category:setting" names the category setting, as its page's reference does.
      # %0 a category name as typed — its key
      FUN`CATEGORY`KEY:
        value: |-
          edit(lcstr(trim(if(strmatch(trim(%0),category:*),after(%0,:),%0))),%b,_)
        flags: [funsyntax]

      # %0 a count · %1 the singular noun · %2 the plural — English does not pluralise by appending s, and "3
      # entrys" is what pretending it does looks like
      FUN`DISPLAY`COUNT:
        value: |-
          %0 [if(eq(%0,1),%1,%2)]
        flags: [funsyntax]
      # A category's name is the title of its page in the category namespace, which wiki() answers in
      # the reader's language. A category with no page shows its key as MediaWiki would: underscores
      # become spaces and the first letter is capitalised.
      # %0 a category key
      FUN`DISPLAY`CATEGORY`LABEL:
        value: |-
          if(u(%!/FUN`IS`PAGE,category:%0),wiki(category:%0,title),capstr(edit(%0,_,%b)))
        flags: [funsyntax]
      # %0 a category key — clickable where the client can take a command
      FUN`DISPLAY`CATEGORY`REF:
        value: |-
          cmdlink(u(%!/FUN`DISPLAY`CATEGORY`LABEL,%0),+wiki/category %0,Pages in [u(%!/FUN`DISPLAY`CATEGORY`LABEL,%0)])
        flags: [funsyntax]
      # The category bar under an article, as MediaWiki puts it under the page. Empty for a page in none.
      # %0 a page reference
      FUN`DISPLAY`CATEGORY`BAR:
        value: |-
          if(words(setr(wiki_categories,wiki(%0,categories))),rule()%r[tone(strong,Categories:)]%b[iter(%q<wiki_categories>,u(%!/FUN`DISPLAY`CATEGORY`REF,%i0),%b,%b·%b)]%r)
        flags: [funsyntax]
      # %0 a page reference — clickable where the client can take a command
      FUN`DISPLAY`REF:
        value: |-
          cmdlink(%0,+wiki %0,Read %0)
        flags: [funsyntax]
      # %0 page references — a table of each page and its title, joined with %r and split on a newline so a
      # title holding a | stays one cell. The title takes the spare width
      FUN`DISPLAY`TABLE:
        value: |-
          datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1),min,json(string,%r12),grow,json(string,%r1)),[tone(strong,Page)]%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],[tone(strong,Title)]%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)])
        flags: [funsyntax]
      # %0 category keys — each category, clickable, and how many pages are in it
      FUN`DISPLAY`CATEGORY`TABLE:
        value: |-
          datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r2),min,json(string,12),grow,json(string,1)),[tone(strong,Category)]%r[iter(%0,u(%!/FUN`DISPLAY`CATEGORY`REF,%i0),%b,%r)],>[tone(strong,Pages)]%r[iter(%0,words(wikicategory(%i0)),%b,%r)])
        flags: [funsyntax]
      # %0 page references — same as TABLE with the last edit's age
      FUN`DISPLAY`RECENT`TABLE:
        value: |-
          datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r3),min,json(string,%r12),priority,json(string,1%r1%r2),grow,json(string,%r1)),[tone(strong,Page)]%r[iter(%0,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],[tone(strong,Title)]%r[iter(%0,edit(wiki(%i0,title),%r,%b),%b,%r)],[tone(strong,Edited)]%r[iter(%0,[trim(timestring(sub(secs(),wiki(%i0,updated))))] ago,%b,%r)])
        flags: [funsyntax]

      # named: title · list the refs · page · pages how many · table the table attribute · head the command
      # and its switches · tail what follows them. The next page is head/<n> tail
      FUN`DISPLAY`LISTING:
        value: |-
          box(u(%!/%<table>,u({{plus-help/librarian}}/FUN`PAGE`SLICE,%<list>,%<page>))%r[rule()]%r[u(%!/FUN`DISPLAY`COUNT,words(%<list>),entry,entries)]%b-%bpage %<page> of %<pages>[if(lt(%<page>,%<pages>),%b-%b%<head>/[add(%<page>,1)][if(strlen(%<tail>),%b%<tail>)])],%<title>,,u({{plus-help/librarian}}/FUN`GET`FRAME))
        flags: [funsyntax]
      # %0 a page reference — the whole article in a box titled with it. Literal brackets and parens below are
      # percent-escaped, which is the only spelling that works.
      FUN`DISPLAY`ARTICLE:
        value: |-
          box(rendermarkdowncustom(wiki(%0,markdown),%!,max(10,width(%#,78)))%r[u(%!/FUN`DISPLAY`CATEGORY`BAR,%0)][rule()]%rrev [wiki(%0,revision)]%b%[[wiki(%0,locale)]%]%b-%b[trim(timestring(sub(secs(),wiki(%0,updated))))] ago,wiki(%0,title)%b%([wiki(%0,namespace)]%),,u({{plus-help/librarian}}/FUN`GET`FRAME))
        flags: [funsyntax]
      # %0 a page reference — its metadata as a field list
      FUN`DISPLAY`FIELDS:
        value: |-
          box(fields(,Title,firstof(wiki(%0,title),-),Namespace,firstof(wiki(%0,namespace),-),Revision,firstof(wiki(%0,revision),-),Locale,firstof(wiki(%0,locale),-),Categories,if(words(setr(wiki_categories,wiki(%0,categories))),iter(%q<wiki_categories>,u(%!/FUN`DISPLAY`CATEGORY`REF,%i0),%b,%b·%b),-),Author,if(isdbref(setr(wiki_author,wiki(%0,author))),name(%q<wiki_author>)%b%(%q<wiki_author>%),firstof(%q<wiki_author>,-)),Updated,trim(timestring(sub(secs(),wiki(%0,updated)))) ago)%r[rule()]%r[cmdlink(+wiki %0,+wiki %0,Read %0)]%b·%b[cmdlink(+wiki/category,+wiki/category,Every category)],wiki(%0,title),,u({{plus-help/librarian}}/FUN`GET`FRAME))
        flags: [funsyntax]
      # %0 heading · %1 refs — one capped section of the audit, empty when there is nothing to report
      FUN`DISPLAY`AUDIT`SECTION:
        value: |-
          if(words(%1),rule(%0)%r[u(%!/FUN`DISPLAY`TABLE,extract(%1,1,u(%!/FUN`PAGE`AUDITROWS)))]%r[if(gt(words(%1),u(%!/FUN`PAGE`AUDITROWS)),... and [sub(words(%1),u(%!/FUN`PAGE`AUDITROWS))] more%r)])
        flags: [funsyntax]
      # %0 published · %1 uncategorised — the section only appears when it has something in it, so a clean
      # wiki reads as two counts
      FUN`DISPLAY`AUDIT:
        value: |-
          box(fields(,Published pages,words(%0),Without a category,words(%1))%r[u(%!/FUN`DISPLAY`AUDIT`SECTION,Uncategorised,%1)][rule()]%rdrafts are invisible to softcode - use @wiki/list,Wiki audit,,u({{plus-help/librarian}}/FUN`GET`FRAME))
        flags: [funsyntax]
      # no arguments — each namespace, clickable to its listing, with what it holds and how many pages. What
      # it holds is left out first on a narrow screen
      FUN`DISPLAY`INDEX:
        value: |-
          box(datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r3),min,json(string,%r12),priority,json(string,1%r2%r1),grow,json(string,%r1)),[tone(strong,Namespace)]%r[iter(u(%!/FUN`GET`NAMESPACES),cmdlink(%i0,+wiki/list %i0,Pages in %i0),%b,%r)],[tone(strong,Holds)]%r[iter(u(%!/FUN`GET`NAMESPACES),u(%!/FUN`NAMESPACE`DESCRIPTION,%i0),%b,%r)],>[tone(strong,Pages)]%r[iter(u(%!/FUN`GET`NAMESPACES),words(wikilist(%i0)),%b,%r)])%r[rule()]%r+wiki <page>%b·%b+wiki/info <page>%b·%b+wiki/search <text>%r+wiki/list %[<namespace>%]%b·%b+wiki/category %[<name>%]%b·%b+wiki/recent %[<n>%],Wiki,,u({{plus-help/librarian}}/FUN`GET`FRAME))
        flags: [funsyntax]

      # Takes its arguments by name (@include/args), so a title carrying what the reader typed, commas
      # and all, arrives whole and nothing is left behind in a register.
      # named: list the refs · table the table attribute · title · page · head and tail, the next page
      # being head/<n> tail.
      INC`DO`LISTING:
        value: |-
          @assert words(%<list>)=@include %!/INC`DISPLAY`INFO=Nothing to show.; think setq(page_count,u({{plus-help/librarian}}/FUN`PAGE`COUNT,%<list>)); @assert lte(%<page>,%q<page_count>)=@include %!/INC`DISPLAY`WARN=There [if(gt(%q<page_count>,1),are %q<page_count> pages,is one page)] — you asked for page %<page>.; @pemit %#=uargs(%!/FUN`DISPLAY`LISTING,title,%<title>,list,%<list>,page,%<page>,pages,%q<page_count>,table,%<table>,head,%<head>,tail,%<tail>)
        flags: [cmdsyntax]
      # No arguments: the usage of switch %q<cmd_switch>.
      INC`DISPLAY`USAGE:
        value: |-
          @pemit %#=notice(WIKI,Usage: +wiki/[u(%!/FUN`GET`USAGE,%q<cmd_switch>)],warn)
        flags: [cmdsyntax]
      # No arguments: %q<cmd_typed> is a switch naming no single one.
      INC`DISPLAY`BADSWITCH:
        value: |-
          @pemit %#=notice(WIKI,[if(not(strlen(%q<cmd_typed>)),+wiki/ needs a switch.,if(words(setr(switch_candidates,graball(u(%!/FUN`GET`SWITCHES),%q<cmd_typed>*))),+wiki/%q<cmd_typed> could be [itemize(iter(%q<switch_candidates>,/%i0,%b,|),|,or)].,+wiki has no /%q<cmd_typed> switch.))] Switches: [iter(u(%!/FUN`GET`SWITCHES,%#),cmdlink(/%i0,+wiki/%i0),%b,%b)],warn)
        flags: [cmdsyntax]

      # named: namespace — validates the optional namespace a listing was asked for. No commas in the
      # message: @include splits its right side on them, so itemize() here would report "Try main" and stop.
      INC`IS`NAMESPACE:
        value: |-
          @assert cor(not(%<namespace>),u(%!/FUN`IS`NAMESPACE,%<namespace>))=@include %!/INC`DISPLAY`WARN=No such namespace: %<namespace>. Try one of: [u(%!/FUN`GET`NAMESPACES)].
        flags: [cmdsyntax]

      # No arguments: staff only, checked against the caller's flags.
      INC`IS`ADMIN:
        value: |-
          @assert orflags(%#,Wr)=@include %!/INC`DISPLAY`DENIED=Staff only.
        flags: [cmdsyntax]
      # named: ref — validates the page reference as typed and resolves it to the page it names, handed
      # back in %q<wiki_ref>.
      INC`IS`PAGE:
        value: |-
          @assert strlen(%<ref>)=@include %!/INC`DISPLAY`WARN=Which page? Try +wiki/list.; think setq(wiki_found,u(%!/FUN`GET`RESOLVE,%<ref>)); @assert cor(strlen(%q<wiki_found>),lte(words(setr(wiki_also,u(%!/FUN`GET`ELSEWHERE,%<ref>))),1))=@pemit %#=notice(WIKI,There is no main page called %<ref>. Did you mean [itemize(iter(%q<wiki_also>,u(%!/FUN`DISPLAY`REF,%i0),%b,|),|,or)]?,warn); @assert strlen(%q<wiki_found>)=@include %!/INC`DISPLAY`WARN=No such wiki page: %<ref>; think setq(wiki_ref,%q<wiki_found>)
        flags: [cmdsyntax]

      # Non-capturing groups are "(?\:" — a bare colon would end the pattern.
      CMD`INDEX:
        value: |-
          $^\+wiki\s*$:@pemit %#=u(%!/FUN`DISPLAY`INDEX)
        flags: [regexp, cmdsyntax]

      CMD`READ:
        value: |-
          $(?s)^\+wiki\s+(?<ref>\S.*)$:@include/args %!/INC`IS`PAGE=ref,trim(%<ref>); @pemit %#=u(%!/FUN`DISPLAY`ARTICLE,%q<wiki_ref>)
        flags: [regexp, cmdsyntax]

      # %0 the switches as typed, %1 what followed them: sets cmd_typed (the switches without the page),
      # cmd_rest, cmd_page (the page they end with, or nothing) and cmd_switch (the switch they name).
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_typed,lcstr(%0),
          cmd_rest,%1,
          cmd_page,u({{plus-help/librarian}}/FUN`GET`PAGE,%q<cmd_typed>),
          cmd_typed,if(strlen(%q<cmd_page>),if(strmatch(%q<cmd_typed>,*/*),before(%q<cmd_typed>,/)),%q<cmd_typed>),
          cmd_switch,u({{plus-help/librarian}}/FUN`GET`SWITCH,%q<cmd_typed>,u(%!/FUN`GET`SWITCHES)))
        flags: [funsyntax]
      # Every switch comes through here, named in full or by any beginning only it has (/l is /list),
      # and runs its INC`SWITCH leaf with %q<cmd_rest>, whatever followed the switch. Matching every switch in
      # one pattern is what lets a mistyped one answer rather than fall through to Huh?. A page is a
      # last switch of digits: +wiki/list/2 main.
      CMD`SWITCH:
        value: |-
          $(?s)^\+wiki/(?<sw>[^\s=]*)(?<rest>.*)$:think u(%!/FUN`COMMAND`PARSE,r(sw,args),r(rest,args)); @assert strlen(%q<cmd_switch>)=@include %!/INC`DISPLAY`BADSWITCH; @assert cor(not(strlen(%q<cmd_page>)),u(%!/FUN`IS`PAGED,%q<cmd_switch>))=@include %!/INC`DISPLAY`WARN=+wiki/%q<cmd_switch> takes no page number.; @assert u({{plus-help/librarian}}/FUN`IS`PAGE,setr(cmd_page,strfirstof(%q<cmd_page>,1)))=@include %!/INC`DISPLAY`USAGE; @include %!/INC`SWITCH`[ucstr(%q<cmd_switch>)]
        flags: [regexp, cmdsyntax]
      # %0 the reader, optional — the switches, the staff one too when %0 is staff or not given
      FUN`GET`SWITCHES:
        value: |-
          list search category recent info[if(cor(not(strlen(%0)),orflags(%0,Wr)),%baudit)]
        flags: [funsyntax]
      # %0 a switch — how it is typed, after +wiki/
      FUN`GET`USAGE:
        value: |-
          switch(%0,list,list\[/<page>\] \[<namespace>\],search,search\[/<page>\] <text>,category,category\[/<page>\] \[<name>\],recent,recent\[/<page>\] \[<n>\],info,info <page>,audit,audit)
        flags: [funsyntax]
      # %0 a switch — whether what it lists comes in pages
      FUN`IS`PAGED:
        value: |-
          t(member(list search category recent,%0))
        flags: [funsyntax]

      # %q<cmd_rest> — [<namespace>] · %q<cmd_page> the page.
      INC`SWITCH`LIST:
        value: |-
          think setq(list_namespace,trim(%q<cmd_rest>)); @assert lte(words(%q<list_namespace>),1)=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`IS`NAMESPACE=namespace,%q<list_namespace>; @include/args %!/INC`DO`LISTING=list,wikilist(%q<list_namespace>),title,Pages[if(strlen(%q<list_namespace>),: %q<list_namespace>)],table,FUN`DISPLAY`TABLE,head,+wiki/list,tail,%q<list_namespace>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # A * or ? in the text is a wildcard, as in +help/search: wikisearch() takes them.
      # %q<cmd_rest> — <text> · %q<cmd_page> the page.
      INC`SWITCH`SEARCH:
        value: |-
          think setq(search_query,trim(%q<cmd_rest>)); @assert strlen(%q<search_query>)=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`DO`LISTING=list,wikisearch(%q<search_query>),title,Search: %q<search_query>,table,FUN`DISPLAY`TABLE,head,+wiki/search,tail,%q<search_query>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # Categories are not in a page's name: a category is a list of pages, read with wikicategory().
      # With no name, the categories themselves.
      # %q<cmd_rest> — [<name>] · %q<cmd_page> the page.
      INC`SWITCH`CATEGORY:
        value: |-
          think setq(wiki_category,u(%!/FUN`CATEGORY`KEY,%q<cmd_rest>)); @include/args %!/INC`DO`LISTING=list,if(strlen(%q<wiki_category>),wikicategory(%q<wiki_category>),u(%!/FUN`GET`CATEGORIES)),title,if(strlen(%q<wiki_category>),Category: [u(%!/FUN`DISPLAY`CATEGORY`LABEL,%q<wiki_category>)],Categories),table,if(strlen(%q<wiki_category>),FUN`DISPLAY`TABLE,FUN`DISPLAY`CATEGORY`TABLE),head,+wiki/category,tail,%q<wiki_category>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # wikirecent() takes 1 to 50.
      # %q<cmd_rest> — [<n>] · %q<cmd_page> the page.
      INC`SWITCH`RECENT:
        value: |-
          think setq(recent_count,strfirstof(trim(%q<cmd_rest>),10)); @assert cand(isint(%q<recent_count>),gt(%q<recent_count>,0),lte(%q<recent_count>,50))=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`DO`LISTING=list,wikirecent(%q<recent_count>),title,Recently edited,table,FUN`DISPLAY`RECENT`TABLE,head,+wiki/recent,tail,%q<recent_count>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # %q<cmd_rest> — <page>.
      INC`SWITCH`INFO:
        value: |-
          @assert strlen(trim(%q<cmd_rest>))=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`IS`PAGE=ref,trim(%q<cmd_rest>); @pemit %#=u(%!/FUN`DISPLAY`FIELDS,%q<wiki_ref>)
        flags: [cmdsyntax]
      # Drafts never appear in wikilist(), so this audits published pages only.
      # %q<cmd_rest> — nothing.
      INC`SWITCH`AUDIT:
        value: |-
          @include %!/INC`IS`ADMIN; @assert not(strlen(trim(%q<cmd_rest>)))=@include %!/INC`DISPLAY`USAGE; think setq(audit_published,wikilist()); @assert %q<audit_published>=@include %!/INC`DISPLAY`INFO=No published pages to audit yet.; think setq(audit_uncategorised,filterq(categorised,%!/FUN`IS`UNCATEGORISED,%q<audit_published>)); @pemit %#=u(%!/FUN`DISPLAY`AUDIT,%q<audit_published>,%q<audit_uncategorised>)
        flags: [cmdsyntax]

      # ---- +help topics -------------------------------------------------------
      # These sit on wiki_global itself, which is fine because it carries no privileged flag — the
      # librarian cannot u() a privileged object's attribute, so a package whose command object must
      # be WIZARD (scene's Logger) needs a plain one for its help instead.
      HELP: |-
        Reading the wiki from in-game.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WIKI`AUDIT: |-
        wiki
      HELP`WIKI: |-
        The wiki holds this game's longer-form writing — setting, theme, policy — and `+wiki` reads
        it without leaving the game. Staff edit it with `@wiki` or through the portal.

        - `+wiki` — what is there, by namespace
        - `+wiki <page>` — read one, rendered
        - `+wiki/list %[<namespace>%]` — every published page, or one namespace's
        - `+wiki/search <text>` — pages matching the text; `*` and `?` are wildcards
        - `+wiki/recent %[<n>%]` — what changed lately, 1 to 50 pages
        - `+wiki/category %[<name>%]` — the pages in a category, or every category
        - `+wiki/info <page>` — a page's title, categories and revision

        The namespaces are `main`, `help`, `character`, `system` and `category`. A page is named
        `<namespace>:<slug>` (`help:markdown_guide`); a main page by its slug alone. A slug main has
        no page for is looked for in the others, so `+wiki god` opens `character:god`. Its categories
        are not part of its name: they are listed under the article, the same in every language,
        and staff set them with `@wiki/category <page>=<name>, <name>`. A long listing comes in
        pages, and the page is a last switch: `+wiki/list/2 main`.

        A switch can be cut short to any beginning no other switch has: `+wiki/c` is `+wiki/category`.

        Drafts are invisible here — a page appears once it is published.
      HELP`WIKI`AUDIT: |-
        `+wiki/audit` is a staff verb. It counts the published pages and lists the ones in no
        category, which is what makes a wiki hard to navigate as it grows. Category pages and
        `main:home` are left out: they are not reached through a category.

        It sees published pages only. For drafts, use `@wiki/list`.

  # ---- +help registration -----------------------------------------------------
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`WIKI-READER: |-
        {{wiki_global}}

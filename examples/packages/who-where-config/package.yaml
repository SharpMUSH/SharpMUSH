format: "1.16"
package: who-where-config
title: "+who and +where: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the +who and +where settings into +config: registers them with the +config registry, so staff see and change them with +config who-where."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [who-where, config, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. who-where declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: who-where
    version: ">=1.10"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/who-where/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: ww_config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`WHO-WHERE: |-
        {{who-where/ww_functions}}

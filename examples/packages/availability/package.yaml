format: "1.16"
package: availability
title: "Availability"
version: 1.1.0
authors: [SharpMUSH]
description: "+avail: when each character is busy or free, as dates, ranges and repeating patterns like an office calendar, and the times a group of players are all free."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [availability, calendar, schedule, rp]
category: Community
requires_server: ">=0.1"

# The time package keeps each player's zone in TZ and reads it through its Clock, so an entry is kept in its owner's
# own time. +help carries the topics and +config the settings. Nothing here knows about scenes: scene-availability
# adds +avail/scene and the scene card's free list on top of this package.
depends:
  - package: time
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/time/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds +avail (@command/add, @hook) and reads every
  # player's zone. +avail is added with /noparse/rsnoparse and hooked to CMD`AVAIL, so what a player types reaches
  # the code exactly as typed: a note is stored as written and never evaluated.
  #
  # An entry is a cut-down RFC 5545 event: a kind (busy or free), a first date and a start time in its owner's
  # zone, a length, and a repeat (once, daily, weekly or monthly, every so many, on some days, until a date, with
  # dates skipped). The time is kept as typed, in the owner's zone, so a weekly 19:00 stays 19:00 when summer
  # time starts; each occurrence becomes an instant only when it is expanded. Entries are kept on the Calendar
  # inside this object, one leaf per fact.
  #
  # Free time is counted in slots (DATA`CONFIG`SLOT minutes): a slot is free when a free entry covers all of it,
  # or the player has no free entry at all, and no busy entry touches it. +avail/find lays the players' slots
  # over each other and lists the runs where all are free.
  #
  # Trees: CMD` the hooked command, INC`COMMAND` the parse and dispatch, INC` one routine per command form.
  # FUN`READ` reads a typed <when>, FUN`DAY` works in day numbers (days since 1970-01-01), FUN`ENTRY` expands one
  # entry, FUN`PLAYER` and FUN`MASK` a player's free slots, FUN`FIND` the shared free runs, FUN`SCREEN` and
  # FUN`DISPLAY` draw. Every function takes its moment as an argument; only the commands read the clock.
  - ref: availability
    type: thing
    name: Availability
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # The settings +config shows and changes (plus-config): the value in DATA`CONFIG`<NAME>, and beside it what
      # it means, its type, its default, its bounds, a label and an example. Durations are in seconds.
      DATA`CONFIG: |-
        When characters are busy or free, and finding times a group is all free.
      DATA`CONFIG`LABEL: |-
        Availability
      DATA`CONFIG`SLOT: |-
        30
      DATA`CONFIG`SLOT`DESCRIPTION: |-
        Minutes in one slot: the steps free time is counted in. 1440 must divide by it.
      DATA`CONFIG`SLOT`TYPE: |-
        choice
      DATA`CONFIG`SLOT`CHOICES: |-
        15 20 30 60
      DATA`CONFIG`SLOT`DEFAULT: |-
        30
      DATA`CONFIG`SLOT`LABEL: |-
        Slot minutes
      DATA`CONFIG`SLOT`EXAMPLE: |-
        15
      DATA`CONFIG`FIND-DAYS: |-
        7
      DATA`CONFIG`FIND-DAYS`DESCRIPTION: |-
        How many days ahead +avail/find looks.
      DATA`CONFIG`FIND-DAYS`TYPE: |-
        integer
      DATA`CONFIG`FIND-DAYS`DEFAULT: |-
        7
      DATA`CONFIG`FIND-DAYS`LABEL: |-
        Days +avail/find looks ahead
      DATA`CONFIG`FIND-DAYS`EXAMPLE: |-
        14
      DATA`CONFIG`FIND-DAYS`MIN: |-
        1
      DATA`CONFIG`FIND-DAYS`MAX: |-
        28
      DATA`CONFIG`FIND-LENGTH: |-
        7200
      DATA`CONFIG`FIND-LENGTH`DESCRIPTION: |-
        How long a free time +avail/find looks for when the player names no length.
      DATA`CONFIG`FIND-LENGTH`TYPE: |-
        duration
      DATA`CONFIG`FIND-LENGTH`DEFAULT: |-
        7200
      DATA`CONFIG`FIND-LENGTH`LABEL: |-
        Length +avail/find looks for
      DATA`CONFIG`FIND-LENGTH`EXAMPLE: |-
        3h
      DATA`CONFIG`FIND-LENGTH`MIN: |-
        900
      DATA`CONFIG`FIND-LENGTH`MAX: |-
        86400
      DATA`CONFIG`FIND-RESULTS: |-
        10
      DATA`CONFIG`FIND-RESULTS`DESCRIPTION: |-
        How many free times +avail/find lists at most.
      DATA`CONFIG`FIND-RESULTS`TYPE: |-
        integer
      DATA`CONFIG`FIND-RESULTS`DEFAULT: |-
        10
      DATA`CONFIG`FIND-RESULTS`LABEL: |-
        Times +avail/find lists
      DATA`CONFIG`FIND-RESULTS`EXAMPLE: |-
        5
      DATA`CONFIG`FIND-RESULTS`MIN: |-
        1
      DATA`CONFIG`FIND-RESULTS`MAX: |-
        50
      DATA`CONFIG`FIND-PLAYERS: |-
        12
      DATA`CONFIG`FIND-PLAYERS`DESCRIPTION: |-
        How many players +avail/find takes at once, the one asking included.
      DATA`CONFIG`FIND-PLAYERS`TYPE: |-
        integer
      DATA`CONFIG`FIND-PLAYERS`DEFAULT: |-
        12
      DATA`CONFIG`FIND-PLAYERS`LABEL: |-
        Players +avail/find takes
      DATA`CONFIG`FIND-PLAYERS`EXAMPLE: |-
        8
      DATA`CONFIG`FIND-PLAYERS`MIN: |-
        2
      DATA`CONFIG`FIND-PLAYERS`MAX: |-
        30
      DATA`CONFIG`ENTRIES: |-
        30
      DATA`CONFIG`ENTRIES`DESCRIPTION: |-
        How many entries one character may keep.
      DATA`CONFIG`ENTRIES`TYPE: |-
        integer
      DATA`CONFIG`ENTRIES`DEFAULT: |-
        30
      DATA`CONFIG`ENTRIES`LABEL: |-
        Entries a character keeps
      DATA`CONFIG`ENTRIES`EXAMPLE: |-
        50
      DATA`CONFIG`ENTRIES`MIN: |-
        1
      DATA`CONFIG`ENTRIES`MAX: |-
        100
      DATA`CONFIG`NOTE-LENGTH: |-
        60
      DATA`CONFIG`NOTE-LENGTH`DESCRIPTION: |-
        How many characters an entry's note may hold.
      DATA`CONFIG`NOTE-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`NOTE-LENGTH`DEFAULT: |-
        60
      DATA`CONFIG`NOTE-LENGTH`LABEL: |-
        Longest note
      DATA`CONFIG`NOTE-LENGTH`EXAMPLE: |-
        100
      DATA`CONFIG`NOTE-LENGTH`MIN: |-
        0
      DATA`CONFIG`NOTE-LENGTH`MAX: |-
        200

      # Fixed tables, not settings.
      DATA`DAYS: |-
        sun mon tue wed thu fri sat
      DATA`DAYS`WEEK: |-
        mon tue wed thu fri sat sun
      DATA`DAYS`FULL: |-
        sunday monday tuesday wednesday thursday friday saturday
      # Words <when> passes over: they read well but say nothing the others do not.
      DATA`WORDS`FILLER: |-
        on at the of and in each for
      DATA`USAGE`ADD: |-
        Say when, such as +avail/busy weekdays 9:00-17:00=Work or +avail/free 2026-10-24 19:00-23:00. +help avail when lists what a time can say.

      # Which routine each switch runs: DATA`ROUTE`<switch>. BARE is the command alone, ARG the command with
      # something after it and no switch. Another package adds a switch with a leaf here and the INC` it names
      # (scene-availability adds /scene).
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`BARE: |-
        SHOW`MINE
      DATA`ROUTE`ARG: |-
        SHOW`OTHER
      DATA`ROUTE`BUSY: |-
        ENTRY`ADD
      DATA`ROUTE`FREE: |-
        ENTRY`ADD
      DATA`ROUTE`REMOVE: |-
        ENTRY`REMOVE
      DATA`ROUTE`SKIP: |-
        ENTRY`SKIP
      DATA`ROUTE`UNSKIP: |-
        ENTRY`UNSKIP
      DATA`ROUTE`CLEAR: |-
        ENTRY`CLEAR
      DATA`ROUTE`FIND: |-
        FIND`PLAYERS

      # ---- command --------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`AVAIL:
        value: |-
          $(?is)^\+avail(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          think u(%!/FUN`COMMAND`PARSE,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(AVAIL,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(AVAIL,+avail has no /%q<cmd_switch> switch. +help avail lists them.,warn); @assert hastype(%#,PLAYER)=@pemit %#=notice(AVAIL,Only a character keeps times.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the switches and %1 the argument, as typed. Sets cmd_switch_list, cmd_switch, cmd_argument (spaces
      # squeezed), cmd_left and cmd_right (either side of the first =; the right as typed, so a note keeps its
      # spaces), cmd_route (the INC` routine to run), now, viewer_key (where the reader's entries are kept),
      # viewer_zone (their zone, else the game's) and viewer_today (the day it is for them).
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_switch_list,lcstr(trim(edit(%0,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(squish(%1)),
          cmd_left,trim(squish(before(%1,=))),
          cmd_right,trim(after(%1,=)),
          cmd_route,get(%!/DATA`ROUTE`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          now,secs(),
          viewer_key,u(%!/FUN`KEY,%#),
          viewer_zone,u(%!/FUN`ZONE`OF,%#),
          viewer_today,u(%!/FUN`DAY`OF,%q<now>,%q<viewer_zone>))
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 an object: the key its entries are filed under. An objid cannot be part of an attribute name, so
      # #12:1790888816538 is filed as 12_1790888816538.
      FUN`KEY:
        value: |-
          edit(objid(%0),#,,:,_)
        flags: [funsyntax]
      # %0 typed text: the objid of the player it names, or nothing.
      FUN`PLAYER:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 a player: their zone, else the game's. Read here rather than through the Clock, so a zone its player
      # hid with +timezone/hide still places their own entries; nothing here shows it to anyone else.
      FUN`ZONE`OF:
        value: |-
          firstof(u({{time/clock}}/FUN`ZONE`CHECK,get(%0/TZ)),u({{time/clock}}/FUN`ZONE`GAME))
        flags: [funsyntax]
      # The setting %0, as stored.
      FUN`CONFIG:
        value: |-
          get(%!/DATA`CONFIG`%0)
        flags: [funsyntax]
      # A slot, in seconds.
      FUN`CONFIG`STEP:
        value: |-
          mul(get(%!/DATA`CONFIG`SLOT),60)
        flags: [funsyntax]

      # ---- days -------------------------------------------------------------------
      # A day is a day number, the days since 1970-01-01, which was a Thursday. A date is written 2026-10-20.
      # %0 an instant and %1 a zone: the day it is there.
      FUN`DAY`OF:
        value: |-
          div(convtime(timefmt($Y-$m-$d,%0,%1)T00:00:00Z),86400)
        flags: [funsyntax]
      # %0 a date: its day number, or nothing when it is not a date. 2026-02-30 is not one.
      FUN`DAY`FROMDATE:
        value: |-
          if(cand(strmatch(%0,????-??-??),isint(edit(%0,-,)),isint(setr(day_seconds,convtime(%0T00:00:00Z))),strmatch(timefmt($Y-$m-$d,%q<day_seconds>,UTC),%0)),div(%q<day_seconds>,86400))
        flags: [funsyntax]
      # %0 a day: its date.
      FUN`DAY`DATE:
        value: |-
          timefmt($Y-$m-$d,mul(%0,86400),UTC)
        flags: [funsyntax]
      # %0 a day: its year, month and day of the month, split by spaces, without leading zeros.
      FUN`DAY`PARTS:
        value: |-
          iter(timefmt($Y $m $d,mul(%0,86400),UTC),add(%i0,0))
        flags: [funsyntax]
      # %0 a day: its weekday, sun to sat.
      FUN`DAY`WEEKDAY:
        value: |-
          extract(get(%!/DATA`DAYS),inc(mod(add(%0,4),7)),1)
        flags: [funsyntax]
      # %0 a day: the Monday of its week.
      FUN`DAY`MONDAY:
        value: |-
          sub(%0,mod(add(%0,3),7))
        flags: [funsyntax]
      # %0 a day, %1 minutes into it (past 1440 runs into the next days) and %2 a zone: that moment, in seconds.
      # Read through the zone's own rules, so a day in summer time gets summer time's offset.
      FUN`DAY`AT:
        value: |-
          convtime(timefmt($a $b $d $H:$M:$S $Y,add(mul(%0,86400),mul(%1,60)),UTC),%2)
        flags: [funsyntax]

      # ---- reading a <when> -----------------------------------------------------------
      # %0 what the player typed, %1 their zone and %2 the day it is for them. Reads it word by word and sets:
      # read_error (what is wrong, or nothing), read_repeat (once, daily, weekly or monthly), read_every,
      # read_days (weekly: mon tue ...; monthly: 2tue, -1fri or 15), read_date (the first day), read_until (the
      # last day, or nothing), read_minute (the start, minutes into the day) and read_length (minutes).
      FUN`READ`WHEN:
        value: |-
          setqm(read_error,,
          read_repeat,,
          read_every,1,
          read_days,,
          read_nth,,
          read_monthday,,
          read_ordinal,,
          read_after,,
          read_date,,
          read_end,,
          read_until,,
          read_start_clock,,
          read_end_clock,,
          read_allday,,
          read_today,%2,
          read_words,u(%!/FUN`READ`NORMAL,%0))[null(iter(%q<read_words>,u(%!/FUN`READ`WORD,%i0)))][u(%!/FUN`READ`SETTLE)]
        flags: [funsyntax]
      # %0 typed text, in lower case with the pieces of a time and a range joined: 7 pm - 10 pm is 7pm-10pm, all
      # day is allday, and commas are spaces.
      FUN`READ`NORMAL:
        value: |-
          squish(edit(lcstr(%0),chr(44),%b,chr(8211),-,%b-,-,-%b,-,%bam,am,%bpm,pm,all%bday,allday,a.m.,am,p.m.,pm))
        flags: [funsyntax]
      # %0 one word: what it says, into the read_ registers. Nothing once something was wrong.
      FUN`READ`WORD:
        value: |-
          if(not(strlen(%q<read_error>)),cond(
          member(get(%!/DATA`WORDS`FILLER),%0),,
          match(daily everyday,%0),setq(read_repeat,daily),
          match(weekly,%0),setq(read_repeat,weekly),
          match(monthly,%0),setq(read_repeat,monthly),
          match(fortnightly biweekly,%0),setqm(read_repeat,weekly,
          read_every,2),
          match(every,%0),setq(read_after,every),
          cand(strmatch(%q<read_after>,every),match(other,%0)),setqm(read_every,2,
          read_after,),
          cand(strmatch(%q<read_after>,every),isint(%0)),u(%!/FUN`READ`EVERY,%0),
          match(day days,%0),setq(read_repeat,daily),
          match(week weeks,%0),setq(read_repeat,weekly),
          match(month months,%0),setq(read_repeat,monthly),
          match(from starting,%0),setq(read_after,from),
          match(until till through thru,%0),setq(read_after,until),
          match(to,%0),setq(read_after,to),
          match(allday,%0),setq(read_allday,1),
          strlen(setr(read_word_day,u(%!/FUN`READ`DATEWORD,%0))),u(%!/FUN`READ`PLACEDATE,%q<read_word_day>),
          strlen(setr(read_word_range,u(%!/FUN`READ`RANGE,%0))),setqm(read_start_clock,first(%q<read_word_range>),
          read_end_clock,rest(%q<read_word_range>)),
          strlen(setr(read_word_clock,u(%!/FUN`READ`CLOCK,%0,1))),u(%!/FUN`READ`PLACECLOCK,%q<read_word_clock>),
          strlen(setr(read_word_days,u(%!/FUN`READ`DAYS,%0))),u(%!/FUN`READ`PLACEDAYS,%q<read_word_days>),
          strlen(setr(read_word_ordinal,u(%!/FUN`READ`ORDINAL,%0))),u(%!/FUN`READ`PLACEORDINAL,%q<read_word_ordinal>,%0),
          setq(read_error,'%0' is not a day%, a date or a time I can read. +help avail when lists what a time can say.)))
        flags: [funsyntax]
      # %0 the number after every.
      FUN`READ`EVERY:
        value: |-
          if(cand(gte(%0,1),lte(%0,52)),setqm(read_every,%0,
          read_after,),setq(read_error,Every %0 is not a repeat I can keep. Give 1 to 52.))
        flags: [funsyntax]
      # %0 a word: the day it names, today, tomorrow or a date, or nothing.
      FUN`READ`DATEWORD:
        value: |-
          case(%0,today,%q<read_today>,tomorrow,inc(%q<read_today>),u(%!/FUN`DAY`FROMDATE,%0))
        flags: [funsyntax]
      # %0 a day: the first day after from or alone, the last after until, the end of a range after to.
      FUN`READ`PLACEDATE:
        value: |-
          switch(%q<read_after>,until,setq(read_until,%0),to,setq(read_end,%0),from,setq(read_date,%0),if(strlen(%q<read_date>),setq(read_end,%0),setq(read_date,%0)))[setq(read_after,)]
        flags: [funsyntax]
      # %0 a clock time on its own: the start, or the end after to or a start.
      FUN`READ`PLACECLOCK:
        value: |-
          if(cor(strmatch(%q<read_after>,to),strlen(%q<read_start_clock>)),setq(read_end_clock,%0),setq(read_start_clock,%0))[setq(read_after,)]
        flags: [funsyntax]
      # %0 days: after ordinals, that day in those weeks of a month (2nd and 4th tue is 2tue 4tue), else more days
      # of the week.
      FUN`READ`PLACEDAYS:
        value: |-
          if(words(%q<read_ordinal>),if(eq(words(%0),1),setqm(read_nth,setunion(%q<read_nth>,iter(%q<read_ordinal>,%i0%0)),
          read_ordinal,),setq(read_error,Name one day after %q<read_ordinal_word>%, such as 2nd tue.)),setq(read_days,setunion(%q<read_days>,%0)))
        flags: [funsyntax]
      # %0 an ordinal's number and %1 the word. Several gather until a day takes them: 2nd and 4th tue.
      FUN`READ`PLACEORDINAL:
        value: |-
          setqm(read_ordinal,setunion(%q<read_ordinal>,%0),
          read_ordinal_word,%1)
        flags: [funsyntax]
      # %0 a word: the days it names, sun to sat, or nothing. A day (tue, tuesday, tuesdays), weekdays, weekends
      # or a run of days (mon-fri, fri-mon).
      FUN`READ`DAYS:
        value: |-
          switch(%0,weekday,mon tue wed thu fri,weekdays,mon tue wed thu fri,weekend,sat sun,weekends,sat sun,*-*,u(%!/FUN`READ`DAYRUN,u(%!/FUN`READ`DAY,before(%0,-)),u(%!/FUN`READ`DAY,after(%0,-))),u(%!/FUN`READ`DAY,%0))
        flags: [funsyntax]
      # %0 a word: the one day it names, or nothing. Three letters or more of a day's name, with a plural s.
      FUN`READ`DAY:
        value: |-
          if(gte(strlen(setr(read_day_word,if(cand(gt(strlen(%0),3),strmatch(%0,*s)),left(%0,dec(strlen(%0))),%0))),3),first(iter(get(%!/DATA`DAYS`FULL),if(strmatch(%i0,%q<read_day_word>*),left(%i0,3)))))
        flags: [funsyntax]
      # %0 and %1 two days: the days from one to the other, round the end of the week when need be.
      FUN`READ`DAYRUN:
        value: |-
          if(cand(strlen(%0),strlen(%1)),iter(lnum(0,mod(sub(match(get(%!/DATA`DAYS),%1),match(get(%!/DATA`DAYS),%0)),7)),extract(get(%!/DATA`DAYS),inc(mod(add(dec(match(get(%!/DATA`DAYS),%0)),%i0),7)),1)))
        flags: [funsyntax]
      # %0 a word: the number it counts, 1st to 31st, first to fifth, or -1 for last; nothing otherwise.
      FUN`READ`ORDINAL:
        value: |-
          case(%0,first,1,second,2,third,3,fourth,4,fifth,5,last,-1,if(cand(match(st nd rd th,right(%0,2)),isint(setr(read_ordinal_number,left(%0,sub(strlen(%0),2)))),gte(%q<read_ordinal_number>,1),lte(%q<read_ordinal_number>,31)),%q<read_ordinal_number>))
        flags: [funsyntax]
      # %0 a word, a clock time: 19:00, 7pm, 7:30pm, noon or midnight, or with %1 1 an hour alone is refused.
      # Minutes into the day (24:00 is 1440), or nothing. Sets read_clock_marked when it says am or pm.
      FUN`READ`CLOCK:
        value: |-
          setqm(read_clock_ampm,if(cor(strmatch(%0,*am),strmatch(%0,*pm)),right(%0,2)),
          read_clock_marked,strlen(%q<read_clock_ampm>),
          read_clock_core,if(%q<read_clock_marked>,left(%0,sub(strlen(%0),2)),%0),
          read_clock_hour,first(%q<read_clock_core>,:),
          read_clock_minute,if(strmatch(%q<read_clock_core>,*:*),rest(%q<read_clock_core>,:),00))[case(1,
          match(noon,%0),720,
          match(midnight,%0),0,
          cand(%1,not(%q<read_clock_marked>),not(strmatch(%0,*:*))),,
          not(u(%!/FUN`READ`CLOCKOK)),,
          add(mul(if(%q<read_clock_marked>,add(mod(%q<read_clock_hour>,12),if(strmatch(%q<read_clock_ampm>,pm),12,0)),%q<read_clock_hour>),60),%q<read_clock_minute>))]
        flags: [funsyntax]
      # 1 when the read_clock_ registers make a time: 0 to 24, or 1 to 12 with am or pm, and 00 to 59.
      FUN`READ`CLOCKOK:
        value: |-
          cand(isint(%q<read_clock_hour>),lte(strlen(%q<read_clock_hour>),2),isint(%q<read_clock_minute>),eq(strlen(%q<read_clock_minute>),2),gte(%q<read_clock_minute>,0),lte(%q<read_clock_minute>,59),if(%q<read_clock_marked>,cand(gte(%q<read_clock_hour>,1),lte(%q<read_clock_hour>,12)),cand(gte(%q<read_clock_hour>,0),lte(%q<read_clock_hour>,24))),not(cand(eq(%q<read_clock_hour>,24),gt(%q<read_clock_minute>,0))))
        flags: [funsyntax]
      # %0 a word, a range of clock times, 19:00-22:00, 7pm-10pm or 9-5: the start and end, in minutes, split by
      # a space; or nothing. An end with no am or pm and no minutes that would come before a start without them is
      # read as afternoon, so 9-5 is 09:00-17:00; 23:00-02:00 still runs past midnight.
      FUN`READ`RANGE:
        value: |-
          if(cand(strmatch(%0,?*-?*),strlen(setr(read_range_start,u(%!/FUN`READ`CLOCK,before(%0,-)))[setq(read_range_start_marked,%q<read_clock_marked>)]),strlen(setr(read_range_end,u(%!/FUN`READ`CLOCK,after(%0,-))))),%q<read_range_start> [if(cand(not(%q<read_range_start_marked>),not(%q<read_clock_marked>),not(strmatch(after(%0,-),*:*)),lte(%q<read_range_end>,%q<read_range_start>),gt(add(%q<read_range_end>,720),%q<read_range_start>)),add(%q<read_range_end>,720),%q<read_range_end>)])
        flags: [funsyntax]
      # After every word: what the words add up to, or why they do not.
      FUN`READ`SETTLE:
        value: |-

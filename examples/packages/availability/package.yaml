        flags: [cmdsyntax]
      # Writes the entry the read_ registers hold as %q<entry_number>. A leaf with nothing to say is not written.
      INC`ENTRY`WRITE:
        value: |-
          &PLAYER`%q<viewer_key> {{calendar}}=%:; &PLAYER`%q<viewer_key>`%q<entry_number> {{calendar}}=%q<cmd_switch>; &PLAYER`%q<viewer_key>`%q<entry_number>`KIND {{calendar}}=%q<cmd_switch>; &PLAYER`%q<viewer_key>`%q<entry_number>`REPEAT {{calendar}}=%q<read_repeat>; @if gt(%q<read_every>,1)={&PLAYER`%q<viewer_key>`%q<entry_number>`EVERY {{calendar}}=%q<read_every>}; @if strlen(%q<read_days>)={&PLAYER`%q<viewer_key>`%q<entry_number>`DAYS {{calendar}}=%q<read_days>}; &PLAYER`%q<viewer_key>`%q<entry_number>`DATE {{calendar}}=u(%!/FUN`DAY`DATE,%q<read_date>); &PLAYER`%q<viewer_key>`%q<entry_number>`TIME {{calendar}}=u(%!/FUN`DISPLAY`CLOCK,%q<read_minute>); &PLAYER`%q<viewer_key>`%q<entry_number>`MINUTES {{calendar}}=%q<read_length>; @if strlen(%q<read_until>)={&PLAYER`%q<viewer_key>`%q<entry_number>`UNTIL {{calendar}}=u(%!/FUN`DAY`DATE,%q<read_until>)}; &PLAYER`%q<viewer_key>`%q<entry_number>`ZONE {{calendar}}=%q<viewer_zone>; @if strlen(%q<cmd_right>)={&PLAYER`%q<viewer_key>`%q<entry_number>`NOTE {{calendar}}=%q<cmd_right>}
        flags: [cmdsyntax]
      # Sets entry_number from what was typed, when it names one of the reader's entries.
      INC`ENTRY`FIND:
        value: |-
          think setq(entry_number,firstof(%q<cmd_left>,%q<cmd_argument>)); @assert strlen(%q<entry_number>)=@pemit %#=notice(AVAIL,Which entry? +avail lists yours with their numbers.,warn); @assert cand(isint(%q<entry_number>),hasattr({{calendar}},PLAYER`%q<viewer_key>`%q<entry_number>))=@pemit %#=notice(AVAIL,You have no entry %q<entry_number>. +avail lists yours.,warn)
        flags: [cmdsyntax]
      INC`ENTRY`REMOVE:
        value: |-
          @include %!/INC`ENTRY`FIND; think setq(entry_words,u(%!/FUN`ENTRY`DESCRIBE,%q<viewer_key>,%q<entry_number>,%q<viewer_zone>)); @wipe {{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>; @if not(words(u(%!/FUN`PLAYER`ENTRIES,%q<viewer_key>)))={&PLAYER`%q<viewer_key> {{calendar}}}; @pemit %#=notice(AVAIL,Removed %q<entry_number>: %q<entry_words>.,ok)
        flags: [cmdsyntax]
      # +avail/skip <n>=<date>: one date left out of a repeating entry.
      INC`ENTRY`SKIP:
        value: |-
          @include %!/INC`ENTRY`FIND; @include %!/INC`ENTRY`SKIPDATE; @assert not(member(get({{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>`SKIP),%q<skip_date>))=@pemit %#=notice(AVAIL,Entry %q<entry_number> already leaves out [u(%!/FUN`DISPLAY`DAY,%q<skip_day>,1)].,warn); &PLAYER`%q<viewer_key>`%q<entry_number>`SKIP {{calendar}}=sort(setunion(get({{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>`SKIP),%q<skip_date>)); @pemit %#=notice(AVAIL,Entry %q<entry_number> leaves out [u(%!/FUN`DISPLAY`DAY,%q<skip_day>,1)].,ok)
        flags: [cmdsyntax]
      # +avail/unskip <n>=<date>.
      INC`ENTRY`UNSKIP:
        value: |-
          @include %!/INC`ENTRY`FIND; @include %!/INC`ENTRY`SKIPDATE; @assert member(get({{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>`SKIP),%q<skip_date>)=@pemit %#=notice(AVAIL,Entry %q<entry_number> does not leave out [u(%!/FUN`DISPLAY`DAY,%q<skip_day>,1)].,warn); think setq(skip_left,setdiff(get({{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>`SKIP),%q<skip_date>)); @if words(%q<skip_left>)={&PLAYER`%q<viewer_key>`%q<entry_number>`SKIP {{calendar}}=%q<skip_left>},{&PLAYER`%q<viewer_key>`%q<entry_number>`SKIP {{calendar}}}; @pemit %#=notice(AVAIL,Entry %q<entry_number> takes in [u(%!/FUN`DISPLAY`DAY,%q<skip_day>,1)] again.,ok)
        flags: [cmdsyntax]
      # The date after =, for /skip and /unskip: sets skip_day and skip_date.
      INC`ENTRY`SKIPDATE:
        value: |-
          @assert comp(get({{calendar}}/PLAYER`%q<viewer_key>`%q<entry_number>`REPEAT),once)=@pemit %#=notice(AVAIL,Entry %q<entry_number> happens once. +avail/remove %q<entry_number> takes it away.,warn); think setq(skip_day,case(lcstr(%q<cmd_right>),today,%q<viewer_today>,tomorrow,inc(%q<viewer_today>),u(%!/FUN`DAY`FROMDATE,%q<cmd_right>))); @assert strlen(%q<skip_day>)=@pemit %#=notice(AVAIL,Give the date after =%, written 2026-10-20.,warn); think setq(skip_date,u(%!/FUN`DAY`DATE,%q<skip_day>))
        flags: [cmdsyntax]
      INC`ENTRY`CLEAR:
        value: |-
          @assert words(setr(entry_list,u(%!/FUN`PLAYER`ENTRIES,%q<viewer_key>)))=@pemit %#=notice(AVAIL,You have set no times.,warn); @wipe {{calendar}}/PLAYER`%q<viewer_key>; @pemit %#=notice(AVAIL,Removed all [words(%q<entry_list>)] of your entries.,ok)
        flags: [cmdsyntax]

      # ---- find ------------------------------------------------------------------------
      # +avail/find <names>[=<length>]: the reader and the players named, split by spaces or commas.
      INC`FIND`PLAYERS:
        value: |-
          @assert strlen(%q<cmd_left>)=@pemit %#=notice(AVAIL,Name the players to find a time with%, such as +avail/find Ann Bob=2h.,warn); think setq(find_names,squish(edit(%q<cmd_left>,chr(44),%b))); think setq(find_missing,squish(iter(%q<find_names>,if(not(strlen(u(%!/FUN`PLAYER,%i0))),%i0)))); @assert not(words(%q<find_missing>))=@pemit %#=notice(AVAIL,There is no player called [itemize(iter(%q<find_missing>,'%i0',,|),|,or)].,warn); @include/args %!/INC`FIND`RUN=players,setunion(%:,iter(%q<find_names>,u(%!/FUN`PLAYER,%i0))),title,Free times
        flags: [cmdsyntax]
      # %<players> objids and %<title>: the runs they are all free in from the next slot, at least the length typed
      # after = or the game's.
      INC`FIND`RUN:
        value: |-
          @assert lte(words(%<players>),u(%!/FUN`CONFIG,FIND-PLAYERS))=@pemit %#=notice(AVAIL,Find a time for [u(%!/FUN`CONFIG,FIND-PLAYERS)] players at most%, you included.,warn); think setq(find_length,if(strlen(%q<cmd_right>),u(%!/FUN`READ`LENGTH,lcstr(%q<cmd_right>)),u(%!/FUN`CONFIG,FIND-LENGTH))); think setqm(find_least,get(%!/DATA`CONFIG`FIND-LENGTH`MIN),
          find_most,get(%!/DATA`CONFIG`FIND-LENGTH`MAX)); @assert cand(isint(%q<find_length>),gte(%q<find_length>,%q<find_least>),lte(%q<find_length>,%q<find_most>))=@pemit %#=notice(AVAIL,Give a length from [u(%!/FUN`DISPLAY`LENGTH,%q<find_least>)] to [u(%!/FUN`DISPLAY`LENGTH,%q<find_most>)] after =%, such as 2h or 90m.,warn); think setqm(find_step,u(%!/FUN`CONFIG`STEP),
          find_from,u(%!/FUN`FIND`START,%q<now>),
          find_slots,div(mul(u(%!/FUN`CONFIG,FIND-DAYS),86400),%q<find_step>)); @pemit %#=u(%!/FUN`SCREEN`FIND,u(%!/FUN`FIND`RUNS,%<players>,%q<find_from>,%q<find_slots>,div(add(%q<find_length>,dec(%q<find_step>)),%q<find_step>)),%<players>,%q<viewer_zone>,%q<find_length>,%<title>)
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +avail; @hook/override/inline +avail=%!,CMD`AVAIL
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The Calendar: every character's entries, PLAYER`<key>`<n>`<leaf>. Plain and private: a note is its owner's,
  # and only the Availability object reads it.
  - ref: calendar
    type: thing
    name: Availability Calendar
    location: "{{availability}}"
    flags: [no_command]
    attributes:
      PLAYER: |-
        Entries, one branch per character, one leaf per fact.

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies are
  # evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: availability_help
    type: thing
    name: Availability Help
    location: "{{availability}}"
    attributes:
      HELP: |-
        When characters are busy or free, and finding a time to play: +avail.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`AVAIL: |-
        timezone
      SEE`AVAIL`WHEN: |-
        avail|timezone
      SEE`AVAIL`FIND: |-
        avail
      HELP`AVAIL: |-
        `+avail` keeps the times your character is busy and the times you are free to play, and finds a time a group of players is all free.

        - `+avail` shows your entries, numbered, and your week ahead.
        - `+avail <name>` shows another character's week: when they are free and when they are busy. Their notes stay theirs.
        - `+avail/busy <when>\[=<note>\]` adds a time you are busy: `+avail/busy weekdays 9:00-17:00=Work`.
        - `+avail/free <when>\[=<note>\]` adds a time you are free to play: `+avail/free sat sun 18:00-23:00`.
        - `+avail/remove <n>` takes entry `<n>` away. `+avail/clear` takes them all.
        - `+avail/skip <n>=<date>` leaves one date out of a repeating entry, a week you are away: `+avail/skip 1=2026-10-20`. `+avail/unskip <n>=<date>` puts it back.
        - `+avail/find <names>\[=<length>\]` lists the times you and they are all free: `+avail/find Ann Bob=2h`.

        A `<when>` can be a date, a range of dates, or a pattern that repeats, as an office calendar's can: every weekday, every other Tuesday, the last Friday of the month. See `+help avail when`.

        Times are kept in your own zone, the one `+timezone` sets, and shown to each reader in theirs. A weekly 19:00 stays 19:00 for you when summer time starts.

        **Free and busy.** Until you add a free time, you count as free whenever you are not busy. Once you add one, only the times your free entries cover count, less the times you are busy.

        For example, from a player in America/New_York:

        `+avail/busy every 2 weeks tue 20:00-22:00=Raid night`

        Output: `\[AVAIL\] Done: Added 3, busy: Every 2 weeks on Tue, 20:00-22:00.`

        **Privacy.** Your entries are kept on the Availability Calendar, not on your character, so no one who can examine your character reads them. Others see only when you are free or busy; your notes stay yours.
      HELP`AVAIL`WHEN: |-
        The `<when>` after `+avail/busy` and `+avail/free` is words in any order. Capitals and commas do not matter.

        **Days of the week** repeat every week:

        - `mon`, `tuesday`, `thursdays`, or several: `mon wed fri`
        - `weekdays`, `weekends`, or a run of days: `mon-thu`, `fri-sun`

        **Dates** happen once, written year first: `2026-10-20`, `today`, `tomorrow`. Two dates with `to` between them are a range: `2026-12-20 to 2026-12-28` is busy for those whole days.

        **Repeats**:

        - `daily`: every day. `every 3 days`.
        - `every 2 weeks tue`, `every other week thu`, `fortnightly fri`. The weeks are counted from the week of the first date, today unless you give one.
        - `monthly`: the same day of each month as the first date. `15th`, or `1st 15th`: those days of each month.
        - `2nd tue`, `last fri`, `2nd and 4th thu`: those weekdays in those weeks of each month.
        - `from <date>`: the first day, when it is not today. `until <date>`: the last.

        **Times**: `19:00-22:00`, `7pm-10pm`, `7:30 pm - 10 pm`, `9-5` \(read as 9:00 to 17:00\). A time that ends before it starts runs past midnight: `23:00-02:00`. With no time, the entry is all day.

        A range of dates with a time is that time on each of the days: `2026-10-20 to 2026-10-23 18:00-22:00`.

        Some whole entries:

        - `+avail/busy weekdays 9:00-17:00=Work`
        - `+avail/free sat sun 18:00-23:00`
        - `+avail/busy every other week tue 20:00-22:00`
        - `+avail/busy last fri 19:00-23:00=Board games`
        - `+avail/busy daily 23:00-07:00=Asleep`
        - `+avail/busy 2026-12-20 to 2026-12-28=Holiday`
        - `+avail/free tomorrow 7pm-11pm`
        - `+avail/busy mon from 2026-11-02 until 2026-12-14 18:00-21:00=Evening class`

        Not kept: a yearly repeat, or two times of day in one entry. Add another entry for those.
      HELP`AVAIL`FIND: |-
        `+avail/find <names>\[=<length>\]` lists the times in the coming days when you and every player named are all free, for at least `<length>`: `2h`, `90m`, `1h30m`, or a number of hours. Names are split by spaces or commas. Without a length, it looks for the game's \(2 hours as shipped\).

        Each line is a free time, in your zone: the day, when it starts, when it ends, and how long it lasts. A player who has set no times counts as free throughout, and is named under the list.

        For example:

        `+avail/find Bob Cleo=3h`

        Output: a box titled `Free times`, a row for each time the three of you are free for three hours or more, such as `Sat 17 Oct  09:00  21:00  12h`, then who was counted.

        Free time is counted in steps of 30 minutes: a step is free when a free entry covers all of it and no busy entry touches it.
      LOCK`AVAIL`SETTINGS: |-
        perm^config.admin
      HELP`AVAIL`SETTINGS: |-
        `+config avail` lists the settings and `+config avail/<setting>=<value>` changes one \(`config.admin`\). Lengths take `2h`, `90m` or seconds.

        - `slot`: minutes in one step free time is counted in: 15, 20, 30 or 60. `30` as shipped.
        - `find-days`: how many days ahead `+avail/find` looks, 1 to 28. `7`.
        - `find-length`: the length `+avail/find` looks for when none is given. Two hours.
        - `find-results`: how many times it lists at most. `10`.
        - `find-players`: how many players it takes at once, the one asking included. `12`.
        - `entries`: how many entries one character may keep. `30`.
        - `note-length`: how long a note may be. `60`.

        For example, to look two weeks ahead:

        `+config avail/find-days=14`

        Output: `\[CONFIG\] Done: avail/find-days is now 14, was 7.`

        Entries are kept on the Availability Calendar inside it, `` PLAYER`<key>`<n>`<leaf> ``, one leaf per fact: `KIND`, `REPEAT`, `EVERY`, `DAYS`, `DATE`, `TIME`, `MINUTES`, `UNTIL`, `ZONE`, `SKIP` and `NOTE`. They stay there rather than on the characters for privacy: a character's attributes can be read by whoever may examine it, and a note is its owner's alone.
      HELP`AVAIL`CODE: |-
        Other code reads availability through functions on the Availability object. It is WIZARD, so only privileged code may `u\(\)` them, such as the Scene Logger when scene-availability is installed.

        - `` u\(<Availability>/FUN`FREE`AT,<player>,<start>,<end>\) ``: `1` when the player is free from `<start>` to `<end>`, in seconds, `0` when not, nothing when they have set no times.
        - `` u\(<Availability>/FUN`FIND`RUNS,<players>,<from>,<steps>,<least steps>\) ``: the times from `<from>` when every player is free for at least so many steps, each `<start>:<end>` in seconds.
        - `` u\(<Availability>/FUN`ENTRY`SPANS,<key>,<n>,<from>,<to>\) ``: when one entry happens between two moments, each `<start>:<end>`. `` u\(<Availability>/FUN`KEY,<player>\) `` is the key.

        Another package adds to `+avail` on the Availability object: a `` DATA`ROUTE`<SWITCH> `` leaf naming an `` INC` `` routine adds a switch, and a `` FILTER`AVAIL`FIND`<name> `` adds to the footer under `+avail/find`'s times, given the footer so far and the times.

        For example, for a player busy on weekdays from 9:00 to 17:00 in UTC:

        `` think u\(<Availability>/FUN`FREE`AT,*Ann,1792054800,1792062000\) ``

        Output: `0`

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`AVAIL: |-
        {{availability_help}}

  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`AVAIL: |-
        {{availability}}

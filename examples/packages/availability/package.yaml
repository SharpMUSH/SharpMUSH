      # %0 and %1 the instants a day starts and ends, %2 the zone: the busy times that day, with their notes; all day
      # when one covers it.
      FUN`SCREEN`WEEK`BUSYDAY:
        value: |-
          firstof(edit(squish(iter(%q<week_busy>,if(cand(lt(first(%i0,:),%1),gt(extract(%i0,2,1,:),%0)),[if(cand(lte(first(%i0,:),%0),gte(extract(%i0,2,1,:),%1)),all day,[timefmt($H:$M,max(first(%i0,:),%0),%2)]-[u(%!/FUN`SCREEN`WEEK`END,extract(%i0,2,1,:),%1,%2)])][if(cand(strlen(extract(%i0,3,1,:)),strlen(setr(week_note,get({{calendar}}/PLAYER`%q<week_key>`[extract(%i0,3,1,:)]`NOTE)))),%b[tone(muted,%q<week_note>)])]),,|),|),|,%,%b),tone(muted,-))
        flags: [funsyntax]
      # %0 a key and %1 the reader's zone: the entries table, a row an entry.
      FUN`SCREEN`ENTRIES:
        value: |-
          setq(entries_list,u(%!/FUN`PLAYER`ENTRIES,%0))[datacolumns(u(%!/FUN`DISPLAY`TABLE,1|2,||1|1),>[tone(strong,#)]%r[iter(%q<entries_list>,%i0,,%r)],[tone(strong,Kind)]%r[iter(%q<entries_list>,u(%!/FUN`DISPLAY`KIND,get({{calendar}}/PLAYER`%0`%i0`KIND)),,%r)],[tone(strong,When)]%r[iter(%q<entries_list>,u(%!/FUN`ENTRY`DESCRIBE,%0,%i0,%1),,%r)],[tone(strong,Note)]%r[iter(%q<entries_list>,firstof(get({{calendar}}/PLAYER`%0`%i0`NOTE),tone(muted,-)),,%r)])]
        flags: [funsyntax]
      # +avail: the reader's entries and their week.
      FUN`SCREEN`MINE:
        value: |-
          setq(week_key,%q<viewer_key>)[box([u(%!/FUN`SCREEN`ENTRIES,%q<viewer_key>,%q<viewer_zone>)]%r[rule(The week ahead)]%r[u(%!/FUN`SCREEN`WEEK,%q<viewer_key>,%q<viewer_today>,%q<viewer_zone>,7,1)]%r[rule()]%r[tone(muted,Times in %q<viewer_zone> · +avail/busy and +avail/free add one · +avail/remove <n> takes one away · +avail/find <names> finds a time)],Your availability,,u(%!/FUN`DISPLAY`FRAME))]
        flags: [funsyntax]
      # +avail <name>: their week, without notes, in the reader's zone.
      FUN`SCREEN`OTHER:
        value: |-
          setq(week_key,%q<target_key>)[box([u(%!/FUN`SCREEN`WEEK,%q<target_key>,%q<viewer_today>,%q<viewer_zone>,7,0)]%r[rule()]%r[tone(muted,Times in %q<viewer_zone> · +avail/find [name(%q<target>)] finds a time you are both free)],Availability: [name(%q<target>)],,u(%!/FUN`DISPLAY`FRAME))]
        flags: [funsyntax]
      # %0 the runs, start:end, %1 the players, %2 the reader's zone, %3 the length asked for, %4 the title: the free
      # times as a table, and who was counted.
      FUN`SCREEN`FIND:
        value: |-
          setq(find_shown,extract(%0,1,u(%!/FUN`CONFIG,FIND-RESULTS)))[box([if(words(%q<find_shown>),datacolumns(u(%!/FUN`DISPLAY`TABLE,1|2|3|4,|||1),[tone(strong,Day)]%r[iter(%q<find_shown>,timefmt($a $d $b,first(%i0,:),%2),,%r)],[tone(strong,From)]%r[iter(%q<find_shown>,timefmt($H:$M,first(%i0,:),%2),,%r)],[tone(strong,Until)]%r[iter(%q<find_shown>,u(%!/FUN`SCREEN`FIND`UNTIL,first(%i0,:),rest(%i0,:),%2),,%r)],[tone(strong,Free for)]%r[iter(%q<find_shown>,u(%!/FUN`DISPLAY`LENGTH,sub(rest(%i0,:),first(%i0,:))),,%r)]),No time in the next [u(%!/FUN`CONFIG,FIND-DAYS)] days has them all free for [u(%!/FUN`DISPLAY`LENGTH,%3)].)]%r[rule()]%r[u(%!/FUN`SCREEN`FIND`FOOT,%0,%1,%2,%3)],%4,,u(%!/FUN`DISPLAY`FRAME))]
        flags: [funsyntax]
      # %0 and %1 a run's instants, %2 the zone: when it ends, with the day when it is not the day it starts.
      FUN`SCREEN`FIND`UNTIL:
        value: |-
          if(strmatch(timefmt($Y$m$d,%0,%2),timefmt($Y$m$d,%1,%2)),timefmt($H:$M,%1,%2),timefmt($a $d $b $H:$M,%1,%2))
        flags: [funsyntax]
      # Who was counted and who set nothing, then what each FILTER`AVAIL`FIND`<name> on this object adds: another
      # package's filter takes %0 the footer so far and %1 the runs, start:end, and returns the footer
      # (scene-availability adds the line that books the first time as a scene).
      FUN`SCREEN`FIND`FOOT:
        value: |-
          setq(find_foot,tone(muted,For [itemize(iter(%1,name(%i0),,|),|)] · at least [u(%!/FUN`DISPLAY`LENGTH,%3)] · times in %2)[if(words(setr(find_unset,squish(iter(%1,if(not(words(u(%!/FUN`PLAYER`ENTRIES,u(%!/FUN`KEY,%i0)))),%i0))))),%r[tone(muted,[itemize(iter(%q<find_unset>,name(%i0),,|),|)] set no times%, so count as free throughout.)])])[null(iter(lattr(%!/FILTER`AVAIL`FIND`*),setq(find_foot,u(%!/%i0,%q<find_foot>,%0))))]%q<find_foot>
        flags: [funsyntax]

      # ---- show -------------------------------------------------------------------------
      INC`SHOW`MINE:
        value: |-
          @assert words(u(%!/FUN`PLAYER`ENTRIES,%q<viewer_key>))=@pemit %#=notice(AVAIL,You have set no times. +avail/busy and +avail/free add them%, such as +avail/busy weekdays 9:00-17:00=Work.); @pemit %#=u(%!/FUN`SCREEN`MINE)
        flags: [cmdsyntax]
      INC`SHOW`OTHER:
        value: |-
          think setq(target,u(%!/FUN`PLAYER,%q<cmd_argument>)); @assert strlen(%q<target>)=@pemit %#=notice(AVAIL,There is no player called '%q<cmd_argument>'.,warn); think setq(target_key,u(%!/FUN`KEY,%q<target>)); @assert words(u(%!/FUN`PLAYER`ENTRIES,%q<target_key>))=@pemit %#=notice(AVAIL,[name(%q<target>)] has set no times%, so they count as free at any time.); @pemit %#=u(%!/FUN`SCREEN`OTHER)

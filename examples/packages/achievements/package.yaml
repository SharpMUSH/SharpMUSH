      DATA`TEMPLATE`WEB`HOLDERS: |-
        {"kind":"timeline","rows_field":"holders","empty":"Nobody holds it yet."}
      WEB`SCHEMA`PLAQUE:
        value: |-
          u(%!/WEB`DOCUMENT,if(%q<web_manager>,form,view),u(%!/FUN`PLAQUE`NAME,%0),u(%!/WEB`SECTION,plaque,,1,v(DATA`TEMPLATE`WEB`PLAQUE`CHIPS)%r[u(%!/WEB`MSTRING,u(%!/FUN`PLAQUE`DESCRIPTION,%0))]%r[u(%!/WEB`MARKDOWN,\[Every plaque\]\(/apps/achievements\))])%r[u(%!/WEB`SECTION,holders,Held by,2,v(DATA`TEMPLATE`WEB`HOLDERS))][if(%q<web_manager>,%r[u(%!/WEB`SECTION,award,Award it,3,u(%!/WEB`FIELD,character,Character,text,,Ada,)%r[u(%!/WEB`FIELD,citation,Citation,text,,For holding the north gate,Why they were given it. It shows under the plaque.)]%r[u(%!/WEB`BUTTON,Award,award,u(%!/WEB`VALUES,award,%0))],2)]%r[u(%!/WEB`SECTION,edit,Change it,4,u(%!/WEB`PLAQUE`FIELDS,%0)%r[u(%!/WEB`BUTTON,Save,act,u(%!/WEB`VALUES,save,%0))]%r[u(%!/WEB`BUTTON,Destroy,act,u(%!/WEB`VALUES,destroy,%0),error,Destroy [u(%!/FUN`PLAQUE`NAME,%0)] and take it from [words(u(%!/FUN`HOLDERS,%0))] character[if(neq(words(u(%!/FUN`HOLDERS,%0)),1),s)]?)],2)])])
        flags: [funsyntax]

      # The data for viewer %<viewer> at %<at>: every plaque's pill, or one plaque's pill and holders.
      DATA`TEMPLATE`WEB`DATA: |-
        {"fields":{"plaques":{"value":null,"visible":true},"plaque":{"value":null,"visible":true},"holders":{"value":null,"visible":true}}}
      WEB`DATA:
        value: |-
          u(%!/WEB`DATA`FOR,%<viewer>,u(%!/WEB`AT`PLAQUE,%<at>))
        flags: [funsyntax]
      # %0 the viewer, %1 the plaque or nothing.
      WEB`DATA`FOR:
        value: |-
          setq(web_manager,u(%!/FUN`MAY`MANAGE,%0))[json_fill(v(DATA`TEMPLATE`WEB`DATA),/fields/plaques/value,json_array(if(not(strlen(%1)),iter(u(%!/FUN`PLAQUE`IDS),u(%!/WEB`PILL,%i0,1),%b,%r)),%r),/fields/plaque/value,json_array(if(strlen(%1),u(%!/WEB`PILL,%1,0)),%r),/fields/holders/value,json_array(if(strlen(%1),iter(u(%!/FUN`HOLDERS,%1),u(%!/WEB`ROW`HOLDER,%1,%i0),%b,%r)),%r))]
        flags: [funsyntax]
      # Plaque %0 as a pill: its name in its colours and font, its description on hover, and with %1 1 a link to its page.
      # The colours are #rrggbb or empty, both or neither, as the checks keep them.
      DATA`TEMPLATE`WEB`PILL: |-
        {"text":"","background":"","foreground":"","font":"","hint":"","link":""}
      WEB`PILL:
        value: |-
          json_fill(v(DATA`TEMPLATE`WEB`PILL),/text,u(%!/FUN`PLAQUE`NAME,%0),/background,u(%!/FUN`PLAQUE`STYLE,%0,BACKGROUND),/foreground,u(%!/FUN`PLAQUE`STYLE,%0,FOREGROUND),/font,u(%!/FUN`PLAQUE`STYLE,%0,FONT),/hint,u(%!/FUN`PLAQUE`DESCRIPTION,%0),/link,if(%1,/apps/achievements/%0))
        flags: [funsyntax]
      # Plaque %0 held by %1: who, when, and the citation; staff see who awarded it and a button to take it back.
      DATA`TEMPLATE`WEB`ROW`HOLDER: |-
        {"author":"","time":0,"body":null,"format":"mstring","tag":"","tag_color":"primary","links":[{"href":"","label":""}],"actions":null}
      DATA`TEMPLATE`WEB`REVOKE: |-

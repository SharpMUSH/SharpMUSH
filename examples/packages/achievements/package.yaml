      WEB`ROW`HOLDER:
        value: |-
          json_fill(v(DATA`TEMPLATE`WEB`ROW`HOLDER),/author,name(%1),/time,u(%!/FUN`AWARD`AT,%1,%0),/body,json(markupstring,setr(row_citation,u(%!/FUN`AWARD`CITATION,%1,%0))[if(cand(%q<web_manager>,isdbref(setr(row_by,u(%!/FUN`AWARD`BY,%1,%0)))),[if(strlen(%q<row_citation>),%r)][tone(muted,Awarded by [name(%q<row_by>)])])]),/tag,if(member(u(%!/FUN`FEATURED,%1),%0),Featured),/links/0/href,/character/[name(%1)],/links/0/label,name(%1)'s page,/actions,if(%q<web_manager>,json_array(json_fill(v(DATA`TEMPLATE`WEB`REVOKE),/values/plaque,%0,/values/holder,%1,/confirm,Take [u(%!/FUN`PLAQUE`NAME,%0)] from [name(%1)]?),%r),json_array()))

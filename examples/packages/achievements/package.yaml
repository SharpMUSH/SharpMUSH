        flags: [funsyntax]
      DATA`TEMPLATE`WEB`DONE: |-
        {"ok":true,"message":"","schema":null,"data":null}
      # After a change to plaque %1, said in %0: the page drawn again.
      WEB`DONE:
        value: |-
          json_fill(v(DATA`TEMPLATE`WEB`DONE),/message,%0,/schema,uargs(%!/WEB`SCHEMA,viewer,%q<do_by>,at,%1),/data,u(%!/WEB`DATA`FOR,%q<do_by>,%1))
        flags: [funsyntax]
      DATA`TEMPLATE`WEB`GOTO: |-
        {"ok":true,"message":"","redirect":""}
      WEB`GOTO:
        value: |-
          json_fill(v(DATA`TEMPLATE`WEB`GOTO),/message,%0,/redirect,%1)
        flags: [funsyntax]

      # A button press, run by the route through @force, so what the writes print goes to this object and not into the
      # response. It leaves the answer in act_result. Each op runs the same checks and writes the command does.
      WEB`ACT:
        value: |-
          think setqm(act_result,u(%!/WEB`ERROR,v(DATA`DENY`MANAGE)),
          act_op,lcstr(u(%!/WEB`POSTED,op)),
          act_plaque,u(%!/WEB`POSTED,plaque),
          do_by,%<viewer>); @assert u(%!/FUN`MAY`MANAGE,%<viewer>); think setq(act_result,u(%!/WEB`ERROR,There is no such action.)); @assert member(create save destroy award revoke,%q<act_op>); think setq(act_result,u(%!/WEB`ERROR,That plaque is gone.)); @assert cor(strmatch(%q<act_op>,create),u(%!/FUN`PLAQUE`EXISTS,%q<act_plaque>)); think setq(do_plaque,%q<act_plaque>); @include %!/WEB`ACT`%q<act_op>
        flags: [cmdsyntax]
      # The posted name, description, colours and font, checked in that order: sets do_name, do_text, do_foreground,
      # do_background and do_font, or act_result to the first refusal and act_problem to 1.
      WEB`ACT`READ:
        value: |-
          think setqm(do_name,trim(u(%!/WEB`POSTED,name)),
          do_text,trim(u(%!/WEB`POSTED,description)),
          act_foreground,trim(u(%!/WEB`POSTED,foreground)),
          act_background,trim(u(%!/WEB`POSTED,background)),
          act_font,u(%!/WEB`POSTED,font))[setq(act_problem,1)][setq(act_result,cond(strlen(setr(problem,u(%!/FUN`CHECK`NAME,%q<do_name>,%q<do_plaque>))),u(%!/WEB`FIELDERROR,name,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`TEXT,%q<do_text>,0,description))),u(%!/WEB`FIELDERROR,description,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`COLOUR,%q<act_foreground>))),u(%!/WEB`FIELDERROR,foreground,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`COLOUR,%q<act_background>))),u(%!/WEB`FIELDERROR,background,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`PAIR,%q<act_foreground>,%q<act_background>))),u(%!/WEB`FIELDERROR,background,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`FONT,%q<act_font>))),u(%!/WEB`FIELDERROR,font,%q<problem>),setq(act_problem,0)))]; think setqm(do_foreground,u(%!/FUN`COLOUR,%q<act_foreground>),
          do_background,u(%!/FUN`COLOUR,%q<act_background>),
          do_font,u(%!/FUN`FONT,%q<act_font>))
        flags: [cmdsyntax]
      WEB`ACT`CREATE:
        value: |-
          think setq(do_plaque,); @include %!/WEB`ACT`READ; @assert not(%q<act_problem>); think setq(act_result,u(%!/WEB`ERROR,There is no room to record it: an object holds at most [config(max_attrs_per_obj)] attributes.)); @assert u(%!/FUN`ROOM,{{store}},8); @include %!/INC`DO`CREATE; @include %!/INC`DO`LOOK; think setq(act_result,u(%!/WEB`GOTO,Plaque %q<do_plaque>%, %q<do_name>%, is made.,/apps/achievements/%q<do_plaque>))
        flags: [cmdsyntax]
      WEB`ACT`SAVE:
        value: |-
          @include %!/WEB`ACT`READ; @assert not(%q<act_problem>); think setq(act_result,u(%!/WEB`ERROR,There is no room to record it: an object holds at most [config(max_attrs_per_obj)] attributes.)); @assert u(%!/FUN`ROOM,{{store}},u(%!/FUN`STYLE`NEW,%q<do_plaque>)); @include %!/INC`DO`RENAME; @include %!/INC`DO`DESCRIBE; @include %!/INC`DO`LOOK; think setq(act_result,u(%!/WEB`DONE,%q<do_name> is saved.,%q<do_plaque>))
        flags: [cmdsyntax]
      WEB`ACT`DESTROY:
        value: |-
          think setqm(destroy_name,u(%!/FUN`PLAQUE`NAME,%q<do_plaque>),
          destroy_holders,words(u(%!/FUN`HOLDERS,%q<do_plaque>))); @include %!/INC`DO`DESTROY; think setq(act_result,u(%!/WEB`GOTO,%q<destroy_name> is destroyed[if(%q<destroy_holders>,%, and taken from %q<destroy_holders> character[if(neq(%q<destroy_holders>,1),s)])].,/apps/achievements))
        flags: [cmdsyntax]
      WEB`ACT`AWARD:
        value: |-
          think setqm(award_typed,trim(u(%!/WEB`POSTED,character)),
          do_who,u(%!/FUN`FIND`PLAYER,%q<award_typed>),
          do_citation,trim(u(%!/WEB`POSTED,citation)),
          act_result,u(%!/WEB`FIELDERROR,character,if(strlen(%q<award_typed>),There is no player called '%q<award_typed>'.,Which character?))); @assert strlen(%q<do_who>); think setq(act_result,cond(strlen(setr(problem,u(%!/FUN`CHECK`AWARD,%q<do_who>,%q<do_plaque>))),u(%!/WEB`FIELDERROR,character,%q<problem>),strlen(setr(problem,u(%!/FUN`CHECK`TEXT,%q<do_citation>,1,citation))),u(%!/WEB`FIELDERROR,citation,%q<problem>))); @assert not(strlen(%q<act_result>)); @include %!/INC`DO`AWARD; think setq(act_result,u(%!/WEB`DONE,name(%q<do_who>) holds [u(%!/FUN`PLAQUE`NAME,%q<do_plaque>)] now.,%q<do_plaque>))
        flags: [cmdsyntax]
      WEB`ACT`REVOKE:
        value: |-
          think setqm(do_who,u(%!/WEB`POSTED,holder),
          act_result,u(%!/WEB`ERROR,They no longer hold it.)); @assert cand(isdbref(%q<do_who>),u(%!/FUN`HELD`ONE,%q<do_plaque>,setr(do_who,objid(%q<do_who>)))); @include %!/INC`DO`REVOKE; think setq(act_result,u(%!/WEB`DONE,name(%q<do_who>) no longer holds [u(%!/FUN`PLAQUE`NAME,%q<do_plaque>)].,%q<do_plaque>))
        flags: [cmdsyntax]

      # The profile widget: the plaques character %<target> holds as pills, featured ones first, each one's description on
      # hover and a link to its page. The schema says only whose they are; the data route sends the pills.
      DATA`TEMPLATE`WEB`PROFILE`CHIPS: |-
        {"kind":"chips","src_field":"plaques","empty":""}
      WEB`PROFILE`SCHEMA:
        value: |-
          u(%!/WEB`DOCUMENT,view,Plaques,u(%!/WEB`SECTION,plaques,,1,json_fill(v(DATA`TEMPLATE`WEB`PROFILE`CHIPS),/empty,name(%<target>) holds no plaques yet.)))
        flags: [funsyntax]
      DATA`TEMPLATE`WEB`PROFILE`DATA: |-
        {"fields":{"plaques":{"value":null,"visible":true}}}
      WEB`PROFILE`DATA:
        value: |-
          json_fill(v(DATA`TEMPLATE`WEB`PROFILE`DATA),/fields/plaques/value,json_array(iter(u(%!/FUN`HELD`ORDERED,%<target>),u(%!/WEB`PILL,%i0,1),%b,%r),%r))
        flags: [funsyntax]
      # %0 typed text: the objid of the player it is, or empty. The routes answer 404 for anything else.
      WEB`TARGET:
        value: |-
          if(cand(isdbref(%0),hastype(%0,player)),objid(%0))
        flags: [funsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot. /nobreak keeps a refusal from
      # stopping the rest of an action list that ran the command.
      STARTUP:
        value: |-
          @command/add +achievements; @hook/override/inline/localize/clearregs/nobreak +achievements=%!,CMD`ACHIEVEMENTS
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # The plaques, which belong to the whole game. Inside the Achievements object, so no player can reach it, and
  # no_command, so nothing kept on it is ever matched as a command. Nothing here is evaluated.
  #   PLAQUE`<n>    the plaque's name; DESCRIPTION, BACKGROUND, FOREGROUND, FONT, CREATED and BY beneath
  #   DATA`LAST     the last number given to a plaque, so a destroyed plaque's is never reused
  # The awards are on the characters (ACHIEVEMENT`<n>), not here.
  - ref: store
    type: thing
    name: Achievements Store
    location: "{{achievements}}"
    flags: [no_command]
    attributes:
      PLAQUE:
        value: |-
          The plaques, one branch each, by number.
        flags: [no_command]
      DATA:
        value: |-
          The store's own counters.
        flags: [no_command]

  # The routes the portal reads: GET /http/achievements/schema and /data (?at=<what follows the slug>), POST
  # /http/achievements/act, and GET /http/achievements/profile/schema and /profile/data (?objid=<character>) for the
  # profile widget. The reads are evaluated in place with uargs(); a press is run on the Achievements object with
  # @force, so the writes' "Set." lines stay out of the response. The handler must be WIZARD, as the seeded one is. The
  # press's body goes in %q<body>, because a forced command's arguments lose a value's outer braces.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`ACHIEVEMENTS`SCHEMA: |-
        @respond/type application/json; think uargs({{achievements}}/WEB`SCHEMA,viewer,%<viewer>,at,%q<form.at>)
      GET`ACHIEVEMENTS`DATA: |-
        @respond/type application/json; think uargs({{achievements}}/WEB`DATA,viewer,%<viewer>,at,%q<form.at>)
      POST`ACHIEVEMENTS`ACT: |-
        think setq(body,%<body>); @force {{achievements}}=@include/args/nobreak {{achievements}}/WEB`ACT=viewer,%<viewer>; @respond/type application/json; think %q<act_result>
      GET`ACHIEVEMENTS`PROFILE`SCHEMA: |-
        think setq(achievements_target,u({{achievements}}/WEB`TARGET,%q<form.objid>)); @assert strlen(%q<achievements_target>)={@respond 404 NO SUCH CHARACTER}; @respond/type application/json; think uargs({{achievements}}/WEB`PROFILE`SCHEMA,target,%q<achievements_target>)
      GET`ACHIEVEMENTS`PROFILE`DATA: |-
        think setq(achievements_target,u({{achievements}}/WEB`TARGET,%q<form.objid>)); @assert strlen(%q<achievements_target>)={@respond 404 NO SUCH CHARACTER}; @respond/type application/json; think uargs({{achievements}}/WEB`PROFILE`DATA,target,%q<achievements_target>)

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies are
  # evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: achievements_help
    type: thing
    name: Achievements Help
    location: "{{achievements}}"
    attributes:
      HELP: |-
        Plaques staff award to characters: +achievements.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      HELP`ACHIEVEMENTS: |-
        Staff award **plaques** to characters for what they did: a name on a pill of its own colours, and a few words about it. A character can hold many.

        - `+achievements` shows the plaques you hold.
        - `+achievements <player>` shows someone else's.
        - `+achievements/list` lists every plaque on the game and how many hold each.
        - `+achievements/view <plaque>` shows one plaque and who holds it.

        A plaque is named by its number or its name. The start of a name will do when only one plaque starts that way.

        Example:

        ```
        > +achievements/view hero
        +=========<  Hero of the Siege  >==========+
        | Held the north gate through the night.   |
        +==========================================+
        Held by Ada and Bo.
        ```

        Output: the plaque, its name in its colours, then who holds it.

        ## Featuring

        You choose which of your plaques to feature. They come first in `+achievements`, and other parts of the game show them beside your name. The game sets how many, 3 unless it changes that.

        - `+achievements/feature <plaque>` features one you hold, after the others.
        - `+achievements/unfeature <plaque>` stops featuring it.

        Only plaques you hold can be featured, and one taken back stops showing at once.

        Example:

        ```
        > +achievements/feature hero
        \[ACHIEVEMENTS\] Done: You feature Hero of the Siege now.
        ```

        Output: one line saying what you feature.

        The website shows every plaque on the Achievements page, and a character's plaques at the bottom of their page, as pills in their colours. Point at one to read what it is for.
      LOCK`ACHIEVEMENTS`STAFF: |-
        perm^softcode.achievements.admin
      HELP`ACHIEVEMENTS`STAFF: |-
        Staff holding the `softcode.achievements.admin` permission make plaques and award them. The Achievements page on the website does all of this too.

        ## Making plaques

        - `+achievements/create <name>=<description>` makes a plaque. It gets a number, which never changes.
        - `+achievements/describe <plaque>=<description>` changes its description.
        - `+achievements/rename <plaque>=<name>` renames it. Everyone holding it keeps it.
        - `+achievements/destroy <plaque>` destroys it. One someone holds needs `+achievements/destroy <plaque>=yes`, and is taken from them.

        A name is no longer than `+config achievements/name-length` allows, holds no `/`, `=`, `` ` `` or line break, and is not a number. Rename and destroy need the whole name or the number.

        Example:

        ```
        > +achievements/create Hero of the Siege=Held the north gate through the night.
        \[ACHIEVEMENTS\] Done: Plaque 1, Hero of the Siege, is made. +achievements/award <player>=1 awards it.
        ```

        Output: one line naming the new plaque and its number.

        ## Colours and font

        - `+achievements/colour <plaque>=<text>/<background>` gives the pill its colours. Each is `#rrggbb` or a name such as `+gold`. Nothing after the `=` gives it the theme's colours.
        - `+achievements/font <plaque>=<styles>` sets its font: any of `bold`, `italic` and `underline`. Nothing after the `=` is plain type. A terminal shows bold and underline; the website shows all three.

        The two colours go together, and they must be far enough apart in lightness to read: a contrast of 4.5:1 or more. Lightness is what every kind of colour vision sees, so a pair that passes reads for everyone, in every portal theme. The name is always written, so the colours never carry the meaning alone.

        Example:

        ```
        > +achievements/colour hero=#f5e9c8/#1b3a5c
        \[ACHIEVEMENTS\] Done:  Hero of the Siege  is #f5e9c8 on #1b3a5c now.
        > +achievements/colour hero=#777777/#888888
        \[ACHIEVEMENTS\] Warning: Those colours are too close to read: 1.3:1, and a plaque needs 4.5:1. Make one lighter or darker.
        ```

        Output: one line saying how it looks now, or why the colours will not do.

        ## Awarding

        - `+achievements/award <player>=<plaque>` awards a plaque. They are told.
        - `+achievements/award <player>=<plaque>/<citation>` says why. The citation shows under the plaque.
        - `+achievements/revoke <player>=<plaque>` takes it back.

        Example:

        ```
        > +achievements/award Ada=hero/For holding the north gate
        \[ACHIEVEMENTS\] Done: Ada holds Hero of the Siege now.
        ```

        Output: one line for you, and Ada is told about the award.

        An award names the plaque by a number that never changes, so renaming the plaque or the character keeps it. An award is kept on the character, in their `ACHIEVEMENT` attributes, with who gave it and why; only wizards can change those, so nobody can give themselves a plaque. The plaques themselves are kept on the Achievements Store, inside the Achievements object in the master room.

        ## Settings

        `+config achievements` lists them and `+config achievements/<setting>=<value>` changes one:

        - `featured`: how many plaques a character may feature. 3; 0 turns featuring off.
        - `name-length`: the longest name of a plaque. 40.
        - `text-length`: the longest description or citation. 1000.

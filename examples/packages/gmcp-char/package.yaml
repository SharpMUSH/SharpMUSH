format: 1.7
package: gmcp-char
version: 1.1.0
authors: [SharpMUSH]
description: "Sends MUD clients the GMCP Char package: Char.Name, Char.Vitals for a client's gauges and Char.Status, from the attributes its settings name, each sent again the moment one of them changes."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [gmcp, mudlet, vitals, status, mud-kit]
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

# The shapes are Iron Realms' (IRE). Char.Vitals uses the keys Mudlet's gauges read, as
# TelnetNegotiationCore's CharVitals type writes them: each attribute's name in lower case, its value a
# number when it is one.
#
#   Char.Name    {"name":"Wren","fullname":"Wren of the Marsh"}
#   Char.Vitals  {"hp":25,"maxhp":40,"mp":10,"maxmp":12}
#   Char.Status  {"name":"Wren","fullname":"Wren of the Marsh","level":3}
#
# A game keeps its own stats; which attributes are vitals and which are status is the vitals and
# status settings. An attribute the player does not have is left out.
#
# Nothing polls. @attribute/watch makes the engine run the event handler's WATCH`<attribute>`* attributes
# whenever any copy of a watched attribute is set, cleared or wiped (help @attribute watch). For each
# attribute its vitals and status settings name, the GMCP Char object (from AINSTALL, AUPDATE, and
# ACONFIG when +config changes vitals or status):
#
#   - adds it to the attribute table with @attribute/access <attribute>=none, only when attrwatch()
#     says it is not in the table, so an entry the game already has keeps its flags;
#   - watches it with @attribute/watch <attribute> when it is not watched, which is the default
#     pattern WATCH`<attribute> WATCH`<attribute>`*;
#   - copies its handler, FN`GMCPCHAR`HANDLER, to WATCH`<attribute>`GMCPCHAR on the event handler.
#
# An attribute already watched with some other pattern belongs to another package or to staff: it is
# left as it is, gets no handler, and is listed in the GMCP Char object's DATA`FOREIGN.
#
# An attribute dropped from the settings loses its WATCH`<attribute>`GMCPCHAR, and stops being watched
# only when it is watched with the default pattern and nothing else is left under WATCH`<attribute> on
# the event handler. Its table entry stays.
#
# The handlers are made at run time, because their names come from the settings; that is also why
# the attributes are not format 1.9 watch: entries, which would also make the package own each table
# entry. Uninstalling runs no softcode, so the package manager cannot remove them. Instead each one
# checks that the package is still there when it runs: if not, it removes itself and stops the watch
# as above.
#
# The GMCP Char object is WIZARD because @attribute needs config.admin and the handlers go on the event
# handler; its AINSTALL, AUPDATE and ACONFIG run as it. It runs nothing else. The help is on a separate
# plain object, because the +help librarian cannot read a privileged object's topics.
#
# Every send is oob(..., supported): Mudlet lists Char; a client that listed nothing is sent everything.
objects:
  - ref: handler
    target: "{{$event_handler}}"
    attributes:
      # ── Settings ─────────────────────────────────────────────────────────
      FN`GMCPCHAR`SETTING: |-
        get({{gmcp_char}}/DATA`CONFIG`%0)

      # ── Who ──────────────────────────────────────────────────────────────
      # %0 an object: a connected player, the only thing anything is sent to.
      FN`GMCPCHAR`VIEWER: |-
        cand(hastype(%0,player),hasflag(%0,CONNECTED))

      # ── Values ───────────────────────────────────────────────────────────
      # %0 a player: the name a client shows in full. The attribute the fullname setting names, else
      # the player's name.
      FN`GMCPCHAR`FULLNAME: |-
        strfirstof(if(strlen(setr(gmcpchar_attr,u(me/FN`GMCPCHAR`SETTING,FULLNAME))),get(%0/%q<gmcpchar_attr>)),name(%0))
      # %0 a value: as JSON, a number when it is one.
      FN`GMCPCHAR`VALUE: |-
        if(isnum(%0),%0,json(string,%0))
      # fold() step: %0 the object so far, %1 <player>|<attribute>. Adds the attribute under its last
      # name in lower case (STATS`HP is hp), when the player has it.
      FN`GMCPCHAR`FIELD: |-
        if(hasattr(setr(gmcpchar_who,before(%1,|)),setr(gmcpchar_attr,after(%1,|))),json_mod(%0,set,$.[lcstr(last(%q<gmcpchar_attr>,`))],u(me/FN`GMCPCHAR`VALUE,get(%q<gmcpchar_who>/%q<gmcpchar_attr>))),%0)
      # %0 a player, %1 attributes, %2 the object to start from: the attributes added to it.
      FN`GMCPCHAR`FIELDS: |-
        fold(me/FN`GMCPCHAR`FIELD,iter(%1,%0|%i0),%2)

      # ── Payloads ─────────────────────────────────────────────────────────
      # Char.Name: %0 the player.
      FN`GMCPCHAR`NAME: |-
        json(object,name,json(string,name(%0)),fullname,json(string,u(me/FN`GMCPCHAR`FULLNAME,%0)))
      # Char.Vitals: %0 the player.
      FN`GMCPCHAR`VITALS: |-
        u(me/FN`GMCPCHAR`FIELDS,%0,u(me/FN`GMCPCHAR`SETTING,VITALS),json(object))
      # Char.Status: %0 the player. Their names first, then the status attributes.
      FN`GMCPCHAR`STATUS: |-
        u(me/FN`GMCPCHAR`FIELDS,%0,u(me/FN`GMCPCHAR`SETTING,STATUS),u(me/FN`GMCPCHAR`NAME,%0))

      # ── Sending ──────────────────────────────────────────────────────────
      # %0 where to send (a player or a descriptor), %1 the player, %2 which: any of name, vitals and
      # status.
      FN`GMCPCHAR`SEND: |-
        if(member(%2,name),null(oob(%0,Char.Name,u(me/FN`GMCPCHAR`NAME,%1),supported)))[if(member(%2,vitals),null(oob(%0,Char.Vitals,u(me/FN`GMCPCHAR`VITALS,%1),supported)))][if(member(%2,status),null(oob(%0,Char.Status,u(me/FN`GMCPCHAR`STATUS,%1),supported)))]
      # %0 an attribute: which packages it is in, as FN`GMCPCHAR`SEND takes them.
      FN`GMCPCHAR`CHANGED: |-
        trim(if(match(u(me/FN`GMCPCHAR`SETTING,VITALS),%0),vitals) [if(match(u(me/FN`GMCPCHAR`SETTING,STATUS),%0),status)])

      # ── The handlers ─────────────────────────────────────────────────────
      # What the GMCP Char object copies to WATCH`<attribute>`GMCPCHAR for each attribute it watches. A
      # watch handler gets %0 the object, %1 the attribute's full name in upper case. A thing's stats have
      # no client to go to. If the package has been uninstalled (FN`GMCPCHAR`SEND is gone), it removes
      # itself, and stops the watch when it is the default pattern and nothing else is left under
      # WATCH`<attribute>.
      FN`GMCPCHAR`HANDLER: |-
        @assert hasattr(me,FN`GMCPCHAR`SEND)={@wipe me/WATCH`%1`GMCPCHAR; @assert not(comp(attrwatch(%1),WATCH`%1 WATCH`%1`*)); @assert not(words(iter(lattr(me/WATCH`%1) [lattr(me/WATCH`%1`*)],if(strlen(get(me/%i0)),%i0)))); @attribute/watch %1=}; @assert u(me/FN`GMCPCHAR`VIEWER,%0); @assert strlen(setr(gmcpchar_which,u(me/FN`GMCPCHAR`CHANGED,%1))); think u(me/FN`GMCPCHAR`SEND,%0,%0,%q<gmcpchar_which>)
      # A new connection is sent all three on its own descriptor.
      PLAYER`CONNECT`GMCPCHAR: |-
        think u(me/FN`GMCPCHAR`SEND,%<descriptor>,%<objid>,name vitals status)
      # A new name is a new Char.Name, and Char.Status carries it too.
      OBJECT`RENAME`GMCPCHAR: |-
        @assert u(me/FN`GMCPCHAR`VIEWER,%<objid>); think u(me/FN`GMCPCHAR`SEND,%<objid>,%<objid>,name status)

  # ---- settings, and the watching -------------------------------------------
  # WIZARD for @attribute and for the handlers on the event handler. AINSTALL and AUPDATE watch the
  # named attributes when the package is installed or upgraded, ACONFIG when the vitals or status
  # setting changes.
  - ref: gmcp_char
    type: thing
    name: GMCP Char
    flags: [WIZARD, no_command]
    attributes:
      DATA`CONFIG:
        value: |-
          Which attributes the GMCP Char package sends a client.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        GMCP Char
      DATA`CONFIG`VITALS: |-
        HP MAXHP MP MAXMP
      DATA`CONFIG`VITALS`TYPE: |-
        list
      DATA`CONFIG`VITALS`DEFAULT: |-
        HP MAXHP MP MAXMP
      DATA`CONFIG`VITALS`PATTERN: |-
        ^[A-Za-z0-9_`.-]+$
      DATA`CONFIG`VITALS`DESCRIPTION: |-
        The player attributes sent as Char.Vitals, which a client draws as gauges: hp and maxhp, mp and maxmp, mv and maxmv.
      DATA`CONFIG`VITALS`LABEL: |-
        Vitals
      DATA`CONFIG`VITALS`EXAMPLE: |-
        HP MAXHP MV MAXMV
      DATA`CONFIG`STATUS: ""
      DATA`CONFIG`STATUS`TYPE: |-
        list
      DATA`CONFIG`STATUS`DEFAULT: ""
      DATA`CONFIG`STATUS`PATTERN: |-
        ^[A-Za-z0-9_`.-]+$
      DATA`CONFIG`STATUS`DESCRIPTION: |-
        The player attributes sent as Char.Status with the player's name, such as their level or class.
      DATA`CONFIG`STATUS`LABEL: |-
        Status
      DATA`CONFIG`STATUS`EXAMPLE: |-
        LEVEL CLASS RACE
      DATA`CONFIG`FULLNAME: |-
        FULLNAME
      DATA`CONFIG`FULLNAME`TYPE: |-
        text
      DATA`CONFIG`FULLNAME`DEFAULT: |-
        FULLNAME
      DATA`CONFIG`FULLNAME`PATTERN: |-
        ^[^ ]*$
      DATA`CONFIG`FULLNAME`DESCRIPTION: |-
        The player attribute holding the name shown in full in Char.Name, such as Wren of the Marsh. A player without it is shown by name.
      DATA`CONFIG`FULLNAME`LABEL: |-
        Full name attribute
      DATA`CONFIG`FULLNAME`EXAMPLE: |-
        TITLE
      # ── Watching ──────────────────────────────────────────────────────────
      # DATA`WATCHING: the attributes this package has a WATCH`<attribute>`GMCPCHAR handler for.
      # DATA`FOREIGN: those it left alone because they are watched with another pattern.
      FUN`HANDLER: |-
        config(event_handler)
      # The vitals and status attributes, together, upper case.
      FUN`ATTRIBUTES: |-
        ucstr(setunion(v(DATA`CONFIG`VITALS),v(DATA`CONFIG`STATUS)))
      # %0 an attribute: the pattern @attribute/watch gives it by default.
      FUN`DEFAULT: |-
        WATCH`%0 WATCH`%0`*
      # %0 an attribute: 1 when it is watched with the default pattern.
      FUN`DEFAULTWATCH: |-
        not(comp(attrwatch(%0),u(%!/FUN`DEFAULT,%0)))
      # %0 an attribute: 1 when it is watched with a pattern of someone else's.
      FUN`FOREIGNWATCH: |-
        cand(strlen(setr(gmcpchar_watch,attrwatch(%0))),not(strmatch(%q<gmcpchar_watch>,#-1*)),not(u(%!/FUN`DEFAULTWATCH,%0)))
      # %0 an attribute: 1 when the event handler has its WATCH`<attribute>`GMCPCHAR.
      FUN`HANDLED: |-
        hasattr(u(%!/FUN`HANDLER),WATCH`%0`GMCPCHAR)
      # %0 an attribute: the event handler's attributes with a value that its default pattern runs.
      FUN`LEFT: |-
        iter(lattr(setr(gmcpchar_eh,u(%!/FUN`HANDLER))/WATCH`%0) [lattr(%q<gmcpchar_eh>/WATCH`%0`*)],if(strlen(get(%q<gmcpchar_eh>/%i0)),%i0))
      INC`WATCH: |-
        @dolist/inline setdiff(v(DATA`WATCHING),u(%!/FUN`ATTRIBUTES))=@include/args %!/INC`UNWATCH=attribute,##; @dolist/inline u(%!/FUN`ATTRIBUTES)=@include/args %!/INC`WATCH`ATTRIBUTE=attribute,##,by,%<by>; &DATA`WATCHING %!=filterbool(%!/FUN`HANDLED,u(%!/FUN`ATTRIBUTES)); &DATA`FOREIGN %!=filterbool(%!/FUN`FOREIGNWATCH,u(%!/FUN`ATTRIBUTES))
      # %<attribute> one attribute: in the table, watched, and handled, unless someone else watches it.
      # %<by> whoever changed the setting, told when it is left alone; empty at install.
      INC`WATCH`ATTRIBUTE: |-
        @if strmatch(attrwatch(%<attribute>),#-1*)={@attribute/access %<attribute>=none}; @if not(strlen(attrwatch(%<attribute>)))={@attribute/watch %<attribute>}; @if u(%!/FUN`DEFAULTWATCH,%<attribute>)={@cpattr [u(%!/FUN`HANDLER)]/FN`GMCPCHAR`HANDLER=[u(%!/FUN`HANDLER)]/WATCH`%<attribute>`GMCPCHAR}, {@if hasattr(u(%!/FUN`HANDLER),WATCH`%<attribute>`GMCPCHAR)={@wipe [u(%!/FUN`HANDLER)]/WATCH`%<attribute>`GMCPCHAR}; @pemit strfirstof(%<by>,%#)=GMCP Char: %<attribute> is already watched with [attrwatch(%<attribute>)], so it is left as it is and its changes are not sent.}
      # %<attribute> one attribute no longer named: its handler goes (and the empty WATCH`<attribute> left
      # above it), and its watch too if it is the default one and nothing else is left that it runs.
      INC`UNWATCH: |-
        @if hasattr(u(%!/FUN`HANDLER),WATCH`%<attribute>`GMCPCHAR)={@wipe [u(%!/FUN`HANDLER)]/WATCH`%<attribute>`GMCPCHAR}; @if cand(hasattr(u(%!/FUN`HANDLER),WATCH`%<attribute>),not(hasattrval(u(%!/FUN`HANDLER),WATCH`%<attribute>)),not(words(lattr([u(%!/FUN`HANDLER)]/WATCH`%<attribute>`*))))={@wipe [u(%!/FUN`HANDLER)]/WATCH`%<attribute>}; @if cand(u(%!/FUN`DEFAULTWATCH,%<attribute>),not(words(u(%!/FUN`LEFT,%<attribute>))))={@attribute/watch %<attribute>=}
      AINSTALL: |-
        @include %!/INC`WATCH
      AUPDATE: |-
        @include %!/INC`WATCH
      # +config triggers this after a change, with %<setting>.
      ACONFIG: |-
        @assert match(vitals status,%<setting>); @include %!/INC`WATCH

  - ref: gmcp_char_help
    type: thing
    name: GMCP Char Help
    location: "{{gmcp_char}}"
    attributes:
      HELP: |-
        Your character's name, gauges and status, for a MUD client, over GMCP.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`GMCP`CHAR: |-
        gmcp room|gmcp items|gmcp comm
      HELP`GMCP`CHAR: |-
        A MUD client such as **Mudlet** can draw gauges for your health and other stats from the GMCP **Char** package. When you connect, your client is sent:

        - **Char.Name**: your name, and your name in full.
        - **Char.Vitals**: your health and the like, such as `hp` and `maxhp`, which Mudlet draws as gauges.
        - **Char.Status**: your name and the game's other stats about you, such as your level.

        Each is sent again the moment one of its stats changes, and Char.Name when you are renamed.

        Which attributes are vitals and which are status is the game's choice: `+config gmcp-char`. A `FULLNAME` attribute on you is your name in full.

        ## For staff

        The package hears about a change through `@attribute/watch`: each vitals and status attribute is watched (added to the attribute table first when it is not there), and ``WATCH`<attribute>`GMCPCHAR`` on the event handler sends the update. An attribute already watched with another pattern is left alone and not sent; the GMCP Char object's ``DATA`FOREIGN`` lists them. See `help @attribute watch`.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`GMCP-CHAR: |-
        {{gmcp_char_help}}

  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`GMCP-CHAR: |-
        {{gmcp_char}}

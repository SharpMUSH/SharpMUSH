format: "1.16"
package: scene
title: "Scene System"
version: 1.18.0
authors: [SharpMUSH]
description: "Scene Logger: pose/say/semipose capture into the Scene System, plus the +scene/* player verbs. Ships the game policy the C# engine deliberately omits, including who may be associated with a scene."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [scene, rp, logging, capture, hooks]
category: Scenes
requires_server: ">=0.1"

# +scene, the capture hooks and every scene*() call run on the Scene plugin. Without it running the
# package does not install, and turning the plugin off uninstalls it.
plugins: [scene]

# No other package. The +help topics and the +config settings below are this package's own data, written the way
# plus-help and plus-config read them; the bridges scene-help and scene-config register them with those packages,
# so a game without +help or +config still runs scenes.

# Staff finish a scene that is not theirs with the scene.close permission, and change any scene or pose with
# scene.manage. The package defines both; a game hands one out by allowing it on a role
# (@role/allow helper=scene.close) or a player (@permission/allow <player>=scene.manage). A wizard holds
# control.all, which FUN`MANAGES counts as scene.manage, since a package cannot change the wizard role.
categories:
  permissions:
    - name: Staff
      description: Permissions for the people who help run the game.
permissions:
  - name: scene.close
    category: Staff
    description: Finish any scene, not only your own.
  - name: scene.manage
    category: Staff
    description: Change any scene or pose, not only your own, and cancel a scheduled scene that has poses in it.

# Create mode: a single owned WIZARD thing carries the capture hooks and the
# +scene/* verbs. It MUST be WIZARD — it is the @hook/override target, runs the
# wizard-only @scene / @hook commands, and AINSTALL/STARTUP run as this object
# (so %! / me = this object and self-execution of the wizard-locked @hook works).
#
# AINSTALL runs once after first install; STARTUP runs on every boot. Both
# (re-)establish the three OVERRIDE hooks idempotently — immediate on install,
# re-set on each boot (the hook registry is rebuilt from softcode policy).
#
# Capture is one of two pose-recording paths. An @hook/override on POSE/SAY/SEMIPOSE/@EMIT
# reproduces the built-in room emit EXACTLY, then records the pose via the
# @scene/addpose COMMAND -- that is the path a MU* client takes, and it records only
# where the poser is standing. The other is the +scene/<mode> <id>=<text> verbs below,
# which the web portal's live-scene compose box sends: they name the scene instead of
# inferring it from the room. Reads use the
# scene… functions; all data-writes use @scene/* commands (never side-effect fns).
#
# Attribute organization follows the project FUN`/CMD`/DATA`/INCLUDE` tree
# convention (see the plus-help package):
#   DATA`*     — config/constant knobs (reads, replaces a SceneOptions config)
#   FUN`*      — pure reads / guards (called via u())
#   CMD`*      — player verbs + capture $-commands (writes go through @scene/*)
#   INCLUDE`*  — shared command tails composed via @include (keep attrs small)
objects:
  - ref: logger
    type: thing
    name: Scene Logger
    flags: [WIZARD]
    attributes:
      # ---- settings, as +config declares them; the verbs read each with get(%!/DATA`CONFIG`<NAME>). Staff change
      # them with +config scene when scene-config is installed, or by setting the attribute ----
      # DEFAULT-STATUS is `active` so +scene/create yields an immediately-capturing scene: pose/say/@emit are
      # recorded right after creation, with no separate +scene/start. `new` (or `scheduled`) makes creation
      # STAGE a scene that only begins logging after an explicit +scene/start. OPEN-DETAILS: see DETAIL` below.
      # RECALL-ROUNDS: see INC`RECALL. SCHEDULE-DAYS sits with +scene/upcoming.
      DATA`CONFIG:
        value: |-
          What a new scene starts as, which details players may set, and how much +scene/recall shows.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Scenes
      DATA`CONFIG`DEFAULT-STATUS: |-
        active
      DATA`CONFIG`DEFAULT-STATUS`TYPE: |-
        choice
      DATA`CONFIG`DEFAULT-STATUS`DEFAULT: |-
        active
      DATA`CONFIG`DEFAULT-STATUS`CHOICES: |-
        active new scheduled
      DATA`CONFIG`DEFAULT-STATUS`DESCRIPTION: |-
        What +scene/create makes: an active scene logs at once; new or scheduled waits for +scene/start.
      DATA`CONFIG`DEFAULT-STATUS`LABEL: |-
        New scene status
      DATA`CONFIG`DEFAULT-STATUS`EXAMPLE: |-
        new
      DATA`CONFIG`OPEN-DETAILS: |-
        1
      DATA`CONFIG`OPEN-DETAILS`TYPE: |-
        boolean
      DATA`CONFIG`OPEN-DETAILS`DEFAULT: |-
        1
      DATA`CONFIG`OPEN-DETAILS`DESCRIPTION: |-
        Whether an owner may set scene details the game does not list.
      DATA`CONFIG`OPEN-DETAILS`LABEL: |-
        Open details
      DATA`CONFIG`OPEN-DETAILS`EXAMPLE: |-
        no
      DATA`CONFIG`RECALL-ROUNDS: |-
        2
      DATA`CONFIG`RECALL-ROUNDS`TYPE: |-
        integer
      DATA`CONFIG`RECALL-ROUNDS`DEFAULT: |-
        2
      DATA`CONFIG`RECALL-ROUNDS`MIN: |-
        1
      DATA`CONFIG`RECALL-ROUNDS`MAX: |-
        20
      DATA`CONFIG`RECALL-ROUNDS`DESCRIPTION: |-
        How many rounds of poses a bare +scene/recall shows.
      DATA`CONFIG`RECALL-ROUNDS`LABEL: |-
        Recall rounds
      DATA`CONFIG`RECALL-ROUNDS`EXAMPLE: |-
        3

      # ---- owner / manager guard ------------------------------------------------
      # 1 when %0 may change any scene or pose: the scene.manage permission, or control.all, which every wizard
      # holds.
      FUN`MANAGES: |-
        cor(permission(%0,scene.manage),permission(%0,control.all))
      FUN`OWNS: |-
        cor(strmatch(scene(%1,owner),%0),u(%!/FUN`MANAGES,%0))
      # Finishing is the one owner verb staff may need on someone else's scene: the scene.close
      # permission this package defines (see permissions: above), allowed on a role such as helper.
      FUN`CAN`CLOSE: |-
        cor(u(%!/FUN`OWNS,%0,%1),permission(%0,scene.close))

      # ---- approval guard -------------------------------------------------------
      # The ONE place +scene asks "may this thing be ASSOCIATED with a scene?". Two halves:
      #   • it must be a CHARACTER — a scene associates players, not things or rooms; and
      #   • it must be APPROVED — isapproved() is the engine predicate, "royalty or above,
      #     or holding the approved role", and it is false for a guest whatever else is set.
      # The engine ships that rule and no policy for what earns the role; a game decides that
      # and assigns it itself. A game that wants a DIFFERENT bar edits this one attribute —
      # nothing else in the package tests the role, and the engine and the verbs cannot drift
      # because both sides run the same isapproved() code.
      #
      # Association is the line, not visibility: viewing a schedule or a scene's information is
      # open to any character (see CMD`BROWSE / OLD / UPCOMING / SHOW / WHO / RECALL / POT, none
      # of which include this guard), and leaving is always allowed (CMD`LEAVE / UNTAG /
      # DEACTIVATE). Joining, owning, administering and posing into a scene all require approval.
      #
      # The guard is a bare @assert at the head of each gated verb, and DATA`DENY`APPROVAL keeps the refusal
      # text in one place; get() reads it without evaluating it. An @assert inside a plain @include stops the
      # caller too (help @include; only /nobreak fences it off), which is how the web verbs share
      # INC`WEB`CHECK.
      FUN`IS`APPROVED: |-
        cand(hastype(%0,PLAYER),isapproved(%0))
      DATA`DENY`APPROVAL: |-
        You are not approved to take part in scenes. You can still browse the schedule with +scene and +scene/upcoming, and read any scene with +scene <id>.

      # ---- focus / ownership guards ---------------------------------------------
      # scenefocus() answers "#-1 NOT FOUND" for anyone who has not joined a scene, and that string is
      # non-empty and truthy — so every verb that read it and acted was acting on a scene that does not
      # exist. The two arms failed differently and both were wrong. A manager, whom FUN`OWNS deliberately
      # treats as owning every scene, sailed through and was told "Pitch set for scene #-1 NOT FOUND."
      # while nothing was written. Everyone else failed a bare @assert carrying no message, so the verb
      # produced no output at all — indistinguishable from a command that does not exist.
      #
      # Written as a bare @assert at each verb, as the approval guard is.
      DATA`DENY`NOFOCUS: |-
        You are not focused on a scene. Join one with +scene/join <id>, or see what is running with +scene.
      # The portal's compose box names its scene (+scene/pose <id>=…), so it is refused here rather than by
      # the room capture, which already only finds a running scene.
      DATA`DENY`NOTRUNNING: |-
        That scene is not running, so nothing is recorded into it. Its owner resumes it with +scene/start.
      DATA`DENY`NOTOWNER: |-
        That scene is not yours to change. Its owner, a wizard, or anyone holding the scene.manage permission can do it.
      DATA`DENY`NOTCLOSER: |-
        That scene is not yours to finish. Its owner, a wizard, or anyone holding the scene.close or scene.manage permission can.
      DATA`DENY`NOTPOSER: |-
        That pose is not yours. Only its author, a wizard, or anyone holding the scene.manage permission can change it.
      # +scene/edit and +scene/rewrite refuse to leave a pose with nothing but its poser's name; deleting one
      # is +scene/delete.
      DATA`DENY`EMPTY: |-
        A pose can't be left empty. Use +scene/delete <pose> to remove it.
      # The two ways a time given to +scene/schedule, /reschedule or /pause is refused (FUN`SCHEDULE`WHEN).
      DATA`DENY`BADTIME: |-
        I can't read that as a time. Give a date and time, such as 2026-12-31 20:00, tomorrow 7pm or next Tuesday 18:30, or a time from now, such as +3d, +12h or +1w.
      DATA`DENY`PASTTIME: |-
        That time has already passed. Give one to come, such as +3d.
      # The name a member poses under in scene %0: the persona they set there with +scene/as, or their own.
      FUN`POSER: |-
        firstof(scenemember(%0,%1,showas),name(%1))
      # 1 when %1 would leave pose %0 with nothing in it: empty, or only its poser's name, which is what a
      # pose's text is once the words after the name are taken out.
      FUN`BARE: |-
        setq(bare_text,trim(edit(%1,%r,%b)))[cor(not(strlen(%q<bare_text>)),strmatch(%q<bare_text>,scenepose(,%0,authorname)),strmatch(%q<bare_text>,firstof(scenepose(,%0,showas),#-1)))]

      # ---- pose types -----------------------------------------------------------
      # Every pose has a type. A type is two attributes here, the way a feed kind's tie-ins are attributes on
      # its owner:
      #   TYPE`<KEY>         JSON the Scene plugin reads: label, presentation (the portal's layout: prose,
      #                      band, message, aside or notice), tone (a theme colour: foreground, primary,
      #                      secondary, tertiary, muted, success, warning, error, info), icon, hidden (where
      #                      a reader starts with it hidden: true for everywhere, "reading" or "playing")
      #                      and order. @scene/types shows what it made of them.
      #   TYPE`<KEY>`FORMAT  Softcode drawing one line of the type for telnet: %0 the pose id (empty for a
      #                      sample), %1 the reader, %2 the line with its markup, %3 the scene id (empty for
      #                      a sample). Empty shows that reader nothing. Live lines (INC`CAPTURE`LINE), recall
      #                      and log all go through it.
      # A pose of a prose or aside type is drawn under a rule naming who posed it and the pose, and over a rule
      # naming the scene. A band, message or notice type has no rule: it is one line, tagged with the
      # scene its FORMAT is given, <OOC · 12>.
      # tone() colours by theme colour rather than by colour, so each reader sees it in their own @theme.
      # A package adding a type attaches both attributes here, as radio-scene does for radio; uninstalling
      # it takes the type away. Staff with layout.admin change the JSON with +scene/type/set; the FORMAT runs
      # as this WIZARD object, so only someone who controls it may write one.
      TYPE`IC: |-
        {"label":"In character","presentation":"prose","order":10}
      TYPE`IC`FORMAT: |-
        %2
      TYPE`OOC: |-
        {"label":"Out of character","presentation":"band","tone":"secondary","hidden":"reading","order":20}
      TYPE`OOC`FORMAT: |-
        tone(muted,<OOC[if(strlen(%3),%b[chr(183)] %3)]> %2)
      TYPE`NARRATION: |-
        {"label":"Narration","presentation":"aside","tone":"secondary","order":30}
      TYPE`NARRATION`FORMAT: |-
        tone(secondary,%2)
      # Type %0's line %2 (pose %1 of scene %3) for reader %4 (or %#): its FORMAT, or without one the line, marked
      # <KEY> for a listed type other than ic, with the scene for a type drawn without a rule. A type no longer
      # listed draws as in character, as the portal draws it.
      FUN`TYPE`DRAW: |-
        if(hasattr(%!,TYPE`%0`FORMAT),u(%!/TYPE`%0`FORMAT,%1,firstof(%4,%#),%2,%3),if(cand(member(scenetype(),lcstr(%0)),not(strmatch(%0,ic))),<[ucstr(%0)][if(cand(strlen(%3),not(u(%!/FUN`TYPE`FRAMED,%0))),%b[chr(183)] %3)]>%b)%2)
      # What speaker %0 says when they say %1 by type token %2 (" : ; or |): their SPEECHMOD's result, or %1
      # when it gives nothing, as the built-in speech commands read it (PennMUSH do_say, do_pose, do_emit).
      FUN`SPEECHMOD: |-
        [setq(speechmod,uargs(%0/SPEECHMOD,message,%1,type,%2))][if(strlen(%q<speechmod>),%q<speechmod>,%1)]
      # 1 when type %0 is drawn under a rule: any type but a band, message or notice, a removed one included.
      FUN`TYPE`FRAMED: |-
        not(match(band message notice,scenetype(lcstr(%0),presentation)))
      # The rule over pose %1 of scene %0: who posed it and the pose, on the left.
      FUN`POSE`RULE: |-
        rule(firstof(scenepose(%0,%1,showas),scenepose(%0,%1,authorname)) [chr(183)] pose %1,,json(object,title,"left"))
      # The rule under pose %1 of scene %0: the scene and the pose's marks (+scene/mark) on the right, through the
      # POSE`RULE filters.
      FUN`POSE`FOOTER: |-
        rule(,,json(object,titles,json(array,json(object,text,json(string,u(%!/FUN`FILTER,POSE`RULE,Scene %0[if(words(setr(pose_marks,scenepose(%0,%1,tags))),%b[chr(183)] [edit(%q<pose_marks>,%b,%b[chr(183)]%b)])],%0,%1)),side,"right"))))
      # Pose %1 of scene %3, type %0 and line %2, as reader %4 sees it: between its rule and footer when its type
      # has them, nothing when its FORMAT draws nothing for them. Live lines, recall and log all go through it.
      FUN`POSE`DRAW: |-
        if(strlen(setr(pose_line,u(%!/FUN`TYPE`DRAW,%0,%1,%2,%3,%4))),if(u(%!/FUN`TYPE`FRAMED,%0),u(%!/FUN`POSE`RULE,%3,%1)%r%q<pose_line>%r[u(%!/FUN`POSE`FOOTER,%3,%1)],%q<pose_line>))
      # A reader hides types in two places, each on its own: while reading a scene (+scene/log, highlights,
      # the portal's scene page) and while playing in one (+scene/recall, Play, a scene they joined).
      DATA`CONTEXTS: |-
        reading playing
      # The places %0 names: reading, playing, or both when it is empty. Empty when it names neither.
      FUN`CONTEXTS: |-
        switch(lcstr(trim(%0)),,get(%!/DATA`CONTEXTS),read*,reading,play*,playing,)
      # The types %0 has hidden while %1 (reading or playing): the ones they hid there with +scene/hide that are
      # still listed, and the ones the game starts hidden there that they have not shown with +scene/show.
      FUN`HIDDEN: |-
        setunion(setinter(get(%0/SCENE`HIDE`%1),scenetype()),squish(iter(scenetype(),if(cand(member(scenetype(%i0,hidden),%1),not(member(get(%0/SCENE`SHOW`%1),%i0))),%i0))))
      FUN`HIDDEN`NOW: |-
        iter(get(%!/DATA`CONTEXTS),While %i0: [if(words(setr(hidden_types,u(%!/FUN`HIDDEN,%0,%i0))),[itemize(%q<hidden_types>)] hidden.,every pose type shows.)],,%r)%r+scene/hide <type> hides one and +scene/show <type> shows one again; add =reading or =playing for only one of them.
      # %0's value for field %1, as JSON. scenetype(<key>,check,<json>) refuses anything that does not fit the field.
      FUN`TYPE`VALUE: |-
        switch(%0,hidden,switch(lcstr(%1),read*,json(string,reading),play*,json(string,playing),u(%!/FUN`DETAIL`BOOL,%1)),order,if(isint(%1),%1,json(string,%1)),json(string,%1))
      FUN`TYPE`SAMPLE: |-
        u(%!/FUN`TYPE`DRAW,%0,,name(%#) waves.,,%#)
      FUN`TYPES`TABLE: |-
        setq(type_keys,scenetype())[setq(type_reading,u(%!/FUN`HIDDEN,%#,reading))][setq(type_playing,u(%!/FUN`HIDDEN,%#,playing))][box(datacolumns(u(%!/FUN`TABLE`OPTS,1|4,|10|20|,1|2|1|3,||1|),tone(strong,Type)%r[iter(%q<type_keys>,%i0,,%r)],tone(strong,Name)%r[iter(%q<type_keys>,scenetype(%i0,label),,%r)],tone(strong,Looks like)%r[iter(%q<type_keys>,u(%!/FUN`TYPE`SAMPLE,%i0),,%r)],tone(strong,You)%r[iter(%q<type_keys>,switch(t(member(%q<type_reading>,%i0))[t(member(%q<type_playing>,%i0))],00,shown,10,hidden reading,01,hidden playing,hidden),,%r)]),Pose types,,u(%!/FUN`FRAME))]
      FUN`TYPE`CARD: |-
        box(fields(,Type,%0,Name,scenetype(%0,label),Portal look,scenetype(%0,presentation),Colour,firstof(scenetype(%0,tone),text),Icon,firstof(scenetype(%0,icon),none),Hidden at first,firstof(itemize(scenetype(%0,hidden)),no),Order,scenetype(%0,order),Looks like,u(%!/FUN`TYPE`SAMPLE,%0),Format,firstof(get(%!/TYPE`%0`FORMAT),none)),Pose type %0,,u(%!/FUN`FRAME))
      DATA`DENY`CONTEXT: |-
        Say where: =reading or =playing, or leave it off for both.
      DATA`DENY`TYPES: |-
        Changing pose types needs the layout.admin permission.
      DATA`TYPE`FIELDS: |-
        label presentation tone icon hidden order
      # ---- command palette (help palette entries) --------------------------------
      # scene_here (pushed by the scene-here package as players move) holds the scene running in the
      # room the player is in; scene_focus the scene they are posing in, pushed and dropped wherever
      # @scene/focus changes (join, create, activate, deactivate, leave, finish, the portal's poses).
      # Both carry `scene`, which fills the <scene> slots.
      # scene_here for each player in room %0, as the scene-here package keeps it while players move: pushed
      # while a scene that player may see runs there, dropped while none does. Every status change triggers
      # it, so those already in the room follow a scene starting, pausing or ending. One queued entry per room
      # (@trigger runs in place, a queued @dolist does not), so the room has a budget of its own.
      # What a player standing in the room of running scene %0 is told it is.
      FUN`HERE`TEXT: |-
        Scene %0[if(strlen(setr(here_title,scene(%0,title))),: %q<here_title>)] is running here.
      HERE`SYNC: |-
        @dolist %0=@trigger me/HERE`SYNC`ROOM=##
      HERE`SYNC`ROOM: |-
        think setq(here_room,%0); @dolist/inline lcon(%q<here_room>,player)={@if strmatch(setr(here_scene,objeval(##,scenewhere(%q<here_room>))),#-1*)={@context/drop ##=scene_here},{@context/push ##=scene_here,[json(object,scene,%q<here_scene>)],,[u(%!/FUN`HERE`TEXT,%q<here_scene>)]}}
      PALETTE`LIST: |-
        {"label":"Scenes running now","line":"+scene","always":true,"icon":"Theaters","keywords":"rp scenes list"}
      PALETTE`ABOUT: |-
        {"label":"About the scene here","line":"+scene <scene>","when":["scene_here"],"icon":"Info"}
      PALETTE`JOIN: |-
        {"label":"Join the scene here","line":"+scene/join <scene>","when":["scene_here"],"lock":"FUN`PALETTE`JOINABLE/1","icon":"Login"}
      PALETTE`POT: |-
        {"label":"Pose order","line":"+pot","when":["scene_focus"],"icon":"FormatListNumbered","info":"Who posed last, and how long ago."}
      PALETTE`RECALL: |-
        {"label":"Recent poses","line":"+scene/recall","when":["scene_focus"],"icon":"History"}
      PALETTE`LEAVE: |-
        {"label":"Leave the scene","line":"+scene/leave","when":["scene_focus"],"icon":"Logout"}
      # The JOIN entry's lock: 1 when the player (%#) may take part in scenes and is not already in the
      # one running where they stand.
      FUN`PALETTE`JOINABLE: |-
        cand(u(%!/FUN`IS`APPROVED,%#),not(strmatch(scenefocus(%#),scenewhere(loc(%#)))))

      CMD`TYPES:
        value: |-
          $(?is)^\+scene/types$: @assert words(scenetype())=@pemit %#=notice(SCENE,No pose types are defined.,warn); @pemit %#=u(%!/FUN`TYPES`TABLE)
        flags: [REGEXP]
      CMD`TYPE:
        value: |-
          $(?is)^\+scene/type +(.+)$: think setq(type_key,lcstr(trim(%1))); @assert member(scenetype(),%q<type_key>)=@pemit %#=notice(SCENE,No pose type called %q<type_key>. +scene/types lists them.,warn); @pemit %#=u(%!/FUN`TYPE`CARD,%q<type_key>)
        flags: [REGEXP]
      CMD`TYPE`ADD:
        value: |-
          $(?is)^\+scene/type/add +([^=]+)=(.+)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`TYPES),error); think setq(type_key,lcstr(trim(%1)))[setq(type_json,json(object,label,json(string,trim(%2))))]; @assert not(hasattr(%!,TYPE`%q<type_key>))=@pemit %#=notice(SCENE,There is already a pose type called %q<type_key>.,warn); @assert not(strlen(setr(type_error,scenetype(%q<type_key>,check,%q<type_json>))))=@pemit %#=notice(SCENE,after(%q<type_error>,#-1%b),warn); &TYPE`%q<type_key> %!=%q<type_json>; @pemit %#=notice(SCENE,Added pose type %q<type_key>. +scene/type/set %q<type_key>/<field>=<value> changes how it looks.,ok)
        flags: [REGEXP]
      CMD`TYPE`SET:
        value: |-
          $(?is)^\+scene/type/set +([^/=]+)/([^=]+)=(.*)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`TYPES),error); think setq(type_key,lcstr(trim(%1)))[setq(type_field,lcstr(trim(%2)))]; @assert hasattr(%!,TYPE`%q<type_key>)=@pemit %#=notice(SCENE,No pose type called %q<type_key>. +scene/types lists them.,warn); @assert member(get(%!/DATA`TYPE`FIELDS),%q<type_field>)=@pemit %#=notice(SCENE,A pose type's fields are [itemize(get(%!/DATA`TYPE`FIELDS))].,warn); think setq(type_json,json_mod(get(%!/TYPE`%q<type_key>),set,$.%q<type_field>,u(%!/FUN`TYPE`VALUE,%q<type_field>,trim(%3)))); @assert not(strlen(setr(type_error,scenetype(%q<type_key>,check,%q<type_json>))))=@pemit %#=notice(SCENE,after(%q<type_error>,#-1%b),warn); &TYPE`%q<type_key> %!=%q<type_json>; @pemit %#=notice(SCENE,Pose type %q<type_key>: %q<type_field> set.,ok)
        flags: [REGEXP]
      CMD`TYPE`REMOVE:
        value: |-
          $(?is)^\+scene/type/remove +(.+)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`TYPES),error); think setq(type_key,lcstr(trim(%1))); @assert hasattr(%!,TYPE`%q<type_key>)=@pemit %#=notice(SCENE,No pose type called %q<type_key>.,warn); @wipe %!/TYPE`%q<type_key>`**; &TYPE`%q<type_key> %!; @pemit %#=notice(SCENE,Removed pose type %q<type_key>. Poses of that type now read as in character.,ok)
        flags: [REGEXP]
      # +scene/hide <type>[=reading|playing] and +scene/show <type>[=reading|playing]: which types this reader
      # leaves out while reading a scene and while playing in one, both when neither is named. Kept on the
      # reader, as SCENE`HIDE`<CONTEXT> and SCENE`SHOW`<CONTEXT>, so the portal's Show menus read the same choices.
      CMD`TYPE`HIDE:
        value: |-
          $(?is)^\+scene/hi(?\:d(?\:e)?)?(?\: +([^=]*)(?\:=(.*))?)?$: think setq(type_key,lcstr(trim(%1)))[setq(type_where,u(%!/FUN`CONTEXTS,%2))]; @assert strlen(%q<type_key>)=@pemit %#=notice(SCENE,u(%!/FUN`HIDDEN`NOW,%#)); @assert member(scenetype(),%q<type_key>)=@pemit %#=notice(SCENE,No pose type called %q<type_key>. +scene/types lists them.,warn); @assert strlen(%q<type_where>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`CONTEXT),warn); @dolist/inline %q<type_where>={&SCENE`HIDE`## %#=setunion(get(%#/SCENE`HIDE`##),%q<type_key>); &SCENE`SHOW`## %#=setdiff(get(%#/SCENE`SHOW`##),%q<type_key>)}; @assert not(words(iter(%q<type_where>,if(member(get(%#/SCENE`HIDE`%i0),%q<type_key>),,%i0))))=@pemit %#=notice(SCENE,Your choice could not be saved on your character.,warn); @pemit %#=notice(SCENE,scenetype(%q<type_key>,label) lines are hidden while [itemize(%q<type_where>)]. +scene/show %q<type_key> shows them again.,ok)
        flags: [REGEXP]
      CMD`TYPE`SHOW:
        value: |-
          $(?is)^\+scene/sh(?\:o(?\:w)?)? +([^=]+)(?\:=(.*))?$: think setq(type_key,lcstr(trim(%1)))[setq(type_where,u(%!/FUN`CONTEXTS,%2))]; @assert member(scenetype(),%q<type_key>)=@pemit %#=notice(SCENE,No pose type called %q<type_key>. +scene/types lists them.,warn); @assert strlen(%q<type_where>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`CONTEXT),warn); @dolist/inline %q<type_where>={&SCENE`SHOW`## %#=setunion(get(%#/SCENE`SHOW`##),%q<type_key>); &SCENE`HIDE`## %#=setdiff(get(%#/SCENE`HIDE`##),%q<type_key>)}; @assert not(words(iter(%q<type_where>,if(member(get(%#/SCENE`SHOW`%i0),%q<type_key>),,%i0))))=@pemit %#=notice(SCENE,Your choice could not be saved on your character.,warn); @pemit %#=notice(SCENE,scenetype(%q<type_key>,label) lines show while [itemize(%q<type_where>)].,ok)
        flags: [REGEXP]

      # ---- filters ----------------------------------------------------------------
      # Another package changes what +scene shows without editing this one: it attaches FILTER`<POINT>`<NAME> to the
      # Scene Logger. Where +scene draws a point, chain() runs every filter on it in name order: each gets what would
      # be shown as %0 and returns what is shown instead, and the next gets that. Uninstalling the package takes its
      # filters away. A filter runs here, as the Logger, with %# the player reading. The points:
      #   CARD         %0 the body of a scene's card (+scene <id>), between its title and its last rule; %1 the scene
      #   LIST`TITLE   %0 a scene's title in +scene, /old and /mine, with its listed details; %1 the scene
      #   LOG`HEAD     %0 the lines over +scene/log; %1 the scene
      #   POSE`RULE    %0 the right side of the rule under a pose, plain text; %1 the scene, %2 the pose
      #   DETAIL`SHOW  %0 a scene's value for a detail, as shown everywhere it is shown; %1 the scene, %2 the detail
      #   JOIN         %0 what a player is told when they join; %1 the scene, %2 the player
      #   HELP         %0 the body of +scene/help, the command list; scene-help adds where to read more
      FUN`FILTER: |-
        chain(u(%!/FUN`FILTERS,%0),%1,%2,%3)
      # The filters on point %0, as the chain() list: this object's FILTER`%0`<NAME> attributes.
      FUN`FILTERS: |-
        iter(lattr(%!/FILTER`%0`*),%!/%i0)

      # ---- scene details ----------------------------------------------------------
      # A scene's details say what it is about beyond its title and pitch: the verse it is set in, the canon it
      # draws on, a content warning, or anything else its owner names. Each is one key of the scene's metadata,
      # which @scene/set writes and scene() reads, so softcode reads a scene's verse as scene(<id>,verse). The game
      # may list some, one attribute per detail; this package lists none, and scene-verse adds verse, canon and
      # warning:
      #   DETAIL`<KEY>  JSON the Scene plugin reads: label (its name for people), hint (one line on what goes in
      #                 it), choices (the values it allows; none means any text), many (true when a scene may give
      #                 several, split by |), listed (shown beside the title in +scene lists and on the portal's
      #                 scene cards), tone (the theme colour its values show in, such as warning) and order.
      #                 scenedetail() lists the keys, scenedetail(<key>,<field>) reads a field.
      # A key must be a word that is not one of the scene's own fields (status, title, room, ...). Staff with
      # layout.admin change the catalogue with +scene/detail/add, /set and /remove. With DATA`CONFIG`OPEN-DETAILS set, as
      # shipped, an owner may set any detail, shown under its key when the catalogue does not list it.
      DATA`DENY`DETAILS: |-
        Changing scene details needs the layout.admin permission.
      DATA`DETAIL`FIELDS: |-
        label hint choices many listed tone order
      # The name detail %0 goes by: its label, or for one the catalogue does not list, its key.
      FUN`DETAIL`LABEL: |-
        if(member(scenedetail(),%0),scenedetail(%0),capstr(%0))
      # Scene %0's value for detail %1, several values split by a middle dot, in the detail's tone, through the
      # DETAIL`SHOW filters.
      FUN`DETAIL`SHOW: |-
        u(%!/FUN`FILTER,DETAIL`SHOW,u(%!/FUN`DETAIL`PAINT,%1,edit(scene(%0,%1),|,%b[chr(183)]%b)),%0,%1)
      # %1 in the tone detail %0 names, or as it is when it names none or the catalogue does not list it.
      FUN`DETAIL`PAINT: |-
        if(strlen(setr(detail_tone,if(member(scenedetail(),%0),scenedetail(%0,tone)))),tone(%q<detail_tone>,%1),%1)
      # How many of scene %0's values for detail %1 match the pattern %2, ignoring case.
      FUN`DETAIL`HAS: |-
        if(not(strmatch(setr(detail_values,scene(%0,%1)),#-1*)),words(iter(%q<detail_values>,if(strmatch(trim(%i0),%2),1),|,%b)),0)
      # The scene's details as a table, a name and a value to a row, for the card.
      FUN`DETAIL`TABLE: |-
        datacolumns(u(%!/FUN`TABLE`OPTS,1,|,1|2,|1),iter(%1,tone(strong,u(%!/FUN`DETAIL`LABEL,%i0)),,%r),iter(%1,u(%!/FUN`DETAIL`SHOW,%0,%i0),,%r))
      # The scene's details on one line, for the top of its log.
      FUN`DETAIL`LINE: |-
        iter(scene(%0,details),tone(strong,u(%!/FUN`DETAIL`LABEL,%i0)): [u(%!/FUN`DETAIL`SHOW,%0,%i0)],,%b[chr(183)]%b)
      # The listed details scene %0 has, after its title in a list, in a muted tone.
      FUN`DETAIL`TAGS: |-
        setq(detail_listed,squish(iter(scenedetail(),if(cand(scenedetail(%i0,listed),strlen(scene(%0,%i0))),%i0))))[if(words(%q<detail_listed>),tone(muted,%b[chr(183)] [iter(%q<detail_listed>,u(%!/FUN`DETAIL`SHOW,%0,%i0),,%b[chr(183)]%b)]))]
      # What detail %0 takes: its choices, or any text, and whether several.
      FUN`DETAIL`TAKES: |-
        if(strlen(setr(detail_choices,scenedetail(%0,choices))),itemize(%q<detail_choices>,|,or),any text)[if(scenedetail(%0,many),\, several split by |)]
      # %0's value for catalogue field %1, as JSON: choices are a list split by |, many and listed yes or no.
      FUN`DETAIL`VALUE: |-
        switch(%0,choices,json_array(iter(%1,json(string,trim(%i0)),|,%r),%r),many,u(%!/FUN`DETAIL`BOOL,%1),listed,u(%!/FUN`DETAIL`BOOL,%1),order,if(isint(%1),%1,json(string,%1)),json(string,%1))
      FUN`DETAIL`BOOL: |-
        switch(lcstr(%0),yes,true,true,true,on,true,1,true,no,false,false,false,off,false,0,false,json(string,%0))
      FUN`DETAILS`TABLE: |-
        setq(detail_keys,scenedetail())[box(datacolumns(u(%!/FUN`TABLE`OPTS,1|4,|10|20|,1|2|3|2,||1|),tone(strong,Detail)%r[iter(%q<detail_keys>,%i0,,%r)],tone(strong,Name)%r[iter(%q<detail_keys>,scenedetail(%i0),,%r)],tone(strong,What goes in it)%r[iter(%q<detail_keys>,firstof(scenedetail(%i0,hint),-),,%r)],tone(strong,Takes)%r[iter(%q<detail_keys>,u(%!/FUN`DETAIL`TAKES,%i0),,%r)]),Scene details,,u(%!/FUN`FRAME))]
      FUN`DETAIL`CARD: |-
        box(fields(,Detail,%0,Name,scenedetail(%0),What goes in it,firstof(scenedetail(%0,hint),-),Takes,u(%!/FUN`DETAIL`TAKES,%0),In lists,if(scenedetail(%0,listed),yes,no),Tone,firstof(scenedetail(%0,tone),-),Order,scenedetail(%0,order)),Scene detail %0,,u(%!/FUN`FRAME))
      # +scene/details lists the game's details; +scene/detail <key> shows one.
      CMD`DETAILS:
        value: |-
          $(?is)^\+scene/details$: @assert words(scenedetail())=@pemit %#=notice(SCENE,if(get(%!/DATA`CONFIG`OPEN-DETAILS),This game lists no scene details. You can still set your own: +scene/set <name>=<value>.,This game has no scene details.),warn); @pemit %#=u(%!/FUN`DETAILS`TABLE)[if(get(%!/DATA`CONFIG`OPEN-DETAILS),%rYou can set other details too: +scene/set <name>=<value>.)]
        flags: [REGEXP]
      CMD`DETAIL:
        value: |-
          $(?is)^\+scene/detail +(.+)$: think setq(detail_key,lcstr(trim(%1))); @assert member(scenedetail(),%q<detail_key>)=@pemit %#=notice(SCENE,No scene detail called %q<detail_key>. +scene/details lists them.,warn); @pemit %#=u(%!/FUN`DETAIL`CARD,%q<detail_key>)
        flags: [REGEXP]
      CMD`DETAIL`ADD:
        value: |-
          $(?is)^\+scene/detail/add +([^=]+)=(.+)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`DETAILS),error); think setq(detail_key,lcstr(trim(%1)))[setq(detail_json,json(object,label,json(string,trim(%2))))]; @assert not(hasattr(%!,DETAIL`%q<detail_key>))=@pemit %#=notice(SCENE,There is already a scene detail called %q<detail_key>.,warn); @assert not(strlen(setr(detail_error,scenedetail(%q<detail_key>,check,%q<detail_json>))))=@pemit %#=notice(SCENE,after(%q<detail_error>,#-1%b),warn); &DETAIL`%q<detail_key> %!=%q<detail_json>; @pemit %#=notice(SCENE,Added scene detail %q<detail_key>. +scene/detail/set %q<detail_key>/<field>=<value> changes it.,ok)
        flags: [REGEXP]
      CMD`DETAIL`SET:
        value: |-
          $(?is)^\+scene/detail/set +([^/=]+)/([^=]+)=(.*)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`DETAILS),error); think setq(detail_key,lcstr(trim(%1)))[setq(detail_field,lcstr(trim(%2)))]; @assert hasattr(%!,DETAIL`%q<detail_key>)=@pemit %#=notice(SCENE,No scene detail called %q<detail_key>. +scene/details lists them.,warn); @assert member(get(%!/DATA`DETAIL`FIELDS),%q<detail_field>)=@pemit %#=notice(SCENE,A scene detail's fields are [itemize(get(%!/DATA`DETAIL`FIELDS))].,warn); think setq(detail_json,json_mod(get(%!/DETAIL`%q<detail_key>),set,$.%q<detail_field>,u(%!/FUN`DETAIL`VALUE,%q<detail_field>,trim(%3)))); @assert not(strlen(setr(detail_error,scenedetail(%q<detail_key>,check,%q<detail_json>))))=@pemit %#=notice(SCENE,after(%q<detail_error>,#-1%b),warn); &DETAIL`%q<detail_key> %!=%q<detail_json>; @pemit %#=notice(SCENE,Scene detail %q<detail_key>: %q<detail_field> set.,ok)
        flags: [REGEXP]
      CMD`DETAIL`REMOVE:
        value: |-
          $(?is)^\+scene/detail/remove +(.+)$: @assert permission(%#,layout.admin)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`DETAILS),error); think setq(detail_key,lcstr(trim(%1))); @assert hasattr(%!,DETAIL`%q<detail_key>)=@pemit %#=notice(SCENE,No scene detail called %q<detail_key>.,warn); &DETAIL`%q<detail_key> %!; @pemit %#=notice(SCENE,Removed scene detail %q<detail_key>. Scenes keep their values for it[if(get(%!/DATA`CONFIG`OPEN-DETAILS),\, shown under its key)].,ok)
        flags: [REGEXP]
      # +scene/set [<id>/]<detail>=<value>: the focused scene, or the one named; an empty value clears it. Its owner
      # or a scene manager, as for the title and pitch. scenedetail(<key>,value,<value>) refuses a key that can't be a detail and a value
      # the detail does not allow, and writes several values the one way.
      CMD`SET:
        value: |-
          $(?is)^\+scene/set +(?\:(\d+)/)?([^=]+)=(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); think setq(detail_key,lcstr(trim(%2))); @assert cor(member(scenedetail(),%q<detail_key>),get(%!/DATA`CONFIG`OPEN-DETAILS))=@pemit %#=notice(SCENE,No scene detail called %q<detail_key>. +scene/details lists them.,warn); @assert not(strmatch(setr(detail_value,scenedetail(%q<detail_key>,value,%3)),#-1*))=@pemit %#=notice(SCENE,after(%q<detail_value>,#-1%b),warn); @scene/set %q<scene_id>/%q<detail_key>=%q<detail_value>; @pemit %#=notice(SCENE,if(strlen(%q<detail_value>),Scene %q<scene_id>: [u(%!/FUN`DETAIL`LABEL,%q<detail_key>)] is now [u(%!/FUN`DETAIL`SHOW,%q<scene_id>,%q<detail_key>)].,Scene %q<scene_id>: [u(%!/FUN`DETAIL`LABEL,%q<detail_key>)] cleared.),ok)
        flags: [REGEXP]

      # ---- pose marks -------------------------------------------------------------
      # +scene/mark <pose>=<word> and +scene/unmark <pose>=<word>: words on one pose, such as flashback or dream, kept
      # as the pose's tags. The portal's scene page filters by them, and recall shows them beside the scene on the
      # pose's rule. The pose's author, the scene's owner or a scene manager.
      FUN`CAN`MARK: |-
        cor(strmatch(scenepose(,%1,author),num(%0)),u(%!/FUN`OWNS,%0,scenepose(,%1,scene)))
      CMD`MARK:
        value: |-
          $(?is)^\+scene/ma(?\:r(?\:k)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert cand(strlen(setr(pose_id,trim(before(%1,chr(61))))),eq(words(setr(mark_word,lcstr(trim(after(%1,chr(61)))))),1))=@pemit %#=notice(SCENE,get(%!/DATA`USAGE`MARK),warn); @assert not(strmatch(scenepose(,%q<pose_id>,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %q<pose_id>,warn); @assert u(%!/FUN`CAN`MARK,%#,%q<pose_id>)=@pemit %#=notice(SCENE,That pose is not yours to mark. Its author or the scene's owner can.,error); @assert not(member(scenepose(,%q<pose_id>,tags),%q<mark_word>))=@pemit %#=notice(SCENE,Pose %q<pose_id> is already marked %q<mark_word>.,warn); @scene/setpose %q<pose_id>/tags=setunion(scenepose(,%q<pose_id>,tags),%q<mark_word>); @pemit %#=notice(SCENE,Pose %q<pose_id> marked %q<mark_word>.,ok)
        flags: [REGEXP]
      CMD`UNMARK:
        value: |-
          $(?is)^\+scene/unm(?\:a(?\:r(?\:k)?)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert cand(strlen(setr(pose_id,trim(before(%1,chr(61))))),eq(words(setr(mark_word,lcstr(trim(after(%1,chr(61)))))),1))=@pemit %#=notice(SCENE,get(%!/DATA`USAGE`UNMARK),warn); @assert not(strmatch(scenepose(,%q<pose_id>,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %q<pose_id>,warn); @assert u(%!/FUN`CAN`MARK,%#,%q<pose_id>)=@pemit %#=notice(SCENE,That pose is not yours to mark. Its author or the scene's owner can.,error); @assert member(scenepose(,%q<pose_id>,tags),%q<mark_word>)=@pemit %#=notice(SCENE,Pose %q<pose_id> is not marked %q<mark_word>.,warn); @scene/setpose %q<pose_id>/tags=setdiff(scenepose(,%q<pose_id>,tags),%q<mark_word>); @pemit %#=notice(SCENE,Pose %q<pose_id> is no longer marked %q<mark_word>.,ok)
        flags: [REGEXP]

      # ---- capture hooks --------------------------------------------------------
      # Each hook RE-BROADCASTS its type-specific speech via @message/spoof, then records
      # the rendered line. The @scene/addpose call itself stays inline in each hook because
      # each speech type renders a different line; drawing it for each hearer, with its rule, is
      # factored out into INC`CAPTURE`LINE and @included.
      #
      # Why @message/spoof instead of hand-rolled @remit/@pemit/@oemit (the old form):
      #   • /spoof makes the notification SENDER the real speaker (%# / enactor), NOT the
      #     WIZARD Scene Logger that runs the hook — restoring correct attribution (the
      #     old @oemit-as-Logger form broke @emit attribution). The Logger is WIZARD, so it
      #     passes the /spoof permission check.
      #   • @message evaluates the format attribute ONCE PER RECIPIENT, so a single call
      #     renders speaker-specific ("You say…") and observer-specific ("Name says…") text.
      #
      # Form: @message/spoof <recipients>=<default>,<obj>/<attr>,<args...>
      #   recipients = lcon(loc(%#)) — everyone in the speaker's room hears it (per-recipient).
      #   <default>  = the built-in third-person literal, used verbatim when the speaker has
      #                no FORMAT`<TYPE>` attribute (it is NOT re-evaluated per recipient, so the
      #                fallback is a single line for every recipient of that call; SAY therefore
      #                makes a separate call for %#).
      #   <obj>/<attr> = %#/FORMAT`<TYPE>` — the per-player render read off the SPEAKER. When set,
      #                it receives %0 = the message text and %1 = the recipient's dbref (short #N,
      #                via the @message `##` recipient token, as PennMUSH's unparse_dbref), and
      #                %# = the speaker. To split "You…" vs "Name…", strmatch(%1,%#) is true only
      #                for the speaker's own copy. FORMAT`<TYPE>` defaults are seeded by the
      #                Ancestor Player; absent it, the <default> literal is used.
      #   commas inside the <default> literal use [chr(44)] (NOT a literal `,`): @message is
      #   CB.RSArgs and splits its RHS on commas BEFORE evaluating each arg, and a backslash-escaped
      #   `\,` does not survive the $-command body parse + RSArgs split (it shifts the obj/attr arg,
      #   so FORMAT is never read). chr(44) emits the comma during per-arg evaluation, after the split.
      #   The recorded @scene/addpose line below is NOT RSArgs in the same way, so it still uses \,.
      #
      # Flow per hook (one physical line, `;`-separated):
      #   0. %q<words> is what was said after the speaker's SPEECHMOD (FUN`SPEECHMOD), as the built-in reads it.
      #   1. @include INC`CAPTURE`DECIDE: %q<will_capture>, <room has an active scene I am focused on, and I am
      #      approved> — computing %q<scene_id> and %q<room_id> along the way — and %q<poser_name>, the name the line goes
      #      out under: the poser's persona in that scene (+scene/as) when it is captured, else their name. The check is
      #      `strmatch(scenefocus(%#),scenewhere(loc(%#))) AND not(strmatch(scenewhere,#-1*)) AND
      #      FUN`IS`APPROVED(%#)` — a real, focused, in-room active scene (NOT just words(), which is
      #      truthy on "#-1 NOT FOUND"), posed by a character still approved RIGHT NOW. The approval
      #      term is what makes revocation take effect immediately: without it, a character approved
      #      when they joined would keep writing poses into the scene after losing the flag, since
      #      their focus and membership survive the revocation.
      #   2. Captured ⇒ record with @scene/addpose as type ic, and @include/args INC`CAPTURE`LINE with the
      #      line's parts by name: the line drawn by the speaker's FORMAT`<VERB> or else the type's FORMAT,
      #      under the pose's rule.
      #   3. Otherwise ⇒ @message/spoof the pose to the room exactly as before (so a pose outside any
      #      %q<hearers> is the room's contents, led by the location itself when that is a player or thing
      #      (PennMUSH's na_loc), so whoever carries the poser hears it.
      #      scene behaves like the un-hooked built-in -- the emit is never lost).
      # So a CAPTURED pose is framed (a rule naming the poser and the pose, one under it naming the scene, or a
      # scene tag); an uncaptured one is a plain pose. The rule must come AFTER addpose because it reads the new pose id.
      #
      # EVERY capture pattern carries BOTH inline flags, `(?is)`, and the `s` is not decoration.
      # $-commands are matched against the command line AFTER evaluation, so a multi-line pose --
      # `@emit one%rtwo`, or anything the portal's compose box sends, where a newline travels as %r --
      # reaches the matcher with a REAL line break in it. Without `s`, `.` does not cross that break,
      # `^@emit (.*)$` cannot match, and the override silently does not fire: the emit still reaches
      # the room (the built-in runs when no $-command matches) and is never recorded. The failure
      # looks like nothing at all, which is why it survived so long -- only multi-line poses go
      # missing from the archive, and only from the scene, never from the room.

      INC`CAPTURE`DECIDE: |-
        think setq(scene_id,scenewhere(setr(room_id,loc(%#))))[setq(will_capture,cand(not(strmatch(%q<scene_id>,#-1*)),strmatch(scenefocus(%#),%q<scene_id>),u(%!/FUN`IS`APPROVED,%#)))][setq(poser_name,if(%q<will_capture>,u(%!/FUN`POSER,%q<scene_id>,%#),name(%#)))][setq(hearers,if(hastype(%q<room_id>,ROOM),,%q<room_id>) [lcon(%q<room_id>)])]

      # A captured line as the room hears it, drawn once per hearer by FUN`POSE`DRAW: under a rule naming who
      # posed and the pose, over a rule naming the scene, or for a band, message or notice type as one line tagged
      # with the scene. A hearer whose type FORMAT draws nothing gets nothing, rule included. It runs AS the
      # Logger (@include locates its target as the executor), so it works for a remote poser too, and reads the
      # pose id off last(sceneposes()), so it MUST run after @scene/addpose. The hook passes it, by name
      # (@include/args):
      #   type    the pose type's key, upper case (IC, OOC, NARRATION)
      #   verb    POSE, SAY, SEMIPOSE, EMIT or OOC: which FORMAT`<VERB> on the speaker would apply
      #   words   what the speaker typed, the %0 a FORMAT`<VERB> is given
      #   line    the line as recorded, the %2 the type's FORMAT is given
      #   heard   what is sent when there is no format: line, or for OOC the line with its <OOC>
      #   hearers who hears it; self, when set, is what the speaker hears instead (SAY's "You say")
      #   scene   the scene, and room its room
      # A speaker's own FORMAT`<VERB> (on them, not inherited from the Ancestor Player) wins, as it does for
      # a line no scene records; the room then gets the rule as it is before the line, and the footer after it. Named arguments
      # belong to this one call, so nothing left over from the speaker's own code can leak in.
      INC`CAPTURE`LINE: |-
        think setq(pose_id,last(sceneposes(%<scene>))); @if hasattrval(%#,FORMAT`%<verb>)={@if u(%!/FUN`TYPE`FRAMED,%<type>)={@remit %<room>=u(%!/FUN`POSE`RULE,%<scene>,%q<pose_id>)}; @if strlen(%<self>)={@message/spoof %#=%<self>,%#/FORMAT`%<verb>,%<words>,##}; @message/spoof %<hearers>=%<heard>,%#/FORMAT`%<verb>,%<words>,##; @if u(%!/FUN`TYPE`FRAMED,%<type>)={@remit %<room>=u(%!/FUN`POSE`FOOTER,%<scene>,%q<pose_id>)}},{@if strlen(%<self>)={@message/spoof %#=%<self>,%!/FUN`POSE`DRAW,%<type>,%q<pose_id>,%<self>,%<scene>,##}; @message/spoof %<hearers>=%<heard>,%!/FUN`POSE`DRAW,%<type>,%q<pose_id>,%<line>,%<scene>,##}

      # Built-in POSE (MoreCommands.Pose) emits: "<name> <message>" to the room.
      CMD`CAPTURE`POSE:
        value: |-
          $(?is)^(pose |\:)(.*)$: think setq(words,u(%!/FUN`SPEECHMOD,%#,%2,:)); @include %!/INC`CAPTURE`DECIDE; @if %q<will_capture>={@scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,pose,,%q<poser_name> %q<words>; @include/args %!/INC`CAPTURE`LINE=type,IC,verb,POSE,self,,words,%q<words>,line,%q<poser_name> %q<words>,heard,%q<poser_name> %q<words>,hearers,%q<hearers>,scene,%q<scene_id>,room,%q<room_id>},{@message/spoof %q<hearers>=%q<poser_name> %q<words>,%#/FORMAT`POSE,%q<words>,##}
        flags: [REGEXP]

      # Built-in SAY (MoreCommands.Say) emits "You say, \"<msg>\"" to the speaker
      # and "<name> says, \"<msg>\"" to everyone else in the room (PennMUSH do_say, src/speech.c).
      # Unlike the other hooks, the <default> literal differs per recipient, so SAY sends two
      # @message/spoof calls: the first-person line to %#, the third-person line to the rest of
      # lcon() (the speaker is filtered out by dbref number, since lcon() may list objids).
      CMD`CAPTURE`SAY:
        value: |-
          $(?is)^(say |")(.*)$: think setq(words,u(%!/FUN`SPEECHMOD,%#,%2,")); @include %!/INC`CAPTURE`DECIDE; @if %q<will_capture>={@scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,say,,%q<poser_name> says\, "%q<words>"; @include/args %!/INC`CAPTURE`LINE=type,IC,verb,SAY,self,You say[chr(44)] "%q<words>",words,%q<words>,line,%q<poser_name> says[chr(44)] "%q<words>",heard,%q<poser_name> says[chr(44)] "%q<words>",hearers,[iter(%q<hearers>,if(strmatch(before(%i0,:),%#),,%i0))],scene,%q<scene_id>,room,%q<room_id>},{@message/spoof %#=You say[chr(44)] "%q<words>",%#/FORMAT`SAY,%q<words>,##; @message/spoof [iter(%q<hearers>,if(strmatch(before(%i0,:),%#),,%i0))]=%q<poser_name> says[chr(44)] "%q<words>",%#/FORMAT`SAY,%q<words>,##}
        flags: [REGEXP]

      # Built-in SEMIPOSE (MoreCommands.SemiPose) emits "<name><message>" (no space).
      CMD`CAPTURE`SEMI:
        value: |-
          $(?is)^(semipose |;)(.*)$: think setq(words,u(%!/FUN`SPEECHMOD,%#,%2,chr(59))); @include %!/INC`CAPTURE`DECIDE; @if %q<will_capture>={@scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,semipose,,%q<poser_name>%q<words>; @include/args %!/INC`CAPTURE`LINE=type,IC,verb,SEMIPOSE,self,,words,%q<words>,line,%q<poser_name>%q<words>,heard,%q<poser_name>%q<words>,hearers,%q<hearers>,scene,%q<scene_id>,room,%q<room_id>},{@message/spoof %q<hearers>=%q<poser_name>%q<words>,%#/FORMAT`SEMIPOSE,%q<words>,##}
        flags: [REGEXP]

      # Built-in @EMIT emits "<message>" verbatim (no name) to the room.
      CMD`CAPTURE`EMIT:
        value: |-
          $(?is)^@emit (.*)$: think setq(words,u(%!/FUN`SPEECHMOD,%#,%1,|)); @include %!/INC`CAPTURE`DECIDE; @if %q<will_capture>={@scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,emit,,%q<words>; @include/args %!/INC`CAPTURE`LINE=type,IC,verb,EMIT,self,,words,%q<words>,line,%q<words>,heard,%q<words>,hearers,%q<hearers>,scene,%q<scene_id>,room,%q<room_id>},{@message/spoof %q<hearers>=%q<words>,%#/FORMAT`EMIT,%q<words>,##}
        flags: [REGEXP]

      # ---- web compose ----------------------------------------------------------
      # +scene/<mode> <id>=<text> -- what the portal's live-scene compose box sends.
      #
      # The capture hooks above answer "which scene am I in?" from the room the poser is standing in,
      # which is the only question a MU* client can ask. The portal asks a different one: its compose
      # box sits on ONE scene's page, so the pose has to reach THAT scene whether or not the character
      # is standing in its room -- and before this existed, a pose typed there was emitted into
      # whatever room the character happened to be in and silently never recorded.
      #
      # So these take the id explicitly and record regardless of location. Four consequences,
      # each deliberate:
      #   * the atomic scenejoin operation accepts a new poser under the joining policy and cap,
      #     preserving existing owner, GM and participant roles. A refused join stops the pose;
      #   * the poser is FOCUSED on the scene they just posed into. Posing is the act that says "I am
      #     in this one" -- and without it a pose composed on a scene's page landed there while the
      #     character's focus stayed wherever it had been, so the very next line they typed in a
      #     client went to a different scene, or to none. Everything else about that page says they
      #     are in this scene; the focus has to agree. Harmless when they are elsewhere: a room pose
      #     is captured only when focus matches the scene of the room they are standing in, so a
      #     focus pointing at a remote scene simply captures nothing;
      #   * the room emit is CONDITIONAL on the poser actually being there. Recording from anywhere is
      #     the point; speaking into a room you are not standing in would put words in front of people
      #     you are not with;
      #   * they never call the built-in pose/say/semipose/@emit, because those are hooked above --
      #     delegating would record the pose a second time.
      #
      # The rendered line matches its hook exactly, framed by the same rule in the room,
      # so a pose composed on the web and one typed in a terminal are indistinguishable in the archive
      # and on screen. Note the two comma spellings, both required and
      # for different reasons: `\,` inside @scene/addpose's argument list, and `[chr(44)]` inside
      # @message's RHS, which is CB.RSArgs and splits on commas BEFORE evaluating each argument.
      #
      # The co-location test compares loc(%#) against scene(<id>,room) directly, which works because
      # scene(...,room) answers with an objid -- the same spelling loc() uses. It did not always: it
      # returned a bare dbref, so the comparison was quietly always false and the room emit never
      # fired for anyone.
      #
      # Reading the scene at all is gated by the same visibility rule the REST and hub surfaces use
      # (public, or the caller owns or belongs to it), because the existence guard goes through
      # scene(). That is what stops these verbs being a way to write into a private scene by guessing
      # an id -- and it costs the web nothing, since the compose box only exists on a page whose
      # scene the reader could already see.
      # Multi-line poses need nothing special here. The portal sends newlines as `%r`, which is
      # expanded before the $-command pattern is matched, and these patterns carry `(?is)` as the
      # capture hooks do -- so `(.*?)=(.*?)` matches a two-line pose and %2 arrives with real line
      # breaks in it.
      #
      # Whitespace inside %1 arrives intact for the same reason it has to be spelled out to get here:
      # the compose box sends every space run, indent and line break as %b / %t / %r, and a
      # substitution is expanded AFTER the parser has finished eating the whitespace it eats. Nothing
      # in the verbs may put a Trim() back in front of the content, on either side of the wire.
      #
      # Every web verb starts with INC`WEB`CHECK (approved, the scene exists and is running; its @asserts stop
      # the verb) and INC`WEB`ENTER (cast, focus and context, then %q<scene_id>, %q<room_id> and %q<poser_name>),
      # each given the scene by name.
      INC`WEB`CHECK: |-
        @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scene(%<scene>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %<scene>,warn); @assert strmatch(scene(%<scene>,status),active)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTRUNNING),warn)
      INC`WEB`ENTER: |-
        @assert not(strmatch(setr(join_result,scenejoin(%<scene>,%#)),#-1*))=@pemit %#=notice(SCENE,%q<join_result>,warn); @scene/focus %#=%<scene>; @context/push %#=scene_focus,[json(object,scene,%<scene>)]; think setq(scene_id,%<scene>)[setq(room_id,scene(%<scene>,room))][setq(poser_name,u(%!/FUN`POSER,%<scene>,%#))]
      CMD`WEB`EMIT:
        value: |-
          $(?is)^\+scene/em(?\:i(?\:t)?)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @include/args %!/INC`WEB`ENTER=scene,%1; @scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,emit,,%2; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,IC,verb,EMIT,self,,words,%2,line,%2,heard,%2,hearers,[lcon(%q<room_id>)],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      CMD`WEB`POSE:
        value: |-
          $(?is)^\+scene/pos(?\:e)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @include/args %!/INC`WEB`ENTER=scene,%1; @scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,pose,,%q<poser_name> %2; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,IC,verb,POSE,self,,words,%2,line,%q<poser_name> %2,heard,%q<poser_name> %2,hearers,[lcon(%q<room_id>)],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      CMD`WEB`SAY:
        value: |-
          $(?is)^\+scene/sa(?\:y)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @include/args %!/INC`WEB`ENTER=scene,%1; @scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,say,,%q<poser_name> says\, "%2"; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,IC,verb,SAY,self,You say[chr(44)] "%2",words,%2,line,%q<poser_name> says[chr(44)] "%2",heard,%q<poser_name> says[chr(44)] "%2",hearers,[iter(lcon(%q<room_id>),if(strmatch(before(%i0,:),%#),,%i0))],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      CMD`WEB`SEMIPOSE:
        value: |-
          $(?is)^\+scene/sem(?\:i(?\:p(?\:o(?\:s(?\:e)?)?)?)?)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @include/args %!/INC`WEB`ENTER=scene,%1; @scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,ic,semipose,,%q<poser_name>%2; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,IC,verb,SEMIPOSE,self,,words,%2,line,%q<poser_name>%2,heard,%q<poser_name>%2,hearers,[lcon(%q<room_id>)],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      # Out of character, into this scene. The room hears what the `ooc` command would have it hear
      # (`<OOC> Name: words`; a leading `:` poses and a leading `;` semiposes), and the scene records
      # the line less the marker as type and source `ooc`: TYPE`OOC`FORMAT puts the marker back for the
      # room and recall, and the portal draws the type as its band. No persona: out of character is the player speaking. As with `ooc`, a gagged player is
      # refused, so is a marker with nothing after it, and the room's Speech lock applies when the
      # speaker is standing in it. The `;` is spelled chr(59) because a bare one ends the command.
      CMD`WEB`OOC:
        value: |-
          $(?is)^\+scene/oo(?\:c)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @assert not(hasflag(%#,GAGGED))=@pemit %#=notice(SCENE,You cannot speak while gagged.,error); @assert cor(not(strmatch(loc(%#),scene(%1,room))),elock(scene(%1,room)/Speech,%#))=@pemit %#=notice(SCENE,You may not speak there!,error); @assert strlen(trim(switch(left(%2,1),:,delete(%2,0,1),chr(59),delete(%2,0,1),%2)))=@pemit %#=notice(SCENE,OOC: What do you want to say?,warn); @include/args %!/INC`WEB`ENTER=scene,%1; think setq(ooc_line,switch(left(%2,1),:,name(%#) [delete(%2,0,1)],chr(59),name(%#)[delete(%2,0,1)],name(%#): %2)); @scene/addpose %q<scene_id>=%#,,%q<room_id>,ooc,ooc,,%q<ooc_line>; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,OOC,verb,OOC,self,,words,%2,line,%q<ooc_line>,heard,<OOC> %q<ooc_line>,hearers,[lcon(%q<room_id>)],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      # Narration: the scene's world speaking rather than a character, recorded as the narration type. It is an
      # emit as the room hears it; the type's FORMAT draws it.
      CMD`WEB`NARRATE:
        value: |-
          $(?is)^\+scene/n(?\:a(?\:r(?\:r(?\:a(?\:t(?\:e)?)?)?)?)?)? (.*?)=(.*?)$: @include/args %!/INC`WEB`CHECK=scene,%1; @include/args %!/INC`WEB`ENTER=scene,%1; @scene/addpose %q<scene_id>=%#,[scenemember(%q<scene_id>,%#,showas)],%q<room_id>,narration,emit,,%2; @if strmatch(loc(%#),%q<room_id>)={@include/args %!/INC`CAPTURE`LINE=type,NARRATION,verb,NARRATE,self,,words,%2,line,%2,heard,%2,hearers,[lcon(%q<room_id>)],scene,%q<scene_id>,room,%q<room_id>}
        flags: [REGEXP]

      # ---- create / lifecycle ---------------------------------------------------
      # NOTE: capture the new scene id into %q<scene_id> with @assert (it both sets the register and
      # aborts cleanly if creation fails — the id is truthy), then drive the writes off %q<scene_id>.
      # IMPORTANT: the body is one PHYSICAL line with `;` separators. q-registers are shared
      # across `;`-separated commands but NOT across newline-separated ones in a $-command
      # body. The scene a player is in is scenefocus(); nothing is stored on the player.
      CMD`CREATE:
        value: |-
          $(?is)^\+scene/cr(?\:e(?\:a(?\:t(?\:e)?)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert strlen(setr(create_title,trim(before(%1,chr(61)))))=@pemit %#=notice(SCENE,get(%!/DATA`USAGE`CREATE),warn); @assert not(strmatch(setr(scene_id,scenecreate(%L,%#,%q<create_title>,after(%1,chr(61)))),#-1*))=@pemit %#=notice(SCENE,%q<scene_id>,warn); @scene/member %q<scene_id>/owner=%#; @scene/focus %#=%q<scene_id>; @context/push %#=scene_focus,[json(object,scene,%q<scene_id>)]; @scene/set %q<scene_id>/status=get(%!/DATA`CONFIG`DEFAULT-STATUS); @trigger %!/HERE`SYNC=scene(%q<scene_id>,room); @pemit %#=notice(SCENE,Scene %q<scene_id> created and focused \(status: [get(%!/DATA`CONFIG`DEFAULT-STATUS)]\).,ok)
        flags: [REGEXP]

      # NOTE: verb bodies are written as ONE physical line with `;` separators. In a
      # multi-line ($-command) attribute the FIRST command after the `$pattern:` header does
      # not parse cleanly (the following line's leading `@scene…` leaks into it) and
      # q-registers do not cross newlines — the `;` form is robust on both counts.
      # +scene/start starts a scene or resumes a paused one. A finished or cancelled scene stays as it is, and
      # one already running says so rather than starting again. A roomless scene (one made by
      # +scene/schedule) is bound to the room the starter is in; one with a room keeps it.
      CMD`START:
        value: |-
          $(?is)^\+scene/st(?\:a(?\:r(?\:t)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert not(match(active finished cancelled,setr(scene_status,scene(%q<scene_id>,status))))=@pemit %#=notice(SCENE,u(%!/FUN`START`DENY,%q<scene_id>,%q<scene_status>),warn); @if not(strlen(scene(%q<scene_id>,room)))={@scene/set %q<scene_id>/room=%L}; @scene/set %q<scene_id>/status=active; @trigger %!/HERE`SYNC=scene(%q<scene_id>,room); @pemit %#=notice(SCENE,Scene %q<scene_id> is now active.,ok)
        flags: [REGEXP]

      # +scene/start <id> is the same by id, without focusing the scene: how the portal resumes one.
      CMD`START`ID:
        value: |-
          $(?is)^\+scene/st(?\:a(?\:r(?\:t)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert u(%!/FUN`OWNS,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert not(match(active finished cancelled,setr(scene_status,scene(%1,status))))=@pemit %#=notice(SCENE,u(%!/FUN`START`DENY,%1,%q<scene_status>),warn); @if not(strlen(scene(%1,room)))={@scene/set %1/room=%L}; @scene/set %1/status=active; @trigger %!/HERE`SYNC=scene(%1,room); @pemit %#=notice(SCENE,Scene %1 is now active.,ok)
        flags: [REGEXP]
      # Why scene %0, whose status is %1, can't be started, paused or finished.
      FUN`START`DENY: |-
        switch(%1,active,Scene %0 is already running.,cancelled,Scene %0 was cancelled and can't be started again.,Scene %0 is finished.)
      FUN`PAUSE`DENY: |-
        switch(%1,paused,Scene %0 is already paused.,finished,Scene %0 is finished.,cancelled,Scene %0 was cancelled.,Scene %0 has not started\, so there is nothing to pause.)
      FUN`FINISH`DENY: |-
        switch(%1,finished,Scene %0 is already finished.,Scene %0 was cancelled\, so there is nothing to finish.)

      # A paused scene stops recording and leaves the live list for the schedule, where it stays until
      # +scene/start resumes it. Pausing without a time clears any time the scene had, so the schedule
      # never shows a stale one; pausing with one (+scene/pause [<id>]=<when>) sets it. Only a running scene
      # can be paused: a finished one would come back onto the schedule, and pausing a paused one again
      # would only report success twice.
      CMD`PAUSE:
        value: |-
          $(?is)^\+scene/pa(?\:u(?\:s(?\:e)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert strmatch(setr(scene_status,scene(%q<scene_id>,status)),active)=@pemit %#=notice(SCENE,u(%!/FUN`PAUSE`DENY,%q<scene_id>,%q<scene_status>),warn); @scene/set %q<scene_id>/status=paused; @trigger %!/HERE`SYNC=scene(%q<scene_id>,room); @scene/set %q<scene_id>/scheduledfor=; @pemit %#=notice(SCENE,Scene %q<scene_id> paused. It is on the schedule until +scene/start resumes it.,ok)
        flags: [REGEXP]

      # +scene/pause <id>, +scene/pause <id>=<when> and +scene/pause =<when> (the focused scene). One
      # pattern for all three: $+scene/pause *=* would also match here, and both would run.
      CMD`PAUSE`ID:
        value: |-
          $(?is)^\+scene/pa(?\:u(?\:s(?\:e)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(trim(before(%1,chr(61))),scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert strmatch(setr(scene_status,scene(%q<scene_id>,status)),active)=@pemit %#=notice(SCENE,u(%!/FUN`PAUSE`DENY,%q<scene_id>,%q<scene_status>),warn); think setq(pause_ref,secs(f),pause_when,trim(after(%1,chr(61))))[setq(pause_at,if(strlen(%q<pause_when>),u(%!/FUN`SCHEDULE`WHEN,%q<pause_when>,firstof(u(%!/FUN`ZONE,%#),UTC),%q<pause_ref>)))]; @assert cor(not(strlen(%q<pause_when>)),isint(%q<pause_at>))=@pemit %#=notice(SCENE,[get(%!/DATA`DENY`BADTIME)] %q<pause_at>,warn); @assert cor(not(strlen(%q<pause_when>)),gt(%q<pause_at>,mul(%q<pause_ref>,1000)))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`PASTTIME),warn); @scene/set %q<scene_id>/status=paused; @trigger %!/HERE`SYNC=scene(%q<scene_id>,room); @scene/set %q<scene_id>/scheduledfor=%q<pause_at>; @pemit %#=notice(SCENE,Scene %q<scene_id> paused[if(strlen(%q<pause_at>),%b[chr(40)]rescheduled for [u(%!/FUN`SCHEDULE`DISPLAY,%q<pause_when>,%q<pause_at>,firstof(u(%!/FUN`ZONE,%#),UTC),%q<pause_ref>)][chr(41)])]. It is on the schedule until +scene/start %q<scene_id> resumes it.,ok)
        flags: [REGEXP]

      CMD`FINISH:
        value: |-
          $(?is)^\+scene/f(?\:i(?\:n(?\:i(?\:s(?\:h)?)?)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`CAN`CLOSE,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTCLOSER),error); @assert not(match(finished cancelled,setr(scene_status,scene(%q<scene_id>,status))))=@pemit %#=notice(SCENE,u(%!/FUN`FINISH`DENY,%q<scene_id>,%q<scene_status>),warn); @scene/set %q<scene_id>/status=finished; @trigger %!/HERE`SYNC=scene(%q<scene_id>,room); @scene/focus %#=; @context/drop %#=scene_focus; @pemit %#=notice(SCENE,Scene %q<scene_id> finished.,ok)
        flags: [REGEXP]

      # +scene/finish <id> closes a scene by id, without joining it: how staff close one they are not in.
      # scene() hides a private scene from a non-member, so a scene.close holder gets past that guard and
      # only a scene that does not exist stops them; to anyone else a hidden scene still reads as missing.
      CMD`FINISH`ID:
        value: |-
          $(?is)^\+scene/f(?\:i(?\:n(?\:i(?\:s(?\:h)?)?)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert cor(not(strmatch(scene(%1,status),#-1*)),permission(%#,scene.close))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert not(strmatch(scene(%1,status),#-1 NOT FOUND))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert u(%!/FUN`CAN`CLOSE,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTCLOSER),error); @assert not(match(finished cancelled,setr(scene_status,scene(%1,status))))=@pemit %#=notice(SCENE,u(%!/FUN`FINISH`DENY,%1,%q<scene_status>),warn); @scene/set %1/status=finished; @trigger %!/HERE`SYNC=scene(%1,room); @if strmatch(scenefocus(%#),%1)={@scene/focus %#=; @context/drop %#=scene_focus}; @pemit %#=notice(SCENE,Scene %1 finished.,ok)
        flags: [REGEXP]

      # ---- membership / RSVP / focus --------------------------------------------
      # scenejoin preserves existing owner/GM/participant roles and checks admission atomically.
      # A pending invitation permits accepting a private scene before scene() permits reading it:
      # join/activate therefore ask scenejoin first, and read access follows successful membership.
      # Joining controls are scene metadata, independent of pose tags and public visibility.
      FUN`PARTICIPATION`TAGS: |-
        %[[firstof(scene(%0,joinpolicy),open)]%][if(gt(firstof(scene(%0,playercap),0),0),%b%[cap [scene(%0,playercap)]%])]
      CMD`POLICY:
        value: |-
          $(?is)^\+scene/pol(?\:i(?\:c(?\:y)?)?)? (?\:(\d+)=)?(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert match(open invite-only limited,setr(policy,lcstr(trim(%2))))=@pemit %#=notice(SCENE,Use +scene/policy [<id>=]open|invite-only|limited.,warn); @assert cor(not(strmatch(%q<policy>,limited)),gt(firstof(scene(%q<scene_id>,playercap),0),0))=@pemit %#=notice(SCENE,Set a positive +scene/limit first.,warn); @assert not(strmatch(setr(policy_result,sceneset(%q<scene_id>,joinpolicy,%q<policy>)),#-1*))=@pemit %#=notice(SCENE,No such scene or invalid joining policy.,warn); @pemit %#=notice(SCENE,Joining policy set to %q<policy>.,ok)
        flags: [REGEXP]
      CMD`LIMIT:
        value: |-
          $(?is)^\+scene/lim(?\:i(?\:t)?)? (?\:(\d+)=)?(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert cand(isint(%2),gte(%2,0),lte(%2,10000))=@pemit %#=notice(SCENE,Use +scene/limit [<id>=]0-10000. Zero clears the cap.,warn); @assert cor(gt(%2,0),not(strmatch(scene(%q<scene_id>,joinpolicy),limited)))=@pemit %#=notice(SCENE,Change limited policy before clearing its cap.,warn); @assert not(strmatch(setr(limit_result,sceneset(%q<scene_id>,playercap,%2)),#-1*))=@pemit %#=notice(SCENE,The cap cannot be below the number of participating players.,warn); @pemit %#=notice(SCENE,Player cap set to %2.,ok)
        flags: [REGEXP]
      CMD`INVITE:
        value: |-
          $(?is)^\+scene/inv(?\:i(?\:t(?\:e)?)?)? (\d+)=(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert u(%!/FUN`OWNS,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert isdbref(setr(invitee,pmatch(%2)))=@pemit %#=notice(SCENE,No such player.,warn); @assert u(%!/FUN`IS`APPROVED,%q<invitee>)=@pemit %#=notice(SCENE,That player is not approved to participate in scenes.,warn); @assert not(match(owner gm participant,scenemember(%1,%q<invitee>,role)))=@pemit %#=notice(SCENE,That player already participates.,warn); @assert not(strmatch(setr(invite_result,sceneinvite(%1,%q<invitee>)),#-1*))=@pemit %#=notice(SCENE,%q<invite_result>,warn); @pemit %#=notice(SCENE,Invitation saved for %2. They may +scene/join %1 if a seat is available.,ok)
        flags: [REGEXP]

      CMD`JOIN:
        value: |-
          $(?is)^\+scene/j(?\:o(?\:i(?\:n)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(join_result,scenejoin(%1,%#)),#-1*))=@pemit %#=notice(SCENE,switch(%q<join_result>,#-1 NOT FOUND,No such scene: %1,%q<join_result>),warn); @scene/focus %#=%1; @context/push %#=scene_focus,[json(object,scene,%1)]; @pemit %#=u(%!/FUN`FILTER,JOIN,notice(SCENE,Joined and focused on scene %1.,ok),%1,%#)
        flags: [REGEXP]

      # NOTE: one physical line (q-registers cross `;` but not newlines in a $-command body).
      # Capture the focused scene id into %q<scene_id> BEFORE @scene/focus clears it (@assert sets the
      # register and no-ops cleanly when not focused), then drive the writes off %q<scene_id>.
      CMD`LEAVE:
        value: |-
          $(?is)^\+scene/le(?\:a(?\:v(?\:e)?)?)?$: @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @scene/focus %#=; @context/drop %#=scene_focus; @if not(words(sceneposes(%q<scene_id>,%#)))={@scene/unmember %q<scene_id>=%#}; @pemit %#=notice(SCENE,Left the scene.,ok)
        flags: [REGEXP]

      # +scene/tag and its common name, +scene/rsvp.
      CMD`TAG:
        value: |-
          $(?is)^\+scene/(?\:ta(?\:g)?|rs(?\:v(?\:p)?)?) (.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert not(match(owner gm participant invited,scenemember(%1,%#,role)))=@pemit %#=notice(SCENE,You are already in scene %1 or have an invitation. Use +scene/join %1.,warn); @scene/member %1/attending=%#; @pemit %#=notice(SCENE,RSVP'd to scene %1.,ok)
        flags: [REGEXP]

      CMD`UNTAG:
        value: |-
          $(?is)^\+scene/(?\:unt(?\:a(?\:g)?)?|unr(?\:s(?\:v(?\:p)?)?)?) (.+)$: @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert strmatch(scenemember(%1,%#,role),attending)=@pemit %#=notice(SCENE,You have not RSVP'd to scene %1.,warn); @scene/unmember %1=%#; @pemit %#=notice(SCENE,Removed RSVP from scene %1.,ok)
        flags: [REGEXP]

      # +scene/as <name> poses under another name in the focused scene; bare, or the player's own name, goes
      # back to it. A comma or an = would split the fields of @scene/addpose and @scene/showas.
      CMD`AS:
        value: |-
          $(?is)^\+scene/as(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); think setq(pose_as,trim(%1)); @assert not(cor(pos(chr(61),%q<pose_as>),pos(chr(44),%q<pose_as>)))=@pemit %#=notice(SCENE,A name to pose under can't have a comma or an = in it.,warn); think setq(pose_as,if(strmatch(%q<pose_as>,name(%#)),,%q<pose_as>)); @scene/showas %q<scene_id>/%#=%q<pose_as>; @pemit %#=notice(SCENE,if(strlen(%q<pose_as>),Future poses show as: %q<pose_as>,Future poses show under your own name.),ok)
        flags: [REGEXP]

      # ---- edit your own poses --------------------------------------------------
      # <pose>=<old>^^^<new>. @scene/editpose is the wizard primitive and edits any pose for any editor, so the
      # author check is here, as for undo: the pose's author or a scene manager (FUN`CAN`EDIT). scenepose() with an
      # empty scene finds the pose wherever it is. The pose id goes into %q<pose_id> and the new content into
      # %q<edit_new> in a command of
      # its own (a nested function reference to the verb's arguments inside an @scene arg does not resolve
      # reliably), then the edit runs off them. The = is found with chr(61) because a bare one in an @assert's
      # condition would end the condition there.
      # 1 when %0 may change pose %1: its author, or a scene manager.
      FUN`CAN`EDIT: |-
        cor(strmatch(scenepose(,%1,author),num(%0)),u(%!/FUN`MANAGES,%0))
      CMD`EDIT:
        value: |-
          $(?is)^\+scene/ed(?\:i(?\:t)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert cand(pos(chr(61),%1),strlen(setr(pose_id,trim(before(%1,chr(61))))),pos(^^^,after(%1,chr(61))),strlen(setr(edit_old,before(after(%1,chr(61)),^^^))))=@pemit %#=notice(SCENE,get(%!/DATA`USAGE`EDIT),warn); @assert not(strmatch(scenepose(,%q<pose_id>,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %q<pose_id>,warn); @assert u(%!/FUN`CAN`EDIT,%#,%q<pose_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTPOSER),error); @assert pos(%q<edit_old>,scenepose(,%q<pose_id>,content))=@pemit %#=notice(SCENE,Pose %q<pose_id> has no "%q<edit_old>" in it.,warn); think setq(edit_new,edit(scenepose(,%q<pose_id>,content),%q<edit_old>,after(after(%1,chr(61)),^^^))); @assert not(u(%!/FUN`BARE,%q<pose_id>,%q<edit_new>))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`EMPTY),warn); @scene/editpose %q<pose_id>=%#,%q<edit_new>; @pemit %#=notice(SCENE,Pose %q<pose_id> edited.,ok)
        flags: [REGEXP]

      # The whole text at once: the portal's Edit on a pose sends this. Its author or a scene manager, as for CMD`EDIT. The
      # player's command line is evaluated before it is matched, as the player, so %1 is already the text: the
      # composer's %r and %b are its line breaks and spaces, and any function in it ran with the player's own
      # powers, as it would in their say or pose, never the logger's. Nothing here evaluates it again, or a
      # decompose()d \[ that the first pass left as a [ would run as a function. @scene/editpose takes %1 as it
      # is, commas and all (it splits off one field); a substitution is not parsed again.
      CMD`REWRITE:
        value: |-
          $(?is)^\+scene/rew(?\:r(?\:i(?\:t(?\:e)?)?)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert cand(pos(chr(61),%1),strlen(setr(pose_id,trim(before(%1,chr(61))))))=@pemit %#=notice(SCENE,get(%!/DATA`USAGE`REWRITE),warn); @assert not(strmatch(scenepose(,%q<pose_id>,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %q<pose_id>,warn); @assert u(%!/FUN`CAN`EDIT,%#,%q<pose_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTPOSER),error); @assert not(u(%!/FUN`BARE,%q<pose_id>,setr(edit_new,after(%1,chr(61)))))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`EMPTY),warn); @scene/editpose %q<pose_id>=%#,%q<edit_new>; @pemit %#=notice(SCENE,Pose %q<pose_id> rewritten.,ok)
        flags: [REGEXP]

      # Undo, redo and delete check the pose exists and is the player's (a scene manager may act on anyone's), then
      # call the function, whose answer is the pose id or why it could not: @scene/undo tells only the Logger.
      CMD`UNDO:
        value: |-
          $(?is)^\+scene/und(?\:o)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %1,warn); @assert u(%!/FUN`CAN`EDIT,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTPOSER),error); @pemit %#=if(isint(setr(pose_result,sceneundo(%1))),notice(SCENE,Pose %1 undone.,ok),notice(SCENE,%q<pose_result>,warn))
        flags: [REGEXP]

      CMD`REDO:
        value: |-
          $(?is)^\+scene/red(?\:o)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %1,warn); @assert u(%!/FUN`CAN`EDIT,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTPOSER),error); @pemit %#=if(isint(setr(pose_result,sceneredo(%1))),notice(SCENE,Pose %1 redone.,ok),notice(SCENE,%q<pose_result>,warn))
        flags: [REGEXP]

      CMD`DELETE:
        value: |-
          $(?is)^\+scene/del(?\:e(?\:t(?\:e)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=notice(SCENE,No such pose: %1,warn); @assert u(%!/FUN`CAN`EDIT,%#,%1)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTPOSER),error); @pemit %#=if(isint(setr(pose_result,scenedelpose(%1))),notice(SCENE,Pose %1 deleted.,ok),notice(SCENE,%q<pose_result>,warn))
        flags: [REGEXP]

      # The pose must be in the focused scene: a move reorders whichever scene the pose is in, which is
      # not necessarily the one the owner check was about.
      CMD`MOVE:
        value: |-
          $(?is)^\+scene/mo(?\:v(?\:e)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,scenefocus(%#)),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @assert strmatch(scenepose(%q<scene_id>,%1,id),%1)=@pemit %#=notice(SCENE,No pose %1 in scene %q<scene_id>.,warn); @pemit %#=if(isint(setr(pose_result,scenemovepose(%1,%2))),notice(SCENE,Pose %1 moved.,ok),notice(SCENE,%q<pose_result>,warn))
        flags: [REGEXP]

      # ---- visibility -----------------------------------------------------------
      # +scene/public [<id>] and +scene/private [<id>]: the focused scene, or the one named.
      CMD`PRIVACY:
        value: |-
          $(?is)^\+scene/(pu(?\:b(?\:l(?\:i(?\:c)?)?)?)?|pr(?\:i(?\:v(?\:a(?\:t(?\:e)?)?)?)?)?)(?\: +(\d+))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%2,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @scene/set %q<scene_id>/public=strmatch(%1,pu*); @pemit %#=notice(SCENE,Scene %q<scene_id> is now [if(strmatch(%1,pu*),public,private)].,ok)
        flags: [REGEXP]

      # ---- viewing --------------------------------------------------------------
      # The Players table: what each member is to the scene, who they are, how much they have posed.
      # Name carries the persona when there is one, which is where the separate Cast line of personas
      # went: one reading now gives both the character and the name they answer to. Every table in this
      # package is a datacolumns(), one iter() per column, joined with %r and split on a newline
      # (FUN`TABLE`OPTS), so a title or persona holding a | stays one cell; no width is given, so each
      # reader gets it at their own and the portal draws a table.
      FUN`CAST`TABLE: |-
        datacolumns(u(%!/FUN`TABLE`OPTS,1|3,|12,1|1|2,|1),tone(strong,Status)%r[iter(%1,capstr(scenemember(%0,%i0,role)),,%r)],tone(strong,Name)%r[iter(%1,u(%!/FUN`CAST`NAME,%0,%i0),,%r)],>[tone(strong,Poses)]%r[iter(%1,words(sceneposes(%0,%i0)),,%r)])
      FUN`CAST`NAME: |-
        switch(setr(cast_as,scenemember(%0,%1,showas)),,name(%1),name(%1) as [edit(%q<cast_as>,%r,%b)])
      # Every screen is a box() with no sides, corners or tees: a titled line across the top, the
      # dividers and bottom line across the whole width, and nothing beside the text, so a pitch or a
      # pose copied from a terminal carries no |. The portal draws its usual card.
      FUN`FRAME: |-
        json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
      # The options every table here shares: %0 the nowrap columns, %1 the least widths, %2 the priorities,
      # %3 the shares of spare width (the column that takes it, so the table spans the screen), each
      # written split by |. The delimiter is a newline, and these lists split on it like the cells do.
      # No heading rule: it would span only the table, not the screen, so headings are bold instead.
      FUN`TABLE`OPTS: |-
        json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,edit(%0,|,%r)),min,json(string,edit(%1,|,%r)),priority,json(string,edit(%2,|,%r)),grow,json(string,edit(%3,|,%r)))


      # sceneposes() returns a SPACE-separated id list, so iter() must use the default
      # space input delimiter (an `@` input delim collapsed the whole list into one bogus
      # id → #-1). %r is the output separator (one pose content per line).
      #
      # `+scene/recall <n>` asks for a count; bare `+scene/recall` asks for "enough to see where we are",
      # which is a function of how many people are posing: one round of the room is
      # words(scenemembers()), and DATA`CONFIG`RECALL-ROUNDS rounds of it is what someone who just walked in
      # needs. `+scene/recall <id>=[<n>]` is the same for a scene the reader is not focused on, and
      # `+scene/log [<id>]` reads all of it. Every one goes through INC`RECALL so they cannot render
      # differently -- each verb passes it scene and count (none for the whole log) by name with
      # @include/args. scene() and sceneposes() answer as the reader (%#), so a private scene reads
      # as missing to anyone outside it.
      #
      # The guard is what makes bare recall safe: sceneposes() answers "#-1 NOT FOUND" for a scene
      # that does not exist, and an unfocused player's scenefocus() IS that string, so without it
      # the verb printed the sentinel back at them.

      # One entry per pose, drawn as it is live (FUN`POSE`DRAW): a rule naming who posed and the pose's id, the
      # pose as its type's FORMAT draws it, with the stored markup, so colour survives, then a rule naming the
      # scene. A band, message or notice type is one line with no rule.
      # Recall used to print bare content lines, which ran together into an undifferentiated block --
      # an @emit carries no name of its own, a multi-line pose reads as several separate ones, and
      # there was no id on screen to hand to +scene/edit or +scene/undo.
      #
      # Attribution comes off the POSE, not off current membership: showas is recorded at write time,
      # so a log read back later shows the name each pose actually went out under rather than whatever
      # persona its author happens to wear now. firstof() falls through to the author's name for a
      # pose written without one.
      #
      # A pose whose type the reader hides in %<context> (FUN`HIDDEN: playing for recall, reading for the log) is left out and counted, and a note under the
      # recall says how many; one its FORMAT draws as nothing is left out silently, as it is live.
      # The rule has no width, so it is drawn at the reader's own.
      INC`RECALL: |-
        think setq(recall_hidden,u(%!/FUN`HIDDEN,%#,%<context>))[setq(recall_folded,0)][setq(recall_out,)][null(iter(sceneposes(%<scene>,,%<count>),if(member(%q<recall_hidden>,setr(recall_type,firstof(scenepose(%<scene>,%iL,type),ic))),setq(recall_folded,inc(%q<recall_folded>)),if(strlen(setr(recall_line,u(%!/FUN`POSE`DRAW,%q<recall_type>,%iL,scenepose(%<scene>,%iL,content),%<scene>,%#))),setq(recall_out,%q<recall_out>[if(strlen(%q<recall_out>),%r)]%q<recall_line>)))))]; @pemit %#=%q<recall_out>; @if %q<recall_folded>={@pemit %#=notice(SCENE,%q<recall_folded> [if(eq(%q<recall_folded>,1),line,lines)] of [itemize(%q<recall_hidden>)] hidden. +scene/show <type>=%<context> shows them.)}
      # The count is validated here rather than left to sceneposes(), which rejects anything below 1
      # with a sentinel this verb would then iterate the WORDS of -- one bogus pose lookup per word,
      # printed at the player. `+scene/recall 0` failed differently and just as badly: "0" is falsy,
      # so the bare @assert broke with no message at all, which is indistinguishable from a command
      # that does not exist. isint() covers the non-numeric spelling, gt() the zero and negative ones.
      DATA`DENY`BADCOUNT: |-
        How many poses? Give a whole number of 1 or more, or just +scene/recall for the last few.
      CMD`RECALL:
        value: |-
          $(?is)^\+scene/rec(?\:a(?\:l(?\:l)?)?)?(?\: +(.*))?$: think setq(recall_named,t(pos(chr(61),%1)))[setq(scene_id,if(cand(%q<recall_named>,strlen(setr(recall_scene,trim(before(%1,chr(61)))))),%q<recall_scene>,scenefocus(%#)))][setq(recall_count,trim(if(%q<recall_named>,after(%1,chr(61)),%1)))]; @assert not(strmatch(%q<scene_id>,#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert cor(not(strlen(%q<recall_count>)),cand(isint(%q<recall_count>),gt(%q<recall_count>,0)))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`BADCOUNT),warn); @assert words(sceneposes(%q<scene_id>))=@pemit %#=notice(SCENE,Scene %q<scene_id> has no poses yet.); @include/args %!/INC`RECALL=scene,%q<scene_id>,context,playing,count,firstof(%q<recall_count>,max(1,mul(get(%!/DATA`CONFIG`RECALL-ROUNDS),words(scenemembers(%q<scene_id>)))))
        flags: [REGEXP]
      # The whole log of the focused scene, or of the one named, under a rule with its title and a line of its details,
      # through the LOG`HEAD filters.
      CMD`LOG:
        value: |-

format: 1.2
package: scene
version: 1.5.0
authors: [SharpMUSH]
description: "Scene Logger: pose/say/semipose capture into the Scene System, plus the +scene/* player verbs. Ships the game policy the C# engine deliberately omits, including who may be associated with a scene."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [scene, rp, logging, capture, hooks]
requires_server: ">=0.1"

# +help carries the topics below. The dependency is what makes {{plus-help/librarian}} a legal
# attach target, and it is what makes uninstalling scene take its help registration with it.
depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

# Staff finish a scene that is not theirs with the scene.close permission. The package defines it;
# a game hands it out by allowing it on a role (@role/allow helper=scene.close) or a player
# (@permission/allow <player>=scene.close).
categories:
  permissions:
    - name: Staff
      description: Permissions for the people who help run the game.
permissions:
  - name: scene.close
    category: Staff
    description: Finish any scene, not only your own.

# Create mode: a single owned WIZARD thing carries the capture hooks and the
# +scene/* verbs. It MUST be WIZARD — it is the @hook/override target, runs the
# wizard-only @scene / @hook commands, and AINSTALL/STARTUP run as this object
# (so %! / me = this object and self-execution of the wizard-locked @hook works).
#
# AINSTALL runs once after first install; STARTUP runs on every boot. Both
# (re-)establish the three OVERRIDE hooks idempotently — immediate on install,
# re-set on each boot (the hook registry is rebuilt from softcode policy).
#
# Capture is one of two pose-recording paths. An @hook/override on POSE/SAY/SEMIPOSE/@EMIT
# reproduces the built-in room emit EXACTLY, then records the pose via the
# @scene/addpose COMMAND -- that is the path a MU* client takes, and it records only
# where the poser is standing. The other is the +scene/<mode> <id>=<text> verbs below,
# which the web portal's live-scene compose box sends: they name the scene instead of
# inferring it from the room. Reads use the
# scene… functions; all data-writes use @scene/* commands (never side-effect fns).
#
# Attribute organization follows the project FUN`/CMD`/DATA`/INCLUDE` tree
# convention (see the common-functions and http-handler packages):
#   DATA`*     — config/constant knobs (reads, replaces a SceneOptions config)
#   FUN`*      — pure reads / guards (called via u())
#   CMD`*      — player verbs + capture $-commands (writes go through @scene/*)
#   INCLUDE`*  — shared command tails composed via @include (keep attrs small)
objects:
  - ref: logger
    type: thing
    name: Scene Logger
    flags: [WIZARD]
    attributes:
      # ---- policy knobs (read by the verbs; replaces a SceneOptions config) ----
      DATA`CAPTURE: |-
        1
      # `active` so +scene/create yields an immediately-capturing scene — pose/say/@emit are recorded
      # right after creation, with no separate +scene/start. Set this to `new` (or `scheduled`) instead
      # if you want creation to STAGE a scene that only begins logging after an explicit +scene/start.
      DATA`DEFAULT_STATUS: |-
        active

      # ---- owner / wizard guard -------------------------------------------------
      FUN`OWNS: |-
        or(orflags(%0,Wz),strmatch(scene(%1,owner),%0))
      # Finishing is the one owner verb staff may need on someone else's scene: the scene.close
      # permission this package defines (see permissions: above), allowed on a role such as helper.
      FUN`CAN`CLOSE: |-
        or(u(%!/FUN`OWNS,%0,%1),permission(%0,scene.close))

      # ---- approval guard -------------------------------------------------------
      # The ONE place +scene asks "may this thing be ASSOCIATED with a scene?". Two halves:
      #   • it must be a CHARACTER — a scene associates players, not things or rooms; and
      #   • it must be APPROVED — isapproved() is the engine predicate, "royalty or above,
      #     or holding the approved role", and it is false for a guest whatever else is set.
      # The engine ships that rule and no policy for what earns the role; a game decides that
      # and assigns it itself. A game that wants a DIFFERENT bar edits this one attribute —
      # nothing else in the package tests the role, and the engine and the verbs cannot drift
      # because both sides run the same isapproved() code.
      #
      # Association is the line, not visibility: viewing a schedule or a scene's information is
      # open to any character (see CMD`BROWSE / OLD / UPCOMING / SHOW / WHO / RECALL / POT, none
      # of which include this guard), and leaving is always allowed (CMD`LEAVE / UNTAG /
      # DEACTIVATE). Joining, owning, administering and posing into a scene all require approval.
      #
      # The guard is written INLINE at the head of each gated verb, as a bare @assert — NOT factored into
      # an INC` attribute and @included. A single-target @include runs its body as its own command list and
      # the list boundary CONTAINS the break, so an @assert inside an @include emits its message and then
      # lets the caller carry straight on to the write it was supposed to prevent. (Proven: routed through
      # an @include, +scene/join printed the refusal AND still created the membership edge.) The one-line
      # @assert keeps the refusal text in one place via DATA`DENY_APPROVAL — get() reads it without
      # evaluating it — while keeping the break where it has to be, in the verb's own list.
      FUN`IS`APPROVED: |-
        and(hastype(%0,PLAYER),isapproved(%0))
      DATA`DENY_APPROVAL: |-
        You are not approved to take part in scenes. You can still browse the schedule with +scene and +scene/upcoming, and read any scene with +scene <id>.

      # ---- focus / ownership guards ---------------------------------------------
      # scenefocus() answers "#-1 NOT FOUND" for anyone who has not joined a scene, and that string is
      # non-empty and truthy — so every verb that read it and acted was acting on a scene that does not
      # exist. The two arms failed differently and both were wrong. A wizard, whom FUN`OWNS deliberately
      # treats as owning every scene, sailed through and was told "Pitch set for scene #-1 NOT FOUND."
      # while nothing was written. Everyone else failed a bare @assert carrying no message, so the verb
      # produced no output at all — indistinguishable from a command that does not exist.
      #
      # Written inline at each verb, as bare @asserts, for the reason spelled out above DATA`DENY_APPROVAL:
      # an @assert inside an @include emits its message and then lets the caller continue anyway.
      DATA`DENY_NO_FOCUS: |-
        You are not focused on a scene. Join one with +scene/join <id>, or see what is running with +scene.
      # The portal's compose box names its scene (+scene/pose <id>=…), so it is refused here rather than by
      # the room capture, which already only finds a running scene.
      DATA`DENY_NOT_RUNNING: |-
        That scene is not running, so nothing is recorded into it. Its owner resumes it with +scene/start.
      DATA`DENY_NOT_OWNER: |-
        That scene is not yours to change. Its owner or a wizard can do it.
      DATA`DENY_NOT_CLOSER: |-
        That scene is not yours to finish. Its owner, a wizard, or anyone holding the scene.close permission can.
      DATA`DENY_NOT_POSER: |-
        That pose is not yours. Only its author or a wizard can change it.
      # +scene/edit and +scene/rewrite refuse to leave a pose with nothing but its poser's name; deleting one
      # is +scene/delete.
      DATA`DENY_EMPTY: |-
        A pose can't be left empty. Use +scene/delete <pose> to remove it.
      # The two ways a time given to +scene/schedule, /reschedule or /pause is refused (FUN`SCHED_WHEN).
      DATA`DENY_BAD_TIME: |-
        I can't read that as a time. Give a date and time, such as 2026-12-31 20:00, or a time from now, such as +3d, +12h or +1w.
      DATA`DENY_PAST_TIME: |-
        That time has already passed. Give one to come, such as +3d.
      # The name a member poses under in scene %0: the persona they set there with +scene/as, or their own.
      FUN`POSER: |-
        firstof(scenemember(%0,%1,showas),name(%1))
      # 1 when %1 would leave pose %0 with nothing in it: empty, or only its poser's name, which is what a
      # pose's text is once the words after the name are taken out.
      FUN`BARE: |-
        [setq(_b,trim(edit(%1,%r,%b)))][or(not(strlen(%q<_b>)),strmatch(%q<_b>,scenepose(,%0,authorname)),strmatch(%q<_b>,firstof(scenepose(,%0,showas),#-1)))]

      # ---- pose types -----------------------------------------------------------
      # Every pose has a type. A type is two attributes here, the way a feed kind's tie-ins are attributes on
      # its owner:
      #   TYPE`<KEY>         JSON the Scene plugin reads: label, presentation (the portal's layout: prose,
      #                      band, message, aside or notice), tone (a theme colour: foreground, primary,
      #                      secondary, tertiary, muted, success, warning, error, info), icon, hidden (whether
      #                      a reader starts with it hidden) and order. @scene/types shows what it made of them.
      #   TYPE`<KEY>`FORMAT  Softcode drawing one line of the type for telnet: %0 the pose id (empty for a
      #                      sample), %1 the reader, %2 the line with its markup, %3 the scene id (empty for
      #                      a sample). Empty shows that reader nothing. Live lines (INC`CAP_LINE), recall
      #                      and log all go through it.
      # A pose of a prose or aside type is drawn under a rule naming who posed it and the pose on the left and
      # the scene on the right. A band, message or notice type has no rule: it is one line, tagged with the
      # scene its FORMAT is given, <OOC · 12>.
      # tone() colours by theme colour rather than by colour, so each reader sees it in their own @theme.
      # A package adding a type attaches both attributes here, as radio-scene does for radio; uninstalling
      # it takes the type away. Staff with layout.admin change the JSON with +scene/type/set; the FORMAT runs
      # as this WIZARD object, so only someone who controls it may write one.
      TYPE`IC: |-
        {"label":"In character","presentation":"prose","order":10}
      TYPE`IC`FORMAT: |-
        %2
      TYPE`OOC: |-
        {"label":"Out of character","presentation":"band","tone":"secondary","order":20}
      TYPE`OOC`FORMAT: |-
        [tone(muted,<OOC[if(strlen(%3),%b[chr(183)] %3)]> %2)]
      TYPE`NARRATION: |-
        {"label":"Narration","presentation":"aside","tone":"secondary","order":30}
      TYPE`NARRATION`FORMAT: |-
        [tone(secondary,%2)]
      # Type %0's line %2 (pose %1 of scene %3) for reader %4 (or %#): its FORMAT, or without one the line, marked
      # <KEY> for a listed type other than ic, with the scene for a type drawn without a rule. A type no longer
      # listed draws as in character, as the portal draws it.
      FUN`TYPE`DRAW: |-
        [if(hasattr(%!,TYPE`%0`FORMAT),u(%!/TYPE`%0`FORMAT,%1,firstof(%4,%#),%2,%3),[if(cand(member(scenetypes(),lcstr(%0)),not(strmatch(%0,ic))),<[ucstr(%0)][if(cand(strlen(%3),not(u(%!/FUN`TYPE`FRAMED,%0))),%b[chr(183)] %3)]>%b)]%2)]
      # 1 when type %0 is drawn under a rule: any type but a band, message or notice, a removed one included.
      FUN`TYPE`FRAMED: |-
        [not(match(band message notice,scenetype(lcstr(%0),presentation)))]
      # The rule over pose %1 of scene %0: who posed it and the pose on the left, the scene on the right. When the
      # line is too narrow for both, the scene goes first.
      FUN`POSE`RULE: |-
        [rule([firstof(scenepose(%0,%1,showas),scenepose(%0,%1,authorname))] [chr(183)] pose %1,,json(object,title,"left",titles,json(array,json(object,text,json(string,Scene %0),side,"right"))))]
      # Pose %1 of scene %3, type %0 and line %2, as reader %4 sees it: under its rule when its type has one,
      # nothing when its FORMAT draws nothing for them. Live lines, recall and log all go through it.
      FUN`POSE`DRAW: |-
        [if(strlen(setr(_d,u(%!/FUN`TYPE`DRAW,%0,%1,%2,%3,%4))),[if(u(%!/FUN`TYPE`FRAMED,%0),[u(%!/FUN`POSE`RULE,%3,%1)]%r)]%q<_d>)]
      # The types %0 has hidden from recall and log: the ones they hid with +scene/hide that are still listed,
      # and the ones the game starts hidden that they have not shown with +scene/show.
      FUN`HIDDEN: |-
        [setunion(setinter(get(%0/SCENE`HIDE),scenetypes()),squish(iter(scenetypes(),if(cand(scenetype(%i0,hidden),not(member(get(%0/SCENE`SHOW),%i0))),%i0))))]
      FUN`HIDDEN`NOW: |-
        [if(words(setr(_h,u(%!/FUN`HIDDEN,%0))),Hidden from your recall and log: [itemize(%q<_h>)]. +scene/show <type> shows one again.,Every pose type shows in your recall and log. +scene/hide <type> hides one.)]
      # %0's value for field %1, as JSON. scenetypecheck() refuses anything that does not fit the field.
      FUN`TYPE`VALUE: |-
        [switch(%0,hidden,switch(lcstr(%1),yes,true,true,true,on,true,1,true,no,false,false,false,off,false,0,false,json(string,%1)),order,if(isint(%1),%1,json(string,%1)),json(string,%1))]
      FUN`TYPE`SAMPLE: |-
        [u(%!/FUN`TYPE`DRAW,%0,,[name(%#)] waves.,,%#)]
      FUN`TYPES`TABLE: |-
        [setq(_k,scenetypes())][setq(_h,u(%!/FUN`HIDDEN,%#))][box(datacolumns(u(%!/FUN`TABLE`OPTS,1|4,|10|20|,1|2|1|3,||1|),[ansi(h,Type)]%r[iter(%q<_k>,%i0,,%r)],[ansi(h,Name)]%r[iter(%q<_k>,scenetype(%i0,label),,%r)],[ansi(h,Looks like)]%r[iter(%q<_k>,u(%!/FUN`TYPE`SAMPLE,%i0),,%r)],[ansi(h,You)]%r[iter(%q<_k>,if(member(%q<_h>,%i0),hidden,shown),,%r)]),Pose types,,u(%!/FUN`FRAME))]
      FUN`TYPE`CARD: |-
        [box(fields(,Type,%0,Name,scenetype(%0,label),Portal look,scenetype(%0,presentation),Colour,firstof(scenetype(%0,tone),text),Icon,firstof(scenetype(%0,icon),none),Hidden at first,if(scenetype(%0,hidden),yes,no),Order,scenetype(%0,order),Looks like,u(%!/FUN`TYPE`SAMPLE,%0),Format,firstof(get(%!/TYPE`%0`FORMAT),none)),Pose type %0,,u(%!/FUN`FRAME))]
      DATA`DENY_TYPES: |-
        Changing pose types needs the layout.admin permission.
      DATA`TYPE_FIELDS: |-
        label presentation tone icon hidden order
      CMD`TYPES:
        value: |-
          $(?is)^\+scene/types$: @assert words(scenetypes())=@pemit %#=[notice(SCENE,No pose types are defined.,warn)]; @pemit %#=[u(%!/FUN`TYPES`TABLE)]
        flags: [REGEXP]
      CMD`TYPE:
        value: |-
          $(?is)^\+scene/type +(.+)$: think [setq(T,lcstr(trim(%1)))]; @assert member(scenetypes(),%q<T>)=@pemit %#=[notice(SCENE,No pose type called %q<T>. +scene/types lists them.,warn)]; @pemit %#=[u(%!/FUN`TYPE`CARD,%q<T>)]
        flags: [REGEXP]
      CMD`TYPE`ADD:
        value: |-
          $(?is)^\+scene/type/add +([^=]+)=(.+)$: @assert permission(%#,layout.admin)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_TYPES)],error)]; think [setq(T,lcstr(trim(%1)))][setq(J,json(object,label,json(string,trim(%2))))]; @assert not(hasattr(%!,TYPE`%q<T>))=@pemit %#=[notice(SCENE,There is already a pose type called %q<T>.,warn)]; @assert not(strlen(setr(E,scenetypecheck(%q<T>,%q<J>))))=@pemit %#=[notice(SCENE,after(%q<E>,#-1%b),warn)]; &TYPE`%q<T> %!=%q<J>; @pemit %#=[notice(SCENE,Added pose type %q<T>. +scene/type/set %q<T>/<field>=<value> changes how it looks.,ok)]
        flags: [REGEXP]
      CMD`TYPE`SET:
        value: |-
          $(?is)^\+scene/type/set +([^/=]+)/([^=]+)=(.*)$: @assert permission(%#,layout.admin)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_TYPES)],error)]; think [setq(T,lcstr(trim(%1)))][setq(F,lcstr(trim(%2)))]; @assert hasattr(%!,TYPE`%q<T>)=@pemit %#=[notice(SCENE,No pose type called %q<T>. +scene/types lists them.,warn)]; @assert member(get(%!/DATA`TYPE_FIELDS),%q<F>)=@pemit %#=[notice(SCENE,A pose type's fields are [itemize(get(%!/DATA`TYPE_FIELDS))].,warn)]; think [setq(J,json_mod(get(%!/TYPE`%q<T>),set,$.%q<F>,u(%!/FUN`TYPE`VALUE,%q<F>,trim(%3))))]; @assert not(strlen(setr(E,scenetypecheck(%q<T>,%q<J>))))=@pemit %#=[notice(SCENE,after(%q<E>,#-1%b),warn)]; &TYPE`%q<T> %!=%q<J>; @pemit %#=[notice(SCENE,Pose type %q<T>: %q<F> set.,ok)]
        flags: [REGEXP]
      CMD`TYPE`REMOVE:
        value: |-
          $(?is)^\+scene/type/remove +(.+)$: @assert permission(%#,layout.admin)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_TYPES)],error)]; think [setq(T,lcstr(trim(%1)))]; @assert hasattr(%!,TYPE`%q<T>)=@pemit %#=[notice(SCENE,No pose type called %q<T>.,warn)]; @wipe %!/TYPE`%q<T>`**; &TYPE`%q<T> %!; @pemit %#=[notice(SCENE,Removed pose type %q<T>. Poses of that type now read as in character.,ok)]
        flags: [REGEXP]
      # +scene/hide <type> and +scene/show <type>: which types this reader's recall and log leave out. Kept on
      # the reader, as SCENE`HIDE and SCENE`SHOW, so the portal's Show menu reads the same choice.
      CMD`TYPE`HIDE:
        value: |-
          $(?is)^\+scene/hi(?\:d(?\:e)?)?(?\: +(.*))?$: think [setq(T,lcstr(trim(%1)))]; @assert strlen(%q<T>)=@pemit %#=[notice(SCENE,u(%!/FUN`HIDDEN`NOW,%#))]; @assert member(scenetypes(),%q<T>)=@pemit %#=[notice(SCENE,No pose type called %q<T>. +scene/types lists them.,warn)]; &SCENE`HIDE %#=[setunion(get(%#/SCENE`HIDE),%q<T>)]; &SCENE`SHOW %#=[setdiff(get(%#/SCENE`SHOW),%q<T>)]; @assert member(get(%#/SCENE`HIDE),%q<T>)=@pemit %#=[notice(SCENE,Your choice could not be saved on your character.,warn)]; @pemit %#=[notice(SCENE,[scenetype(%q<T>,label)] lines are hidden from your recall and log. +scene/show %q<T> shows them again.,ok)]
        flags: [REGEXP]
      CMD`TYPE`SHOW:
        value: |-
          $(?is)^\+scene/sh(?\:o(?\:w)?)? +(.+)$: think [setq(T,lcstr(trim(%1)))]; @assert member(scenetypes(),%q<T>)=@pemit %#=[notice(SCENE,No pose type called %q<T>. +scene/types lists them.,warn)]; &SCENE`SHOW %#=[setunion(get(%#/SCENE`SHOW),%q<T>)]; &SCENE`HIDE %#=[setdiff(get(%#/SCENE`HIDE),%q<T>)]; @assert member(get(%#/SCENE`SHOW),%q<T>)=@pemit %#=[notice(SCENE,Your choice could not be saved on your character.,warn)]; @pemit %#=[notice(SCENE,[scenetype(%q<T>,label)] lines show in your recall and log.,ok)]
        flags: [REGEXP]

      # ---- capture hooks --------------------------------------------------------
      # Each hook RE-BROADCASTS its type-specific speech via @message/spoof, then records
      # the rendered line. The @scene/addpose call itself stays inline in each hook because
      # each speech type renders a different line; drawing it for each hearer, with its rule, is
      # factored out into INC`CAP_LINE and @included.
      #
      # Why @message/spoof instead of hand-rolled @remit/@pemit/@oemit (the old form):
      #   • /spoof makes the notification SENDER the real speaker (%# / enactor), NOT the
      #     WIZARD Scene Logger that runs the hook — restoring correct attribution (the
      #     old @oemit-as-Logger form broke @emit attribution). The Logger is WIZARD, so it
      #     passes the /spoof permission check.
      #   • @message evaluates the format attribute ONCE PER RECIPIENT, so a single call
      #     renders speaker-specific ("You say…") and observer-specific ("Name says…") text.
      #
      # Form: @message/spoof <recipients>=<default>,<obj>/<attr>,<args...>
      #   recipients = lcon(loc(%#)) — everyone in the speaker's room hears it (per-recipient).
      #   <default>  = the built-in third-person literal, used verbatim when the speaker has
      #                no FORMAT`<TYPE>` attribute (it is NOT re-evaluated per recipient, so the
      #                fallback is a single line for every recipient of that call; SAY therefore
      #                makes a separate call for %#).
      #   <obj>/<attr> = %#/FORMAT`<TYPE>` — the per-player render read off the SPEAKER. When set,
      #                it receives %0 = the message text and %1 = the recipient's dbref (short #N,
      #                via the @message `##` recipient token, as PennMUSH's unparse_dbref), and
      #                %# = the speaker. To split "You…" vs "Name…", strmatch(%1,%#) is true only
      #                for the speaker's own copy. FORMAT`<TYPE>` defaults are seeded by the
      #                Ancestor Player; absent it, the <default> literal is used.
      #   commas inside the <default> literal use [chr(44)] (NOT a literal `,`): @message is
      #   CB.RSArgs and splits its RHS on commas BEFORE evaluating each arg, and a backslash-escaped
      #   `\,` does not survive the $-command body parse + RSArgs split (it shifts the obj/attr arg,
      #   so FORMAT is never read). chr(44) emits the comma during per-arg evaluation, after the split.
      #   The recorded @scene/addpose line below is NOT RSArgs in the same way, so it still uses \,.
      #
      # Flow per hook (one physical line, `;`-separated):
      #   1. setq(WillCaptureAsPose, <room has an active scene I am focused on, and I am approved>)
      #      — computing %q<SceneID> and %q<RoomID> along the way — and %q<Poser>, the name the line goes
      #      out under: the poser's persona in that scene (+scene/as) when it is captured, else their name. The check is
      #      `strmatch(scenefocus(%#),scenewhere(loc(%#))) AND not(strmatch(scenewhere,#-1*)) AND
      #      FUN`IS`APPROVED(%#)` — a real, focused, in-room active scene (NOT just words(), which is
      #      truthy on "#-1 NOT FOUND"), posed by a character still approved RIGHT NOW. The approval
      #      term is what makes revocation take effect immediately: without it, a character approved
      #      when they joined would keep writing poses into the scene after losing the flag, since
      #      their focus and membership survive the revocation.
      #   2. Captured ⇒ record with @scene/addpose as type ic, set the registers INC`CAP_LINE reads, and
      #      @include it: the line drawn by the speaker's FORMAT`<VERB> or else the type's FORMAT,
      #      under the pose's rule.
      #   3. Otherwise ⇒ @message/spoof the pose to the room exactly as before (so a pose outside any
      #      scene behaves like the un-hooked built-in -- the emit is never lost).
      # So a CAPTURED pose is framed (a rule naming the poser, the pose and the scene, or a scene tag); an
      # uncaptured one is a plain pose. The rule must come AFTER addpose because it reads the new pose id.
      #
      # EVERY capture pattern carries BOTH inline flags, `(?is)`, and the `s` is not decoration.
      # $-commands are matched against the command line AFTER evaluation, so a multi-line pose --
      # `@emit one%rtwo`, or anything the portal's compose box sends, where a newline travels as %r --
      # reaches the matcher with a REAL line break in it. Without `s`, `.` does not cross that break,
      # `^@emit (.*)$` cannot match, and the override silently does not fire: the emit still reaches
      # the room (the built-in runs when no $-command matches) and is never recorded. The failure
      # looks like nothing at all, which is why it survived so long -- only multi-line poses go
      # missing from the archive, and only from the scene, never from the room.

      # A captured line as the room hears it, drawn once per hearer by FUN`POSE`DRAW: under a rule naming who
      # posed and the pose (left) and the scene (right), or for a band, message or notice type as one line tagged
      # with the scene. A hearer whose type FORMAT draws nothing gets nothing, rule included. It runs AS the
      # Logger (@include locates its target as the executor), so it works for a remote poser too, and reads the
      # pose id off last(sceneposes()), so it MUST run after @scene/addpose. The hook sets the registers first:
      #   Type    the pose type's key, upper case (IC, OOC, NARRATION)
      #   Verb    POSE, SAY, SEMIPOSE, EMIT or OOC: which FORMAT`<VERB> on the speaker would apply
      #   Words   what the speaker typed, the %0 a FORMAT`<VERB> is given
      #   Line    the line as recorded, the %2 the type's FORMAT is given
      #   Heard   what is sent when there is no format: Line, or for OOC the line with its <OOC>
      #   Hearers who hears it; Self, when set, is what the speaker hears instead (SAY's "You say")
      # A speaker's own FORMAT`<VERB> (on them, not inherited from the Ancestor Player) wins, as it does for
      # a line no scene records; the room then gets the rule as it is, before the line. The registers are all
      # set by each hook, so nothing left over from the speaker's own code leaks in.
      INC`CAP_LINE: |-
        think [setq(PoseID,last(sceneposes(%q<SceneID>)))]; @if hasattrval(%#,FORMAT`%q<Verb>)={@if u(%!/FUN`TYPE`FRAMED,%q<Type>)={@remit %q<RoomID>=[u(%!/FUN`POSE`RULE,%q<SceneID>,%q<PoseID>)]}; @if strlen(%q<Self>)={@message/spoof %#=%q<Self>,%#/FORMAT`%q<Verb>,%q<Words>,##}; @message/spoof %q<Hearers>=%q<Heard>,%#/FORMAT`%q<Verb>,%q<Words>,##},{@if strlen(%q<Self>)={@message/spoof %#=%q<Self>,%!/FUN`POSE`DRAW,%q<Type>,%q<PoseID>,%q<Self>,%q<SceneID>,##}; @message/spoof %q<Hearers>=%q<Heard>,%!/FUN`POSE`DRAW,%q<Type>,%q<PoseID>,%q<Line>,%q<SceneID>,##}

      # Built-in POSE (MoreCommands.Pose) emits: "<name> <message>" to the room.
      CMD`CAPTURE`POSE:
        value: |-
          $(?is)^(pose |\:)(.*)$: think [setq(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))][setq(Poser,if(%q<WillCaptureAsPose>,u(%!/FUN`POSER,%q<SceneID>,%#),name(%#)))]; @if %q<WillCaptureAsPose>={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,ic,pose,,%q<Poser> %2; think [setq(Type,IC)][setq(Verb,POSE)][setq(Words,%2)][setq(Line,%q<Poser> %2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE},{@message/spoof [lcon(%q<RoomID>)]=%q<Poser> %2,%#/FORMAT`POSE,%2,##}
        flags: [REGEXP]

      # Built-in SAY (MoreCommands.Say) emits "You say, \"<msg>\"" to the speaker
      # and "<name> says, \"<msg>\"" to everyone else in the room (PennMUSH do_say, src/speech.c).
      # Unlike the other hooks, the <default> literal differs per recipient, so SAY sends two
      # @message/spoof calls: the first-person line to %#, the third-person line to the rest of
      # lcon() (the speaker is filtered out by dbref number, since lcon() may list objids).
      CMD`CAPTURE`SAY:
        value: |-
          $(?is)^(say |")(.*)$: think [setq(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))][setq(Poser,if(%q<WillCaptureAsPose>,u(%!/FUN`POSER,%q<SceneID>,%#),name(%#)))]; @if %q<WillCaptureAsPose>={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,ic,say,,%q<Poser> says\, "%2"; think [setq(Type,IC)][setq(Verb,SAY)][setq(Words,%2)][setq(Line,%q<Poser> says[chr(44)] "%2")][setq(Heard,%q<Line>)][setq(Self,You say[chr(44)] "%2")][setq(Hearers,iter(lcon(%q<RoomID>),if(strmatch(before(%i0,:),%#),,%i0)))]; @include %!/INC`CAP_LINE},{@message/spoof %#=You say[chr(44)] "%2",%#/FORMAT`SAY,%2,##; @message/spoof [iter(lcon(%q<RoomID>),if(strmatch(before(%i0,:),%#),,%i0))]=%q<Poser> says[chr(44)] "%2",%#/FORMAT`SAY,%2,##}
        flags: [REGEXP]

      # Built-in SEMIPOSE (MoreCommands.SemiPose) emits "<name><message>" (no space).
      CMD`CAPTURE`SEMI:
        value: |-
          $(?is)^(semipose |;)(.*)$: think [setq(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))][setq(Poser,if(%q<WillCaptureAsPose>,u(%!/FUN`POSER,%q<SceneID>,%#),name(%#)))]; @if %q<WillCaptureAsPose>={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,ic,semipose,,%q<Poser>%2; think [setq(Type,IC)][setq(Verb,SEMIPOSE)][setq(Words,%2)][setq(Line,%q<Poser>%2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE},{@message/spoof [lcon(%q<RoomID>)]=%q<Poser>%2,%#/FORMAT`SEMIPOSE,%2,##}
        flags: [REGEXP]

      # Built-in @EMIT emits "<message>" verbatim (no name) to the room.
      CMD`CAPTURE`EMIT:
        value: |-
          $(?is)^@emit (.*)$: think [setq(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))][setq(Poser,if(%q<WillCaptureAsPose>,u(%!/FUN`POSER,%q<SceneID>,%#),name(%#)))]; @if %q<WillCaptureAsPose>={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,ic,emit,,%1; think [setq(Type,IC)][setq(Verb,EMIT)][setq(Words,%1)][setq(Line,%1)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE},{@message/spoof [lcon(%q<RoomID>)]=%1,%#/FORMAT`EMIT,%1,##}
        flags: [REGEXP]

      # ---- web compose ----------------------------------------------------------
      # +scene/<mode> <id>=<text> -- what the portal's live-scene compose box sends.
      #
      # The capture hooks above answer "which scene am I in?" from the room the poser is standing in,
      # which is the only question a MU* client can ask. The portal asks a different one: its compose
      # box sits on ONE scene's page, so the pose has to reach THAT scene whether or not the character
      # is standing in its room -- and before this existed, a pose typed there was emitted into
      # whatever room the character happened to be in and silently never recorded.
      #
      # So these take the id explicitly and record regardless of location. Four consequences,
      # each deliberate:
      #   * a poser who is not in the cast is added to it -- a recorded pose whose author is missing
      #     from the info card's cast would leave that card lying about who was in the scene. Guarded on
      #     them having no role YET, because @scene/member sets the role outright: writing it on
      #     every pose demoted an owner to participant in their own scene, and every ownership verb
      #     (+scene/public, /finish, /pitch) is gated on FUN`OWNS, so it locked them out of it;
      #   * the poser is FOCUSED on the scene they just posed into. Posing is the act that says "I am
      #     in this one" -- and without it a pose composed on a scene's page landed there while the
      #     character's focus stayed wherever it had been, so the very next line they typed in a
      #     client went to a different scene, or to none. Everything else about that page says they
      #     are in this scene; the focus has to agree. Harmless when they are elsewhere: a room pose
      #     is captured only when focus matches the scene of the room they are standing in, so a
      #     focus pointing at a remote scene simply captures nothing;
      #   * the room emit is CONDITIONAL on the poser actually being there. Recording from anywhere is
      #     the point; speaking into a room you are not standing in would put words in front of people
      #     you are not with;
      #   * they never call the built-in pose/say/semipose/@emit, because those are hooked above --
      #     delegating would record the pose a second time.
      #
      # The rendered line matches its hook exactly, framed by the same rule in the room,
      # so a pose composed on the web and one typed in a terminal are indistinguishable in the archive
      # and on screen. Note the two comma spellings, both required and
      # for different reasons: `\,` inside @scene/addpose's argument list, and `[chr(44)]` inside
      # @message's RHS, which is CB.RSArgs and splits on commas BEFORE evaluating each argument.
      #
      # The co-location test compares loc(%#) against scene(<id>,room) directly, which works because
      # scene(...,room) answers with an objid -- the same spelling loc() uses. It did not always: it
      # returned a bare dbref, so the comparison was quietly always false and the room emit never
      # fired for anyone.
      #
      # Reading the scene at all is gated by the same visibility rule the REST and hub surfaces use
      # (public, or the caller owns or belongs to it), because the existence guard goes through
      # scene(). That is what stops these verbs being a way to write into a private scene by guessing
      # an id -- and it costs the web nothing, since the compose box only exists on a page whose
      # scene the reader could already see.
      # Multi-line poses need nothing special here. The portal sends newlines as `%r`, which is
      # expanded before the $-command pattern is matched, and these patterns carry `(?is)` as the
      # capture hooks do -- so `(.*?)=(.*?)` matches a two-line pose and %2 arrives with real line
      # breaks in it.
      #
      # Whitespace inside %1 arrives intact for the same reason it has to be spelled out to get here:
      # the compose box sends every space run, indent and line break as %b / %t / %r, and a
      # substitution is expanded AFTER the parser has finished eating the whitespace it eats. Nothing
      # in the verbs may put a Trim() back in front of the content, on either side of the wire.
      CMD`WEB`EMIT:
        value: |-
          $(?is)^\+scene/em(?\:i(?\:t)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,[scenemember(%1,%#,showas)],%q<RoomID>,ic,emit,,%2; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,IC)][setq(Verb,EMIT)][setq(Words,%2)][setq(Line,%2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      CMD`WEB`POSE:
        value: |-
          $(?is)^\+scene/po(?\:s(?\:e)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,[scenemember(%1,%#,showas)],%q<RoomID>,ic,pose,,%q<Poser> %2; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,IC)][setq(Verb,POSE)][setq(Words,%2)][setq(Line,%q<Poser> %2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      CMD`WEB`SAY:
        value: |-
          $(?is)^\+scene/sa(?\:y)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,[scenemember(%1,%#,showas)],%q<RoomID>,ic,say,,%q<Poser> says\, "%2"; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,IC)][setq(Verb,SAY)][setq(Words,%2)][setq(Line,%q<Poser> says[chr(44)] "%2")][setq(Heard,%q<Line>)][setq(Self,You say[chr(44)] "%2")][setq(Hearers,iter(lcon(%q<RoomID>),if(strmatch(before(%i0,:),%#),,%i0)))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      CMD`WEB`SEMIPOSE:
        value: |-
          $(?is)^\+scene/se(?\:m(?\:i(?\:p(?\:o(?\:s(?\:e)?)?)?)?)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,[scenemember(%1,%#,showas)],%q<RoomID>,ic,semipose,,%q<Poser>%2; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,IC)][setq(Verb,SEMIPOSE)][setq(Words,%2)][setq(Line,%q<Poser>%2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      # Out of character, into this scene. The room hears what the `ooc` command would have it hear
      # (`<OOC> Name: words`; a leading `:` poses and a leading `;` semiposes), and the scene records
      # the line less the marker as type and source `ooc`: TYPE`OOC`FORMAT puts the marker back for the
      # room and recall, and the portal draws the type as its band. No persona: out of character is the player speaking. As with `ooc`, a gagged player is
      # refused, so is a marker with nothing after it, and the room's Speech lock applies when the
      # speaker is standing in it. The `;` is spelled chr(59) because a bare one ends the command.
      CMD`WEB`OOC:
        value: |-
          $(?is)^\+scene/oo(?\:c)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @assert not(hasflag(%#,GAGGED))=@pemit %#=[notice(SCENE,You cannot speak while gagged.,error)]; @assert or(not(strmatch(loc(%#),scene(%1,room))),elock(scene(%1,room)/Speech,%#))=@pemit %#=[notice(SCENE,You may not speak there!,error)]; @assert strlen(trim(switch(left(%2,1),:,delete(%2,0,1),chr(59),delete(%2,0,1),%2)))=@pemit %#=[notice(SCENE,OOC: What do you want to say?,warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,,%q<RoomID>,ooc,ooc,,[setr(OocLine,switch(left(%2,1),:,[name(%#)] [delete(%2,0,1)],chr(59),[name(%#)][delete(%2,0,1)],[name(%#)]: %2))]; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,OOC)][setq(Verb,OOC)][setq(Words,%2)][setq(Line,%q<OocLine>)][setq(Heard,<OOC> %q<OocLine>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      # Narration: the scene's world speaking rather than a character, recorded as the narration type. It is an
      # emit as the room hears it; the type's FORMAT draws it.
      CMD`WEB`NARRATE:
        value: |-
          $(?is)^\+scene/n(?\:a(?\:r(?\:r(?\:a(?\:t(?\:e)?)?)?)?)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scene(%1,status),active)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_RUNNING)],warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; think [setq(SceneID,%1)][setq(RoomID,scene(%1,room))][setq(Poser,u(%!/FUN`POSER,%1,%#))]; @scene/addpose %1=%#,[scenemember(%1,%#,showas)],%q<RoomID>,narration,emit,,%2; @if strmatch(loc(%#),%q<RoomID>)={think [setq(Type,NARRATION)][setq(Verb,NARRATE)][setq(Words,%2)][setq(Line,%2)][setq(Heard,%q<Line>)][setq(Self,)][setq(Hearers,lcon(%q<RoomID>))]; @include %!/INC`CAP_LINE}
        flags: [REGEXP]

      # ---- create / lifecycle ---------------------------------------------------
      # NOTE: capture the new scene id into %q<SceneID> with @assert (it both sets the register and
      # aborts cleanly if creation fails — the id is truthy), then drive the writes off %q<SceneID>.
      # IMPORTANT: the body is one PHYSICAL line with `;` separators. q-registers are shared
      # across `;`-separated commands but NOT across newline-separated ones in a $-command
      # body, so the original multi-line `|-` form lost %q<SceneID> between writes. The original
      # `&MY.SID %#=[setr(SceneID,…)]` also failed (setr inside an &attr=<value> RHS doesn't
      # propagate its register); @assert in command position does.
      CMD`CREATE:
        value: |-
          $(?is)^\+scene/cr(?\:e(?\:a(?\:t(?\:e)?)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert setr(SceneID,scenecreate(%L,%#,%1)); @scene/member %q<SceneID>/owner=%#; @scene/focus %#=%q<SceneID>; @scene/set %q<SceneID>/status=[get(%!/DATA`DEFAULT_STATUS)]; @pemit %#=[notice(SCENE,Scene %q<SceneID> created and focused \(status: [get(%!/DATA`DEFAULT_STATUS)]\).,ok)]; &MY.SID %#=%q<SceneID>
        flags: [REGEXP]

      # NOTE: verb bodies are written as ONE physical line with `;` separators. In a
      # multi-line ($-command) attribute the FIRST command after the `$pattern:` header does
      # not parse cleanly (the following line's leading `@scene…` leaks into it) and
      # q-registers do not cross newlines — the `;` form is robust on both counts.
      # +scene/start starts a scene or resumes a paused one. A finished or cancelled scene stays as it is, and
      # one already running says so rather than starting again. A roomless scene (one made by
      # +scene/schedule) is bound to the room the starter is in; one with a room keeps it.
      CMD`START:
        value: |-
          $(?is)^\+scene/st(?\:a(?\:r(?\:t)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert not(match(active finished cancelled,setr(st,scene(%q<SceneID>,status))))=@pemit %#=[notice(SCENE,u(%!/FUN`START`DENY,%q<SceneID>,%q<st>),warn)]; @if not(strlen(scene(%q<SceneID>,room)))={@scene/set %q<SceneID>/room=%L}; @scene/set %q<SceneID>/status=active; @pemit %#=[notice(SCENE,Scene %q<SceneID> is now active.,ok)]
        flags: [REGEXP]

      # +scene/start <id> is the same by id, without focusing the scene: how the portal resumes one.
      CMD`START`ID:
        value: |-
          $(?is)^\+scene/st(?\:a(?\:r(?\:t)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert u(%!/FUN`OWNS,%#,%1)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert not(match(active finished cancelled,setr(st,scene(%1,status))))=@pemit %#=[notice(SCENE,u(%!/FUN`START`DENY,%1,%q<st>),warn)]; @if not(strlen(scene(%1,room)))={@scene/set %1/room=%L}; @scene/set %1/status=active; @pemit %#=[notice(SCENE,Scene %1 is now active.,ok)]
        flags: [REGEXP]
      # Why scene %0, whose status is %1, can't be started, paused or finished.
      FUN`START`DENY: |-
        [switch(%1,active,Scene %0 is already running.,cancelled,Scene %0 was cancelled and can't be started again.,Scene %0 is finished.)]
      FUN`PAUSE`DENY: |-
        [switch(%1,paused,Scene %0 is already paused.,finished,Scene %0 is finished.,cancelled,Scene %0 was cancelled.,Scene %0 has not started\, so there is nothing to pause.)]
      FUN`FINISH`DENY: |-
        [switch(%1,finished,Scene %0 is already finished.,Scene %0 was cancelled\, so there is nothing to finish.)]

      # A paused scene stops recording and leaves the live list for the schedule, where it stays until
      # +scene/start resumes it. Pausing without a time clears any time the scene had, so the schedule
      # never shows a stale one; pausing with one (+scene/pause [<id>]=<when>) sets it. Only a running scene
      # can be paused: a finished one would come back onto the schedule, and pausing a paused one again
      # would only report success twice.
      CMD`PAUSE:
        value: |-
          $(?is)^\+scene/pa(?\:u(?\:s(?\:e)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert strmatch(setr(st,scene(%q<SceneID>,status)),active)=@pemit %#=[notice(SCENE,u(%!/FUN`PAUSE`DENY,%q<SceneID>,%q<st>),warn)]; @scene/set %q<SceneID>/status=paused; @scene/set %q<SceneID>/scheduledfor=; @pemit %#=[notice(SCENE,Scene %q<SceneID> paused. It is on the schedule until +scene/start resumes it.,ok)]
        flags: [REGEXP]

      # +scene/pause <id>, +scene/pause <id>=<when> and +scene/pause =<when> (the focused scene). One
      # pattern for all three: $+scene/pause *=* would also match here, and both would run.
      CMD`PAUSE`ID:
        value: |-
          $(?is)^\+scene/pa(?\:u(?\:s(?\:e)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,firstof(trim(before(%1,chr(61))),scenefocus(%#))),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert strmatch(setr(st,scene(%q<SceneID>,status)),active)=@pemit %#=[notice(SCENE,u(%!/FUN`PAUSE`DENY,%q<SceneID>,%q<st>),warn)]; think [setq(When,trim(after(%1,chr(61))))][setq(At,if(strlen(%q<When>),u(%!/FUN`SCHED_WHEN,%q<When>)))]; @assert or(not(strlen(%q<When>)),isint(%q<At>))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_BAD_TIME)],warn)]; @assert or(not(strlen(%q<When>)),gt(%q<At>,mul(secs(),1000)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_PAST_TIME)],warn)]; @scene/set %q<SceneID>/status=paused; @scene/set %q<SceneID>/scheduledfor=%q<At>; @pemit %#=[notice(SCENE,Scene %q<SceneID> paused[if(strlen(%q<At>),%b[chr(40)]rescheduled for [convsecs(div(%q<At>,1000))][chr(41)])]. It is on the schedule until +scene/start %q<SceneID> resumes it.,ok)]
        flags: [REGEXP]

      CMD`FINISH:
        value: |-
          $(?is)^\+scene/f(?\:i(?\:n(?\:i(?\:s(?\:h)?)?)?)?)?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert u(%!/FUN`CAN`CLOSE,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_CLOSER)],error)]; @assert not(match(finished cancelled,setr(st,scene(%q<SceneID>,status))))=@pemit %#=[notice(SCENE,u(%!/FUN`FINISH`DENY,%q<SceneID>,%q<st>),warn)]; @scene/set %q<SceneID>/status=finished; @scene/focus %#=; @pemit %#=[notice(SCENE,Scene %q<SceneID> finished.,ok)]
        flags: [REGEXP]

      # +scene/finish <id> closes a scene by id, without joining it: how staff close one they are not in.
      # scene() hides a private scene from a non-member, so a scene.close holder gets past that guard and
      # only a scene that does not exist stops them; to anyone else a hidden scene still reads as missing.
      CMD`FINISH`ID:
        value: |-
          $(?is)^\+scene/f(?\:i(?\:n(?\:i(?\:s(?\:h)?)?)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert or(not(strmatch(scene(%1,status),#-1*)),permission(%#,scene.close))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert not(strmatch(scene(%1,status),#-1 NOT FOUND))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert u(%!/FUN`CAN`CLOSE,%#,%1)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_CLOSER)],error)]; @assert not(match(finished cancelled,setr(st,scene(%1,status))))=@pemit %#=[notice(SCENE,u(%!/FUN`FINISH`DENY,%1,%q<st>),warn)]; @scene/set %1/status=finished; @if strmatch(scenefocus(%#),%1)={@scene/focus %#=}; @pemit %#=[notice(SCENE,Scene %1 finished.,ok)]
        flags: [REGEXP]

      # ---- membership / RSVP / focus --------------------------------------------
      # An owner who joins their own scene again (the portal's Join, after focusing elsewhere) stays its
      # owner: @scene/member sets the role outright, so it is skipped for them. @scene/member and @scene/focus
      # refuse a missing scene but tell the Logger, not the player, so each verb that names a scene checks it
      # exists first; scene() also hides a private scene from a non-member, so it cannot be joined by its id.
      CMD`JOIN:
        value: |-
          $(?is)^\+scene/j(?\:o(?\:i(?\:n)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @if not(strmatch(scenemember(%1,%#,role),owner))={@scene/member %1/participant=%#}; @scene/focus %#=%1; @pemit %#=[notice(SCENE,Joined and focused on scene %1.,ok)]
        flags: [REGEXP]

      # NOTE: one physical line (q-registers cross `;` but not newlines in a $-command body).
      # Capture the focused scene id into %q<SceneID> BEFORE @scene/focus clears it (@assert sets the
      # register and no-ops cleanly when not focused), then drive the writes off %q<SceneID>.
      CMD`LEAVE:
        value: |-
          $(?is)^\+scene/le(?\:a(?\:v(?\:e)?)?)?$: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @scene/focus %#=; @if not(words(sceneposes(%q<SceneID>,%#)))={@scene/unmember %q<SceneID>=%#}; @pemit %#=[notice(SCENE,Left the scene.,ok)]; &MY.SID %#=%q<SceneID>
        flags: [REGEXP]

      # +scene/tag and its common name, +scene/rsvp.
      CMD`TAG:
        value: |-
          $(?is)^\+scene/(?\:ta(?\:g)?|rs(?\:v(?\:p)?)?) (.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert not(match(owner participant,scenemember(%1,%#,role)))=@pemit %#=[notice(SCENE,You are already in scene %1.,warn)]; @scene/member %1/attending=%#; @pemit %#=[notice(SCENE,RSVP'd to scene %1.,ok)]
        flags: [REGEXP]

      CMD`UNTAG:
        value: |-
          $(?is)^\+scene/(?\:unt(?\:a(?\:g)?)?|unr(?\:s(?\:v(?\:p)?)?)?) (.+)$: @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert strmatch(scenemember(%1,%#,role),attending)=@pemit %#=[notice(SCENE,You have not RSVP'd to scene %1.,warn)]; @scene/unmember %1=%#; @pemit %#=[notice(SCENE,Removed RSVP from scene %1.,ok)]
        flags: [REGEXP]

      # +scene/as <name> poses under another name in the focused scene; bare, or the player's own name, goes
      # back to it. A comma or an = would split the fields of @scene/addpose and @scene/showas.
      CMD`AS:
        value: |-
          $(?is)^\+scene/as(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; think [setq(As,trim(%1))]; @assert not(or(t(pos(chr(61),%q<As>)),t(pos(chr(44),%q<As>))))=@pemit %#=[notice(SCENE,A name to pose under can't have a comma or an = in it.,warn)]; think [setq(As,if(strmatch(%q<As>,name(%#)),,%q<As>))]; @scene/showas %q<SceneID>/%#=%q<As>; @pemit %#=[notice(SCENE,if(strlen(%q<As>),Future poses show as: %q<As>,Future poses show under your own name.),ok)]
        flags: [REGEXP]

      # ---- edit your own poses --------------------------------------------------
      # <pose>=<old>^^^<new>. @scene/editpose is the wizard primitive and edits any pose for any editor, so the
      # author check is here, as for undo: the pose's author or a wizard. scenepose() with an empty scene finds
      # the pose wherever it is. The pose id goes into %q<pid> and the new content into %q<new> in a command of
      # its own (a nested function reference to the verb's arguments inside an @scene arg does not resolve
      # reliably), then the edit runs off them. The = is found with chr(61) because a bare one in an @assert's
      # condition would end the condition there.
      CMD`EDIT:
        value: |-
          $(?is)^\+scene/ed(?\:i(?\:t)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert cand(t(pos(chr(61),%1)),strlen(setr(pid,trim(before(%1,chr(61))))),t(pos(^^^,after(%1,chr(61)))),strlen(setr(old,before(after(%1,chr(61)),^^^))))=@pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`EDIT)],warn)]; @assert not(strmatch(scenepose(,%q<pid>,author),#-1*))=@pemit %#=[notice(SCENE,No such pose: %q<pid>,warn)]; @assert or(orflags(%#,Wz),strmatch(scenepose(,%q<pid>,author),num(%#)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_POSER)],error)]; @assert t(pos(%q<old>,scenepose(,%q<pid>,content)))=@pemit %#=[notice(SCENE,Pose %q<pid> has no "%q<old>" in it.,warn)]; think [setq(new,edit(scenepose(,%q<pid>,content),%q<old>,after(after(%1,chr(61)),^^^)))]; @assert not(u(%!/FUN`BARE,%q<pid>,%q<new>))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_EMPTY)],warn)]; @scene/editpose %q<pid>=%#,%q<new>; @pemit %#=[notice(SCENE,Pose %q<pid> edited.,ok)]
        flags: [REGEXP]

      # The whole text at once: the portal's Edit on a pose sends this. Its author or a wizard, as for CMD`EDIT. The
      # player's command line is evaluated before it is matched, as the player, so %1 is already the text: the
      # composer's %r and %b are its line breaks and spaces, and any function in it ran with the player's own
      # powers, as it would in their say or pose, never the logger's. Nothing here evaluates it again, or a
      # decompose()d \[ that the first pass left as a [ would run as a function. @scene/editpose takes %1 as it
      # is, commas and all (it splits off one field); a substitution is not parsed again.
      CMD`REWRITE:
        value: |-
          $(?is)^\+scene/rew(?\:r(?\:i(?\:t(?\:e)?)?)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert cand(t(pos(chr(61),%1)),strlen(setr(pid,trim(before(%1,chr(61))))))=@pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`REWRITE)],warn)]; @assert not(strmatch(scenepose(,%q<pid>,author),#-1*))=@pemit %#=[notice(SCENE,No such pose: %q<pid>,warn)]; @assert or(orflags(%#,Wz),strmatch(scenepose(,%q<pid>,author),num(%#)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_POSER)],error)]; @assert not(u(%!/FUN`BARE,%q<pid>,setr(new,after(%1,chr(61)))))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_EMPTY)],warn)]; @scene/editpose %q<pid>=%#,%q<new>; @pemit %#=[notice(SCENE,Pose %q<pid> rewritten.,ok)]
        flags: [REGEXP]

      # Undo, redo and delete check the pose exists and is the player's (a wizard may act on anyone's), then
      # call the function, whose answer is the pose id or why it could not: @scene/undo tells only the Logger.
      CMD`UNDO:
        value: |-
          $(?is)^\+scene/und(?\:o)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=[notice(SCENE,No such pose: %1,warn)]; @assert or(orflags(%#,Wz),strmatch(scenepose(,%1,author),num(%#)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_POSER)],error)]; @pemit %#=[if(isint(setr(Result,sceneundo(%1))),notice(SCENE,Pose %1 undone.,ok),notice(SCENE,%q<Result>,warn))]
        flags: [REGEXP]

      CMD`REDO:
        value: |-
          $(?is)^\+scene/red(?\:o)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=[notice(SCENE,No such pose: %1,warn)]; @assert or(orflags(%#,Wz),strmatch(scenepose(,%1,author),num(%#)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_POSER)],error)]; @pemit %#=[if(isint(setr(Result,sceneredo(%1))),notice(SCENE,Pose %1 redone.,ok),notice(SCENE,%q<Result>,warn))]
        flags: [REGEXP]

      CMD`DELETE:
        value: |-
          $(?is)^\+scene/del(?\:e(?\:t(?\:e)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scenepose(,%1,author),#-1*))=@pemit %#=[notice(SCENE,No such pose: %1,warn)]; @assert or(orflags(%#,Wz),strmatch(scenepose(,%1,author),num(%#)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_POSER)],error)]; @pemit %#=[if(isint(setr(Result,scenedelpose(%1))),notice(SCENE,Pose %1 deleted.,ok),notice(SCENE,%q<Result>,warn))]
        flags: [REGEXP]

      # The pose must be in the focused scene: a move reorders whichever scene the pose is in, which is
      # not necessarily the one the owner check was about.
      CMD`MOVE:
        value: |-
          $(?is)^\+scene/mo(?\:v(?\:e)?)? (.*?)=(.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert strmatch(scenepose(%q<SceneID>,%1,id),%1)=@pemit %#=[notice(SCENE,No pose %1 in scene %q<SceneID>.,warn)]; @pemit %#=[if(isint(setr(Result,scenemovepose(%1,%2))),notice(SCENE,Pose %1 moved.,ok),notice(SCENE,%q<Result>,warn))]
        flags: [REGEXP]

      # ---- visibility -----------------------------------------------------------
      # +scene/public [<id>] and +scene/private [<id>]: the focused scene, or the one named.
      CMD`PRIVACY:
        value: |-
          $(?is)^\+scene/(pu(?\:b(?\:l(?\:i(?\:c)?)?)?)?|pr(?\:i(?\:v(?\:a(?\:t(?\:e)?)?)?)?)?)(?\: +(\d+))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,firstof(%2,scenefocus(%#))),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @scene/set %q<SceneID>/public=[strmatch(%1,pu*)]; @pemit %#=[notice(SCENE,Scene %q<SceneID> is now [if(strmatch(%1,pu*),public,private)].,ok)]
        flags: [REGEXP]

      # ---- viewing --------------------------------------------------------------
      # The Players table: what each member is to the scene, who they are, how much they have posed.
      # Name carries the persona when there is one, which is where the separate Cast line of personas
      # went: one reading now gives both the character and the name they answer to. Every table in this
      # package is a datacolumns(), one iter() per column, joined with %r and split on a newline
      # (FUN`TABLE`OPTS), so a title or persona holding a | stays one cell; no width is given, so each
      # reader gets it at their own and the portal draws a table.
      FUN`CAST`TABLE: |-
        [datacolumns(u(%!/FUN`TABLE`OPTS,1|3,|12,1|1|2,|1),[ansi(h,Status)]%r[iter(%1,capstr(scenemember(%0,%i0,role)),,%r)],[ansi(h,Name)]%r[iter(%1,u(%!/FUN`CAST`NAME,%0,%i0),,%r)],>[ansi(h,Poses)]%r[iter(%1,words(sceneposes(%0,%i0)),,%r)])]
      FUN`CAST`NAME: |-
        [switch(setr(sa,scenemember(%0,%1,showas)),,[name(%1)],[name(%1)] as [edit(%q<sa>,%r,%b)])]
      # Every screen is a box() with no sides, corners or tees: a titled line across the top, the
      # dividers and bottom line across the whole width, and nothing beside the text, so a pitch or a
      # pose copied from a terminal carries no |. The portal draws its usual card.
      FUN`FRAME: |-
        json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
      # The options every table here shares: %0 the nowrap columns, %1 the least widths, %2 the priorities,
      # %3 the shares of spare width (the column that takes it, so the table spans the screen), each
      # written split by |. The delimiter is a newline, and these lists split on it like the cells do.
      # No heading rule: it would span only the table, not the screen, so headings are bold instead.
      FUN`TABLE`OPTS: |-
        json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,edit(%0,|,%r)),min,json(string,edit(%1,|,%r)),priority,json(string,edit(%2,|,%r)),grow,json(string,edit(%3,|,%r)))


      # sceneposes() returns a SPACE-separated id list, so iter() must use the default
      # space input delimiter (an `@` input delim collapsed the whole list into one bogus
      # id → #-1). %r is the output separator (one pose content per line).
      #
      # `+scene/recall <n>` asks for a count; bare `+scene/recall` asks for "enough to see where we are",
      # which is a function of how many people are posing: one round of the room is
      # words(scenemembers()), and DATA`RECALL_ROUNDS rounds of it is what someone who just walked in
      # needs. `+scene/recall <id>=[<n>]` is the same for a scene the reader is not focused on, and
      # `+scene/log [<id>]` reads all of it. Every one goes through INC`RECALL so they cannot render
      # differently -- it reads %q<SceneID> and %q<Count> (empty for the whole log), which each verb sets
      # before including it. scene() and sceneposes() answer as the reader (%#), so a private scene reads
      # as missing to anyone outside it.
      #
      # The guard is what makes bare recall safe: sceneposes() answers "#-1 NOT FOUND" for a scene
      # that does not exist, and an unfocused player's scenefocus() IS that string, so without it
      # the verb printed the sentinel back at them.
      DATA`RECALL_ROUNDS: |-
        2

      # One entry per pose, drawn as it is live (FUN`POSE`DRAW): a rule naming who posed, the pose's id and the
      # scene, then the pose as its type's FORMAT draws it, with the stored markup, so colour survives. A band,
      # message or notice type is one line with no rule.
      # Recall used to print bare content lines, which ran together into an undifferentiated block --
      # an @emit carries no name of its own, a multi-line pose reads as several separate ones, and
      # there was no id on screen to hand to +scene/edit or +scene/undo.
      #
      # Attribution comes off the POSE, not off current membership: showas is recorded at write time,
      # so a log read back later shows the name each pose actually went out under rather than whatever
      # persona its author happens to wear now. firstof() falls through to the author's name for a
      # pose written without one.
      #
      # A pose whose type the reader hides (FUN`HIDDEN) is left out and counted, and a note under the
      # recall says how many; one its FORMAT draws as nothing is left out silently, as it is live.
      # The rule has no width, so it is drawn at the reader's own.
      INC`RECALL: |-
        think [setq(Hidden,u(%!/FUN`HIDDEN,%#))][setq(Folded,0)][setq(Out,)][null(iter(sceneposes(%q<SceneID>,,%q<Count>),if(member(%q<Hidden>,setr(_t,firstof(scenepose(%q<SceneID>,%iL,type),ic))),setq(Folded,inc(%q<Folded>)),if(strlen(setr(_e,u(%!/FUN`POSE`DRAW,%q<_t>,%iL,scenepose(%q<SceneID>,%iL,content),%q<SceneID>,%#))),setq(Out,%q<Out>[if(strlen(%q<Out>),%r)]%q<_e>)))))]; @pemit %#=%q<Out>; @if %q<Folded>={@pemit %#=[notice(SCENE,%q<Folded> [if(eq(%q<Folded>,1),line,lines)] of [itemize(%q<Hidden>)] hidden. +scene/show <type> shows them.)]}
      # The count is validated here rather than left to sceneposes(), which rejects anything below 1
      # with a sentinel this verb would then iterate the WORDS of -- one bogus pose lookup per word,
      # printed at the player. `+scene/recall 0` failed differently and just as badly: "0" is falsy,
      # so the bare @assert broke with no message at all, which is indistinguishable from a command
      # that does not exist. isint() covers the non-numeric spelling, gt() the zero and negative ones.
      DATA`DENY_BAD_COUNT: |-
        How many poses? Give a whole number of 1 or more, or just +scene/recall for the last few.
      CMD`RECALL:
        value: |-
          $(?is)^\+scene/rec(?\:a(?\:l(?\:l)?)?)?(?\: +(.*))?$: think [setq(Named,t(pos(chr(61),%1)))][setq(SceneID,if(cand(%q<Named>,strlen(setr(_i,trim(before(%1,chr(61)))))),%q<_i>,scenefocus(%#)))][setq(Count,trim(if(%q<Named>,after(%1,chr(61)),%1)))]; @assert not(strmatch(%q<SceneID>,#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert or(not(strlen(%q<Count>)),and(isint(%q<Count>),gt(%q<Count>,0)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_BAD_COUNT)],warn)]; @assert words(sceneposes(%q<SceneID>))=@pemit %#=[notice(SCENE,Scene %q<SceneID> has no poses yet.)]; think [setq(Count,firstof(%q<Count>,max(1,mul(get(%!/DATA`RECALL_ROUNDS),words(scenemembers(%q<SceneID>))))))]; @include %!/INC`RECALL
        flags: [REGEXP]
      # The whole log of the focused scene, or of the one named, under a rule with its title.
      CMD`LOG:
        value: |-
          $(?is)^\+scene/lo(?\:g)?(?\: +(.*))?$: think [setq(SceneID,if(strlen(trim(%1)),trim(%1),scenefocus(%#)))][setq(Count,)]; @assert not(strmatch(%q<SceneID>,#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert words(sceneposes(%q<SceneID>))=@pemit %#=[notice(SCENE,Scene %q<SceneID> has no poses yet.)]; @pemit %#=[rule(Scene %q<SceneID>: [u(%!/FUN`LIST_TITLE,%q<SceneID>)],,json(object,title,"left"))]; @include %!/INC`RECALL
        flags: [REGEXP]

      # ---- pose tracker (+pot): query-on-run turn tracker for the focused scene --
      # No hooks, no state: rebuilt each run from the recorded poses. A member's last
      # pose time is sceneposes(scene,member,1) -> scenepose(...,createdat) (Unix-millis,
      # diffed against the clock). Members are ordered OLDEST-pose-first, so whoever is
      # most overdue sits at the top, flagged up-next.
      FUN`POT_MS: |-
        firstof(scenepose(%0,sceneposes(%0,%1,1),createdat),0)
      # secs(), not msecs(): msecs(<object>) is an OBJECT's modification time in seconds (help
      # MSECS), so msecs() with no argument located an object named "" and every Idle cell read
      # "#-1 ARGUMENT MUST BE INTEGER". POT_MS is milliseconds, so the stored value converts down.
      FUN`POT_IDLE: |-
        switch(setr(ms,u(%!/FUN`POT_MS,%0,%1)),0,-,[timestring(sub(secs(),div(%q<ms>,1000)))] ago)
      FUN`POT_KEY: |-
        [rjust(u(%!/FUN`POT_MS,%0,%1),15,0)]~%1
      # %0 the scene, %1 its members oldest pose first.
      FUN`POT_TABLE: |-
        [datacolumns(u(%!/FUN`TABLE`OPTS,1|3|4,|12,1|1|2|1,|1),>[ansi(h,#)]%r[iter(%1,inum(0),,%r)],[ansi(h,Name)]%r[iter(%1,[name(%i0)][switch(scenemember(%0,%i0,showas),,,%b%([edit(scenemember(%0,%i0,showas),%r,%b)]%))],,%r)],>[ansi(h,Last pose)]%r[iter(%1,trim(u(%!/FUN`POT_IDLE,%0,%i0)),,%r)],[ansi(h,Turn)]%r[iter(%1,switch(inum(0),1,<- up,),,%r)])]
      # Control flow is guard-then-display: the @assert early-exits (no switch() for output) and leaves
      # %q<SceneID> set for the shared display tail, which is @included with that id. The guard is inline
      # for the same reason the approval guard is — an @assert behind an @include does not stop the caller,
      # so the guard used to print "you are not focused" and then render a tracker for scene "#-1 NOT FOUND".
      INC`DISPLAY`POT: |-
        @pemit %#=[box([u(%!/FUN`POT_TABLE,%0,iter(sort(iter(scenemembers(%0),u(%!/FUN`POT_KEY,%0,%iL))),after(%i0,~)))],Pose Tracker - Scene %0,,u(%!/FUN`FRAME))]%r[words(scenemembers(%0))] in scene - oldest pose is up next
      CMD`POT: |-
        $+pot: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,You are not focused on a scene. Use +scene/join <id> or +scene/create <title>.,warn)]; @include %!/INC`DISPLAY`POT=%q<SceneID>

      # ---- scene browser: tables of scenes ---------------------------------------
      # Volund-style listing: bare `+scene` = active scenes, `+scene/old` = finished, `+scene/mine` =
      # yours. FUN`LIST_RENDER builds the whole box. (Scene DETAILS are `+scene <id>`; scheduled scenes
      # `+scene/upcoming`.) A list longer than the reader's screen comes in pages, and the page is a
      # last switch: +scene/old/2. No page is the first.
      #
      # The title wraps and every other column is nowrap: on a narrow screen Where goes first, then
      # Cast and Status, and an id or a status is never broken across lines.
      FUN`LIST_TITLE: |-
        [switch(setr(ttl,scene(%0,title)),#-1*,\(untitled\),%q<ttl>)]
      # A scene's title in a table is a link to its card: a client that can click a command runs +scene <id>,
      # and every other client sees the title. cmdlink() needs Send_OOB, which this WIZARD object has.
      FUN`LIST_LINK: |-
        [cmdlink(edit(u(%!/FUN`LIST_TITLE,%0),%r,%b),+scene %0,+scene %0)]
      FUN`LIST_TABLE: |-
        [datacolumns(u(%!/FUN`TABLE`OPTS,1|3|4|5,|12,1|1|3|2|2,|1),>[ansi(h,ID)]%r[iter(%0,%i0,,%r)],[ansi(h,Title)]%r[iter(%0,u(%!/FUN`LIST_LINK,%i0),,%r)],[ansi(h,Where)]%r[iter(%0,u(%!/FUN`SCENE_FIELD,%i0,roomname,-),,%r)],>[ansi(h,Cast)]%r[iter(%0,words(scenemembers(%i0)),,%r)],[ansi(h,Status)]%r[iter(%0,scene(%i0,status),,%r)])]
      # Rows a page holds: what fits the reader's screen under the title, headings, rule and footer.
      FUN`LIST_ROWS: |-
        [max(5,sub(height(%#,24),8))]
      FUN`LIST_PAGES: |-
        [add(1,div(sub(max(1,words(%0)),1),u(%!/FUN`LIST_ROWS)))]
      # %0 the filter, %1 its scenes, %2 the page, %3 how many pages, %4 the command that lists them.
      FUN`LIST_RENDER: |-
        [setq(sl,extract(%1,add(1,mul(sub(%2,1),u(%!/FUN`LIST_ROWS))),u(%!/FUN`LIST_ROWS)))][box([if(words(%q<sl>),u(%!/FUN`LIST_TABLE,%q<sl>),No scenes.)],Scenes: %0,,u(%!/FUN`FRAME))]%r[words(%1)] [if(eq(words(%1),1),scene,scenes)][if(gt(%3,1),%b-%bpage %2 of %3[if(lt(%2,%3),%b-%b%4/[add(%2,1)])])]
      # %q<Filter> the scenelist() filter, %q<Page> the page as typed (empty for the first), %q<Switch>
      # the switch whose usage line answers a page of 0.
      INC`LIST: |-
        think [setq(Page,strfirstof(%q<Page>,1))][setq(lst,scenelist(%q<Filter>))][setq(pages,u(%!/FUN`LIST_PAGES,%q<lst>))]; @assert gt(%q<Page>,0)=@pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`%q<Switch>)],warn)]; @assert lte(%q<Page>,%q<pages>)=@pemit %#=[notice(SCENE,There [if(gt(%q<pages>,1),are %q<pages> pages,is one page)] - you asked for page %q<Page>.,warn)]; @pemit %#=[u(%!/FUN`LIST_RENDER,%q<Filter>,%q<lst>,%q<Page>,%q<pages>,+scene[if(strmatch(%q<Switch>,LIST),,/[lcstr(%q<Switch>)])])]
      # +scene and +scene/list.
      CMD`BROWSE:
        value: |-
          $(?is)^\+scene(?\:/li(?\:s(?\:t)?)?)?(?\:/(\d+))?$: think [setq(Filter,active,Page,%1,Switch,LIST)]; @include %!/INC`LIST
        flags: [REGEXP]
      CMD`OLD:
        value: |-
          $(?is)^\+scene/ol(?\:d)?(?\:/(\d+))?$: think [setq(Filter,finished,Page,%1,Switch,OLD)]; @include %!/INC`LIST
        flags: [REGEXP]
      CMD`MINE:
        value: |-
          $(?is)^\+scene/mi(?\:n(?\:e)?)?(?\:/(\d+))?$: think [setq(Filter,mine,Page,%1,Switch,MINE)]; @include %!/INC`LIST
        flags: [REGEXP]

      # ---- scheduling (+scene/schedule ...): roomless future scenes --------------
      # FUN`SCHED_WHEN(<when>) is UTC milliseconds, or #-1 when it can't be read. It takes what +job/due takes,
      # so players have one way to write a time: +<n>h, +<n>d or +<n>w from now, or a date convtime() reads
      # (2026-12-31 20:00); and epoch seconds, which the portal sends. Every verb that takes a time refuses one
      # it can't read, or one already past, before it writes anything: a scene scheduled for no time, or for
      # one gone, was on no list its owner could find it on.
      # Rescheduling a running scene pauses it: a scene with a time to come is not live. The schedule
      # (scenelist(scheduled)) lists every paused scene, with or without a time.
      FUN`SCHED_WHEN: |-
        [setq(_x,edit(trim(lcstr(%0)),+,,%b,))][switch(1,not(strlen(%q<_x>)),#-1,cand(isint(left(%q<_x>,dec(strlen(%q<_x>)))),t(match(h d w,right(%q<_x>,1)))),mul(add(secs(),mul(left(%q<_x>,dec(strlen(%q<_x>))),switch(right(%q<_x>,1),h,3600,w,604800,86400))),1000),isint(trim(%0)),mul(trim(%0),1000),isint(setr(_c,convtime(trim(%0)))),mul(%q<_c>,1000),#-1)]
      CMD`SCHEDULE:
        value: |-
          $(?is)^\+scene/sc(?\:h(?\:e(?\:d(?\:u(?\:l(?\:e)?)?)?)?)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert cand(t(pos(chr(61),%1)),strlen(setr(Title,trim(before(%1,chr(61))))))=@pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`SCHEDULE)],warn)]; @assert isint(setr(At,u(%!/FUN`SCHED_WHEN,after(%1,chr(61)))))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_BAD_TIME)],warn)]; @assert gt(%q<At>,mul(secs(),1000))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_PAST_TIME)],warn)]; @assert setr(SceneID,scenecreate(,%#,%q<Title>)); @scene/member %q<SceneID>/owner=%#; @scene/set %q<SceneID>/status=scheduled; @scene/set %q<SceneID>/scheduledfor=%q<At>; @pemit %#=[notice(SCENE,Scheduled scene %q<SceneID> "%q<Title>" for [convsecs(div(%q<At>,1000))].,ok)]
        flags: [REGEXP]
      CMD`RESCHEDULE:
        value: |-
          $(?is)^\+scene/res(?\:c(?\:h(?\:e(?\:d(?\:u(?\:l(?\:e)?)?)?)?)?)?)?(?\: +(.*))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert cand(t(pos(chr(61),%1)),strlen(setr(SceneID,trim(before(%1,chr(61))))))=@pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`RESCHEDULE)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert not(match(finished cancelled,setr(st,scene(%q<SceneID>,status))))=@pemit %#=[notice(SCENE,Scene %q<SceneID> is %q<st>. Only a scene still to come can be rescheduled.,warn)]; @assert isint(setr(At,u(%!/FUN`SCHED_WHEN,after(%1,chr(61)))))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_BAD_TIME)],warn)]; @assert gt(%q<At>,mul(secs(),1000))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_PAST_TIME)],warn)]; @scene/set %q<SceneID>/scheduledfor=%q<At>; @scene/set %q<SceneID>/status=[switch(%q<st>,active,paused,%q<st>)]; @pemit %#=[notice(SCENE,Rescheduled scene %q<SceneID> for [convsecs(div(%q<At>,1000))].[if(strmatch(%q<st>,active),%bIt is paused until +scene/start %q<SceneID> resumes it.)],ok)]
        flags: [REGEXP]
      # +scene/unschedule and +scene/cancel take a scene off the schedule for good: its time is cleared
      # and its status is `cancelled`, so it is in no list but the archive. (@scene/delete is the POSE
      # delete; it never removed a scene.) A running scene is ended with +scene/finish instead. An owner can
      # cancel only a scene with no poses in it; one with poses is a wizard's call. Cancelling one again says
      # it already is.
      CMD`UNSCHEDULE:
        value: |-
          $(?is)^\+scene/(?\:uns(?\:c(?\:h(?\:e(?\:d(?\:u(?\:l(?\:e)?)?)?)?)?)?)?|ca(?\:n(?\:c(?\:e(?\:l)?)?)?)?) (.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert u(%!/FUN`OWNS,%#,%1)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @assert not(strmatch(scene(%1,status),cancelled))=@pemit %#=[notice(SCENE,Scene %1 is already cancelled.,warn)]; @assert or(orflags(%#,Wz),not(match(active finished,scene(%1,status))))=@pemit %#=[notice(SCENE,Scene %1 is [scene(%1,status)]. Only a scene that has not started can be cancelled.,warn)]; @assert or(orflags(%#,Wz),not(scene(%1,posecount)))=@pemit %#=[notice(SCENE,Scene %1 has poses in it\, so only a wizard can cancel it.,error)]; @scene/set %1/scheduledfor=; @scene/set %1/status=cancelled; @pemit %#=[notice(SCENE,Cancelled scene %1.,ok)]
        flags: [REGEXP]
      # The schedule reads like a calendar: scenes in time order, the day named on the first scene of
      # each day, the scenes with no time last. One table, so the columns line up from day to day.
      FUN`SCHED_TABLE: |-
        [setq(pday,)][datacolumns(u(%!/FUN`TABLE`OPTS,1|2|3|5|6,|||12,1|1|1|1|2|2,|||1),[ansi(h,Day)]%r[iter(%0,if(strmatch(setr(day,u(%!/FUN`SCHED_DAY,%i0)),%q<pday>),,[setq(pday,%q<day>)]%q<day>),,%r)],[ansi(h,Time)]%r[iter(%0,switch(setr(sw,scene(%i0,scheduledfor)),,-,timefmt($H:$M,div(%q<sw>,1000))),,%r)],>[ansi(h,ID)]%r[iter(%0,%i0,,%r)],[ansi(h,Title)]%r[iter(%0,u(%!/FUN`LIST_LINK,%i0),,%r)],[ansi(h,Status)]%r[iter(%0,u(%!/FUN`SCHED_STATUS,%i0),,%r)],>[ansi(h,RSVP)]%r[iter(%0,words(scenemembers(%i0)),,%r)])]
      # A scheduled scene whose time has passed without it starting reads "late", as on the portal.
      FUN`SCHED_STATUS: |-
        [setq(sf,scene(%0,scheduledfor))][if(cand(strmatch(setr(st,scene(%0,status)),scheduled),strlen(%q<sf>),lt(%q<sf>,mul(secs(),1000))),late,%q<st>)]
      # The day a scene falls on: "Sat Dec 12", with the year only when it is not this one.
      FUN`SCHED_DAY: |-
        [switch(setr(sw,scene(%0,scheduledfor)),,No time set,[timefmt($a $b,setr(ss,div(%q<sw>,1000)))] [add(timefmt($d,%q<ss>),0)][if(neq(timefmt($Y,%q<ss>),timefmt($Y,secs())),%b[timefmt($Y,%q<ss>)])])]
      # How far ahead +scene/upcoming looks unless asked for more. The portal's schedule shows them all.
      DATA`SCHEDULE_DAYS: |-
        30
      DATA`DENY_BAD_DAYS: |-
        How many days ahead? Give a whole number of 1 or more, or all.
      # FUN`SCHED_RENDER(<days>|all). scenelist(upcoming) is the schedule in time order, untimed scenes
      # last, without a scene more than an hour past its time that never started, as on the portal.
      # The window keeps every scene due before its end: one a little past its time is "late" but may
      # still start, and an untimed one has no time to be beyond it. In
      # FUN`SCHED_TABLE, %q<pday> is the day of the row before, so a day is named only where it changes.
      FUN`SCHED_RENDER: |-
        [setq(all,scenelist(upcoming))][setq(lim,if(isint(%0),mul(add(secs(),mul(%0,86400)),1000)))][setq(lst,if(strlen(%q<lim>),squish(iter(%q<all>,if(lt(firstof(scene(%i0,scheduledfor),0),%q<lim>),%i0))),%q<all>))][box([if(words(%q<lst>),u(%!/FUN`SCHED_TABLE,%q<lst>),Nothing is scheduled[if(isint(%0),%bin the next %0 days)].)],Scheduled Scenes,,u(%!/FUN`FRAME))]%r[u(%!/FUN`SCHED_FOOT,%0,words(%q<lst>),sub(words(%q<all>),words(%q<lst>)))]
      # "2 in the next 30 days", and how to see the rest when the window hides some.
      FUN`SCHED_FOOT: |-
        [if(isint(%0),%1 in the next %0 days[if(%2,[chr(44)] %2 later: +scenes <days>)],%1 scheduled)]
      # +scene/upcoming [<days>|all], and the names other games use for it: +scenes, +events,
      # +scenes/upcoming, +events/upcoming. One regexp pattern, so the aliases and the command cannot drift.
      CMD`UPCOMING:
        value: |-
          $(?is)^\+(?\:scene/up(?\:c(?\:o(?\:m(?\:i(?\:n(?\:g)?)?)?)?)?)?|(?\:scenes|events)(?\:/upcoming)?)(?\: +(.+))?$: @assert or(not(strlen(%1)),strmatch(%1,all),and(isint(%1),gt(%1,0)))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_BAD_DAYS)],warn)]; @pemit %#=[u(%!/FUN`SCHED_RENDER,firstof(%1,get(%!/DATA`SCHEDULE_DAYS)))]
        flags: [REGEXP]

      # ---- participation (+scene/deactivate | /activate): pause/resume w/o leaving -
      # /deactivate clears your focus so poses stop recording, but keeps your membership
      # (and your existing poses); /activate re-focuses you so capture resumes. Softer
      # than join/leave, which add/remove membership.
      CMD`DEACTIVATE:
        value: |-
          $(?is)^\+scene/dea(?\:c(?\:t(?\:i(?\:v(?\:a(?\:t(?\:e)?)?)?)?)?)?)?$: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @scene/focus %#=; @pemit %#=[notice(SCENE,Deactivated scene %q<SceneID> - still a member\, poses paused. +scene/activate %q<SceneID> to resume.,ok)]
        flags: [REGEXP]
      CMD`ACTIVATE:
        value: |-
          $(?is)^\+scene/ac(?\:t(?\:i(?\:v(?\:a(?\:t(?\:e)?)?)?)?)?)? (.*?)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @if not(match(owner participant,scenemember(%1,%#,role)))={@scene/member %1/participant=%#}; @scene/focus %#=%1; @pemit %#=[notice(SCENE,Activated scene %1 - your poses are recorded again.,ok)]
        flags: [REGEXP]

      # ---- summary + info card --------------------------------------------------
      # SCENE_FIELD(scene,field,default) reads a field, substituting <default> for an unset/#-1 result.
      # +scene <id> guards the id arg via @assert/@include, sets %q<SceneID>, then
      # @includes the shared display tail — no switch() picks the output.
      FUN`SCENE_FIELD: |-
        switch(setr(val,scene(%0,%1)),#-1*,%2,,%2,%q<val>)

      # Scene timestamps are Unix MILLIseconds; timefmt() wants seconds.
      #
      # This trimmed the last three digits as text for a while, because div() was 32-bit and answered
      # #-1 ARGUMENTS MUST BE INTEGERS for any real timestamp. #857 made the integer functions 64-bit,
      # so the arithmetic says what it means again.
      FUN`WHEN: |-
        [timefmt($b $d $I:$M$p,div(%0,1000))]

      # The scene's page on this game's own website, worked out rather than stored: mud_url is the
      # standard config for a game's web address, and the path follows from the id. Empty when the game
      # has not set one, because there is no address to guess.
      FUN`URL: |-
        [switch(setr(su,config(mud_url)),,,[u(%!/FUN`URL_TEXT,[u(%!/FUN`NO_TRAILING_SLASH,%q<su>)]/scenes/%0)])]

      # The address as a link. tagwrap() is markup, not text: Pueblo, MXP and the portal receive the
      # anchor (<A HREF> is the same in both dialects), and every other client the bare address.
      FUN`URL_TEXT: |-
        [tagwrap(a,href="%0",%0)]

      # mud_url is written both ways by different admins, and joining a trailing slash to a leading
      # one gives a path no server answers.
      FUN`NO_TRAILING_SLASH: |-
        [switch(right(%0,1),/,[left(%0,sub(strlen(%0),1))],%0)]
      # The card's fields. fields() takes its pairs as arguments, and an empty pair still draws a line,
      # so the URL row is in one call or the other rather than blanked.
      FUN`INFO`FIELDS: |-
        [setq(sw,scene(%0,scheduledfor))][if(strlen(setr(url,u(%!/FUN`URL,%0))),fields(,Status,scene(%0,status),Owner,scene(%0,ownername),Where,u(%!/FUN`SCENE_FIELD,%0,roomname,No room yet),Created,u(%!/FUN`WHEN,scene(%0,startedat)),Scheduled,if(strlen(%q<sw>),u(%!/FUN`WHEN,%q<sw>),-),Watchers,switch(scene(%0,public),1,Anyone,Members only),URL,%q<url>),fields(,Status,scene(%0,status),Owner,scene(%0,ownername),Where,u(%!/FUN`SCENE_FIELD,%0,roomname,No room yet),Created,u(%!/FUN`WHEN,scene(%0,startedat)),Scheduled,if(strlen(%q<sw>),u(%!/FUN`WHEN,%q<sw>),-),Watchers,switch(scene(%0,public),1,Anyone,Members only)))]
      INC`DISPLAY`INFO: |-
        @pemit %#=[box([u(%!/FUN`INFO`FIELDS,%0)]%r[rule(Pitch)]%r[u(%!/FUN`SCENE_FIELD,%0,summary,-)]%r[rule(Players)]%r[u(%!/FUN`CAST`TABLE,%0,scenemembers(%0))],Scene %0: [u(%!/FUN`LIST_TITLE,%0)],,u(%!/FUN`FRAME))]
      # +scene/title [<id>=]<text> and +scene/pitch [<id>=]<text>: the focused scene, or the one named.
      # The id is digits, so a title or pitch that merely has an = in it is not taken for one.
      CMD`TITLE:
        value: |-
          $(?is)^\+scene/ti(?\:t(?\:l(?\:e)?)?)? (?\:(\d+)=)?(.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @scene/set %q<SceneID>/title=%2; @pemit %#=[notice(SCENE,Scene %q<SceneID> is now titled: %2,ok)]
        flags: [REGEXP]
      CMD`PITCH:
        value: |-
          $(?is)^\+scene/pi(?\:t(?\:c(?\:h)?)?)? (?\:(\d+)=)?(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_APPROVAL)],error)]; @assert not(strmatch(setr(SceneID,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NO_FOCUS)],warn)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %q<SceneID>,warn)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[notice(SCENE,[get(%!/DATA`DENY_NOT_OWNER)],error)]; @scene/set %q<SceneID>/summary=%2; @pemit %#=[notice(SCENE,Pitch set for scene %q<SceneID>.,ok)]
        flags: [REGEXP]
      # Scene DETAILS card. `+scene <id>` and `+scene/info <id>` are the same question asked two
      # ways, so they run the same renderer: naming an id has always meant "tell me about this one".
      #
      # This replaced +scene/who, which could only answer who was in the cast. Somebody asking about a
      # scene wants where it is, what it is about and whether anyone may watch as well — and once the
      # card carries the roster there is nothing left for a second verb to say.
      #
      # Cast and Members are both here because they answer different questions: Cast is the personas
      # that have spoken (scenecast, deduplicated, what a reader of the log sees) and Members is the
      # characters with their roles. A persona is not a character, so one cannot stand in for the
      # other — an actor posing under two names appears once per name in Cast and once in Members.
      # +scene <id>, +scene/info <id> and +event <id>; a title, or the start of one, finds the scene too
      # (FUN`FIND), so a player need not look up its number first.
      CMD`SHOW:
        value: |-
          $(?is)^\+(?\:scene|scene/i(?\:n(?\:f(?\:o)?)?)?|event) (.+)$: think [setq(Found,u(%!/FUN`FIND,%1))]; @assert words(%q<Found>)=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @assert eq(words(%q<Found>),1)=@pemit %#=[notice(SCENE,More than one scene is called that: [itemize(%q<Found>)]. Give its number.,warn)]; @assert not(strmatch(scene(setr(SceneID,%q<Found>),status),#-1*))=@pemit %#=[notice(SCENE,No such scene: %1,warn)]; @include %!/INC`DISPLAY`INFO=%q<SceneID>
        flags: [REGEXP]
      # The scene %0 names: its number, or the scenes whose title is %0, or else starts with it, among the
      # recent and scheduled scenes the reader can see. Several ids when it names more than one.
      FUN`FIND: |-
        [setq(_t,trim(%0))][if(isint(%q<_t>),%q<_t>,u(%!/FUN`FIND`TITLE,%q<_t>))]
      FUN`FIND`TITLE: |-
        [setq(_c,setunion(scenelist(recent),scenelist(scheduled)))][setq(_e,squish(iter(%q<_c>,if(strmatch(scene(%i0,title),%0),%i0))))][if(words(%q<_e>),%q<_e>,squish(iter(%q<_c>,if(strmatch(scene(%i0,title),%0*),%i0))))]

      # +scene/help is the thing a player actually types when they are lost, and before +help
      # existed it was a bare Huh? — issue #860 opens on exactly that transcript. It does not
      # duplicate the topic; it hands the reader the one command that reads it.
      CMD`HELP:
        value: |-
          $(?is)^\+scene/he(?\:l(?\:p)?)?$: @pemit %#=[notice(SCENE,Scene help lives under +help. Try: +help scene)]
        flags: [REGEXP]

      # ---- switches and usage lines ---------------------------------------------------
      # Every verb takes a unique prefix of its switch, as PennMUSH players expect: +scene/lis is
      # +scene/list. Each pattern spells its switch as the shortest prefix no other switch here shares,
      # followed by the rest of the word optionally ((?:...)? groups, which capture nothing, so the
      # arguments keep their numbers). A new switch goes into DATA`SWITCHES, and every switch it shares
      # a prefix with needs its pattern lengthened to match.
      #
      # A +scene/<switch> line no verb matches -- an argument left off, a switch mistyped, or a prefix
      # several switches share -- would be a bare Huh?. CMD`USAGE matches every +scene/<switch> line,
      # and stays quiet when scan() finds another command that takes it (every pattern that matches a
      # line runs, so it cannot rely on matching last). Otherwise it answers with the switch's usage
      # line, or the switches the prefix could mean.
      DATA`SWITCHES: |-
        activate as cancel create deactivate delete edit emit finish help hide info join leave list log mine move narrate old ooc pause pitch pose private public recall redo reschedule rewrite rsvp say schedule semipose show start tag title type types undo unrsvp unschedule untag upcoming
      DATA`USAGE`ACTIVATE: |-
        +scene/activate <id>
      DATA`USAGE`AS: |-
        +scene/as <name>, or +scene/as on its own to pose under your own name again
      DATA`USAGE`CANCEL: |-
        +scene/cancel <id>
      DATA`USAGE`CREATE: |-
        +scene/create <title>
      DATA`USAGE`DEACTIVATE: |-
        +scene/deactivate
      DATA`USAGE`DELETE: |-
        +scene/delete <pose>
      DATA`USAGE`EDIT: |-
        +scene/edit <pose>=<old>^^^<new>
      DATA`USAGE`EMIT: |-
        +scene/emit <id>=<text>
      DATA`USAGE`FINISH: |-
        +scene/finish [<id>]
      DATA`USAGE`HELP: |-
        +scene/help
      DATA`USAGE`HIDE: |-
        +scene/hide <type>, or +scene/hide on its own to see what you hide
      DATA`USAGE`INFO: |-
        +scene/info <id or title>
      DATA`USAGE`JOIN: |-
        +scene/join <id>
      DATA`USAGE`LEAVE: |-
        +scene/leave
      DATA`USAGE`LIST: |-
        +scene/list[/<page>]
      DATA`USAGE`LOG: |-
        +scene/log [<id>]
      DATA`USAGE`MINE: |-
        +scene/mine[/<page>]
      DATA`USAGE`MOVE: |-
        +scene/move <pose>=<after>
      DATA`USAGE`NARRATE: |-
        +scene/narrate <id>=<text>
      DATA`USAGE`OLD: |-
        +scene/old[/<page>]
      DATA`USAGE`OOC: |-
        +scene/ooc <id>=<text>
      DATA`USAGE`PAUSE: |-
        +scene/pause [<id>][=<when>]
      DATA`USAGE`PITCH: |-
        +scene/pitch [<id>=]<text>
      DATA`USAGE`POSE: |-
        +scene/pose <id>=<text>
      DATA`USAGE`PRIVATE: |-
        +scene/private [<id>]
      DATA`USAGE`PUBLIC: |-
        +scene/public [<id>]
      DATA`USAGE`RECALL: |-
        +scene/recall [<n>], or +scene/recall <id>=[<n>] for another scene
      DATA`USAGE`REDO: |-
        +scene/redo <pose>
      DATA`USAGE`RESCHEDULE: |-
        +scene/reschedule <id>=<when>, where <when> is a date and time such as 2026-12-31 20:00, or a time from now such as +3d
      DATA`USAGE`REWRITE: |-
        +scene/rewrite <pose>=<text>
      DATA`USAGE`RSVP: |-
        +scene/rsvp <id>
      DATA`USAGE`SAY: |-
        +scene/say <id>=<text>
      DATA`USAGE`SCHEDULE: |-
        +scene/schedule <title>=<when>, where <when> is a date and time such as 2026-12-31 20:00, or a time from now such as +3d
      DATA`USAGE`SEMIPOSE: |-
        +scene/semipose <id>=<text>
      DATA`USAGE`SHOW: |-
        +scene/show <type>
      DATA`USAGE`START: |-
        +scene/start [<id>]
      DATA`USAGE`TAG: |-
        +scene/tag <id>
      DATA`USAGE`TITLE: |-
        +scene/title [<id>=]<text>
      DATA`USAGE`TYPE: |-
        +scene/type <type>; staff also +scene/type/add <type>=<name>, +scene/type/set <type>/<field>=<value> and +scene/type/remove <type>
      DATA`USAGE`TYPES: |-
        +scene/types
      DATA`USAGE`UNDO: |-
        +scene/undo <pose>
      DATA`USAGE`UNRSVP: |-
        +scene/unrsvp <id>
      DATA`USAGE`UNSCHEDULE: |-
        +scene/unschedule <id>
      DATA`USAGE`UNTAG: |-
        +scene/untag <id>
      DATA`USAGE`UPCOMING: |-
        +scene/upcoming [<days>|all]
      CMD`USAGE:
        value: |-
          $(?is)^\+scene/([^\s=]*)(.*)$: @break words(squish(iter(scan(%#,%0),if(strmatch(after(%i0,/),CMD`USAGE),,%i0)))); think [setq(full,u(%!/FUN`SWITCH,lcstr(%1)))]; @assert strlen(%q<full>)=@pemit %#=[notice(SCENE,u(%!/FUN`NO`SWITCH,lcstr(%1)),warn)]; @pemit %#=[notice(SCENE,[get(%!/DATA`USAGE`[ucstr(%q<full>)])],warn)]
        flags: [REGEXP]
      # The switch %0 names: itself, or the one switch it is the start of; nothing otherwise.
      FUN`SWITCH: |-
        [if(t(member(get(%!/DATA`SWITCHES),%0)),%0,if(eq(words(setr(_m,u(%!/FUN`PREFIXED,%0))),1),%q<_m>))]
      FUN`PREFIXED: |-
        [squish(iter(get(%!/DATA`SWITCHES),if(strmatch(%i0,%0*),%i0)))]
      FUN`NO`SWITCH: |-
        [switch(1,not(strlen(%0)),+scene needs a switch after the /.,gt(words(setr(_m,u(%!/FUN`PREFIXED,%0))),1),+scene/%0 could be [itemize(iter(%q<_m>,+scene/%i0),,or)].,+scene has no /%0 switch.)] +help scene lists the commands.

      # ---- lifecycle: (re-)establish the three OVERRIDE capture hooks -----------
      # PennMUSH form: @hook/<type> <command> = <object>, <attribute> (RSArgs comma-split).
      # /inline: the capture stands in for the built-in command, so it runs in place as the built-in
      # would. Without it the matched $-command is queued (run_cmd_hook, src/command.c) and the room
      # sees the pose after the rest of the poser's action list.
      AINSTALL: |-
        @teleport %!=#2; @trigger %!/STARTUP
      STARTUP: |-
        @hook/override/inline POSE=%!,CMD`CAPTURE`POSE; @hook/override/inline SAY=%!,CMD`CAPTURE`SAY; @hook/override/inline SEMIPOSE=%!,CMD`CAPTURE`SEMI; @hook/override/inline @EMIT=%!,CMD`CAPTURE`EMIT

  # ---- help storage -------------------------------------------------------
  # An ordinary, unflagged thing holding the +help topics, deliberately NOT the Scene Logger: the
  # Logger must be WIZARD, and the librarian cannot u() a privileged object's attribute. See
  # plus-help's README for that rule and for how an evaluated body is escaped.
  - ref: scene_help
    type: thing
    name: Scene Help
    attributes:
      HELP: |-
        Shared scenes: joining one, posing in it, and reading the log.

      # Cross-references, declared: one SEE leaf per topic at the path it sits at under HELP, a
      # "|"-separated list of topic names. Subtopics are not listed -- HELP`SCENE`JOIN is already a
      # child of HELP`SCENE and +help derives that from the tree.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SCENE: |-
        pot
      SEE`SCENE`JOIN: |-
        scene pose|pot
      SEE`SCENE`POSE: |-
        scene join
      SEE`SCENE`PITCH: |-
        scene privacy
      SEE`SCENE`PRIVACY: |-
        scene join|scene pitch
      SEE`SCENE`SCHEDULE: |-
        scene join
      SEE`SCENE`TYPES: |-
        scene pose
      SEE`POT: |-
        scene pose|scene join
      HELP`SCENE: |-
        A **scene** is a shared, logged piece of roleplay. Anyone in the room can be in one; the log
        is readable afterwards, in-game and in the portal.

        ## Getting in

        - `+scene` \(or `+scene/list`\) — the scenes running now
        - `+scene/old` — the finished ones; `+scene/mine` — yours
        - `+scene <id>` \(or `+event <id>`\) — what a scene is, where it is, and who is in it. Its
          title, or the start of it, works as well as its number
        - `+scene/log \[<id>\]` — read a scene's log, your focused one or any you can see
        - `+scene/join <id>` — join it and make it your focus
        - `+scene/leave` — stop posing into it

        A list longer than your screen comes in pages, and the page is a last switch:
        `+scene/old/2` is the second page of finished scenes.

        Once you have joined, ordinary `pose`, `say` and `@emit` in that room are recorded. You do
        not have to use a special command to speak.

        ## Running one

        - `+scene/create <title>` — start one here and focus it
        - `+scene/title \[<id>=\]<text>` — rename it
        - `+scene/pitch \[<id>=\]<text>` — say what it is about, so people can decide to come
        - `+scene/pause` — stop it for now; it leaves the live list for the schedule
        - `+scene/start` — resume a paused scene
        - `+scene/finish` — close it. A finished or cancelled scene stays that way
        - `+scene/finish <id>` — close a scene by id. Its owner can, and so can anyone holding the
          `scene.close` permission, which this package defines; allow it on a role, such as helper, with
          `@role/allow helper=scene.close`
      HELP`SCENE`JOIN: |-
        `+scene/join <id>` puts you in a scene and makes it your **focus** — the scene your poses are
        recorded into. `+scene` lists the ids.

        - `+scene/tag <id>` — RSVP to a scheduled scene without joining it yet
        - `+scene/untag <id>` — withdraw the RSVP
        - `+scene/leave` — leave the focused scene; if you never posed, you leave no trace
        - `+scene/deactivate` — stay a member but stop recording; `+scene/activate <id>` resumes

        Joining needs an approved character.
      HELP`SCENE`POSE: |-
        With a scene focused, ordinary `pose`, `say`, `semipose` and `@emit` in its room are captured
        as you write them — nothing extra to type.

        The explicit forms name the scene instead of inferring it from the room, which is what the
        portal's compose box sends. The room sees them as it sees a captured pose:

        - `+scene/pose <id>=<text>` · `+scene/say <id>=<text>` · `+scene/semipose <id>=<text>`
        - `+scene/emit <id>=<text>` · `+scene/ooc <id>=<text>` \(out of character\)
        - `+scene/narrate <id>=<text>` — the world speaking rather than a character: weather, a crowd, a
          storyteller's line
        - `+scene/as <name>` — pose under a different name from here on; `+scene/as` on its own goes back
          to your own name

        ## Fixing a pose

        These work on your own poses, and a wizard can use them on anyone's:

        - `+scene/edit <pose>=<old>^^^<new>` — fix a typo, for example `+scene/edit 12=teh^^^the`
        - `+scene/rewrite <pose>=<text>` — replace the whole text \(the portal's Edit\)
        - `+scene/undo <pose>` · `+scene/redo <pose>` — step back and forward through its edits
        - `+scene/delete <pose>` — take it out of the log

        The scene's owner can also put a pose somewhere else in the log with `+scene/move <pose>=<after>`.

        ## Reading the log

        - `+scene/recall <n>` — the last `<n>` poses of your focused scene; bare `+scene/recall`
          gives you two rounds of the room \(twice the size of the cast\)
        - `+scene/recall <id>=<n>` — the same for any scene you can see
        - `+scene/log \[<id>\]` — the whole log

        Each pose is introduced by a rule naming who posed it and its number, which is the `<pose>` the
        commands above take. Each line is drawn as its type draws it, so an out-of-character line starts with
        `<OOC>`. `+scene/hide <type>` leaves a type out of your recall and log; see `+help scene types`.
      HELP`SCENE`PITCH: |-
        `+scene/pitch <text>` sets the summary shown on a scene's card and its page on the website. It is
        how someone browsing decides whether to come. `+scene/pitch <id>=<text>` sets it on a scene you
        own without focusing it, and `+scene/title \[<id>=\]<text>` renames one the same way.

        Only the scene's owner \(or staff\) can set it.
      HELP`SCENE`PRIVACY: |-
        Scenes are **public** by default: they appear in `+scene` and their log is readable.

        - `+scene/private \[<id>\]` — hide the focused scene, or the one named, and its log from everyone
          but its members
        - `+scene/public \[<id>\]` — put it back

        Only the scene's owner \(or staff\) can change this. Privacy is about who may *read*; who may
        *pose* is decided by who has joined.
      HELP`SCENE`SCHEDULE: |-
        A scene can be announced before it happens, so people can plan around it.

        - `+scene/schedule <title>=<when>` — announce one. `<when>` is a date and time, such as
          `+scene/schedule Market day=2026-12-31 20:00`, or a time from now: `+3d`, `+12h` or `+1w`
        - `+scene/upcoming` \(or `+scenes`, `+events`\) — what is scheduled in the next 30 days, by day,
          and how many have RSVP'd
        - `+scene/upcoming <days>` \(or `+scenes <days>`\) — look further ahead; `all` for everything
        - `+scene/tag <id>` \(or `+scene/rsvp <id>`\) — RSVP; `+scene/untag <id>` \(`+scene/unrsvp`\) withdraws it
        - `+scene/reschedule <id>=<when>` · `+scene/unschedule <id>` \(or `+scene/cancel <id>`\)
        - `+scene/pause \[<id>\]\[=<when>\]` — pause a running scene, and optionally give it a new time
        - `+scene/start \[<id>\]` — start a scheduled scene here, or resume a paused one

        Rescheduling a running scene pauses it. A scheduled or paused scene records nothing and is not
        listed as live until its owner starts it. A finished or cancelled scene can't be rescheduled.
      HELP`SCENE`TYPES: |-
        Every line in a scene has a **type**: in character \(`ic`\), out of character \(`ooc`\), narration,
        and whatever else the game adds, such as `radio`. The type decides how the line looks, here and in
        the portal, and you can hide the ones you do not want to read.

        - `+scene/types` — every type, what it looks like, and whether you hide it
        - `+scene/type <type>` — one type in full
        - `+scene/hide <type>` — leave that type out of your `+scene/recall` and `+scene/log`; a note
          under the recall says how many lines it left out. `+scene/hide` on its own lists what you hide
        - `+scene/show <type>` — put it back

        Your choice is kept on your character, and the portal's Show menu reads the same one.

        ## Changing types

        Staff holding the `layout.admin` permission can add and change types:

        - `+scene/type/add <type>=<name>` — a new type, named for people. The type is 1 to 32 letters,
          digits, `-` and `_`
        - `+scene/type/set <type>/<field>=<value>` — one field:
          - `label` — its name
          - `presentation` — how the portal lays it out: `prose` \(portrait, name and text\), `band` \(a
            tinted strip\), `message` \(a bubble with a header, for radios and texts\), `aside` \(centred
            and italic, for narration\) or `notice` \(one dim line\)
          - `tone` — a theme colour: `foreground`, `primary`, `secondary`, `tertiary`, `muted`,
            `success`, `warning`, `error` or `info`. Each reader sees it in their own theme
          - `icon` — `radio`, `phone`, `chat`, `dice`, `book`, `scroll`, `megaphone`, `eye`, `mask`,
            `music`, `star` or `bolt`
          - `hidden` — `yes` to start hidden for anyone who has not chosen
          - `order` — its place in lists, lowest first
        - `+scene/type/remove <type>` — remove it; its lines then read as in character

        How a type reads in a terminal is softcode, `` TYPE`<TYPE>`FORMAT `` on the Scene Logger, which
        only someone controlling the logger can set. It is given the pose id as `%%0`, the reader as
        `%%1`, the line as `%%2` and the scene id as `%%3`, and returns the line that reader sees, or
        nothing to hide it from them. Use `tone\(\)` for colour, so readers get their own theme's:

        `` &TYPE`OOC`FORMAT <logger>=\[tone\(muted,<OOC %%3> %%2\)\] ``

        A `prose` or `aside` type is shown under a line naming who posed, the pose and the scene. A
        `band`, `message` or `notice` type has no line: it is one line of its own, so its format
        should say the scene, as the shipped `ooc` one does: `<OOC` followed by a middle dot and the
        scene id, then `>`. A type with no format is shown that way too, with its name.
      HELP`POT: |-
        `+pot` — "pose tracker" — shows who is in your focused scene, how long since each of them
        last posed, so a table can tell whose turn it is.

        It needs a focused scene: `+scene/join <id>` or `+scene/create <title>` first.

  # ---- +help registration ---------------------------------------------------
  # Attach mode: one leaf on the librarian saying "scene's topics live on the Scene Logger". The
  # package manager writes it at install and clears it at uninstall, so the librarian's registry
  # cannot drift from what is actually installed — there is nothing to keep in sync by hand.
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`SCENE: |-
        {{scene_help}}

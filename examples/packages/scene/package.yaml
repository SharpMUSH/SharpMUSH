      # FUN`ZONE(<player>): their zone, or nothing for the game's time.
      FUN`ZONE: |-
        setq(zone_name,get(%0/TZ))[if(cand(strlen(%q<zone_name>),not(strmatch(timefmt($Z,0,%q<zone_name>),#-1*))),%q<zone_name>)]
      # FUN`ZONE`LABEL(<zone>): the zone's name, or "game time".
      FUN`ZONE`LABEL: |-
        if(strlen(%0),%0,game time)
      # FUN`TIMEFMT(<format>, <seconds>, <zone>): timefmt() in <zone>, or in the game's time without one.
      FUN`TIMEFMT: |-
        if(strlen(%2),timefmt(%0,%1,%2),timefmt(%0,%1))
      # FUN`AT(<milliseconds>, <zone>): a time for a message, with whose it is: Wed Oct 21 19:00:00 2026
      # (America/New_York).
      FUN`AT: |-
        if(strlen(%1),convsecs(div(%0,1000),%1),convsecs(div(%0,1000))) [chr(40)][u(%!/FUN`ZONE`LABEL,%1)][chr(41)]

      # Scene timestamps are Unix MILLIseconds; timefmt() wants seconds. FUN`WHEN(<milliseconds>, <zone>).
      #
      # This trimmed the last three digits as text for a while, because div() was 32-bit and answered
      # #-1 ARGUMENTS MUST BE INTEGERS for any real timestamp. #857 made the integer functions 64-bit,
      # so the arithmetic says what it means again.
      FUN`WHEN: |-
        u(%!/FUN`TIMEFMT,$b $d $I:$M$p,div(%0,1000),%1)

      # The scene's page on this game's own website, worked out rather than stored: mud_url is the
      # standard config for a game's web address, and the path follows from the id. Empty when the game
      # has not set one, because there is no address to guess.
      FUN`URL: |-
        switch(setr(url_base,config(mud_url)),,,u(%!/FUN`URL`TEXT,u(%!/FUN`URL`NOTRAILINGSLASH,%q<url_base>)/scenes/%0))

      # The address as a link. tagwrap() is markup, not text: Pueblo, MXP and the portal receive the
      # anchor (<A HREF> is the same in both dialects), and every other client the bare address.
      FUN`URL`TEXT: |-
        tagwrap(a,href="%0",%0)

      # mud_url is written both ways by different admins, and joining a trailing slash to a leading
      # one gives a path no server answers.
      FUN`URL`NOTRAILINGSLASH: |-
        switch(right(%0,1),/,left(%0,sub(strlen(%0),1)),%0)
      # The card's fields, its times in zone %1. fields() takes its pairs as arguments, and an empty pair still draws a line,
      # so the URL row is in one call or the other rather than blanked. The zone is named once: after Scheduled, or after
      # Created when nothing is scheduled.
      FUN`INFO`FIELDS: |-
        setq(info_when,scene(%0,scheduledfor))[setq(info_url,u(%!/FUN`URL,%0))][lfields(,Status%*<|>Owner%*<|>Where%*<|>Created%*<|>Scheduled%*<|>Watchers[if(strlen(%q<info_url>),%*<|>URL)],scene(%0,status)%*<|>[unmark(scene(%0,ownername))]%*<|>[unmark(u(%!/FUN`SCENE`FIELD,%0,roomname,No room yet))]%*<|>[u(%!/FUN`WHEN,scene(%0,startedat),%1)][if(not(strlen(%q<info_when>)),%b[chr(40)][u(%!/FUN`ZONE`LABEL,%1)][chr(41)])]%*<|>[if(strlen(%q<info_when>),[u(%!/FUN`WHEN,%q<info_when>,%1)] [chr(40)][u(%!/FUN`ZONE`LABEL,%1)][chr(41)],-)]%*<|>[switch(scene(%0,public),1,Anyone,Members only)][if(strlen(%q<info_url>),%*<|>%q<info_url>)],%*<|>)]
      # The card's body goes through the CARD filters before it is boxed.
      INC`DISPLAY`INFO: |-
        @pemit %#=box(u(%!/FUN`FILTER,CARD,u(%!/FUN`INFO`FIELDS,%<scene>,u(%!/FUN`ZONE,%#))%r[u(%!/FUN`PARTICIPATION`TAGS,%<scene>)]%r[rule(Pitch)]%r[u(%!/FUN`SCENE`FIELD,%<scene>,summary,-)]%r[if(words(setr(info_details,scene(%<scene>,details))),rule(Details)%r[u(%!/FUN`DETAIL`TABLE,%<scene>,%q<info_details>)]%r)][rule(Players)]%r[u(%!/FUN`CAST`TABLE,%<scene>,scenemembers(%<scene>))],%<scene>),Scene %<scene>: [u(%!/FUN`LIST`TITLE,%<scene>)],,u(%!/FUN`FRAME))
      # +scene/title [<id>=]<text> and +scene/pitch [<id>=]<text>: the focused scene, or the one named.
      # The id is digits, so a title or pitch that merely has an = in it is not taken for one.
      CMD`TITLE:
        value: |-
          $(?is)^\+scene/ti(?\:t(?\:l(?\:e)?)?)? (?\:(\d+)=)?(.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @scene/set %q<scene_id>/title=%2; @pemit %#=notice(SCENE,Scene %q<scene_id> is now titled: %2,ok)
        flags: [REGEXP]
      CMD`PITCH:
        value: |-
          $(?is)^\+scene/pi(?\:t(?\:c(?\:h)?)?)? (?\:(\d+)=)?(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`APPROVAL),error); @assert not(strmatch(setr(scene_id,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOFOCUS),warn); @assert not(strmatch(scene(%q<scene_id>,status),#-1*))=@pemit %#=notice(SCENE,No such scene: %q<scene_id>,warn); @assert u(%!/FUN`OWNS,%#,%q<scene_id>)=@pemit %#=notice(SCENE,get(%!/DATA`DENY`NOTOWNER),error); @scene/set %q<scene_id>/summary=%2; @pemit %#=notice(SCENE,Pitch set for scene %q<scene_id>.,ok)
        flags: [REGEXP]
      # Scene DETAILS card. `+scene <id>` and `+scene/info <id>` are the same question asked two
      # ways, so they run the same renderer: naming an id has always meant "tell me about this one".
      #
      # This replaced +scene/who, which could only answer who was in the cast. Somebody asking about a
      # scene wants where it is, what it is about and whether anyone may watch as well — and once the
      # card carries the roster there is nothing left for a second verb to say.
      #
      # Cast and Members are both here because they answer different questions: Cast is the personas
      # that have spoken (scene(<id>,cast), deduplicated, what a reader of the log sees) and Members is the
      # characters with their roles. A persona is not a character, so one cannot stand in for the
      # other — an actor posing under two names appears once per name in Cast and once in Members.
      # +scene <id>, +scene/info <id> and +event <id>; a title, or the start of one, finds the scene too
      # (FUN`FIND), so a player need not look up its number first.
      CMD`SHOW:
        value: |-
          $(?is)^\+(?\:scene|scene/inf(?\:o)?|event) (.+)$: think setq(found_scenes,u(%!/FUN`FIND,%1)); @assert words(%q<found_scenes>)=@pemit %#=notice(SCENE,No such scene: %1,warn); @assert eq(words(%q<found_scenes>),1)=@pemit %#=notice(SCENE,More than one scene is called that: [itemize(%q<found_scenes>)]. Give its number.,warn); @assert not(strmatch(scene(setr(scene_id,%q<found_scenes>),status),#-1*))=@pemit %#=notice(SCENE,No such scene: %1,warn); @include/args %!/INC`DISPLAY`INFO=scene,%q<scene_id>
        flags: [REGEXP]
      # The scene %0 names: its number, or the scenes whose title is %0, or else starts with it, among the
      # recent and scheduled scenes the reader can see. Several ids when it names more than one.
      FUN`FIND: |-
        setq(find_text,trim(%0))[if(isint(%q<find_text>),%q<find_text>,u(%!/FUN`FIND`TITLE,%q<find_text>))]
      FUN`FIND`TITLE: |-
        setq(find_candidates,setunion(scenelist(recent),scenelist(scheduled)))[setq(find_exact,squish(iter(%q<find_candidates>,if(strmatch(scene(%i0,title),%0),%i0))))][if(words(%q<find_exact>),%q<find_exact>,squish(iter(%q<find_candidates>,if(strmatch(scene(%i0,title),%0*),%i0))))]

      # +scene/help is the thing a player actually types when they are lost; issue #860 opens on the bare Huh? it used
      # to give. It lists every switch's usage line, which this package has whatever else is installed, through the
      # HELP filter point, where scene-help adds the +help topic to read next.
      CMD`HELP:
        value: |-
          $(?is)^\+scene/he(?\:l(?\:p)?)?$: @pemit %#=box(u(%!/FUN`FILTER,HELP,iter(get(%!/DATA`SWITCHES),get(%!/DATA`USAGE`[ucstr(%i0)]),%b,%r)),Scene commands,,u(%!/FUN`FRAME))
        flags: [REGEXP]

      # ---- switches and usage lines ---------------------------------------------------
      # Every verb takes a unique prefix of its switch, as PennMUSH players expect: +scene/lis is
      # +scene/list. Each pattern spells its switch as the shortest prefix no other switch here shares,
      # followed by the rest of the word optionally ((?:...)? groups, which capture nothing, so the
      # arguments keep their numbers). A new switch goes into DATA`SWITCHES, and every switch it shares
      # a prefix with needs its pattern lengthened to match.
      #
      # A +scene/<switch> line no verb matches -- an argument left off, a switch mistyped, or a prefix
      # several switches share -- would be a bare Huh?. CMD`USAGE matches every +scene/<switch> line,
      # and stays quiet when scan() finds another command that takes it (every pattern that matches a
      # line runs, so it cannot rely on matching last). Otherwise it answers with the switch's usage
      # line, or the switches the prefix could mean.
      DATA`SWITCHES: |-
        activate as cancel create deactivate delete detail details edit emit finish help hide info join leave limit list log mark mine policy invite move narrate old ooc pause pitch pose private public recall redo reschedule rewrite rsvp say schedule semipose set show start tag title type types undo unmark unrsvp unschedule untag upcoming
      DATA`USAGE`ACTIVATE: |-
        +scene/activate <id>
      DATA`USAGE`AS: |-
        +scene/as <name>, or +scene/as on its own to pose under your own name again
      DATA`USAGE`CANCEL: |-
        +scene/cancel <id>
      DATA`USAGE`CREATE: |-
        +scene/create <title>[=<pitch>]
      DATA`USAGE`DEACTIVATE: |-
        +scene/deactivate
      DATA`USAGE`DELETE: |-
        +scene/delete <pose>
      DATA`USAGE`DETAIL: |-
        +scene/detail <detail>; staff also +scene/detail/add <detail>=<name>, +scene/detail/set <detail>/<field>=<value> and +scene/detail/remove <detail>
      DATA`USAGE`DETAILS: |-
        +scene/details
      DATA`USAGE`EDIT: |-
        +scene/edit <pose>=<old>^^^<new>
      DATA`USAGE`EMIT: |-
        +scene/emit <id>=<text>
      DATA`USAGE`FINISH: |-
        +scene/finish [<id>]
      DATA`USAGE`HELP: |-
        +scene/help
      DATA`USAGE`HIDE: |-
        +scene/hide <type>[=reading|playing], or +scene/hide on its own to see what you hide
      DATA`USAGE`INFO: |-
        +scene/info <id or title>
      DATA`USAGE`POLICY: |-
        +scene/policy [<id>=]open|invite-only|limited
      DATA`USAGE`LIMIT: |-
        +scene/limit [<id>=]<0-10000> (zero clears the cap unless policy is limited)
      DATA`USAGE`INVITE: |-
        +scene/invite <id>=<player>
      DATA`USAGE`JOIN: |-
        +scene/join <id>
      DATA`USAGE`LEAVE: |-
        +scene/leave
      DATA`USAGE`LIST: |-
        +scene/list[/<page>] [<detail>=<value>]
      DATA`USAGE`LOG: |-
        +scene/log [<id>]
      DATA`USAGE`MARK: |-
        +scene/mark <pose>=<word>
      DATA`USAGE`MINE: |-
        +scene/mine[/<page>] [<detail>=<value>]
      DATA`USAGE`MOVE: |-
        +scene/move <pose>=<after>
      DATA`USAGE`NARRATE: |-
        +scene/narrate <id>=<text>
      DATA`USAGE`OLD: |-
        +scene/old[/<page>] [<detail>=<value>]
      DATA`USAGE`OOC: |-
        +scene/ooc <id>=<text>
      DATA`USAGE`PAUSE: |-
        +scene/pause [<id>][=<when>]
      DATA`USAGE`PITCH: |-
        +scene/pitch [<id>=]<text>
      DATA`USAGE`POSE: |-
        +scene/pose <id>=<text>
      DATA`USAGE`PRIVATE: |-
        +scene/private [<id>]
      DATA`USAGE`PUBLIC: |-
        +scene/public [<id>]
      DATA`USAGE`RECALL: |-
        +scene/recall [<n>], or +scene/recall <id>=[<n>] for another scene
      DATA`USAGE`REDO: |-
        +scene/redo <pose>
      DATA`USAGE`RESCHEDULE: |-
        +scene/reschedule <id>=<when>, where <when> is a date and time such as tomorrow 7pm, next Tuesday 18:30, 2026-12-31 20:00, or +3d; add an IANA zone to override your timezone
      DATA`USAGE`REWRITE: |-
        +scene/rewrite <pose>=<text>
      DATA`USAGE`RSVP: |-
        +scene/rsvp <id>
      DATA`USAGE`SAY: |-
        +scene/say <id>=<text>
      DATA`USAGE`SCHEDULE: |-
        +scene/schedule <when>/<title>=<pitch>, where <when> is a date and time such as tomorrow 7pm, next Tuesday 18:30, 2026-12-31 20:00, or +3d; add an IANA zone to override your timezone
      DATA`USAGE`SEMIPOSE: |-
        +scene/semipose <id>=<text>
      DATA`USAGE`SET: |-
        +scene/set [<id>/]<detail>=<value>, or an empty value to clear it
      DATA`USAGE`SHOW: |-
        +scene/show <type>[=reading|playing]
      DATA`USAGE`START: |-
        +scene/start [<id>]
      DATA`USAGE`TAG: |-
        +scene/tag <id>
      DATA`USAGE`TITLE: |-
        +scene/title [<id>=]<text>
      DATA`USAGE`TYPE: |-
        +scene/type <type>; staff also +scene/type/add <type>=<name>, +scene/type/set <type>/<field>=<value> and +scene/type/remove <type>
      DATA`USAGE`TYPES: |-
        +scene/types
      DATA`USAGE`UNDO: |-
        +scene/undo <pose>
      DATA`USAGE`UNMARK: |-
        +scene/unmark <pose>=<word>
      DATA`USAGE`UNRSVP: |-
        +scene/unrsvp <id>
      DATA`USAGE`UNSCHEDULE: |-
        +scene/unschedule <id>
      DATA`USAGE`UNTAG: |-
        +scene/untag <id>
      DATA`USAGE`UPCOMING: |-
        +scene/upcoming [<days>|all]
      CMD`USAGE:
        value: |-
          $(?is)^\+scene/([^\s=]*)(.*)$: @break words(squish(iter(scan(%#,%0),if(strmatch(after(%i0,/),CMD`USAGE),,%i0)))); think setq(usage_switch,u(%!/FUN`SWITCH,lcstr(%1))); @assert strlen(%q<usage_switch>)=@pemit %#=notice(SCENE,u(%!/FUN`NO`SWITCH,lcstr(%1)),warn); @pemit %#=notice(SCENE,get(%!/DATA`USAGE`[ucstr(%q<usage_switch>)]),warn)
        flags: [REGEXP]
      # The switch %0 names: itself, or the one switch it is the start of; nothing otherwise.
      FUN`SWITCH: |-
        if(member(get(%!/DATA`SWITCHES),%0),%0,if(eq(words(setr(switch_matches,u(%!/FUN`PREFIXED,%0))),1),%q<switch_matches>))
      FUN`PREFIXED: |-
        squish(iter(get(%!/DATA`SWITCHES),if(strmatch(%i0,%0*),%i0)))
      FUN`NO`SWITCH: |-
        cond(not(strlen(%0)),+scene needs a switch after the /.,gt(words(setr(switch_matches,u(%!/FUN`PREFIXED,%0))),1),+scene/%0 could be [itemize(iter(%q<switch_matches>,+scene/%i0),,or)].,+scene has no /%0 switch.) +scene/help lists the commands.

      # ---- lifecycle: (re-)establish the three OVERRIDE capture hooks -----------
      # PennMUSH form: @hook/<type> <command> = <object>, <attribute> (RSArgs comma-split).
      # /inline: the capture stands in for the built-in command, so it runs in place as the built-in
      # would. Without it the matched $-command is queued (run_cmd_hook, src/command.c) and the room
      # sees the pose after the rest of the poser's action list.
      AINSTALL: |-
        @teleport %!=#2; @trigger %!/STARTUP
      STARTUP: |-
        @hook/override/inline POSE=%!,CMD`CAPTURE`POSE; @hook/override/inline SAY=%!,CMD`CAPTURE`SAY; @hook/override/inline SEMIPOSE=%!,CMD`CAPTURE`SEMI; @hook/override/inline @EMIT=%!,CMD`CAPTURE`EMIT

  # ---- help storage -------------------------------------------------------
  # An ordinary, unflagged thing holding the +help topics, deliberately NOT the Scene Logger: the
  # Logger must be WIZARD, and the librarian cannot u() a privileged object's attribute. See
  # plus-help's README for that rule and for how an evaluated body is escaped. Nothing reads it until
  # scene-help registers it with the librarian; packages that add scene topics attach them here.
  - ref: scene_help
    type: thing
    name: Scene Help
    attributes:
      HELP: |-
        Shared scenes: joining one, posing in it, and reading the log.

      # Cross-references, declared: one SEE leaf per topic at the path it sits at under HELP, a
      # "|"-separated list of topic names. Subtopics are not listed -- HELP`SCENE`JOIN is already a
      # child of HELP`SCENE and +help derives that from the tree.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SCENE: |-
        pot
      SEE`SCENE`JOIN: |-
        scene pose|pot
      SEE`SCENE`POSE: |-
        scene join
      SEE`SCENE`PITCH: |-
        scene privacy|scene details
      SEE`SCENE`PRIVACY: |-
        scene join|scene pitch
      SEE`SCENE`SCHEDULE: |-
        scene join
      SEE`SCENE`TYPES: |-
        scene pose|scene details
      SEE`SCENE`DETAILS: |-
        scene pitch|scene types
      SEE`SCENE`FILTERS: |-
        scene details|scene types
      SEE`POT: |-
        scene pose|scene join
      HELP`SCENE: |-
        A **scene** is a shared, logged piece of roleplay. Any approved character in the room can be in
        one; the log is readable afterwards, in-game and in the portal.

        ## Getting in

        - `+scene` \(or `+scene/list`\) — the scenes running now
        - `+scene/old` — the finished ones; `+scene/mine` — yours
        - `+scene <id>` \(or `+event <id>`\) — what a scene is, where it is, and who is in it. Its
          title, or the start of it, works as well as its number
        - `+scene/log \[<id>\]` — read a scene's log, your focused one or any you can see
        - `+scene/join <id>` — join it and make it your focus
        - `+scene/leave` — stop posing into it

        A list longer than your screen comes in pages, and the page is a last switch:
        `+scene/old/2` is the second page of finished scenes.

        Once you have joined, ordinary `pose`, `say` and `@emit` in that room are recorded. You do
        not have to use a special command to speak.

        ## Running one

        - `+scene/create <title>\[=<pitch>\]` — start one here and focus it
        - `+scene/title \[<id>=\]<text>` — rename it
        - `+scene/pitch \[<id>=\]<text>` — say what it is about, so people can decide to come
        - `+scene/set \[<id>/\]<detail>=<value>` — a detail, such as its verse or a content warning;
          see `+help scene details`
        - `+scene/pause` — stop it for now; it leaves the live list for the schedule
        - `+scene/start` — resume a paused scene
        - `+scene/finish` — close it. A finished or cancelled scene stays that way
        - `+scene/finish <id>` — close a scene by id. Its owner can, and so can anyone holding the
          `scene.close` permission, which this package defines; allow it on a role, such as helper, with
          `@role/allow helper=scene.close`

        Wizards, and anyone holding the `scene.manage` permission, can do all of these on any scene.
      HELP`SCENE`POLICY: |-
        Who may join a scene is its **joining policy**, which its owner sets:

        - `+scene/policy \[<id>=\]open` — anyone with an approved character may join. This is the default
        - `+scene/policy \[<id>=\]invite-only` — only players invited with `+scene/invite <id>=<player>`, by
          the owner or a scene manager
        - `+scene/policy \[<id>=\]limited` — anyone may join until the scene is full. Set a limit first

        `+scene/limit \[<id>=\]<number>` sets how many players the scene holds, up to 10000, under any policy.
        `0` removes the limit, but not while the policy is limited. A limit below the number of players already
        in the scene is refused.

        The owner, GMs and players in the scene take a seat each; observers and invited players who have not
        joined do not. An invitation is not a seat, and does not let you read a private scene: joining uses it,
        and only when a seat is free. A player who leaves and comes back keeps their role and seat.

        Scene cards and lists show the policy and the limit.
      HELP`SCENE`LIMIT: |-
        See `+help scene policy` for joining policy, invitations and player limits.
      HELP`SCENE`INVITE: |-
        See `+help scene policy` for joining policy, invitations and player limits.
      HELP`SCENE`JOIN: |-
        `+scene/join <id>` puts you in a scene and makes it your **focus** — the scene your poses are
        recorded into. `+scene` lists the ids.

        - `+scene/tag <id>` — RSVP to a scheduled scene without joining it yet
        - `+scene/untag <id>` — withdraw the RSVP
        - `+scene/leave` — leave the focused scene; if you never posed, you leave no trace
        - `+scene/deactivate` — stay a member but stop recording; `+scene/activate <id>` resumes

        Joining needs an approved character.
      HELP`SCENE`POSE: |-
        With a scene focused, ordinary `pose`, `say`, `semipose` and `@emit` in its room are captured
        as you write them — nothing extra to type.

        The explicit forms name the scene instead of inferring it from the room, which is what the
        portal's compose box sends. The room sees them as it sees a captured pose:

        - `+scene/pose <id>=<text>` · `+scene/say <id>=<text>` · `+scene/semipose <id>=<text>`
        - `+scene/emit <id>=<text>` · `+scene/ooc <id>=<text>` \(out of character\)
        - `+scene/narrate <id>=<text>` — the world speaking rather than a character: weather, a crowd, a
          storyteller's line
        - `+scene/as <name>` — pose under a different name from here on; `+scene/as` on its own goes back
          to your own name

        ## Fixing a pose

        These work on your own poses. A wizard, or anyone holding the `scene.manage` permission, can use them
        on anyone's:

        - `+scene/edit <pose>=<old>^^^<new>` — fix a typo, for example `+scene/edit 12=teh^^^the`
        - `+scene/rewrite <pose>=<text>` — replace the whole text \(the portal's Edit\)
        - `+scene/undo <pose>` · `+scene/redo <pose>` — step back and forward through its edits
        - `+scene/delete <pose>` — take it out of the log

        The scene's owner can also put a pose somewhere else in the log with `+scene/move <pose>=<after>`.

        `+scene/mark <pose>=<word>` marks one pose, such as a `flashback` or a `dream`, and
        `+scene/unmark <pose>=<word>` takes the mark off. Marks show on the pose's line in recall, and the
        portal's scene page can show only the poses with one. The pose's author or the scene's owner can mark it.

        ## Reading the log

        - `+scene/recall <n>` — the last `<n>` poses of your focused scene; bare `+scene/recall`
          gives you two rounds of the room \(twice the size of the cast\)
        - `+scene/recall <id>=<n>` — the same for any scene you can see
        - `+scene/log \[<id>\]` — the whole log

        Each pose is introduced by a rule naming who posed it and its number, which is the `<pose>` the
        commands above take, and closed by a rule naming its scene and marks. Each line is drawn as its type draws it, so an out-of-character line starts with
        `<OOC>`. Out-of-character lines are left out of the log until you show them, and kept in the recall.
        `+scene/hide <type>` and `+scene/show <type>` change that; see `+help scene types`.
      HELP`SCENE`PITCH: |-
        `+scene/pitch <text>` sets the summary shown on a scene's card and its page on the website. It is
        how someone browsing decides whether to come. `+scene/pitch <id>=<text>` sets it on a scene you
        own without focusing it, and `+scene/title \[<id>=\]<text>` renames one the same way.

        Only the scene's owner \(or staff\) can set it.
      HELP`SCENE`PRIVACY: |-
        Scenes are **public** by default: they appear in `+scene` and their log is readable.

        - `+scene/private \[<id>\]` — hide the focused scene, or the one named, and its log from everyone
          but its members
        - `+scene/public \[<id>\]` — put it back

        Only the scene's owner \(or staff\) can change this. Privacy is about who may *read*; who may
        *pose* is decided by who has joined.
      HELP`SCENE`SCHEDULE: |-
        A scene can be announced before it happens, so people can plan around it.

        - `+scene/schedule <when>/<title>=<pitch>` — announce one. `<when>` is a date and time, such as
          `+scene/schedule tomorrow 7pm/Market day=An evening of trading and intrigue`, `next Tuesday 18:30`, `in 7 days at 18:30`, `first Saturday of next month at noon`, an ISO date such as `2026-12-31 20:00`, or an elapsed offset: `+3d`, `+12h` or `+1w`
        - `+scene/upcoming` \(or `+scenes`, `+events`\) — what is scheduled in the next 30 days \(or as many
          as `+config scene` sets\), by day, and how many have RSVP'd
        - `+scene/upcoming <days>` \(or `+scenes <days>`\) — look further ahead; `all` for everything
        - `+scene/tag <id>` \(or `+scene/rsvp <id>`\) — RSVP; `+scene/untag <id>` \(`+scene/unrsvp`\) withdraws it
        - `+scene/reschedule <id>=<when>` · `+scene/unschedule <id>` \(or `+scene/cancel <id>`\)
        - `+scene/pause \[<id>\]\[=<when>\]` — pause a running scene, and optionally give it a new time
        - `+scene/start \[<id>\]` — start a scheduled scene here, or resume a paused one

        Rescheduling a running scene pauses it. A scheduled or paused scene records nothing and is not
        listed as live until its owner starts it. A finished or cancelled scene can't be rescheduled.

        Times are read in your `+timezone`, or in UTC if you have not set one. A zone name after the time
        overrides it: `tomorrow 7pm America/Chicago`; its slash does not end the time. The confirmation shows the
        date and time understood, with the zone and its offset from UTC. Everyone sees scheduled times in their
        own zone.

        A date needs a time: `next Tuesday` and `tomorrow evening` are refused, with a request to say when. A
        time alone is today, so one that has passed is refused. Weeks start on Monday: `this Tuesday` is in this
        week, `next Tuesday` is the next one after today, and `next week Tuesday` is in next week. `in 7 days`
        keeps the time of day across a summer-time change; `+7d` is exactly 168 hours. A time that summer time
        skips or repeats is refused: give another, or an ISO time with its offset. Dates such as `03/04`, zone
        abbreviations such as `CST`, ranges and repeats are refused rather than guessed. See
        `help dateparse policies`.
      HELP`SCENE`TYPES: |-
        Every line in a scene has a **type**: in character \(`ic`\), out of character \(`ooc`\), narration,
        and whatever else the game adds, such as `radio`. The type decides how the line looks, here and in
        the portal, and you can hide the ones you do not want to read.

        You choose what to hide in two places, each on its own:

        - **reading** a scene: `+scene/log`, `+scene/highlights` and a scene's page in the portal
        - **playing** in one: `+scene/recall`, Play, and a scene you joined in the portal

        Out-of-character lines start hidden while reading and shown while playing.

        - `+scene/types` — every type, what it looks like, and where you hide it
        - `+scene/type <type>` — one type in full
        - `+scene/hide <type>` — leave that type out in both places; a note under the recall or log
          says how many lines it left out. `+scene/hide` on its own lists what you hide
        - `+scene/hide <type>=reading` or `=playing` — only there
        - `+scene/show <type>` — put it back in both places; `=reading` or `=playing` for only one

        Your choices are kept on your character, and the portal's Show menus read the same ones.

        For example:

        `+scene/show ooc=reading`

        Output: `\[SCENE\] Done: Out of character lines show while reading.`

        ## Changing types

        Staff holding the `layout.admin` permission can add and change types:

        - `+scene/type/add <type>=<name>` — a new type, named for people. The type is 1 to 32 letters,
          digits, `-` and `_`
        - `+scene/type/set <type>/<field>=<value>` — one field:
          - `label` — its name
          - `presentation` — how the portal lays it out: `prose` \(portrait, name and text\), `band` \(a
            tinted strip\), `message` \(a bubble with a header, for radios and texts\), `aside` \(centred
            and italic, for narration\) or `notice` \(one dim line\)
          - `tone` — a theme colour: `foreground`, `primary`, `secondary`, `tertiary`, `muted`,
            `success`, `warning`, `error` or `info`. Each reader sees it in their own theme
          - `icon` — `radio`, `phone`, `chat`, `dice`, `book`, `scroll`, `megaphone`, `eye`, `mask`,
            `music`, `star` or `bolt`
          - `hidden` — where it starts hidden for anyone who has not chosen: `yes` for both places,
            `reading`, `playing`, or `no`
          - `order` — its place in lists, lowest first
        - `+scene/type/remove <type>` — remove it; its lines then read as in character

        How a type reads in a terminal is softcode, `` TYPE`<TYPE>`FORMAT `` on the Scene Logger, which
        only someone controlling the logger can set. It is given the pose id as `%%0`, the reader as
        `%%1`, the line as `%%2` and the scene id as `%%3`, and returns the line that reader sees, or
        nothing to hide it from them. Use `tone\(\)` for colour, so readers get their own theme's:

        `` &TYPE`OOC`FORMAT <logger>=tone\(muted,<OOC %%3> %%2\) ``

        A `prose` or `aside` type is shown under a line naming who posed, the pose and the scene. A
        `band`, `message` or `notice` type has no line: it is one line of its own, so its format
        should say the scene, as the shipped `ooc` one does: `<OOC` followed by a middle dot and the
        scene id, then `>`. A type with no format is shown that way too, with its name.
      HELP`SCENE`DETAILS: |-
        A scene's **details** say what it is about beyond its title and pitch: the verse it is set in, the
        canon it draws on, a content warning, the era, anything its owner wants to note. They show on the
        scene's card, at the top of its log and on its page in the portal, and you can list scenes by them.

        - `+scene/set <detail>=<value>` — set one on your focused scene
        - `+scene/set <id>/<detail>=<value>` — set one on a scene you own without focusing it
        - `+scene/set <detail>=` — clear it
        - `+scene/details` — the details this game lists, if any, and what goes in each

        For example:

        `+scene/set verse=Marvel`

        Output: `\[SCENE\] Done: Scene 1: Verse is now Marvel.`

        A detail is a word of letters, digits, `-` and `_`, starting with a letter, and can't be one of a
        scene's own fields, such as `title` or `status`. Split several values with `|`:
        `+scene/set canon=Marvel|X-Men`. Only the scene's owner, or staff, can set its details.

        A game can list the details it uses, with a name and a hint for each, and some only take certain
        values; `+scene/details` says which. The `scene-verse` package lists a verse, a canon and a content
        warning; see `+help scene verse` when it is installed.

        ## Finding scenes by detail

        Give a detail and a value after `+scene/list`, `+scene/old` or `+scene/mine`. Case does not
        matter, and `*` matches anything:

        - `+scene/old verse=Marvel` — finished scenes set in Marvel
        - `+scene/old/2 canon=*Fate*` — the second page of finished scenes drawing on anything Fate

        In softcode, `scene\(<id>,verse\)` reads a scene's verse, and `scene\(<id>,details\)` lists the
        details it has.

        ## Listing details

        Staff holding the `layout.admin` permission decide which details the game lists:

        - `+scene/detail <detail>` — one detail in full
        - `+scene/detail/add <detail>=<name>` — list a new one
        - `+scene/detail/set <detail>/<field>=<value>` — one field:
          - `label` — its name
          - `hint` — one line saying what goes in it
          - `choices` — the values it allows, split by `|`; empty for any text
          - `many` — `yes` when a scene may give several values
          - `listed` — `yes` to show it beside the title in lists and on the portal's scene cards
          - `tone` — the theme colour its values show in, such as `warning`; empty for none
          - `order` — its place, lowest first
        - `+scene/detail/remove <detail>` — stop listing it. Scenes keep their values

        For example:

        `+scene/detail/add era=Era`

        Output: `\[SCENE\] Done: Added scene detail era. +scene/detail/set era/<field>=<value> changes it.`

        Players may set details the game does not list unless staff turn the scene `open-details` setting off.
      HELP`SCENE`FILTERS: |-
        A package can change what `+scene` shows without editing the scene package. It adds a **filter**
        to the Scene Logger: an attribute named `` FILTER`<point>`<name> ``. Where `+scene` draws that
        point, it runs every filter on it in name order with `chain\(\)`. Each filter gets what would be
        shown as `%%0` and returns what is shown instead; the next filter gets that.

        - `CARD` — the body of `+scene <id>`'s card. `%%1` is the scene
        - `` LIST`TITLE `` — a scene's title in `+scene`, `+scene/old` and `+scene/mine`. `%%1` is the scene
        - `` LOG`HEAD `` — the lines over `+scene/log`. `%%1` is the scene
        - `` POSE`RULE `` — the right side of the line under a pose, plain text. `%%1` is the scene, `%%2` the pose
        - `` DETAIL`SHOW `` — a scene's value for a detail, wherever it is shown. `%%1` is the scene, `%%2` the detail
        - `JOIN` — what a player is told when they join. `%%1` is the scene, `%%2` the player
        - `HELP` — the command list `+scene/help` shows

        A filter runs as the Scene Logger, with `%%#` the player reading. For example, to show every
        verse in capitals:

        `` &FILTER`DETAIL`SHOW`CAPS <logger>=if\(strmatch\(%%2,verse\),ucstr\(%%0\),%%0\) ``

        A filter a package attaches to the Scene Logger goes away when the package is uninstalled.
      HELP`POT: |-
        `+pot` — "pose tracker" — shows who is in your focused scene, how long since each of them
        last posed, so a table can tell whose turn it is.

        It needs a focused scene: `+scene/join <id>` or `+scene/create <title>\[=<pitch>\]` first.

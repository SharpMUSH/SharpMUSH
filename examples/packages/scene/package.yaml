format: 1
package: scene
version: 1.0.0
authors: [SharpMUSH]
description: "Scene Logger: pose/say/semipose capture into the Scene System, plus the +scene/* player verbs. Ships the game policy the C# engine deliberately omits, including who may be associated with a scene."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [scene, rp, logging, capture, hooks]
requires_server: ">=0.1"

# +help carries the topics below. The dependency is what makes {{plus-help/librarian}} a legal
# attach target, and it is what makes uninstalling scene take its help registration with it.
#
# common-functions supplies header() and footer(), which the capture frame, the info card and
# +scene/recall all evaluate. They are global @functions registered by that package's STARTUP, so
# without it every rule this package draws renders as the literal text of a call to a function that
# does not exist — and nothing would say why.
depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: common-functions
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/common-functions/
      branch: main
      # common-functions ships here, not in SharpMUSH.Packages, so this points
      # at the server repo where the other examples point at the package repo.

# Create mode: a single owned WIZARD thing carries the capture hooks and the
# +scene/* verbs. It MUST be WIZARD — it is the @hook/override target, runs the
# wizard-only @scene / @hook commands, and AINSTALL/STARTUP run as this object
# (so %! / me = this object and self-execution of the wizard-locked @hook works).
#
# AINSTALL runs once after first install; STARTUP runs on every boot. Both
# (re-)establish the three OVERRIDE hooks idempotently — immediate on install,
# re-set on each boot (the hook registry is rebuilt from softcode policy).
#
# Capture is one of two pose-recording paths. An @hook/override on POSE/SAY/SEMIPOSE/@EMIT
# reproduces the built-in room emit EXACTLY, then records the pose via the
# @scene/addpose COMMAND -- that is the path a MU* client takes, and it records only
# where the poser is standing. The other is the +scene/<mode> <id>=<text> verbs below,
# which the web portal's live-scene compose box sends: they name the scene instead of
# inferring it from the room. Reads use the
# scene… functions; all data-writes use @scene/* commands (never side-effect fns).
#
# Attribute organization follows the project FUN`/CMD`/DATA`/INCLUDE` tree
# convention (see the common-functions and http-handler packages):
#   DATA`*     — config/constant knobs (reads, replaces a SceneOptions config)
#   FUN`*      — pure reads / guards (called via u())
#   CMD`*      — player verbs + capture $-commands (writes go through @scene/*)
#   INCLUDE`*  — shared command tails composed via @include (keep attrs small)
objects:
  - ref: logger
    type: thing
    name: Scene Logger
    flags: [WIZARD]
    attributes:
      # ---- policy knobs (read by the verbs; replaces a SceneOptions config) ----
      DATA`CAPTURE: |-
        1
      # `active` so +scene/create yields an immediately-capturing scene — pose/say/@emit are recorded
      # right after creation, with no separate +scene/start. Set this to `new` (or `scheduled`) instead
      # if you want creation to STAGE a scene that only begins logging after an explicit +scene/start.
      DATA`DEFAULT_STATUS: |-
        active

      # ---- owner / wizard guard -------------------------------------------------
      FUN`OWNS: |-
        or(orflags(%0,Wz),strmatch(scene(%1,owner),%0))
      # Finishing is the one owner verb staff may need on someone else's scene. A game hands it out by
      # defining the scene.close permission (@permission/define scene.close=Staff) and allowing it on a role, such
      # as helper. permission() answers #-1 while the permission is undefined, which or() reads as false.
      FUN`CAN`CLOSE: |-
        or(u(%!/FUN`OWNS,%0,%1),permission(%0,scene.close))

      # ---- approval guard -------------------------------------------------------
      # The ONE place +scene asks "may this thing be ASSOCIATED with a scene?". Two halves:
      #   • it must be a CHARACTER — a scene associates players, not things or rooms; and
      #   • it must be APPROVED — isapproved() is the engine predicate, "royalty or above,
      #     or carrying the APPROVED flag", and it is false for a guest whatever else is set.
      # The engine ships that rule and no policy for what earns the flag; a game decides that
      # and sets APPROVED itself. A game that wants a DIFFERENT bar edits this one attribute —
      # nothing else in the package tests the flag, and the engine and the verbs cannot drift
      # because both sides run the same isapproved() code.
      #
      # Association is the line, not visibility: viewing a schedule or a scene's information is
      # open to any character (see CMD`BROWSE / OLD / UPCOMING / SHOW / WHO / RECALL / POT, none
      # of which include this guard), and leaving is always allowed (CMD`LEAVE / UNTAG /
      # DEACTIVATE). Joining, owning, administering and posing into a scene all require approval.
      #
      # The guard is written INLINE at the head of each gated verb, as a bare @assert — NOT factored into
      # an INC` attribute and @included. A single-target @include runs its body as its own command list and
      # the list boundary CONTAINS the break, so an @assert inside an @include emits its message and then
      # lets the caller carry straight on to the write it was supposed to prevent. (Proven: routed through
      # an @include, +scene/join printed the refusal AND still created the membership edge.) The one-line
      # @assert keeps the refusal text in one place via DATA`DENY_APPROVAL — get() reads it without
      # evaluating it — while keeping the break where it has to be, in the verb's own list.
      FUN`IS`APPROVED: |-
        and(hastype(%0,PLAYER),isapproved(%0))
      DATA`DENY_APPROVAL: |-
        You are not approved to take part in scenes. You can still browse the schedule with +scene and +scene/upcoming, and read any scene with +scene <id>.

      # ---- focus / ownership guards ---------------------------------------------
      # scenefocus() answers "#-1 NOT FOUND" for anyone who has not joined a scene, and that string is
      # non-empty and truthy — so every verb that read it and acted was acting on a scene that does not
      # exist. The two arms failed differently and both were wrong. A wizard, whom FUN`OWNS deliberately
      # treats as owning every scene, sailed through and was told "Pitch set for scene #-1 NOT FOUND."
      # while nothing was written. Everyone else failed a bare @assert carrying no message, so the verb
      # produced no output at all — indistinguishable from a command that does not exist.
      #
      # Written inline at each verb, as bare @asserts, for the reason spelled out above DATA`DENY_APPROVAL:
      # an @assert inside an @include emits its message and then lets the caller continue anyway.
      DATA`DENY_NO_FOCUS: |-
        You are not focused on a scene. Join one with +scene/join <id>, or see what is running with +scene.
      # The portal's compose box names its scene (+scene/pose <id>=…), so it is refused here rather than by
      # the room capture, which already only finds a running scene.
      DATA`DENY_NOT_RUNNING: |-
        That scene is not running, so nothing is recorded into it. Its owner resumes it with +scene/start.
      DATA`DENY_NOT_OWNER: |-
        That scene is not yours to change. Its owner or a wizard can do it.
      DATA`DENY_NOT_CLOSER: |-
        That scene is not yours to finish. Its owner, a wizard, or anyone holding the scene.close permission can.
      DATA`DENY_NOT_AUTHOR: |-
        That pose is not yours to edit. Only its author can.
      # +scene/rewrite <id>= would otherwise blank the pose; deleting one is +scene/delete.
      DATA`DENY_EMPTY: |-
        A pose can't be rewritten to nothing. Use +scene/delete <id> to remove it.

      # ---- capture hooks --------------------------------------------------------
      # Each hook RE-BROADCASTS its type-specific speech via @message/spoof, then records
      # the rendered line. The @scene/addpose call itself stays inline in each hook because
      # each speech type renders a different line; only the shared header/footer rules are
      # factored out into INC`CAP_HEADER / INC`CAP_FOOTER and @included.
      #
      # Why @message/spoof instead of hand-rolled @remit/@pemit/@oemit (the old form):
      #   • /spoof makes the notification SENDER the real speaker (%# / enactor), NOT the
      #     WIZARD Scene Logger that runs the hook — restoring correct attribution (the
      #     old @oemit-as-Logger form broke @emit attribution). The Logger is WIZARD, so it
      #     passes the /spoof permission check.
      #   • @message evaluates the format attribute ONCE PER RECIPIENT, so a single call
      #     renders speaker-specific ("You say…") and observer-specific ("Name says…") text.
      #
      # Form: @message/spoof <recipients>=<default>,<obj>/<attr>,<args...>
      #   recipients = lcon(loc(%#)) — everyone in the speaker's room hears it (per-recipient).
      #   <default>  = the built-in third-person literal, used verbatim when the speaker has
      #                no FORMAT`<TYPE>` attribute (it is NOT re-evaluated per recipient, so the
      #                fallback is a single line for every recipient of that call; SAY therefore
      #                makes a separate call for %#).
      #   <obj>/<attr> = %#/FORMAT`<TYPE>` — the per-player render read off the SPEAKER. When set,
      #                it receives %0 = the message text and %1 = the recipient's dbref (short #N,
      #                via the @message `##` recipient token, as PennMUSH's unparse_dbref), and
      #                %# = the speaker. To split "You…" vs "Name…", strmatch(%1,%#) is true only
      #                for the speaker's own copy. FORMAT`<TYPE>` defaults are seeded by the
      #                Ancestor Player; absent it, the <default> literal is used.
      #   commas inside the <default> literal use [chr(44)] (NOT a literal `,`): @message is
      #   CB.RSArgs and splits its RHS on commas BEFORE evaluating each arg, and a backslash-escaped
      #   `\,` does not survive the $-command body parse + RSArgs split (it shifts the obj/attr arg,
      #   so FORMAT is never read). chr(44) emits the comma during per-arg evaluation, after the split.
      #   The recorded @scene/addpose line below is NOT RSArgs in the same way, so it still uses \,.
      #
      # Flow per hook (one physical line, `;`-separated):
      #   1. setr(WillCaptureAsPose, <room has an active scene I am focused on, and I am approved>)
      #      — computing %q<SceneID> and %q<RoomID> along the way. The check is
      #      `strmatch(scenefocus(%#),scenewhere(loc(%#))) AND not(strmatch(scenewhere,#-1*)) AND
      #      FUN`IS`APPROVED(%#)` — a real, focused, in-room active scene (NOT just words(), which is
      #      truthy on "#-1 NOT FOUND"), posed by a character still approved RIGHT NOW. The approval
      #      term is what makes revocation take effect immediately: without it, a character approved
      #      when they joined would keep writing poses into the scene after losing the flag, since
      #      their focus and membership survive the revocation.
      #   2. @if %q<WillCaptureAsPose> ⇒ record with @scene/addpose, then emit the CAP_HEADER rule.
      #   3. ALWAYS @message/spoof the pose to the room (so a pose outside any scene behaves exactly
      #      like the un-hooked built-in — the emit is never gated).
      #   4. @if %q<WillCaptureAsPose> ⇒ emit the CAP_FOOTER rule.
      # So a CAPTURED pose is framed (header + pose + footer with the Scene/Pose ids); an uncaptured
      # one is a plain pose. The header must come AFTER addpose because it reads the new pose id.
      #
      # EVERY capture pattern carries BOTH inline flags, `(?is)`, and the `s` is not decoration.
      # $-commands are matched against the command line AFTER evaluation, so a multi-line pose --
      # `@emit one%rtwo`, or anything the portal's compose box sends, where a newline travels as %r --
      # reaches the matcher with a REAL line break in it. Without `s`, `.` does not cross that break,
      # `^@emit (.*)$` cannot match, and the override silently does not fire: the emit still reaches
      # the room (the built-in runs when no $-command matches) and is never recorded. The failure
      # looks like nothing at all, which is why it survived so long -- only multi-line poses go
      # missing from the archive, and only from the scene, never from the room.

      # When a pose IS captured, frame the room line. The emit LOGIC is factored into INC`CAP_HEADER /
      # INC`CAP_FOOTER and the four capture hooks @include them, so there is no replicated @remit (they
      # read the hook's %q<RoomID> / %q<SceneID> registers; %# is the poser). @include runs the tail AS the
      # Logger (the executor), so it works even for a REMOTE poser — this relied on the engine fix that
      # makes @include locate its target (%!) as the executor, not the enactor.
      # Header = WHO posed (left); footer = the Scene/Pose ids (right) — via the common-functions
      # header()/footer() type dispatch, fixed width 78 (room emit ⇒ no single recipient width). CAP_FOOTER
      # reads the JUST-added pose id via last(sceneposes()), so it MUST run after @scene/addpose.
      INC`CAP_HEADER: |-
        @remit %q<RoomID>=[header([firstof(scenemember(%q<SceneID>,%#,showas),name(%#))] posed,78,left)]
      INC`CAP_FOOTER: |-
        @remit %q<RoomID>=[footer(Scene %q<SceneID> [chr(183)] Pose [last(sceneposes(%q<SceneID>))],78,right)]

      # Built-in POSE (MoreCommands.Pose) emits: "<name> <message>" to the room.
      CMD`CAPTURE`POSE:
        value: |-
          $(?is)^(pose |\:)(.*)$: @if setr(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,pose,,[name(%#)] %2; @include %!/INC`CAP_HEADER}; @message/spoof [lcon(%q<RoomID>)]=[name(%#)] %2,%#/FORMAT`POSE,%2,##; @if %q<WillCaptureAsPose>={@include %!/INC`CAP_FOOTER}
        flags: [REGEXP]

      # Built-in SAY (MoreCommands.Say) emits "You say, \"<msg>\"" to the speaker
      # and "<name> says, \"<msg>\"" to everyone else in the room (PennMUSH do_say, src/speech.c).
      # Unlike the other hooks, the <default> literal differs per recipient, so SAY sends two
      # @message/spoof calls: the first-person line to %#, the third-person line to the rest of
      # lcon() (the speaker is filtered out by dbref number, since lcon() may list objids).
      CMD`CAPTURE`SAY:
        value: |-
          $(?is)^(say |")(.*)$: @if setr(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,say,,[name(%#)] says\, "%2"; @include %!/INC`CAP_HEADER}; @message/spoof %#=You say[chr(44)] "%2",%#/FORMAT`SAY,%2,##; @message/spoof [iter(lcon(%q<RoomID>),if(strmatch(before(%i0,:),%#),,%i0))]=[name(%#)] says[chr(44)] "%2",%#/FORMAT`SAY,%2,##; @if %q<WillCaptureAsPose>={@include %!/INC`CAP_FOOTER}
        flags: [REGEXP]

      # Built-in SEMIPOSE (MoreCommands.SemiPose) emits "<name><message>" (no space).
      CMD`CAPTURE`SEMI:
        value: |-
          $(?is)^(semipose |;)(.*)$: @if setr(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,semipose,,[name(%#)]%2; @include %!/INC`CAP_HEADER}; @message/spoof [lcon(%q<RoomID>)]=[name(%#)]%2,%#/FORMAT`SEMIPOSE,%2,##; @if %q<WillCaptureAsPose>={@include %!/INC`CAP_FOOTER}
        flags: [REGEXP]

      # Built-in @EMIT emits "<message>" verbatim (no name) to the room.
      CMD`CAPTURE`EMIT:
        value: |-
          $(?is)^@emit (.*)$: @if setr(WillCaptureAsPose,and(strmatch(scenefocus(%#),setr(SceneID,scenewhere(setr(RoomID,loc(%#))))),not(strmatch(%q<SceneID>,#-1*)),u(%!/FUN`IS`APPROVED,%#)))={@scene/addpose %q<SceneID>=%#,[scenemember(%q<SceneID>,%#,showas)],%q<RoomID>,emit,,%1; @include %!/INC`CAP_HEADER}; @message/spoof [lcon(%q<RoomID>)]=%1,%#/FORMAT`EMIT,%1,##; @if %q<WillCaptureAsPose>={@include %!/INC`CAP_FOOTER}
        flags: [REGEXP]

      # ---- web compose ----------------------------------------------------------
      # +scene/<mode> <id>=<text> -- what the portal's live-scene compose box sends.
      #
      # The capture hooks above answer "which scene am I in?" from the room the poser is standing in,
      # which is the only question a MU* client can ask. The portal asks a different one: its compose
      # box sits on ONE scene's page, so the pose has to reach THAT scene whether or not the character
      # is standing in its room -- and before this existed, a pose typed there was emitted into
      # whatever room the character happened to be in and silently never recorded.
      #
      # So these take the id explicitly and record regardless of location. Four consequences,
      # each deliberate:
      #   * a poser who is not in the cast is added to it -- a recorded pose whose author is missing
      #     from the info card's cast would leave that card lying about who was in the scene. Guarded on
      #     them having no role YET, because @scene/member sets the role outright: writing it on
      #     every pose demoted an owner to participant in their own scene, and every ownership verb
      #     (+scene/public, /finish, /pitch) is gated on FUN`OWNS, so it locked them out of it;
      #   * the poser is FOCUSED on the scene they just posed into. Posing is the act that says "I am
      #     in this one" -- and without it a pose composed on a scene's page landed there while the
      #     character's focus stayed wherever it had been, so the very next line they typed in a
      #     client went to a different scene, or to none. Everything else about that page says they
      #     are in this scene; the focus has to agree. Harmless when they are elsewhere: a room pose
      #     is captured only when focus matches the scene of the room they are standing in, so a
      #     focus pointing at a remote scene simply captures nothing;
      #   * the room emit is CONDITIONAL on the poser actually being there. Recording from anywhere is
      #     the point; speaking into a room you are not standing in would put words in front of people
      #     you are not with;
      #   * they never call the built-in pose/say/semipose/@emit, because those are hooked above --
      #     delegating would record the pose a second time.
      #
      # The rendered line matches its hook exactly, so a pose composed on the web and one typed in a
      # terminal are indistinguishable in the archive. Note the two comma spellings, both required and
      # for different reasons: `\,` inside @scene/addpose's argument list, and `[chr(44)]` inside
      # @message's RHS, which is CB.RSArgs and splits on commas BEFORE evaluating each argument.
      #
      # The co-location test compares loc(%#) against scene(<id>,room) directly, which works because
      # scene(...,room) answers with an objid -- the same spelling loc() uses. It did not always: it
      # returned a bare dbref, so the comparison was quietly always false and the room emit never
      # fired for anyone.
      #
      # Reading the scene at all is gated by the same visibility rule the REST and hub surfaces use
      # (public, or the caller owns or belongs to it), because the existence guard goes through
      # scene(). That is what stops these verbs being a way to write into a private scene by guessing
      # an id -- and it costs the web nothing, since the compose box only exists on a page whose
      # scene the reader could already see.
      # Multi-line poses need nothing special here. The portal sends newlines as `%r`, which is
      # expanded before the $-command pattern is matched, and a wildcard spans a newline -- so `*=*`
      # matches a two-line pose and %1 arrives with real line breaks in it. (A REGEXP pattern is not
      # so lucky: see the `(?is)` note above the capture hooks.)
      #
      # Whitespace inside %1 arrives intact for the same reason it has to be spelled out to get here:
      # the compose box sends every space run, indent and line break as %b / %t / %r, and a
      # substitution is expanded AFTER the parser has finished eating the whitespace it eats. Nothing
      # in the verbs may put a Trim() back in front of the content, on either side of the wire.
      CMD`WEB`EMIT: |-
        $+scene/emit *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert strmatch(scene(%0,status),active)=@pemit %#=[get(%!/DATA`DENY_NOT_RUNNING)]; @if strmatch(scenemember(%0,%#,role),#-1*)={@scene/member %0/participant=%#}; @scene/focus %#=%0; @scene/addpose %0=%#,[scenemember(%0,%#,showas)],[scene(%0,room)],emit,,%1; @if strmatch(loc(%#),scene(%0,room))={@message/spoof [lcon(scene(%0,room))]=%1,%#/FORMAT`EMIT,%1,##}

      CMD`WEB`POSE: |-
        $+scene/pose *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert strmatch(scene(%0,status),active)=@pemit %#=[get(%!/DATA`DENY_NOT_RUNNING)]; @if strmatch(scenemember(%0,%#,role),#-1*)={@scene/member %0/participant=%#}; @scene/focus %#=%0; @scene/addpose %0=%#,[scenemember(%0,%#,showas)],[scene(%0,room)],pose,,[name(%#)] %1; @if strmatch(loc(%#),scene(%0,room))={@message/spoof [lcon(scene(%0,room))]=[name(%#)] %1,%#/FORMAT`POSE,%1,##}

      CMD`WEB`SAY: |-
        $+scene/say *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert strmatch(scene(%0,status),active)=@pemit %#=[get(%!/DATA`DENY_NOT_RUNNING)]; @if strmatch(scenemember(%0,%#,role),#-1*)={@scene/member %0/participant=%#}; @scene/focus %#=%0; @scene/addpose %0=%#,[scenemember(%0,%#,showas)],[scene(%0,room)],say,,[name(%#)] says\, "%1"; @if strmatch(loc(%#),scene(%0,room))={@message/spoof %#=You say[chr(44)] "%1",%#/FORMAT`SAY,%1,##; @message/spoof [iter(lcon(scene(%0,room)),if(strmatch(before(%i0,:),%#),,%i0))]=[name(%#)] says[chr(44)] "%1",%#/FORMAT`SAY,%1,##}

      CMD`WEB`SEMIPOSE: |-
        $+scene/semipose *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert strmatch(scene(%0,status),active)=@pemit %#=[get(%!/DATA`DENY_NOT_RUNNING)]; @if strmatch(scenemember(%0,%#,role),#-1*)={@scene/member %0/participant=%#}; @scene/focus %#=%0; @scene/addpose %0=%#,[scenemember(%0,%#,showas)],[scene(%0,room)],semipose,,[name(%#)]%1; @if strmatch(loc(%#),scene(%0,room))={@message/spoof [lcon(scene(%0,room))]=[name(%#)]%1,%#/FORMAT`SEMIPOSE,%1,##}

      # Out of character, into this scene. The room hears what the `ooc` command would have it hear
      # (`<OOC> Name: words`; a leading `:` poses and a leading `;` semiposes), and the scene records
      # the line less the marker with tag and source `ooc`, which is what the portal draws as the OOC
      # band. No persona: out of character is the player speaking. As with `ooc`, a gagged player is
      # refused, so is a marker with nothing after it, and the room's Speech lock applies when the
      # speaker is standing in it. The `;` is spelled chr(59) because a bare one ends the command.
      CMD`WEB`OOC: |-
        $+scene/ooc *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert strmatch(scene(%0,status),active)=@pemit %#=[get(%!/DATA`DENY_NOT_RUNNING)]; @assert not(hasflag(%#,GAGGED))=@pemit %#=You cannot speak while gagged.; @assert or(not(strmatch(loc(%#),scene(%0,room))),elock(scene(%0,room)/Speech,%#))=@pemit %#=You may not speak there!; @assert strlen(trim(switch(left(%1,1),:,delete(%1,0,1),chr(59),delete(%1,0,1),%1)))=@pemit %#=OOC: What do you want to say?; @if strmatch(scenemember(%0,%#,role),#-1*)={@scene/member %0/participant=%#}; @scene/focus %#=%0; @scene/addpose %0=%#,,[scene(%0,room)],ooc,ooc,[setr(OocLine,switch(left(%1,1),:,[name(%#)] [delete(%1,0,1)],chr(59),[name(%#)][delete(%1,0,1)],[name(%#)]: %1))]; @if strmatch(loc(%#),scene(%0,room))={@message/spoof [lcon(scene(%0,room))]=<OOC> %q<OocLine>,%#/FORMAT`OOC,%1,##}

      # ---- create / lifecycle ---------------------------------------------------
      # NOTE: capture the new scene id into %q<SceneID> with @assert (it both sets the register and
      # aborts cleanly if creation fails — the id is truthy), then drive the writes off %q<SceneID>.
      # IMPORTANT: the body is one PHYSICAL line with `;` separators. q-registers are shared
      # across `;`-separated commands but NOT across newline-separated ones in a $-command
      # body, so the original multi-line `|-` form lost %q<SceneID> between writes. The original
      # `&MY.SID %#=[setr(SceneID,…)]` also failed (setr inside an &attr=<value> RHS doesn't
      # propagate its register); @assert in command position does.
      CMD`CREATE: |-
        $+scene/create *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert setr(SceneID,scenecreate(%L,%#,%0)); @scene/member %q<SceneID>/owner=%#; @scene/focus %#=%q<SceneID>; @scene/set %q<SceneID>/status=[get(%!/DATA`DEFAULT_STATUS)]; @pemit %#=Scene %q<SceneID> created and focused (status: [get(%!/DATA`DEFAULT_STATUS)]).; &MY.SID %#=%q<SceneID>

      # NOTE: verb bodies are written as ONE physical line with `;` separators. In a
      # multi-line ($-command) attribute the FIRST command after the `$pattern:` header does
      # not parse cleanly (the following line's leading `@scene…` leaks into it) and
      # q-registers do not cross newlines — the `;` form is robust on both counts.
      # +scene/start starts a scene or resumes a paused one; a finished scene stays finished. A roomless
      # scene (one made by +scene/schedule) is bound to the room the starter is in; one with a room keeps it.
      CMD`START: |-
        $+scene/start: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @assert not(strmatch(scene(%q<SceneID>,status),finished))=@pemit %#=Scene %q<SceneID> is finished.; @if not(strlen(scene(%q<SceneID>,room)))={@scene/set %q<SceneID>/room=%L}; @scene/set %q<SceneID>/status=active; @pemit %#=Scene is now active.

      # +scene/start <id> is the same by id, without focusing the scene: how the portal resumes one.
      CMD`START`ID: |-
        $+scene/start *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%0,status),#-1*))=@pemit %#=No such scene: %0; @assert u(%!/FUN`OWNS,%#,%0)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @assert not(strmatch(scene(%0,status),finished))=@pemit %#=Scene %0 is finished.; @if not(strlen(scene(%0,room)))={@scene/set %0/room=%L}; @scene/set %0/status=active; @pemit %#=Scene %0 is now active.

      # A paused scene stops recording and leaves the live list for the schedule, where it stays until
      # +scene/start resumes it. Pausing without a time clears any time the scene had, so the schedule
      # never shows a stale one; pausing with one (+scene/pause [<id>]=<when>) sets it. A finished scene
      # cannot be paused: it would come back onto the schedule.
      CMD`PAUSE: |-
        $+scene/pause: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @assert not(strmatch(scene(%q<SceneID>,status),finished))=@pemit %#=Scene %q<SceneID> is finished.; @scene/set %q<SceneID>/status=paused; @scene/set %q<SceneID>/scheduledfor=; @pemit %#=Scene %q<SceneID> paused. It is on the schedule until +scene/start resumes it.

      # +scene/pause <id>, +scene/pause <id>=<when> and +scene/pause =<when> (the focused scene). One
      # pattern for all three: $+scene/pause *=* would also match here, and both would run.
      CMD`PAUSE`ID: |-
        $+scene/pause *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,firstof(trim(before(%0,chr(61))),scenefocus(%#))),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=No such scene: %q<SceneID>; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @assert not(strmatch(scene(%q<SceneID>,status),finished))=@pemit %#=Scene %q<SceneID> is finished.; @scene/set %q<SceneID>/status=paused; @scene/set %q<SceneID>/scheduledfor=[if(strlen(setr(When,trim(after(%0,chr(61))))),u(%!/FUN`SCHED_WHEN,%q<When>))]; @pemit %#=Scene %q<SceneID> paused[if(strlen(%q<When>),%b[chr(40)]rescheduled for [convsecs(div(scene(%q<SceneID>,scheduledfor),1000))][chr(41)])]. It is on the schedule until +scene/start %q<SceneID> resumes it.

      CMD`FINISH: |-
        $+scene/finish: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert u(%!/FUN`CAN`CLOSE,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_CLOSER)]; @scene/set %q<SceneID>/status=finished; @scene/focus %#=; @pemit %#=Scene finished.

      # +scene/finish <id> closes a scene by id, without joining it: how staff close one they are not in.
      # scene() hides a private scene from a non-member, so a scene.close holder gets past that guard and
      # only a scene that does not exist stops them; to anyone else a hidden scene still reads as missing.
      CMD`FINISH`ID: |-
        $+scene/finish *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert or(not(strmatch(scene(%0,status),#-1*)),permission(%#,scene.close))=@pemit %#=No such scene: %0; @assert not(strmatch(scene(%0,status),#-1 NOT FOUND))=@pemit %#=No such scene: %0; @assert u(%!/FUN`CAN`CLOSE,%#,%0)=@pemit %#=[get(%!/DATA`DENY_NOT_CLOSER)]; @scene/set %0/status=finished; @if strmatch(scenefocus(%#),%0)={@scene/focus %#=}; @pemit %#=Scene %0 finished.

      # ---- membership / RSVP / focus --------------------------------------------
      # An owner who joins their own scene again (the portal's Join, after focusing elsewhere) stays its
      # owner: @scene/member sets the role outright, so it is skipped for them.
      CMD`JOIN: |-
        $+scene/join *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @if not(strmatch(scenemember(%0,%#,role),owner))={@scene/member %0/participant=%#}; @scene/focus %#=%0; @pemit %#=Joined and focused on scene %0.

      # NOTE: one physical line (q-registers cross `;` but not newlines in a $-command body).
      # Capture the focused scene id into %q<SceneID> BEFORE @scene/focus clears it (@assert sets the
      # register and no-ops cleanly when not focused), then drive the writes off %q<SceneID>.
      CMD`LEAVE: |-
        $+scene/leave: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @scene/focus %#=; @if not(words(sceneposes(%q<SceneID>,%#)))={@scene/unmember %q<SceneID>=%#}; @pemit %#=Left the scene.; &MY.SID %#=%q<SceneID>

      # +scene/tag and its common name, +scene/rsvp.
      CMD`TAG:
        value: |-
          $(?is)^\+scene/(?\:tag|rsvp) (.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @scene/member %1/attending=%#; @pemit %#=RSVP'd to scene %1.
        flags: [REGEXP]

      CMD`UNTAG:
        value: |-
          $(?is)^\+scene/(?\:untag|unrsvp) (.+)$: @scene/unmember %1=%#; @pemit %#=Removed RSVP from scene %1.
        flags: [REGEXP]

      CMD`AS: |-
        $+scene/as *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @scene/showas %q<SceneID>/%#=%0; @pemit %#=Future poses show as: %0

      # ---- edit your own poses --------------------------------------------------
      # %1 is find^^^replace. @scene/editpose is the wizard primitive and edits any pose for any editor, so the
      # author check is here: scenepose() with an empty scene finds the pose wherever it is. Stash the poseId in %q<pid>
      # and compute the new content into %q<new> in a separate command first (a nested function
      # reference to the verb's %0/%1 inside an @scene arg does not resolve reliably), then edit off them.
      CMD`EDIT: |-
        $+scene/edit *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert setr(pid,%0); @assert strmatch(scenepose(,%q<pid>,author),num(%#))=@pemit %#=[get(%!/DATA`DENY_NOT_AUTHOR)]; @assert setr(new,edit(scenepose(,%q<pid>,content),before(%1,^^^),after(%1,^^^))); @scene/editpose %q<pid>=%#,%q<new>

      # The whole text at once: the portal's Edit on a pose sends this. Author-only, checked as CMD`EDIT does. The
      # player's command line is evaluated before it is matched, as the player, so %1 is already the text: the
      # composer's %r and %b are its line breaks and spaces, and any function in it ran with the player's own
      # powers, as it would in their say or pose, never the logger's. Nothing here evaluates it again, or a
      # decompose()d \[ that the first pass left as a [ would run as a function. @scene/editpose takes %1 as it
      # is, commas and all (it splits off one field); a substitution is not parsed again.
      CMD`REWRITE: |-
        $+scene/rewrite *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert setr(pid,%0); @assert strmatch(scenepose(,%q<pid>,author),num(%#))=@pemit %#=[get(%!/DATA`DENY_NOT_AUTHOR)]; @assert strlen(%1)=@pemit %#=[get(%!/DATA`DENY_EMPTY)]; @scene/editpose %q<pid>=%#,%1

      CMD`UNDO: |-
        $+scene/undo *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @scene/undo %0

      CMD`REDO: |-
        $+scene/redo *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @scene/redo %0

      CMD`DELETE: |-
        $+scene/delete *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @scene/delete %0

      CMD`MOVE: |-
        $+scene/move *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @scene/move %0=%1

      # ---- visibility -----------------------------------------------------------
      # +scene/public [<id>] and +scene/private [<id>]: the focused scene, or the one named.
      CMD`PRIVACY:
        value: |-
          $(?is)^\+scene/(public|private)(?\: +(\d+))?$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,firstof(%2,scenefocus(%#))),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=No such scene: %q<SceneID>; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @scene/set %q<SceneID>/public=[strmatch(%1,public)]; @pemit %#=Scene %q<SceneID> is now [lcstr(%1)].
        flags: [REGEXP]

      # ---- viewing --------------------------------------------------------------
      # One row of the Players table: what they are to the scene, who they are, how much they have
      # posed. Name carries the persona when there is one, which is where the separate Cast line of
      # personas went: one reading now gives both the character and the name they answer to.
      # The table fills width(%#): Status 12, Poses 7 and the two gaps align() puts between columns leave
      # Name <width> - 21.
      FUN`CAST`COLS: |-
        <12 <[sub(%0,21)] >7
      FUN`CAST`ROW: |-
        [align(u(%!/FUN`CAST`COLS,%2),[capstr(scenemember(%0,%1,role))],[left(u(%!/FUN`CAST`NAME,%0,%1),sub(%2,21))],[words(sceneposes(%0,%1))])]
      FUN`CAST`NAME: |-
        [switch(setr(sa,scenemember(%0,%1,showas)),,[name(%1)],[name(%1)] as %q<sa>)]


      # sceneposes() returns a SPACE-separated id list, so iter() must use the default
      # space input delimiter (an `@` input delim collapsed the whole list into one bogus
      # id → #-1). %r is the output separator (one pose content per line).
      #
      # Two spellings. `+scene/recall <n>` asks for a count; bare `+scene/recall` asks for "enough
      # to see where we are", which is a function of how many people are posing: one round of the
      # room is words(scenemembers()), and DATA`RECALL_ROUNDS rounds of it is what someone who just
      # walked in needs. Both go through INC`RECALL so the two cannot render differently — it reads
      # %q<SceneID> and %q<Count>, which each verb sets before including it.
      #
      # The guard is what makes bare recall safe: sceneposes() answers "#-1 NOT FOUND" for a scene
      # that does not exist, and an unfocused player's scenefocus() IS that string, so without it
      # the verb printed the sentinel back at them.
      DATA`RECALL_ROUNDS: |-
        2

      # One ENTRY per pose: a left rule naming who posed and the pose's id, then the pose itself.
      # Recall used to print bare content lines, which ran together into an undifferentiated block --
      # an @emit carries no name of its own, a multi-line pose reads as several separate ones, and
      # there was no id on screen to hand to +scene/edit or +scene/undo.
      #
      # Attribution comes off the POSE, not off current membership: showas is recorded at write time,
      # so a log read back later shows the name each pose actually went out under rather than whatever
      # persona its author happens to wear now. firstof() falls through to the author's name for a
      # pose written without one.
      #
      # header()'s width argument is left EMPTY, which makes common-functions measure width(%#) —
      # right here, because recall is a @pemit to one player. The capture hooks pass 78 instead for
      # the opposite reason: they emit to a room and have no single recipient to measure.
      FUN`RECALL`ENTRY: |-
        [header([firstof(scenepose(%0,%1,showas),scenepose(%0,%1,authorname))] [chr(183)] pose %1,,left)]%r[scenepose(%0,%1,content)]
      INC`RECALL: |-
        @pemit %#=[iter(sceneposes(%q<SceneID>,,%q<Count>),u(%!/FUN`RECALL`ENTRY,%q<SceneID>,%iL),%b,%r)]
      # The count is validated here rather than left to sceneposes(), which rejects anything below 1
      # with a sentinel this verb would then iterate the WORDS of -- one bogus pose lookup per word,
      # printed at the player. `+scene/recall 0` failed differently and just as badly: "0" is falsy,
      # so the bare @assert broke with no message at all, which is indistinguishable from a command
      # that does not exist. isint() covers the non-numeric spelling, gt() the zero and negative ones.
      DATA`DENY_BAD_COUNT: |-
        How many poses? Give a whole number of 1 or more, or just +scene/recall for the last few.
      CMD`RECALL: |-
        $+scene/recall *: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert and(isint(%0),gt(%0,0))=@pemit %#=[get(%!/DATA`DENY_BAD_COUNT)]; @assert setr(Count,%0); @include %!/INC`RECALL

      # max(1,...) because sceneposes() rejects a count below 1: a scene whose cast has somehow
      # emptied would otherwise ask for zero poses and get an error instead of nothing.
      CMD`RECALL`DEFAULT: |-
        $+scene/recall: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert setr(Count,max(1,mul([get(%!/DATA`RECALL_ROUNDS)],words(scenemembers(%q<SceneID>))))); @include %!/INC`RECALL

      # ---- pose tracker (+pot): query-on-run turn tracker for the focused scene --
      # No hooks, no state: rebuilt each run from the recorded poses. A member's last
      # pose time is sceneposes(scene,member,1) -> scenepose(...,createdat) (Unix-millis,
      # diffed against the clock). Members are ordered OLDEST-pose-first, so whoever is
      # most overdue sits at the top, flagged up-next. Columns align to width(%#).
      FUN`POT_MS: |-
        firstof(scenepose(%0,sceneposes(%0,%1,1),createdat),0)
      # secs(), not msecs(): msecs(<object>) is an OBJECT's modification time in seconds (help
      # MSECS), so msecs() with no argument located an object named "" and every Idle cell read
      # "#-1 ARGUMENT MUST BE INTEGER". POT_MS is milliseconds, so the stored value converts down.
      FUN`POT_IDLE: |-
        switch(setr(ms,u(%!/FUN`POT_MS,%0,%1)),0,-,timestring(sub(secs(),div(%q<ms>,1000))))
      FUN`POT_KEY: |-
        [rjust(u(%!/FUN`POT_MS,%0,%1),15,0)]~%1
      # How long the member's last pose was, in words; "-" before their first.
      FUN`POT_WORDS: |-
        switch(setr(lp,sceneposes(%0,%1,1)),,-,#-1*,-,words(scenepose(%0,%q<lp>,content)))
      # Fills width(%#): # 3, Idle 14, Words 5, the marker 9 and four gaps leave the name <width> - 35.
      FUN`POT_COLS: |-
        >3 <[sub(%0,35)] >14 >5 <9
      FUN`POT_ROW: |-
        align(u(%!/FUN`POT_COLS,%3),%2,left([name(%1)][switch(scenemember(%0,%1,showas),,,%b\([scenemember(%0,%1,showas)]\))],sub(%3,35)),u(%!/FUN`POT_IDLE,%0,%1),u(%!/FUN`POT_WORDS,%0,%1),switch(%2,1,<- up,))
      # Control flow is guard-then-display: the @assert early-exits (no switch() for output) and leaves
      # %q<SceneID> set for the shared display tail, which is @included with that id. The guard is inline
      # for the same reason the approval guard is — an @assert behind an @include does not stop the caller,
      # so the guard used to print "you are not focused" and then render a tracker for scene "#-1 NOT FOUND".
      INC`DISPLAY`POT: |-
        @pemit %#=[header(Pose Tracker - Scene %0,width(%#))]%r[align(u(%!/FUN`HEAD,u(%!/FUN`POT_COLS,width(%#))),#,Name,Idle,Words,Turn)]%r[iter(sort(iter(scenemembers(%0),u(%!/FUN`POT_KEY,%0,%iL))),u(%!/FUN`POT_ROW,%0,after(%iL,~),inum(0),width(%#)),,%r)]%r[footer([words(scenemembers(%0))] in scene - oldest pose is up next,width(%#))]
      CMD`POT: |-
        $+pot: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=You are not focused on a scene. Use +scene/join <id> or +scene/create <title>.; @include %!/INC`DISPLAY`POT=%q<SceneID>

      # ---- scene browser: align()'d tables of scenes -----------------------------
      # Volund-style listing: bare `+scene` = active scenes, `+scene/old` = finished, `+scene/mine` =
      # yours. FUN`LIST_RENDER(<filter>,<width>) builds the whole table; the Title column flexes to
      # the user's terminal width(%#). (Scene DETAILS are `+scene <id>`; scheduled scenes `+scene/upcoming`.)
      #
      # Every table here fills width(%#) exactly. align() puts one space between columns, so the title
      # column is the width less the fixed columns and the gaps, and each cell is cut to its column: a
      # cell wider than its column wraps onto a row of its own.
      FUN`LIST_TITLE: |-
        [switch(setr(ttl,scene(%0,title)),#-1*,\(untitled\),%q<ttl>)]
      # A table's heading row is its column spec with every column underlined: align()'s (u) style
      # draws the line under the whole column, so the headings read as a ruled row. The parentheses are
      # escaped because a bare ) inside iter() would close it.
      FUN`HEAD: |-
        [iter(%0,%i0\(u\))]
      # ID 6, Where 14, Cast 4, Status 9 ("scheduled") and four gaps leave the title <width> - 37.
      FUN`LIST_COLS: |-
        >6 <[sub(%0,37)] <14 >4 <9
      # A scene's title in a table is a link to its card: a client that can click a command runs +scene <id>,
      # and every other client sees the title. cmdlink() needs Send_OOB, which this WIZARD object has.
      FUN`LIST_LINK: |-
        [cmdlink(left(u(%!/FUN`LIST_TITLE,%0),%1),+scene %0,+scene %0)]
      FUN`LIST_ROW: |-
        align(u(%!/FUN`LIST_COLS,%1),left(%0,6),u(%!/FUN`LIST_LINK,%0,sub(%1,37)),left(scene(%0,roomname),14),words(scenemembers(%0)),left(scene(%0,status),9))
      FUN`LIST_RENDER: |-
        [setq(lst,scenelist(%0))][header(Scenes: %0,%1)]%r[align(u(%!/FUN`HEAD,u(%!/FUN`LIST_COLS,%1)),ID,Title,Where,Cast,Status)]%r[if(words(%q<lst>),iter(%q<lst>,u(%!/FUN`LIST_ROW,%iL,%1),%b,%r),No scenes.)]%r[footer([words(%q<lst>)] [if(eq(words(%q<lst>),1),scene,scenes)],%1)]
      # +scene and +scene/list.
      CMD`BROWSE:
        value: |-
          $(?is)^\+scene(?\:/list)?$: @pemit %#=[u(%!/FUN`LIST_RENDER,active,width(%#))]
        flags: [REGEXP]
      CMD`OLD: |-
        $+scene/old: @pemit %#=[u(%!/FUN`LIST_RENDER,finished,width(%#))]
      CMD`MINE: |-
        $+scene/mine: @pemit %#=[u(%!/FUN`LIST_RENDER,mine,width(%#))]

      # ---- scheduling (+scene/schedule ...): roomless future scenes --------------
      # When = a convtime()-parseable date string OR raw epoch-seconds; scheduledfor is UTC-millis.
      # Rescheduling a running scene pauses it: a scene with a time to come is not live. The schedule
      # (scenelist(scheduled)) lists every paused scene, with or without a time.
      FUN`SCHED_WHEN: |-
        mul(firstof(convtime(%0),%0),1000)
      CMD`SCHEDULE: |-
        $+scene/schedule *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert setr(SceneID,scenecreate(,%#,%0)); @scene/member %q<SceneID>/owner=%#; @scene/set %q<SceneID>/status=scheduled; @scene/set %q<SceneID>/scheduledfor=[u(%!/FUN`SCHED_WHEN,%1)]; @pemit %#=Scheduled scene %q<SceneID> "%0" for [convsecs(div(u(%!/FUN`SCHED_WHEN,%1),1000))].
      CMD`RESCHEDULE: |-
        $+scene/reschedule *=*: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert u(%!/FUN`OWNS,%#,%0); @scene/set %0/scheduledfor=[u(%!/FUN`SCHED_WHEN,%1)]; @scene/set %0/status=[switch(setr(st,scene(%0,status)),active,paused,%q<st>)]; @pemit %#=Rescheduled scene %0 for [convsecs(div(u(%!/FUN`SCHED_WHEN,%1),1000))].[if(strmatch(scene(%0,status),paused),%bIt is paused until +scene/start %0 resumes it.)]
      # +scene/unschedule and +scene/cancel take a scene off the schedule for good: its time is cleared
      # and its status is `cancelled`, so it is in no list but the archive. (@scene/delete is the POSE
      # delete; it never removed a scene.) A running scene is ended with +scene/finish instead.
      CMD`UNSCHEDULE:
        value: |-
          $(?is)^\+scene/(?\:unschedule|cancel) (.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(scene(%1,status),#-1*))=@pemit %#=No such scene: %1; @assert u(%!/FUN`OWNS,%#,%1)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @assert not(match(active finished,scene(%1,status)))=@pemit %#=Scene %1 is [scene(%1,status)]. Only a scene that has not started can be cancelled.; @scene/set %1/scheduledfor=; @scene/set %1/status=cancelled; @pemit %#=Cancelled scene %1.
        flags: [REGEXP]
      # The schedule reads like a calendar: scenes in time order, each day under its own rule, the
      # scenes with no time last under theirs. A row carries the time of day, since its rule carries the
      # date. ID 6, Time 5, Status 9 ("scheduled"), RSVP 4 and the four gaps leave the title <width> - 28.
      FUN`SCHED_COLS: |-
        >6 <[sub(%0,28)] <5 <9 >4
      FUN`SCHED_ROW: |-
        align(u(%!/FUN`SCHED_COLS,%1),left(%0,6),u(%!/FUN`LIST_LINK,%0,sub(%1,28)),switch(setr(sw,scene(%0,scheduledfor)),,-,timefmt($H:$M,div(%q<sw>,1000))),left(scene(%0,status),9),words(scenemembers(%0)))
      # The day a scene falls on, as its rule's title: "Saturday, December 12", with the year only
      # when it is not this one.
      FUN`SCHED_DAY: |-
        [switch(setr(sw,scene(%0,scheduledfor)),,No time set,[timefmt($A,setr(ss,div(%q<sw>,1000)))][chr(44)] [timefmt($B,%q<ss>)] [add(timefmt($d,%q<ss>),0)][if(neq(timefmt($Y,%q<ss>),timefmt($Y,secs())),[chr(44)] [timefmt($Y,%q<ss>)])])]
      # How far ahead +scene/upcoming looks unless asked for more. The portal's schedule shows them all.
      DATA`SCHEDULE_DAYS: |-
        30
      DATA`DENY_BAD_DAYS: |-
        How many days ahead? Give a whole number of 1 or more, or all.
      # FUN`SCHED_RENDER(<days>|all,<width>). scenelist(scheduled) is already in time order, untimed
      # scenes last. The window keeps every scene due before its end: one whose time has passed but
      # that has not started yet is still waiting, and an untimed one has no time to be beyond it.
      # %q<pday> is the day of the row before, so a rule is drawn only where the day changes.
      FUN`SCHED_RENDER: |-
        [setq(all,scenelist(scheduled))][setq(lim,if(isint(%0),mul(add(secs(),mul(%0,86400)),1000)))][setq(lst,if(strlen(%q<lim>),squish(iter(%q<all>,if(lt(firstof(scene(%i0,scheduledfor),0),%q<lim>),%i0))),%q<all>))][setq(pday,)][header(Scheduled Scenes,%1)]%r[align(u(%!/FUN`HEAD,u(%!/FUN`SCHED_COLS,%1)),ID,Title,Time,Status,RSVP)]%r[if(words(%q<lst>),iter(%q<lst>,[if(strmatch(setr(day,u(%!/FUN`SCHED_DAY,%i0)),%q<pday>),,[line(%q<day>,%1)]%r)][setq(pday,%q<day>)][u(%!/FUN`SCHED_ROW,%i0,%1)],%b,%r),Nothing is scheduled[if(isint(%0),%bin the next %0 days)].)]%r[footer(u(%!/FUN`SCHED_FOOT,%0,words(%q<lst>),sub(words(%q<all>),words(%q<lst>))),%1)]
      # "2 in the next 30 days", and how to see the rest when the window hides some.
      FUN`SCHED_FOOT: |-
        [if(isint(%0),%1 in the next %0 days[if(%2,[chr(44)] %2 later: +scenes <days>)],%1 scheduled)]
      # +scene/upcoming [<days>|all], and the names other games use for it: +scenes, +events,
      # +scenes/upcoming, +events/upcoming. One regexp pattern, so the aliases and the command cannot drift.
      CMD`UPCOMING:
        value: |-
          $(?is)^\+(?\:scene/upcoming|(?\:scenes|events)(?\:/upcoming)?)(?\: +(.+))?$: @assert or(not(strlen(%1)),strmatch(%1,all),and(isint(%1),gt(%1,0)))=@pemit %#=[get(%!/DATA`DENY_BAD_DAYS)]; @pemit %#=[u(%!/FUN`SCHED_RENDER,firstof(%1,get(%!/DATA`SCHEDULE_DAYS)),width(%#))]
        flags: [REGEXP]

      # ---- participation (+scene/deactivate | /activate): pause/resume w/o leaving -
      # /deactivate clears your focus so poses stop recording, but keeps your membership
      # (and your existing poses); /activate re-focuses you so capture resumes. Softer
      # than join/leave, which add/remove membership.
      CMD`DEACTIVATE: |-
        $+scene/deactivate: @assert not(strmatch(setr(SceneID,scenefocus(%#)),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @scene/focus %#=; @pemit %#=Deactivated scene %q<SceneID> - still a member, poses paused. +scene/activate %q<SceneID> to resume.
      CMD`ACTIVATE: |-
        $+scene/activate *: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @scene/member %0/participant=%#; @scene/focus %#=%0; @pemit %#=Activated scene %0 - your poses are recorded again.

      # ---- summary + info card --------------------------------------------------
      # SCENE_FIELD(scene,field,default) reads a field, substituting <default> for an unset/#-1 result.
      # +scene <id> guards the id arg via @assert/@include, sets %q<SceneID>, then
      # @includes the shared display tail — no switch() picks the output.
      FUN`SCENE_FIELD: |-
        switch(setr(val,scene(%0,%1)),#-1*,%2,,%2,%q<val>)
      # A labelled line: the label right-aligned into a fixed gutter, then its value.
      FUN`INFO_LINE: |-
        [ansi(h,[rjust(%0:,14)])] %1

      # Scene timestamps are Unix MILLIseconds; timefmt() wants seconds.
      #
      # This trimmed the last three digits as text for a while, because div() was 32-bit and answered
      # #-1 ARGUMENTS MUST BE INTEGERS for any real timestamp. #857 made the integer functions 64-bit,
      # so the arithmetic says what it means again.
      FUN`WHEN: |-
        [timefmt($b $d $I:$M$p,div(%0,1000))]

      # Each renders a whole line INCLUDING its %r, or nothing, so an absent value leaves no blank row.
      FUN`SCHEDULED_LINE: |-
        [switch(setr(sw,scene(%0,scheduledfor)),,,[u(%!/FUN`INFO_LINE,Scheduled,u(%!/FUN`WHEN,%q<sw>))]%r)]
      # The scene's page on this game's own website, worked out rather than stored: mud_url is the
      # standard config for a game's web address, and the path follows from the id. A game that has
      # not set one shows no URL line, because there is no address to guess.
      FUN`URL_LINE: |-
        [switch(setr(su,config(mud_url)),,,[u(%!/FUN`INFO_LINE,URL,[u(%!/FUN`URL_TEXT,[u(%!/FUN`NO_TRAILING_SLASH,%q<su>)]/scenes/%0)])]%r)]

      # The address as a link. tagwrap() is markup, not text: Pueblo, MXP and the portal receive the
      # anchor (<A HREF> is the same in both dialects), and every other client the bare address.
      FUN`URL_TEXT: |-
        [tagwrap(a,href="%0",%0)]

      # mud_url is written both ways by different admins, and joining a trailing slash to a leading
      # one gives a path no server answers.
      FUN`NO_TRAILING_SLASH: |-
        [switch(right(%0,1),/,[left(%0,sub(strlen(%0),1))],%0)]
      INC`DISPLAY`INFO: |-
        @pemit %#=[header(<< Scene %0: '[u(%!/FUN`LIST_TITLE,%0)]' >>,width(%#))]%r[u(%!/FUN`INFO_LINE,Status,scene(%0,status))]%r[u(%!/FUN`INFO_LINE,Owner,scene(%0,ownername))]%r[u(%!/FUN`INFO_LINE,Where,u(%!/FUN`SCENE_FIELD,%0,roomname,No room yet))]%r[u(%!/FUN`INFO_LINE,Created,u(%!/FUN`WHEN,scene(%0,startedat)))]%r[u(%!/FUN`SCHEDULED_LINE,%0)][u(%!/FUN`INFO_LINE,Watchers,[switch(scene(%0,public),1,Anyone,Members only)])]%r[line(Pitch,width(%#))]%r[u(%!/FUN`SCENE_FIELD,%0,summary,-)]%r[u(%!/FUN`URL_LINE,%0)][header(Players,width(%#))]%r[align(u(%!/FUN`HEAD,u(%!/FUN`CAST`COLS,width(%#))),Status,Name,Poses)]%r[iter(scenemembers(%0),u(%!/FUN`CAST`ROW,%0,%iL,width(%#)),%b,%r)]%r[footer(,width(%#))]
      # +scene/title [<id>=]<text> and +scene/pitch [<id>=]<text>: the focused scene, or the one named.
      # The id is digits, so a title or pitch that merely has an = in it is not taken for one.
      CMD`TITLE:
        value: |-
          $(?is)^\+scene/title (?\:(\d+)=)?(.+)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=No such scene: %q<SceneID>; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @scene/set %q<SceneID>/title=%2; @pemit %#=Scene %q<SceneID> is now titled: %2
        flags: [REGEXP]
      CMD`PITCH:
        value: |-
          $(?is)^\+scene/pitch (?\:(\d+)=)?(.*)$: @assert u(%!/FUN`IS`APPROVED,%#)=@pemit %#=[get(%!/DATA`DENY_APPROVAL)]; @assert not(strmatch(setr(SceneID,firstof(%1,scenefocus(%#))),#-1*))=@pemit %#=[get(%!/DATA`DENY_NO_FOCUS)]; @assert not(strmatch(scene(%q<SceneID>,status),#-1*))=@pemit %#=No such scene: %q<SceneID>; @assert u(%!/FUN`OWNS,%#,%q<SceneID>)=@pemit %#=[get(%!/DATA`DENY_NOT_OWNER)]; @scene/set %q<SceneID>/summary=%2; @pemit %#=Pitch set for scene %q<SceneID>.
        flags: [REGEXP]
      # Scene DETAILS card. `+scene <id>` and `+scene/info <id>` are the same question asked two
      # ways, so they run the same renderer: naming an id has always meant "tell me about this one".
      #
      # This replaced +scene/who, which could only answer who was in the cast. Somebody asking about a
      # scene wants where it is, what it is about and whether anyone may watch as well — and once the
      # card carries the roster there is nothing left for a second verb to say.
      #
      # Cast and Members are both here because they answer different questions: Cast is the personas
      # that have spoken (scenecast, deduplicated, what a reader of the log sees) and Members is the
      # characters with their roles. A persona is not a character, so one cannot stand in for the
      # other — an actor posing under two names appears once per name in Cast and once in Members.
      # +scene <id>, +scene/info <id> and +event <id>.
      CMD`SHOW:
        value: |-
          $(?is)^\+(?\:scene|scene/info|event) (.+)$: @assert not(strmatch(scene(setr(SceneID,%1),status),#-1*))=@pemit %#=No such scene: %1; @include %!/INC`DISPLAY`INFO=%q<SceneID>
        flags: [REGEXP]

      # +scene/help is the thing a player actually types when they are lost, and before +help
      # existed it was a bare Huh? — issue #860 opens on exactly that transcript. It does not
      # duplicate the topic; it hands the reader the one command that reads it.
      CMD`HELP: |-
        $+scene/help: @pemit %#=Scene help lives under +help. Try: +help scene

      # ---- lifecycle: (re-)establish the three OVERRIDE capture hooks -----------
      # PennMUSH form: @hook/<type> <command> = <object>, <attribute> (RSArgs comma-split).
      # /inline: the capture stands in for the built-in command, so it runs in place as the built-in
      # would. Without it the matched $-command is queued (run_cmd_hook, src/command.c) and the room
      # sees the pose after the rest of the poser's action list.
      AINSTALL: |-
        @teleport %!=#2; @trigger %!/STARTUP
      STARTUP: |-
        @hook/override/inline POSE=%!,CMD`CAPTURE`POSE; @hook/override/inline SAY=%!,CMD`CAPTURE`SAY; @hook/override/inline SEMIPOSE=%!,CMD`CAPTURE`SEMI; @hook/override/inline @EMIT=%!,CMD`CAPTURE`EMIT

  # ---- help storage -------------------------------------------------------
  # An ordinary, unflagged thing holding the +help topics, deliberately NOT the Scene Logger: the
  # Logger must be WIZARD, and the librarian cannot u() a privileged object's attribute. See
  # plus-help's README for that rule and for how an evaluated body is escaped.
  - ref: scene_help
    type: thing
    name: Scene Help
    attributes:
      HELP: |-
        Shared scenes: joining one, posing in it, and reading the log.

      # Cross-references, declared: one SEE leaf per topic at the path it sits at under HELP, a
      # "|"-separated list of topic names. Subtopics are not listed -- HELP`SCENE`JOIN is already a
      # child of HELP`SCENE and +help derives that from the tree.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`SCENE: |-
        pot
      SEE`SCENE`JOIN: |-
        scene pose|pot
      SEE`SCENE`POSE: |-
        scene join
      SEE`SCENE`PITCH: |-
        scene privacy
      SEE`SCENE`PRIVACY: |-
        scene join|scene pitch
      SEE`SCENE`SCHEDULE: |-
        scene join
      SEE`POT: |-
        scene pose|scene join
      HELP`SCENE: |-
        A **scene** is a shared, logged piece of roleplay. Anyone in the room can be in one; the log
        is readable afterwards, in-game and in the portal.

        ## Getting in

        - `+scene` \(or `+scene/list`\) — the scenes running now
        - `+scene <id>` \(or `+event <id>`\) — what a scene is, where it is, and who is in it
        - `+scene/join <id>` — join it and make it your focus
        - `+scene/leave` — stop posing into it

        Once you have joined, ordinary `pose`, `say` and `@emit` in that room are recorded. You do
        not have to use a special command to speak.

        ## Running one

        - `+scene/create <title>` — start one here and focus it
        - `+scene/title \[<id>=\]<text>` — rename it
        - `+scene/pitch \[<id>=\]<text>` — say what it is about, so people can decide to come
        - `+scene/pause` — stop it for now; it leaves the live list for the schedule
        - `+scene/start` — resume a paused scene
        - `+scene/finish` — close it
        - `+scene/finish <id>` — close a scene by id. Its owner can, and so can anyone holding the
          `scene.close` permission: a game defines it with `@permission/define scene.close=Staff` and allows it on
          a role, such as helper, with `@role/allow helper=scene.close`
      HELP`SCENE`JOIN: |-
        `+scene/join <id>` puts you in a scene and makes it your **focus** — the scene your poses are
        recorded into. `+scene` lists the ids.

        - `+scene/tag <id>` — RSVP to a scheduled scene without joining it yet
        - `+scene/untag <id>` — withdraw the RSVP
        - `+scene/leave` — leave the focused scene; if you never posed, you leave no trace
        - `+scene/deactivate` — stay a member but stop recording; `+scene/activate <id>` resumes

        Joining needs an approved character.
      HELP`SCENE`POSE: |-
        With a scene focused, ordinary `pose`, `say`, `semipose` and `@emit` in its room are captured
        as you write them — nothing extra to type.

        The explicit forms name the scene instead of inferring it from the room, which is what the
        portal's compose box sends:

        - `+scene/pose <id>=<text>` · `+scene/say <id>=<text>` · `+scene/semipose <id>=<text>`
        - `+scene/emit <id>=<text>` · `+scene/ooc <id>=<text>` \(out of character\)
        - `+scene/as <name>` — pose under a different name from here on
        - `+scene/edit <id>=<old>^^^<new>` — fix a typo in your own pose
        - `+scene/rewrite <id>=<text>` — replace your own pose's whole text \(the portal's Edit\)
        - `+scene/undo <id>` · `+scene/redo <id>`
        - `+scene/recall <n>` — the last `<n>` poses of your focused scene; bare `+scene/recall`
          gives you two rounds of the room \(twice the size of the cast\). Each pose is introduced
          by a rule naming who posed it and its id, which is the id `+scene/edit` and `+scene/undo`
          take
      HELP`SCENE`PITCH: |-
        `+scene/pitch <text>` sets the summary shown on a scene's card and its page on the website. It is
        how someone browsing decides whether to come. `+scene/pitch <id>=<text>` sets it on a scene you
        own without focusing it, and `+scene/title \[<id>=\]<text>` renames one the same way.

        Only the scene's owner \(or staff\) can set it.
      HELP`SCENE`PRIVACY: |-
        Scenes are **public** by default: they appear in `+scene` and their log is readable.

        - `+scene/private \[<id>\]` — hide the focused scene, or the one named, and its log from everyone
          but its members
        - `+scene/public \[<id>\]` — put it back

        Only the scene's owner \(or staff\) can change this. Privacy is about who may *read*; who may
        *pose* is decided by who has joined.
      HELP`SCENE`SCHEDULE: |-
        A scene can be announced before it happens, so people can plan around it.

        - `+scene/schedule <title>=<when>` — announce one
        - `+scene/upcoming` \(or `+scenes`, `+events`\) — what is scheduled in the next 30 days, by day,
          and how many have RSVP'd
        - `+scene/upcoming <days>` \(or `+scenes <days>`\) — look further ahead; `all` for everything
        - `+scene/tag <id>` \(or `+scene/rsvp <id>`\) — RSVP; `+scene/untag <id>` \(`+scene/unrsvp`\) withdraws it
        - `+scene/reschedule <id>=<when>` · `+scene/unschedule <id>` \(or `+scene/cancel <id>`\)
        - `+scene/pause \[<id>\]\[=<when>\]` — pause a running scene, and optionally give it a new time
        - `+scene/start \[<id>\]` — start a scheduled scene here, or resume a paused one

        Rescheduling a running scene pauses it. A scheduled or paused scene records nothing and is not
        listed as live until its owner starts it.
      HELP`POT: |-
        `+pot` — "pose tracker" — shows who is in your focused scene, how long since each of them
        last posed and how many words that pose was, so a table can tell whose turn it is.

        It needs a focused scene: `+scene/join <id>` or `+scene/create <title>` first.

  # ---- +help registration ---------------------------------------------------
  # Attach mode: one leaf on the librarian saying "scene's topics live on the Scene Logger". The
  # package manager writes it at install and clears it at uninstall, so the librarian's registry
  # cannot drift from what is actually installed — there is nothing to keep in sync by hand.
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`SCENE: |-
        {{scene_help}}

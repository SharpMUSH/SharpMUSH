format: "1.16"
package: mudlet-client-config
title: "Mudlet interface: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Mudlet interface settings into +config: registers them with the +config registry, so staff see and change them with +config mudlet-client."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [mudlet-client, config, bridge]
category: MUD clients
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. mudlet-client declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: mudlet-client
    version: ">=1.1"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/mudlet-client/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`MUDLET-CLIENT: |-
        {{mudlet-client/client}}

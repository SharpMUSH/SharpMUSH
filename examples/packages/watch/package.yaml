format: "1.10"
package: watch
version: 1.0.1
authors: [SharpMUSH]
description: "Watch: +watch tells you when the people you follow connect and leave, and shows their +who status."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [watch, friends, connect, social]
category: Community
requires_server: ">=0.1"

depends:
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: who-where
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/who-where/
      branch: main

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # reads every player's connection, idle time and page lock, and hears every connect and disconnect through
  # ACONNECT and ADISCONNECT, which run on master room objects for everyone.
  #
  # +watch and +friend are added with /noparse/rsnoparse and hooked to CMD`<word>, so what a player types
  # reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC`WATCH` one routine per
  # switch, INC`CONNECT` the login step. FUN`WATCH` the reads, FUN`DISPLAY` and FUN`PAGE` for screens. DATA`
  # the settings, one leaf each. Every record is kept on the Watch Store, never on a player, so nobody can
  # rewrite someone else's watch list.
  - ref: watch
    type: thing
    name: Watch
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      DATA: |-
        Settings. One leaf per setting.
      # How many people one player may watch, and how many seconds pass before a player's connect is
      # announced again, so a connection that drops and comes back does not announce itself every time.
      DATA`WATCH`MAX: |-
        100
      DATA`WATCH`QUIET: |-
        300
      # Which INC` routine each command runs: DATA`ROUTE`WATCH`<switch>. BARE is the command alone, ARG the
      # command with something after it and no switch. +friend uses the same table.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`WATCH`BARE: |-
        WATCH`ONLINE
      DATA`ROUTE`WATCH`ARG: |-
        WATCH`USAGE
      DATA`ROUTE`WATCH`LIST: |-
        WATCH`LIST
      DATA`ROUTE`WATCH`ADD: |-
        WATCH`ADD
      DATA`ROUTE`WATCH`DEL: |-
        WATCH`DEL
      DATA`ROUTE`WATCH`DELETE: |-
        WATCH`DEL
      DATA`ROUTE`WATCH`REMOVE: |-
        WATCH`DEL
      DATA`ROUTE`WATCH`HIDE: |-
        WATCH`HIDE
      DATA`ROUTE`WATCH`UNHIDE: |-
        WATCH`UNHIDE
      DATA`ROUTE`WATCH`MUTE: |-
        WATCH`MUTE
      DATA`ROUTE`WATCH`UNMUTE: |-
        WATCH`UNMUTE
      DATA`ROUTE`WATCH`WATCHERS: |-
        WATCH`WATCHERS
      # The routines that take a page as a last switch: +watch/2, +watch/list/3.
      DATA`PAGED: |-
        WATCH`ONLINE WATCH`LIST WATCH`WATCHERS

      # ---- commands -------------------------------------------------------------
      # Each command word: %1 the switches and %2 what follows, exactly as typed.
      CMD`WATCH:
        value: |-
          $(?is)^\+watch(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,watch,table,WATCH,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`FRIEND:
        value: |-
          $(?is)^\+friend(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,friend,table,WATCH,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch and the page, and runs the
      # routine. Only players keep a watch list.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(WATCH,Only players keep a watch list.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(WATCH,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(WATCH,+%q<cmd_word> has no /%q<cmd_switch> switch. +help watch lists them.,warn); @assert cor(not(%q<page_given>),member(get(%!/DATA`PAGED),%q<cmd_route>))=@pemit %#=notice(WATCH,+%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)] takes no page number.,warn); @assert gt(%q<page_number>,0)=@pemit %#=notice(WATCH,Pages start at 1: +%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)]/2 is the second.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word, cmd_table,
      # cmd_switch_list (every switch but a page), page_given and page_number (a last switch of digits, else 1), cmd_switch (the
      # one other switch), cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the first =,
      # cmd_route (the INC` routine to run), page_size (rows on one page), viewer_objid and viewer_key.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_table,%1,
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          page_given,isint(last(%q<cmd_switch_list>)),
          page_number,if(%q<page_given>,last(%q<cmd_switch_list>),1),
          cmd_switch_list,if(%q<page_given>,ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>)),%q<cmd_switch_list>),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          page_size,u(%!/FUN`PAGE`SIZE),
          viewer_objid,objid(%#),
          viewer_key,u(%!/FUN`KEY,%#))
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 an object: the key its records are filed under. An objid cannot be part of an attribute name,
      # so #12:1790888816538 is filed as 12_1790888816538.
      FUN`KEY:
        value: |-
          edit(objid(%0),#,,:,_)
        flags: [funsyntax]
      # %0 typed text: the objid of the player it names, or nothing.
      FUN`PLAYER:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 seconds: a short duration, 5m or 2h.
      FUN`DISPLAY`DURATION:
        value: |-
          trim(etime(max(0,%0),3))
        flags: [funsyntax]
      # %0 objids: their names, joined into a sentence.
      FUN`DISPLAY`NAMES:
        value: |-
          itemize(iter(%0,name(%i0),,|),|)
        flags: [funsyntax]
      # Table options, every list split by a new line: %0 the columns that never wrap, %1 each column's
      # priority, %2 each column's share of the spare width, %3 each column's least width.
      FUN`DISPLAY`TABLEOPTIONS:
        value: |-
          json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1),grow,json(string,%2),min,json(string,%3))
        flags: [funsyntax]
      # How many rows fit on the reader's screen, under a heading, a table's own heading and a footer.
      FUN`PAGE`SIZE:
        value: |-
          max(5,sub(height(%#,24),6))
        flags: [funsyntax]
      # %0 a list: how many pages it takes.
      FUN`PAGE`COUNT:
        value: |-
          max(1,ceil(fdiv(words(%0),%q<page_size>)))
        flags: [funsyntax]
      # %0 a list: the items on page %q<page_number>, %q<page_size> to a page.
      FUN`PAGE`ITEMS:
        value: |-
          extract(%0,inc(mul(dec(%q<page_number>),%q<page_size>)),%q<page_size>)
        flags: [funsyntax]
      # %0 a list, %1 the command for its pages as typed, %2 the hint when there is one page: the closing rule.
      FUN`PAGE`FOOTER:
        value: |-
          setq(page_count,u(%!/FUN`PAGE`COUNT,%0))[rule(if(gt(%q<page_count>,1),page %q<page_number> of %q<page_count>[if(lt(%q<page_number>,%q<page_count>),%b· %1/[inc(%q<page_number>)])],%2))]
        flags: [funsyntax]
      # Stops a command whose list %<list> has no page %q<page_number>.
      INC`PAGE`CHECK:
        value: |-
          think setq(page_count,u(%!/FUN`PAGE`COUNT,%<list>)); @assert lte(%q<page_number>,%q<page_count>)=@pemit %#=notice(WATCH,There [if(eq(%q<page_count>,1),is only one page,are only %q<page_count> pages)].,warn)
        flags: [cmdsyntax]

      # ---- watch list -----------------------------------------------------------
      # Under WATCH`<key> on the store (the player's objid): LIST (whom they watch), BY (who watches them),
      # HIDE (nobody hears of them), MUTE (they hear of nobody), ANNOUNCED (their connect was announced, so
      # their disconnect will be) and SAID (when a connect of theirs was last announced). LIST and BY are kept
      # together: adding or removing a watch changes both.
      #
      # %0 a player's key: the players they watch who still exist.
      FUN`WATCH`LIST:
        value: |-
          filterbool(%!/FUN`WATCH`EXISTS,get({{store}}/WATCH`%0`LIST))
        flags: [funsyntax]
      FUN`WATCH`EXISTS:
        value: |-
          cand(isdbref(%0),hastype(%0,player))
        flags: [funsyntax]
      # %0 a list of objids: the ones connected and in the reader's who list who have not hidden from watchers,
      # as dbrefs, by name.
      FUN`WATCH`ONLINE:
        value: |-
          sort(filterbool(%!/FUN`WATCH`SHOWN,setinter(iter(%0,num(%i0)),lwho(%#))),namei)
        flags: [funsyntax]
      FUN`WATCH`SHOWN:
        value: |-
          not(get({{store}}/WATCH`[u(%!/FUN`KEY,%0)]`HIDE))
        flags: [funsyntax]
      # %0 a connected watcher, %1 the player who connected or left: 1 when the watcher is told. They must not
      # have muted the list, and must be let through the player's page lock.
      FUN`WATCH`HEARS:
        value: |-
          cand(not(get({{store}}/WATCH`[u(%!/FUN`KEY,%0)]`MUTE)),elock(%1/page,%0))
        flags: [funsyntax]
      # %0 a list of objids: the ones connected, as dbrefs.
      FUN`WATCH`CONNECTED:
        value: |-
          setinter(iter(%0,num(%i0)),lwho())
        flags: [funsyntax]
      # Sets watch_target and watch_target_key from %q<cmd_argument>, a player on the watcher's list (by any
      # part of their name) or any player.
      INC`WATCH`NEEDTARGET:
        value: |-
          @assert strlen(%q<cmd_argument>)=@pemit %#=notice(WATCH,Whom? +%q<cmd_word>/%q<cmd_switch> <name>,warn); think setq(watch_target,firstof(first(squish(iter(u(%!/FUN`WATCH`LIST,%q<viewer_key>),if(strmatch(name(%i0),%q<cmd_argument>*),%i0)))),u(%!/FUN`PLAYER,%q<cmd_argument>))); @assert strlen(%q<watch_target>)=@pemit %#=notice(WATCH,There is no player called '%q<cmd_argument>'.,warn); think setq(watch_target_key,u(%!/FUN`KEY,%q<watch_target>))
        flags: [cmdsyntax]
      INC`WATCH`USAGE:
        value: |-
          @pemit %#=notice(WATCH,+%q<cmd_word> lists who you watch that is on. +%q<cmd_word>/add <name> watches someone. +help watch lists the rest.,warn)
        flags: [cmdsyntax]
      # +watch/add <player>
      INC`WATCH`ADD:
        value: |-
          @include %!/INC`WATCH`NEEDTARGET; @assert comp(%q<watch_target>,%q<viewer_objid>)=@pemit %#=notice(WATCH,You cannot watch yourself.,warn); think setq(watch_list,u(%!/FUN`WATCH`LIST,%q<viewer_key>)); @assert not(member(%q<watch_list>,%q<watch_target>))=@pemit %#=notice(WATCH,You already watch [name(%q<watch_target>)].,warn); @assert lt(words(%q<watch_list>),get(%!/DATA`WATCH`MAX))=@pemit %#=notice(WATCH,You watch [get(%!/DATA`WATCH`MAX)] people%, as many as you can. +%q<cmd_word>/del <name> makes room.,warn); &WATCH`%q<viewer_key> {{store}}=%q<viewer_objid>; &WATCH`%q<viewer_key>`LIST {{store}}=trim(%q<watch_list> %q<watch_target>); &WATCH`%q<watch_target_key> {{store}}=%q<watch_target>; &WATCH`%q<watch_target_key>`BY {{store}}=setunion(get({{store}}/WATCH`%q<watch_target_key>`BY),%q<viewer_objid>); @pemit %#=notice(WATCH,You watch [name(%q<watch_target>)] now: you hear when they connect and leave.,ok)
        flags: [cmdsyntax]
      # +watch/del <player>
      INC`WATCH`DEL:
        value: |-
          @include %!/INC`WATCH`NEEDTARGET; @assert member(get({{store}}/WATCH`%q<viewer_key>`LIST),%q<watch_target>)=@pemit %#=notice(WATCH,You do not watch [name(%q<watch_target>)].,warn); &WATCH`%q<viewer_key>`LIST {{store}}=remove(get({{store}}/WATCH`%q<viewer_key>`LIST),%q<watch_target>); &WATCH`%q<watch_target_key>`BY {{store}}=remove(get({{store}}/WATCH`%q<watch_target_key>`BY),%q<viewer_objid>); @pemit %#=notice(WATCH,You no longer watch [name(%q<watch_target>)].,ok)
        flags: [cmdsyntax]
      # +watch[/<page>]: whom the player watches who is on now.
      INC`WATCH`ONLINE:
        value: |-
          think setq(watch_list,u(%!/FUN`WATCH`LIST,%q<viewer_key>)); @assert words(%q<watch_list>)=@pemit %#=notice(WATCH,You watch nobody. +%q<cmd_word>/add <name> watches someone.); think setq(watch_online,u(%!/FUN`WATCH`ONLINE,%q<watch_list>)); @assert words(%q<watch_online>)=@pemit %#=notice(WATCH,Nobody you watch is on. +%q<cmd_word>/list shows them all.); @include/args %!/INC`PAGE`CHECK=list,%q<watch_online>; @pemit %#=u(%!/FUN`WATCH`ONLINETABLE,u(%!/FUN`PAGE`ITEMS,%q<watch_online>))%r[u(%!/FUN`PAGE`FOOTER,%q<watch_online>,+%q<cmd_word>,[words(%q<watch_online>)] of [words(%q<watch_list>)] on · +%q<cmd_word>/list shows them all)]
        flags: [cmdsyntax]
      # %0 players: name, idle, where they are when the reader may locate them, and the status +who shows for them.
      FUN`WATCH`ONLINETABLE:
        value: |-
          rule(Watched and on)%r[datacolumns(u(%!/FUN`DISPLAY`TABLEOPTIONS,1%r2%r3,1%r2%r3%r2,%r%r%r1,%r%r%r20),[tone(strong,Name)]%r[iter(%0,name(%i0),,%r)],>[tone(strong,Idle)]%r[iter(%0,u(%!/FUN`DISPLAY`DURATION,idle(%i0)),,%r)],[tone(strong,Where)]%r[iter(%0,if(findable(%#,%i0),name(room(%i0)),-),,%r)],[tone(strong,Status)]%r[iter(%0,firstof(u({{who-where/ww_functions}}/WW_FN_FILTER,WHO`STATUS,,%i0),-),,%r)])]
        flags: [funsyntax]
      # +watch/list[/<page>]: everyone the player watches, on or not.
      INC`WATCH`LIST:
        value: |-
          think setq(watch_list,u(%!/FUN`WATCH`LIST,%q<viewer_key>)); @assert words(%q<watch_list>)=@pemit %#=notice(WATCH,You watch nobody. +%q<cmd_word>/add <name> watches someone.); think setqm(watch_online,iter(u(%!/FUN`WATCH`ONLINE,%q<watch_list>),objid(%i0)),watch_list,u(%!/FUN`WATCH`SORTED,%q<watch_list>)); @include/args %!/INC`PAGE`CHECK=list,%q<watch_list>; @pemit %#=u(%!/FUN`WATCH`LISTTABLE,u(%!/FUN`PAGE`ITEMS,%q<watch_list>))%r[u(%!/FUN`PAGE`FOOTER,%q<watch_list>,+%q<cmd_word>/list,[words(%q<watch_list>)] watched · [if(get({{store}}/WATCH`%q<viewer_key>`MUTE),muted: +%q<cmd_word>/unmute,+%q<cmd_word>/mute stops the notices)])]
        flags: [cmdsyntax]
      # %0 objids: the same, by name.
      FUN`WATCH`SORTED:
        value: |-
          iter(sort(iter(%0,num(%i0)),namei),objid(%i0))
        flags: [funsyntax]
      # %0 objids: name, and on or when last on. Who is on comes from %q<watch_online>.
      FUN`WATCH`LISTTABLE:
        value: |-
          rule(Watched)%r[datacolumns(u(%!/FUN`DISPLAY`TABLEOPTIONS,1%r2,1%r1,,),[tone(strong,Name)]%r[iter(%0,name(%i0),,%r)],[tone(strong,Last on)]%r[iter(%0,if(member(%q<watch_online>,%i0),tone(success,on now),u(%!/FUN`WATCH`LASTON,%i0)),,%r)])]
        flags: [funsyntax]
      # %0 a player who is not on, as far as the reader knows: how long ago they left.
      FUN`WATCH`LASTON:
        value: |-
          if(isint(setr(watch_left,convtime(get(%0/LASTLOGOUT)))),[u(%!/FUN`DISPLAY`DURATION,sub(secs(),%q<watch_left>))] ago,-)
        flags: [funsyntax]
      # +watch/watchers[/<page>]: who watches the player.
      INC`WATCH`WATCHERS:
        value: |-
          think setq(watch_by,u(%!/FUN`WATCH`SORTED,filterbool(%!/FUN`WATCH`EXISTS,get({{store}}/WATCH`%q<viewer_key>`BY)))); @assert words(%q<watch_by>)=@pemit %#=notice(WATCH,Nobody watches you.); think setq(page_size,mul(%q<page_size>,3)); @include/args %!/INC`PAGE`CHECK=list,%q<watch_by>; @pemit %#=rule(Watching you)%r[grid(iter(u(%!/FUN`PAGE`ITEMS,%q<watch_by>),name(%i0),,|),|)]%r[u(%!/FUN`PAGE`FOOTER,%q<watch_by>,+%q<cmd_word>/watchers,[words(%q<watch_by>)] watching · [if(get({{store}}/WATCH`%q<viewer_key>`HIDE),hidden: +%q<cmd_word>/unhide,+%q<cmd_word>/hide stops them hearing of you)])]
        flags: [cmdsyntax]
      INC`WATCH`HIDE:
        value: |-
          @assert not(get({{store}}/WATCH`%q<viewer_key>`HIDE))=@pemit %#=notice(WATCH,You are already hidden from watchers.,warn); &WATCH`%q<viewer_key> {{store}}=%q<viewer_objid>; &WATCH`%q<viewer_key>`HIDE {{store}}=1; @pemit %#=notice(WATCH,Nobody hears when you connect or leave%, and you are left out of everyone's +%q<cmd_word>. +%q<cmd_word>/unhide undoes it.,ok)
        flags: [cmdsyntax]
      INC`WATCH`UNHIDE:
        value: |-
          @assert get({{store}}/WATCH`%q<viewer_key>`HIDE)=@pemit %#=notice(WATCH,You are not hidden from watchers.,warn); &WATCH`%q<viewer_key>`HIDE {{store}}; @pemit %#=notice(WATCH,Those who watch you hear when you connect and leave again.,ok)
        flags: [cmdsyntax]
      INC`WATCH`MUTE:
        value: |-
          @assert not(get({{store}}/WATCH`%q<viewer_key>`MUTE))=@pemit %#=notice(WATCH,You already hear of nobody.,warn); &WATCH`%q<viewer_key> {{store}}=%q<viewer_objid>; &WATCH`%q<viewer_key>`MUTE {{store}}=1; @pemit %#=notice(WATCH,You no longer hear when the people you watch connect and leave. +%q<cmd_word> still lists them.,ok)
        flags: [cmdsyntax]
      INC`WATCH`UNMUTE:
        value: |-
          @assert get({{store}}/WATCH`%q<viewer_key>`MUTE)=@pemit %#=notice(WATCH,You already hear of the people you watch.,warn); &WATCH`%q<viewer_key>`MUTE {{store}}; @pemit %#=notice(WATCH,You hear when the people you watch connect and leave again.,ok)
        flags: [cmdsyntax]
      # Tells %<target>'s watchers that they connected or left (%<event>, connected or disconnected). A
      # connect is announced unless the player is hidden from watchers, DARK, or connected hidden, or had a
      # connect announced in the last DATA`WATCH`QUIET seconds, and counts as announced only once someone hears
      # it. A disconnect is announced only when its connect was and the player has not since hidden or gone DARK.
      INC`WATCH`ANNOUNCE:
        value: |-
          think setq(watch_key,u(%!/FUN`KEY,%<target>)); @break strmatch(%<event>,disconnected)={@include/args %!/INC`WATCH`ANNOUNCEOFF=target,%<target>,key,%q<watch_key>}; @break get({{store}}/WATCH`%q<watch_key>`HIDE); @break cor(hasflag(%<target>,dark),hidden(%<target>)); @assert gte(sub(secs(),default({{store}}/WATCH`%q<watch_key>`SAID,0)),get(%!/DATA`WATCH`QUIET)); think setq(watch_hearers,filterbool(%!/FUN`WATCH`HEARS,u(%!/FUN`WATCH`CONNECTED,get({{store}}/WATCH`%q<watch_key>`BY)),,,%<target>)); @assert words(%q<watch_hearers>); &WATCH`%q<watch_key>`SAID {{store}}=secs(); &WATCH`%q<watch_key>`ANNOUNCED {{store}}=1; @pemit/list %q<watch_hearers>=notice(WATCH,name(%<target>) has connected.)
        flags: [cmdsyntax]
      INC`WATCH`ANNOUNCEOFF:
        value: |-
          @assert get({{store}}/WATCH`%<key>`ANNOUNCED); &WATCH`%<key>`ANNOUNCED {{store}}; @break get({{store}}/WATCH`%<key>`HIDE); @break cor(hasflag(%<target>,dark),hidden(%<target>)); think setq(watch_hearers,filterbool(%!/FUN`WATCH`HEARS,u(%!/FUN`WATCH`CONNECTED,get({{store}}/WATCH`%<key>`BY)),,,%<target>)); @assert words(%q<watch_hearers>); @pemit/list %q<watch_hearers>=notice(WATCH,name(%<target>) has disconnected.)
        flags: [cmdsyntax]

      # ---- connect and disconnect -----------------------------------------------
      # Master room ACONNECT and ADISCONNECT run for every player, as this object, with %# the player and %1
      # how many connections they have. Only the first connection and the last disconnection count.
      ACONNECT:
        value: |-
          @assert cand(eq(%1,1),hastype(%#,player)); @include/nobreak/args %!/INC`WATCH`ANNOUNCE=target,%#,event,connected; @include/nobreak %!/INC`CONNECT`WATCHED
        flags: [cmdsyntax]
      ADISCONNECT:
        value: |-
          @assert cand(eq(%1,0),hastype(%#,player)); @include/args %!/INC`WATCH`ANNOUNCE=target,%#,event,disconnected
        flags: [cmdsyntax]
      # At login: who of those the player watches is on, unless they muted the watch list.
      INC`CONNECT`WATCHED:
        value: |-
          think setq(viewer_key,u(%!/FUN`KEY,%#)); @break get({{store}}/WATCH`%q<viewer_key>`MUTE); think setq(watch_online,u(%!/FUN`WATCH`ONLINE,u(%!/FUN`WATCH`LIST,%q<viewer_key>))); @assert words(%q<watch_online>); @pemit %#=notice(WATCH,On now of those you watch: [u(%!/FUN`DISPLAY`NAMES,%q<watch_online>)].)
        flags: [cmdsyntax]
      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @dolist/inline watch friend={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # Every watch list. Inside the Watch object, so no player can reach it, and no_command, so nothing kept on
  # it is ever matched as a command.
  - ref: store
    type: thing
    name: Watch Store
    location: "{{watch}}"
    flags: [no_command]
    attributes:
      WATCH: |-
        Watch lists, one branch per player key.

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: watch_help
    type: thing
    name: Watch Help
    location: "{{watch}}"
    attributes:
      HELP: |-
        Hearing when the people you play with connect: +watch.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`WATCH: |-
        who
      HELP`WATCH: |-
        The **watch list** tells you when people you want to play with connect and leave.

        - `+watch/add <name>` watches someone, and `+watch/del <name>` stops.
        - `+watch` lists the people you watch who are on, with where they are and their status from `+who`. `+watch/list` lists them all, with when each was last on.
        - `+watch/mute` stops the connect and disconnect lines but keeps your list, and `+watch/unmute` starts them again.

        `+friend` is the same command, so `+friend/add` and `+friend/del` work too.

        ## Privacy

        - `+watch/watchers` shows who watches you.
        - `+watch/hide` keeps you out of everyone's watch lines and their `+watch`. `+watch/unhide` undoes it.
        - Someone your page lock keeps out is never told when you connect. See `help @lock/page`.
        - Nobody hears of you while you are DARK or connected hidden, and someone who cannot locate you sees no room for you in `+watch`.
      HELP`WATCH`STAFF: |-
        Each setting is an attribute on the Watch object in the master room:

        - `` DATA`WATCH`MAX ``: how many people one player may watch. 100.
        - `` DATA`WATCH`QUIET ``: seconds before a player's connect is announced again, so a dropped connection does not announce itself each time. 300.


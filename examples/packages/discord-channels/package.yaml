format: "1.16"
package: discord-channels
title: "Discord channel bridge"
version: 1.3.0
authors: [SharpMUSH]
description: "Joins a game channel to a Discord channel, both ways: what is said on the game channel is posted in Discord, and what Discord members post comes back onto the game channel. +discord/channel joins one and links the Discord channel when it is not linked yet, +discord/channels lists them, and +discord/channel/unrestricted lets members without a game account speak there."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [discord, chat, channels, bridge, feed]
category: Community
requires_server: ">=0.1"

# Neither side knows about the other. The discord package's feed kind carries a Discord channel's lines (the
# feed discord/<channel id>), and the Discord plugin posts them; the game's channels carry their own. This
# package passes lines between the two: the CHANNEL`MESSAGE event sends a game channel's lines to its Discord
# feed, and a tap on the discord kind emits the lines Discord members posted onto the game channel.
#
# A line goes one way only, so nothing comes back round. The event skips the lines this package emitted, and
# the tap passes on only lines that came from Discord (%<origin> is discord/<message id>), not the ones the
# event sent there.
depends:
  - package: discord
    version: ">=1.2 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/discord/
      branch: main

objects:
  # The links and the commands. WIZARD because it emits onto channels it is not on, its tap and the event
  # send on Discord feeds owned by the Discord Bridge, and a wizard may give itself a role below its own:
  # STARTUP gives it the discord package's Discord Admin role, since @discord/link, @discord/unrestricted and
  # discordlink() need discord.admin and wizards do not hold it. It runs them only for players who hold it too.
  #
  # Trees: CMD` the commands, INC`CMD` their steps, FUN`LINK` the reads about a link, FUN`DISPLAY` what players
  # see, TAP`DISCORD the tap, and DATA`LINK` the links:
  #
  #   DATA`LINK`<discord channel id>      the game channel's name
  #   DATA`LINK`<discord channel id>`BY   the objid of whoever linked it, who may remove it once the channel is gone
  - ref: links
    type: thing
    name: Discord Channels
    flags: [WIZARD]
    location: "{{$master_room}}"
    attributes:
      DATA:
        value: |-
          The links. One branch per linked Discord channel.
        flags: [no_command]
      DATA`LINK: |-
        One branch per linked Discord channel, by its id: the game channel's name, and BY, who linked it.

      CMD`LIST: |-
        $+discord/channels:@pemit %#=u(me/FUN`DISPLAY`LIST)
      CMD`LINK: |-
        $+discord/channel *=*:@include/args me/INC`CMD`LINK=channel,%0,discord_channel_id,%1,confirmed,0
      CMD`LINK`CONFIRM: |-
        $+discord/channel/confirm *=*:@include/args me/INC`CMD`LINK=channel,%0,discord_channel_id,%1,confirmed,1
      CMD`REMOVE: |-
        $+discord/channel/remove *:@include/args me/INC`CMD`REMOVE=channel,%0
      CMD`UNRESTRICTED: |-
        $+discord/channel/unrestricted *:@include/args me/INC`CMD`ACCESS=channel,%0,access,unrestricted
      CMD`RESTRICT: |-
        $+discord/channel/restrict *:@include/args me/INC`CMD`ACCESS=channel,%0,access,restrict

      # %<channel> the game channel as typed, %<discord_channel_id> the Discord channel's id, %<confirmed> 1 when
      # the player confirmed that a channel with a see or join lock goes to Discord.
      INC`CMD`LINK: |-
        @assert not(strmatch(setr(game_channel,cinfo(%<channel>,name)),#-*))=@pemit %#=notice(DISCORD,There is no channel called %<channel>.,warn); @assert u(me/FUN`LINK`MAYLINK,%#,%q<game_channel>)=@pemit %#=notice(DISCORD,Only the channel's owner or staff with chat.admin link %q<game_channel> to Discord.,warn); @assert cand(regmatch(%<discord_channel_id>,^\\d+$),gte(strlen(%<discord_channel_id>),17),lte(strlen(%<discord_channel_id>),20))=@pemit %#=notice(DISCORD,%<discord_channel_id> is not a Discord channel id. @discord lists the linked channels with their ids.,warn); @assert not(strlen(v(DATA`LINK`%<discord_channel_id>)))=@pemit %#=notice(DISCORD,That Discord channel already goes to [v(DATA`LINK`%<discord_channel_id>)].,warn); @assert not(strlen(u(me/FUN`LINK`OF,%q<game_channel>)))=@pemit %#=notice(DISCORD,%q<game_channel> already goes to Discord channel [u(me/FUN`LINK`OF,%q<game_channel>)]. +discord/channel/remove %q<game_channel> first.,warn); @assert cor(%<confirmed>,not(u(me/FUN`LINK`PRIVATE,%q<game_channel>)))=@pemit %#=notice(DISCORD,%q<game_channel> is for staff only or has a see or join lock%, but everyone who can read the Discord channel will read it. +discord/channel/confirm %q<game_channel>=%<discord_channel_id> links it anyway.,warn); &DATA`LINK`%<discord_channel_id> me=%q<game_channel>; &DATA`LINK`%<discord_channel_id>`BY me=objid(%#); @pemit %#=notice(DISCORD,%q<game_channel> goes to Discord channel %<discord_channel_id>%, and what is posted there comes back.,ok); @include/args me/INC`CMD`DISCORDLINK=discord_channel_id,%<discord_channel_id>
      # %<discord_channel_id> a Discord channel the game may not have linked yet: links it, when the player may.
      # @discord/link answers the one who ran it, this object, so the player is pointed at +discord/channels.
      INC`CMD`DISCORDLINK: |-
        @break not(strmatch(discordlink(%<discord_channel_id>),#-*)); @break not(permission(%#,discord.admin))=@pemit %#=notice(DISCORD,The game has not linked Discord channel %<discord_channel_id> yet%, so nothing crosses until staff with discord.admin type: @discord/link %<discord_channel_id>,warn); @discord/link %<discord_channel_id>; @pemit %#=notice(DISCORD,Linking Discord channel %<discord_channel_id> too. +discord/channels shows when it is linked.,ok)
      # %<channel> a joined game channel as typed, %<access> unrestricted or restrict: whether Discord members without a
      # game account may speak in its Discord channel. Discord's channel permissions change, so it needs discord.admin.
      INC`CMD`ACCESS: |-
        @assert strlen(setr(discord_channel_id,u(me/FUN`LINK`OF,firstof(cinfo(%<channel>,name),%<channel>))))=@pemit %#=notice(DISCORD,%<channel> does not go to Discord.,warn); @assert permission(%#,discord.admin)=@pemit %#=notice(DISCORD,Only staff with discord.admin change who may speak in a Discord channel.,warn); @assert not(strmatch(discordlink(%q<discord_channel_id>),#-*))=@pemit %#=notice(DISCORD,The game has not linked Discord channel %q<discord_channel_id> yet. Link it with @discord/link %q<discord_channel_id> first.,warn); @switch %<access>=unrestricted,{@discord/unrestricted %q<discord_channel_id>; @pemit %#=notice(DISCORD,Opening [v(DATA`LINK`%q<discord_channel_id>)]'s Discord channel to members without a game account%, whose lines show as \[D\] and their Discord name. +discord/channels shows when it is done.,ok)},{@discord/restrict %q<discord_channel_id>; @pemit %#=notice(DISCORD,Closing [v(DATA`LINK`%q<discord_channel_id>)]'s Discord channel to all but linked members. +discord/channels shows when it is done.,ok)}
      # %<channel> the game channel as typed, or the name it had when it was linked. @wipe takes the link's BY with it.
      INC`CMD`REMOVE: |-
        @assert strlen(setr(discord_channel_id,u(me/FUN`LINK`OF,firstof(cinfo(%<channel>,name),%<channel>))))=@pemit %#=notice(DISCORD,%<channel> does not go to Discord.,warn); @assert u(me/FUN`LINK`MAYREMOVE,%#,%q<discord_channel_id>)=@pemit %#=notice(DISCORD,Only the channel's owner or staff with chat.admin unlink [v(DATA`LINK`%q<discord_channel_id>)].,warn); @pemit %#=notice(DISCORD,[v(DATA`LINK`%q<discord_channel_id>)] no longer goes to Discord channel %q<discord_channel_id>.,ok); @wipe me/DATA`LINK`%q<discord_channel_id>

      # %0 a player, %1 a game channel: whether they may link it.
      FUN`LINK`MAYLINK: |-
        cor(permission(%0,chat.admin),not(comp(objid(cowner(%1)),objid(%0))))
      # %0 a player, %1 a Discord channel id: whether they may remove its link. Once the game channel is renamed
      # or gone, cowner() has nothing to answer, so whoever linked it may.
      FUN`LINK`MAYREMOVE: |-
        cor(u(me/FUN`LINK`MAYLINK,%0,v(DATA`LINK`%1)),cand(strmatch(cinfo(v(DATA`LINK`%1),name),#-*),not(comp(v(DATA`LINK`%1`BY),objid(%0)))))
      # %0 a game channel: whether not everyone reads it, because it is an Admin or Wizard channel or has a see or
      # join lock.
      FUN`LINK`PRIVATE: |-
        cor(strlen(clock(%0/see)),strlen(clock(%0/join)),match(clflags(%0),Admin),match(clflags(%0),Wizard))
      # %0 a game channel: the Discord channel id it goes to, or nothing.
      FUN`LINK`OF: |-
        first(iter(lattr(me/DATA`LINK`*),if(not(comp(lcstr(v(%i0)),lcstr(%0))),last(%i0,`))))
      # %0 a style, %1 the speaker's name, %2 the text: the line as the game channel shows it.
      FUN`DISPLAY`LINE: |-
        switch(%0,pose,%1 %2,semipose,%1%2,emit,%2,%1 says%, "%2")
      # The linked channels, as +discord/channels shows them.
      FUN`DISPLAY`LIST: |-
        if(words(lattr(me/DATA`LINK`*)),box(datacolumns(json(object,delim,json(string,%r),grow,json(string,1)),tone(strong,Game channel)%r[iter(lattr(me/DATA`LINK`*),u(me/FUN`DISPLAY`CHANNELNAME,v(%i0)),,%r)],tone(strong,Discord channel)%r[iter(lattr(me/DATA`LINK`*),last(%i0,`),,%r)],tone(strong,Who speaks)%r[iter(lattr(me/DATA`LINK`*),u(me/FUN`DISPLAY`ACCESS,last(%i0,`)),,%r)])%r[rule()]%r[tone(muted,+discord/channel <channel>=<Discord channel id> links one · +discord/channel/remove <channel> unlinks it · +discord/channel/unrestricted <channel> lets anyone on Discord speak)],Discord Channels),notice(DISCORD,No game channel goes to Discord. +discord/channel <channel>=<Discord channel id> links one.))
      # %0 a Discord channel id: who may speak there, or that the game has not linked it.
      FUN`DISPLAY`ACCESS: |-
        switch(discordlink(%0),unrestricted,anyone,restricted,linked members,tone(error,not linked))
      # %0 a linked channel's name: the name, or a note that no channel has it any more.
      FUN`DISPLAY`CHANNELNAME: |-
        if(strmatch(cinfo(%0,name),#-*),%0 [tone(error,no such channel)],%0)

      # A tap on the discord kind. It hears every line sent on a Discord feed, after it is delivered, with the
      # speaker as enactor (help @feed taps), and passes on the lines Discord members posted. /noisy puts the
      # channel's name in front, as the channel shows it. A member without a game account has no speaker;
      # %<name> is then their Discord name behind [D].
      TAP`DISCORD: |-
        @assert cand(strmatch(%<origin>,discord/*),strlen(setr(game_channel,v(DATA`LINK`[after(%<feed>,/)])))); @cemit/noisy %q<game_channel>=u(me/FUN`DISPLAY`LINE,%<style>,firstof(%<name>,name(%<speaker>)),%<text>)

      # Taps are stored, so this only puts the tap back after the discord kind was undefined and defined again, or
      # adds TAP`DISCORD after an update from 1.0, whose tap was on TAP. The role is for @discord/link and
      # discordlink(); giving it again changes nothing.
      STARTUP: |-
        @feed/tap discord={{links}}/TAP`DISCORD; @role/assign me=discord-admin
      AINSTALL: |-
        @trigger {{links}}/STARTUP
      AUPDATE: |-
        @trigger {{links}}/STARTUP

  # A game channel's lines to its Discord channel. The event runs as the event handler with the speaker as
  # enactor, so @feed/send sends as the speaker, who must pass the Discord feed's send lock (help @feed
  # sending). A connect or disconnect line stays in the game, and so does a line this package emitted. An
  # emit names no speaker in the game, so in Discord it goes under the channel's name. Each style is its own
  # @feed/send switch, and a command's switch is not evaluated, so the @switch names each one.
  - ref: event
    target: "{{$event_handler}}"
    attributes:
      CHANNEL`MESSAGE`DISCORDCHANNELS: |-
        @assert cand(comp(%<style>,presence),comp(objid(%#),objid({{links}})),strlen(setr(discord_channel_id,u({{links}}/FUN`LINK`OF,%<channel>)))); @switch %<style>=emit,{@feed/send/emit/as discord/%q<discord_channel_id>=%<channel>/%<message>},pose,{@feed/send/pose discord/%q<discord_channel_id>=%<message>},semipose,{@feed/send/semipose discord/%q<discord_channel_id>=%<message>},{@feed/send/say discord/%q<discord_channel_id>=%<message>}

  - ref: help
    type: thing
    name: Discord Channels Help
    attributes:
      HELP: |-
        Joining game channels to Discord channels.
      HELP`DISCORD`CHANNELS: |-
        A game channel can be joined to a Discord channel. What is said on the game channel is posted
        in Discord under the speaker's name, and what Discord members post comes back onto the game
        channel, with its usual `<Channel>` prefix.

        - `+discord/channels` lists the joined channels and who may speak in each Discord channel.
        - `+discord/channel <channel>=<Discord channel id>` joins a game channel to a Discord channel,
          and links the Discord channel too (`@discord/link`) when you hold `discord.admin`.
        - `+discord/channel/remove <channel>` takes it apart again.
        - `+discord/channel/unrestricted <channel>` lets Discord members without a game account speak.
          `+discord/channel/restrict <channel>` limits it to linked members again. Both need `discord.admin`.

        Only the channel's owner, or staff with `chat.admin`, joins or parts a channel. A staff-only
        channel, or one with a see or join lock, needs `/confirm`, because everyone who can read the
        Discord channel reads it.

        Example:

        ```
        > +discord/channel Public=1427000000000000001
        DISCORD: Public goes to Discord channel 1427000000000000001, and what is posted there comes back.
        DISCORD: Linking Discord channel 1427000000000000001 too. +discord/channels shows when it is linked.
        ```

        Output: a line from a linked member shows as their character, `<Public> Ann says, "Hi."`, and one
        from a member without a game account as `<Public> [D] Mercutio says, "Hi."`.

        Only lines whose speaker passes the Discord feed's send lock reach Discord. Renaming the game
        channel parts it from Discord: remove the old name with `+discord/channel/remove`, then join again.

format: "1.10"
package: discord-channels
version: 1.1.0
authors: [SharpMUSH]
description: "Joins a game channel to a linked Discord channel, both ways: what is said on the game channel is posted in Discord, and what Discord members post comes back onto the game channel. +discord/channel links one, +discord/channels lists them."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [discord, chat, channels, bridge, feed]
category: Community
requires_server: ">=0.1"

# Neither side knows about the other. The discord package's feed kind carries a Discord channel's lines (the
# feed discord/<channel id>), and the Discord plugin posts them; the game's channels carry their own. This
# package passes lines between the two: the CHANNEL`MESSAGE event sends a game channel's lines to its Discord
# feed, and a tap on the discord kind emits the lines Discord members posted onto the game channel.
#
# A line goes one way only, so nothing comes back round. The event skips the lines this package emitted, and
# the tap passes on only lines that came from Discord (%<origin> is discord/<message id>), not the ones the
# event sent there.
depends:
  - package: discord
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/discord/
      branch: main
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  # The links and the commands. WIZARD because it emits onto channels it is not on, and its tap and the event
  # send on Discord feeds owned by the Discord Bridge.
  #
  # Trees: CMD` the commands, INC`CMD` their steps, FUN`LINK` the reads about a link, FUN`DISPLAY` what players
  # see, TAP`DISCORD the tap, and DATA`LINK` the links:
  #
  #   DATA`LINK`<discord channel id>      the game channel's name
  #   DATA`LINK`<discord channel id>`BY   the objid of whoever linked it, who may remove it once the channel is gone
  - ref: links
    type: thing
    name: Discord Channels
    flags: [WIZARD]
    location: "{{$master_room}}"
    attributes:
      DATA:
        value: |-
          The links. One branch per linked Discord channel.
        flags: [no_command]
      DATA`LINK: |-
        One branch per linked Discord channel, by its id: the game channel's name, and BY, who linked it.

      CMD`LIST: |-
        $+discord/channels:@pemit %#=u(me/FUN`DISPLAY`LIST)
      CMD`LINK: |-
        $+discord/channel *=*:@include/args me/INC`CMD`LINK=channel,%0,discord_channel_id,%1,confirmed,0
      CMD`LINK`CONFIRM: |-
        $+discord/channel/confirm *=*:@include/args me/INC`CMD`LINK=channel,%0,discord_channel_id,%1,confirmed,1
      CMD`REMOVE: |-
        $+discord/channel/remove *:@include/args me/INC`CMD`REMOVE=channel,%0

      # %<channel> the game channel as typed, %<discord_channel_id> the Discord channel's id, %<confirmed> 1 when
      # the player confirmed that a channel with a see or join lock goes to Discord.
      INC`CMD`LINK: |-
        @assert not(strmatch(setr(game_channel,cinfo(%<channel>,name)),#-*))=@pemit %#=notice(DISCORD,There is no channel called %<channel>.,warn); @assert u(me/FUN`LINK`MAYLINK,%#,%q<game_channel>)=@pemit %#=notice(DISCORD,Only the channel's owner or staff with chat.admin link %q<game_channel> to Discord.,warn); @assert cand(regmatch(%<discord_channel_id>,^\\d+$),gte(strlen(%<discord_channel_id>),17),lte(strlen(%<discord_channel_id>),20))=@pemit %#=notice(DISCORD,%<discord_channel_id> is not a Discord channel id. @discord lists the linked channels with their ids.,warn); @assert not(strlen(v(DATA`LINK`%<discord_channel_id>)))=@pemit %#=notice(DISCORD,That Discord channel already goes to [v(DATA`LINK`%<discord_channel_id>)].,warn); @assert not(strlen(u(me/FUN`LINK`OF,%q<game_channel>)))=@pemit %#=notice(DISCORD,%q<game_channel> already goes to Discord channel [u(me/FUN`LINK`OF,%q<game_channel>)]. +discord/channel/remove %q<game_channel> first.,warn); @assert cor(%<confirmed>,not(u(me/FUN`LINK`PRIVATE,%q<game_channel>)))=@pemit %#=notice(DISCORD,%q<game_channel> is for staff only or has a see or join lock%, but everyone who can read the Discord channel will read it. +discord/channel/confirm %q<game_channel>=%<discord_channel_id> links it anyway.,warn); &DATA`LINK`%<discord_channel_id> me=%q<game_channel>; &DATA`LINK`%<discord_channel_id>`BY me=objid(%#); @pemit %#=notice(DISCORD,%q<game_channel> goes to Discord channel %<discord_channel_id>%, and what is posted there comes back. If @discord does not list that channel%, link it with @discord/link.,ok)
      # %<channel> the game channel as typed, or the name it had when it was linked. @wipe takes the link's BY with it.
      INC`CMD`REMOVE: |-
        @assert strlen(setr(discord_channel_id,u(me/FUN`LINK`OF,firstof(cinfo(%<channel>,name),%<channel>))))=@pemit %#=notice(DISCORD,%<channel> does not go to Discord.,warn); @assert u(me/FUN`LINK`MAYREMOVE,%#,%q<discord_channel_id>)=@pemit %#=notice(DISCORD,Only the channel's owner or staff with chat.admin unlink [v(DATA`LINK`%q<discord_channel_id>)].,warn); @pemit %#=notice(DISCORD,[v(DATA`LINK`%q<discord_channel_id>)] no longer goes to Discord channel %q<discord_channel_id>.,ok); @wipe me/DATA`LINK`%q<discord_channel_id>

      # %0 a player, %1 a game channel: whether they may link it.
      FUN`LINK`MAYLINK: |-
        cor(permission(%0,chat.admin),not(comp(objid(cowner(%1)),objid(%0))))
      # %0 a player, %1 a Discord channel id: whether they may remove its link. Once the game channel is renamed
      # or gone, cowner() has nothing to answer, so whoever linked it may.
      FUN`LINK`MAYREMOVE: |-
        cor(u(me/FUN`LINK`MAYLINK,%0,v(DATA`LINK`%1)),cand(strmatch(cinfo(v(DATA`LINK`%1),name),#-*),not(comp(v(DATA`LINK`%1`BY),objid(%0)))))
      # %0 a game channel: whether not everyone reads it, because it is an Admin or Wizard channel or has a see or
      # join lock.
      FUN`LINK`PRIVATE: |-
        cor(strlen(clock(%0/see)),strlen(clock(%0/join)),match(clflags(%0),Admin),match(clflags(%0),Wizard))
      # %0 a game channel: the Discord channel id it goes to, or nothing.
      FUN`LINK`OF: |-
        first(iter(lattr(me/DATA`LINK`*),if(not(comp(lcstr(v(%i0)),lcstr(%0))),last(%i0,`))))
      # %0 a style, %1 the speaker's name, %2 the text: the line as the game channel shows it.
      FUN`DISPLAY`LINE: |-
        switch(%0,pose,%1 %2,semipose,%1%2,emit,%2,%1 says%, "%2")
      # The linked channels, as +discord/channels shows them.
      FUN`DISPLAY`LIST: |-
        if(words(lattr(me/DATA`LINK`*)),box(datacolumns(json(object,delim,json(string,%r),grow,json(string,1)),tone(strong,Game channel)%r[iter(lattr(me/DATA`LINK`*),u(me/FUN`DISPLAY`CHANNELNAME,v(%i0)),,%r)],tone(strong,Discord channel)%r[iter(lattr(me/DATA`LINK`*),last(%i0,`),,%r)])%r[rule()]%r[tone(muted,+discord/channel <channel>=<Discord channel id> links one · +discord/channel/remove <channel> unlinks it)],Discord Channels),notice(DISCORD,No game channel goes to Discord. +discord/channel <channel>=<Discord channel id> links one.))
      # %0 a linked channel's name: the name, or a note that no channel has it any more.
      FUN`DISPLAY`CHANNELNAME: |-
        if(strmatch(cinfo(%0,name),#-*),%0 [tone(error,no such channel)],%0)

      # A tap on the discord kind. It hears every line sent on a Discord feed, after it is delivered, with the
      # speaker as enactor (help @feed taps), and passes on the lines Discord members posted.
      TAP`DISCORD: |-
        @assert cand(strmatch(%<origin>,discord/*),strlen(setr(game_channel,v(DATA`LINK`[after(%<feed>,/)])))); @cemit %q<game_channel>=u(me/FUN`DISPLAY`LINE,%<style>,firstof(%<name>,name(%<speaker>)),%<text>)

      # Taps are stored, so this only puts the tap back after the discord kind was undefined and defined again, or
      # adds TAP`DISCORD after an update from 1.0, whose tap was on TAP.
      STARTUP: |-
        @feed/tap discord={{links}}/TAP`DISCORD
      AINSTALL: |-
        @trigger {{links}}/STARTUP
      AUPDATE: |-
        @trigger {{links}}/STARTUP

  # A game channel's lines to its Discord channel. The event runs as the event handler with the speaker as
  # enactor, so @feed/send sends as the speaker, who must pass the Discord feed's send lock (help @feed
  # sending). A connect or disconnect line stays in the game, and so does a line this package emitted. An
  # emit names no speaker in the game, so in Discord it goes under the channel's name. Each style is its own
  # @feed/send switch, and a command's switch is not evaluated, so the @switch names each one.
  - ref: event
    target: "{{$event_handler}}"
    attributes:
      CHANNEL`MESSAGE`DISCORDCHANNELS: |-
        @assert cand(comp(%<style>,presence),comp(objid(%#),objid({{links}})),strlen(setr(discord_channel_id,u({{links}}/FUN`LINK`OF,%<channel>)))); @switch %<style>=emit,{@feed/send/emit/as discord/%q<discord_channel_id>=%<channel>/%<message>},pose,{@feed/send/pose discord/%q<discord_channel_id>=%<message>},semipose,{@feed/send/semipose discord/%q<discord_channel_id>=%<message>},{@feed/send/say discord/%q<discord_channel_id>=%<message>}

  - ref: help
    type: thing
    name: Discord Channels Help
    attributes:
      HELP: |-
        Joining game channels to Discord channels.
      HELP`DISCORD`CHANNELS: |-
        A game channel can be joined to a Discord channel the game has linked with `@discord/link`. What
        is said on the game channel is posted in Discord under the speaker's name, and what Discord
        members post comes back onto the game channel as the character they speak as there.

        - `+discord/channels` lists the game channels that go to Discord.
        - `+discord/channel <channel>=<Discord channel id>` joins a game channel to a Discord channel.
          `@discord` lists the linked Discord channels with their ids.
        - `+discord/channel/remove <channel>` takes it apart again.

        Only the channel's owner, or staff with `chat.admin`, joins or parts a channel. A game channel
        goes to one Discord channel, and a Discord channel to one game channel. A staff-only (Admin or
        Wizard) channel, or one with a see or join lock, is refused until you give `/confirm`, because
        everyone who can read the Discord channel reads what is said on it.

        Example:

        ```
        > +discord/channel Public=1427000000000000001
        DISCORD: Public goes to Discord channel 1427000000000000001, and what is posted there comes back.
        ```

        Output: one line saying the channel is joined.

        A line said in the game reaches Discord only if its speaker passes the Discord feed's send
        lock. Connect and disconnect lines stay in the game. Renaming the game channel parts it from
        Discord: whoever joined it removes the old name with `+discord/channel/remove <old name>`, then
        joins it again under its new name.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`DISCORD-CHANNELS: |-
        {{help}}

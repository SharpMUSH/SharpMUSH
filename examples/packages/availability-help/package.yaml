format: "1.16"
package: availability-help
title: "Availability: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Availability topics into +help: registers the availability package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [availability, help, bridge]
category: Community
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. availability keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: availability
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/availability/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`AVAIL: |-
        {{availability/availability_help}}

  # Lines the availability package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{availability/availability}}"
    attributes:
      HINT`SWITCHES: |-
        +help avail lists them.
      HINT`WHEN: |-
        +help avail when lists what a time can say.

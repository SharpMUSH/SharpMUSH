format: "1.10"
package: scene-config
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the scene settings into +config: registers the Scene Logger with the +config registry, so staff see and change them with +config scene."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [scene, config, settings, bridge]
category: Scenes
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. The scene package declares its settings
# on the Scene Logger as DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or
# not +config is installed. This package is the one leaf that tells the +config registry where they are.
depends:
  - package: scene
    version: ">=1.12"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`SCENE: |-
        {{scene/logger}}

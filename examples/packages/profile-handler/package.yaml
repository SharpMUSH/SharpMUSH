format: "1.16"
package: profile-handler
title: "Character directory"
version: 1.1.3
authors: [SharpMUSH]
description: "Read-only character directory, online list, and profile API, served through the HTTP verb routers."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [http, api, profile, portal]
category: Web portal
requires_server: ">=0.1"

# Requires the verb routers — its GET`* routes are backtick children of the GET
# verb that http-handler provides. The dependency also blocks uninstalling
# http-handler while this is installed.
depends:
  - package: http-handler
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

objects:
  - ref: handler
    target: "{{$http_handler}}"
    attributes:
      DATA`TEMPLATE`PROFILE`VALUE: |-
        {"value":"","visible":true}
      # ── Helpers (me-relative; redefinable per game) ──────────────────────
      # One already-computed value as the {value, visible} shape the portal reads. %0 = the value.
      # Args are split before evaluation, so a result containing commas survives intact.
      FUN`PROFILE`VALUE: |-
        json_fill(v(DATA`TEMPLATE`PROFILE`VALUE),/value,%0)
      # One player-authored profile field as the {value, visible} shape. %0 = objid, %1 = key.
      # get() and never u(): PROFILE`* holds text a player typed, and evaluating it would run
      # whatever they hid in it with this wizard handler's permissions.
      # Unused by the shipped schema — see "A richer schema" in README.md.
      FUN`PROFILE`FIELD: |-
        json_fill(v(DATA`TEMPLATE`PROFILE`VALUE),/value,get(%0/PROFILE`%1))
      # One image attribute (%1) of an object (%0), or blank unless the attribute is visual. This
      # handler is a wizard, so get() alone would read — and the unauthenticated routes would
      # publish — an attribute its owner made private: the seeded visual flag is a default for a
      # NEW attribute, and an IMAGE set before the seed existed, or with visual cleared since, keeps
      # its owner's choice. visual does not propagate down a tree and a private branch hides its
      # leaves (help ATTRIBUTE FLAGS2), so IMAGE`BANNER also needs a visual IMAGE. get(), never
      # u(): a URL is text the player typed.
      FUN`PROFILE`PICTURE: |-
        if(cand(hasflag(%0/%1,visual),cor(not(strmatch(%1,*`*)),hasflag(%0/[before(%1,`)],visual))),get(%0/%1))
      # A player's name colour (%0 = the player), or blank. It lands in a CSS custom property on
      # the page, so only #rrggbb passes; a value that tries to carry more CSS reads as unset.
      # Brackets are escaped because a bare [...] is evaluated here.
      FUN`PROFILE`COLOR: |-
        if(regmatch(setr(profile_color,get(%0/PROFILE`COLOR)),^#\[0-9a-fA-F\]\[0-9a-fA-F\]\[0-9a-fA-F\]\[0-9a-fA-F\]\[0-9a-fA-F\]\[0-9a-fA-F\]$),%q<profile_color>)
      # Directory category for one player (%0). Wizard > Royalty > Guest; blank otherwise. Wizard and Royalty
      # are the roles WIZARD and ROYALTY are held as. cond() stops at the first test that passes.
      FUN`PROFILE`CHARACTERCATEGORY: |-
        cond(hasrole(%0,wizard),Wizard,hasrole(%0,royalty),Royalty,haspower(%0,Guest),Guest)
      DATA`TEMPLATE`PROFILE`CHARACTERROW: |-
        {"name":"","objid":"","created":0,"category":"","image":""}
      # One character-directory row. %0 = player. created = unix ms, which is what the portal's
      # timestamp contract expects and what objid carries. csecs() is seconds by default, like
      # PennMUSH's, so the millisecond form has to be asked for: see 'help COMPATIBILITY IDENTITY'.
      # Not ctime(), which is a time string: the template's number slot refuses it with #-1.
      # image is the player's IMAGE attribute (help IMAGE), a URL or blank — the portal draws its
      # letter avatar for a blank, and blank too when the attribute is not visual (FUN`PROFILE`PICTURE).
      # json_fill() types each value by the template's slot: two calls (v and json_fill), not six json().
      FUN`PROFILE`CHARACTERROW: |-
        json_fill(v(DATA`TEMPLATE`PROFILE`CHARACTERROW),/name,name(%0),/objid,objid(%0),/created,csecs(%0,ms),/category,u(FUN`PROFILE`CHARACTERCATEGORY,%0),/image,u(FUN`PROFILE`PICTURE,%0,IMAGE))
      # Directory visibility predicate (%0): 1 lists, 0 hides. Default hides Guests and the
      # package_manager system principal — it is seeded as a real PLAYER because it owns
      # softcode-package objects, so a type search finds it, but nobody plays it. Matched by
      # config ref, not a literal dbref: the seed numbering is config-driven and has moved.
      # The second half compares the player's dbref, as text, with the package manager ref's: the part of
      # the ref before its colon. The ref is never located. It installs empty on a game without a package
      # manager, and an objid stops resolving when the object behind it is recreated; num() on it would
      # then answer #-1 NO MATCH and notify "I can't see that here." once per player, and everything
      # notified while an HTTP request is served becomes the response body. An empty ref compares against
      # nothing, so no player matches it.
      FUN`PROFILE`CHARACTERVISIBLE: |-
        cand(not(strmatch(u(FUN`PROFILE`CHARACTERCATEGORY,%0),Guest)),not(strmatch(num(%0),before({{$package_manager}},:))))
      # Online visibility predicate (%0): the character-directory rules. mwho() already hides DARK,
      # so the DARK guard here is just a belt-and-suspenders default. Redefine to suit.
      FUN`PROFILE`ONLINEVISIBLE: |-
        cand(u(FUN`PROFILE`CHARACTERVISIBLE,%0),not(hasflag(%0,DARK)))

      # ── Routes (children of http-handler's GET verb) ─────────────────────
      # Both routes build their array with json_array(iter(...)) over a %r-separated list.
      # json_array() splits its input BEFORE parsing each element, so the separator must be
      # something a row cannot contain: names routinely contain spaces (the default separator),
      # newlines cannot occur. It also yields [] for an empty list, so neither route needs a
      # base-case guard.
      #
      # GET /http/characters — every visible player as a JSON array. This is the roster: it says
      # who EXISTS, not who is connected. For connections see GET`ONLINE. Rows are FUN`PROFILE`CHARACTERROW:
      # {name, objid, created, category, image}.
      GET`CHARACTERS: |-
        @respond/type application/json; think json_array(iter(filter(me/FUN`PROFILE`CHARACTERVISIBLE,lsearch(all,type,player)),u(me/FUN`PROFILE`CHARACTERROW,%i0),,%r),%r)
      # GET /http/online — connected, visible players, same row shape as GET`CHARACTERS. mwho() is
      # the mortal who-list: caller-independent (this handler is wizard-flagged), so it hides DARK
      # players and portal-class background connections. Objects that never bind a connection can't
      # appear. It lists PLAYERS, one entry each — someone logged in twice is one row, so this route
      # answers "who is here", not "how many sockets are open". A redefinition built on lwho()/
      # ports() would reintroduce per-connection rows and make the portal's presence counts wrong.
      GET`ONLINE: |-
        @respond/type application/json; think json_array(iter(filter(me/FUN`PROFILE`ONLINEVISIBLE,mwho()),u(me/FUN`PROFILE`CHARACTERROW,%i0),,%r),%r)
      DATA`TEMPLATE`GET`PROFILE: |-
        {"character":"","objid":"","dbref":"","fields":{"created":null,"objid":null,"image":null,"banner":null,"color":null}}
      # GET /http/profile?objid=#1:123 — one character's public profile.
      # `fields` carries only facts the engine itself knows, so a brand-new character's profile
      # renders real state instead of a table of blanks. Anything a game wants beyond that is a
      # PROFILE`* attribute it also adds to the schema — see "A richer schema" in README.md.
      # objid is repeated inside `fields` on purpose: the envelope's copy addresses the character,
      # but the schema renderer only resolves element keys against `fields`, so a field the schema
      # declares has to live there to render at all.
      #
      # image, banner and color are portal-known fields the page reads directly rather than through
      # the schema, so they are not declared in GET`PROFILE`SCHEMA and may be blank. image and
      # banner are the seeded IMAGE / IMAGE`BANNER attributes (help IMAGE). banner does not fall
      # back to IMAGE: the avatar and the banner are separate pictures, and a character with no
      # banner gets the portal's hue gradient behind the name rather than its avatar stretched wide.
      # color is PROFILE`COLOR under the usual opt-in PROFILE`<key> convention — the name colour
      # stays game-defined and needs no seed — validated by FUN`PROFILE`COLOR to #rrggbb. image and banner go
      # through FUN`PROFILE`PICTURE, so a private one reads as blank. All three are read with get(), never u().
      GET`PROFILE: |-
        @assert cand(isdbref(%q<form.objid>),hastype(%q<form.objid>,player))=@respond 404 NO SUCH CHARACTER; @respond/type application/json; think json_fill(v(DATA`TEMPLATE`GET`PROFILE),/character,name(%q<form.objid>),/objid,objid(%q<form.objid>),/dbref,num(%q<form.objid>),/fields/created,u(FUN`PROFILE`VALUE,ctime(%q<form.objid>)),/fields/objid,u(FUN`PROFILE`VALUE,objid(%q<form.objid>)),/fields/image,u(FUN`PROFILE`VALUE,u(FUN`PROFILE`PICTURE,%q<form.objid>,IMAGE)),/fields/banner,u(FUN`PROFILE`VALUE,u(FUN`PROFILE`PICTURE,%q<form.objid>,IMAGE`BANNER)),/fields/color,u(FUN`PROFILE`VALUE,u(FUN`PROFILE`COLOR,%q<form.objid>)))
      # GET /http/profile/schema — the Portal Schema Document the portal renders from
      # (Area 21, kind:"view"). The character profile is the canonical view instance:
      # sections → keyvalue-style field elements; the GET`PROFILE data endpoint supplies
      # {value, visible} per key.
      #
      # The shipped schema declares only what a character has from the moment it is created:
      # its creation date and its objid. A schema field with no data behind it still renders —
      # as an empty row — so declaring fullname/age/concept/faction out of the box gave every
      # character, including its own owner, a profile of blank labels. Those fields are a game's
      # choice, not the engine's: README.md, "A richer schema", shows how to opt back into them.
      GET`PROFILE`SCHEMA: |-
        @respond/type application/json; think v(DATA`PROFILE`SCHEMA)
      # The schema itself, as JSON: v() returns it without evaluating it, so a schema of any size costs
      # one function call. A route that fills in per-request values reads a template like this one with
      # json_fill().
      DATA`PROFILE`SCHEMA: |-
        {"kind":"view","schema_version":1,"pages":[{"key":"profile","order":1,"sections":[{"name":"Identity","order":1,"elements":[{"kind":"field","key":"created","label":"Created","type":"text","visible_to":"public"},{"kind":"field","key":"objid","label":"Object ID","type":"text","visible_to":"public"}]}]}]}

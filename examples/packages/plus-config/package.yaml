          box(datacolumns(u(%!/FUN`DISPLAY`OPTIONS,1%r2,1%r2%r1,%r%r1,%r%r12),[tone(strong,System)]%r[iter(%0,%i0,%b,%r)],>[tone(strong,Settings)]%r[iter(%0,words(u(%!/FUN`SETTING`ALL,u(%!/FUN`SYSTEM`OBJECT,%i0))),%b,%r)],[tone(strong,About)]%r[iter(%0,u(%!/FUN`DISPLAY`DESCRIBED,u(%!/FUN`SYSTEM`LABEL,setr(index_object,u(%!/FUN`SYSTEM`OBJECT,%i0))),u(%!/FUN`SYSTEM`DESCRIPTION,%q<index_object>)),%b,%r)])[u(%!/FUN`DISPLAY`FOOTER,+config <system> lists one system's settings.)],Settings)
        flags: [funsyntax]
      # %0 the system, %1 its object, %2 its settings. A value that is not the default is marked *.
      FUN`SCREEN`SYSTEM:
        value: |-
          box([if(strlen(setr(screen_about,u(%!/FUN`SYSTEM`DESCRIPTION,%1))),%q<screen_about>%r%r)][datacolumns(u(%!/FUN`DISPLAY`OPTIONS,1,1%r1%r3%r2,%r%r%r1,%r%r%r12),[tone(strong,Setting)]%r[iter(%2,%i0[if(u(%!/FUN`SETTING`CHANGED,%1,%i0),*)],%b,%r)],[tone(strong,Value)]%r[iter(%2,u(%!/FUN`VALUE`SHOW,%1,%i0,u(%!/FUN`VALUE`GET,%1,%i0)),%b,%r)],[tone(strong,Allowed)]%r[iter(%2,u(%!/FUN`VALUE`ALLOWED,%1,%i0),%b,%r)],[tone(strong,What it does)]%r[iter(%2,u(%!/FUN`DISPLAY`DESCRIBED,u(%!/FUN`SETTING`META,%1,%i0,LABEL),u(%!/FUN`SETTING`META,%1,%i0,DESCRIPTION)),%b,%r)])][u(%!/FUN`DISPLAY`FOOTER,u(%!/FUN`SCREEN`SYSTEMFOOTER,%0,%1,%2))],Settings: [firstof(u(%!/FUN`SYSTEM`LABEL,%1),%0)])
        flags: [funsyntax]
      FUN`SCREEN`SYSTEMFOOTER:
        value: |-
          [if(words(iter(%2,if(u(%!/FUN`SETTING`CHANGED,%1,%i0),%i0),%b,%b)),* changed from its default.%b%b)]+config %0/<setting>=<value> changes one.
        flags: [funsyntax]
      # %0 the system, %1 its object, %2 the setting.
      FUN`SCREEN`SETTING:
        value: |-
          box(lfields(,u(%!/FUN`SCREEN`SETTINGLABELS,%1,%2),u(%!/FUN`SCREEN`SETTINGVALUES,%0,%1,%2),%*<|>)[u(%!/FUN`DISPLAY`FOOTER,u(%!/FUN`SCREEN`SETTINGFOOTER,%0,%1,%2))],%0/%2)
        flags: [funsyntax]
      FUN`SCREEN`SETTINGLABELS:
        value: |-
          [if(hasattr(%0,DATA`CONFIG`%1`LABEL),Name%*<|>)]Value%*<|>Default%*<|>Allowed[if(hasattr(%0,DATA`CONFIG`%1`EXAMPLE),%*<|>Example)]%*<|>What it does%*<|>Changed by
        flags: [funsyntax]
      FUN`SCREEN`SETTINGVALUES:
        value: |-
          [if(hasattr(%1,DATA`CONFIG`%2`LABEL),[u(%!/FUN`SETTING`META,%1,%2,LABEL)]%*<|>)][u(%!/FUN`VALUE`SHOW,%1,%2,u(%!/FUN`VALUE`GET,%1,%2))]%*<|>[if(hasattr(%1,DATA`CONFIG`%2`DEFAULT),u(%!/FUN`VALUE`SHOW,%1,%2,u(%!/FUN`SETTING`META,%1,%2,DEFAULT)),tone(muted,none))]%*<|>[u(%!/FUN`VALUE`ALLOWED,%1,%2)][if(hasattr(%1,DATA`CONFIG`%2`EXAMPLE),%*<|>+config %0/%2=[u(%!/FUN`SETTING`META,%1,%2,EXAMPLE)])]%*<|>[firstof(u(%!/FUN`SETTING`META,%1,%2,DESCRIPTION),tone(muted,not described))]%*<|>The [u(%!/FUN`SETTING`PERMISSION,%1,%2)] permission
        flags: [funsyntax]
      FUN`SCREEN`SETTINGFOOTER:
        value: |-
          +config %0/%2=<value> sets it[if(strmatch(u(%!/FUN`SETTING`TYPE,%1,%2),LIST),%, /add and /remove change items)]%, /reset goes back to the default.
        flags: [funsyntax]

      # %0 the system, %1 its object, %2 the table.
      FUN`SCREEN`TABLE:
        value: |-
          setq(screen_store,u(%!/FUN`TABLE`STORE,%1,%2),screen_keys,u(%!/FUN`TABLE`KEYS,%1,%2))[box([u(%!/FUN`DISPLAY`DESCRIBED,u(%!/FUN`SETTING`META,%1,%2,LABEL),u(%!/FUN`SETTING`META,%1,%2,DESCRIPTION))]%r%r[if(words(%q<screen_keys>),datacolumns(u(%!/FUN`DISPLAY`OPTIONS,1,1%r2,%r1,%r12),[tone(strong,Entry)]%r[iter(%q<screen_keys>,%i0,%b,%r)],[tone(strong,Fields)]%r[iter(%q<screen_keys>,u(%!/FUN`TABLE`SUMMARY,%1,%2,%q<screen_store>,%i0),%b,%r)]),tone(muted,No entries yet.))][u(%!/FUN`DISPLAY`FOOTER,u(%!/FUN`SCREEN`TABLEFOOTER,%0,%1,%2))],%0/%2)]
        flags: [funsyntax]
      FUN`SCREEN`TABLEFOOTER:
        value: |-
          +config %0/%2/<entry> shows one[if(not(u(%!/FUN`SETTING`META,%1,%2,FIXED)),. +config/add %0/%2/<entry>[if(strlen(setr(screen_entry_field,u(%!/FUN`SETTING`META,%1,%2,ENTRY))),=<[lcstr(u(%!/FUN`TABLE`LABEL,%1,%2,%q<screen_entry_field>))]>)] adds one%, /remove takes one away)].
        flags: [funsyntax]
      # %0 the system, %1 its object, %2 the table, %3 the entry.
      FUN`SCREEN`ENTRY:
        value: |-
          setq(screen_store,u(%!/FUN`TABLE`STORE,%1,%2),screen_fields,u(%!/FUN`TABLE`FIELDS,%1,%2))[box(datacolumns(u(%!/FUN`DISPLAY`OPTIONS,1,1%r1%r3%r2,%r%r%r1,%r%r%r12),[tone(strong,Field)]%r[iter(%q<screen_fields>,%i0,%b,%r)],[tone(strong,Value)]%r[iter(%q<screen_fields>,u(%!/FUN`VALUE`SHOW,%1,%2`FIELD`%i0,u(%!/FUN`TABLE`VALUE,%1,%2,%q<screen_store>,%3,%i0)),%b,%r)],[tone(strong,Allowed)]%r[iter(%q<screen_fields>,u(%!/FUN`VALUE`ALLOWED,%1,%2`FIELD`%i0),%b,%r)],[tone(strong,What it does)]%r[iter(%q<screen_fields>,u(%!/FUN`DISPLAY`DESCRIBED,u(%!/FUN`SETTING`META,%1,%2`FIELD`%i0,LABEL),u(%!/FUN`SETTING`META,%1,%2`FIELD`%i0,DESCRIPTION)),%b,%r)])[u(%!/FUN`DISPLAY`FOOTER,+config %0/%2/%3/<field>=<value> changes a field%, /reset sets it to a new entry's.)],%0/%2/%3)]
        flags: [funsyntax]

      # ── Lifecycle ───────────────────────────────────────────────────────────
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +config; @hook/override/inline +config=%!,CMD`CONFIG
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # ---- +help topics ---------------------------------------------------------
  # On an ordinary object: the librarian cannot u() a privileged object's attribute.
  - ref: config_help
    type: thing
    name: Config Help
    attributes:
      HELP: |-
        Game settings that softcode systems keep for themselves.
      HELP`CONFIG: |-
        `+config` shows and changes the settings that the game's softcode systems keep for themselves,
        such as how long a status lasts or which fields a profile shows. Each system declares what its
        settings accept, and `+config` refuses anything else.

        - `+config` lists the systems that have settings.
        - `+config <system>` lists a system's settings: the value, what it accepts and what it does.
          A `*` marks a value that is not the default.
        - `+config <system>/<setting>` shows one setting, with its default and who may change it.
        - `+config <system>/<setting>=<value>` changes it.
        - `+config/add <system>/<setting>=<items>` and `+config/remove <system>/<setting>=<items>` add
          words to a list setting or take them out.
        - `+config/reset <system>/<setting>` puts back the default.

        Some settings are tables: named entries that each have the same fields, such as the statuses
        a player may choose.

        - `+config <system>/<table>` lists the entries, and `+config <system>/<table>/<entry>` shows one.
        - `+config <system>/<table>/<entry>/<field>=<value>` changes one field of an entry.
        - `+config/add <system>/<table>/<entry>=<value>` adds an entry, and
          `+config/remove <system>/<table>/<entry>` takes one away.
        - `+config/reset <system>/<table>/<entry>/<field>` sets a field to what a new entry starts with.

        Anyone may look. Changing a setting needs the `config.admin` permission, the one `@config`
        needs, unless the system names another for that setting.

        Example:

        ```
        > +config who-where/idle-after=2h
        \[CONFIG\] Done: who-where/idle-after is now 2h, was 1h.
        ```

        Output: one line saying what the setting is now and what it was.

        `+help config types` lists what settings accept, and `+help config writing` is for coders
        giving a system settings of its own.
      HELP`CONFIG`TYPES: |-
        Every setting has a type, which says what it accepts and how it is stored. The stored form is
        what the system's code reads.

        - `text`: anything; a setting can cap its length and require it to match a pattern.
        - `integer`: a whole number, often between a least and a most.
        - `number`: any number, the same way.
        - `boolean`: `yes` or `no`; `on`, `off`, `true`, `false`, `1` and `0` work too. Stored as 1 or 0.
        - `duration`: a length of time, such as `4h`, `30m`, `1d 12h` or `45` (seconds). Stored in seconds.
        - `choice`: one word from a short list.
        - `list`: words separated by spaces, or items separated by another mark such as `|`, each kept
          once, sometimes from a fixed set. Use `/add` and `/remove` to change a few.
        - `pattern`: a regular expression.
        - `object`: anything you can name or give a dbref for, sometimes only rooms or only players.
          Stored as an objid.
        - `timezone`: a time zone, such as `Europe/London` or `UTC`.
        - `table`: named entries, each with fields of the types above. Change one field at a time.

        `+config <system>` shows, beside each setting, what it accepts.
      HELP`CONFIG`WRITING: |-
        A system gets settings by declaring them on its own object, then registering that object.
        The values stay on that object, and its code reads one with `v\(\)`, whether or not `+config` is
        installed.

        Each setting is an attribute under `` DATA`CONFIG `` holding the value, with leaves under it:

        ```
        &DATA`CONFIG obj=What these settings change, in one line.
        &DATA`CONFIG`HOURS obj=14400
        &DATA`CONFIG`HOURS`TYPE obj=duration
        &DATA`CONFIG`HOURS`DEFAULT obj=14400
        &DATA`CONFIG`HOURS`MIN obj=600
        &DATA`CONFIG`HOURS`DESCRIPTION obj=How long a status lasts.
        ```

        Output: nothing; the leaves are data.

        The leaves are `TYPE` \(required\), `DEFAULT`, `DESCRIPTION`, `LABEL` \(a display name such as
        Idle after\), `EXAMPLE` \(a value as typed, shown as an example\), `MIN` and `MAX` \(numbers, durations
        in seconds, a text's length, a list's size\), `CHOICES` \(for a choice, or a list's allowed
        words\), `PATTERN` \(a text, or each word of a list\), `DELIMITER` \(what splits a list's items,
        when not a space\), `OBJECTTYPE` \(ROOM, PLAYER, THING, EXIT\),
        `PERMISSION` \(who may change it, instead of config.admin\) and `CHECK` \(the name of an attribute
        on the same object: it gets the value as `%%0` and the setting as `%%1`, and returns nothing when
        the value is fine or the reason it is not\). Write `DEFAULT` and the value in stored form.

        A `table` keeps its entries on the `STORE` object \(the system's own when unset; same owner, and
        `NO_COMMAND` or a no_command `PATH` attribute\) under `PATH`: `` <PATH>`<ENTRY> `` holds the
        `ENTRY` field and each other field is a leaf beneath it. Declare each field as
        `` DATA`CONFIG`<table>`FIELD`<field> `` leaves, list them in order in `FIELDS`, limit new names
        with `KEYPATTERN`, and set `FIXED` to 1 to stop entries being added or removed. A `CHECK` on a
        field also gets the entry as `%%2` and the field as `%%3`.

        Staff with `config.admin` register the object: `+config/register <system>=<object>`. A package
        registers by attaching a `` SYSTEM`<system> `` leaf to the Config Registry instead, and the package
        manager adds and removes it. After a change the object's `ACONFIG` attribute, if it has one, is
        triggered with `%%<setting>`, `%%<value>`, `%%<previous>`, `%%<by>` and `%%<action>` \(`set`, or
        for a table `add` or `remove`, with `%%<entry>` and `%%<field>`\).

        `` DATA`CONFIG`LABEL `` is the system's display name, so no setting may be called `label`.

  - ref: config_help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`PLUS-CONFIG: |-
        {{config_help}}

format: "1.10"
package: plus-config
version: 1.0.2
authors: [SharpMUSH]
description: "+config — one command for the settings softcode systems keep for themselves, each checked against the type and limits the system declares."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [config, settings, admin, softcode]
category: Essentials
requires_server: ">=0.1"

# +config is to a system's settings what +help is to its topics. A system keeps each setting on its own
# object, as DATA`CONFIG`<NAME>, with leaves under it saying what the setting is and what it accepts. It
# registers that object here with one SYSTEM`<NAME> leaf. +config lists, explains, checks and writes the
# settings; the values never leave the system's object, so uninstalling a package takes its settings
# with it, and the system reads a setting with a plain v() whether or not +config is installed.
#
# README.md is the contributor's guide: the layout, the types, and how a package registers.
#
# The engine's own options are @config's, and a package sets those through settings: in its manifest.
# +config never writes them, and settings: never writes attributes.

depends:
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  # The registry and the command, in the master room. WIZARD because it reads and writes the
  # DATA`CONFIG tree on objects it does not own: package objects belong to the Package Manager, and a
  # hand-registered system to whoever built it. It writes only to a registered object, only a setting
  # that declares a TYPE, and only a value that passed that type's checks; the value is stored as data
  # and never evaluated.
  #
  # Trees: SYSTEM` the registry, CMD` the command, INC`COMMAND` the shared parse and dispatch, INC` one
  # routine per form, FUN`SYSTEM` and FUN`SETTING` the reads, FUN`TYPE`<TYPE>` one branch per type
  # (PROBLEM, STORE, SHOW, ALLOWED), FUN`VALUE` the type-independent steps, FUN`SCREEN` and
  # FUN`DISPLAY` the output.
  - ref: registry
    type: thing
    name: Config Registry
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:

      # ── The registry ────────────────────────────────────────────────────────
      # One leaf per system, naming its object. A package writes its leaf by attaching (see the README),
      # so installing writes it and uninstalling clears it. +config/register writes one by hand, as an
      # objid. A leaf whose object is gone lists nothing and is not an error.
      SYSTEM:
        value: |-
          Registered systems. One leaf per system, naming the object that keeps its settings.
        flags: [no_command]

      # ── Routing ─────────────────────────────────────────────────────────────
      DATA:
        value: |-
          Constants.
        flags: [no_command]
      # Which INC` routine each switch runs. A bare +config picks its own: see FUN`COMMAND`ROUTE.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`ADD: |-
        ADD
      DATA`ROUTE`REMOVE: |-
        REMOVE
      DATA`ROUTE`RESET: |-
        RESET
      DATA`ROUTE`REGISTER: |-
        REGISTER
      DATA`ROUTE`UNREGISTER: |-
        UNREGISTER
      # The permission that changes a setting that names none of its own. It is @config's, so the people
      # who run the engine's options run the systems' options too.
      DATA`PERMISSION: |-
        config.admin
      # The words boolean settings accept, and which of them mean yes.
      DATA`BOOLEAN`WORDS: |-
        yes no on off true false 1 0
      DATA`BOOLEAN`YES: |-
        yes on true 1

      FUN:
        value: |-
          Reads and checks. SYSTEM and SETTING the registry and the declarations, TYPE one branch per type, VALUE the steps every type shares, SCREEN and DISPLAY the output.
        flags: [no_command]
      INC:
        value: |-
          Command steps. COMMAND the parse and dispatch, NEED the shared guards, then one routine per form.
        flags: [no_command]

      # ── The command ─────────────────────────────────────────────────────────
      # %1 the switches and %2 what follows, exactly as typed. +config is added with /noparse/rsnoparse and
      # hooked here (STARTUP), so a pattern or a text with brackets in it reaches the code as typed and
      # nothing a setter types is evaluated.
      CMD`CONFIG:
        value: |-
          $(?is)^\+config(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          think u(%!/FUN`COMMAND`PARSE,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(CONFIG,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(CONFIG,+config has no /%q<cmd_switch> switch. +help config lists them.,warn); @include %!/INC`%q<cmd_route>
      # %0 the switches and %1 the argument, as typed. Sets cmd_switch_list, cmd_switch, cmd_argument,
      # cmd_has_equals, cmd_left_side and cmd_right_side around the first =, and from the left side's
      # /-separated parts (lower case) cmd_system, cmd_setting, and for a table cmd_entry and cmd_field;
      # then cmd_route, the INC` routine to run.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_switch_list,lcstr(trim(edit(%0,/,%b))),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%1),
          cmd_has_equals,strmatch(%1,*=*),
          cmd_left_side,trim(before(%1,=)),
          cmd_right_side,trim(after(%1,=)),
          cmd_system,lcstr(trim(before(%q<cmd_left_side>,/))),
          cmd_path,lcstr(trim(after(%q<cmd_left_side>,/))),
          cmd_setting,trim(first(%q<cmd_path>,/)),
          cmd_entry,trim(extract(%q<cmd_path>,2,1,/)),
          cmd_field,trim(extract(%q<cmd_path>,3,1,/)),
          cmd_route,u(%!/FUN`COMMAND`ROUTE))
        flags: [funsyntax]
      # The routine for the parsed command: a switch's from DATA`ROUTE, else by shape.
      FUN`COMMAND`ROUTE:
        value: |-
          if(strlen(%q<cmd_switch>),get(%!/DATA`ROUTE`[ucstr(%q<cmd_switch>)]),cond(not(strlen(%q<cmd_argument>)),INDEX,%q<cmd_has_equals>,SET,strlen(%q<cmd_setting>),SETTING,SYSTEM))
        flags: [funsyntax]

      # ── Guards ──────────────────────────────────────────────────────────────
      # The system named, found. Sets system_object.
      INC`NEED`SYSTEM:
        value: |-
          @assert strlen(%q<cmd_system>)=@pemit %#=notice(CONFIG,Name a system. +config lists them.,warn); @assert isdbref(setr(system_object,u(%!/FUN`SYSTEM`OBJECT,%q<cmd_system>)))=@pemit %#=notice(CONFIG,No system is called %q<cmd_system>. +config lists them.,warn)
      # The setting named, found in the system. Sets system_object and setting_type.
      INC`NEED`SETTING:
        value: |-
          @include %!/INC`NEED`SYSTEM; @assert strlen(%q<cmd_setting>)=@pemit %#=notice(CONFIG,Name a setting: +config %q<cmd_system>/<setting>. +config %q<cmd_system> lists them.,warn); @assert u(%!/FUN`SETTING`EXISTS,%q<system_object>,%q<cmd_setting>)=@pemit %#=notice(CONFIG,%q<cmd_system> has no setting called %q<cmd_setting>. +config %q<cmd_system> lists them.,warn); think setq(setting_type,u(%!/FUN`SETTING`TYPE,%q<system_object>,%q<cmd_setting>),cfg_meta,%q<cmd_setting>,cfg_target,%q<system_object>,cfg_attr,DATA`CONFIG`%q<cmd_setting>,cfg_name,%q<cmd_system>/%q<cmd_setting>,cfg_entry,,cfg_field,); @assert cor(strmatch(%q<setting_type>,TABLE),not(strlen(%q<cmd_entry>)))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> is one setting%, not a table: +config %q<cmd_system>/%q<cmd_setting> shows it.,warn)
      # The setting named is a table whose store the registry may write. Sets table_store and table_path.
      INC`NEED`TABLE:
        value: |-
          @assert strmatch(%q<setting_type>,TABLE)=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> is not a table.,warn); @assert isdbref(setr(table_store,u(%!/FUN`TABLE`STORE,%q<system_object>,%q<cmd_setting>)))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> keeps its entries on an object +config may not change: its STORE must have the same owner as [name(%q<system_object>)].,error); @assert strlen(setr(table_path,u(%!/FUN`TABLE`PATH,%q<system_object>,%q<cmd_setting>)))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> names no PATH for its entries%, or one that is not an attribute name.,error); @assert u(%!/FUN`TABLE`GUARDED,%q<table_store>,%q<table_path>)=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> keeps its entries where they could run as commands: give [name(%q<table_store>)] the NO_COMMAND flag%, or its %q<table_path> attribute the no_command flag.,error)
      # The entry named, in the table named. Sets table_key, the entry's attribute name part.
      INC`NEED`ENTRY:
        value: |-
          @include %!/INC`NEED`TABLE; @assert strlen(%q<cmd_entry>)=@pemit %#=notice(CONFIG,Name an entry: +config %q<cmd_system>/%q<cmd_setting>/<entry>. +config %q<cmd_system>/%q<cmd_setting> lists them.,warn); @assert cand(u(%!/FUN`NAME`VALID,%q<cmd_entry>),hasattr(%q<table_store>,%q<table_path>`[setr(table_key,ucstr(%q<cmd_entry>))]))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> has no entry called %q<cmd_entry>. +config %q<cmd_system>/%q<cmd_setting> lists them.,warn)
      # The field named, in the entry named: the value is then addressed like any setting's.
      INC`NEED`FIELD:
        value: |-
          @include %!/INC`NEED`ENTRY; @assert member(setr(table_fields,u(%!/FUN`TABLE`FIELDS,%q<system_object>,%q<cmd_setting>)),%q<cmd_field>)=@pemit %#=notice(CONFIG,[if(strlen(%q<cmd_field>),An entry of %q<cmd_system>/%q<cmd_setting> has no field called %q<cmd_field>.,Name a field: +config %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>/<field>=<value>.)] Its fields are [itemize(%q<table_fields>)].,warn); think setq(cfg_meta,%q<cmd_setting>`FIELD`%q<cmd_field>,cfg_target,%q<table_store>,cfg_attr,u(%!/FUN`TABLE`ATTRIBUTE,%q<system_object>,%q<cmd_setting>,%q<table_key>,%q<cmd_field>),cfg_name,%q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>/%q<cmd_field>,cfg_entry,%q<cmd_entry>,cfg_field,%q<cmd_field>)
      # The setter may change the setting named.
      INC`NEED`PERMISSION:
        value: |-
          @assert permission(%#,setr(setting_permission,u(%!/FUN`SETTING`PERMISSION,%q<system_object>,%q<cmd_setting>)))=@pemit %#=notice(CONFIG,Changing %q<cmd_system>/%q<cmd_setting> needs the %q<setting_permission> permission.,error)
      # The setting named is a list, for /add and /remove.
      INC`NEED`LIST:
        value: |-
          @assert strmatch(%q<setting_type>,list)=@pemit %#=notice(CONFIG,+config/%q<cmd_switch> works on lists. %q<cmd_system>/%q<cmd_setting> is one value: +config %q<cmd_system>/%q<cmd_setting>=<value> sets it.,warn); @assert %q<cmd_has_equals>=@pemit %#=notice(CONFIG,+config/%q<cmd_switch> %q<cmd_system>/%q<cmd_setting>=<items>,warn); @assert words(%q<cmd_right_side>)=@pemit %#=notice(CONFIG,Name the items to [if(strmatch(%q<cmd_switch>,add),add,remove)].,warn)
      # Hand-registration is staff's.
      INC`NEED`ADMIN:
        value: |-
          @assert permission(%#,v(DATA`PERMISSION))=@pemit %#=notice(CONFIG,Registering systems needs the [v(DATA`PERMISSION)] permission.,error)

      # ── Routines ────────────────────────────────────────────────────────────
      INC`INDEX:
        value: |-
          @assert words(setr(index_systems,u(%!/FUN`SYSTEM`ALL)))=@pemit %#=notice(CONFIG,No system has registered settings yet.,warn); @pemit %#=u(%!/FUN`SCREEN`INDEX,%q<index_systems>)
      INC`SYSTEM:
        value: |-
          @include %!/INC`NEED`SYSTEM; @assert words(setr(system_settings,u(%!/FUN`SETTING`ALL,%q<system_object>)))=@pemit %#=notice(CONFIG,%q<cmd_system> declares no settings.,warn); @pemit %#=u(%!/FUN`SCREEN`SYSTEM,%q<cmd_system>,%q<system_object>,%q<system_settings>)
      INC`SETTING:
        value: |-
          @include %!/INC`NEED`SETTING; @break strmatch(%q<setting_type>,TABLE)={@include %!/INC`TABLE}; @pemit %#=u(%!/FUN`SCREEN`SETTING,%q<cmd_system>,%q<system_object>,%q<cmd_setting>)
      INC`SET:
        value: |-
          @include %!/INC`NEED`SETTING; @include %!/INC`NEED`PERMISSION; @break strmatch(%q<setting_type>,TABLE)={@include %!/INC`NEED`FIELD; @include/args %!/INC`WRITE=value,%q<cmd_right_side>}; @include/args %!/INC`WRITE=value,%q<cmd_right_side>
      # A table, or one of its entries.
      INC`TABLE:
        value: |-
          @include %!/INC`NEED`TABLE; @break strlen(%q<cmd_entry>)={@include %!/INC`NEED`ENTRY; @pemit %#=u(%!/FUN`SCREEN`ENTRY,%q<cmd_system>,%q<system_object>,%q<cmd_setting>,%q<cmd_entry>)}; @pemit %#=u(%!/FUN`SCREEN`TABLE,%q<cmd_system>,%q<system_object>,%q<cmd_setting>)
      # /add on a table: a new entry, its fields at their defaults, and its own value from after the = when
      # the table names an ENTRY field.
      INC`TABLE`ADD:
        value: |-
          @include %!/INC`NEED`TABLE; @assert not(u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,FIXED))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> has a fixed set of entries.,warn); @assert strlen(%q<cmd_entry>)=@pemit %#=notice(CONFIG,+config/add %q<cmd_system>/%q<cmd_setting>/<entry>[if(strlen(u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,ENTRY)),=<[lcstr(u(%!/FUN`TABLE`LABEL,%q<system_object>,%q<cmd_setting>,u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,ENTRY)))]>)],warn); @assert not(strlen(%q<cmd_field>))=@pemit %#=notice(CONFIG,+config/add adds a whole entry: +config/add %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>.,warn); @break strlen(setr(add_problem,u(%!/FUN`TABLE`KEYPROBLEM,%q<system_object>,%q<cmd_setting>,%q<cmd_entry>)))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting>: %q<add_problem>,warn); @include/args %!/INC`TABLE`CREATE=key,ucstr(%q<cmd_entry>)
      # %<key> a new entry's name, already checked. Checks the entry's own value, then writes the entry.
      INC`TABLE`CREATE:
        value: |-
          @assert not(hasattr(%q<table_store>,%q<table_path>`%<key>))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> already has %q<cmd_entry>.,warn); think setq(add_field,u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,ENTRY),add_meta,%q<cmd_setting>`FIELD`[u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,ENTRY)],cfg_entry,%q<cmd_entry>,cfg_field,%q<add_field>); @assert cor(not(strlen(%q<add_field>)),%q<cmd_has_equals>)=@pemit %#=notice(CONFIG,+config/add %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>=<[lcstr(u(%!/FUN`TABLE`LABEL,%q<system_object>,%q<cmd_setting>,%q<add_field>))]>,warn); @assert cor(strlen(%q<add_field>),not(%q<cmd_has_equals>))=@pemit %#=notice(CONFIG,An entry of %q<cmd_system>/%q<cmd_setting> takes no value: set its fields with +config %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>/<field>=<value>.,warn); @break cand(strlen(%q<add_field>),strlen(setr(add_problem,u(%!/FUN`VALUE`PROBLEM,%q<system_object>,%q<add_meta>,%q<cmd_right_side>))))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>: %q<add_problem>,warn); &%q<table_path>`%<key> %q<table_store>=[firstof(if(strlen(%q<add_field>),u(%!/FUN`VALUE`STORE,%q<system_object>,%q<add_meta>,%q<cmd_right_side>)),lcstr(%<key>))]; @dolist/inline u(%!/FUN`TABLE`FIELDS,%q<system_object>,%q<cmd_setting>)={@if cand(not(strmatch(##,%q<add_field>)),hasattr(%q<system_object>,DATA`CONFIG`%q<cmd_setting>`FIELD`##`DEFAULT))={&%q<table_path>`%<key>`## %q<table_store>=[u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>`FIELD`##,DEFAULT)]}}; @pemit %#=notice(CONFIG,Added %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>. +config %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry> shows it.,ok); @include/args %!/INC`TABLE`TELL=action,add,value,get(%q<table_store>/%q<table_path>`%<key>),previous,
      # /remove on a table: the entry and every field it has.
      INC`TABLE`REMOVE:
        value: |-
          @include %!/INC`NEED`ENTRY; @assert not(u(%!/FUN`SETTING`META,%q<system_object>,%q<cmd_setting>,FIXED))=@pemit %#=notice(CONFIG,%q<cmd_system>/%q<cmd_setting> has a fixed set of entries.,warn); think setq(remove_previous,get(%q<table_store>/%q<table_path>`%q<table_key>),cfg_entry,%q<cmd_entry>,cfg_field,); @wipe %q<table_store>/%q<table_path>`%q<table_key>; @pemit %#=notice(CONFIG,Removed %q<cmd_system>/%q<cmd_setting>/%q<cmd_entry>.,ok); @include/args %!/INC`TABLE`TELL=action,remove,value,,previous,%q<remove_previous>
      # Triggers the system's ACONFIG for an entry added or removed.
      INC`TABLE`TELL:
        value: |-
          @if hasattr(%q<system_object>,ACONFIG)={@trigger/args %q<system_object>/ACONFIG=setting,%q<cmd_setting>,entry,%q<cmd_entry>,field,,action,%<action>,value,%<value>,previous,%<previous>,by,%:}
      # /add: the items after the ones already there; ones already there are not added twice.
      INC`ADD:
        value: |-
          @include %!/INC`NEED`SETTING; @include %!/INC`NEED`PERMISSION; @break strmatch(%q<setting_type>,TABLE)={@include %!/INC`TABLE`ADD}; @include %!/INC`NEED`LIST; @include/args %!/INC`WRITE=value,u(%!/FUN`TYPE`LIST`WITH,%q<system_object>,%q<cmd_setting>,u(%!/FUN`VALUE`GET,%q<system_object>,%q<cmd_setting>),%q<cmd_right_side>)
      # /remove: every item named, in any case.
      INC`REMOVE:
        value: |-
          @include %!/INC`NEED`SETTING; @include %!/INC`NEED`PERMISSION; @break strmatch(%q<setting_type>,TABLE)={@include %!/INC`TABLE`REMOVE}; @include %!/INC`NEED`LIST; @include/args %!/INC`WRITE=value,u(%!/FUN`TYPE`LIST`WITHOUT,%q<system_object>,%q<cmd_setting>,u(%!/FUN`VALUE`GET,%q<system_object>,%q<cmd_setting>),%q<cmd_right_side>)
      # The default is the system's own and already stored form, so it is written as it is.
      INC`RESET:
        value: |-
          @include %!/INC`NEED`SETTING; @include %!/INC`NEED`PERMISSION; @if strmatch(%q<setting_type>,TABLE)={@include %!/INC`NEED`FIELD}; @assert hasattr(%q<system_object>,DATA`CONFIG`%q<cfg_meta>`DEFAULT)=@pemit %#=notice(CONFIG,%q<cfg_name> has no default to go back to.,warn); @include/args %!/INC`STORE=stored,u(%!/FUN`SETTING`META,%q<system_object>,%q<cfg_meta>,DEFAULT)
      # %<value> a value as typed: checked, then stored in the setting's own form.
      INC`WRITE:
        value: |-
          @break strlen(setr(write_problem,u(%!/FUN`VALUE`PROBLEM,%q<system_object>,%q<cfg_meta>,%<value>)))=@pemit %#=notice(CONFIG,%q<cfg_name>: %q<write_problem>,warn); @include/args %!/INC`STORE=stored,u(%!/FUN`VALUE`STORE,%q<system_object>,%q<cfg_meta>,%<value>)
      # %<stored> a value in stored form. Writes it, tells the setter, and runs the system's ACONFIG.
      INC`STORE:
        value: |-
          @break not(comp(setr(store_previous,get(%q<cfg_target>/%q<cfg_attr>)),%<stored>))=@pemit %#=notice(CONFIG,%q<cfg_name> is already [u(%!/FUN`VALUE`SHOW,%q<system_object>,%q<cfg_meta>,%<stored>)].,warn); &%q<cfg_attr> %q<cfg_target>=%<stored>; @pemit %#=notice(CONFIG,%q<cfg_name> is now [u(%!/FUN`VALUE`SHOW,%q<system_object>,%q<cfg_meta>,%<stored>)]%, was [u(%!/FUN`VALUE`SHOW,%q<system_object>,%q<cfg_meta>,%q<store_previous>)].,ok); @if hasattr(%q<system_object>,ACONFIG)={@trigger/args %q<system_object>/ACONFIG=setting,%q<cmd_setting>,entry,%q<cfg_entry>,field,%q<cfg_field>,action,set,value,%<stored>,previous,%q<store_previous>,by,%:}
      INC`REGISTER:
        value: |-
          @include %!/INC`NEED`ADMIN; @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_system>),strlen(%q<cmd_right_side>))=@pemit %#=notice(CONFIG,+config/register <system>=<object>,warn); @assert u(%!/FUN`NAME`VALID,%q<cmd_system>)=@pemit %#=notice(CONFIG,A system's name is letters%, digits%, - and _.,warn); @assert isdbref(setr(register_object,locate(%#,%q<cmd_right_side>,*)))=@pemit %#=notice(CONFIG,There is no %q<cmd_right_side> here or by that dbref.,warn); @assert words(u(%!/FUN`SETTING`ALL,%q<register_object>))=@pemit %#=notice(CONFIG,[name(%q<register_object>)] declares no settings: give it a DATA`CONFIG`<name> with a TYPE leaf first. +help config writing,warn); @assert not(u(%!/FUN`SYSTEM`PACKAGED,%q<cmd_system>))=@pemit %#=notice(CONFIG,%q<cmd_system> is registered by its package.,warn); &SYSTEM`%q<cmd_system> %!=objid(%q<register_object>); @pemit %#=notice(CONFIG,%q<cmd_system> is [name(%q<register_object>)]'s settings. +config %q<cmd_system> lists them.,ok)
      INC`UNREGISTER:
        value: |-
          @include %!/INC`NEED`ADMIN; @assert strlen(%q<cmd_system>)=@pemit %#=notice(CONFIG,+config/unregister <system>,warn); @assert cand(u(%!/FUN`NAME`VALID,%q<cmd_system>),hasattr(%!,SYSTEM`%q<cmd_system>))=@pemit %#=notice(CONFIG,No system is called %q<cmd_system>.,warn); @assert not(u(%!/FUN`SYSTEM`PACKAGED,%q<cmd_system>))=@pemit %#=notice(CONFIG,%q<cmd_system> is registered by its package%, and leaves when the package is uninstalled.,warn); &SYSTEM`%q<cmd_system> %!; @pemit %#=notice(CONFIG,%q<cmd_system> is no longer registered. Its settings stay on its object.,ok)

      # ── The registry ────────────────────────────────────────────────────────
      # %0 a name: 1 when it is letters, digits, - and _, which is what a system or setting may be called.
      FUN`NAME`VALID:
        value: |-
          regmatch(%0,^%[a-z0-9_-%]+$)
        flags: [funsyntax]
      # Every system whose object exists, by name.
      FUN`SYSTEM`ALL:
        value: |-
          sort(squish(trim(iter(lattr(%!/SYSTEM`*),if(isdbref(u(%!/%i0)),lcstr(after(%i0,`))),%b,%b))))
        flags: [funsyntax]
      # %0 a system: its object's dbref, or empty. A package's leaf recalls its object (u()); a hand
      # registration is an objid.
      FUN`SYSTEM`OBJECT:
        value: |-
          if(cand(u(%!/FUN`NAME`VALID,%0),isdbref(setr(system_found,u(%!/SYSTEM`%0)))),num(%q<system_found>))
        flags: [funsyntax]
      # %0 a system: 1 when a package wrote its leaf. An installed {{ref}} is a recall of PM`REFS`<ref>, or of
      # PM`ATTACHED_REFS`<package>`<ref> on an object the package attaches to, as the registry is.
      FUN`SYSTEM`PACKAGED:
        value: |-
          strmatch(get(%!/SYSTEM`%0),*PM`*REFS`*)
        flags: [funsyntax]
      # %0 an object: the line describing its system.
      FUN`SYSTEM`DESCRIPTION:
        value: |-
          get(%0/DATA`CONFIG)
        flags: [funsyntax]
      # %0 an object: the display name of its system, from the LABEL leaf beside its settings.
      FUN`SYSTEM`LABEL:
        value: |-
          get(%0/DATA`CONFIG`LABEL)
        flags: [funsyntax]

      # ── Declarations ────────────────────────────────────────────────────────
      # %0 an object: the settings it declares (a DATA`CONFIG`<NAME> with a TYPE), by name, lower case.
      FUN`SETTING`ALL:
        value: |-

format: "1.16"
package: relationships-help
title: "Relationships: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Relationships topics into +help: registers the relationships package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [relationships, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. relationships keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: relationships
    version: ">=1.4"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/relationships/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`RELATIONSHIPS: |-
        {{relationships/rel_help}}

  # Lines the relationships package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{relationships/relationships}}"
    attributes:
      HINT`SWITCHES: |-
        +help rel lists them.
      HINT`FOOTER: |-
        ·%b+help rel

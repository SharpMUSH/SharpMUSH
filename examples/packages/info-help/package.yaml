format: "1.16"
package: info-help
title: "Info files and journals: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Info files and journals topics into +help: registers the info package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [info, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. info keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: info
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/info/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`INFO: |-
        {{info/info_help}}

  # Lines the info package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{info/info}}"
    attributes:
      HINT`SWITCHES: |-
        +help %0 lists them.

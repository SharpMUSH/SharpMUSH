format: "1.16"
package: info-help
title: "Info files and journals: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Info files and journals topics into +help: registers the info package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [info, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. info keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: info
    version: ">=1.2"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/info/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`INFO: |-
        {{info/info_help}}

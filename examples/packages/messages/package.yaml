format: 1.3
package: messages
version: 1.1.0
authors: [SharpMUSH]
description: "The Messages object: the connect screen, the MOTDs and the other server messages as softcode."
license: MIT
keywords: [messages, motd, connect, login]
requires_server: ">=0.1"

# One object, one attribute per message. While messages_object names this object (installing the package sets
# it; Admin > Messages switches between it and the stored text), each attribute is evaluated as the object
# whenever its message is shown: %# is the player it is shown to, or the object itself at the connect screen,
# and %0 is the connection's descriptor. A message the object has no attribute for falls back to its stored
# text; an attribute that evaluates to nothing shows nothing.

# Removing the package puts messages_object back as it was, unless it has been changed since.
settings:
  messages_object: "{{messages}}"

objects:
  - ref: messages
    type: thing
    name: Messages
    flags: [no_command]
    # Send_OOB lets its messages show the logo as a picture and carry command links.
    powers: [Send_OOB]
    attributes:
      # The connect screen: the logo as a picture, with the ways in beside it, or under it on a screen too narrow
      # for both. A terminal that cannot show the picture gets LOGO in the logo's green instead, read with v() so
      # its spacing reaches the screen as written.
      CONNECT: |-
        [flex(,item(figure(/assets/logo.png,The SharpMUSH logo,ansi(#00f5b7,v(LOGO))),33),item(u(FUN`MENU),,40))]
      LOGO: |2-
                  ==         ==
                 ====       ====
               =======     =======
              =========   =========
             =========== ===========
            =================== =====
          ======-  ===========   ======
         ======     =========     ======
        ======   =   =======   =   ======
        ======   ==   =====   ==   ======
         =====   ===   ===   ===   =====
         =====   ====   =   ====   =====
          ====   =====     =====   ====
           ===    ====     ====    ===
           ===     ===     ===-    ===
            ==     ===     ===     ==
             =      ==     ==      =
                     =     =

      FUN`MENU: |-
        [@@(The text beside the logo. A way in that the game has turned off is left out.)]Welcome to [ansi(h,mudname())]!%r[if(config(player_creation),%r[u(FUN`SECTION,New here?)]%r[fields(u(FUN`LIST),u(FUN`COMMAND,register),<name> \[email\] <password>,u(FUN`COMMAND,make),<character> <password>)])][if(config(guests),%r[u(FUN`SECTION,Just looking?)]%r[fields(u(FUN`LIST),cmdlink(u(FUN`COMMAND,connect),connect guest,Look around as a guest),guest)])]%r[u(FUN`SECTION,Have an account?)]%r[fields(u(FUN`LIST),u(FUN`COMMAND,login),<name-or-email> <password>,u(FUN`COMMAND,play),<character>,u(FUN`COMMAND,claim),<character> <password>)]%r[u(FUN`SECTION,Playing a character?)]%r[fields(u(FUN`LIST),u(FUN`COMMAND,connect),<character> <password>)]%r[u(FUN`SECTION,Any time)]%r[fields(u(FUN`LIST),cmdlink(u(FUN`COMMAND,WHO),WHO,See who is online),who is online,cmdlink(u(FUN`COMMAND,QUIT),QUIT,Disconnect),leave the game)]
      FUN`SECTION: |-
        [@@(%0 heading: a light rule with the heading at its left)][rule(ansi(h,%0),,json(object,border,json(string,single),title,json(string,left)))]
      FUN`LIST: |-
        [@@(The options of a list of commands: the arguments after two spaces)][json(object,sep,json(string,%b%b))]
      FUN`COMMAND: |-
        [@@(%0 command: padded to the longest, so every list's arguments start in the same column)][ljust(%0,8)]
      FUN`ONLINE: |-
        [@@(How many players are connected, in a sentence)][setq(n,words(lwho()))][if(eq(%qn,1),You are the only one connected.,%qn players are connected.)]
      MOTD: |-
        %r[u(FUN`SECTION,Welcome to [mudname()])]%rHello, [name(%#)]. [u(FUN`ONLINE)]%rType [cmdlink(help,help,Read the help)] for the commands, or [cmdlink(WHO,WHO,See who is online)] to see who is here.
      WIZMOTD: |-
        %r[notice(STAFF,Nothing new for staff. Leave a note here with @wizmotd <message>.,muted)]
      GUEST: |-
        %r[notice(GUEST,You are playing [name(%#)]\, a temporary guest character.)]%rType [cmdlink(help,help,Read the help)] for the commands.[if(config(player_creation),%bTo keep a character\, QUIT and register an account.)]
      NEWUSER: |-
        %r[u(FUN`SECTION,Your account is ready)]%r[fields(u(FUN`LIST),make <character> <password>,create your first character,claim <character> <password>,add a character you already have,play <character>,enter the game as one of them)]
      REGISTER: |-
        %r[notice(,[mudname()] is not taking new accounts.,warn)][if(config(guests),%rYou can still look around: [cmdlink(connect guest,connect guest)].)]
      DOWN: |-
        %r[notice(,[mudname()] is closed to logins for now. Please try again later.,warn)]
      QUIT: |-
        %rGoodbye from [ansi(h,mudname())]. Come back soon!

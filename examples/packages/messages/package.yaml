format: "1.16"
package: messages
title: "Messages object"
version: 1.4.0
authors: [SharpMUSH]
description: "The Messages object: the connect screen, the MOTDs and the other server messages as softcode."
license: MIT
keywords: [messages, motd, connect, login]
category: Essentials
requires_server: ">=0.1"

# One object, one attribute per message. While messages_object names this object (installing the package sets
# it; Admin > Messages switches between it and the stored text), each attribute is evaluated as the object
# whenever its message is shown: %# is the player it is shown to, or the object itself at the connect screen,
# and %0 is the connection's descriptor. A message the object has no attribute for falls back to its stored
# text; an attribute that evaluates to nothing shows nothing.

# Removing the package puts messages_object back as it was, unless it has been changed since.
settings:
  messages_object: "{{messages}}"

objects:
  - ref: messages
    type: thing
    name: Messages
    flags: [no_command]
    # Send_OOB lets its messages show the logo as a picture and carry command links. Search lets the connect
    # screen find the guest characters, so it offers connect guest only when one exists.
    powers: [Send_OOB, Search]
    attributes:
      # The connect screen: the logo as a picture, with the welcome, the commands for a screen reader and WHO, and
      # the ways in beside it, or under it on a screen too narrow for both. A terminal that cannot show the picture
      # gets LOGO in the logo's green instead, read with v() so its spacing reaches the screen as written.
      CONNECT: |-
        flex(,item(figure(/assets/logo.png,The SharpMUSH logo,ansi(#00f5b7,v(LOGO))),33),item(u(FUN`CONNECT`TOP)%r%r[u(FUN`CONNECT`MENU)],,40))
      LOGO: |2-
                  ==         ==
                 ====       ====
               =======     =======
              =========   =========
             =========== ===========
            =================== =====
          ======-  ===========   ======
         ======     =========     ======
        ======   =   =======   =   ======
        ======   ==   =====   ==   ======
         =====   ===   ===   ===   =====
         =====   ====   =   ====   =====
          ====   =====     =====   ====
           ===    ====     ====    ===
           ===     ===     ===-    ===
            ==     ===     ===     ==
             =      ==     ==      =
                     =     =

      # Keep the pre-1.2 helper names callable: an upgrade preserves locally edited messages when the
      # administrator keeps them, and those messages may still call these names.
      FUN`MENU: |-
        u(FUN`CONNECT`TOP)%r%r[u(FUN`CONNECT`MENU)]
      FUN`SECTION: |-
        u(FUN`LAYOUT`SECTION,%0)
      FUN`LIST: |-
        u(FUN`LAYOUT`LIST)
      FUN`COMMAND: |-
        u(FUN`LAYOUT`COMMAND,%0)
      FUN`ONLINE: |-
        u(FUN`DISPLAY`ONLINECOUNT)

      # The top of the text beside the logo: the welcome, then SCREENREADER and WHO.
      FUN`CONNECT`TOP: |-
        Welcome to [tone(strong,mudname())]!%r[fields(u(FUN`LAYOUT`LIST),SCREENREADER,using a screen reader,WHO,who is online)]
      # The text beside the logo. A way in that the game has turned off is left out. create, play and claim work
      # only after login, so the account menu lists them, not this.
      FUN`CONNECT`MENU: |-
        [if(strmatch(config(player_creation),Yes),[u(FUN`LAYOUT`SECTION,New here?)]%r[fields(u(FUN`LAYOUT`LIST),u(FUN`LAYOUT`COMMAND,register),<name> \[email\] <password>)]%r)][if(u(FUN`CONNECT`GUESTS),[u(FUN`LAYOUT`SECTION,Just looking?)]%r[fields(u(FUN`LAYOUT`LIST),u(FUN`LAYOUT`COMMAND,connect),guest)]%r)][u(FUN`LAYOUT`SECTION,Have an account?)]%r[fields(u(FUN`LAYOUT`LIST),u(FUN`LAYOUT`COMMAND,login),<name-or-email> <password>)]%r[u(FUN`LAYOUT`SECTION,Playing a character?)]%r[fields(u(FUN`LAYOUT`LIST),u(FUN`LAYOUT`COMMAND,connect),<character> <password>)]%r[u(FUN`LAYOUT`SECTION,Leaving?)]%r[fields(u(FUN`LAYOUT`LIST),u(FUN`LAYOUT`COMMAND,QUIT),leave the game)]
      # Whether connect guest can hand out a character: guest logins on, and a player with the Guest power.
      FUN`CONNECT`GUESTS: |-
        cand(strmatch(config(guests),Yes),words(lsearch(all,type,player,powers,Guest)))
      # %0 heading: a light rule with the heading at its left.
      FUN`LAYOUT`SECTION: |-
        rule(tone(strong,%0),,lit({"border":"single","title":"left"}))
      # %0 heading, in the game: the game's own border (layout_border, or the reader's @theme) with the
      # heading at its left, like the room name under it.
      FUN`LAYOUT`HEADING: |-
        rule(tone(strong,%0),,lit({"title":"left"}))
      # The options of a list of commands: the arguments after two spaces.
      FUN`LAYOUT`LIST: |-
        json(object,sep,json(string,%b%b))
      # %0 command: padded to the longest, so every list's arguments start in the same column. The lists are
      # separate fields(), one under each section's rule, so they cannot line up by themselves.
      FUN`LAYOUT`COMMAND: |-
        ljust(%0,8)
      # How many players are connected, in a sentence.
      FUN`DISPLAY`ONLINECOUNT: |-
        if(eq(setr(online_count,words(lwho())),1),You are the only one connected.,%q<online_count> players are connected.)
      MOTD: |-
        %r[u(FUN`LAYOUT`HEADING,Welcome to [mudname()])]%rHello, [name(%#)]. [u(FUN`DISPLAY`ONLINECOUNT)]%rType [cmdlink(help,help,Read the help)] for the commands, or [cmdlink(WHO,WHO,See who is online)] to see who is here.
      WIZMOTD: |-
        %r[notice(STAFF,Nothing new for staff. Leave a note here with @wizmotd <message>.,muted)]
      GUEST: |-
        %r[notice(GUEST,You are playing [name(%#)]\, a temporary guest character.)]%rType [cmdlink(help,help,Read the help)] for the commands.[if(strmatch(config(player_creation),Yes),%bTo keep a character\, QUIT and register an account.)]
      NEWUSER: |-
        %r[u(FUN`LAYOUT`SECTION,Your account is ready)]%r[fields(u(FUN`LAYOUT`LIST),create <character> <password>,create your first character,claim <character> <password>,add a character you already have,play <character>,enter the game as one of them)]
      # Shown after the MOTD to a character on no account: what an account is for, and how to put the character on
      # one.
      NOACCOUNT: |-
        %r[notice(ACCOUNT,[name(%#)] is not on an account.)]%rAn account is one login for all your characters here and for the web portal[if(config(mud_url),%bat [config(mud_url)])]. It can also sign in through a service such as Discord where this game offers one.%rTo put [name(%#)] on an account: QUIT\, then [if(strmatch(config(player_creation),Yes),register <name> \[email\] <password> or login if you have one,login <name-or-email> <password>)]\, then claim [name(%#)] <password>.%rType help accounts for more.
      REGISTER: |-
        %r[notice(,[mudname()] is not taking new accounts.,warn)][if(u(FUN`CONNECT`GUESTS),%rYou can still look around: connect guest.)]
      DOWN: |-
        %r[notice(,[mudname()] is closed to logins for now. Please try again later.,warn)]
      QUIT: |-
        %rGoodbye from [tone(strong,mudname())]. Come back soon!

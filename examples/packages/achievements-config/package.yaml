format: "1.20"
package: achievements-config
title: "Achievements: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Achievements settings into +config: registers them with the +config registry, so staff see and change them with +config achievements."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [achievements, config, bridge]
category: Characters
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. achievements declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: achievements
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/achievements/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: achievements_config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`ACHIEVEMENTS: |-
        {{achievements/achievements}}

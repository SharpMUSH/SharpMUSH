format: "1.16"
package: duties-config
title: "Duties: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Duties settings and active roster into +config: registers them with the +config registry, so staff see and change them with +config duties."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [duties, config, bridge]
category: Roleplay
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. duties declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: duties
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/duties/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: duties_config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`DUTIES: |-
        {{duties/duties}}

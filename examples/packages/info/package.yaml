format: "1.16"
package: info
title: "Info files and journals"
version: 1.3.0
authors: [SharpMUSH]
description: "+info and +pinfo files, and a journal per character whose entries can be shared."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [info, journal, notes]
category: Characters
requires_server: ">=0.1"


# One permission, for staff who look after files: read anyone's private files and journal, change
# anyone's files, and lock them. Hand it to one player with @permission/allow <player>=softcode.info.staff.
categories:
  permissions:
    - name: Info Files
      description: Looking after +info files and journals.
permissions:
  - name: softcode.info.staff
    category: Info Files
    description: Read anyone's private files and journal entries; change, lock and unlock anyone's files.

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook), writes
  # the INFOFILE, PINFOFILE and JOURNAL trees on characters, and opens @input sessions.
  #
  # +info, +pinfo and +journal are added with /noparse/rsnoparse and hooked to CMD`<word>, so what
  # a player types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Characters keep their own data, each root flagged wizard and no_command the first time it is written, so
  # only staff code changes it:
  #   INFOFILE`<id>`NAME, TEXT, SET, BY, LOCKED, LOCKEDAT    +info files
  #   PINFOFILE`<id>`...                                     +pinfo files, the same leaves
  #   JOURNAL`<id>`TITLE, TEXT, AT, EDITED, SHARE            journal entries; SHARE is empty, all, or objids
  # The Info Drafts object holds DRAFT`<dbref number>-<connection>`, an open /write session.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC`FILE` and INC`JOURNAL`
  # one routine per switch, INC`WRITE` and INPUT`WRITE` the /write sessions. FUN`FILE` and FUN`JOURNAL`
  # read the data, FUN`DISPLAY` draws it. DATA`CONFIG` the settings +config info shows,
  # DATA`ROUTE` the switches.
  - ref: info
    type: thing
    name: Info Files
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      DATA: |-
        Settings and constants.
      # ---- Settings: +config info ----------------------------------------------
      DATA`CONFIG:
        value: |-
          +info and +pinfo files, and journals.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Info files and journals
      DATA`CONFIG`NAME-LENGTH: |-
        30
      DATA`CONFIG`NAME-LENGTH`TYPE: |-
        integer
      DATA`CONFIG`NAME-LENGTH`DEFAULT: |-
        30
      DATA`CONFIG`NAME-LENGTH`MIN: |-
        1
      DATA`CONFIG`NAME-LENGTH`MAX: |-
        60
      DATA`CONFIG`NAME-LENGTH`DESCRIPTION: |-
        The longest name of a file, or title of an entry, in characters.
      DATA`CONFIG`NAME-LENGTH`LABEL: |-
        Longest name
      DATA`CONFIG`LENGTH: |-
        8000
      DATA`CONFIG`LENGTH`TYPE: |-
        integer
      DATA`CONFIG`LENGTH`DEFAULT: |-
        8000
      DATA`CONFIG`LENGTH`MIN: |-
        1
      DATA`CONFIG`LENGTH`MAX: |-
        1000000
      DATA`CONFIG`LENGTH`DESCRIPTION: |-
        The longest text of a file or entry, in characters. The game's own limit on an attribute's length caps it too.
      DATA`CONFIG`LENGTH`LABEL: |-
        Longest text
      DATA`CONFIG`APPROVAL-LOCK: |-
        0
      DATA`CONFIG`APPROVAL-LOCK`TYPE: |-
        boolean
      DATA`CONFIG`APPROVAL-LOCK`DEFAULT: |-
        0
      DATA`CONFIG`APPROVAL-LOCK`DESCRIPTION: |-
        Once a character is approved, only staff add, change or delete their +info and +pinfo files.
      DATA`CONFIG`APPROVAL-LOCK`LABEL: |-
        Staff keep approved files
      DATA`CONFIG`MARKDOWN: |-
        1
      DATA`CONFIG`MARKDOWN`TYPE: |-
        boolean
      DATA`CONFIG`MARKDOWN`DEFAULT: |-
        1
      DATA`CONFIG`MARKDOWN`DESCRIPTION: |-
        Show the text of files and entries as Markdown: *emphasis*, lists, and a blank line between paragraphs.
      DATA`CONFIG`MARKDOWN`LABEL: |-
        Markdown
      # What a character's root attribute says when the package first writes it.
      DATA`ROOT`INFOFILE: |-
        +info files, one branch per file: NAME, TEXT, SET, BY, LOCKED, LOCKEDAT. Written by the Info Files object.
      DATA`ROOT`PINFOFILE: |-
        +pinfo files, one branch per file: NAME, TEXT, SET, BY, LOCKED, LOCKEDAT. Written by the Info Files object.
      DATA`ROOT`JOURNAL: |-
        Journal entries, one branch per entry: TITLE, TEXT, AT, EDITED, SHARE. Written by the Info Files object.
      # The routines that show a list, a page at a time: +info/2, +journal/2 Wren.
      DATA`PAGED: |-
        FILE`LIST FILE`READ JOURNAL`LIST JOURNAL`READ
      # Which INC` routine each switch runs, per command. BARE is the command alone, ARG the command with something
      # after it, SET the same with an =.
      DATA`ROUTE: |-
        Which routine each switch runs. One branch per command, one leaf per switch.
      DATA`ROUTE`INFO`BARE: |-
        FILE`LIST
      DATA`ROUTE`INFO`ARG: |-
        FILE`READ
      DATA`ROUTE`INFO`SET: |-
        FILE`SET
      DATA`ROUTE`INFO`WRITE: |-
        FILE`WRITE
      DATA`ROUTE`INFO`GET: |-
        FILE`GET
      DATA`ROUTE`INFO`RENAME: |-
        FILE`RENAME
      DATA`ROUTE`INFO`DELETE: |-
        FILE`DELETE
      DATA`ROUTE`INFO`LOCK: |-
        FILE`LOCK
      DATA`ROUTE`INFO`UNLOCK: |-
        FILE`UNLOCK
      DATA`ROUTE`INFO`LSET: |-
        FILE`LSET
      DATA`ROUTE`PINFO`BARE: |-
        FILE`LIST
      DATA`ROUTE`PINFO`ARG: |-
        FILE`READ
      DATA`ROUTE`PINFO`SET: |-
        FILE`SET
      DATA`ROUTE`PINFO`WRITE: |-
        FILE`WRITE
      DATA`ROUTE`PINFO`GET: |-
        FILE`GET
      DATA`ROUTE`PINFO`RENAME: |-
        FILE`RENAME
      DATA`ROUTE`PINFO`DELETE: |-
        FILE`DELETE
      DATA`ROUTE`PINFO`LOCK: |-
        FILE`LOCK
      DATA`ROUTE`PINFO`UNLOCK: |-
        FILE`UNLOCK
      DATA`ROUTE`PINFO`LSET: |-
        FILE`LSET
      DATA`ROUTE`JOURNAL`BARE: |-
        JOURNAL`LIST
      DATA`ROUTE`JOURNAL`ARG: |-
        JOURNAL`READ
      DATA`ROUTE`JOURNAL`SET: |-
        JOURNAL`ADD
      DATA`ROUTE`JOURNAL`WRITE: |-
        JOURNAL`WRITE
      DATA`ROUTE`JOURNAL`EDIT: |-
        JOURNAL`EDIT
      DATA`ROUTE`JOURNAL`TITLE: |-
        JOURNAL`TITLE
      DATA`ROUTE`JOURNAL`GET: |-
        JOURNAL`GET
      DATA`ROUTE`JOURNAL`DELETE: |-
        JOURNAL`DELETE
      DATA`ROUTE`JOURNAL`SHARE: |-
        JOURNAL`SHARE
      DATA`ROUTE`JOURNAL`UNSHARE: |-
        JOURNAL`UNSHARE

      # ---- commands -------------------------------------------------------------
      # Each command word: %1 the switches and %2 what follows, exactly as typed.
      CMD`INFO:
        value: |-
          $(?is)^\+info(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,info,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`PINFO:
        value: |-
          $(?is)^\+pinfo(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,pinfo,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`JOURNAL:
        value: |-
          $(?is)^\+journal(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,journal,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # A line a bridge adds to one of this object's messages: HINT`<message>, set here by a bridge such as
      # info-help. %1 on are passed to it. Nothing when no bridge set one, so the message stands without it.
      FUN`HINT: |-
        if(hasattr(%!,HINT`%0),%b[u(%!/HINT`%0,%1,%2)])
      # Parses the command into registers every routine shares, checks the switch, and runs the routine.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(INFO,Only players use +%<word>.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<switches>,%<argument>); @assert lte(words(%q<cmd_switch_list>),1)=@pemit %#=notice(INFO,Use one switch at a time.,warn); @assert strlen(%q<cmd_route>)=@pemit %#=notice(INFO,+%q<cmd_word> has no /%q<cmd_switch> switch.[u(%!/FUN`HINT,SWITCHES,%q<cmd_topic>)],warn); @assert cor(not(%q<cmd_paged>),member(v(DATA`PAGED),%q<cmd_route>))=@pemit %#=notice(INFO,+%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)] takes no page number.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 the switches and %2 the argument, as typed. Sets cmd_word, cmd_topic (its +help topic),
      # cmd_switch_list, cmd_paged and cmd_page (a number as the last switch is the page), cmd_switch, cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side around the
      # first =, cmd_has_slash, cmd_before_slash and cmd_after_slash around the first / of the left side,
      # cmd_route (the INC` routine to run), viewer_objid and viewer_is_staff, and for +info and +pinfo file_root,
      # file_private and file_noun.
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_topic,if(strmatch(%0,pinfo),info,lcstr(%0)),
          cmd_switch_list,lcstr(trim(edit(%1,/,%b))),
          cmd_paged,regmatch(last(%q<cmd_switch_list>),^%[0-9%]+$),
          cmd_page,if(%q<cmd_paged>,max(1,last(%q<cmd_switch_list>)),1),
          cmd_switch_list,if(%q<cmd_paged>,ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>)),%q<cmd_switch_list>),
          cmd_switch,first(%q<cmd_switch_list>),
          cmd_argument,trim(%2),
          cmd_has_equals,t(pos(=,%2)),
          cmd_left_side,trim(before(%2,=)),
          cmd_right_side,trim(after(%2,=)),
          cmd_has_slash,t(pos(/,%q<cmd_left_side>)),
          cmd_before_slash,trim(before(%q<cmd_left_side>,/)),
          cmd_after_slash,trim(after(%q<cmd_left_side>,/)),
          cmd_route,if(regmatch(%q<cmd_switch>,^%[a-z%]*$),get(%!/DATA`ROUTE`[ucstr(%q<cmd_word>)]`[if(strlen(%q<cmd_switch>),ucstr(%q<cmd_switch>),if(%q<cmd_has_equals>,SET,if(strlen(%q<cmd_argument>),ARG,BARE)))])),
          viewer_objid,objid(%#),
          viewer_is_staff,permission(%#,softcode.info.staff),
          file_root,if(strmatch(%0,pinfo),PINFOFILE,INFOFILE),
          file_private,strmatch(%0,pinfo),
          file_noun,if(strmatch(%0,pinfo),private file,info file))
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 typed text: the objid of the player it names (me is the reader), or nothing.
      FUN`FIND`PLAYER:
        value: |-
          if(isdbref(setr(found_player,if(strmatch(%0,me),%#,pmatch(%0)))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 a name, %1 what it names (file, entry), %2 what it is (name, title): why it cannot be used,
      # or nothing.
      FUN`NAME`PROBLEM:
        value: |-
          cond(not(strlen(%0)),The %1 needs a %2.,gt(strlen(%0),get(%!/DATA`CONFIG`NAME-LENGTH)),Keep the %1's %2 to [get(%!/DATA`CONFIG`NAME-LENGTH)] characters.,regmatch(%0,%[/|=`%,%]),A %1's %2 cannot hold / | = %, or `.,)
        flags: [funsyntax]
      # %0 text: why it cannot be kept, or nothing.
      FUN`TEXT`PROBLEM:
        value: |-
          if(gt(strlen(%0),get(%!/DATA`CONFIG`LENGTH)),Keep the text to [get(%!/DATA`CONFIG`LENGTH)] characters.)
        flags: [funsyntax]
      # %0 typed names, split at commas when there are any, else at spaces. Sets names_found (their objids) and
      # names_missing (what matched no player, |-separated).
      FUN`NAMES`PARSE:
        value: |-
          setqm(names_list,if(pos(%,,%0),iter(%0,trim(%i0),%,,|),edit(squish(trim(%0)),%b,|)),
          names_found,setunion(squish(iter(%q<names_list>,u(%!/FUN`FIND`PLAYER,%i0),|,%b)),),
          names_missing,filterbool(%!/FUN`NAMES`MISSING,%q<names_list>,|,|))
        flags: [funsyntax]
      FUN`NAMES`MISSING:
        value: |-
          not(strlen(u(%!/FUN`FIND`PLAYER,%0)))
        flags: [funsyntax]
      # %0 objids: their names, as a sentence.
      FUN`NAMES`SAY:
        value: |-
          itemize(iter(%0,name(%i0),%b,|),|)
        flags: [funsyntax]
      # Tells each of %<who>, objids: %<message>.
      INC`DO`TELL:
        value: |-
          @if words(%<who>)={@pemit/list iter(%<who>,num(%i0))=notice(INFO,%<message>)}
        flags: [cmdsyntax]
      # Flags a character's root wizard and no_command the first time the package writes it, clearing anything
      # written there before, so only staff code writes it from then on. %<holder> the character, %<root> the root.
      INC`ROOT`PROTECT:
        value: |-
          @if not(hasflag(%<holder>/%<root>,wizard))={@wipe %<holder>/%<root>; &%<root> %<holder>=get(%!/DATA`ROOT`%<root>); @set %<holder>/%<root>=wizard; @set %<holder>/%<root>=no_command}
        flags: [cmdsyntax]

      # ---- pages ------------------------------------------------------------------
      # %q<page_items> a list: sets page_size (from the reader's screen height), page_count and page_shown (the
      # items on page %q<cmd_page>), or says how many pages there are.
      INC`PAGE`OF:
        value: |-
          think setqm(page_size,max(5,sub(height(%#,24),10)),
          page_count,max(1,ceil(fdiv(words(%q<page_items>),%q<page_size>))),
          page_shown,extract(%q<page_items>,inc(mul(dec(%q<cmd_page>),%q<page_size>)),%q<page_size>)); @assert lte(%q<cmd_page>,%q<page_count>)=@pemit %#=notice(INFO,There [if(eq(%q<page_count>,1),is only one page,are only %q<page_count> pages)].,warn)
        flags: [cmdsyntax]
      # Which page this is, and the command for the next, for a footer.
      FUN`PAGE`FOOTER:
        value: |-
          if(gt(%q<page_count>,1),%b· page %q<cmd_page> of %q<page_count>[if(lt(%q<cmd_page>,%q<page_count>),%b· +%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)]/[inc(%q<cmd_page>)][if(strlen(%q<cmd_argument>),%b%q<cmd_argument>)] for more)])
        flags: [funsyntax]

      # ---- display ----------------------------------------------------------------
      # A file's or entry's card is a box() with no sides, corners or tees, as +finger's and +help's are, so text
      # copied from a terminal carries no |. The listings take the game's own border.
      FUN`DISPLAY`FRAME:
        value: |-
          json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
        flags: [funsyntax]
      # Table options, every list split by a new line: %0 the columns that never wrap, %1 each column's
      # priority, %2 each column's share of the spare width.
      FUN`DISPLAY`TABLEOPTIONS:
        value: |-
          json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1),grow,json(string,%2))
        flags: [funsyntax]
      # %0 seconds: the date and time, in the reader's own zone when their TZ holds one.
      FUN`DISPLAY`WHEN:
        value: |-
          cond(not(isint(%0)),-,strlen(setr(when_zone,get(%#/TZ))),timefmt($Y-$m-$d $H:$M,%0,%q<when_zone>),timefmt($Y-$m-$d $H:$M,%0))
        flags: [funsyntax]
      # %0 seconds: the date alone.
      FUN`DISPLAY`DAY:
        value: |-
          first(u(%!/FUN`DISPLAY`WHEN,%0))
        flags: [funsyntax]
      # %0 a file's or entry's text, read with get(): as Markdown or as it is. Never evaluated. A [ is escaped
      # for Markdown, so [OOC: ...] stays text rather than becoming a help reference or a link.
      FUN`DISPLAY`TEXT:
        value: |-
          if(get(%!/DATA`CONFIG`MARKDOWN),rendermarkdown(edit(%0,%[,\\%[),max(10,width(%#,78))),%0)
        flags: [funsyntax]
      # A card: %<body>, %<title> and a muted %<footer> under a line; %<copied> 1 for text a reader copies, which
      # is drawn without sides.
      FUN`DISPLAY`CARD:
        value: |-
          setq(card_body,%<body>%r[rule()]%r[tone(muted,%<footer>)])[if(%<copied>,box(%q<card_body>,%<title>,,u(%!/FUN`DISPLAY`FRAME)),box(%q<card_body>,%<title>))]
        flags: [funsyntax]

      # ---- +info and +pinfo: reading the files ------------------------------------
      # Run with file_target the character and file_root INFOFILE or PINFOFILE.
      # The file ids, in name order.
      FUN`FILE`IDS:
        value: |-
          sortkey(%!/FUN`FILE`NAMEKEY,iter(lattr(%q<file_target>/%q<file_root>`*`NAME),extract(%i0,2,1,`)))
        flags: [funsyntax]
      FUN`FILE`NAMEKEY:
        value: |-
          lcstr(u(%!/FUN`FILE`NAME,%0))
        flags: [funsyntax]
      FUN`FILE`NAME:
        value: |-
          get(%q<file_target>/%q<file_root>`%0`NAME)
        flags: [funsyntax]
      # %0 a file id, %1 a leaf.
      FUN`FILE`LEAF:
        value: |-
          get(%q<file_target>/%q<file_root>`%0`%1)
        flags: [funsyntax]
      FUN`FILE`NEXT:
        value: |-
          inc(lmath(max,0 [iter(lattr(%q<file_target>/%q<file_root>`*`NAME),extract(%i0,2,1,`))]))
        flags: [funsyntax]
      # %0 a typed name: the file with exactly that name, any case.
      FUN`FILE`EXACT:
        value: |-
          first(filterbool(%!/FUN`FILE`NAMED,u(%!/FUN`FILE`IDS),,,lcstr(%0)))
        flags: [funsyntax]
      # %0 a typed name: the file with that name, or the only one whose name starts with it.
      FUN`FILE`FIND:
        value: |-
          firstof(u(%!/FUN`FILE`EXACT,%0),if(eq(words(setr(file_prefixed,filterbool(%!/FUN`FILE`STARTS,u(%!/FUN`FILE`IDS),,,lcstr(%0)))),1),%q<file_prefixed>))
        flags: [funsyntax]
      FUN`FILE`NAMED:
        value: |-
          not(comp(lcstr(u(%!/FUN`FILE`NAME,%0)),%1))
        flags: [funsyntax]
      FUN`FILE`STARTS:
        value: |-
          not(comp(lcstr(left(u(%!/FUN`FILE`NAME,%0),strlen(%1))),%1))
        flags: [funsyntax]
      # 1 when the reader may read the target's files of this kind.
      FUN`FILE`CANREAD:
        value: |-
          cor(not(%q<file_private>),%q<file_own>,%q<viewer_is_staff>)
        flags: [funsyntax]
      # 1 when approval keeps the target's files to staff.
      FUN`FILE`APPROVED:
        value: |-
          cand(get(%!/DATA`CONFIG`APPROVAL-LOCK),isapproved(%q<file_target>))
        flags: [funsyntax]
      # The command that lists the target's files.
      FUN`FILE`LISTCMD:
        value: |-
          +%q<cmd_word>[if(not(%q<file_own>),%b[name(%q<file_target>)])]
        flags: [funsyntax]
      # %0 a file name: the command that reads it.
      FUN`FILE`READCMD:
        value: |-
          +%q<cmd_word> [if(not(%q<file_own>),name(%q<file_target>)/)]%0
        flags: [funsyntax]
      # The page of the target's files in %q<page_shown>: a table, or a line saying there are none.
      FUN`FILE`LISTING:
        value: |-
          uargs(%!/FUN`DISPLAY`CARD,title,name(%q<file_target>) · [if(%q<file_private>,private files,info files)],body,if(words(%q<page_shown>),u(%!/FUN`FILE`TABLE,%q<page_shown>),tone(muted,No files yet.)),footer,if(%q<file_own>,+%q<cmd_word> <file> reads one · +%q<cmd_word> <file>=<text> sets one,+%q<cmd_word> [name(%q<file_target>)]/<file> reads one)[u(%!/FUN`PAGE`FOOTER)])
        flags: [funsyntax]
      # %0 file ids: name, when it was last set, and whether staff locked it.
      FUN`FILE`TABLE:
        value: |-
          datacolumns(u(%!/FUN`DISPLAY`TABLEOPTIONS,2%r3,1%r3%r2,1%r%r),tone(strong,File)%r[iter(%0,cmdlink(setr(file_row_name,u(%!/FUN`FILE`NAME,%i0)),u(%!/FUN`FILE`READCMD,%q<file_row_name>),Read it),%b,%r)],tone(strong,Updated)%r[iter(%0,u(%!/FUN`DISPLAY`WHEN,u(%!/FUN`FILE`LEAF,%i0,SET)),%b,%r)],tone(strong,Locked)%r[iter(%0,if(strlen(u(%!/FUN`FILE`LEAF,%i0,LOCKED)),locked,-),%b,%r)])
        flags: [funsyntax]
      # %0 a file id: the file as a card.
      FUN`FILE`CARD:
        value: |-
          uargs(%!/FUN`DISPLAY`CARD,copied,1,title,name(%q<file_target>) · [u(%!/FUN`FILE`NAME,%0)][if(%q<file_private>,%b· private)],body,u(%!/FUN`DISPLAY`TEXT,u(%!/FUN`FILE`LEAF,%0,TEXT)),footer,u(%!/FUN`FILE`FOOTER,%0))
        flags: [funsyntax]
      FUN`FILE`FOOTER:
        value: |-
          Updated [u(%!/FUN`DISPLAY`WHEN,u(%!/FUN`FILE`LEAF,%0,SET))] by [name(u(%!/FUN`FILE`LEAF,%0,BY))][if(strlen(setr(file_locker,u(%!/FUN`FILE`LEAF,%0,LOCKED))),%b· locked by [name(%q<file_locker>)] on [u(%!/FUN`DISPLAY`DAY,u(%!/FUN`FILE`LEAF,%0,LOCKEDAT))])]
        flags: [funsyntax]
      # %0 a typed name: that file's card, or why there is none.
      FUN`FILE`SHOWNAMED:
        value: |-
          if(strlen(setr(file_id,u(%!/FUN`FILE`FIND,%0))),u(%!/FUN`FILE`CARD,%q<file_id>),notice(INFO,There is no %q<file_noun> called '%0'. [u(%!/FUN`FILE`LISTCMD)] lists them.,warn))
        flags: [funsyntax]
      # %0 a typed name: the command that sets the file again, its text as stored, for copying.
      FUN`FILE`RAW:
        value: |-
          if(strlen(setr(file_id,u(%!/FUN`FILE`FIND,%0))),+%q<cmd_word> [if(not(%q<file_own>),name(%q<file_target>)/)][u(%!/FUN`FILE`NAME,%q<file_id>)]=[u(%!/FUN`FILE`LEAF,%q<file_id>,TEXT)],notice(INFO,There is no %q<file_noun> called '%0'. [u(%!/FUN`FILE`LISTCMD)] lists them.,warn))
        flags: [funsyntax]

      # ---- +info and +pinfo: the routines ------------------------------------------
      # Sets file_target (a player), file_typed (the file or |-list as typed), file_own and file_whose from
      # %q<cmd_left_side>, which is <file> or <player>/<file>.
      INC`FILE`WHO:
        value: |-
          think setqm(file_target,if(%q<cmd_has_slash>,u(%!/FUN`FIND`PLAYER,%q<cmd_before_slash>),%q<viewer_objid>),
          file_typed,if(%q<cmd_has_slash>,%q<cmd_after_slash>,%q<cmd_left_side>)); @assert strlen(%q<file_target>)=@pemit %#=notice(INFO,There is no player called '%q<cmd_before_slash>'.,warn); think setqm(file_own,not(comp(%q<file_target>,%q<viewer_objid>)),
          file_whose,if(%q<file_own>,your,name(%q<file_target>)'s))
        flags: [cmdsyntax]
      INC`FILE`MAYCHANGE:
        value: |-
          @assert cor(%q<file_own>,%q<viewer_is_staff>)=@pemit %#=notice(INFO,Only staff change someone else's files.,error)
        flags: [cmdsyntax]
      INC`FILE`MAYREAD:
        value: |-
          @assert u(%!/FUN`FILE`CANREAD)=@pemit %#=notice(INFO,Only [name(%q<file_target>)] and staff read [name(%q<file_target>)]'s private files.,error)
        flags: [cmdsyntax]
      # An existing file named %q<file_typed>: sets file_id and file_name.
      INC`FILE`NEED:
        value: |-
          @assert strlen(%q<file_typed>)=@pemit %#=notice(INFO,Which file? [u(%!/FUN`FILE`LISTCMD)] lists them.,warn); think setq(file_id,u(%!/FUN`FILE`FIND,%q<file_typed>)); @assert strlen(%q<file_id>)=@pemit %#=notice(INFO,There is no %q<file_noun> called '%q<file_typed>'. [u(%!/FUN`FILE`LISTCMD)] lists them.,warn); think setq(file_name,u(%!/FUN`FILE`NAME,%q<file_id>))
        flags: [cmdsyntax]
      # Staff change any file; everyone else only one staff have not locked, while approval leaves it to them.
      INC`FILE`UNLOCKED:
        value: |-
          @assert cor(%q<viewer_is_staff>,not(strlen(u(%!/FUN`FILE`LEAF,%q<file_id>,LOCKED))))=@pemit %#=notice(INFO,Staff locked %q<file_name>%, so only staff change it.,error); @include %!/INC`FILE`APPROVAL
        flags: [cmdsyntax]
      INC`FILE`APPROVAL:
        value: |-
          @assert cor(%q<viewer_is_staff>,not(u(%!/FUN`FILE`APPROVED)))=@pemit %#=notice(INFO,Staff keep [if(%q<file_own>,your files now you are,name(%q<file_target>)'s files now they are)] approved.,error)
        flags: [cmdsyntax]
      # The file %q<file_id> names, or a new one called %q<file_typed>: sets file_name.
      INC`FILE`OLD:
        value: |-
          think setq(file_name,u(%!/FUN`FILE`NAME,%q<file_id>)); @include %!/INC`FILE`UNLOCKED
        flags: [cmdsyntax]
      INC`FILE`NEW:
        value: |-
          @assert not(strlen(setr(file_problem,u(%!/FUN`NAME`PROBLEM,%q<file_typed>,file,name))))=@pemit %#=notice(INFO,%q<file_problem>,warn); @include %!/INC`FILE`APPROVAL; think setq(file_name,%q<file_typed>)
        flags: [cmdsyntax]
      # +info, +info <player>: a list. Run by FILE`READ too, with file_target and file_own set.
      INC`FILE`LIST:
        value: |-
          think setqm(file_target,%q<viewer_objid>,
          file_own,1); @include %!/INC`FILE`SHOWLIST
        flags: [cmdsyntax]
      INC`FILE`OTHERS:
        value: |-
          @include %!/INC`FILE`MAYREAD; @include %!/INC`FILE`SHOWLIST
        flags: [cmdsyntax]
      INC`FILE`SHOWLIST:
        value: |-
          think setq(page_items,u(%!/FUN`FILE`IDS)); @include %!/INC`PAGE`OF; @pemit %#=u(%!/FUN`FILE`LISTING)
        flags: [cmdsyntax]
      # +info <player>, +info <file>[|<file>...], +info <player>/<file>[|<file>...]. A name alone is a player first.
      INC`FILE`READ:
        value: |-
          @break cand(not(%q<cmd_has_slash>),strlen(setr(file_listed,u(%!/FUN`FIND`PLAYER,%q<cmd_argument>))))={think setqm(file_target,%q<file_listed>,
          file_own,not(comp(%q<file_listed>,%q<viewer_objid>))); @include %!/INC`FILE`OTHERS}; @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYREAD; @pemit %#=iter(%q<file_typed>,u(%!/FUN`FILE`SHOWNAMED,trim(%i0)),|,%r)
        flags: [cmdsyntax]
      # +info/get [<player>/]<file>[|<file>...]
      INC`FILE`GET:
        value: |-
          @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYREAD; @assert strlen(%q<file_typed>)=@pemit %#=notice(INFO,Which file? +%q<cmd_word>/get <file>,warn); @pemit %#=iter(%q<file_typed>,u(%!/FUN`FILE`RAW,trim(%i0)),|,%r)
        flags: [cmdsyntax]
      # +info [<player>/]<file>=<text>. Staff name another player's.
      INC`FILE`SET:
        value: |-
          @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYCHANGE; @assert strlen(%q<cmd_right_side>)=@pemit %#=notice(INFO,+%q<cmd_word> <file>=<text> sets a file%, and +%q<cmd_word>/delete <file> deletes one.,warn); @assert not(strlen(setr(file_problem,u(%!/FUN`TEXT`PROBLEM,%q<cmd_right_side>))))=@pemit %#=notice(INFO,%q<file_problem>,warn); think setq(file_id,u(%!/FUN`FILE`EXACT,%q<file_typed>)); @include %!/INC`FILE`[if(strlen(%q<file_id>),OLD,NEW)]; @include %!/INC`FILE`STORE
        flags: [cmdsyntax]
      # +info/lset <player>/<file>=<text>: sets it and locks it.
      INC`FILE`LSET:
        value: |-
          @assert %q<viewer_is_staff>=@pemit %#=notice(INFO,Only staff lock files.,error); think setq(file_lockit,1); @include %!/INC`FILE`SET
        flags: [cmdsyntax]
      # Writes %q<cmd_right_side> to file %q<file_id> (a new one when empty) named %q<file_name>.
      INC`FILE`STORE:
        value: |-
          think setqm(file_new,not(strlen(%q<file_id>)),
          file_id,firstof(%q<file_id>,u(%!/FUN`FILE`NEXT))); @include/args %!/INC`ROOT`PROTECT=holder,%q<file_target>,root,%q<file_root>; &%q<file_root>`%q<file_id>`TEXT %q<file_target>=%q<cmd_right_side>; @assert not(comp(u(%!/FUN`FILE`LEAF,%q<file_id>,TEXT),%q<cmd_right_side>))=@pemit %#=notice(INFO,The game keeps no text that long%, so nothing was saved.,error); &%q<file_root>`%q<file_id>`NAME %q<file_target>=%q<file_name>; &%q<file_root>`%q<file_id>`SET %q<file_target>=secs(); &%q<file_root>`%q<file_id>`BY %q<file_target>=%q<viewer_objid>; @if %q<file_lockit>={&%q<file_root>`%q<file_id>`LOCKED %q<file_target>=%q<viewer_objid>; &%q<file_root>`%q<file_id>`LOCKEDAT %q<file_target>=secs()}; @pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is [if(%q<file_new>,saved,updated)][if(%q<file_lockit>,%band locked)].,ok); @include/args %!/INC`FILE`TELL=did,if(%q<file_new>,added,changed)
        flags: [cmdsyntax]
      # Tells a player when someone else %<did> one of their files.
      INC`FILE`TELL:
        value: |-
          @if not(%q<file_own>)={@pemit %q<file_target>=notice(INFO,name(%#) %<did> your %q<file_noun> %q<file_name>.)}
        flags: [cmdsyntax]
      # +info/write [<player>/]<file>: the text, a line at a time.
      INC`FILE`WRITE:
        value: |-
          @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYCHANGE; think setq(file_id,u(%!/FUN`FILE`EXACT,%q<file_typed>)); @include %!/INC`FILE`[if(strlen(%q<file_id>),OLD,NEW)]; think setq(write_what,%q<file_whose> %q<file_noun> %q<file_name>); @include %!/INC`WRITE`START
        flags: [cmdsyntax]
      # +info/rename [<player>/]<file>=<new name>
      INC`FILE`RENAME:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(INFO,+%q<cmd_word>/rename <file>=<new name>,warn); @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYCHANGE; @include %!/INC`FILE`NEED; @include %!/INC`FILE`UNLOCKED; @assert not(strlen(setr(file_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_right_side>,file,name))))=@pemit %#=notice(INFO,%q<file_problem>,warn); think setq(file_clash,u(%!/FUN`FILE`EXACT,%q<cmd_right_side>)); @assert cor(not(strlen(%q<file_clash>)),eq(%q<file_clash>,%q<file_id>))=@pemit %#=notice(INFO,There is already a %q<file_noun> called '[u(%!/FUN`FILE`NAME,%q<file_clash>)]'.,warn); &%q<file_root>`%q<file_id>`NAME %q<file_target>=%q<cmd_right_side>; @pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is called %q<cmd_right_side> now.,ok); @include/args %!/INC`FILE`TELL=did,renamed
        flags: [cmdsyntax]
      # +info/delete [<player>/]<file>[|<file>...]
      INC`FILE`DELETE:
        value: |-
          @include %!/INC`FILE`WHO; @include %!/INC`FILE`MAYCHANGE; @assert strlen(%q<file_typed>)=@pemit %#=notice(INFO,Which file? +%q<cmd_word>/delete <file>,warn); @dolist/inline/nobreak/delimit | %q<file_typed>={think setq(file_typed,trim(##)); @include %!/INC`FILE`DELETE`ONE}
        flags: [cmdsyntax]
      INC`FILE`DELETE`ONE:
        value: |-
          @include %!/INC`FILE`NEED; @include %!/INC`FILE`UNLOCKED; @wipe %q<file_target>/%q<file_root>`%q<file_id>; @pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is deleted.,ok); @include/args %!/INC`FILE`TELL=did,deleted
        flags: [cmdsyntax]
      # +info/lock <player>/<file>[|<file>...], +info/unlock: staff only.
      INC`FILE`LOCK:
        value: |-
          @assert %q<viewer_is_staff>=@pemit %#=notice(INFO,Only staff lock files.,error); @include %!/INC`FILE`WHO; @dolist/inline/nobreak/delimit | %q<file_typed>={think setq(file_typed,trim(##)); @include %!/INC`FILE`LOCK`ONE}
        flags: [cmdsyntax]
      INC`FILE`LOCK`ONE:
        value: |-
          @include %!/INC`FILE`NEED; @assert not(strlen(u(%!/FUN`FILE`LEAF,%q<file_id>,LOCKED)))=@pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is locked already.,warn); &%q<file_root>`%q<file_id>`LOCKED %q<file_target>=%q<viewer_objid>; &%q<file_root>`%q<file_id>`LOCKEDAT %q<file_target>=secs(); @pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is locked: only staff change it now.,ok); @include/args %!/INC`FILE`TELL=did,locked
        flags: [cmdsyntax]
      INC`FILE`UNLOCK:
        value: |-
          @assert %q<viewer_is_staff>=@pemit %#=notice(INFO,Only staff unlock files.,error); @include %!/INC`FILE`WHO; @dolist/inline/nobreak/delimit | %q<file_typed>={think setq(file_typed,trim(##)); @include %!/INC`FILE`UNLOCK`ONE}
        flags: [cmdsyntax]
      INC`FILE`UNLOCK`ONE:
        value: |-
          @include %!/INC`FILE`NEED; @assert strlen(u(%!/FUN`FILE`LEAF,%q<file_id>,LOCKED))=@pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is not locked.,warn); &%q<file_root>`%q<file_id>`LOCKED %q<file_target>; &%q<file_root>`%q<file_id>`LOCKEDAT %q<file_target>; @pemit %#=notice(INFO,capstr(%q<file_whose>) %q<file_noun> %q<file_name> is unlocked.,ok); @include/args %!/INC`FILE`TELL=did,unlocked
        flags: [cmdsyntax]

      # ---- +journal: reading -----------------------------------------------------------
      # Run with journal_target the character, journal_own 1 when it is the reader's own journal.
      FUN`JOURNAL`IDS:
        value: |-
          sort(iter(lattr(%q<journal_target>/JOURNAL`*`TITLE),extract(%i0,2,1,`)),n)
        flags: [funsyntax]
      # %0 an entry, %1 a leaf.
      FUN`JOURNAL`LEAF:
        value: |-
          get(%q<journal_target>/JOURNAL`%0`%1)
        flags: [funsyntax]
      FUN`JOURNAL`NEXT:
        value: |-
          inc(lmath(max,0 [u(%!/FUN`JOURNAL`IDS)]))
        flags: [funsyntax]
      # %0 an entry: 1 when the reader may read it.
      FUN`JOURNAL`VISIBLE:
        value: |-
          cor(%q<journal_own>,%q<viewer_is_staff>,strmatch(setr(journal_seen,u(%!/FUN`JOURNAL`LEAF,%0,SHARE)),all),member(%q<journal_seen>,%q<viewer_objid>))
        flags: [funsyntax]
      # %0 an entry: who reads it. The writer and staff see the names; anyone else sees everyone or you.
      FUN`JOURNAL`SHARING:
        value: |-
          cond(strmatch(setr(journal_seen,u(%!/FUN`JOURNAL`LEAF,%0,SHARE)),all),everyone,not(cor(%q<journal_own>,%q<viewer_is_staff>)),you,words(%q<journal_seen>),u(%!/FUN`NAMES`SAY,%q<journal_seen>),if(%q<journal_own>,you,name(%q<journal_target>)) and staff)
        flags: [funsyntax]
      # %0 an entry: the command that reads it.
      FUN`JOURNAL`READCMD:
        value: |-
          +journal [if(not(%q<journal_own>),name(%q<journal_target>)/)]%0
        flags: [funsyntax]
      # The page of entries in %q<page_shown>, newest first.
      FUN`JOURNAL`LISTING:
        value: |-
          uargs(%!/FUN`DISPLAY`CARD,title,name(%q<journal_target>) · journal,body,if(words(%q<page_shown>),u(%!/FUN`JOURNAL`TABLE,%q<page_shown>),tone(muted,Nothing written yet.)),footer,if(%q<journal_own>,+journal <number> reads one · +journal <title>=<text> writes one · +journal/share <number>=<names> shares it,+journal [name(%q<journal_target>)]/<number> reads one)[u(%!/FUN`PAGE`FOOTER)])
        flags: [funsyntax]
      # %0 entries, newest first.
      FUN`JOURNAL`TABLE:
        value: |-
          datacolumns(u(%!/FUN`DISPLAY`TABLEOPTIONS,1%r2%r4,1%r2%r3%r4,%r%r1%r),tone(strong,#)%r[iter(%0,%i0,%b,%r)],tone(strong,Written)%r[iter(%0,u(%!/FUN`DISPLAY`DAY,u(%!/FUN`JOURNAL`LEAF,%i0,AT)),%b,%r)],tone(strong,Title)%r[iter(%0,cmdlink(u(%!/FUN`JOURNAL`LEAF,%i0,TITLE),u(%!/FUN`JOURNAL`READCMD,%i0),Read it),%b,%r)],tone(strong,Read by)%r[iter(%0,u(%!/FUN`JOURNAL`SHARING,%i0),%b,%r)])
        flags: [funsyntax]
      # %0 an entry, as a card.
      FUN`JOURNAL`CARD:
        value: |-
          uargs(%!/FUN`DISPLAY`CARD,copied,1,title,name(%q<journal_target>) · journal %0 · [u(%!/FUN`JOURNAL`LEAF,%0,TITLE)],body,u(%!/FUN`DISPLAY`TEXT,u(%!/FUN`JOURNAL`LEAF,%0,TEXT)),footer,Written [u(%!/FUN`DISPLAY`WHEN,u(%!/FUN`JOURNAL`LEAF,%0,AT))][if(strlen(setr(journal_edited,u(%!/FUN`JOURNAL`LEAF,%0,EDITED))),%b· edited [u(%!/FUN`DISPLAY`WHEN,%q<journal_edited>)])] · read by [u(%!/FUN`JOURNAL`SHARING,%0)])
        flags: [funsyntax]

      # ---- +journal: the routines ----------------------------------------------------------
      INC`JOURNAL`MINE:
        value: |-
          think setqm(journal_target,%q<viewer_objid>,
          journal_own,1)
        flags: [cmdsyntax]
      # The reader's own entry %q<journal_typed>: sets journal_id and journal_title.
      INC`JOURNAL`NEED:
        value: |-
          @include %!/INC`JOURNAL`MINE; @assert strlen(%q<journal_typed>)=@pemit %#=notice(INFO,Which entry? +journal lists them.,warn); @assert cand(isint(%q<journal_typed>),hasattr(%q<journal_target>,JOURNAL`%q<journal_typed>`TITLE))=@pemit %#=notice(INFO,Your journal has no entry '%q<journal_typed>'. +journal lists them.,warn); think setqm(journal_id,%q<journal_typed>,
          journal_title,u(%!/FUN`JOURNAL`LEAF,%q<journal_typed>,TITLE))
        flags: [cmdsyntax]
      INC`JOURNAL`LIST:
        value: |-
          @include %!/INC`JOURNAL`MINE; think setq(journal_ids,u(%!/FUN`JOURNAL`IDS)); @include %!/INC`JOURNAL`SHOWLIST
        flags: [cmdsyntax]
      # Shows %q<journal_ids>, newest first, a page at a time.
      INC`JOURNAL`SHOWLIST:
        value: |-
          think setq(page_items,revwords(%q<journal_ids>)); @include %!/INC`PAGE`OF; @pemit %#=u(%!/FUN`JOURNAL`LISTING)
        flags: [cmdsyntax]
      # +journal <number>, +journal <player>, +journal <player>/<number>
      INC`JOURNAL`READ:
        value: |-
          @break isint(%q<cmd_argument>)={@include %!/INC`JOURNAL`MINE; think setq(journal_typed,%q<cmd_argument>); @include %!/INC`JOURNAL`SHOW}; think setqm(journal_named,if(%q<cmd_has_slash>,%q<cmd_before_slash>,%q<cmd_argument>),
          journal_target,u(%!/FUN`FIND`PLAYER,%q<journal_named>)); @assert strlen(%q<journal_target>)=@pemit %#=notice(INFO,There is no player called '%q<journal_named>'.,warn); think setq(journal_own,not(comp(%q<journal_target>,%q<viewer_objid>))); @break %q<cmd_has_slash>={think setq(journal_typed,%q<cmd_after_slash>); @include %!/INC`JOURNAL`SHOW}; think setq(journal_ids,filterbool(%!/FUN`JOURNAL`VISIBLE,u(%!/FUN`JOURNAL`IDS))); @assert cor(%q<journal_own>,words(%q<journal_ids>))=@pemit %#=notice(INFO,Nothing in [name(%q<journal_target>)]'s journal is shared with you.); @include %!/INC`JOURNAL`SHOWLIST
        flags: [cmdsyntax]
      # Shows entry %q<journal_typed> of %q<journal_target>'s journal, when the reader may read it.
      INC`JOURNAL`SHOW:
        value: |-
          @assert cand(isint(%q<journal_typed>),hasattr(%q<journal_target>,JOURNAL`%q<journal_typed>`TITLE),u(%!/FUN`JOURNAL`VISIBLE,%q<journal_typed>))=@pemit %#=notice(INFO,if(%q<journal_own>,Your journal has no entry '%q<journal_typed>'.,There is no entry '%q<journal_typed>' in [name(%q<journal_target>)]'s journal that you can read.),warn); @pemit %#=u(%!/FUN`JOURNAL`CARD,%q<journal_typed>)
        flags: [cmdsyntax]
      # +journal <title>=<text>: a new entry.
      INC`JOURNAL`ADD:
        value: |-
          @include %!/INC`JOURNAL`MINE; @assert not(strlen(setr(journal_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_left_side>,entry,title))))=@pemit %#=notice(INFO,%q<journal_problem>,warn); @assert strlen(%q<cmd_right_side>)=@pemit %#=notice(INFO,+journal <title>=<text> writes an entry.,warn); @assert not(strlen(setr(journal_problem,u(%!/FUN`TEXT`PROBLEM,%q<cmd_right_side>))))=@pemit %#=notice(INFO,%q<journal_problem>,warn); think setq(journal_id,u(%!/FUN`JOURNAL`NEXT)); @include/args %!/INC`ROOT`PROTECT=holder,%q<journal_target>,root,JOURNAL; &JOURNAL`%q<journal_id>`TEXT %q<journal_target>=%q<cmd_right_side>; @assert not(comp(u(%!/FUN`JOURNAL`LEAF,%q<journal_id>,TEXT),%q<cmd_right_side>))=@pemit %#=notice(INFO,The game keeps no text that long%, so nothing was saved.,error); &JOURNAL`%q<journal_id>`TITLE %q<journal_target>=%q<cmd_left_side>; &JOURNAL`%q<journal_id>`AT %q<journal_target>=secs(); @pemit %#=notice(INFO,Journal entry %q<journal_id>%, %q<cmd_left_side>%, is written. You and staff read it until you share it: +journal/share %q<journal_id>=<names> or all.,ok)
        flags: [cmdsyntax]
      # +journal/write <title>
      INC`JOURNAL`WRITE:
        value: |-
          @assert not(strlen(setr(journal_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_argument>,entry,title))))=@pemit %#=notice(INFO,%q<journal_problem>,warn); think setqm(cmd_left_side,%q<cmd_argument>,
          write_what,a journal entry called %q<cmd_argument>); @include %!/INC`WRITE`START
        flags: [cmdsyntax]
      # +journal/edit <number>=<text>
      INC`JOURNAL`EDIT:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+journal/edit <number>=<text> replaces an entry's text.,warn); think setq(journal_typed,%q<cmd_left_side>); @include %!/INC`JOURNAL`NEED; @assert not(strlen(setr(journal_problem,u(%!/FUN`TEXT`PROBLEM,%q<cmd_right_side>))))=@pemit %#=notice(INFO,%q<journal_problem>,warn); &JOURNAL`%q<journal_id>`TEXT %q<journal_target>=%q<cmd_right_side>; @assert not(comp(u(%!/FUN`JOURNAL`LEAF,%q<journal_id>,TEXT),%q<cmd_right_side>))=@pemit %#=notice(INFO,The game keeps no text that long%, so the entry is as it was.,error); &JOURNAL`%q<journal_id>`EDITED %q<journal_target>=secs(); @pemit %#=notice(INFO,Journal entry %q<journal_id>%, %q<journal_title>%, is updated.,ok)
        flags: [cmdsyntax]
      # +journal/title <number>=<title>
      INC`JOURNAL`TITLE:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(INFO,+journal/title <number>=<title> renames an entry.,warn); think setq(journal_typed,%q<cmd_left_side>); @include %!/INC`JOURNAL`NEED; @assert not(strlen(setr(journal_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_right_side>,entry,title))))=@pemit %#=notice(INFO,%q<journal_problem>,warn); &JOURNAL`%q<journal_id>`TITLE %q<journal_target>=%q<cmd_right_side>; @pemit %#=notice(INFO,Journal entry %q<journal_id> is called %q<cmd_right_side> now.,ok)
        flags: [cmdsyntax]
      # +journal/delete <number>
      INC`JOURNAL`DELETE:
        value: |-
          think setq(journal_typed,%q<cmd_argument>); @include %!/INC`JOURNAL`NEED; @wipe %q<journal_target>/JOURNAL`%q<journal_id>; @pemit %#=notice(INFO,Journal entry %q<journal_id>%, %q<journal_title>%, is deleted.,ok)
        flags: [cmdsyntax]
      # +journal/get <number>: the command that writes it again, its text as stored.
      INC`JOURNAL`GET:
        value: |-
          think setq(journal_typed,%q<cmd_argument>); @include %!/INC`JOURNAL`NEED; @pemit %#=+journal/edit %q<journal_id>=[u(%!/FUN`JOURNAL`LEAF,%q<journal_id>,TEXT)]
        flags: [cmdsyntax]
      # +journal/share <number>=<names> or all
      INC`JOURNAL`SHARE:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+journal/share <number>=<names> shares an entry with them%, and +journal/share <number>=all with everyone.,warn); think setq(journal_typed,%q<cmd_left_side>); @include %!/INC`JOURNAL`NEED; think setq(journal_old,u(%!/FUN`JOURNAL`LEAF,%q<journal_id>,SHARE)); @assert not(strmatch(%q<journal_old>,all))=@pemit %#=notice(INFO,Everyone reads journal entry %q<journal_id> already. +journal/unshare %q<journal_id> keeps it to you again.,warn); @break strmatch(%q<cmd_right_side>,all)={&JOURNAL`%q<journal_id>`SHARE %q<journal_target>=all; @pemit %#=notice(INFO,Everyone reads journal entry %q<journal_id>%, %q<journal_title>%, now.,ok)}; @include %!/INC`NAMES`FOUND; think setq(journal_added,setdiff(%q<names_found>,%q<journal_old> %q<viewer_objid>)); @assert words(%q<journal_added>)=@pemit %#=notice(INFO,They read it already.,warn); &JOURNAL`%q<journal_id>`SHARE %q<journal_target>=setunion(%q<journal_old>,%q<journal_added>); @pemit %#=notice(INFO,u(%!/FUN`NAMES`SAY,%q<journal_added>) [if(eq(words(%q<journal_added>),1),reads,read)] journal entry %q<journal_id>%, %q<journal_title>%, now.,ok); @include/args %!/INC`DO`TELL=who,%q<journal_added>,message,name(%#) shared a journal entry with you: +journal [name(%#)]/%q<journal_id>
        flags: [cmdsyntax]
      # +journal/unshare <number>[=<names>]
      INC`JOURNAL`UNSHARE:
        value: |-
          think setq(journal_typed,%q<cmd_left_side>); @include %!/INC`JOURNAL`NEED; @break not(%q<cmd_has_equals>)={&JOURNAL`%q<journal_id>`SHARE %q<journal_target>; @pemit %#=notice(INFO,Only you and staff read journal entry %q<journal_id>%, %q<journal_title>%, now.,ok)}; think setq(journal_old,u(%!/FUN`JOURNAL`LEAF,%q<journal_id>,SHARE)); @assert not(strmatch(%q<journal_old>,all))=@pemit %#=notice(INFO,Everyone reads journal entry %q<journal_id>. +journal/unshare %q<journal_id> keeps it to you%, and +journal/share then names who else reads it.,warn); @include %!/INC`NAMES`FOUND; think setq(journal_dropped,setinter(%q<names_found>,%q<journal_old>)); @assert words(%q<journal_dropped>)=@pemit %#=notice(INFO,None of them read it.,warn); &JOURNAL`%q<journal_id>`SHARE %q<journal_target>=setdiff(%q<journal_old>,%q<journal_dropped>); @pemit %#=notice(INFO,u(%!/FUN`NAMES`SAY,%q<journal_dropped>) no longer [if(eq(words(%q<journal_dropped>),1),reads,read)] journal entry %q<journal_id>%, %q<journal_title>.,ok)
        flags: [cmdsyntax]
      # Parses %q<cmd_right_side> as names: names_found, or a warning naming those that are no player's.
      INC`NAMES`FOUND:
        value: |-
          think u(%!/FUN`NAMES`PARSE,%q<cmd_right_side>); @assert not(words(%q<names_missing>,|))=@pemit %#=notice(INFO,There is no player called [itemize(iter(%q<names_missing>,'%i0',|,|),|,or)].,warn)
        flags: [cmdsyntax]

      # ---- /write: a text a line at a time -------------------------------------------------
      # Opens an @input session for %q<cmd_word> with %q<cmd_left_side>; %q<write_what> says what is being
      # written. The draft is on the store, one per connection: the command word, LEFT, TEXT and STARTED. .done
      # sends <left>=<text> through the same routine the one-line command runs, checks and all.
      INC`WRITE`START:
        value: |-
          @include %!/INC`WRITE`SWEEP; think setq(write_key,u(%!/FUN`WRITE`KEY)); &%q<write_key> {{info_store}}=%q<cmd_word>; &%q<write_key>`LEFT {{info_store}}=%q<cmd_left_side>; &%q<write_key>`TEXT {{info_store}}; &%q<write_key>`STARTED {{info_store}}=secs(); @input/start Writing %q<write_what>. Type it a line at a time%, with an empty line between paragraphs. .done on a line by itself saves it%, .undo drops the last line%, and @input/cancel throws it away.=.done,%!/INPUT`WRITE`DONE,.undo,%!/INPUT`WRITE`UNDO,*,%!/INPUT`WRITE`LINE,3600
        flags: [cmdsyntax]
      # The draft of the writer's connection: DRAFT`<dbref number>-<connection>, so two clients each keep their own.
      FUN`WRITE`KEY:
        value: |-
          DRAFT`[after(num(%#),#)]-%j
        flags: [funsyntax]
      # Drops drafts older than the longest session. @input/cancel, a disconnect and a restart end a session
      # without running .done, so this and ADISCONNECT are what clear their drafts.
      INC`WRITE`SWEEP:
        value: |-
          @dolist/inline/nobreak lattr({{info_store}}/DRAFT`*`STARTED)={@if lt(get({{info_store}}/##),sub(secs(),3700))={@wipe {{info_store}}/[before(##,`STARTED)]}}
        flags: [cmdsyntax]
      # Any other line, %0 exactly as typed: added to the draft.
      INPUT`WRITE`LINE:
        value: |-
          think setqm(write_key,u(%!/FUN`WRITE`KEY),
          write_next,if(hasattr({{info_store}},%q<write_key>`TEXT),get({{info_store}}/%q<write_key>`TEXT)%r%0,%0)); @assert lte(strlen(%q<write_next>),get(%!/DATA`CONFIG`LENGTH))=@input/prompt notice(INFO,That line would take it past [get(%!/DATA`CONFIG`LENGTH)] characters%, so it is left out. .done saves the rest.,warn); &%q<write_key>`TEXT {{info_store}}=%q<write_next>
        flags: [cmdsyntax]
      # .undo: drops the last line.
      INPUT`WRITE`UNDO:
        value: |-
          think setqm(write_key,u(%!/FUN`WRITE`KEY),
          write_text,get({{info_store}}/%q<write_key>`TEXT),
          write_lines,words(%q<write_text>,%r)); @assert hasattr({{info_store}},%q<write_key>`TEXT)=@input/prompt Nothing to drop yet. .done ends it.; @if gt(%q<write_lines>,1)={&%q<write_key>`TEXT {{info_store}}=ldelete(%q<write_text>,%q<write_lines>,%r)},{&%q<write_key>`TEXT {{info_store}}}; @input/prompt Dropped the last line.
        flags: [cmdsyntax]
      # .done, or an hour after the start: saves what was written, through the command's own routine.
      INPUT`WRITE`DONE:
        value: |-
          think setqm(write_key,u(%!/FUN`WRITE`KEY),
          write_word,get({{info_store}}/%q<write_key>),
          write_left,get({{info_store}}/%q<write_key>`LEFT),
          write_text,get({{info_store}}/%q<write_key>`TEXT)); @wipe {{info_store}}/%q<write_key>; @assert strlen(trim(%q<write_text>))=@pemit %#=notice(INFO,Nothing was written%, so nothing was saved.,warn); @if strmatch(r(reason,args),timeout)={@pemit %#=notice(INFO,An hour has passed since you started%, so what you wrote is being saved.)}; think u(%!/FUN`COMMAND`PARSE,%q<write_word>,,%q<write_left>=%q<write_text>); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @dolist/inline info pinfo journal={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      # Master room ADISCONNECT runs for every player: drops the drafts of connections they no longer have.
      ADISCONNECT:
        value: |-
          @assert hastype(%#,player); @dolist/inline/nobreak lattr({{info_store}}/DRAFT`[after(num(%#),#)]-*`STARTED)={@if not(member(ports(%#),last(before(##,`STARTED),-)))={@wipe {{info_store}}/[before(##,`STARTED)]}}; @include %!/INC`WRITE`SWEEP
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # Open /write drafts. Written only by the Info Files object.
  - ref: info_store
    type: thing
    name: Info Drafts
    location: "{{info}}"
    attributes:
      DRAFT:
        value: |-
          Open +info/write, +pinfo/write and +journal/write sessions, one branch per writer's dbref number and connection.
        flags: [no_command]

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: info_help
    type: thing
    name: Info Help
    location: "{{info}}"
    attributes:
      HELP: |-
        Info files and journals.
      HELP`INFO: |-
        `+info` keeps files about a character that anyone can read: a background, a list of contacts, the things they own. `+pinfo` keeps private ones, which only the character and staff read. Both take the same switches; this topic says `+info`, and `+pinfo` works the same way.

        - `+info` lists your files.
        - `+info <file>` reads one. The start of a name is enough when only one file starts with it.
        - `+info <player>` lists someone else's, and `+info <player>/<file>` reads one.
        - `+info <file>|<file>` reads several at once.

        A name alone is tried as a player first, so `+info Wren` lists Wren's files even if you have a file called Wren. `+info me/Wren` reads your own.

        ## Writing a file

        - `+info <file>=<text>` saves a file, or replaces the text of one you have: `+info Background=Raised on the docks.`
        - `+info/write <file>` writes a long one a line at a time. See `+help info write`.
        - `+info/get <file>` shows the command that saves the file again, its text exactly as stored, to copy, change and paste back.
        - `+info/rename <file>=<new name>` renames one.
        - `+info/delete <file>` deletes one, and `+info/delete <file>|<file>` several.

        What you type is kept as typed: brackets and percent signs are plain text, never code. A name is up to 30 characters and cannot hold a slash, a bar, an equals sign, a comma or a backtick. A text is up to 8000 characters. The game can change both; `+config info` shows them.

        Text is shown as Markdown: `*emphasis*`, a dash at the start of a line for a list, and an empty line between paragraphs. `\[OOC: ...\]` stays as typed.

        ## Long lists

        A list longer than your screen comes in pages, the page asked for as the last switch: `+info/2` is the second page of your files, `+info/2 Wren` the second of Wren's. The last line of a page names the command for the next.

        Output: a table of files with when each was last saved and whether staff locked it, or a file as a box with its name, its text, and who saved it when.
      LOCK`INFO`STAFF: |-
        perm^softcode.info.staff
      HELP`INFO`STAFF: |-
        Staff with the `softcode.info.staff` permission look after other characters' files. A game hands it out: `@role/allow wizard=softcode.info.staff` gives it to every wizard, and `@permission/allow <player>=softcode.info.staff` to one player.

        - `+pinfo <player>` and `+pinfo <player>/<file>` read anyone's private files.
        - `+info <player>/<file>=<text>`, `/write`, `/rename` and `/delete` change anyone's files. The player is told.
        - `+info/lock <player>/<file>` locks a file so only staff change it, and `+info/unlock <player>/<file>` frees it. Both take `<file>|<file>`.
        - `+info/lset <player>/<file>=<text>` saves a file and locks it in one step.

        A locked file shows `locked` in the list. When the `approval-lock` setting is on, an approved character's `+info` and `+pinfo` files are all left to staff.

        The same permission reads every journal entry: `+journal <player>` lists all of a player's entries, shared or not.

        A character's files are attributes on the character: `` INFOFILE`<n>`NAME `` and `` INFOFILE`<n>`TEXT `` for `+info`, `` PINFOFILE`<n>` `` for `+pinfo`, and `` JOURNAL`<n>` `` for the journal. The package flags each tree `wizard` and `no_command` the first time it writes it, so a player cannot change them with `&`.
      LOCK`INFO`SETTINGS: |-
        perm^config.admin
      HELP`INFO`SETTINGS: |-
        `+config info` lists the settings, and `+config info/<setting>=<value>` changes one. Changing them needs `config.admin`.

        - `name-length`: the longest name of a file, or title of an entry, in characters, 1 to 60. 30 by default.
        - `length`: the longest text of a file or entry, in characters. 8000 by default. The game's own limit on an attribute's length caps it too, and a text over that limit is refused rather than cut.
        - `approval-lock`: `1` leaves an approved character's `+info` and `+pinfo` files to staff. `0` by default.
        - `markdown`: `1` shows the text of files and entries as Markdown, `0` as typed. `1` by default.
      HELP`INFO`WRITE: |-
        `+info/write <file>`, `+pinfo/write <file>` and `+journal/write <title>` take the text a line at a time, for something too long to type on one line.

        - Each line you type is added to the text. An empty line keeps a gap between paragraphs.
        - `.undo` on a line by itself drops the last line.
        - `.done` on a line by itself saves it.
        - `@input/cancel` throws it away.

        While you write, nothing you type runs as a command. After an hour, what you wrote is saved as if you had typed `.done`. Saving checks everything the one-line command checks, so a file staff locked in the meantime is not changed.

        ```
        > +journal/write The night market
        Writing a journal entry called The night market. ...
        > Wren went down to the docks after dark.
        > 
        > Nobody followed. She was sure of it.
        > .done
        Done: Journal entry 3, The night market, is written. ...
        ```
      HELP`PINFO: |-
        `+pinfo` keeps private files, which only the character and staff read. It takes every switch `+info` does: `+pinfo`, `+pinfo <file>`, `+pinfo <file>=<text>`, `+pinfo/write`, `/get`, `/rename` and `/delete`. See `+help info`.
      HELP`JOURNAL: |-
        `+journal` is a character's own journal. Only you and staff read an entry until you share it.

        - `+journal` lists your entries, newest first.
        - `+journal <number>` reads one.
        - `+journal <title>=<text>` writes a new one: `+journal The night market=Wren went down to the docks.`
        - `+journal/write <title>` writes one a line at a time. See `+help info write`.

        ## Changing an entry

        - `+journal/edit <number>=<text>` replaces its text.
        - `+journal/get <number>` shows the `/edit` command with the text exactly as stored, to copy, change and paste back.
        - `+journal/title <number>=<title>` renames it.
        - `+journal/delete <number>` deletes it. The other entries keep their numbers.

        ## Sharing

        - `+journal/share <number>=<names>` lets those players read it, and tells them: `+journal/share 3=Bo, Sal` or `+journal/share 3=Bo Sal`. Names with spaces need the commas.
        - `+journal/share <number>=all` lets everyone read it.
        - `+journal/unshare <number>=<names>` takes them off again, and `+journal/unshare <number>` keeps it to you and staff.

        - `+journal <player>` lists what someone has shared with you, and `+journal <player>/<number>` reads one.

        The list's Read by column says who reads each entry. Someone you shared an entry with sees only `you` or `everyone` there, never the other names.

        A list longer than your screen comes in pages: `+journal/2`, or `+journal/2 Wren` for someone else's.

        Output: a table of entries with the day each was written, its title and who reads it, or an entry as a box with its title, its text, and when it was written and edited.
      SEE: |-
        Cross-references.
      SEE`INFO: |-
        pinfo|journal|info write
      SEE`JOURNAL: |-
        info|info write

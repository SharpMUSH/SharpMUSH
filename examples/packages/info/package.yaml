      # The entry %q<book_entry_typed> of %q<book_id>: sets book_entry, book_entry_title and book_entry_by.
      INC`BOOK`NEEDENTRY:
        value: |-
          @assert cand(isint(%q<book_entry_typed>),hasattr({{info_store}},BOOK`%q<book_id>`ENTRY`%q<book_entry_typed>`TITLE))=@pemit %#=notice(INFO,%q<book_name> has no entry '%q<book_entry_typed>'. +notebook %q<book_name> lists them.,warn); think setqm(book_entry,%q<book_entry_typed>,book_entry_title,u(%!/FUN`BOOK`ENTRY,%q<book_entry_typed>,TITLE),book_entry_by,u(%!/FUN`BOOK`ENTRY,%q<book_entry_typed>,BY))
        flags: [cmdsyntax]
      INC`BOOK`MAYEDIT:
        value: |-
          @assert cor(%q<book_can_manage>,not(comp(%q<book_entry_by>,%q<viewer_objid>)))=@pemit %#=notice(INFO,Only whoever wrote an entry%, whoever keeps the notebook%, or staff change it.,error)
        flags: [cmdsyntax]
      # <notebook>/<number> in %q<cmd_left_side>: the notebook and the entry.
      INC`BOOK`NEEDBOTH:
        value: |-
          @assert %q<cmd_has_slash>=@pemit %#=notice(INFO,Name the notebook and the entry: <notebook>/<number>.,warn); think setqm(book_typed,%q<cmd_before_slash>,book_entry_typed,%q<cmd_after_slash>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`NEEDENTRY
        flags: [cmdsyntax]
      # Tells everyone in the notebook but the reader: %<message>.
      INC`BOOK`TELL:
        value: |-
          @include/args %!/INC`TELL=who,setdiff(u(%!/FUN`BOOK`PEOPLE,%q<book_id>),%q<viewer_objid>),message,%<message>
        flags: [cmdsyntax]
      INC`BOOK`LIST:
        value: |-
          think setq(page_items,filterbool(%!/FUN`BOOK`MINE,u(%!/FUN`BOOK`IDS))); @include %!/INC`PAGE`OF; @pemit %#=u(%!/FUN`BOOK`LISTING,Your notebooks)
        flags: [cmdsyntax]
      INC`BOOK`ALL:
        value: |-
          @assert %q<viewer_is_staff>=@pemit %#=notice(INFO,Only staff list every notebook.,error); think setq(page_items,u(%!/FUN`BOOK`IDS)); @include %!/INC`PAGE`OF; @pemit %#=u(%!/FUN`BOOK`LISTING,Every notebook)
        flags: [cmdsyntax]
      # +notebook/create <name>
      INC`BOOK`CREATE:
        value: |-
          @assert not(strlen(setr(book_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_argument>,notebook,name))))=@pemit %#=notice(INFO,%q<book_problem>,warn); @assert not(strlen(u(%!/FUN`BOOK`EXACT,%q<cmd_argument>,u(%!/FUN`BOOK`IDS))))=@pemit %#=notice(INFO,There is already a notebook called '%q<cmd_argument>'.,warn); think setq(book_id,u(%!/FUN`BOOK`NEXT)); &BOOK`%q<book_id>`NAME {{info_store}}=%q<cmd_argument>; &BOOK`%q<book_id>`OWNER {{info_store}}=%q<viewer_objid>; &BOOK`%q<book_id>`CREATED {{info_store}}=secs(); @pemit %#=notice(INFO,Notebook %q<cmd_argument> is made. +notebook/invite %q<cmd_argument>=<names> brings others in.,ok)
        flags: [cmdsyntax]
      # +notebook <notebook>, +notebook <notebook>/<number>
      INC`BOOK`READ:
        value: |-
          think setq(book_typed,if(%q<cmd_has_slash>,%q<cmd_before_slash>,%q<cmd_argument>)); @break %q<cmd_has_slash>={@include %!/INC`BOOK`NEEDBOTH; @pemit %#=u(%!/FUN`BOOK`CARD)}; @include %!/INC`BOOK`NEED; think setq(page_items,revwords(u(%!/FUN`BOOK`ENTRIES,%q<book_id>))); @include %!/INC`PAGE`OF; @pemit %#=u(%!/FUN`BOOK`OVERVIEW)
        flags: [cmdsyntax]
      # +notebook <notebook>/<title>=<text>: a new entry.
      INC`BOOK`ADD:
        value: |-
          @assert cand(%q<cmd_has_slash>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+notebook <notebook>/<title>=<text> adds an entry.,warn); think setq(book_typed,%q<cmd_before_slash>); @include %!/INC`BOOK`NEED; @assert not(strlen(setr(book_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_after_slash>,entry,title))))=@pemit %#=notice(INFO,%q<book_problem>,warn); @assert not(strlen(setr(book_problem,u(%!/FUN`TEXT`PROBLEM,%q<cmd_right_side>))))=@pemit %#=notice(INFO,%q<book_problem>,warn); think setq(book_entry,u(%!/FUN`BOOK`NEXTENTRY)); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`TEXT {{info_store}}=%q<cmd_right_side>; @assert not(comp(u(%!/FUN`BOOK`ENTRY,%q<book_entry>,TEXT),%q<cmd_right_side>))=@pemit %#=notice(INFO,The game keeps no text that long%, so nothing was saved.,error); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`TITLE {{info_store}}=%q<cmd_after_slash>; &BOOK`%q<book_id>`ENTRY`%q<book_entry>`BY {{info_store}}=%q<viewer_objid>; &BOOK`%q<book_id>`ENTRY`%q<book_entry>`AT {{info_store}}=secs(); @pemit %#=notice(INFO,Entry %q<book_entry> of %q<book_name>%, %q<cmd_after_slash>%, is written.,ok); @include/args %!/INC`BOOK`TELL=message,[name(%#)] wrote in %q<book_name>: +notebook %q<book_name>/%q<book_entry>
        flags: [cmdsyntax]
      # +notebook/write <notebook>/<title>
      INC`BOOK`WRITE:
        value: |-
          @assert %q<cmd_has_slash>=@pemit %#=notice(INFO,+notebook/write <notebook>/<title> writes an entry a line at a time.,warn); think setq(book_typed,%q<cmd_before_slash>); @include %!/INC`BOOK`NEED; @assert not(strlen(setr(book_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_after_slash>,entry,title))))=@pemit %#=notice(INFO,%q<book_problem>,warn); think setqm(cmd_left_side,%q<book_name>/%q<cmd_after_slash>,write_what,an entry in %q<book_name> called %q<cmd_after_slash>); @include %!/INC`WRITE`START
        flags: [cmdsyntax]
      # +notebook/edit <notebook>/<number>=<text>
      INC`BOOK`EDIT:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+notebook/edit <notebook>/<number>=<text> replaces an entry's text.,warn); @include %!/INC`BOOK`NEEDBOTH; @include %!/INC`BOOK`MAYEDIT; @assert not(strlen(setr(book_problem,u(%!/FUN`TEXT`PROBLEM,%q<cmd_right_side>))))=@pemit %#=notice(INFO,%q<book_problem>,warn); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`TEXT {{info_store}}=%q<cmd_right_side>; @assert not(comp(u(%!/FUN`BOOK`ENTRY,%q<book_entry>,TEXT),%q<cmd_right_side>))=@pemit %#=notice(INFO,The game keeps no text that long%, so the entry is as it was.,error); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`EDITED {{info_store}}=secs(); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`EDITEDBY {{info_store}}=%q<viewer_objid>; @pemit %#=notice(INFO,Entry %q<book_entry> of %q<book_name>%, %q<book_entry_title>%, is updated.,ok)
        flags: [cmdsyntax]
      # +notebook/title <notebook>/<number>=<title>
      INC`BOOK`TITLE:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(INFO,+notebook/title <notebook>/<number>=<title> renames an entry.,warn); @include %!/INC`BOOK`NEEDBOTH; @include %!/INC`BOOK`MAYEDIT; @assert not(strlen(setr(book_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_right_side>,entry,title))))=@pemit %#=notice(INFO,%q<book_problem>,warn); &BOOK`%q<book_id>`ENTRY`%q<book_entry>`TITLE {{info_store}}=%q<cmd_right_side>; @pemit %#=notice(INFO,Entry %q<book_entry> of %q<book_name> is called %q<cmd_right_side> now.,ok)
        flags: [cmdsyntax]
      # +notebook/delete <notebook>/<number>
      INC`BOOK`DELETE:
        value: |-
          @include %!/INC`BOOK`NEEDBOTH; @include %!/INC`BOOK`MAYEDIT; @wipe {{info_store}}/BOOK`%q<book_id>`ENTRY`%q<book_entry>; @pemit %#=notice(INFO,Entry %q<book_entry> of %q<book_name>%, %q<book_entry_title>%, is deleted.,ok)
        flags: [cmdsyntax]
      # +notebook/get <notebook>/<number>: the command that writes it again, its text as stored.
      INC`BOOK`GET:
        value: |-
          @include %!/INC`BOOK`NEEDBOTH; @pemit %#=+notebook/edit %q<book_name>/%q<book_entry>=[u(%!/FUN`BOOK`ENTRY,%q<book_entry>,TEXT)]
        flags: [cmdsyntax]
      # +notebook/invite <notebook>=<names>
      INC`BOOK`INVITE:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+notebook/invite <notebook>=<names> brings them in.,warn); think setq(book_typed,%q<cmd_left_side>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`MANAGE; @include %!/INC`NAMES`FOUND; think setq(book_added,setdiff(%q<names_found>,u(%!/FUN`BOOK`PEOPLE,%q<book_id>))); @assert words(%q<book_added>)=@pemit %#=notice(INFO,They are in %q<book_name> already.,warn); &BOOK`%q<book_id>`MEMBERS {{info_store}}=setunion(%q<book_members>,%q<book_added>); @pemit %#=notice(INFO,[u(%!/FUN`NAMES`SAY,%q<book_added>)] [if(eq(words(%q<book_added>),1),is,are)] in %q<book_name> now.,ok); @include/args %!/INC`TELL=who,%q<book_added>,message,[name(%#)] brought you into the notebook %q<book_name>: +notebook %q<book_name>
        flags: [cmdsyntax]
      # +notebook/remove <notebook>=<names>
      INC`BOOK`REMOVE:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+notebook/remove <notebook>=<names> takes them out.,warn); think setq(book_typed,%q<cmd_left_side>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`MANAGE; @include %!/INC`NAMES`FOUND; @assert not(member(%q<names_found>,%q<book_owner>))=@pemit %#=notice(INFO,[name(%q<book_owner>)] keeps %q<book_name>: +notebook/owner %q<book_name>=<name> hands it on first.,warn); think setq(book_dropped,setinter(%q<names_found>,%q<book_members>)); @assert words(%q<book_dropped>)=@pemit %#=notice(INFO,None of them are in %q<book_name>.,warn); &BOOK`%q<book_id>`MEMBERS {{info_store}}=setdiff(%q<book_members>,%q<book_dropped>); @pemit %#=notice(INFO,[u(%!/FUN`NAMES`SAY,%q<book_dropped>)] [if(eq(words(%q<book_dropped>),1),is,are)] out of %q<book_name>.,ok); @include/args %!/INC`TELL=who,%q<book_dropped>,message,[name(%#)] took you out of the notebook %q<book_name>.
        flags: [cmdsyntax]
      # +notebook/leave <notebook>
      INC`BOOK`LEAVE:
        value: |-
          think setq(book_typed,%q<cmd_argument>); @include %!/INC`BOOK`NEED; @assert not(%q<book_is_owner>)=@pemit %#=notice(INFO,You keep %q<book_name>: +notebook/owner %q<book_name>=<name> hands it on first.,warn); @assert member(%q<book_members>,%q<viewer_objid>)=@pemit %#=notice(INFO,You are not in %q<book_name>.,warn); &BOOK`%q<book_id>`MEMBERS {{info_store}}=setdiff(%q<book_members>,%q<viewer_objid>); @pemit %#=notice(INFO,You left %q<book_name>.,ok); @include/args %!/INC`TELL=who,%q<book_owner>,message,[name(%#)] left the notebook %q<book_name>.
        flags: [cmdsyntax]
      # +notebook/owner <notebook>=<name>: hands it on. The keeper before stays in it.
      INC`BOOK`OWNER:
        value: |-
          @assert cand(%q<cmd_has_equals>,strlen(%q<cmd_right_side>))=@pemit %#=notice(INFO,+notebook/owner <notebook>=<name> hands it on.,warn); think setq(book_typed,%q<cmd_left_side>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`MANAGE; think setq(book_new_owner,u(%!/FUN`PLAYER,%q<cmd_right_side>)); @assert strlen(%q<book_new_owner>)=@pemit %#=notice(INFO,There is no player called '%q<cmd_right_side>'.,warn); @assert comp(%q<book_new_owner>,%q<book_owner>)=@pemit %#=notice(INFO,[name(%q<book_owner>)] keeps %q<book_name> already.,warn); &BOOK`%q<book_id>`OWNER {{info_store}}=%q<book_new_owner>; &BOOK`%q<book_id>`MEMBERS {{info_store}}=setdiff(setunion(%q<book_members>,%q<book_owner>),%q<book_new_owner>); @pemit %#=notice(INFO,[name(%q<book_new_owner>)] keeps %q<book_name> now.,ok); @include/args %!/INC`TELL=who,%q<book_new_owner>,message,[name(%#)] handed you the notebook %q<book_name>: +notebook %q<book_name>
        flags: [cmdsyntax]
      # +notebook/rename <notebook>=<new name>
      INC`BOOK`RENAME:
        value: |-
          @assert %q<cmd_has_equals>=@pemit %#=notice(INFO,+notebook/rename <notebook>=<new name>,warn); think setq(book_typed,%q<cmd_left_side>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`MANAGE; @assert not(strlen(setr(book_problem,u(%!/FUN`NAME`PROBLEM,%q<cmd_right_side>,notebook,name))))=@pemit %#=notice(INFO,%q<book_problem>,warn); think setq(book_clash,u(%!/FUN`BOOK`EXACT,%q<cmd_right_side>,u(%!/FUN`BOOK`IDS))); @assert cor(not(strlen(%q<book_clash>)),eq(%q<book_clash>,%q<book_id>))=@pemit %#=notice(INFO,There is already a notebook called '%q<cmd_right_side>'.,warn); &BOOK`%q<book_id>`NAME {{info_store}}=%q<cmd_right_side>; @pemit %#=notice(INFO,%q<book_name> is called %q<cmd_right_side> now.,ok); @include/args %!/INC`BOOK`TELL=message,[name(%#)] renamed the notebook %q<book_name> to %q<cmd_right_side>.
        flags: [cmdsyntax]
      # +notebook/destroy <notebook>, then +notebook/destroy <notebook>=yes
      INC`BOOK`DESTROY:
        value: |-
          think setq(book_typed,%q<cmd_left_side>); @include %!/INC`BOOK`NEED; @include %!/INC`BOOK`MANAGE; @assert strmatch(%q<cmd_right_side>,yes)=@pemit %#=notice(INFO,This throws %q<book_name> and its [words(u(%!/FUN`BOOK`ENTRIES,%q<book_id>))] entries away for good. +notebook/destroy %q<book_name>=yes does it.,warn); @include/args %!/INC`BOOK`TELL=message,[name(%#)] threw the notebook %q<book_name> away.; @wipe {{info_store}}/BOOK`%q<book_id>; @pemit %#=notice(INFO,%q<book_name> is gone.,ok)
        flags: [cmdsyntax]

      # ---- /write: a text a line at a time -------------------------------------------------
      # Opens an @input session for %q<cmd_word> with %q<cmd_left_side>; %q<write_what> says what is being
      # written. The draft is on the store, one per connection: the command word, LEFT, TEXT and STARTED. .done
      # sends <left>=<text> through the same routine the one-line command runs, checks and all.
      INC`WRITE`START:
        value: |-
          @include %!/INC`WRITE`SWEEP; think setq(write_key,[u(%!/FUN`WRITE`KEY)]); &%q<write_key> {{info_store}}=%q<cmd_word>; &%q<write_key>`LEFT {{info_store}}=%q<cmd_left_side>; &%q<write_key>`TEXT {{info_store}}; &%q<write_key>`STARTED {{info_store}}=secs(); @input/start Writing %q<write_what>. Type it a line at a time%, with an empty line between paragraphs. .done on a line by itself saves it%, .undo drops the last line%, and @input/cancel throws it away.=.done,%!/INPUT`WRITE`DONE,.undo,%!/INPUT`WRITE`UNDO,*,%!/INPUT`WRITE`LINE,3600
        flags: [cmdsyntax]
      # The draft of the writer's connection: DRAFT`<dbref number>-<connection>, so two clients each keep their own.
      FUN`WRITE`KEY:
        value: |-
          DRAFT`[after(num(%#),#)]-%j
        flags: [funsyntax]
      # Drops drafts older than the longest session. @input/cancel, a disconnect and a restart end a session
      # without running .done, so this and ADISCONNECT are what clear their drafts.
      INC`WRITE`SWEEP:
        value: |-
          @dolist/inline/nobreak lattr({{info_store}}/DRAFT`*`STARTED)={@if lt(get({{info_store}}/##),sub(secs(),3700))={@wipe {{info_store}}/[before(##,`STARTED)]}}
        flags: [cmdsyntax]
      # Any other line, %0 exactly as typed: added to the draft.
      INPUT`WRITE`LINE:
        value: |-
          think setqm(write_key,[u(%!/FUN`WRITE`KEY)],write_next,if(hasattr({{info_store}},%q<write_key>`TEXT),get({{info_store}}/%q<write_key>`TEXT)%r%0,%0)); @assert lte(strlen(%q<write_next>),get(%!/DATA`CONFIG`LENGTH))=@input/prompt notice(INFO,That line would take it past [get(%!/DATA`CONFIG`LENGTH)] characters%, so it is left out. .done saves the rest.,warn); &%q<write_key>`TEXT {{info_store}}=%q<write_next>
        flags: [cmdsyntax]
      # .undo: drops the last line.
      INPUT`WRITE`UNDO:
        value: |-
          think setqm(write_key,[u(%!/FUN`WRITE`KEY)],write_text,get({{info_store}}/%q<write_key>`TEXT),write_lines,words(%q<write_text>,%r)); @assert hasattr({{info_store}},%q<write_key>`TEXT)=@input/prompt Nothing to drop yet. .done ends it.; @if gt(%q<write_lines>,1)={&%q<write_key>`TEXT {{info_store}}=ldelete(%q<write_text>,%q<write_lines>,%r)},{&%q<write_key>`TEXT {{info_store}}}; @input/prompt Dropped the last line.
        flags: [cmdsyntax]
      # .done, or an hour after the start: saves what was written, through the command's own routine.
      INPUT`WRITE`DONE:
        value: |-
          think setqm(write_key,[u(%!/FUN`WRITE`KEY)],write_word,get({{info_store}}/%q<write_key>),write_left,get({{info_store}}/%q<write_key>`LEFT),write_text,get({{info_store}}/%q<write_key>`TEXT)); @wipe {{info_store}}/%q<write_key>; @assert strlen(trim(%q<write_text>))=@pemit %#=notice(INFO,Nothing was written%, so nothing was saved.,warn); @if strmatch(r(reason,args),timeout)={@pemit %#=notice(INFO,An hour has passed since you started%, so what you wrote is being saved.)}; think u(%!/FUN`COMMAND`PARSE,%q<write_word>,,%q<write_left>=%q<write_text>); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]

      # ---- lifecycle ------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @dolist/inline info pinfo journal notebook={@command/add/noparse/rsnoparse +##; @hook/override/inline +##=%!,CMD`[ucstr(##)]}
        flags: [cmdsyntax]
      # Master room ADISCONNECT runs for every player: drops the drafts of connections they no longer have.
      ADISCONNECT:
        value: |-
          @assert hastype(%#,player); @dolist/inline/nobreak lattr({{info_store}}/DRAFT`[after(num(%#),#)]-*`STARTED)={@if not(member(ports(%#),last(before(##,`STARTED),-)))={@wipe {{info_store}}/[before(##,`STARTED)]}}; @include %!/INC`WRITE`SWEEP
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # Notebooks and open /write drafts. Written only by the Info Files object.
  - ref: info_store
    type: thing
    name: Notebook Store
    location: "{{info}}"
    attributes:
      BOOK:
        value: |-
          Notebooks, one branch per notebook: NAME, OWNER, MEMBERS, CREATED, and ENTRY`<n>`TITLE, TEXT, BY, AT, EDITED, EDITEDBY.
        flags: [no_command]
      DRAFT:
        value: |-
          Open +info/write, +journal/write and +notebook/write sessions, one branch per writer's dbref number and connection.
        flags: [no_command]

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: info_help
    type: thing
    name: Info Help
    location: "{{info}}"
    attributes:
      HELP: |-
        Info files, journals and notebooks.
      HELP`INFO: |-
        `+info` keeps files about a character that anyone can read: a background, a list of contacts, the things they own. `+pinfo` keeps private ones, which only the character and staff read. Both take the same switches; this topic says `+info`, and `+pinfo` works the same way.

        - `+info` lists your files.
        - `+info <file>` reads one. The start of a name is enough when only one file starts with it.
        - `+info <player>` lists someone else's, and `+info <player>/<file>` reads one.
        - `+info <file>|<file>` reads several at once.

        A name alone is tried as a player first, so `+info Wren` lists Wren's files even if you have a file called Wren. `+info me/Wren` reads your own.

        ## Writing a file

        - `+info <file>=<text>` saves a file, or replaces the text of one you have: `+info Background=Raised on the docks.`
        - `+info/write <file>` writes a long one a line at a time. See `+help info write`.
        - `+info/get <file>` shows the command that saves the file again, its text exactly as stored, to copy, change and paste back.
        - `+info/rename <file>=<new name>` renames one.
        - `+info/delete <file>` deletes one, and `+info/delete <file>|<file>` several.

        What you type is kept as typed: brackets and percent signs are plain text, never code. A name is up to 30 characters and cannot hold a slash, a bar, an equals sign, a comma or a backtick. A text is up to 8000 characters. The game can change both; `+config info` shows them.

        Text is shown as Markdown: `*emphasis*`, a dash at the start of a line for a list, and an empty line between paragraphs. `\[OOC: ...\]` stays as typed.

        ## Long lists

        A list longer than your screen comes in pages, the page asked for as the last switch: `+info/2` is the second page of your files, `+info/2 Wren` the second of Wren's. The last line of a page names the command for the next.

        Output: a table of files with when each was last saved and whether staff locked it, or a file as a box with its name, its text, and who saved it when.
      HELP`INFO`STAFF: |-
        Staff with the `softcode.info.staff` permission look after other characters' files. A game hands it out: `@role/allow wizard=softcode.info.staff` gives it to every wizard, and `@permission/allow <player>=softcode.info.staff` to one player.

        - `+pinfo <player>` and `+pinfo <player>/<file>` read anyone's private files.
        - `+info <player>/<file>=<text>`, `/write`, `/rename` and `/delete` change anyone's files. The player is told.
        - `+info/lock <player>/<file>` locks a file so only staff change it, and `+info/unlock <player>/<file>` frees it. Both take `<file>|<file>`.
        - `+info/lset <player>/<file>=<text>` saves a file and locks it in one step.

        A locked file shows `locked` in the list. When the `approval-lock` setting is on, an approved character's `+info` and `+pinfo` files are all left to staff.

        The same permission reads every journal entry and every notebook: `+journal <player>` lists all of a player's entries, `+notebook/all` lists every notebook, and staff manage any notebook as its keeper does.

        A character's files are attributes on the character: `` INFOFILE`<n>`NAME `` and `` INFOFILE`<n>`TEXT `` for `+info`, `` PINFOFILE`<n>` `` for `+pinfo`, and `` JOURNAL`<n>` `` for the journal. The package flags each tree `wizard` and `no_command` the first time it writes it, so a player cannot change them with `&`.
      HELP`INFO`SETTINGS: |-
        `+config info` lists the settings, and `+config info/<setting>=<value>` changes one. Changing them needs `config.admin`.

        - `name-length`: the longest name of a file or notebook, or title of an entry, in characters, 1 to 60. 30 by default.
        - `length`: the longest text of a file or entry, in characters. 8000 by default. The game's own limit on an attribute's length caps it too, and a text over that limit is refused rather than cut.
        - `approval-lock`: `1` leaves an approved character's `+info` and `+pinfo` files to staff. `0` by default.
        - `markdown`: `1` shows the text of files and entries as Markdown, `0` as typed. `1` by default.
      HELP`INFO`WRITE: |-
        `+info/write <file>`, `+pinfo/write <file>`, `+journal/write <title>` and `+notebook/write <notebook>/<title>` take the text a line at a time, for something too long to type on one line.

        - Each line you type is added to the text. An empty line keeps a gap between paragraphs.
        - `.undo` on a line by itself drops the last line.
        - `.done` on a line by itself saves it.
        - `@input/cancel` throws it away.

        While you write, nothing you type runs as a command. After an hour, what you wrote is saved as if you had typed `.done`. Saving checks everything the one-line command checks, so a file staff locked in the meantime is not changed.

        ```
        > +journal/write The night market
        Writing a journal entry called The night market. ...
        > Wren went down to the docks after dark.
        > 
        > Nobody followed. She was sure of it.
        > .done
        Done: Journal entry 3, The night market, is written. ...
        ```
      HELP`PINFO: |-
        `+pinfo` keeps private files, which only the character and staff read. It takes every switch `+info` does: `+pinfo`, `+pinfo <file>`, `+pinfo <file>=<text>`, `+pinfo/write`, `/get`, `/rename` and `/delete`. See `+help info`.
      HELP`JOURNAL: |-
        `+journal` is a character's own journal. Only you and staff read an entry until you share it.

        - `+journal` lists your entries, newest first.
        - `+journal <number>` reads one.
        - `+journal <title>=<text>` writes a new one: `+journal The night market=Wren went down to the docks.`
        - `+journal/write <title>` writes one a line at a time. See `+help info write`.

        ## Changing an entry

        - `+journal/edit <number>=<text>` replaces its text.
        - `+journal/get <number>` shows the `/edit` command with the text exactly as stored, to copy, change and paste back.
        - `+journal/title <number>=<title>` renames it.
        - `+journal/delete <number>` deletes it. The other entries keep their numbers.

        ## Sharing

        - `+journal/share <number>=<names>` lets those players read it, and tells them: `+journal/share 3=Bo, Sal` or `+journal/share 3=Bo Sal`. Names with spaces need the commas.
        - `+journal/share <number>=all` lets everyone read it.
        - `+journal/unshare <number>=<names>` takes them off again, and `+journal/unshare <number>` keeps it to you and staff.

        - `+journal <player>` lists what someone has shared with you, and `+journal <player>/<number>` reads one.

        The list's Read by column says who reads each entry. Someone you shared an entry with sees only `you` or `everyone` there, never the other names.

        A list longer than your screen comes in pages: `+journal/2`, or `+journal/2 Wren` for someone else's.

        Output: a table of entries with the day each was written, its title and who reads it, or an entry as a box with its title, its text, and when it was written and edited.
      HELP`NOTEBOOK: |-
        A notebook is shared by a group, for a plot or a project. Whoever starts one keeps it and brings others in; everyone in it reads and writes entries.

        - `+notebook` lists the notebooks you are in.
        - `+notebook/create <name>` starts one. Notebook names are unique across the game.
        - `+notebook <notebook>` shows who is in it and its entries, newest first. The start of a name is enough.
        - `+notebook <notebook>/<number>` reads an entry.
        - `+notebook <notebook>/<title>=<text>` adds an entry, and tells everyone else in the notebook.
        - `+notebook/write <notebook>/<title>` adds one a line at a time. See `+help info write`.

        ## Changing an entry

        Whoever wrote an entry, whoever keeps the notebook, and staff change it.

        - `+notebook/edit <notebook>/<number>=<text>` replaces its text.
        - `+notebook/get <notebook>/<number>` shows the `/edit` command with the text exactly as stored.
        - `+notebook/title <notebook>/<number>=<title>` renames it.
        - `+notebook/delete <notebook>/<number>` deletes it.

        ## Keeping a notebook

        Only its keeper and staff do these.

        - `+notebook/invite <notebook>=<names>` brings players in, and `+notebook/remove <notebook>=<names>` takes them out. Names split at commas when there are any, else at spaces.
        - `+notebook/owner <notebook>=<name>` hands it to someone else. You stay in it.
        - `+notebook/rename <notebook>=<new name>` renames it.
        - `+notebook/destroy <notebook>` says how many entries it holds, and `+notebook/destroy <notebook>=yes` throws it away for good.

        Anyone but the keeper leaves with `+notebook/leave <notebook>`.

        A list longer than your screen comes in pages: `+notebook/2`, or `+notebook/2 <notebook>` for the second page of its entries.

        Output: a table of notebooks with their keeper, how many people and entries each has and the day of the newest, or a notebook's people and entries, or an entry as a box with its title, its text, and who wrote it when.
      SEE: |-
        Cross-references.
      SEE`INFO: |-
        pinfo|journal|notebook|info write
      SEE`JOURNAL: |-
        info|notebook|info write
      SEE`NOTEBOOK: |-
        info|journal|info write

  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`INFO: |-
        {{info}}

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`INFO: |-
        {{info_help}}

format: 1.2
package: chargen
version: 2.0.0
authors: [SharpMUSH]
description: "Character applications: +app keeps a character's application as a draft until it is submitted, staff comment on each section and return it or approve it, every submission is kept so a reviewer sees what changed, applicants see their place in the queue and the typical wait, and an optional cap on active characters keeps a waitlist. The routes chargen-app shows in the portal."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [chargen, applications, approval, review, waitlist]
requires_server: ">=0.1"

# plus-help carries the +help topics, plus-config the settings, and http-handler owns the GET/POST verb
# routers the portal routes hang off.
depends:
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main
  - package: http-handler
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

# One permission, for the people who read applications, comment on them, and return or approve them. A game
# hands it out with the role below (@role/assign <player>=application-reviewer) or to one player
# (@permission/allow <player>=softcode.chargen.review). Changing the form is config.admin, as +config is.
categories:
  roles:
    - name: Applications
      description: Roles for the people who review character applications.
  permissions:
    - name: Applications
      description: Reviewing character applications.
permissions:
  - name: softcode.chargen.review
    category: Applications
    description: Read every character application, comment on it, and return or approve it.
roles:
  - slug: application-reviewer
    name: Application Reviewer
    category: Applications
    priority: 10
    permissions:
      softcode.chargen.review: allow

objects:
  # The command object, in the master room. WIZARD because it adds the commands (@command/add, @hook),
  # assigns and removes the approved role, and sends @mail for the characters it tells.
  #
  # +app and +apps are added with /noparse/rsnoparse and hooked to CMD`APP and CMD`APPS, so what a player
  # types reaches the code exactly as typed and nothing a player wrote is ever evaluated.
  #
  # Trees: CMD` the hooked commands, INC`COMMAND` the shared parse and dispatch, INC`APP` and INC`APPS` one
  # routine per switch, INC`NEED` the guards they share, INC`DO` the writes (shared with the portal routes),
  # FUN` the reads, FUN`DISPLAY` and FUN`PAGE` the screens, WEB` the portal, ON` the hooks a game fills in.
  # DATA`CONFIG` holds the settings (+config chargen) and DATA`ROUTE` which routine each switch runs.
  # The answers are the character's own attributes, set only through +app (the attribute is wizard-flagged).
  # The form, state, rounds and comments are kept on the Chargen Store, so nobody can rewrite their own
  # application's state or history.
  - ref: chargen
    type: thing
    name: Chargen
    location: "{{$master_room}}"
    flags: [WIZARD]
    attributes:
      # ---- settings: +config chargen ---------------------------------------------
      # Each DATA`CONFIG`<NAME> is the value; the leaves under it tell +config what it accepts. The code reads
      # the value with get(); see plus-config's README.
      DATA`CONFIG:
        value: |-
          How character applications are reviewed.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Character applications
      DATA`CONFIG`CAP: |-
        0
      DATA`CONFIG`CAP`TYPE: |-
        integer
      DATA`CONFIG`CAP`DEFAULT: |-
        0
      DATA`CONFIG`CAP`MIN: |-
        0
      DATA`CONFIG`CAP`DESCRIPTION: |-
        The most active characters, counted as holders of the approved role. Past it, an approved application waits for a place. 0 is no cap.
      DATA`CONFIG`CAP`LABEL: |-
        Cap on characters
      DATA`CONFIG`CAP`EXAMPLE: |-
        40
      DATA`CONFIG`APPROVED-ROLE: |-
        approved
      DATA`CONFIG`APPROVED-ROLE`TYPE: |-
        text
      DATA`CONFIG`APPROVED-ROLE`DEFAULT: |-
        approved
      DATA`CONFIG`APPROVED-ROLE`MAX: |-
        32
      DATA`CONFIG`APPROVED-ROLE`CHECK: |-
        FUN`CONFIG`CHECK`ROLE
      DATA`CONFIG`APPROVED-ROLE`DESCRIPTION: |-
        The role an approved character gets. Removing it frees a place under the cap.
      DATA`CONFIG`APPROVED-ROLE`LABEL: |-
        Approved role
      DATA`CONFIG`APPROVED-ROLE`EXAMPLE: |-
        approved
      DATA`CONFIG`SHOW-QUEUE: |-
        1
      DATA`CONFIG`SHOW-QUEUE`TYPE: |-
        boolean
      DATA`CONFIG`SHOW-QUEUE`DEFAULT: |-
        1
      DATA`CONFIG`SHOW-QUEUE`DESCRIPTION: |-
        Whether applicants see their place in the queue and the typical wait, and +apps/queue answers anyone.
      DATA`CONFIG`SHOW-QUEUE`LABEL: |-
        Show the queue
      DATA`CONFIG`SHOW-QUEUE`EXAMPLE: |-
        yes
      DATA`CONFIG`WAIT-SAMPLE: |-
        20
      DATA`CONFIG`WAIT-SAMPLE`TYPE: |-
        integer
      DATA`CONFIG`WAIT-SAMPLE`DEFAULT: |-
        20
      DATA`CONFIG`WAIT-SAMPLE`MIN: |-
        1
      DATA`CONFIG`WAIT-SAMPLE`MAX: |-
        200
      DATA`CONFIG`WAIT-SAMPLE`DESCRIPTION: |-
        How many of the latest decisions the typical wait is the middle of.
      DATA`CONFIG`WAIT-SAMPLE`LABEL: |-
        Decisions in the typical wait
      DATA`CONFIG`WAIT-SAMPLE`EXAMPLE: |-
        20
      DATA`CONFIG`MAIL-OFFLINE: |-
        1
      DATA`CONFIG`MAIL-OFFLINE`TYPE: |-
        boolean
      DATA`CONFIG`MAIL-OFFLINE`DEFAULT: |-
        1
      DATA`CONFIG`MAIL-OFFLINE`DESCRIPTION: |-
        Whether an applicant who is not connected gets decisions and comments by @mail.
      DATA`CONFIG`MAIL-OFFLINE`LABEL: |-
        Mail when offline
      DATA`CONFIG`MAIL-OFFLINE`EXAMPLE: |-
        yes
      # %0 a role's short name: nothing when it is one, else the reason.
      FUN`CONFIG`CHECK`ROLE:
        value: |-
          if(cor(not(strlen(%0)),valid(rolename,%0)),,There is no role '%0'. @role/list lists them.)
        flags: [funsyntax]
      # +config tells this object when a setting changes. A higher cap may free places for the waitlist.
      ACONFIG:
        value: |-
          @break comp(%<setting>,cap); @include/localize %!/INC`DO`ADMITNEXT
        flags: [cmdsyntax]

      # ---- routes ---------------------------------------------------------------
      # Which INC` routine each switch runs: DATA`ROUTE`<APP|APPS>`<switches>, the switches joined by backticks.
      # BARE is the command alone, ARG the command with something after it and no switch.
      DATA`ROUTE: |-
        Which routine each switch runs. One leaf per switch.
      DATA`ROUTE`APP`BARE: |-
        APP`MINE
      DATA`ROUTE`APP`ARG: |-
        APP`SHOW
      DATA`ROUTE`APP`SET: |-
        APP`SET
      DATA`ROUTE`APP`WRITE: |-
        APP`WRITE
      DATA`ROUTE`APP`SUBMIT: |-
        APP`SUBMIT
      DATA`ROUTE`APP`WITHDRAW: |-
        APP`WITHDRAW
      DATA`ROUTE`APP`DIFF: |-
        APP`DIFF
      DATA`ROUTE`APP`COMMENT: |-
        APP`COMMENT
      DATA`ROUTE`APP`NOTE: |-
        APP`NOTE
      DATA`ROUTE`APP`RETURN: |-
        APP`RETURN
      DATA`ROUTE`APP`APPROVE: |-
        APP`APPROVE
      DATA`ROUTE`APP`RETIRE: |-
        APP`RETIRE
      DATA`ROUTE`APPS`BARE: |-
        APPS`QUEUE
      DATA`ROUTE`APPS`QUEUE: |-
        APPS`PUBLIC
      DATA`ROUTE`APPS`WAITLIST: |-
        APPS`WAITLIST
      DATA`ROUTE`APPS`ALL: |-
        APPS`ALL
      DATA`ROUTE`APPS`DECIDED: |-
        APPS`DECIDED
      DATA`ROUTE`APPS`FIELDS: |-
        APPS`FIELDS
      DATA`ROUTE`APPS`SECTION: |-
        APPS`SECTION
      DATA`ROUTE`APPS`SECTION`ORDER: |-
        APPS`SECTION`ORDER
      DATA`ROUTE`APPS`SECTION`REMOVE: |-
        APPS`SECTION`REMOVE
      DATA`ROUTE`APPS`FIELD: |-
        APPS`FIELD
      DATA`ROUTE`APPS`FIELD`LABEL: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`SECTION: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`TYPE: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`CHOICES: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`REQUIRED: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`MAX: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`ORDER: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`HELP: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`ATTRIBUTE: |-
        APPS`FIELD`OPTION
      DATA`ROUTE`APPS`FIELD`REMOVE: |-
        APPS`FIELD`REMOVE
      # The routines that take a page as a last switch: +apps/2.
      DATA`PAGED: |-
        APPS`QUEUE APPS`WAITLIST APPS`ALL APPS`DECIDED

      # ---- commands -------------------------------------------------------------
      # %1 the switches and %2 what follows, exactly as typed.
      CMD`APP:
        value: |-
          $(?is)^\+app(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,app,table,APP,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      CMD`APPS:
        value: |-
          $(?is)^\+apps(/\S*)?(?\: +(.*))?$:@include/args %!/INC`COMMAND`RUN=word,apps,table,APPS,switches,%1,argument,%2
        flags: [regexp, cmdsyntax]
      # Parses the command into registers every routine shares, checks the switches and the page, and runs the
      # routine. Only players have applications.
      INC`COMMAND`RUN:
        value: |-
          @assert hastype(%#,player)=@pemit %#=notice(APP,Only players have applications.,warn); think u(%!/FUN`COMMAND`PARSE,%<word>,%<table>,%<switches>,%<argument>); @assert strlen(%q<cmd_route>)=@pemit %#=notice(APP,if(strlen(%q<cmd_switch>),+%q<cmd_word> has no /%q<cmd_switch> switch.,+%q<cmd_word> takes nothing after it.) +help app lists the commands.,warn); @assert cor(not(%q<page_given>),member(get(%!/DATA`PAGED),%q<cmd_route>))=@pemit %#=notice(APP,+%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)] takes no page number.,warn); @assert gt(%q<page_number>,0)=@pemit %#=notice(APP,Pages start at 1: +%q<cmd_word>[if(strlen(%q<cmd_switch>),/%q<cmd_switch>)]/2 is the second.,warn); @include %!/INC`%q<cmd_route>
        flags: [cmdsyntax]
      # %0 the word, %1 its route table, %2 the switches and %3 the argument, as typed. Sets cmd_word, cmd_table,
      # cmd_switch_list (every switch but a page), page_given and page_number (a last switch of digits, else 1),
      # cmd_switch (the switches joined by /), cmd_argument, cmd_has_equals, cmd_left_side and cmd_right_side
      # around the first =, cmd_route (the INC` routine to run), page_size (rows on one page), viewer_objid,
      # viewer_key, viewer_staff (may review) and viewer_admin (may change the form).
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_word,lcstr(%0),
          cmd_table,%1,
          cmd_switch_list,lcstr(trim(edit(%2,/,%b))),
          page_given,isint(last(%q<cmd_switch_list>)),
          page_number,if(%q<page_given>,last(%q<cmd_switch_list>),1),
          cmd_switch_list,if(%q<page_given>,ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>)),%q<cmd_switch_list>),
          cmd_switch,edit(%q<cmd_switch_list>,%b,/),
          cmd_argument,trim(%3),
          cmd_has_equals,strmatch(%3,*=*),
          cmd_left_side,trim(before(%3,=)),
          cmd_right_side,trim(after(%3,=)),
          cmd_route,get(%!/DATA`ROUTE`%1`[if(strlen(%q<cmd_switch>),ucstr(edit(%q<cmd_switch>,/,`)),if(strlen(%q<cmd_argument>),ARG,BARE))]),
          page_size,u(%!/FUN`PAGE`SIZE),
          viewer_objid,objid(%#),
          viewer_key,u(%!/FUN`KEY,%#),
          viewer_staff,u(%!/FUN`IS`REVIEWER,%#),
          viewer_admin,permission(%#,config.admin))
        flags: [funsyntax]
      # %0 a player: 1 when they may review applications.
      FUN`IS`REVIEWER:
        value: |-
          permission(%0,softcode.chargen.review)
        flags: [funsyntax]

      # ---- shared reads ---------------------------------------------------------
      # %0 an object: the key its application is filed under. An objid cannot be part of an attribute name,
      # so #12:1790888816538 is filed as 12_1790888816538.
      FUN`KEY:
        value: |-
          edit(objid(%0),#,,:,_)
        flags: [funsyntax]
      # %0 typed text: the objid of the player it names, or nothing.
      FUN`PLAYER:
        value: |-
          if(isdbref(setr(found_player,pmatch(%0))),objid(%q<found_player>))
        flags: [funsyntax]
      # %0 seconds: a short duration, 5m or 2d.
      FUN`DISPLAY`DURATION:
        value: |-
          trim(etime(max(0,%0),3))
        flags: [funsyntax]
      # %0 a time in seconds: how long ago it was, or - when there is none.
      FUN`DISPLAY`AGO:
        value: |-
          if(isint(%0),[u(%!/FUN`DISPLAY`DURATION,sub(secs(),%0))] ago,-)
        flags: [funsyntax]
      # Table options, every list split by a new line: %0 the columns that never wrap, %1 each column's
      # priority, %2 each column's share of the spare width, %3 each column's least width.
      FUN`DISPLAY`TABLEOPTIONS:
        value: |-
          json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,%0),priority,json(string,%1),grow,json(string,%2),min,json(string,%3))
        flags: [funsyntax]
      # How many rows fit on the reader's screen, under a heading, a table's own heading and a footer.
      FUN`PAGE`SIZE:
        value: |-
          max(5,sub(height(%#,24),6))
        flags: [funsyntax]
      # %0 a list: how many pages it takes.
      FUN`PAGE`COUNT:
        value: |-
          max(1,ceil(fdiv(words(%0),%q<page_size>)))
        flags: [funsyntax]
      # %0 a list: the items on page %q<page_number>, %q<page_size> to a page.
      FUN`PAGE`ITEMS:
        value: |-
          extract(%0,inc(mul(dec(%q<page_number>),%q<page_size>)),%q<page_size>)
        flags: [funsyntax]
      # %0 a list, %1 the command for its pages as typed, %2 the hint when there is one page.
      FUN`PAGE`FOOTER:
        value: |-
          setq(page_count,u(%!/FUN`PAGE`COUNT,%0))[rule(if(gt(%q<page_count>,1),page %q<page_number> of %q<page_count>[if(lt(%q<page_number>,%q<page_count>),%b· %1/[inc(%q<page_number>)])],%2))]
        flags: [funsyntax]
      # Stops a command whose list %<list> has no page %q<page_number>.
      INC`PAGE`CHECK:
        value: |-
          think setq(page_count,u(%!/FUN`PAGE`COUNT,%<list>)); @assert lte(%q<page_number>,%q<page_count>)=@pemit %#=notice(APP,There [if(eq(%q<page_count>,1),is only one page,are only %q<page_count> pages)].,warn)
        flags: [cmdsyntax]

      # ---- the form -------------------------------------------------------------
      # The form is kept on the store: SECTION`<KEY> its title, with ORDER; FIELD`<KEY> its label, with
      # SECTION, TYPE (text, long or choice), CHOICES (split by |), REQUIRED (1 or 0), MAX (characters), ORDER
      # HELP and ATTRIBUTE (the character's attribute that holds it; the key by default). Keys are upper case;
      # players type them in any case.
      #
      # %0 a section: where it comes in the form.
      FUN`FORM`SECTION`ORDER:
        value: |-
          default({{store}}/SECTION`%0`ORDER,99)
        flags: [funsyntax]
      # %0 a field: where it comes in its section.
      FUN`FORM`FIELD`ORDER:
        value: |-
          default({{store}}/FIELD`%0`ORDER,99)
        flags: [funsyntax]
      # The sections, in order.
      FUN`FORM`SECTIONS:
        value: |-
          sortkey(%!/FUN`FORM`SECTION`ORDER,iter(lattr({{store}}/SECTION`*),after(%i0,`)),n)
        flags: [funsyntax]
      # %0 a section: its fields, in order.
      FUN`FORM`FIELDS:
        value: |-
          sortkey(%!/FUN`FORM`FIELD`ORDER,filterbool(%!/FUN`FORM`FIELD`IN,iter(lattr({{store}}/FIELD`*),after(%i0,`)),,,%0),n)
        flags: [funsyntax]
      # %0 a field, %1 a section: 1 when the field is in it.
      FUN`FORM`FIELD`IN:
        value: |-
          not(comp(get({{store}}/FIELD`%0`SECTION),%1))
        flags: [funsyntax]
      # Every field, section by section.
      FUN`FORM`ALLFIELDS:
        value: |-
          squish(iter(u(%!/FUN`FORM`SECTIONS),u(%!/FUN`FORM`FIELDS,%i0)))
        flags: [funsyntax]
      # %0 typed text: the key it names when it is a word of letters, digits, - and _, upper case.
      FUN`FORM`KEY:
        value: |-
          if(cand(lte(strlen(%0),30),regmatch(%0,^%[A-Za-z0-9_-%]+$)),ucstr(%0))
        flags: [funsyntax]
      # %0 typed text: the field it names, or nothing.
      FUN`FIELD`FIND:
        value: |-
          setq(field_found,u(%!/FUN`FORM`KEY,%0))[if(cand(strlen(%q<field_found>),hasattr({{store}},FIELD`%q<field_found>)),%q<field_found>)]
        flags: [funsyntax]
      # %0 typed text: the section it names, or nothing.
      FUN`SECTION`FIND:
        value: |-
          setq(section_found,u(%!/FUN`FORM`KEY,%0))[if(cand(strlen(%q<section_found>),hasattr({{store}},SECTION`%q<section_found>)),%q<section_found>)]
        flags: [funsyntax]
      FUN`FIELD`LABEL:
        value: |-
          firstof(get({{store}}/FIELD`%0),lcstr(%0))
        flags: [funsyntax]
      FUN`FIELD`TYPE:
        value: |-
          firstof(get({{store}}/FIELD`%0`TYPE),text)
        flags: [funsyntax]
      # %0 a field: the most characters it takes.
      # %0 a field: the attribute on the character that holds it.
      FUN`FIELD`ATTRIBUTE:
        value: |-
          firstof(get({{store}}/FIELD`%0`ATTRIBUTE),%0)
        flags: [funsyntax]
      FUN`FIELD`MAX:
        value: |-
          firstof(get({{store}}/FIELD`%0`MAX),if(strmatch(u(%!/FUN`FIELD`TYPE,%0),long),4000,200))
        flags: [funsyntax]
      # %0 a choice field, %1 typed text: the choice it names, as the form writes it, or nothing.
      FUN`FIELD`CHOICE:
        value: |-
          setq(field_choices,get({{store}}/FIELD`%0`CHOICES))[setq(field_choice_at,member(lcstr(%q<field_choices>),lcstr(trim(%1)),|))][if(%q<field_choice_at>,extract(%q<field_choices>,%q<field_choice_at>,1,|))]
        flags: [funsyntax]
      # %0 a field: its label, and its key in muted text when a player could not guess the key from the label.
      FUN`FIELD`NAME:
        value: |-
          setq(field_label,u(%!/FUN`FIELD`LABEL,%0))[%q<field_label>][if(comp(lcstr(%q<field_label>),lcstr(%0)),%b[tone(muted,\([lcstr(%0)]\))])]
        flags: [funsyntax]
      # %0 a section: its title, and its key in muted text when a player could not guess the key from the title.
      FUN`SECTION`NAME:
        value: |-
          setq(section_title,firstof(get({{store}}/SECTION`%0),lcstr(%0)))[%q<section_title>][if(comp(lcstr(%q<section_title>),lcstr(%0)),%b[tone(muted,\([lcstr(%0)]\))])]
        flags: [funsyntax]
      # %0 a field, %1 typed text: nothing when the text fits the field, else the reason.
      FUN`FIELD`PROBLEM:
        value: |-
          switch(1,gt(strlen(%1),u(%!/FUN`FIELD`MAX,%0)),Keep [lcstr(u(%!/FUN`FIELD`LABEL,%0))] to [u(%!/FUN`FIELD`MAX,%0)] characters.,cand(strlen(%1),strmatch(u(%!/FUN`FIELD`TYPE,%0),choice),not(strlen(u(%!/FUN`FIELD`CHOICE,%0,%1)))),[u(%!/FUN`FIELD`LABEL,%0)] is one of: [edit(get({{store}}/FIELD`%0`CHOICES),|,%,%b)].,)
        flags: [funsyntax]
      # %0 a field, %1 text that fits it: the text as it is kept. A choice is kept as the form writes it.
      FUN`FIELD`STORED:
        value: |-
          if(cand(strlen(%1),strmatch(u(%!/FUN`FIELD`TYPE,%0),choice)),u(%!/FUN`FIELD`CHOICE,%0,%1),%1)
        flags: [funsyntax]

      # ---- applications ---------------------------------------------------------
      # An application is APP`<key> on the store, the character's objid, with STATE (draft, submitted, changes,
      # approved, waitlist or retired), CREATED, ROUND (how many times it was submitted), SUBMITTED (when it last
      # was), DECIDED and BY (the last decision and who made it), WAITLISTED, and ROUND`<n> with AT and FIELD`<F>
      # (each submission as it was sent; the draft is on the character). COMMENT`<n> holds a comment, with
      # SECTION (empty for the whole application), AUTHOR (objid), NAME (the author's name then), AT, ROUND,
      # PRIVATE (1 for staff only) and KIND (comment, return, approve, waitlist or retire); COMMENTS is the last
      # number.
      #
      # %0 a key: its state, empty when there is no application.
      FUN`APP`STATE:
        value: |-
          get({{store}}/APP`%0`STATE)
        flags: [funsyntax]
      # %0 a state: how it reads.
      FUN`STATE`LABEL:
        value: |-
          switch(%0,draft,Draft,submitted,Submitted,changes,Needs changes,approved,Approved,waitlist,Waitlisted,retired,Retired,Not started)
        flags: [funsyntax]
      # %0 a state: the theme colour it is shown in.
      FUN`STATE`TONE:
        value: |-
          switch(%0,submitted,info,changes,warning,approved,success,waitlist,secondary,muted)
        flags: [funsyntax]
      # %0 a state: 1 when its owner may change the application.
      FUN`STATE`EDITABLE:
        value: |-
          match(draft changes retired,firstof(%0,draft))
        flags: [funsyntax]
      # %0 a key: the character's name, or a dash when the character is gone.
      FUN`APP`NAME:
        value: |-
          setq(app_name_objid,get({{store}}/APP`%0))[if(isdbref(%q<app_name_objid>),name(%q<app_name_objid>),-)]
        flags: [funsyntax]
      # %0 a key, %1 a field, %2 a round, or nothing for the draft: what the field said. The draft is the
      # character's own attribute; a round is the copy kept on the store when it was submitted.
      FUN`APP`VALUE:
        value: |-
          if(strlen(%2),get({{store}}/APP`%0`ROUND`%2`FIELD`%1),if(isdbref(setr(value_objid,get({{store}}/APP`%0))),get(%q<value_objid>/[u(%!/FUN`FIELD`ATTRIBUTE,%1)])))
        flags: [funsyntax]
      # %0 a field, %1 a key, %2 and %3 two rounds, either of them empty for the draft: 1 when the field differs.
      FUN`APP`DIFFERS:
        value: |-
          comp(u(%!/FUN`APP`VALUE,%1,%0,%2),u(%!/FUN`APP`VALUE,%1,%0,%3))
        flags: [funsyntax]
      # %0 a key, %1 and %2 two rounds, either empty for the draft: the fields that differ between them, in form order.
      FUN`APP`CHANGED:
        value: |-
          filterbool(%!/FUN`APP`DIFFERS,u(%!/FUN`FORM`ALLFIELDS),,,%0,%1,%2)
        flags: [funsyntax]
      # %0 a field, %1 a key: 1 when a required field of that application's draft is empty.
      FUN`APP`MISSES:
        value: |-
          cand(get({{store}}/FIELD`%0`REQUIRED),not(strlen(u(%!/FUN`APP`VALUE,%1,%0))))
        flags: [funsyntax]
      # Every application's key.
      FUN`APP`KEYS:
        value: |-
          iter(lattr({{store}}/APP`*),after(%i0,`))
        flags: [funsyntax]
      # %0 a key, %1 states: 1 when the application is in one of them.
      FUN`APP`IN:
        value: |-
          match(%1,get({{store}}/APP`%0`STATE))
        flags: [funsyntax]
      # %0 an application: 1 when it is undecided and has been submitted at least once, so staff may see it.

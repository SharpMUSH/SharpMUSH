          web_public_wait,u(%!/FUN`WAIT`TYPICAL),
          web_public_cap,default(%!/DATA`CONFIG`CAP,0))[u(%!/WEB`OBJ,[u(%!/WEB`PAIR,Waiting,json(string,%q<web_public_count> application[if(neq(%q<web_public_count>,1),s)]),1)]%r[u(%!/WEB`PAIR,Typical wait,json(string,if(strlen(%q<web_public_wait>),about [u(%!/FUN`DISPLAY`DURATION,%q<web_public_wait>)],not known yet)),1)]%r[u(%!/WEB`PAIR,Places,json(string,if(gt(%q<web_public_cap>,0),[u(%!/FUN`ACTIVE)] of %q<web_public_cap> taken%, [words(u(%!/FUN`WAITLIST))] waiting,no cap)),1)])]
        flags: [funsyntax]

      # sidebar: GET /http/chargen/nav
      # Viewer %0's sidebar: their application, the public queue when the game shows it, and for a reviewer the
      # lists with their counts. Nobody signed in gets no links, and the portal shows the app's own.
      WEB`NAV:
        value: |-
          json(object,groups,if(strlen(%0),u(%!/WEB`ARR,[json(object,label,json(string,),items,u(%!/WEB`ARR,[u(%!/WEB`LINK,My application,/apps/chargen,assignment_ind)][if(cand(not(u(%!/FUN`IS`REVIEWER,%0)),get(%!/DATA`CONFIG`SHOW-QUEUE)),%r[u(%!/WEB`LINK,Queue,/apps/chargen/queue,hourglass_top)])]))][if(u(%!/FUN`IS`REVIEWER,%0),%r[json(object,label,json(string,Review),items,u(%!/WEB`ARR,[u(%!/WEB`LINK,Waiting,/apps/chargen/queue,inbox,words(u(%!/FUN`QUEUE)))]%r[u(%!/WEB`LINK,Waitlist,/apps/chargen/waitlist,hourglass_top,words(u(%!/FUN`WAITLIST)))]%r[u(%!/WEB`LINK,Open,/apps/chargen/all,view_list)]%r[u(%!/WEB`LINK,Decided,/apps/chargen/decided,inventory_2)]))])]),json_array()))
        flags: [funsyntax]
      # A sidebar link: label %0, path %1, Material icon %2, and count %3 when there is one.

      WEB`DATA`APP:
        value: |-
          setqm(web_data_state,u(%!/FUN`APP`STATE,%0),
          web_data_round,default({{store}}/APP`%0`ROUND,0),
          web_data_queue,if(cor(%1,get(%!/DATA`CONFIG`SHOW-QUEUE)),u(%!/FUN`QUEUE`TEXT,%0)))[u(%!/WEB`OBJ,[u(%!/WEB`PAIR,State,json(string,[u(%!/FUN`STATE`LABEL,%q<web_data_state>)][if(%q<web_data_round>,%b· round %q<web_data_round>)]),1)]%r[u(%!/WEB`PAIR,Submitted,json(string,u(%!/FUN`DISPLAY`AGO,get({{store}}/APP`%0`SUBMITTED))),1)]%r[u(%!/WEB`PAIR,Queue,json(string,%q<web_data_queue>),strlen(%q<web_data_queue>))]%r[u(%!/WEB`PAIR,comments_all,u(%!/WEB`COMMENTS,%0,,%1),1)][iter(u(%!/FUN`FORM`SECTIONS),%r[u(%!/WEB`PAIR,comments_[lcstr(%i0)],u(%!/WEB`COMMENTS,%0,%i0,%1),1)][if(cand(%1,gt(%q<web_data_round>,1)),%r[u(%!/WEB`PAIR,diff_[lcstr(%i0)],u(%!/WEB`DIFF,%0,%i0,dec(%q<web_data_round>),%q<web_data_round>),1)])],%b,)][if(%2,iter(u(%!/FUN`FORM`ALLFIELDS),%r[u(%!/WEB`PAIR,field_[lcstr(%i0)],json(string,u(%!/FUN`APP`VALUE,%0,%i0)),1)],%b,))])]
        flags: [funsyntax]
      # %0 a key, %1 a section (empty for the whole application), %2 1 for a reviewer: the comments there, as
      # timeline entries.
      WEB`COMMENTS:
        value: |-
          u(%!/WEB`ARR,iter(u(%!/FUN`APP`COMMENTS,%0,%1,%2),u(%!/WEB`COMMENT,%0,%i0),%b,%r))
        flags: [funsyntax]
      # %0 a key, %1 a comment: its timeline entry, tagged with the decision it came with or Staff only.
      WEB`COMMENT:
        value: |-
          setqm(web_comment,APP`%0`COMMENT`%1,
          web_comment_tag,if(get({{store}}/%q<web_comment>`PRIVATE),Staff only,switch(get({{store}}/%q<web_comment>`KIND),return,Asked for changes,approve,Approved,waitlist,Waitlisted,retire,Retired,)))[json(object,author,json(string,get({{store}}/%q<web_comment>`NAME)),time,json(number,firstof(get({{store}}/%q<web_comment>`AT),0)),body,json(string,get({{store}}/%q<web_comment>)),format,json(string,markdown),tag,json(string,%q<web_comment_tag>),tag_color,json(string,switch(%q<web_comment_tag>,Staff only,warning,Asked for changes,warning,Approved,success,Waitlisted,info,default)))]
        flags: [funsyntax]

        flags: [funsyntax]
      # %0 keys: a table row for each, every list's columns in one.
      WEB`ROWS:
        value: |-
          u(%!/WEB`ARR,iter(%0,u(%!/WEB`ROW,%i0,#@),%b,%r))
        flags: [funsyntax]
      WEB`ROW:
        value: |-
          setqm(web_row_state,get({{store}}/APP`%0`STATE),
          web_row_round,default({{store}}/APP`%0`ROUND,0),
          web_row_changed,if(gt(%q<web_row_round>,1),words(u(%!/FUN`APP`CHANGED,%0,dec(%q<web_row_round>),%q<web_row_round>))))[json(object,key,json(string,%0),place,json(string,%1),name,json(string,u(%!/FUN`APP`NAME,%0)),state,json(string,u(%!/FUN`STATE`LABEL,%q<web_row_state>)),state_color,json(string,u(%!/WEB`COLOR,%q<web_row_state>)),round,json(string,%q<web_row_round>),waiting,json(string,u(%!/FUN`DISPLAY`DURATION,sub(secs(),default({{store}}/APP`%0`SUBMITTED,secs())))),changed,json(string,if(strlen(%q<web_row_changed>),%q<web_row_changed> field[if(neq(%q<web_row_changed>,1),s)],new)),waitlisted,json(string,u(%!/FUN`DISPLAY`DURATION,sub(secs(),default({{store}}/APP`%0`WAITLISTED,secs())))),started,json(string,u(%!/FUN`DISPLAY`AGO,get({{store}}/APP`%0`CREATED))),decided,json(string,u(%!/FUN`DISPLAY`AGO,get({{store}}/APP`%0`DECIDED))),by,json(string,if(isdbref(get({{store}}/APP`%0`BY)),name(get({{store}}/APP`%0`BY)),-)))]
        flags: [funsyntax]
      # The public queue: how many wait, for how long, and the places, without names.
      WEB`DATA`PUBLIC:
        value: |-

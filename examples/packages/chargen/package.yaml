        value: |-
          gt(strlen(u(%!/WEB`GET,comment_%0)),4000)
        flags: [funsyntax]
      # Adds what is typed in each comment box (comment_<section>, comment_all), a reviewer's Staff only when
      # private_<section> is on, and tells whoever should know. Sets web_commented to how many were added.
      WEB`SAVE`COMMENTS:
        value: |-
          think setq(web_boxes,squish(iter(lcstr(u(%!/FUN`FORM`SECTIONS)) all,if(strlen(trim(u(%!/WEB`GET,comment_%i0))),%i0)))); think setq(web_long,iter(filterbool(%!/WEB`BOX`LONG,%q<web_boxes>),[json(string,comment_%i0)]:[json(string,Keep a comment to 4000 characters.)],%b,%r)); @assert not(strlen(%q<web_long>))=think setq(out,u(%!/WEB`ERRS,%q<web_long>)); think setq(web_commented,words(%q<web_boxes>)); @dolist/inline %q<web_boxes>={@include/args %!/INC`DO`COMMENT=section,if(comp(##,all),ucstr(##)),author,%q<viewer_objid>,text,trim(u(%!/WEB`GET,comment_##)),private,cand(%q<viewer_staff>,u(%!/WEB`ON,private_##)),kind,comment}; @if %q<web_commented>={@if strmatch(%q<app_objid>,%q<viewer_objid>)={@if strmatch(%q<app_state>,submitted)={@include/args %!/INC`DO`TELLSTAFF=text,[name(%q<viewer_objid>)] commented on their application. +app [name(%q<viewer_objid>)] reads it.}},{@if words(squish(iter(%q<web_boxes>,if(u(%!/WEB`ON,private_%i0),,%i0))))={@include/args %!/INC`DO`TELL=who,%q<app_objid>,subject,Your application,text,[name(%q<viewer_objid>)] commented on your application. +app shows it.}}}
        flags: [cmdsyntax]
      # Save draft: the fields and any comments.
      # Stops an action only the applicant may take on someone else's application.
      WEB`NEED`MINE:
        value: |-
          @assert strmatch(%q<app_key>,%q<viewer_key>)=think setq(out,u(%!/WEB`ERR,Only the applicant can do that.))
        flags: [cmdsyntax]
      WEB`ACT`SAVE:
        value: |-
          @include %!/WEB`NEED`APP; @include %!/WEB`NEED`MINE; @include %!/WEB`NEED`EDITABLE; @include %!/WEB`SAVE`FIELDS; @include %!/WEB`SAVE`COMMENTS; think setq(out,u(%!/WEB`DONE,Saved.))
        flags: [cmdsyntax]
      WEB`NEED`EDITABLE:
        value: |-
          @assert u(%!/FUN`STATE`EDITABLE,%q<app_state>)=think setq(out,u(%!/WEB`ERR,switch(%q<app_state>,submitted,Staff have your application. Withdraw takes it back to change it.,Your application is approved. There is nothing to change.)))
        flags: [cmdsyntax]
      # Submit: saves, then checks the required fields are filled in and sends it to staff.
      WEB`ACT`SUBMIT:
        value: |-
          @include %!/WEB`NEED`APP; @include %!/WEB`NEED`MINE; @include %!/WEB`NEED`EDITABLE; @include %!/WEB`SAVE`FIELDS; @include %!/WEB`SAVE`COMMENTS; @include %!/INC`DO`TOUCH; think setq(web_missing,iter(filterbool(%!/FUN`APP`MISSES,u(%!/FUN`FORM`ALLFIELDS),,,%q<app_key>),[json(string,field_[lcstr(%i0)])]:[json(string,Fill this in before you submit.)],%b,%r)); @assert not(strlen(%q<web_missing>))=think setq(out,u(%!/WEB`ERRS,%q<web_missing>)); @include %!/INC`DO`SUBMIT; think setq(out,u(%!/WEB`DONE,Submitted. [if(get(%!/DATA`CONFIG`SHOW-QUEUE),u(%!/FUN`QUEUE`TEXT,%q<app_key>),Staff will read it.)]))

        flags: [funsyntax]

      # ---- hooks ------------------------------------------------------------------
      # A game fills these in. Each runs as this object after the change, with the names and positions given.
      ON`SUBMIT: |-
        @@ {Runs after an application is submitted. %<character> (%0): the applicant's objid. %<round> how many times it has been submitted. Example, telling a staff channel: @cemit Staff=[name(%<character>)] submitted an application.}
      ON`RETURN: |-
        @@ {Runs after a reviewer asks for changes. %<character> (%0): the applicant's objid. %<actor> (%1): the reviewer's objid. %<message> (%2): what they asked.}
      ON`APPROVE: |-
        @@ {Runs after an application is approved, once the approved role is given; also when a waitlisted one gets its place. %<character> (%0): the applicant's objid. %<actor> (%1): the reviewer's objid. %<message> (%2): what they said, if anything. Example, sending the new character home: @tel %<character>=#123; @link %<character>=#123}
      ON`WAITLIST: |-
        @@ {Runs after an application is approved with every place taken, so it waits for one. %<character> (%0): the applicant's objid. %<actor> (%1): the reviewer's objid. %<message> (%2): what they said, if anything.}
      ON`RETIRE: |-
        @@ {Runs after an approved character is retired and loses the approved role. %<character> (%0): the character's objid. %<actor> (%1): the reviewer's objid.}

      # ---- lifecycle --------------------------------------------------------------
      # @command/add and @hook last until a restart, so STARTUP sets them on every boot.
      STARTUP:
        value: |-
          @command/add/noparse/rsnoparse +app; @hook/override/inline +app=%!,CMD`APP; @command/add/noparse/rsnoparse +apps; @hook/override/inline +apps=%!,CMD`APPS
        flags: [cmdsyntax]
      AINSTALL:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]
      AUPDATE:
        value: |-
          @trigger %!/STARTUP
        flags: [cmdsyntax]

  # Applications and the form. Inside the Chargen object, so no player can reach it, and no_command, so nothing
  # kept on it is ever matched as a command.
  - ref: store
    type: thing
    name: Chargen Store
    location: "{{chargen}}"
    flags: [no_command]
    attributes:
      # WAITS (unset until the first decision) is how long the latest decisions took, in seconds, oldest first.
      APP: |-
        Applications, one branch per character key.
      SECTION: |-
        The form's sections, one branch per key: the title, with ORDER.
      SECTION`CONCEPT: |-
        Concept
      SECTION`CONCEPT`ORDER: |-
        1
      SECTION`HISTORY: |-
        History
      SECTION`HISTORY`ORDER: |-
        2
      SECTION`PERSONALITY: |-
        Personality
      SECTION`PERSONALITY`ORDER: |-
        3
      FIELD: |-
        The form's fields, one branch per key: the label, with SECTION, TYPE, CHOICES, REQUIRED, MAX, ORDER and HELP.
      FIELD`CONCEPT: |-
        Concept
      FIELD`CONCEPT`SECTION: |-
        CONCEPT
      FIELD`CONCEPT`TYPE: |-
        text
      FIELD`CONCEPT`REQUIRED: |-
        1
      FIELD`CONCEPT`MAX: |-
        120
      FIELD`CONCEPT`ORDER: |-
        1
      FIELD`CONCEPT`HELP: |-
        Who they are, in a line.
      FIELD`ARCHETYPE: |-
        Archetype
      FIELD`ARCHETYPE`SECTION: |-
        CONCEPT
      FIELD`ARCHETYPE`TYPE: |-
        choice
      FIELD`ARCHETYPE`CHOICES: |-
        Fighter|Scholar|Rogue|Mystic
      FIELD`ARCHETYPE`REQUIRED: |-
        1
      FIELD`ARCHETYPE`ORDER: |-
        2
      FIELD`BACKGROUND: |-
        Background
      FIELD`BACKGROUND`SECTION: |-
        HISTORY
      FIELD`BACKGROUND`TYPE: |-
        long
      FIELD`BACKGROUND`REQUIRED: |-
        1
      FIELD`BACKGROUND`ORDER: |-
        1
      FIELD`BACKGROUND`HELP: |-
        Where they come from and what brought them here.
      FIELD`PERSONALITY: |-
        Personality
      FIELD`PERSONALITY`SECTION: |-
        PERSONALITY
      FIELD`PERSONALITY`TYPE: |-
        long
      FIELD`PERSONALITY`REQUIRED: |-
        0
      FIELD`PERSONALITY`ORDER: |-
        1
      FIELD`PERSONALITY`HELP: |-
        How they come across, and what they want.
      FIELD`HOOKS: |-
        Story hooks
      FIELD`HOOKS`SECTION: |-
        PERSONALITY
      FIELD`HOOKS`TYPE: |-
        long
      FIELD`HOOKS`REQUIRED: |-
        0
      FIELD`HOOKS`ORDER: |-
        2
      FIELD`HOOKS`HELP: |-
        Threads other players can pick up.

  # ---- help storage -------------------------------------------------------------------
  # A plain thing, not the WIZARD Chargen object: the librarian cannot u() a privileged object's attributes.
  # Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: chargen_help
    type: thing
    name: Chargen Help
    location: "{{chargen}}"
    attributes:
      HELP: |-
        Character applications: applying, and reviewing them.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree.
      SEE`APP`REVIEW: |-
        app settings
      SEE`APP`FORM: |-
        app settings
      SEE`APP`SETTINGS: |-
        app review|config
      HELP`APP: |-
        Before a character plays, staff read their application. You fill it in, send it, and talk it over with
        staff until they approve it.

        ## How an application moves

        - **Draft**: yours to change. Staff cannot see it until you first submit it.
        - **Submitted**: staff have it. You can still comment, and `+app/withdraw` takes it back.
        - **Needs changes**: staff sent it back with comments. Change what they asked and submit again.
        - **Approved**: done. When the game limits how many characters play at once and every place is
          taken, an approved application waits on a **waitlist** and gets the next place that opens.

        Every time you submit is a **round**. Staff see what you changed since the round before.

        ## Commands

        - `+app`: your application, with your place in the queue and the typical wait.
        - `+app/set <field>=<text>`: fill in a field. An empty text clears it.
        - `+app/write <field>`: write a long field over many lines. Send `.done` on a line by itself to save.
        - `+app/submit`: send it to staff.
        - `+app/withdraw`: take a submitted application back to change it.
        - `+app/comment <section>=<text>`: answer staff about one section; `+app/comment =<text>` about the
          whole application.
        - `+app/diff \[<round>\]`: what you changed since that round, by default the last one you submitted.
        - `+apps/queue`: how many applications are waiting and the typical wait.

        A `*` in `+app` marks a field you changed since you last submitted.

        Example:

        ```
        +app/set archetype=rogue
        ```

        Output: `\[APP\] Done: Archetype saved.`

        The web portal has the same application at /apps/chargen.
      HELP`APP`REVIEW: |-
        Reviewers hold the `softcode.chargen.review` permission, usually through the
        `application-reviewer` role.

        ## Reading

        - `+apps`: the queue, the longest waiting first, with how many fields changed since the round before.
        - `+apps/waitlist`, `+apps/all` \(every application not yet decided\), `+apps/decided`.
        - `+app <name>`: one application as last submitted. A `*` marks a field that changed since the round
          before.
        - `+app/diff <name>\[=<round>\]`: each changed field, what it said and what it says.

        Lists come in pages when they outgrow your screen, and the page is a last switch: `+apps/decided/2`.

        ## Talking it over

        - `+app/comment <name>/<section>=<text>`: a comment on one section the applicant reads;
          `+app/comment <name>=<text>` is about the whole application.
        - `+app/note <name>/<section>=<text>`: the same, for reviewers only.

        ## Deciding

        - `+app/return <name>=<what to change>`: send it back for changes.
        - `+app/approve <name>\[=<message>\]`: approve it. The character gets the approved role. With every place
          taken, it goes on the waitlist instead and is approved when a place opens.
        - `+app/retire <name>`: an approved character stops playing. They lose the role and their place goes
          to the first on the waitlist.

        Nobody decides their own application. The applicant hears each decision and each comment, by @mail
        when they are not connected.

        Example:

        ```
        +app/return Cora=Name the river in your background.
        ```

        Output: `\[APP\] Done: Returned to Cora for changes.`
      HELP`APP`FORM: |-
        The form is the game's: sections, and fields in them. Changing it takes the `config.admin` permission.
        Each answer is an attribute on the character, which only `+app` changes. What was said stays on the
        character when a field moves or goes, and a new `attribute` does not move answers already given.

        - `+apps/fields`: every section and field.
        - `+apps/section <key>=<title>`: add a section at the end, or retitle one.
        - `+apps/section/order <key>=<number>`: lower comes first.
        - `+apps/section/remove <key>`: an empty section only.
        - `+apps/field <key>=<section>/<label>`: add a text field at the end of a section, or move and relabel one.
        - `+apps/field/remove <key>`.

        A key is one word of letters, digits, `-` and `_`. Each field has options, set with
        `+apps/field/<option> <key>=<value>`; an empty value puts one back to its default:

        | Option | Value |
        |---|---|
        | `label` | what the form calls it |
        | `section` | the section it is in |
        | `type` | `text` \(a line\), `long` \(paragraphs\) or `choice` |
        | `choices` | for a choice field: the choices, split by vertical bars |
        | `required` | `yes` when it must be filled in before submitting |
        | `max` | the most characters: 200 for text and 4000 for long by default |
        | `order` | where it comes in its section |
        | `help` | a line shown under an empty field |
        | `attribute` | the attribute on the character that holds the answer: the key by default |

        Example:

        ```
        +apps/field/choices archetype=Fighter|Scholar|Rogue|Mystic
        ```

        Output: `\[APP\] Done: Archetype choices: Fighter|Scholar|Rogue|Mystic`
      HELP`APP`SETTINGS: |-
        `+config chargen` lists the settings; `+config chargen/<setting>=<value>` changes one.

        | Setting | Default | What it does |
        |---|---|---|
        | `cap` | 0 | The most characters with the approved role. 0 is no cap. |
        | `approved-role` | approved | The role approval gives. |
        | `show-queue` | yes | Applicants see their place and the typical wait, and anyone can use `+apps/queue`. |
        | `wait-sample` | 20 | How many of the latest decisions the typical wait is the middle of. |
        | `mail-offline` | yes | Applicants who are not connected hear about decisions and comments by @mail. |

        Raising the cap admits the waitlist into the new places at once.

        ## Hooks

        The Chargen object runs these attributes as itself after each change, when a game sets them:
        `` ON`SUBMIT ``, `` ON`RETURN ``, `` ON`APPROVE ``, `` ON`WAITLIST `` and `` ON`RETIRE ``. Each gets
        `%%<character>` \(%%0\), the applicant's objid; the decisions also get `%%<actor>` \(%%1\), the reviewer,
        and `%%<message>` \(%%2\).

        Example, sending each approved character to the docks:

        ```
        &ON`APPROVE Chargen=@tel %%<character>=#123; @link %%<character>=#123
        ```

        Output: nothing; the next approval runs it.

  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`CHARGEN: |-
        {{chargen_help}}

  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`CHARGEN: |-
        {{chargen}}

  # ---- portal routes ------------------------------------------------------------------
  # Routes on the HTTP handler, as children of http-handler's GET and POST verbs. The chargen-app package reads
  # /http/chargen/schema and /http/chargen/data with ?at= set to the address after /apps/chargen/, its sidebar
  # from /http/chargen/nav, and posts its buttons to /http/chargen/act. %<viewer> is the character the portal
  # signed in as. The handler must be WIZARD (the seeded one is) to @force the Chargen object, which does the
  # work so its "Set." lines never land in the response. POST`CHARGEN`ACT puts %<body> in %q<body>: a forced
  # command's arguments lose a value's outer braces.
  - ref: routes
    target: "{{$http_handler}}"
    attributes:
      GET`CHARGEN`SCHEMA: |-
        @respond/type application/json; think [uargs({{chargen}}/WEB`SCHEMA,viewer,%<viewer>,at,%q<form.at>)]
      GET`CHARGEN`DATA: |-
        @respond/type application/json; think [uargs({{chargen}}/WEB`DATA,viewer,%<viewer>,at,%q<form.at>)]
      GET`CHARGEN`NAV: |-
        @respond/type application/json; think [u({{chargen}}/WEB`NAV,%<viewer>)]
      POST`CHARGEN`ACT: |-
        think [setq(body,%<body>)]; @force {{chargen}}=@include/args/nobreak {{chargen}}/WEB`ACT=viewer,%<viewer>; @respond/type application/json; think %q<out>

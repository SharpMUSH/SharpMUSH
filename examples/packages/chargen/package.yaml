        flags: [funsyntax]
      # %0 a key, %1 its state, %2 the character's name: the decision buttons.
      WEB`DECISION:
        value: |-
          if(strmatch(%1,approved),u(%!/WEB`BTN,Retire,retire,%0,error,Retire %2? They lose the approved role and their place goes to the next on the waitlist.),[u(%!/WEB`INPUT,message,Message to the applicant,textarea,Asking for changes needs one%; approving does not.,0,4000)]%r[u(%!/WEB`BTN,Ask for changes,return,%0,warning)]%r[u(%!/WEB`BTN,Approve,approve,%0,success,Approve %2?[if(u(%!/FUN`FULL),%bEvery place is taken%, so they go on the waitlist.)])])
        flags: [funsyntax]

      # %0 the viewer, %1 queue, waitlist, all or decided: a list of applications, for a reviewer. Anyone else
      # gets the public queue.
      WEB`SCHEMA`LIST:
        value: |-
          switch(1,u(%!/FUN`IS`REVIEWER,%0),u(%!/WEB`DOC,view,u(%!/WEB`LIST`TITLE,%1),u(%!/WEB`SEC,,1,[u(%!/WEB`MD,u(%!/WEB`LIST`HINT,%1))]%r[json(object,kind,json(string,table),rows_field,json(string,rows),columns,u(%!/WEB`LIST`COLUMNS,%1),empty,json(string,u(%!/WEB`LIST`EMPTY,%1)))])),cand(strmatch(%1,queue),get(%!/DATA`CONFIG`SHOW-QUEUE)),u(%!/WEB`DOC,view,Applications,u(%!/WEB`SEC,,1,json(object,kind,json(string,keyvalue),fields,json(array,json(string,Waiting),json(string,Typical wait),json(string,Places))))),u(%!/WEB`SCHEMA`SAY,Applications,Only application reviewers see this list.))
        flags: [funsyntax]
      WEB`LIST`TITLE:
        value: |-
          switch(%0,queue,Applications waiting,waitlist,Waitlist,all,Open applications,Decided applications)
        flags: [funsyntax]
      WEB`LIST`HINT:
        value: |-
          switch(%0,queue,The longest waiting first.,waitlist,Approved while every place was taken%, first approved first. [u(%!/FUN`PLACES`TEXT)],all,Every application not yet decided%, by name.,The latest decision first.)
        flags: [funsyntax]
      WEB`LIST`EMPTY:
        value: |-
          switch(%0,queue,No applications are waiting.,waitlist,Nobody is on the waitlist.,all,There are no open applications.,No application has been decided yet.)
        flags: [funsyntax]
      # %0 a list: its columns, from DATA`WEB`COLUMN`<NAME>, each a column's JSON.
      WEB`LIST`COLUMNS:
        value: |-
          json_array(iter(switch(%0,queue,PLACE NAME ROUND WAITING CHANGED,waitlist,PLACE NAME WAITLISTED BY,all,NAME STATE ROUND STARTED,NAME STATE ROUND DECIDED BY),get(%!/DATA`WEB`COLUMN`%i0),%b,%r),%r)
        flags: [funsyntax]
      DATA`WEB`COLUMN`PLACE: |-
        {"key":"place","label":"#"}
      DATA`WEB`COLUMN`NAME: |-
        {"key":"name","label":"Name","link":"/apps/chargen/{key}"}
      DATA`WEB`COLUMN`STATE: |-
        {"key":"state","label":"State","type":"chip","color_key":"state_color"}
      DATA`WEB`COLUMN`ROUND: |-
        {"key":"round","label":"Round"}
      DATA`WEB`COLUMN`WAITING: |-
        {"key":"waiting","label":"Waiting"}
      DATA`WEB`COLUMN`CHANGED: |-
        {"key":"changed","label":"Changed"}
      DATA`WEB`COLUMN`WAITLISTED: |-
        {"key":"waitlisted","label":"Waiting"}
      DATA`WEB`COLUMN`BY: |-
        {"key":"by","label":"Decided by"}
      DATA`WEB`COLUMN`STARTED: |-
        {"key":"started","label":"Started"}
      DATA`WEB`COLUMN`DECIDED: |-
        {"key":"decided","label":"Decided"}

      # data: GET /http/chargen/data?at=<path>, for the page WEB`SCHEMA drew.
      WEB`DATA:
        value: |-
          json(object,fields,switch(1,not(strlen(%<viewer>)),u(%!/WEB`EMPTY),not(strlen(%<at>)),u(%!/WEB`DATA`APP,u(%!/FUN`KEY,%<viewer>),0,1),t(match(queue waitlist all decided,%<at>)),u(%!/WEB`DATA`LIST,%<viewer>,%<at>),strmatch(%<at>,u(%!/FUN`KEY,%<viewer>)),u(%!/WEB`DATA`APP,%<at>,0,1),cand(u(%!/FUN`IS`REVIEWER,%<viewer>),strlen(u(%!/WEB`KEY,%<at>)),get({{store}}/APP`%<at>`ROUND)),u(%!/WEB`DATA`APP,%<at>,1,0),u(%!/WEB`EMPTY)))
        flags: [funsyntax]
      # %0 a key, %1 1 for a reviewer, %2 1 for its owner: the status lines, the comments in every section, the

      # %0 typed text, %1 the field: what each option keeps, or #-1 and the reason.
      FUN`FORM`OPTION`LABEL:
        value: |-
          if(cand(strlen(%0),lte(strlen(%0),60)),%0,#-1 A label is 1 to 60 characters.)
        flags: [funsyntax]
      FUN`FORM`OPTION`SECTION:
        value: |-
          firstof(u(%!/FUN`SECTION`FIND,%0),#-1 There is no section '%0'.)
        flags: [funsyntax]
      FUN`FORM`OPTION`TYPE:
        value: |-
          if(member(text long choice,lcstr(%0)),lcstr(%0),#-1 A type is text%, long or choice.)
        flags: [funsyntax]
      FUN`FORM`OPTION`CHOICES:
        value: |-
          if(lte(strlen(%0),400),trim(iter(%0,trim(%i0),|,|),b,|),#-1 Keep the choices to 400 characters.)
        flags: [funsyntax]
      FUN`FORM`OPTION`REQUIRED:
        value: |-
          switch(lcstr(%0),yes,1,on,1,1,1,true,1,no,0,off,0,0,0,false,0,#-1 Say yes or no.)
        flags: [funsyntax]
      FUN`FORM`OPTION`MAX:
        value: |-
          if(cor(not(strlen(%0)),cand(isint(%0),gte(%0,1),lte(%0,8000))),%0,#-1 Max is a number of characters from 1 to 8000%, or nothing for the default.)
        flags: [funsyntax]
      FUN`FORM`OPTION`ORDER:
        value: |-
          if(cand(isint(%0),gte(%0,0)),%0,#-1 The order is a whole number: lower comes first.)
        flags: [funsyntax]
      FUN`FORM`OPTION`ATTRIBUTE:
        value: |-
          if(cor(not(strlen(%0)),cand(lte(strlen(%0),60),regmatch(%0,^%[A-Za-z0-9_-%]%[A-Za-z0-9_`-%]*$))),ucstr(%0),#-1 An attribute name is up to 60 letters%, digits%, -%, _ and `.)
        flags: [funsyntax]
      FUN`FORM`OPTION`HELP:
        value: |-
          if(lte(strlen(%0),200),%0,#-1 Keep help to 200 characters.)
        flags: [funsyntax]
      # +apps/field/remove <key>: the field leaves the form. What applications said in it stays with them.
      INC`APPS`FIELD`REMOVE:
        value: |-
          @include %!/INC`NEED`ADMIN; @assert strlen(setr(form_key,u(%!/FUN`FIELD`FIND,%q<cmd_argument>)))=@pemit %#=notice(APP,There is no field '%q<cmd_argument>'.,warn); think setq(form_label,get({{store}}/FIELD`%q<form_key>)); @dolist/inline SECTION TYPE CHOICES REQUIRED MAX ORDER HELP ATTRIBUTE={&FIELD`%q<form_key>`## {{store}}}; &FIELD`%q<form_key> {{store}}; @pemit %#=notice(APP,Removed the field %q<form_label>. What applications said in it stays with them.,ok)
        flags: [cmdsyntax]

      # ---- portal -----------------------------------------------------------------
      # The chargen-app package shows these at /apps/chargen. The routes on the HTTP handler (at the end) read
      # the schema, data and sidebar through u(), and run WEB`ACT here with @force, so writes run as this
      # object and their "Set." lines never reach the response. %<viewer> is the character the portal signed
      # in as; a u() function gets it as an argument. Schemas and data are JSON built with json(); lists of
      # JSON values go to WEB`ARR %r-separated, since json() never writes a line break.
      #
      # Pages, by the address after /apps/chargen/: nothing, the viewer's own application; queue, waitlist,
      # all and decided, the lists (queue alone, for someone who is not a reviewer, is the public count);
      # a key, one application, for a reviewer. Form inputs are field_<field>, comment_<section> and
      # comment_all, private_<section> and private_all (a reviewer's Staff only switch), and message.
      #
      # %0 %r-separated JSON values: a JSON array of them.
      WEB`ARR:
        value: |-
          if(strlen(%0),json_array(%0,%r),json_array())
        flags: [funsyntax]
      WEB`EMPTY:
        value: |-
          chr(123)[chr(125)]
        flags: [funsyntax]
      # %0 %r-separated "key":value pairs: a JSON object of them.
      WEB`OBJ:
        value: |-
          chr(123)[edit(%0,%r,%,)][chr(125)]
        flags: [funsyntax]
      WEB`B:
        value: |-
          json(boolean,if(%0,true,false))
        flags: [funsyntax]
      # One datum: JSON value %0, shown when %1 is true.
      WEB`V:
        value: |-
          json(object,value,if(%1,%0,json(string,)),visible,u(%!/WEB`B,%1))
        flags: [funsyntax]
      # %0 a data key, %1 a JSON value, %2 1 to show it: one "key":datum pair for WEB`OBJ.
      WEB`PAIR:
        value: |-
          json(string,%0):[u(%!/WEB`V,%1,%2)]
        flags: [funsyntax]
      # Field %0 of the posted JSON in %q<body>, unquoted; nothing when it is missing.
      WEB`GET:
        value: |-
          setq(web_got,json_query(%q<body>,get,%0))[switch(%q<web_got>,null,,"*,json_query(%q<web_got>,unescape),%q<web_got>)]
        flags: [funsyntax]
      # Posted switch %0: 1 when it is on.
      WEB`ON:
        value: |-
          t(match(true 1 yes on,lcstr(u(%!/WEB`GET,%0))))
        flags: [funsyntax]
      # A schema document: kind %0, title %1, sections %2 (%r-separated), actions object %3.
      WEB`DOC:
        value: |-
          json_fill(get(%!/DATA`WEB`DOC),/kind,%0,/title,%1,/pages/0/title,%1,/pages/0/sections,u(%!/WEB`ARR,%2),/actions,firstof(%3,u(%!/WEB`EMPTY)))
        flags: [funsyntax]
      # WEB`DOC's template: json_fill() puts the kind, title, sections and actions into it.
      DATA`WEB`DOC: |-
        {"kind":"","schema_version":1,"title":"","pages":[{"key":"main","title":"","order":1,"sections":[]}],"actions":{}}
      # A section: name %0, order %1, elements %2 (%r-separated).
      WEB`SEC:
        value: |-
          json(object,name,json(string,%0),order,json(number,%1),columns,json(number,1),elements,u(%!/WEB`ARR,%2))
        flags: [funsyntax]
      WEB`MD:
        value: |-
          json(object,kind,json(string,markdown),value,json(string,%0))
        flags: [funsyntax]
      # A button: label %0, the op it posts %1, the application's key %2 (empty for the viewer's own), colour
      # %3, a question asked first %4, the action %5 (act unless named).
      WEB`BTN:
        value: |-
          json(object,kind,json(string,button),label,json(string,%0),action,json(string,firstof(%5,act)),values,json(object,op,json(string,%1),key,json(string,%2)),color,json(string,firstof(%3,secondary)),variant,json(string,if(match(primary success,%3),filled,outlined)),confirm,json(string,%4))
        flags: [funsyntax]
      # An input: key %0, label %1, type %2, help %3, 1 when required %4, most characters %5 (0 for no limit),
      # options %6 (a JSON array, for a select).
      WEB`INPUT:
        value: |-
          json(object,kind,json(string,field),key,json(string,%0),label,json(string,%1),type,json(string,%2),help,json(string,%3),options,firstof(%6,json_array()),validation,json(object,required,u(%!/WEB`B,%4),max_length,json(number,firstof(%5,100000))))
        flags: [funsyntax]
      # %0 a field of the form: its input.
      WEB`INPUT`FIELD:
        value: |-
          setq(web_input_type,u(%!/FUN`FIELD`TYPE,%0))[u(%!/WEB`INPUT,field_[lcstr(%0)],u(%!/FUN`FIELD`LABEL,%0),switch(%q<web_input_type>,long,textarea,choice,select,text),get({{store}}/FIELD`%0`HELP),get({{store}}/FIELD`%0`REQUIRED),u(%!/FUN`FIELD`MAX,%0),if(strmatch(%q<web_input_type>,choice),u(%!/WEB`ARR,iter(get({{store}}/FIELD`%0`CHOICES),json(object,value,json(string,%i0),label,json(string,%i0)),|,%r))))]
        flags: [funsyntax]
      # %0 a section key, or empty for the whole application, %1 1 for a reviewer: the comment box, and a
      # reviewer's Staff only switch.
      WEB`INPUT`COMMENT:
        value: |-
          setq(web_box,firstof(lcstr(%0),all))[u(%!/WEB`INPUT,comment_%q<web_box>,if(%1,if(strlen(%0),Comment on this section,Comment on the whole application),if(strlen(%0),Reply to staff on this section,Message to staff)),textarea,,0,4000)][if(%1,%r[json(object,kind,json(string,field),key,json(string,private_%q<web_box>),label,json(string,Staff only),type,json(string,boolean))])]
        flags: [funsyntax]
      # %0 the rows field, %1 the text when there are none: a timeline of comments.
      WEB`TIMELINE:
        value: |-
          json(object,kind,json(string,timeline),rows_field,json(string,%0),empty,json(string,%1))
        flags: [funsyntax]
      # The act action, as JSON; submit is the same, and the portal checks required fields before it posts it.
      WEB`ACTION:
        value: |-
          get(%!/DATA`WEB`ACTION)
        flags: [funsyntax]
      DATA`WEB`ACTION: |-
        {"transport":"http","method":"POST","route":"/http/chargen/act","payload":"fields","on_success":{"reset_fields":true},"on_error":{"bind_field_errors":true}}
      WEB`ERR:
        value: |-
          json(object,ok,json(boolean,false),errors,json(object,_global,json(string,%0)))
        flags: [funsyntax]
      # %0 %r-separated "key":"message" pairs: the errors shown on those inputs.
      WEB`ERRS:
        value: |-
          json(object,ok,json(boolean,false),errors,u(%!/WEB`OBJ,%0))
        flags: [funsyntax]
      # %0 a key: a well-formed application key, or nothing.
      WEB`KEY:
        value: |-
          if(regmatch(%0,^%[0-9%]+_%[0-9%]+$),%0)
        flags: [funsyntax]
      # %0 a state: the MudBlazor colour it is shown in.
      WEB`COLOR:
        value: |-
          setq(web_tone,u(%!/FUN`STATE`TONE,%0))[switch(%q<web_tone>,muted,default,%q<web_tone>)]
        flags: [funsyntax]

      # schemas: GET /http/chargen/schema?at=<path>
      WEB`SCHEMA:
        value: |-
          switch(1,not(strlen(%<viewer>)),u(%!/WEB`SCHEMA`ANON),not(strlen(%<at>)),u(%!/WEB`SCHEMA`MINE,%<viewer>),t(match(queue waitlist all decided,%<at>)),u(%!/WEB`SCHEMA`LIST,%<viewer>,%<at>),strmatch(%<at>,u(%!/FUN`KEY,%<viewer>)),u(%!/WEB`SCHEMA`MINE,%<viewer>),u(%!/WEB`SCHEMA`APP,%<viewer>,u(%!/WEB`KEY,%<at>)))
        flags: [funsyntax]
      WEB`SCHEMA`ANON:
        value: |-
          u(%!/WEB`DOC,view,Character application,u(%!/WEB`SEC,,1,u(%!/WEB`MD,Sign in with a character to apply.)))
        flags: [funsyntax]
      # %0 a title, %1 the text: a page that only says something.
      WEB`SCHEMA`SAY:
        value: |-
          u(%!/WEB`DOC,view,%0,u(%!/WEB`SEC,,1,u(%!/WEB`MD,%1)))
        flags: [funsyntax]
      # The status lines both application pages start with; WEB`DATA`STATUS fills them in.
      WEB`STATUS:
        value: |-
          json(object,kind,json(string,keyvalue),fields,json(array,json(string,State),json(string,Submitted),json(string,Queue)))
        flags: [funsyntax]
      # %0 a key, %1 a section, %2 a round (empty for the draft): each answer, its label in bold.
      WEB`ANSWERS:
        value: |-
          iter(u(%!/FUN`FORM`FIELDS,%1),u(%!/WEB`MD,**[u(%!/FUN`FIELD`LABEL,%i0)]**%r%r[firstof(u(%!/FUN`APP`VALUE,%0,%i0,%2),_Not answered._)]),%b,%r)
        flags: [funsyntax]

      # The viewer %0's own application: a form while they may change it, the answers once staff have it.
      # Comments from staff sit under the section they are about, with a box to reply.
      WEB`SCHEMA`MINE:
        value: |-
          setqm(web_key,u(%!/FUN`KEY,%0),
          web_state,u(%!/FUN`APP`STATE,%q<web_key>),
          web_editable,u(%!/FUN`STATE`EDITABLE,%q<web_state>),
          web_open,not(match(approved waitlist,%q<web_state>)),
          web_sections,u(%!/FUN`FORM`SECTIONS))[u(%!/WEB`DOC,form,Application: [name(%0)],[u(%!/WEB`SEC,,1,[u(%!/WEB`STATUS)]%r[u(%!/WEB`MD,u(%!/WEB`HINT`MINE,%q<web_state>))])][if(words(u(%!/FUN`APP`COMMENTS,%q<web_key>,,0)),%r[u(%!/WEB`SEC,Messages,2,u(%!/WEB`TIMELINE,comments_all,))])][iter(%q<web_sections>,%r[u(%!/WEB`SEC,get({{store}}/SECTION`%i0),add(#@,2),u(%!/WEB`SECTION`MINE,%q<web_key>,%i0,%q<web_editable>,%q<web_open>))])][if(%q<web_open>,%r[u(%!/WEB`SEC,,90,[u(%!/WEB`INPUT`COMMENT,,0)][if(%q<web_editable>,%r[u(%!/WEB`BTN,Save draft,save)],[if(hasattr({{store}},APP`%q<web_key>),%r[u(%!/WEB`BTN,Send,comment,,primary)])][if(strmatch(%q<web_state>,submitted),%r[u(%!/WEB`BTN,Withdraw,withdraw,,warning,Take your application back from staff to change it? You submit it again when you are done.)])])])])],if(%q<web_editable>,json(object,act,u(%!/WEB`ACTION),submit,u(%!/WEB`ACTION)),json(object,act,u(%!/WEB`ACTION))))]
        flags: [funsyntax]
      # %0 a state: what to do next, on the viewer's own page.
      WEB`HINT`MINE:
        value: |-
          switch(firstof(%0,draft),submitted,Staff have your application. Withdraw takes it back if you want to change something.,approved,Your application is approved.,waitlist,Your application is approved. Every place is taken%, so you get one when it opens.,changes,Staff asked for changes: their comments are under the sections they are about. Change what they asked%, then Submit.,retired,This character was retired. Change what you like and Submit to apply again.,Fill in the form. Save draft keeps it without sending it%; Submit sends it to staff.)
        flags: [funsyntax]
      # %0 a key, %1 a section, %2 1 while it may be changed, %3 1 while it is open: the section's elements on
      # its owner's page.
      WEB`SECTION`MINE:
        value: |-
          setq(web_section_comments,words(u(%!/FUN`APP`COMMENTS,%0,%1,0)))[if(%2,iter(u(%!/FUN`FORM`FIELDS,%1),u(%!/WEB`INPUT`FIELD,%i0),%b,%r),u(%!/WEB`ANSWERS,%0,%1,))][if(%q<web_section_comments>,%r[u(%!/WEB`TIMELINE,comments_[lcstr(%1)],)][if(%3,%r[u(%!/WEB`INPUT`COMMENT,%1,0)])])]
        flags: [funsyntax]

      # One application, key %1, for reviewer %0: the last submission section by section, what changed since
      # the one before, the comments with a box under each, and the decision.
      WEB`SCHEMA`APP:
        value: |-
          switch(0,u(%!/FUN`IS`REVIEWER,%0),u(%!/WEB`SCHEMA`SAY,Character application,Only application reviewers can read other applications.),cand(strlen(%1),hasattr({{store}},APP`%1),get({{store}}/APP`%1`ROUND)),u(%!/WEB`SCHEMA`SAY,Character application,There is no such application.),u(%!/WEB`SCHEMA`APP`SEEN,%0,%1))
        flags: [funsyntax]
      WEB`SCHEMA`APP`SEEN:
        value: |-
          setqm(web_state,u(%!/FUN`APP`STATE,%1),
          web_round,default({{store}}/APP`%1`ROUND,0),
          web_source,if(%q<web_round>,%q<web_round>),
          web_name,u(%!/FUN`APP`NAME,%1))[u(%!/WEB`DOC,form,Application: %q<web_name>,[u(%!/WEB`SEC,,1,[u(%!/WEB`STATUS)]%r[u(%!/WEB`MD,u(%!/WEB`HINT`STAFF,%q<web_state>,%q<web_round>))])]%r[u(%!/WEB`SEC,Messages,2,[u(%!/WEB`TIMELINE,comments_all,No messages yet.)]%r[u(%!/WEB`INPUT`COMMENT,,1)]%r[u(%!/WEB`BTN,Comment,comment,%1)])][iter(u(%!/FUN`FORM`SECTIONS),%r[u(%!/WEB`SEC,get({{store}}/SECTION`%i0),add(#@,2),u(%!/WEB`SECTION`STAFF,%1,%i0,%q<web_source>,%q<web_round>))])][if(match(submitted approved,%q<web_state>),%r[u(%!/WEB`SEC,Decision,90,u(%!/WEB`DECISION,%1,%q<web_state>,%q<web_name>))])],json(object,act,u(%!/WEB`ACTION)))]
        flags: [funsyntax]
      # %0 a state, %1 its round: what the reviewer reads first.
      WEB`HINT`STAFF:
        value: |-
          switch(%0,submitted,if(gt(%1,1),This is round %1. Each section shows what changed since round [dec(%1)].,This is the first submission.) Comments go to the applicant unless you switch on Staff only.,changes,Returned for changes. You see what was last submitted.,draft,Not submitted. You see the draft.,u(%!/FUN`STATE`LABEL,%0).)
        flags: [funsyntax]
      # %0 a key, %1 a section, %2 the round shown, %3 the last round: the section's elements for a reviewer.

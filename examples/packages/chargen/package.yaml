format: 1
package: chargen
version: 1.0.1
authors: [SharpMUSH]
description: "Example Dynamic Application (Area 21) — a character-application form served as a Portal Schema Document over the HTTP verb routers."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [http, portal, application, form, chargen]
requires_server: ">=0.1"

# Requires the verb routers — its GET`*/POST`* routes are backtick children of the
# GET/POST verbs that http-handler provides.
depends:
  - package: http-handler
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH-Packages
      path: http-handler/

objects:
  - ref: handler
    target: "{{$http_handler}}"
    attributes:
      # ── Routes (children of http-handler's GET/POST verbs) ───────────────
      # GET /http/chargen/schema — the form schema the portal renders, read from DATA`CHARGEN`SCHEMA.
      GET`CHARGEN`SCHEMA: |-
        @respond/type application/json; think v(DATA`CHARGEN`SCHEMA)
      # The form, as JSON: v() returns it without evaluating it, so the whole schema is one function call.
      DATA`CHARGEN`SCHEMA: |-
        {"kind":"form","schema_version":1,"title":"Character Application","pages":[{"key":"main","title":"Application","order":1,"sections":[{"name":"About","order":1,"elements":[{"kind":"field","key":"charname","label":"Character Name","type":"text","validation":{"required":true,"max_length":60}},{"kind":"field","key":"concept","label":"Concept","type":"text"},{"kind":"field","key":"class","label":"Class","type":"select","options":[{"value":"fighter","label":"Fighter"},{"value":"wizard","label":"Wizard"},{"value":"rogue","label":"Rogue"}]},{"kind":"field","key":"background","label":"Background","type":"mstring"}]}]}],"actions":{"submit":{"transport":"http","method":"POST","route":"/http/chargen/submit","payload":"fields","on_success":{"toast":"Application submitted!"},"on_error":{"bind_field_errors":true}}}}

      # POST /http/chargen/submit — validate and acknowledge. %1 = posted field JSON.
      # Demonstration: requires a non-empty character name, returns the structured envelope.
      POST`CHARGEN`SUBMIT: |-
        @respond/type application/json; think firstof(if(not(t(edit(json_query(%1,get,charname),",))),json(object,ok,json(boolean,false),errors,json(object,charname,json(string,A character name is required.)))),json(object,ok,json(boolean,true),message,json(string,Application received. Staff will review it.),redirect,json(string,/characters)))

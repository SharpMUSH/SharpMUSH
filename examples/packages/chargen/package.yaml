        flags: [cmdsyntax]
      WEB`ACT`COMMENT:
        value: |-
          @include %!/WEB`NEED`APP; @assert hasattr({{store}},APP`%q<app_key>)=think setq(out,u(%!/WEB`ERR,Start your application first.)); @include %!/WEB`SAVE`COMMENTS; @assert %q<web_commented>=think setq(out,u(%!/WEB`ERR,Write a comment first.)); think setq(out,u(%!/WEB`DONE,Comment added.))
        flags: [cmdsyntax]
      WEB`ACT`RETURN:
        value: |-
          @include %!/WEB`NEED`DECIDER; @assert strmatch(%q<app_state>,submitted)=think setq(out,u(%!/WEB`ERR,This application is not waiting for a decision.)); think setq(web_message,trim(u(%!/WEB`GET,message))); @assert strlen(%q<web_message>)=think setq(out,u(%!/WEB`ERRS,[json(string,message)]:[json(string,Say what to change.)])); @include %!/WEB`SAVE`COMMENTS; @include/args %!/INC`DO`RETURN=actor,%q<viewer_objid>,message,%q<web_message>; think setq(out,u(%!/WEB`DONE,Returned to [name(%q<app_objid>)] for changes.))
        flags: [cmdsyntax]
      WEB`ACT`APPROVE:
        value: |-
          @include %!/WEB`NEED`DECIDER; @assert strmatch(%q<app_state>,submitted)=think setq(out,u(%!/WEB`ERR,This application is not waiting for a decision.)); @include %!/WEB`SAVE`COMMENTS; @include/args %!/INC`DO`APPROVE=actor,%q<viewer_objid>,message,trim(u(%!/WEB`GET,message)); think setq(out,u(%!/WEB`DONE,if(strmatch(u(%!/FUN`APP`STATE,%q<app_key>),waitlist),Approved [name(%q<app_objid>)]. Every place is taken%, so they wait for one.,Approved [name(%q<app_objid>)].)))
        flags: [cmdsyntax]
      WEB`ACT`RETIRE:
        value: |-
          @include %!/WEB`NEED`DECIDER; @assert strmatch(%q<app_state>,approved)=think setq(out,u(%!/WEB`ERR,Only an approved application can be retired.)); think setq(retire_waiting,u(%!/FUN`WAITLIST)); @include/args %!/INC`DO`RETIRE=actor,%q<viewer_objid>; think setq(out,u(%!/WEB`DONE,Retired [name(%q<app_objid>)]. [u(%!/FUN`ADMITTED`TEXT,%q<retire_waiting>)][u(%!/FUN`PLACES`TEXT)]))
        flags: [cmdsyntax]

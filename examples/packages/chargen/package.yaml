          if(strlen(%3),json(object,label,json(string,%0),path,json(string,%1),icon,json(string,%2),count,json(number,%3)),json(object,label,json(string,%0),path,json(string,%1),icon,json(string,%2)))
        flags: [funsyntax]

      # actions: POST /http/chargen/act, run with @force so the writes are this object's. %q<body> is the posted
      # JSON: op (save, submit, withdraw, comment, return, approve or retire; nothing is submit, the portal's own
      # Submit button), key (the application, empty for the viewer's own) and the inputs. Each op leaves the
      # answer in %q<out>.
      WEB`ACT:
        value: |-
          think setqm(out,u(%!/WEB`ERR,Something went wrong.),web_op,lcstr(firstof(u(%!/WEB`GET,op),submit)),web_target,u(%!/WEB`GET,key)); @assert cand(strlen(%<viewer>),hastype(%<viewer>,player))=think setq(out,u(%!/WEB`ERR,Sign in with a character first.)); think setqm(viewer_objid,objid(%<viewer>),viewer_key,u(%!/FUN`KEY,%<viewer>),viewer_staff,u(%!/FUN`IS`REVIEWER,%<viewer>)); @assert match(save submit withdraw comment return approve retire,%q<web_op>)=think setq(out,u(%!/WEB`ERR,There is no such action.)); @include %!/WEB`ACT`%q<web_op>
        flags: [cmdsyntax]
      # The application the action is about: the posted key's, for a reviewer, else the viewer's own.
      WEB`NEED`APP:
        value: |-
          @if cand(strlen(%q<web_target>),comp(%q<web_target>,%q<viewer_key>))={@assert %q<viewer_staff>=think setq(out,u(%!/WEB`ERR,Only application reviewers can do that.)); @assert cand(strlen(u(%!/WEB`KEY,%q<web_target>)),hasattr({{store}},APP`%q<web_target>),get({{store}}/APP`%q<web_target>`ROUND))=think setq(out,u(%!/WEB`ERR,There is no such application.)); think setqm(app_key,%q<web_target>,app_objid,get({{store}}/APP`%q<web_target>))},{think setqm(app_key,%q<viewer_key>,app_objid,%q<viewer_objid>)}; think setq(app_state,u(%!/FUN`APP`STATE,%q<app_key>))

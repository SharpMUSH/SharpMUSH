format: 1
package: hello-ui
version: 1.0.0
kind: plugin
authors: [SharpMUSH Examples]
description: "End-to-end UI plugin (controller + IApplicationSource) shipped as a plugin package"
license: MIT
homepage: https://github.com/sharpmush/sharpmush
keywords: [plugin, dll, ui, application]

# A plugin package distributes a COMPILED C# plugin through the package manager. It carries NO softcode
# `objects:` and NO `application:` block, only the `binaries:` section below, which must include the
# plugin's plugin.json with the same id as this package. Installing it verifies each file against its
# SHA-256 and, once the administrator confirms they trust the author (allow_plugin_code), deposits the
# bytes into the installed plugins folder on the data volume (<world>.plugins/hello-ui/). The plugin
# loads at the next restart.
#
# A plugin runs ARBITRARY compiled C# in full server trust; there is no sandbox (same posture as a
# hand-dropped DLL). The SHA-256 hashes guard INTEGRITY (the bytes are what this manifest committed
# to), not trust; trust is the administrator's confirmation. A host can refuse every plugin package
# with SHARPMUSH_PLUGIN_INSTALL=false.
binaries:
  # The plugin/server contract version the DLL was built against. The installer refuses a package built
  # for a newer contract than the target server provides (checked against PluginContractVersion.Current).
  min_server_version: ">=1.0"
  files:
    # file: = a FLAT name (no path separators, no '..'). Each deposits directly into the plugin's folder.
    # sha256: = the lowercase 64-hex digest of the built bytes.
    #
    # NOTE: these hashes were computed from a local Release build of examples/plugins/hello-ui (see the
    # README). The .dll/.deps.json digests are build-environment specific — recompute them with
    # `sha256sum` after building on your machine, or let a deterministic-build CI rewrite this block
    # before tagging. The parser only validates the 64-hex SHAPE; the installer verifies the bytes match.
    - file: HelloUiPlugin.dll
      sha256: "a3a25a87d7d35612e175961657f2aa94e87c93c22f513bd424c52ebbc6975623"
    - file: HelloUiPlugin.deps.json
      sha256: "61f7e047d13b3e96b759baae88a47f36ec880901b8a98aa4bc13875403eb7c70"
    - file: plugin.json
      sha256: "5b0c85e13578c170502bd61ff14fc0d10795b1f48451dd686a0e8980dc909758"

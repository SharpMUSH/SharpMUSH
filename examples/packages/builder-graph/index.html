<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builder graph</title>
<link rel="stylesheet" href="graph.css">
<script defer src="graph.js"></script>
</head>
<body>
<header><div><small>ROOM TOPOLOGY</small><h1 id="title">Builder graph</h1></div><div class="actions"><button id="refresh">Refresh</button><button id="fit">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></div></header>
<p id="status" role="status">Waiting for instance configuration…</p>
<main><svg id="graph" role="img" aria-label="Directed room graph" viewBox="0 0 900 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8195aa"/></marker></defs><g id="drawing"/></svg><aside><h2>Selection</h2><p id="selection">Select a room to inspect its exits.</p><ul id="exits"></ul></aside></main>
<footer>Layout is temporary. Graph reads never run destination softcode.</footer>
</body></html>

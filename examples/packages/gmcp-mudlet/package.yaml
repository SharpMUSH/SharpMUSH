format: "1.16"
package: gmcp-mudlet
title: "GMCP for Mudlet"
version: 1.0.1
authors: [SharpMUSH]
description: "A gmcp add-on for Mudlet: offers Mudlet an interface and the game's map over GMCP (Client.GUI and Client.Map), answers its Discord rich presence (External.Discord.Info and Status), and gives players +gui on and +gui off."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [gmcp, mudlet, gui, discord]
category: MUD clients
requires_server: ">=0.1"

# An add-on to gmcp, which sends the standard modules every MUD client reads (Room, Comm, Char.Items, Char).
# This package adds only what is Mudlet's own, so a game whose players use other clients leaves it out.
depends:
  - package: gmcp
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/gmcp/
      branch: main

# The shapes are Mudlet's, as TelnetNegotiationCore's ClientGui, ClientMap, DiscordInfo and
# DiscordStatus types write them:
#
#   Client.GUI               {"version":"1.0","url":"https://example.org/game.mpackage"}
#   Client.Map               {"url":"https://example.org/game.xml"}
#   External.Discord.Info    {"inviteurl":"https://discord.gg/abc","applicationid":"1234"}
#   External.Discord.Status  {"game":"My Game","details":"Playing Wren","starttime":1792000000}
#
# When they are sent, all from SOCKET`GMCP (what the client says) and PLAYER`CONNECT:
#
#   - Core.Hello, the first thing Mudlet says: Client.Map. Client.GUI too when a player is already logged
#     in on that connection and has not turned +gui off.
#   - PLAYER`CONNECT: Client.GUI, unless the player turned it off, and External.Discord.Status. Mudlet
#     says Core.Hello before anyone logs in, so this is where a player's +gui off is honoured.
#   - External.Discord.Hello: External.Discord.Info and Status. External.Discord.Get: Status.
#
# The interface is the one gui-url names or, while that is empty, the one the server ships at
# <mud_url>/mudlet/sharpmush-ui.mpackage (SharpMUSH.Server/Mudlet). The gui setting turns both off.
# Any other URL or id the settings leave empty is not sent. The Discord packages go through
# oob(..., supported). Client.GUI and Client.Map do not: Mudlet never lists Client in Core.Supports,
# and the script that would add it lives in the very interface being offered (see README.md).
#
# Two objects: the Mudlet Client, in the master room, carries +gui, the settings, the help and the
# functions that build and send each package. It holds Send_OOB, which lets oob() reach a connection
# that is not its own, and nothing more. The event handler carries two thin handlers that call it.
objects:
  - ref: handler
    target: "{{$event_handler}}"
    attributes:
      # package is what the client sent; player is whoever is logged in on the descriptor, or nothing.
      SOCKET`GMCP`GMCPMUDLET: |-
        @assert match(Core.Hello External.Discord.Hello External.Discord.Get,%<package>); think u({{client}}/FUN`HEARD`[ucstr(edit(%<package>,.,`))],%<descriptor>,%<player>)
      PLAYER`CONNECT`GMCPMUDLET: |-
        think u({{client}}/FUN`CONNECTED,%<descriptor>,%<objid>)

  - ref: client
    type: thing
    name: Mudlet Client
    location: "{{$master_room}}"
    powers: [Send_OOB]
    attributes:
      # ── Settings: +config gmcp-mudlet ───────────────────────────────────
      DATA`CONFIG:
        value: |-
          What the game offers Mudlet: its interface, its map and its Discord.
        flags: [no_command]
      DATA`CONFIG`LABEL: |-
        Mudlet client
      DATA`CONFIG`GUI: |-
        1
      DATA`CONFIG`GUI`TYPE: |-
        boolean
      DATA`CONFIG`GUI`DEFAULT: |-
        1
      DATA`CONFIG`GUI`DESCRIPTION: |-
        Whether Mudlet is offered an interface at all: the one gui-url names, or the one the server ships when gui-url is empty.
      DATA`CONFIG`GUI`LABEL: |-
        Offer an interface
      DATA`CONFIG`GUI`EXAMPLE: |-
        off
      DATA`CONFIG`GUI-URL: ""
      DATA`CONFIG`GUI-URL`TYPE: |-
        text
      DATA`CONFIG`GUI-URL`DEFAULT: ""
      DATA`CONFIG`GUI-URL`PATTERN: |-
        ^(https?://\S+)?$
      DATA`CONFIG`GUI-URL`DESCRIPTION: |-
        Where Mudlet downloads the game's own interface package (.mpackage), offered with Client.GUI. Empty offers the interface the server ships, from mud_url.
      DATA`CONFIG`GUI-URL`LABEL: |-
        Interface package
      DATA`CONFIG`GUI-URL`EXAMPLE: |-
        https://example.org/game.mpackage
      DATA`CONFIG`GUI-VERSION: |-
        1.0
      DATA`CONFIG`GUI-VERSION`TYPE: |-
        text
      DATA`CONFIG`GUI-VERSION`DEFAULT: |-
        1.0
      DATA`CONFIG`GUI-VERSION`MIN: |-
        1
      DATA`CONFIG`GUI-VERSION`MAX: |-
        20
      DATA`CONFIG`GUI-VERSION`DESCRIPTION: |-
        The version of the package gui-url names. Mudlet installs it again when this changes, so change it with each new package. The server's own interface carries its own version.
      DATA`CONFIG`GUI-VERSION`LABEL: |-
        Interface version
      DATA`CONFIG`GUI-VERSION`EXAMPLE: |-
        1.1
      DATA`CONFIG`MAP-URL: ""
      DATA`CONFIG`MAP-URL`TYPE: |-
        text
      DATA`CONFIG`MAP-URL`DEFAULT: ""
      DATA`CONFIG`MAP-URL`PATTERN: |-
        ^(https?://\S+)?$
      DATA`CONFIG`MAP-URL`DESCRIPTION: |-
        Where Mudlet downloads the game's map, offered with Client.Map. Empty offers none.
      DATA`CONFIG`MAP-URL`LABEL: |-
        Map
      DATA`CONFIG`MAP-URL`EXAMPLE: |-
        https://example.org/game-map.xml
      DATA`CONFIG`DISCORD-INVITE: ""
      DATA`CONFIG`DISCORD-INVITE`TYPE: |-
        text
      DATA`CONFIG`DISCORD-INVITE`DEFAULT: ""
      DATA`CONFIG`DISCORD-INVITE`PATTERN: |-
        ^(https://\S+)?$
      DATA`CONFIG`DISCORD-INVITE`DESCRIPTION: |-
        An invite to the game's Discord server, which Mudlet shows beside its rich presence. Empty sends none.
      DATA`CONFIG`DISCORD-INVITE`LABEL: |-
        Discord invite
      DATA`CONFIG`DISCORD-INVITE`EXAMPLE: |-
        https://discord.gg/abcdef
      DATA`CONFIG`DISCORD-APPLICATION: ""
      DATA`CONFIG`DISCORD-APPLICATION`TYPE: |-
        text
      DATA`CONFIG`DISCORD-APPLICATION`DEFAULT: ""
      DATA`CONFIG`DISCORD-APPLICATION`PATTERN: |-
        ^[0-9]*$
      DATA`CONFIG`DISCORD-APPLICATION`DESCRIPTION: |-
        The id of the game's own Discord application, whose name and icons Mudlet then shows. Empty uses Mudlet's.
      DATA`CONFIG`DISCORD-APPLICATION`LABEL: |-
        Discord application
      DATA`CONFIG`DISCORD-APPLICATION`EXAMPLE: |-
        123456789012345678
      DATA`CONFIG`DISCORD-GAME: ""
      DATA`CONFIG`DISCORD-GAME`TYPE: |-
        text
      DATA`CONFIG`DISCORD-GAME`DEFAULT: ""
      DATA`CONFIG`DISCORD-GAME`MAX: |-
        60
      DATA`CONFIG`DISCORD-GAME`DESCRIPTION: |-
        The game's name in a player's Discord status. Empty uses the game's name.
      DATA`CONFIG`DISCORD-GAME`LABEL: |-
        Discord game name
      DATA`CONFIG`DISCORD-GAME`EXAMPLE: |-
        Coast of Ash
      DATA`CONFIG`DISCORD-CHARACTER: |-
        1
      DATA`CONFIG`DISCORD-CHARACTER`TYPE: |-
        boolean
      DATA`CONFIG`DISCORD-CHARACTER`DEFAULT: |-
        1
      DATA`CONFIG`DISCORD-CHARACTER`DESCRIPTION: |-
        Whether a player's Discord status names the character they play.
      DATA`CONFIG`DISCORD-CHARACTER`LABEL: |-
        Name the character
      DATA`CONFIG`DISCORD-CHARACTER`EXAMPLE: |-
        off
      # Players who turned +gui off: one leaf per player, keyed by objid.
      DATA`GUI-OFF:
        value: |-
          Players who turned +gui off, one leaf per objid.
        flags: [no_command]

      # ── Commands ─────────────────────────────────────────────────────────
      CMD`GUI: |-
        $+gui:@pemit %#=u(%!/FUN`DISPLAY`STATUS,%#)
      CMD`GUI`SWITCH: |-
        $+gui *:@assert match(on off,%0)=@pemit %#=notice(GUI,+gui on offers you the game's interface when you connect%, +gui off stops it.,warn); @include %!/INC`GUI`[ucstr(%0)]
      INC`GUI`ON: |-
        @assert strlen(u(%!/FUN`GUI`URL))=@pemit %#=notice(GUI,This game has no interface package for Mudlet.,warn); &DATA`GUI-OFF`[u(%!/FUN`DATA`KEY,%#)] %!; @pemit %#=notice(GUI,u(%!/FUN`TEXT`ON,u(%!/FUN`SEND`GUI,%#)),ok)
      INC`GUI`OFF: |-
        &DATA`GUI-OFF`[u(%!/FUN`DATA`KEY,%#)] %!=1; @pemit %#=notice(GUI,Your client will not be offered the game's interface when you connect. +gui on offers it again.,ok)

      # ── Reads ────────────────────────────────────────────────────────────
      # %0 a player: the key their choice is kept under, their objid as an attribute name (#12:345 is 12-345).
      FUN`DATA`KEY: |-
        edit(objid(%0),#,,:,-)
      # The interface offered: gui-url, or the server's own while gui-url is empty. Nothing when the gui setting is
      # off, or when the server's own is wanted and mud_url is not a web address.
      FUN`GUI`URL: |-
        if(v(DATA`CONFIG`GUI),strfirstof(v(DATA`CONFIG`GUI-URL),u(%!/FUN`GUI`SHIPPED`URL)))
      FUN`GUI`VERSION: |-
        if(strlen(v(DATA`CONFIG`GUI-URL)),v(DATA`CONFIG`GUI-VERSION),u(%!/FUN`GUI`SHIPPED`VERSION))
      # Whether the interface offered is the one the server ships.
      FUN`GUI`SHIPPED: |-
        cand(v(DATA`CONFIG`GUI),not(strlen(v(DATA`CONFIG`GUI-URL))))
      FUN`GUI`SHIPPED`URL: |-
        u(%!/FUN`GUI`SHIPPED`AT,config(mud_url))
      # %0 a web address: where its server serves the interface, with one slash between however it is written.
      FUN`GUI`SHIPPED`AT: |-
        if(regmatchi(%0,^https?://.),[regedit(%0,/+$,)]/mudlet/sharpmush-ui.mpackage)
      # The version in SharpMUSH.Server/Mudlet/config.lua; a test holds the two together.
      FUN`GUI`SHIPPED`VERSION: |-
        1.0.0
      # %0 a player: whether they want Client.GUI, and there is one to offer.
      FUN`GUI`WANTED: |-
        cand(strlen(u(%!/FUN`GUI`URL)),not(hasattr(%!,DATA`GUI-OFF`[u(%!/FUN`DATA`KEY,%0)])))
      # %0 a player: whether their client says it is a screen reader.
      FUN`CLIENT`SCREENREADER: |-
        member(terminfo(%0),screenreader)

      DATA`TEMPLATE`PAYLOAD`GUI: |-
        {"version":"","url":""}
      # ── Payloads ─────────────────────────────────────────────────────────
      FUN`PAYLOAD`GUI: |-
        json_fill(v(DATA`TEMPLATE`PAYLOAD`GUI),/version,u(%!/FUN`GUI`VERSION),/url,u(%!/FUN`GUI`URL))
      FUN`PAYLOAD`MAP: |-
        json(object,url,json(string,v(DATA`CONFIG`MAP-URL)))
      # A setting as a JSON string, or null when it is empty, so a json_mod() patch leaves it out.
      FUN`PAYLOAD`OPTIONAL: |-
        if(strlen(%0),json(string,%0),null)
      FUN`PAYLOAD`DISCORDINFO: |-
        json_mod(json(object),patch,json(object,inviteurl,u(%!/FUN`PAYLOAD`OPTIONAL,v(DATA`CONFIG`DISCORD-INVITE)),applicationid,u(%!/FUN`PAYLOAD`OPTIONAL,v(DATA`CONFIG`DISCORD-APPLICATION))))
      # %0 the player, or nothing before login: the game, and once someone plays, who and since when.
      FUN`PAYLOAD`DISCORDSTATUS: |-
        json_mod(json(object,game,json(string,strfirstof(v(DATA`CONFIG`DISCORD-GAME),mudname()))),patch,json(object,details,u(%!/FUN`PAYLOAD`OPTIONAL,if(cand(strlen(%0),v(DATA`CONFIG`DISCORD-CHARACTER)),Playing [name(%0)])),starttime,if(strlen(%0),json(number,sub(secs(),trunc(conn(%0)))),null)))

      # ── Sending ──────────────────────────────────────────────────────────
      # Each takes %0 where to send (a player or a descriptor) and returns how many connections took it.
      FUN`SEND`GUI: |-
        oob(%0,Client.GUI,u(%!/FUN`PAYLOAD`GUI))
      FUN`SEND`MAP: |-
        if(strlen(v(DATA`CONFIG`MAP-URL)),oob(%0,Client.Map,u(%!/FUN`PAYLOAD`MAP)),0)
      FUN`SEND`DISCORDINFO: |-
        oob(%0,External.Discord.Info,u(%!/FUN`PAYLOAD`DISCORDINFO),supported)
      # %1 the player, or nothing.
      FUN`SEND`DISCORDSTATUS: |-
        oob(%0,External.Discord.Status,u(%!/FUN`PAYLOAD`DISCORDSTATUS,%1),supported)

      # ── What the client said, and connecting ─────────────────────────────
      # Each takes %0 the descriptor and %1 the player logged in on it, or nothing. null() keeps oob()'s
      # counts out of the event handler's output.
      FUN`HEARD`CORE`HELLO: |-
        null(u(%!/FUN`SEND`MAP,%0))[if(cand(strlen(%1),u(%!/FUN`GUI`WANTED,%1)),null(u(%!/FUN`SEND`GUI,%0)))]
      FUN`HEARD`EXTERNAL`DISCORD`HELLO: |-
        null(u(%!/FUN`SEND`DISCORDINFO,%0))[null(u(%!/FUN`SEND`DISCORDSTATUS,%0,%1))]
      FUN`HEARD`EXTERNAL`DISCORD`GET: |-
        null(u(%!/FUN`SEND`DISCORDSTATUS,%0,%1))
      FUN`CONNECTED: |-
        if(u(%!/FUN`GUI`WANTED,%1),null(u(%!/FUN`SEND`GUI,%0)))[null(u(%!/FUN`SEND`DISCORDSTATUS,%0,%1))]

      # ── Screens ──────────────────────────────────────────────────────────
      # %0 how many connections took the interface just now.
      FUN`TEXT`ON: |-
        Your client will be offered the game's interface when you connect.[if(%0,%bIt was offered just now.,%bNone of your connections takes GMCP now%, so it will be offered next time.)]
      # +gui: %0 the player. A screen reader is told in two sentences; anyone else sees the fields, and
      # the package's URL on a line of its own below them, where it copies whole.
      FUN`DISPLAY`STATUS: |-
        if(strlen(u(%!/FUN`GUI`URL)),if(u(%!/FUN`CLIENT`SCREENREADER,%0),u(%!/FUN`DISPLAY`PLAIN,%0),u(%!/FUN`DISPLAY`BOX,%0)),notice(GUI,This game has no interface package for Mudlet.))
      FUN`DISPLAY`PLAIN: |-
        The game's interface for Mudlet is [if(u(%!/FUN`GUI`SHIPPED),the one SharpMUSH ships%,,its own%,)] version [u(%!/FUN`GUI`VERSION)], at [u(%!/FUN`GUI`URL)]. [if(u(%!/FUN`GUI`WANTED,%0),It is offered to you when you connect. +gui off stops that.,You turned it off. +gui on offers it again.)]
      FUN`DISPLAY`BOX: |-
        box(fields(,Interface,if(u(%!/FUN`GUI`SHIPPED),SharpMUSH's own,the game's own),Version,u(%!/FUN`GUI`VERSION),Offered,if(u(%!/FUN`GUI`WANTED,%0),tone(success,when you connect),tone(muted,no%, you turned it off)),Map,strfirstof(v(DATA`CONFIG`MAP-URL),tone(muted,none)))%r[rule()]%r[tone(muted,+gui on and +gui off choose whether it is offered.)],Mudlet interface)%rPackage: [u(%!/FUN`GUI`URL)]

      # ---- help -----------------------------------------------------------
      HELP: |-
        Mudlet: the game's own interface, its map and Discord.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`GUI: |-
        gmcp|gmcp room|gmcp char|gmcp comm
      HELP`GUI: |-
        `+gui` shows whether the game offers **Mudlet** an interface package: windows, gauges and a map drawn from what the game sends over GMCP. A game that has not made one of its own offers the one SharpMUSH ships.

        - `+gui on` offers it to your client each time you connect, and offers it now. This is how it starts.
        - `+gui off` stops offering it. An interface Mudlet already installed stays until you remove it in Mudlet's Package Manager.

        Mudlet installs the package when the game offers it, and again when its version changes, unless its preference *Allow server to install script packages* is off.

        SharpMUSH's own interface puts a panel on the right of the game's text: the room with its exits, who is here and what you carry; a gauge for each value the game sends with a maximum, such as hp; a chat window for channel lines and pages; and a map drawn as you walk. `interface hide` and `interface show`, typed in Mudlet, take the panel away and bring it back.

        The game can also send Mudlet its **map**, and fill in your **Discord** status with the game's name and the character you play: staff choose with `+config gmcp-mudlet`.
      LOCK`GUI`SETUP: |-
        perm^config.admin
      HELP`GUI`SETUP: |-
        An **interface package** is a Mudlet package (a `.mpackage` file: a zip of Lua scripts and their settings) that draws the game's own windows inside Mudlet. Mudlet downloads it from the address the game sends with `Client.GUI`, and installs it.

        With nothing set, the game offers the interface SharpMUSH ships, from `<mud_url>/mudlet/sharpmush-ui.mpackage`. It needs `mud_url` (`@config mud_url`) to be the game's web address, which setup fills in.

        To offer your own:

        1. Download the shipped one from that address, or start from nothing.
        2. Change it in Mudlet, export it from Mudlet's Package Exporter under a name of your own, and put the file on a web server.
        3. `+config gmcp-mudlet/gui-url=<address>` offers it instead, and `+config gmcp-mudlet/gui-version=<version>`, changed with each new file, makes Mudlet install it again.

        `+config gmcp-mudlet/gui=off` offers no interface. `+config gmcp-mudlet` lists every setting, the map and Discord ones too.

        The Discord settings work whether or not an interface is offered: Mudlet asks for them when it connects, and does so only while Discord is running on the player's computer.

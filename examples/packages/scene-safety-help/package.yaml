format: "1.16"
package: scene-safety-help
title: "Scene safety tools: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Scene safety tools topics into +help: registers the scene-safety package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [scene-safety, help, bridge]
category: Scenes
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. scene-safety keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: scene-safety
    version: ">=1.3"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/scene-safety/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`SAFETY: |-
        {{scene-safety/safety_help}}

  # Lines the scene-safety package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{scene-safety/safety}}"
    attributes:
      HINT`SWITCHES: |-
        +help safety lists them.

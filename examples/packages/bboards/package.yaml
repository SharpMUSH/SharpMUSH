        @assert u({{bboards}}/FUN`DRAFT`EXISTS)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,You have no draft. +bbpost <board>/<title>=<text> posts%, +bbpost <board>/<title> starts a draft.)];think [u({{bboards}}/FUN`DRAFT`LOAD)];@include {{bboards}}/INC`DRAFT`CHECK;@include {{bboards}}/INC`DO`POST;@include {{bboards}}/INC`DO`TOSS

        @assert u({{bboards}}/FUN`IS`BOARD,%q<post_board>)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,The board your draft was for is gone. +bbtoss drops the draft.)];@assert u({{bboards}}/FUN`PERM`CAN,%q<post_board>,post,%q<viewer_objid>)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`ERROR,You may not post on [name(%q<post_board>)].)];think [setq(post_rendered_text,u({{bboards}}/FUN`POST`TEXT,%q<post_source_text>,%q<post_format>))];@assert not(strlen(setr(post_text_error,u({{bboards}}/FUN`CHECK`TEXT,%q<post_source_text>,%q<post_rendered_text>,if(strmatch(%q<post_format>,mush),%q<post_source_text>)))))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,%q<post_text_error>)]

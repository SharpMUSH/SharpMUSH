        @assert strlen(%q<cmd_argument>)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,+bbcomment <post>=<text> comments. +bbreply <post>/<#>=<text> answers a comment.)];think [setq(comment_short_form,0)][u({{bboards}}/FUN`PATH`SPLITCOMMENT)];@assert not(strlen(%q<comment_path_error>))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,%q<comment_path_error>)];think [u({{bboards}}/FUN`PATH`RESOLVE,%q<comment_path>,%q<viewer_objid>)];@assert not(strlen(%q<path_error>))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,%q<path_error>)];@include {{bboards}}/INC`NEED`COMMENTABLE;think [setqm(board_current,%q<path_current>,board_short_form,%q<comment_short_form>)];@include {{bboards}}/INC`NEED`FRESHNUMBERS;@include {{bboards}}/INC`COMMENT`TEXT;think [setqm(comment_post,%q<path_post>,comment_reply_key,%q<path_comment_key>,comment_board,%q<path_current>)];@include {{bboards}}/INC`DO`COMMENT
      # Comment text %q<comment_text> as it is kept, which must be fine. Sets %q<comment_format>, %q<comment_source_text>,

format: 1.2
package: bboards
version: 1.1.0
authors: [SharpMUSH]
description: "BBoards: bulletin boards that nest, with posts, comments and replies, pinned posts and per-reader unread tracking, using the +bbread/+bbpost commands Myrddin's board players know."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [bboards, bulletin, boards, forum, myrddin]
requires_server: ">=0.1"

# plus-help carries the +help topics;
# http-handler owns the GET/POST verb routers the portal routes hang off.
depends:
  - package: plus-help
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main
  - package: http-handler
    version: ">=1.0 <2.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/http-handler/
      branch: main

# Two permissions. Who may read, post, comment on or moderate one board is that board's lock, so a
# moderator for one board is a role in its moderate lock, not a permission per board.
categories:
  roles:
    - name: BBoards
      description: Roles for the people who run the bulletin boards.
  permissions:
    - name: BBoards
      description: Running the bulletin boards.
permissions:
  - name: softcode.bboards.admin
    category: BBoards
    description: Create, configure, order, lock and remove boards, moderate every board, and read every board.
  - name: softcode.bboards.moderate
    category: BBoards
    description: Pin, close, move, edit and remove posts and comments on every board the holder can read.
roles:
  - slug: bboard-admin
    name: BBoard Admin
    category: BBoards
    priority: 12
    permissions:
      softcode.bboards.admin: allow
  - slug: bboard-moderator
    name: BBoard Moderator
    category: BBoards
    priority: 11
    permissions:
      softcode.bboards.moderate: allow

objects:
  # The command object. WIZARD because it creates and changes board and post objects, writes each
  # reader's BBOARD tree, adds the commands (@command/add, @hook) and evaluates SharpMUSH-text posts
  # as their author. Every +bb command is added with /noparse/rsnoparse and hooked to CMD`BB, so
  # what a player types reaches the code exactly as typed and nothing they wrote is evaluated,
  # except a /mush post or edit, which is evaluated once, as whoever wrote that text.
  #
  # Trees: CMD` the hooked command, INC`CMD` one per command, INC`DO` the writes, INC`NEED` guards,
  # DATA` configuration. A long command is a list of steps named after it (INC`ORDER`CHECK,
  # INC`PIN`STORE, ...); a step that only sets registers is a u()-function beside them (FUN`ORDER`PLACES).
  # Registers are named by what they hold, led by their subject: path_ (set by INC`NEED`*), cmd_
  # (the parsed command), board_, post_, comment_, reader_ and so on. FUN` reads, one branch per kind: FUN`SCREEN` whole screens, FUN`DISPLAY`
  # pieces of them, FUN`STORE` boards, posts and comments, FUN`READING` what a reader has read,
  # FUN`PATH` number paths, FUN`PERM` who may do what, FUN`LIST` list helpers. WEB` the portal's
  # routes.
  #
  # Boards are found from the store by number or name, never by a {{ref}}: only the objects below
  # have refs, and boards are made while the game runs.
  - ref: bboards
    type: thing
    name: BBoards
    flags: [WIZARD]
    attributes:
      # Configuration, one leaf per setting.
      DATA: |-
        Package settings. One leaf per setting.
      # Every +bb<word> command STARTUP adds, then hooks to CMD`BB. +bb on its own is +bbread.
      DATA`WORDS: |-
        read list next new scan post write proof toss comment reply edit remove catchup leave join notify follow unfollow search options reader newgroup cleargroup config order category parent lock writelock info pin unpin close open move timeout
      DATA`ROUTE: |-
        Which INC`CMD` routine each +bb<word> runs. One leaf per word.
      DATA`ROUTE`READ: |-
        READ
      DATA`ROUTE`LIST: |-
        LIST
      DATA`ROUTE`NEXT: |-
        NEXT
      DATA`ROUTE`NEW: |-
        NEXT
      DATA`ROUTE`SCAN: |-
        SCAN
      DATA`ROUTE`POST: |-
        POST
      DATA`ROUTE`WRITE: |-
        WRITE
      DATA`ROUTE`PROOF: |-
        PROOF
      DATA`ROUTE`TOSS: |-
        TOSS
      DATA`ROUTE`COMMENT: |-
        COMMENT
      DATA`ROUTE`REPLY: |-
        COMMENT
      DATA`ROUTE`EDIT: |-
        EDIT
      DATA`ROUTE`REMOVE: |-
        REMOVE
      DATA`ROUTE`CATCHUP: |-
        CATCHUP
      DATA`ROUTE`LEAVE: |-
        LEAVE
      DATA`ROUTE`JOIN: |-
        JOIN
      DATA`ROUTE`NOTIFY: |-
        NOTIFY
      DATA`ROUTE`FOLLOW: |-
        FOLLOW
      DATA`ROUTE`UNFOLLOW: |-
        UNFOLLOW
      DATA`ROUTE`SEARCH: |-
        SEARCH
      DATA`ROUTE`OPTIONS: |-
        OPTIONS
      DATA`ROUTE`READER: |-
        READER
      DATA`ROUTE`NEWGROUP: |-
        NEWGROUP
      DATA`ROUTE`CLEARGROUP: |-
        CLEARGROUP
      DATA`ROUTE`CONFIG: |-
        CONFIG
      DATA`ROUTE`ORDER: |-
        ORDER
      DATA`ROUTE`CATEGORY: |-
        CATEGORY
      DATA`ROUTE`PARENT: |-
        PARENT
      DATA`ROUTE`LOCK: |-
        LOCK
      DATA`ROUTE`WRITELOCK: |-
        WRITELOCK
      DATA`ROUTE`INFO: |-
        INFO
      DATA`ROUTE`PIN: |-
        PIN
      DATA`ROUTE`UNPIN: |-
        UNPIN
      DATA`ROUTE`CLOSE: |-
        CLOSE
      DATA`ROUTE`OPEN: |-
        OPEN
      DATA`ROUTE`MOVE: |-
        MOVE
      DATA`ROUTE`TIMEOUT: |-
        TIMEOUT
      # A bare [text] in a post or comment is text, not a help link; [text](url) stays a link.
      DATA`RE`BRACKET: |-
        \[([^\]\[\n]*)\](?![(\[])
      DATA`RE`BRACKETTO: |-
        \[$1\]
      # Seconds between the passes that remove timed-out posts and orphans.
      DATA`TICK: |-
        86400
      # The board hooks, each an ON`<name> attribute on every board.
      DATA`HOOKS: |-
        POST COMMENT EDIT REMOVE MOVE PIN CLOSE
      DATA`HOOKDOC: |-
        What a new board's ON` hooks start as. One leaf per hook.
      DATA`HOOKDOC`POST: |-
        @@ {Runs after a post is made on this board. %0: objid of the post. %1: objid of the author. %2: the post's number path, such as 5/1/12. %3: its title. Example, telling a channel: @cemit Public=New post on [name(me)]: %3}
      DATA`HOOKDOC`COMMENT: |-
        @@ {Runs after a comment is written on a post on this board. %0: objid of the post. %1: objid of the writer. %2: the post's number path. %3: the comment's sequence number. %4: the sequence number of the comment it answers, or empty. Example: @pemit [get(%0/BY)]=Someone commented on %2.}
      DATA`HOOKDOC`EDIT: |-
        @@ {Runs after a post or comment on this board is edited. %0: objid of the post. %1: objid of the editor. %2: empty for the post, or the comment's sequence number. Example: @cemit Staff=[name(%1)] edited a post on [name(me)].}
      DATA`HOOKDOC`REMOVE: |-
        @@ {Runs after a post or comment on this board is removed. %0: objid of the post, which may be gone. %1: objid of whoever removed it. %2: empty for the post, or the comment's sequence number. %3: the post's title. Example: @cemit Staff=[name(%1)] removed %3 from [name(me)].}
      DATA`HOOKDOC`MOVE: |-
        @@ {Runs on both boards after a post moves between them. %0: objid of the post. %1: objid of whoever moved it. %2: objid of the old board. %3: objid of the new board. Example: @pemit [get(%0/BY)]=Your post moved to [name(%3)].}
      DATA`HOOKDOC`PIN: |-
        @@ {Runs after a post on this board is pinned or unpinned. %0: objid of the post. %1: objid of whoever did it. %2: 1 when pinned, 0 when unpinned. Example: @if %2=@cemit Public=Pinned on [name(me)]: [get(%0/TITLE)]}
      DATA`HOOKDOC`CLOSE: |-
        @@ {Runs after a post on this board is closed to comments or opened again. %0: objid of the post. %1: objid of whoever did it. %2: 1 when closed, 0 when opened. Example: @if %2=@pemit [get(%0/BY)]=Your post was closed to comments.}
      # Theme colour names a board colour may not be, since tone() is not in this server yet. Kept so a
      # later version can accept them.
      DATA`ROLES: |-
        foreground primary secondary tertiary muted success warning error info
      # Every +bb<word> command. %1 the word, %2 the switches, %3 what follows, all exactly as typed.
      CMD`BB:
        value: |-
          $(?is)^\+bb([a-z]*)(/\S*)?(?\: +(.*))?$:think [u({{bboards}}/FUN`COMMAND`PARSE,%1,%2,%3)];@assert strlen(%q<cmd_route>)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,There is no +bb[lcstr(%1)] command. +help bboards lists them.)];@include/nobreak {{bboards}}/INC`DO`FIRSTUSE;@include {{bboards}}/INC`CMD`%q<cmd_route>
        flags: [REGEXP]
      # %0 word, %1 switches, %2 argument, all raw. Sets %q<cmd_word> the word, %q<cmd_route>, %q<cmd_switch_list> every
      # switch but a page, %q<page_number> a last switch of digits (+bbread/2 5/3), %q<cmd_format_switch> md or mush when
      # a format switch was given, %q<cmd_switch> the first other switch, %q<cmd_argument>, %q<cmd_has_equals> (1 when there was an
      # =), %q<cmd_left_side> and %q<cmd_right_side> around the first =, and %q<viewer_objid> the actor's objid.
      FUN`COMMAND`PARSE: |-
        [setqm(cmd_word,lcstr(%0),cmd_route,if(strlen(%q<cmd_word>),get(%!/DATA`ROUTE`%q<cmd_word>),READ),cmd_switch_list,lcstr(trim(edit(%1,/,%b))),page_number,if(isint(last(%q<cmd_switch_list>)),last(%q<cmd_switch_list>)))][if(strlen(%q<page_number>),setq(cmd_switch_list,ldelete(%q<cmd_switch_list>,words(%q<cmd_switch_list>))))][setqm(cmd_format_switch,switch(1,t(member(%q<cmd_switch_list>,mush)),mush,t(member(%q<cmd_switch_list>,md)),md,t(member(%q<cmd_switch_list>,markdown)),md,),cmd_switch,first(squish(iter(%q<cmd_switch_list>,if(t(member(md markdown mush,%i0)),,%i0)))),cmd_argument,trim(%2),cmd_has_equals,strmatch(%2,*=*),cmd_left_side,trim(before(%2,=)),cmd_right_side,trim(after(%2,=)),viewer_objid,objid(%#),reader_holder,u(%!/FUN`READING`HOLDER,%q<viewer_objid>),message_target,%#)]
      # Each message also lands in %q<said> and %q<said_how>, which is how the portal's routes learn what a
      # command they ran said: it went to %q<message_target>, the bboards object itself, and nobody saw it.
      FUN`MESSAGE`OK: |-
        [setqm(said,%0,said_how,ok)][notice(BBOARDS,%0,ok)]
      FUN`MESSAGE`WARNING: |-
        [setqm(said,%0,said_how,warn)][notice(BBOARDS,%0,warn)]
      FUN`MESSAGE`ERROR: |-
        [setqm(said,%0,said_how,error)][notice(BBOARDS,%0,error)]
      FUN`MESSAGE`INFO: |-
        [setqm(said,%0,said_how,info)][notice(BBOARDS,%0)]
      # Commands added with @command/add and their hooks last until a restart, so STARTUP sets them on
      # every boot. /noparse and /rsnoparse hand the hook the text as typed; /inline runs it in place.
      STARTUP: |-
        @command/add/noparse/rsnoparse +bb;@hook/override/inline +bb={{bboards}},CMD`BB;@dolist/inline [get({{bboards}}/DATA`WORDS)]={@command/add/noparse/rsnoparse +bb%i0; @hook/override/inline +bb%i0={{bboards}},CMD`BB};&TICK`ID {{bboards}}=[secs()][rand(100000)];@trigger {{bboards}}/TICK=[get({{bboards}}/TICK`ID)]
      # Runs once, on first install, as God: puts the commands in the master room, protects every
      # character's BBOARD tree (only wizards write it, anyone reads it), makes the starting boards and
      # their locks, and starts the commands.
      AINSTALL: |-
        @teleport {{bboards}}=#2;@attribute/access BBOARD=wizard no_command;@include {{bboards}}/INC`SEED;@trigger {{bboards}}/STARTUP
      # The starting boards. Two categories at the top; Public holds two boards of its own.
      INC`SEED: |-
        think [setq(board_parent,{{store}})];@include {{bboards}}/INC`SEED`CATEGORIES;@include {{bboards}}/INC`SEED`OFFICIAL;@include {{bboards}}/INC`SEED`COMMUNITY;@include {{bboards}}/INC`SEED`PUBLIC
      # Makes the Official and Community categories. Sets %q<seed_official_category> and %q<seed_community_category>.
      INC`SEED`CATEGORIES: |-
        think [setq(category_new_name,Official)]; @include {{bboards}}/INC`DO`NEWCATEGORY; think [setq(seed_official_category,%q<category_new_id>)];think [setq(category_new_name,Community)]; @include {{bboards}}/INC`DO`NEWCATEGORY; think [setq(seed_community_category,%q<category_new_id>)]
      # Makes Announcements, Policy and Staff in %q<seed_official_category>, each with its locks and description.
      INC`SEED`OFFICIAL: |-
        think [setqm(board_new_category,%q<seed_official_category>,board_new_name,Announcements)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbpost %q<board_new_object>=perm^softcode.bboards.admin;&DESCRIBE %q<board_new_object>=News from staff.;think [setq(board_new_name,Policy)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbpost %q<board_new_object>=perm^softcode.bboards.admin;@lock/user:bbcomment %q<board_new_object>=#false;&DESCRIBE %q<board_new_object>=The game's rules and policies.;think [setq(board_new_name,Staff)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbread %q<board_new_object>=role^wizard|perm^softcode.bboards.admin;&DESCRIBE %q<board_new_object>=For staff only.
      # Makes Events, Public and Marketplace in %q<seed_community_category>, each with its lock and description.
      # Sets %q<seed_public_board> to Public.
      INC`SEED`COMMUNITY: |-
        think [setqm(board_new_category,%q<seed_community_category>,board_new_name,Events)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbpost %q<board_new_object>=role^approved;&DESCRIBE %q<board_new_object>=Scenes, plots and gatherings coming up.;think [setq(board_new_name,Public)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbpost %q<board_new_object>=role^approved;&DESCRIBE %q<board_new_object>=Talk about anything. Pick a board%, or post here.;think [setq(seed_public_board,%q<board_new_object>)];think [setq(board_new_name,Marketplace)]; @include {{bboards}}/INC`DO`NEWBOARD;@lock/user:bbpost %q<board_new_object>=role^approved;&DESCRIBE %q<board_new_object>=Buying%, selling and trading.
      # Makes General and Looking for RP inside %q<seed_public_board>, with no category.
      INC`SEED`PUBLIC: |-
        think [setqm(board_parent,%q<seed_public_board>,board_new_category,,board_new_name,General)]; @include {{bboards}}/INC`DO`NEWBOARD;&DESCRIBE %q<board_new_object>=Anything at all.;think [setq(board_new_name,Looking for RP)]; @include {{bboards}}/INC`DO`NEWBOARD;&DESCRIBE %q<board_new_object>=Find a scene partner.
      # 1 when %0 is a board.
      FUN`IS`BOARD: |-
        cand(isdbref(%0),strmatch(objid(parent(%0)),{{board_proto}}))
      # 1 when %0 is a post.
      FUN`IS`POST: |-
        cand(isdbref(%0),strmatch(objid(parent(%0)),{{post_proto}}))
      # The object that keeps viewer %0's reading state in BBOARD attributes: the viewer itself, unless
      # this object can't set attributes on them. Only God refuses a wizard, so God's state lives on the
      # readers object instead.
      FUN`READING`HOLDER: |-
        [if(controls(%!,%0),%0,{{readers}})]
      # The board or the store post or board %0 is in, as an objid. A post sits inside its board; every
      # board sits in the store and names the board it is in with UP, since a server bounds how deep
      # containment goes (max_depth, 10 by default) and boards nest deeper than that.
      FUN`STORE`PARENT: |-
        firstof(get(%0/UP),objid(loc(%0)))
      # 1 when %0 is the store, the top level.
      FUN`IS`TOP: |-
        strmatch(%0,{{store}})
      # The boards at level %0 (the store or a board) in display order, as objids: each category in
      # CATS order with its boards in ORDER order, then the boards with no category. A board's number
      # is its place in this list, hidden or not.
      FUN`STORE`BOARDS: |-
        [squish(iter(get(%0/CATS),iter(get(%0/ORDER),if(strmatch(get(%i0/CATEGORY),%i1),%i0))) [iter(get(%0/ORDER),if(t(member(get(%0/CATS),get(%i0/CATEGORY))),,%i0))])]
      # Board %0's pinned posts that are still on it, in order, as objids.
      FUN`STORE`PINS: |-
        [squish(iter(get(%0/PINS),if(cand(u(%!/FUN`IS`POST,%i0),strmatch(objid(loc(%i0)),%0)),%i0)))]
      # Board %0's posts in their numbering order: pinned posts, then the rest oldest first, as objids.
      # A board's contents are its boards (ORDER) and its posts, and dbrefs rise in creation order and
      # are never reused, so the rest is lcon() less the pins, sorted by dbref, in hardcode.
      FUN`STORE`POSTS: |-
        [setq(board_pinned_posts,u(%!/FUN`STORE`PINS,%0))][squish(%q<board_pinned_posts> [setdiff(lcon(%0),%q<board_pinned_posts>,%b,d)])]
      # The sequence numbers of post %0's comments, oldest first. A comment's number is its place here.
      # Every write runs in one queue entry, so no reader ever sees a comment half written.
      FUN`STORE`COMMENTKEYS: |-
        [sort(edit(lattr(%0/C`*),C`,),n)]
      # 1 when a finished comment on post %0 answers comment %1.
      FUN`STORE`HASREPLY: |-
        t(words(wildgrep(%0,C`*`RE,%1)))
      # Comment %1's number on post %0, or empty.
      FUN`STORE`COMMENTNUMBER: |-
        match(u(%!/FUN`STORE`COMMENTKEYS,%0),%1)
      # List %0 with %2 put in place %1, which may be one past its end: linsert() leaves a list alone then.
      FUN`LIST`INSERT: |-
        if(gt(%1,words(%0)),trim(%0 %2),linsert(%0,%1,%2))
      # Board %0's number path, such as 5/3. Walks up a level at a time rather than recursing, so a deep
      # board costs no function nesting.
      FUN`PATH`OFBOARD: |-
        [setqm(board_path_current,%0,board_path_text,)][null(iter(lnum(1,64),if(cor(strmatch(%q<board_path_current>,{{store}}),not(isdbref(%q<board_path_current>))),ibreak(),[setqm(board_path_parent,get(%q<board_path_current>/UP),board_path_text,[match(u(%!/FUN`STORE`BOARDS,%q<board_path_parent>),%q<board_path_current>)][if(strlen(%q<board_path_text>),/%q<board_path_text>)],board_path_current,%q<board_path_parent>)])))]%q<board_path_text>
      # Post %0's number path, such as 5/3/7.
      FUN`PATH`OFPOST: |-
        [setq(path_post_board,u(%!/FUN`STORE`PARENT,%0))][u(%!/FUN`PATH`OFBOARD,%q<path_post_board>)]/[add(words(u(%!/FUN`STORE`BOARDS,%q<path_post_board>)),match(u(%!/FUN`STORE`POSTS,%q<path_post_board>),%0))]
      # Board %0's name, in its colour.
      FUN`DISPLAY`BOARDNAME: |-
        [if(strlen(get(%0/COLOR)),ansi(get(%0/COLOR),name(%0)),name(%0))]
      # The names of board %0 and every board above it: Public / Staff Announcements.
      FUN`DISPLAY`BOARDNAMES: |-
        [setq(board_name_trail,)][null(iter(u(%!/FUN`STORE`ANCESTRY,%0),setq(board_name_trail,[u(%!/FUN`DISPLAY`BOARDNAME,%i0)][if(strlen(%q<board_name_trail>),%b/%b%q<board_name_trail>)])))]%q<board_name_trail>
      # How post %0, or its comment %1, names its author to viewer %2: the board's anonymous name when it
      # was posted under one, else the name kept when it was written. A viewer who moderates the board
      # sees both, "Anon (Mira)"; every caller names its viewer, so nobody is shown a name by default.
      FUN`DISPLAY`AUTHOR: |-
        [setqm(author_attr_prefix,if(strlen(%1),C`%1`),author_anonymous_name,get(%0/%q<author_attr_prefix>ANON))][if(strlen(%q<author_anonymous_name>),%q<author_anonymous_name>[if(cand(strlen(%2),u(%!/FUN`PERM`CAN,u(%!/FUN`STORE`PARENT,%0),moderate,%2)),%b%([firstof(get(%0/%q<author_attr_prefix>NAME),Someone)]%))],firstof(get(%0/%q<author_attr_prefix>NAME),Someone))]
      # Seconds %0 as a time today or a date before.
      FUN`DISPLAY`TIME: |-
        [if(strmatch(timefmt($Y$m$d,%0),timefmt($Y$m$d,secs())),timefmt($H:$M,%0),timefmt($b $d,%0))]
      # Seconds %0 as a date and time: Oct 07 18:02.
      FUN`DISPLAY`TIMESTAMP: |-
        timefmt($b $d $H:$M,%0)
      # %0 %1, with s added when %0 is not 1.
      FUN`DISPLAY`PLURAL: |-
        %0 %1[if(eq(%0,1),,s)]
      # 1 when board %0 sets its own %1 lock (bbread, bbpost, bbcomment or bbmoderate).
      FUN`PERM`SETSLOCK: |-
        [setq(lock_value,lock(%0/%1))][cand(strlen(%q<lock_value>),not(strmatch(%q<lock_value>,*UNLOCKED*)))]
      # The board nearest %0, itself included, that sets its own %1 lock, or empty.
      FUN`PERM`NEARESTLOCK: |-
        first(squish(iter(u(%!/FUN`STORE`ANCESTRY,%0),if(u(%!/FUN`PERM`SETSLOCK,%i0,%1),%i0[ibreak()]))))
      # 1 when viewer %1 passes the read lock of board %0 and of every board above it. A lock a board
      # does not set passes everyone.
      FUN`PERM`CANREADCHAIN: |-
        [setq(board_read_allowed,1)][null(iter(u(%!/FUN`STORE`ANCESTRY,%0),if(elock(%i0/bbread,%1),,[setq(board_read_allowed,0)][ibreak()])))]%q<board_read_allowed>
      # 1 when %0 holds softcode.bboards.admin. Kept for the rest of the queue entry, since a screen asks
      # once per board.
      FUN`PERM`ISADMIN: |-
        [if(strmatch(%q<perm_admin_subject>,%0),%q<perm_is_admin>,[setqm(perm_admin_subject,%0,perm_is_admin,t(permission(%0,softcode.bboards.admin)))]%q<perm_is_admin>)]
      # 1 when viewer %1 may read board %0. A board admin reads every board.
      FUN`PERM`CANREAD: |-
        cor(u(%!/FUN`PERM`ISADMIN,%1),u(%!/FUN`PERM`CANREADCHAIN,%0,%1))
      # 1 when viewer %2 may %1 (post, comment or moderate) on board %0. Post and comment need read and
      # the nearest post or comment lock (none at all lets anyone who reads); moderate needs read and the
      # nearest moderate lock (none lets nobody) or softcode.bboards.moderate.
      FUN`PERM`CAN: |-
        cand(u(%!/FUN`PERM`CANREAD,%0,%2),cor(u(%!/FUN`PERM`ISADMIN,%2),[setq(lock_nearest,u(%!/FUN`PERM`NEARESTLOCK,%0,bb%1))][switch(%1,moderate,cor(t(permission(%2,softcode.bboards.moderate)),cand(strlen(%q<lock_nearest>),elock(%q<lock_nearest>/bbmoderate,%2))),if(strlen(%q<lock_nearest>),elock(%q<lock_nearest>/bb%1,%2),1))]))
      # 1 when viewer %2 may edit or remove post %0, or its comment %1: its author, or a moderator.
      FUN`PERM`CANEDIT: |-
        cor(strmatch(get(%0/[if(strlen(%1),C`%1`)]BY),objid(%2)),u(%!/FUN`PERM`CAN,u(%!/FUN`STORE`PARENT,%0),moderate,%2))
      # Path %0 as viewer %1 may see it. Sets %q<path_kind> (level for the top, board, post or comment),
      # %q<path_current> (the board, or the store at the top), %q<path_post>, %q<path_comment_key> (the comment's sequence
      # number), %q<path_comment_number> (its number), %q<path_label> (the number path, such as 5/3/5) and %q<path_error> (what went
      # wrong, empty when nothing did). A board segment is a number or the start of a name.
      FUN`PATH`RESOLVE: |-

        think [setqm(comment_thread_root,if(strlen(%q<comment_reply_key>),firstof(get(%q<comment_post>/C`%q<comment_reply_key>`ROOT),%q<comment_reply_key>),%q<comment_key>),comment_thread_list,get(%q<comment_post>/THREAD))];&C`%q<comment_key>`ROOT %q<comment_post>=%q<comment_thread_root>;&THREAD %q<comment_post>=[if(strlen(%q<comment_reply_key>),u({{bboards}}/FUN`LIST`INSERT,%q<comment_thread_list>,inc(match(%q<comment_thread_list>,firstof(get(%q<comment_post>/C`%q<comment_thread_root>`END),%q<comment_thread_root>))),%q<comment_key>),trim(%q<comment_thread_list> %q<comment_key>))];&C`%q<comment_thread_root>`END %q<comment_post>=%q<comment_key>

  # The SEQ counter (every board, post and comment takes the next number, never reused), the
  # top-level boards in order (ORDER, objids) and the top level's categories (CATS keys in order,
  # CAT`<key> names). Every board is in the store, however deep it sits: a board's UP names the board
  # it is under (none at the top), because containment stops at 10 levels. Posts are in their board.
  - ref: store
    type: thing
    name: BBoard Store
    location: "{{bboards}}"
    flags: [NO_COMMAND]
    attributes:
      SEQ: |-
        0
      CAT: |-
        Category names, one leaf per key; CATS lists the keys in order.

  # The parent of every board, so a setting a board leaves unset comes from these defaults.
  - ref: board_proto
    type: thing
    name: BBoard
    location: "{{bboards}}"
    flags: [NO_COMMAND]
    attributes:
      CFG: |-
        Board settings. A board's own copy of a leaf overrides the default here.
      # Days a post lasts after its last activity; 0 is never.
      CFG`TIMEOUT: |-
        0
      # Most pinned posts on one board, at most 10.
      CFG`PINS: |-
        5
      # Most comments on one post, at most 200, so a post object stays under 2048 attributes.
      CFG`COMMENTS: |-
        150

  # The parent of every post. Marks an object as a post; holds nothing else.
  - ref: post_proto
    type: thing
    name: BBoard Post
    location: "{{bboards}}"
    flags: [NO_COMMAND]
    attributes:
      DESCRIBE: |-
        The parent of every post.

  # Reading state, for a reader the BBoards object can't set attributes on: only God. Everyone
  # else keeps theirs in BBOARD attributes on themselves (FUN`RS).
  - ref: readers
    type: thing
    name: BBoard Readers
    location: "{{bboards}}"
    flags: [NO_COMMAND]
    attributes:
      DESCRIBE: |-
        Reading state for readers the BBoards object can't set attributes on.

  # ---- help storage -------------------------------------------------------------------
  # A plain thing, not the WIZARD BBoards object: the librarian cannot u() a privileged object's
  # attributes. Bodies are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: bb_help
    type: thing
    name: BBoards Help
    location: "{{bboards}}"
    attributes:
      HELP: |-
        Bulletin boards: reading, posting, comments, and running the boards.
      HELP`BBOARDS: |-
        Bulletin boards hold posts, and posts hold comments. Boards can sit inside other boards, so a game can keep a few at the top and group the rest below them.

        ## Numbers

        Everything has a number path. `5` is the fifth board, `5/2` is the second board inside it or, after its boards, a post. `5/3/7` is comment 7 on post 5/3. Numbers follow the order you see, so they can change when a post is pinned, removed or moved. When a number you use has changed since you last looked, the command stops and tells you what it points at now. Type it again to go ahead.

        ## Reading

        - `+bbread`: the boards you follow, with what is new on each.
        - `+bbread <board>`: a board's boards and its newest posts. `+bbread/1 <board>` is its oldest page; the page is always the last switch.
        - `+bbread <post>`: the post and its comments, ten to a page. `+bbread/2 5/3` is page 2.
        - `+bbread <post>/<#>`: one conversation, the comment and every reply under it. Use this when a thread is too long to follow.
        - `+bblist`: the boards as a tree. A deep tree stops a few levels down; `+bblist <board>` shows the rest from there.
        - `+bbread/all`: every board you may read, followed or not. `+bbread/all <board>` starts from one board.

        See \[bboards new\] for keeping up, \[bboards posting\] for writing, and \[bboards reader\] for reading with single keys.
      HELP`BBOARDS`NEW: |-
        ## What's new

        - `+bbnext`: the next post with something new, its unread text and its oldest ten new comments. Typing it again goes on from there. `+bbnext <board>` stays on one board and the boards below it. `+bbnew` is the same command.
        - `+bbscan`: one line for each board with something new.
        - `+bbcatchup <board>`: mark a board and the boards below it read. `+bbcatchup all` marks everything.

        ## Following

        You follow every board you can read until you leave it.

        - `+bbleave <board>`: stop following a board. It stays readable, and `+bbread/all` still lists it.
        - `+bbjoin <board>`: follow it again.
        - `+bbnotify <board>=off`: no notice when someone posts there. It still counts as new. `+bbnotify <board>=on` turns it back on.
        - `+bbnotify off`: no notices anywhere, the same as `+bboptions notify=off`. `+bbnotify on` turns them back on.
        - `+bbfollow <post>`: hear about every comment on one post. `+bbunfollow <post>` stops.
      HELP`BBOARDS`POSTING: |-
        ## Posts

        - `+bbpost <board>/<title>=<text>`: post.
        - `+bbpost <board>/<title>`: start a draft instead. `+bbwrite <text>` adds a line, `+bbproof` shows it, `+bbpost` alone posts it and `+bbtoss` drops it.
        - `+bbedit <post>=<old>/<new>`: change your post. Use `^^^` in place of `/` when the text holds a slash. `+bbedit/all <post>=<text>` replaces the whole text and `+bbedit/title <post>=<title>` the title.
        - `+bbremove <post>`: remove your post. The posts after it move up one. A post with comments keeps its place, marked removed, so its comments can still be read.

        ## Comments

        - `+bbcomment <post>=<text>`: comment on a post.
        - `+bbreply <post>/<#>=<text>`: answer comment `<#>`. A reply sits under the comment it answers, so each conversation stays together.
        - `+bbedit <post>/<#>=<old>/<new>` and `+bbremove <post>/<#>` work on your comments too. A comment with replies keeps its place, marked removed.

        A post holds at most a set number of comments, 150 unless staff change it.

        Text is Markdown: blank lines make paragraphs, `*stars*` make emphasis, and `%%r` starts a new line. See \[bboards format\].
      HELP`BBOARDS`FORMAT: |-
        ## Markdown or SharpMUSH text

        Posts and comments are Markdown unless you say otherwise. Markdown text is kept exactly as you typed it and shown the same way to everyone, in the game and in the web portal.

        Add `/mush` to a post, comment or edit to write SharpMUSH text instead: it is evaluated once, as you, when you post it, so colour and functions work. What it produced is kept, and nothing in it is evaluated again. `/md` asks for Markdown when your default is SharpMUSH text.

        - `+bboptions`: your settings.
        - `+bboptions format=mush`: make SharpMUSH text your default. `format=md` goes back.
        - `+bboptions notify=off`: no new-post notices on any board.
      HELP`BBOARDS`SEARCH: |-
        ## Searching

        - `+bbsearch <board>/<name>`: posts by someone on a board.
        - `+bbsearch/text <board>/<words>`: posts and comments holding the words, on the board and the boards below it.

        A search looks at the newest 250 posts. When there are more, it says so, and a page switch looks further back: `+bbsearch/2 6/Mira`, `+bbsearch/text/2 6/horse`.
      HELP`BBOARDS`READER: |-
        ## The reader

        `+bbreader` opens a reader, at `<path>` with `+bbreader <path>`, where every line you type is a key, so you can move around with a letter at a time. Nothing you type in it runs as a command. `q` leaves it.

        - Enter or `n`: the next new thing, what `+bbnext` shows.
        - A number: open that board, post or comment where you are. A path such as `5/3` opens it from anywhere.
        - `j` and `k`: the next or previous comment in a thread, or page in a board.
        - `J` and `K`: the next or previous post on the board.
        - `p`: the comment this one answers. `t`: the whole thread. `u`: up one level.
        - `c <text>`: comment on this post. `r <text>`: reply to this comment. `c` or `r` alone lets you write several lines; a line of just `.` posts them and `.toss` drops them.
        - `e <old>/<new>`: edit what you wrote here.
        - `f`: follow or stop following this post. `m`: mark this board read.
        - `l`: show this screen again. `?`: list the keys.
      HELP`BBOARDS`MODERATE: |-
        ## Moderating

        Moderators of a board, and anyone holding the BBoard Moderator role, can do this on any post there:

        - `+bbpin <post>`: pin a post to the top. `+bbpin <post>=<place>` moves a pin. `+bbpin <board>` lists the pins, and `+bbunpin <post>` puts a post back in date order.
        - `+bbclose <post>`: no new comments. `+bbopen <post>` allows them again.
        - `+bbmove <post> to <board>`: move a post and its comments.
        - `+bbtimeout <post>=<days>`: remove the post that many days after its last activity. `=never` keeps it, `=default` uses the board's setting.
        - `+bbedit` and `+bbremove` on anyone's post or comment.

        A board's moderators are whoever passes its moderate lock: see \[bboards admin\].
      HELP`BBOARDS`ADMIN: |-
        ## Running the boards

        These need the BBoard Admin role.

        - `+bbnewgroup <name>`: make a board at the top. `+bbnewgroup <board>/<name>` makes one inside another.
        - `+bbcleargroup <board>`: remove an empty board. `+bbcleargroup/confirm <board>` removes it with its posts.
        - `+bbparent <board>=<board>`: move a board, with everything in it, inside another. `=top` moves it to the top.
        - `+bborder <board>=up`, `=down` or `=<number>`: move a board among the boards of its category.
        - `+bbcategory/create <name>` makes a category at the top, and `+bbcategory/create <board>/<name>` one inside a board.
        - `+bbcategory <board>=<category>` puts a board in a category, and `+bbcategory <board>=none` takes it out.
        - `+bbcategory/rename <name>=<new name>`, `+bbcategory/order <name>=<number>` and `+bbcategory/delete <name>` change a category at the top. For one inside a board, write `<board>/<name>`.
        - `+bbinfo <board>`: a board's settings and locks.
        - `+bbconfig`: the defaults. `+bbconfig all`: every board's settings and locks. `+bbconfig all <board>` starts from one board.
        - `+bbconfig <board>/<option>=<value>`: set `description`, `color`, `timeout` (days, 0 for never), `pins` (0 to 10), `comments` (1 to 200), `anonymous` (a name shown in place of the poster's) or `name`. `+bbconfig default/<option>=<value>` changes the default.

        ## Locks

        Each board has four locks, written as `@lock` would take them. `+bblock <board>=<lock>` with no kind sets the read lock.

        - `+bblock <board>/read=<lock>`: who may see the board.
        - `+bblock <board>/post=<lock>`: who may post. `+bbwritelock <board>=<lock>` is the same.
        - `+bblock <board>/comment=<lock>`: who may comment.
        - `+bblock <board>/moderate=<lock>`: who moderates it.

        A board with no lock of a kind takes it from the board it is in. An empty lock clears it: `+bblock 5/post=`. For example, `+bblock 5/post=role^approved` lets only approved players post on board 5.


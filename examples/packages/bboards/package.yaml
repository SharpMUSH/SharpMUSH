        &SEQ {{store}}=%q<comment_key>;&C`%q<comment_key>`BY %q<comment_post>=%q<viewer_objid>;&C`%q<comment_key>`NAME %q<comment_post>=[name(%q<viewer_objid>)];&C`%q<comment_key>`ANON %q<comment_post>=[get(%q<comment_board>/CFG`ANONYMOUS)];&C`%q<comment_key>`RE %q<comment_post>=%q<comment_reply_key>;&C`%q<comment_key>`FORMAT %q<comment_post>=%q<comment_format>;&C`%q<comment_key>`TEXT %q<comment_post>=%q<comment_rendered_text>;&C`%q<comment_key>`SOURCE %q<comment_post>=[if(strmatch(%q<comment_format>,mush),%q<comment_source_text>)];&C`%q<comment_key> %q<comment_post>=%q<comment_time>

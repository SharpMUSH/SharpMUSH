        @assert t(match(post comment,%q<path_kind>))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,%q<path_label> is a board. +bbcomment takes a post%, such as %q<path_label>/1.)];@assert not(strlen(get(%q<path_post>/REMOVED)))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,%q<path_label> was removed%; it takes no comments.)];@assert not(get(%q<path_post>/CLOSED))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,[u({{bboards}}/FUN`PATH`OFPOST,%q<path_post>)] is closed to comments.)]
      # The reader may comment on board %q<path_current>, post %q<path_post> is under its comment limit, and comment
      # %q<path_comment_key>, when one is answered, is not removed.
      INC`NEED`COMMENTABLE`ALLOWED: |-
        @assert u({{bboards}}/FUN`PERM`CAN,%q<path_current>,comment,%q<viewer_objid>)=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`ERROR,You may read [u({{bboards}}/FUN`PATH`OFBOARD,%q<path_current>)] [name(%q<path_current>)] but not comment there.)];@assert lt(words(u({{bboards}}/FUN`STORE`COMMENTKEYS,%q<path_post>)),min(200,get(%q<path_current>/CFG`COMMENTS)))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,That post has reached its limit of [min(200,get(%q<path_current>/CFG`COMMENTS))] comments.)];@assert cor(not(strlen(%q<path_comment_key>)),not(strlen(get(%q<path_post>/C`%q<path_comment_key>`REMOVED))))=@pemit %q<message_target>=[u({{bboards}}/FUN`MESSAGE`WARNING,That comment was removed. Answer the post instead: +bbcomment [u({{bboards}}/FUN`PATH`OFPOST,%q<path_post>)]=<text>.)]

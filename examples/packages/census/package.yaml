      # %0 a row: its cells, each value shown as its dimension shows it, then the count and share.
      FUN`DISPLAY`GROUPCELLS: |-
        iter(extract(%0,3,1,%t),u(%!/FUN`DISPLAY`GROUPVALUE,%i0,inum(0)),|,%r)%r[extract(%0,2,1,%t)]%r[if(lt(setr(display_share,round(fdiv(mul(extract(%0,2,1,%t),100),%q<display_total>),0)),1),<1,%q<display_share>)]%%
      # %0 a value as counted, %1 its dimension's place: a span's name for a time, (not set) for ~.
      FUN`DISPLAY`GROUPVALUE: |-
        if(not(comp(%0,~)),tone(muted,\(not set\)),if(strmatch(extract(r(group_spec_%1),3,1,%t),DURATION),extract(v(DATA`SPAN`NAME),inc(%0),1,|),%0))

  # The dimensions, one branch each, named as staff typed it, and the parts of a census while it is worked out.
  # Inside the Census, so no player can reach it, and no_command, so nothing kept on it is ever matched as a
  # command.
  #
  # A dimension is DIM`<NAME>, its value its label, with KIND, PATH, COMPARE, ACCESS and ORDER beneath. Staff
  # change them with +config census/dimensions. RUN`<key>`<n> holds a part of a census being worked out and is
  # deleted when it is drawn.
  - ref: store
    type: thing
    name: Census Store
    location: "{{census}}"
    flags: [no_command]
    attributes:
      DIM: |-
        What +census counts by, one branch each, named as staff typed it.
      DIM`GENDER: |-
        Gender
      DIM`GENDER`KIND: |-
        attribute
      DIM`GENDER`PATH: |-
        SEX
      DIM`GENDER`COMPARE: |-
        text
      DIM`GENDER`ACCESS: |-
        everyone
      DIM`GENDER`ORDER: |-
        10
      DIM`ROLE: |-
        Role
      DIM`ROLE`KIND: |-
        role
      DIM`ROLE`PATH: |-
        immortal wizard moderator councilor royalty architect guildmaster helper builder approved
      DIM`ROLE`COMPARE: |-
        text
      DIM`ROLE`ACCESS: |-
        everyone
      DIM`ROLE`ORDER: |-
        20
      DIM`OFFLINE: |-
        Last on
      DIM`OFFLINE`KIND: |-
        offline
      DIM`OFFLINE`PATH: |-

      DIM`OFFLINE`COMPARE: |-
        duration
      DIM`OFFLINE`ACCESS: |-
        everyone
      DIM`OFFLINE`ORDER: |-
        30
      DIM`CREATED: |-
        Created
      DIM`CREATED`KIND: |-
        created
      DIM`CREATED`PATH: |-

      DIM`CREATED`COMPARE: |-
        duration
      DIM`CREATED`ACCESS: |-
        everyone
      DIM`CREATED`ORDER: |-
        40
      DIM`ALTS: |-
        On the account
      DIM`ALTS`KIND: |-
        alts
      DIM`ALTS`PATH: |-

      DIM`ALTS`COMPARE: |-
        number
      DIM`ALTS`ACCESS: |-
        staff
      DIM`ALTS`ORDER: |-
        50
      RUN: |-
        Parts of a census being worked out, deleted as each is drawn.

  # The +help topics, on a plain thing: the librarian cannot u() a privileged object's attributes. Bodies
  # are evaluated, so brackets, parentheses and percent signs are escaped.
  - ref: census_help
    type: thing
    name: Census Help
    location: "{{census}}"
    attributes:
      HELP: |-
        Counting the game's characters.
      SEE: |-
        Cross-references. One leaf per topic; subtopics come from the tree, not from here.
      SEE`CENSUS: |-
        finger staff
      HELP`CENSUS: |-
        `+census` counts the game's characters by what staff choose, such as gender, role or theme. Each of
        those is a **dimension**. Guests, God and the package manager are never counted.

        - `+census` lists the dimensions and how many characters are counted.
        - `+census <dimension>` counts the characters holding each value, such as `+census gender`.
        - `+census <dimension>=<value>` lists the characters who match, such as `+census role=approved`.
        - Terms join with `/`, and every filter must match: `+census theme=Marvel/gender` counts the Marvel
          characters by gender. See [census queries].
        - A long answer comes in pages. The page is the last switch: `+census/2 theme=Marvel`.

        Example:

        `+census gender`

        Output: a box titled `Census` with a row per value, such as `Female | 12 | 48%%`, most first, then how
        many characters were counted.

        Staff change the dimensions with `+config census/dimensions`, see [census dimensions], and who is
        counted with `+config census/scope`, see [census scope].
      HELP`CENSUS`QUERIES: |-
        A query is one or more **terms**, joined with `/`. A term is a dimension, which counts by it, or a
        dimension, a comparison and a value, which keeps only the characters who match.

        - `=` and `!=`: equal, or not. Case does not matter, and `*` and `?` match anything: `theme=star*`.
          With nothing after it, `=` matches characters with no value and `!=` those with one: `theme!=`.
        - `<`, `<=`, `>` and `>=`: for numbers and times only.
        - A time is a number and a unit: `s`, `m` \(minutes\), `h`, `d`, `w` or `y`, such as `30d` or `1y 6w`.
          A number alone is days. `offline>30d` is someone last on more than 30 days ago.
        - Filters only: a list of who matches, by name, with a column for each dimension filtered by.
        - With a dimension or two: how many characters hold each value \(or pair of values\) among those
          who match. Times are counted in spans, such as `1 to 4 weeks`.

        Example:

        ```
        > +census theme=Marvel/offline>30d
        > +census role=approved/gender
        > +census theme/gender
        ```

        Output: the first lists the Marvel characters not on for a month. The second counts the approved
        characters by gender, and the third counts every pair of theme and gender.
      LOCK`CENSUS`DIMENSIONS: |-
        perm^config.admin
      HELP`CENSUS`DIMENSIONS: |-
        Staff set what `+census` counts by in `+config census/dimensions`, a table. Each dimension has a
        name players type, a `label`, a `kind` that says how a character's value is read, a `path` the kind
        reads, how values `compare`, who sees it \(`access`\) and an `order`.

        - `attribute`: the attribute the path names, such as `` APP`THEME ``.
        - `role`: the highest role they hold among those the path names, any role when it is empty.
        - `offline`, `created`: how long since they were last on, or were made. Compare as `duration`.
        - `alts`: how many characters are on their account. Compare as `number`.

        A new dimension is seen only by staff \(the softcode.census.staff permission\) until its access is
        `everyone`. Everyone then sees its values, as the census reads them, unless an attribute is mortal_dark.

        Example:

        ```
        > +config/add census/dimensions/theme=Theme
        > +config census/dimensions/theme/path=APP`THEME
        > +config census/dimensions/theme/access=everyone
        ```

        Output: one line from `+config` for each change, then `+census theme` counts by theme.

        On a big game, `@attribute/index APP`THEME` makes a filter such as `theme=Marvel` read the index.
      LOCK`CENSUS`SCOPE: |-
        perm^config.admin
      HELP`CENSUS`SCOPE: |-
        `+config census/scope` holds filters every census starts from, written as `+census` takes them.
        Empty, the default, counts every character but guests, God and the package manager.

        Staff with the softcode.census.staff permission count every character anyway with `+census/all`.

        Example:

        ```
        > +config census/scope=role=approved/offline<90d
        ```

        Output: a line from `+config`. From then on `+census` counts only approved characters who were on in
        the last 90 days, and its footer says so.
      LOCK`CENSUS`KINDS: |-
        perm^packages.admin
      HELP`CENSUS`KINDS: |-
        A package adds a kind of dimension by putting an attribute named `` KIND`<NAME> `` on the Census. It
        gets a list of characters as `%%0` and the dimension's path as `%%1`, with the reader as `%%#`, and
        returns each one's value as the reader may see it, one line each, in the same order.

        Two more attributes are optional. `` KIND`<NAME>`TEST `` decides a filter itself: it gets the
        characters, the path, the comparison and the value, and returns the characters it keeps.
        `` KIND`<NAME>`FIND `` gets the path, the comparison and the value, and returns the only characters
        that can match, such as an index lists them, or `#-1` to look at everyone.

        The `census-finger` package is one: its `finger` kind reads a `+finger` field as `+finger` shows it to
        the reader, and it adds species, age and timezone dimensions.

      # %0 the rows: a page of them in a table, with the footer.
      FUN`DISPLAY`GROUPPAGE: |-
        setq(display_rowcount,words(%0,%r))[u(%!/FUN`DISPLAY`PASTEND,%q<display_rowcount>,%q<display_size>)][if(lte(%q<cmd_page>,max(1,ceil(fdiv(%q<display_rowcount>,%q<display_size>)))),box(if(%q<display_total>,ldatatable(json(object,delim,json(string,%r),nowrap,json(string,u(%!/FUN`DISPLAY`GROUPNOWRAP)),grow,json(string,u(%!/FUN`DISPLAY`GROUPGROW))),iter(%q<query_groups>,tone(strong,u(%!/FUN`DIMENSION`LABEL,%i0)),,%r)%r>[tone(strong,Characters)]%r>[tone(strong,Share)],iter(extract(%0,inc(mul(dec(%q<cmd_page>),%q<display_size>)),%q<display_size>,%r),u(%!/FUN`DISPLAY`GROUPCELLS,%i0),%r,%*<|>),%*<|>),tone(muted,Nobody matches.))%r[rule()]%r[tone(muted,%q<display_total> [if(eq(%q<display_total>,1),character,characters)] in [%q<display_rowcount>] [if(eq(%q<display_rowcount>,1),group,groups)][u(%!/FUN`DISPLAY`PAGEOF,%q<display_rowcount>,%q<display_size>)].[u(%!/FUN`DISPLAY`COUNTED)][u(%!/FUN`DISPLAY`NEXT,%q<display_size>,%q<display_rowcount>)])],Census))]
      # The group table's columns that never wrap (counts and shares) and those that share the spare width.
      FUN`DISPLAY`GROUPNOWRAP: |-
        add(words(%q<query_groups>),1)%r[add(words(%q<query_groups>),2)]
      FUN`DISPLAY`GROUPGROW: |-

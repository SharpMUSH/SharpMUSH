format: "1.16"
package: roster-help
title: "Roster: +help topics"
version: 1.1.0
authors: [SharpMUSH]
description: "Puts the Roster topics into +help: registers the roster package's help with the +help librarian, and points its messages at +help."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [roster, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. roster keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is that registration, and the lines that point its messages at +help;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: roster
    version: ">=1.4"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/roster/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`ROSTER: |-
        {{roster/roster_help}}

  # Lines the roster package's messages end with when +help is here, through its FUN`HINT: HINT`<message>.
  - ref: message_hints
    target: "{{roster/roster}}"
    attributes:
      HINT`SWITCHES: |-
        +help roster lists them.

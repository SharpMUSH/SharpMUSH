format: "1.16"
package: finger-config
title: "Finger profiles: +config settings"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Finger profiles settings into +config: registers them with the +config registry, so staff see and change them with +config finger."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [finger, config, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. finger declares its settings as
# DATA`CONFIG`<NAME>, with their types and limits, and reads them with get() whether or not +config is installed.
# This package is the one leaf that tells the +config registry where they are.
depends:
  - package: finger
    version: ">=1.4"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/finger/
      branch: main
  - package: plus-config
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-config/
      branch: main

objects:
  - ref: config_registration
    target: "{{plus-config/registry}}"
    attributes:
      SYSTEM`FINGER: |-
        {{finger/finger}}

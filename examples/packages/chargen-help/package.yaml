format: "1.16"
package: chargen-help
title: "Character applications: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Character applications topics into +help: registers the chargen package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [chargen, help, bridge]
category: Characters
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. chargen keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: chargen
    version: ">=2.5"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/chargen/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`CHARGEN: |-
        {{chargen/chargen_help}}

format: "1.16"
package: comm-feed
title: "Channel and page feed"
version: 1.4.0
authors: [SharpMUSH]
description: "Pushes comm.channels, comm.message and comm.who OOB v2 updates — the channels a player may see and which they are on, each channel line or page to exactly the players who received it, and who comes onto or goes off a channel's member list — the data source for the portal Play sidebar's Channels and Pages."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [oob, portal, play, channels, pages]
category: Web portal
requires_server: ">=0.1"

# Attach mode (decision 20.3): manages four event handlers and their helpers on
# the existing event_handler object ({{$event_handler}}, #9 by default). Every
# helper is under FUN`COMM` so it cannot collide with room-contents' FUN`ROOMCONTENTS`*.
#
# 1.4.0 adds markup to comm.message (the text with its colour kept) and
# picture (the picture a line was sent with).
#
# 1.3.0 renames the helpers from FN`COMM`<Name> to FUN`COMM`<Name>, the standard kind for a
# function. A game that redefined FN`COMM`TEXT sets FUN`COMM`TEXT instead.
#
# 1.2.0 moves each handler below its event (PAGE`MESSAGE`COMMFEED): the engine
# runs every attribute one level below an event's own, so another package can
# hear the same event beside this one (help event).
#
# The engine decides who received what; this package never decides it again.
# CHANNEL`MESSAGE fires after a channel line is delivered and names exactly the
# members it was delivered to (a gagged member, a member the speaker may not be
# heard by, one whose @chatformat silenced the line, and a muted member's
# presence line are already left out). Connect and disconnect lines are not
# passed on: in the portal a channel's member list says who is on it. PAGE`MESSAGE fires after a page and
# names only the recipients it reached (not connected, HAVEN, page lock and
# interaction refusals are already left out). So comm.message goes to that
# list, plus the pager for a page, and never to anyone the terminal did not
# show it to. PLAYER`CHANNELS fires for a connected player on connect, on resume
# (a web session rebound to its socket, a reload above all), and when
# their channel list changes (join, leave, a change to their own channel flags,
# a rename or deletion of one of their channels). CHANNEL`WHO fires when a
# member comes onto or goes off a channel's member list (as @channel/who lists
# it), naming only the members whose view of the list changed: a member hiding
# on the channel comes and goes for those who may see hidden members alone.
#
# OOB v2 (docs/design/d1/README.md §7.1, §7.3): every payload carries "v": 2,
# lists are sent whole, identity is the objid. There is no unread count: the
# engine has no notion of what a player has read, so the client counts lines
# as they arrive. Shapes: README.md and docs/softcode/comm-feed-handler.md.
objects:
  - ref: handler
    target: "{{$event_handler}}"
    attributes:
      # ── Predicates ───────────────────────────────────────────────────────
      # Who is pushed to (%0 = an objid): a CONNECTED player. oob() skips
      # everyone else anyway; filtering first keeps it from looking up things
      # and disconnected players for nothing.
      FUN`COMM`VIEWER: |-
        cand(hastype(%0,player),hasflag(%0,CONNECTED))
      # The players a comm.message goes to (%0 = the objids the engine named).
      # Narrow it to send less; it can never widen what the engine delivered.
      FUN`COMM`RECIPIENTS: |-
        filter(me/FUN`COMM`VIEWER,%0)

      # ── Values ───────────────────────────────────────────────────────────
      # A line's text as the terminal reads it after the channel name or the
      # page prefix (%0 or %<style> = the style, %1 or %<name> = the speaker's
      # name, %2 or %<message> = the message; each by position and by name):
      # a pose is "Name waves", a semipose "Name's here", anything else the
      # message alone — the speaker's name is the payload's from.
      FUN`COMM`TEXT: |-
        switch(%0,pose,%1 %2,semipose,%1%2,%2)
      # One channel row (%0 = the channel's name, %1 = the viewer): whether
      # the viewer is on it, how many are, and its description, for the Play
      # drawer's channel browser; gagged appears only on a channel the viewer
      # is on and has gagged (they stay on it, hearing nothing).
      # cstatus() takes the object first on SharpMUSH, the channel second, and
      # answers OFF, ON, or ON with its flags (GAG among them). A channel
      # deleted or renamed since channels() listed it is left out rather than
      # spoiling the list: it has no member count, or its old name now only
      # abbreviates another channel, whose name cinfo() gives back.
      FUN`COMM`CHANNELROW: |-
        if(cand(not(comp(cinfo(%0,name),%0)),isnum(setr(member_count,cusers(%0)))),json_mod(json(object,name,json(string,%0),joined,if(member(cstatus(%1,%0),ON),true,false),members,json(number,%q<member_count>),description,json(string,cdesc(%0))),patch,json(object,gagged,if(member(cstatus(%1,%0),GAG),true,null))))

      # ── Payloads ─────────────────────────────────────────────────────────
      # comm.channels for a viewer (%0): who it is for, and every channel they
      # may see, on it or not. channels() lists what its executor may see, so
      # objeval() asks it as the viewer: this wizard handler would see them all.
      FUN`COMM`CHANNELS: |-
        json(object,v,json(number,2),viewer,json(object,name,json(string,name(%0)),objid,json(string,objid(%0))),channels,json_array(squish(iter(objeval(%0,channels()),u(me/FUN`COMM`CHANNELROW,%i0,%0),,%r),%r),%r))
      # comm.message, from named arguments: kind (channel|page), channel (a
      # channel line's channel), speaker (the speaker's objid; empty for a
      # sourceless line), name (the speaker's name), style, message, time
      # (unix-ms), to (a page's recipients' objids), id and picture (the
      # picture a channel line was sent with, cemit()'s fourth argument: a
      # character's objid or an image URL). The id is the one the recall
      # buffer holds a channel line under, or the page log a page, so the
      # portal can tell a line it pulled from the same line pushed. markup is
      # text with its colour, the serialized MString the portal draws. A
      # key a line has no value for is absent, not null — a null in a
      # json_mod() patch removes the key.
      FUN`COMM`MESSAGE: |-
        json_mod(json(object,v,json(number,2),kind,json(string,%<kind>),to,json_array(iter(%<to>,json(string,name(%i0)),,%r),%r),from,json(string,%<name>),text,json(string,setr(text,uargs(me/FUN`COMM`TEXT,0,%<style>,1,%<name>,2,%<message>,style,%<style>,name,%<name>,message,%<message>))),style,json(string,%<style>),ts,json(number,%<time>)),patch,json(object,channel,if(strlen(%<channel>),json(string,%<channel>),null),fromObjid,if(strlen(%<speaker>),json(string,%<speaker>),null),toObjids,if(words(%<to>),json_array(iter(%<to>,json(string,%i0),,%r),%r),null),id,if(strlen(%<id>),json(number,%<id>),null),markup,json(markupstring,%q<text>),picture,if(strlen(%<picture>),json(string,%<picture>),null)))

      # comm.who, from named arguments: channel, member (objid), name (the
      # member's name) and change (on|off): the member came onto or went off
      # the channel's member list.
      FUN`COMM`WHO: |-
        json(object,v,json(number,2),channel,json(string,%<channel>),member,json(object,name,json(string,%<name>),objid,json(string,%<member>)),online,if(strmatch(%<change>,on),true,false))

      # ── The handlers ─────────────────────────────────────────────────────
      # Each reads the event's arguments by name (help event list). null()
      # swallows oob()'s delivery count, which think would otherwise show the
      # handler object.
      #
      # recipients are the members the line was delivered to. A presence line
      # (a connect or disconnect) is not sent: the portal shows who is on a
      # channel as its member list (comm.who) instead.
      CHANNEL`MESSAGE`COMMFEED: |-
        think null(if(strmatch(%<style>,presence),,oob(u(me/FUN`COMM`RECIPIENTS,%<recipients>),comm.message,uargs(me/FUN`COMM`MESSAGE,kind,channel,channel,%<channel>,speaker,%<speaker>,name,%<name>,style,%<style>,message,%<message>,time,%<time>,id,%<id>,picture,%<picture>))))
      # recipients are those the page reached. The pager is sent it too, as
      # their terminal shows them their own page; setunion() keeps a self-page
      # to one copy.
      PAGE`MESSAGE`COMMFEED: |-
        think null(oob(u(me/FUN`COMM`RECIPIENTS,setunion(%<speaker>,%<recipients>)),comm.message,uargs(me/FUN`COMM`MESSAGE,kind,page,speaker,%<speaker>,name,%<name>,style,%<style>,message,%<message>,time,%<time>,to,%<recipients>,id,%<id>)))
      # viewers are the members whose view of the list changed; cause is
      # connect, disconnect, join, leave or status.
      CHANNEL`WHO`COMMFEED: |-
        think null(oob(u(me/FUN`COMM`RECIPIENTS,%<viewers>),comm.who,uargs(me/FUN`COMM`WHO,channel,%<channel>,member,%<member>,name,%<name>,change,%<change>)))
      # objid is the player; cause is connect, resume, join, leave, status,
      # rename or delete; channel is empty on connect and resume. The whole
      # list, to that player.
      PLAYER`CHANNELS`COMMFEED: |-
        think null(if(u(me/FUN`COMM`VIEWER,%<objid>),oob(%<objid>,comm.channels,u(me/FUN`COMM`CHANNELS,%<objid>))))

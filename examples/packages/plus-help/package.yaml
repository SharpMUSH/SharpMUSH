format: "1.16"
package: plus-help
title: "+help"
version: 1.9.0
authors: [SharpMUSH]
description: "+help — the game's own help. Aggregates the topics installed packages carry and keeps the ones the game writes itself."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH-Packages
keywords: [help, docs, navigation, ui]
category: Essentials
requires_server: ">=0.1"

# `+help` is the game's own help: what THIS game installed and what THIS game's staff wrote. `help`
# is the engine's corpus, which a game cannot write to. The two never merge, and a +help miss points
# across rather than falling through, so +help can answer "does this GAME document this?".
#
# README.md is the contributor's guide. What follows is why this file is shaped the way it is.
#
# Every source is an ordinary object with a HELP tree, registered by one SRC leaf here; the librarian
# holds the registry, the commands and the rendering, and no content. That keeps reading a topic one
# code path, and it is why a source must be UNFLAGGED — u() on a privileged object's attribute is
# refused unless the evaluator is privileged too.
#
# A topic's name is its attribute path below the root with backticks read as spaces, so
# HELP`SCENE`JOIN is "scene join". Bodies are run through u(), not get(), which is what lets one
# carry colour or the reader's own name; what should be shown is escaped, as in any attribute.
# +help/write is gated on staff. A game topic then runs as Game Help, which shares its owner with
# every package object and so would control them all; it is MISTRUST, so it controls only itself and
# a topic can do no more than the staff member who wrote it could.
objects:
  - ref: librarian
    type: thing
    name: Help Librarian
    location: "{{$master_room}}"
    # See_All, not WIZARD: the librarian reads HELP trees on objects it does not own — a
    # hand-registered +help/source target can belong to anyone — and See_All is what skips the
    # attribute-read check. It deliberately goes no further, because reading is a different gate
    # from evaluating and no power lifts the second one. Send_OOB is what cmdlink() asks of whoever
    # writes a command link, as PennMUSH asks it of XCH_CMD. Functions lets STARTUP register helplink().
    powers: [See_All, Send_OOB, Functions]
    attributes:

      # ── The registry ────────────────────────────────────────────────────────
      # One leaf per source, naming the object(s) whose HELP tree it contributes. Written by the
      # package manager for a package that attaches (see the header), or by hand with +help/source
      # for a system no package installed. A leaf whose object no longer exists contributes nothing
      # and is not an error — a force-removed contributor degrades to missing topics.
      SRC:
        value: |-
          Registered help sources. One leaf per source, naming the object(s) carrying its HELP tree.
        flags: [no_command]
      # CONTRIBUTORS: the ref you name in your SRC leaf must be unique across every package that
      # registers here, not merely within your own manifest. An installed {{ref}} is a
      # [v(PM`REFS`<REF>)] recall against the object the attribute landed on — this librarian —
      # and PM`REFS namespaces only the cross-package {{pkg/ref}} form, so two packages that both
      # call their object "help" share one leaf and the later install steals the earlier's topics.
      # Name it after your package: scene_help, ww_help, hello_help.
      # This package's own topics, and the game's, are sources like any other — each an object with
      # a HELP tree. "game" is the reserved name the collision rule gives the last word to.
      SRC`PLUS-HELP:
        value: |-
          {{plus_help_own}}
      SRC`GAME:
        value: |-
          {{game_help}}

      # ── Class branches ──────────────────────────────────────────────────────
      FUN:
        value: |-
          Reads. GET lookups, IS predicates, DISPLAY formatting.
        flags: [no_command]
      INC:
        value: |-
          Reusable command steps. IS assertions, DO effects, DISPLAY output.
        flags: [no_command]

      # ── Records ─────────────────────────────────────────────────────────────
      # Every read below works on a flat record list, built once per command and passed down, rather
      # than re-asking the game per topic. A record is <source>:<object>:<attribute>, three fields a
      # colon can separate safely: a source name comes from an attribute name (no colons legal), an
      # object is a DBREF (an objid would not be safe here — it contains one), and an attribute path
      # is backticks and word characters.
      # %0 a source — the objects carrying its topics
      FUN`SOURCE`OBJECTS:
        value: |-
          u(%!/SRC`[ucstr(%0)])
        flags: [funsyntax]
      # "game" leads because a game's own help should read before the packages'; the rest sort so the
      # index does not reorder itself as packages are installed. A leaf with no value is skipped:
      # +help/unsource clears the value, and attrib_set() leaves the attribute itself in place.
      # %0 "all" for every source, optional — every registered source the reader may read, the game's own first
      FUN`GET`SOURCES:
        value: |-
          trim(squish(game%b[sort(iter(lattr(%!/SRC`*),if(cand(strlen(get(%!/%i0)),not(strmatch(setr(registered_name,lcstr(rest(%i0,`))),game)),cor(strmatch(%0,all),u(%!/FUN`IS`SOURCEREADABLE,%q<registered_name>))),%q<registered_name>),%b,%b))]))
        flags: [funsyntax]
      # ** is the wildcard that crosses a backtick; * stops at one. The root itself is not matched,
      # which is what we want: it holds the source's description, not a topic.
      #
      # An attribute with an empty body is skipped. Writing a multi-word topic creates the branch
      # above it -- +help/write "house rules" sets HELP`HOUSE`RULES, and the engine materializes an
      # empty HELP`HOUSE -- which would otherwise list as a topic named "house" with nothing in it.
      # Missing objects must not turn lattr() error words into phantom topic records.
      #
      # A topic the reader fails a lock on is never made a record, so every read below — the index,
      # listings, search, a topic, its subtopics — leaves it out without asking again. Each object's
      # failed locks are worked out once, before its topics are walked.
      # %0 a source · %1 "all" for every topic, optional — its topics the reader may read, as records
      FUN`SOURCE`RECORDS:
        value: |-
          iter(u(%!/FUN`SOURCE`OBJECTS,%0),if(cand(isdbref(%i0),cor(strmatch(%1,all),u(%!/FUN`IS`OBJECTREADABLE,%i0))),[setq(failed_paths,if(strmatch(%1,all),,u(%!/FUN`GET`FAILEDPATHS,%i0)))][iter(lattr(%i0/HELP`**),if(cand(strlen(get(%i1/%i0)),not(u(%!/FUN`IS`UNDERPATHS,rest(%i0,`),%q<failed_paths>))),%0:[num(%i1)]:%i0),%b,%b)]),%b,%b)
        flags: [funsyntax]
      # %0 "all" for every topic, optional — every topic in the game the reader may read, as records
      FUN`GET`RECORDS:
        value: |-
          trim(squish(iter(u(%!/FUN`GET`SOURCES,%0),u(%!/FUN`SOURCE`RECORDS,%i0,%0),%b,%b)))
        flags: [funsyntax]

      # ── Locks ───────────────────────────────────────────────────────────────
      # A source declares who may read its help in a LOCK tree beside HELP, the way SEE sits beside
      # it. The LOCK root locks every topic the object carries; LOCK`<path> locks the topic at
      # HELP`<path> and every subtopic below it. A value is a lock key, as @lock takes one —
      # perm^config.admin, role^wizard|role^royalty, flag^builder — tested against the reader with
      # testlock(). A key that does not parse fails, so a mistyped lock hides rather than leaks.
      # %0 a lock key, or nothing — whether the reader passes it; no key passes everyone
      FUN`IS`PASSED:
        value: |-
          cor(not(strlen(%0)),t(testlock(%0,%#)))
        flags: [funsyntax]
      # %0 an object — whether the reader passes its LOCK root
      FUN`IS`OBJECTREADABLE:
        value: |-
          u(%!/FUN`IS`PASSED,get(%0/LOCK))
        flags: [funsyntax]
      # A source hides from a reader when every object it names that exists is locked to them. One
      # whose objects are all gone stays, so +help/sources can still say they are missing.
      # %0 a source — whether the reader may read it
      FUN`IS`SOURCEREADABLE:
        value: |-
          cor(not(words(setr(source_present,iter(u(%!/FUN`SOURCE`OBJECTS,%0),if(isdbref(%i0),%i0),%b,%b)))),t(words(iter(%q<source_present>,if(u(%!/FUN`IS`OBJECTREADABLE,%i0),x),%b,%b))))
        flags: [funsyntax]
      # %0 an object — the topic paths below its LOCK tree whose lock the reader fails
      FUN`GET`FAILEDPATHS:
        value: |-
          trim(squish(iter(lattr(%0/LOCK`**),if(u(%!/FUN`IS`PASSED,get(%0/%i0)),,rest(%i0,`)),%b,%b)))
        flags: [funsyntax]
      # %0 a topic path, below HELP · %1 paths — whether it is one of them or below one
      FUN`IS`UNDERPATHS:
        value: |-
          t(words(iter(%1,if(cor(strmatch(%0,%i0),strmatch(%0,%i0`*)),x),%b,%b)))
        flags: [funsyntax]
      # %0 a record — the lock attributes on its object that apply to it: the root, then each one at
      # or above its path
      FUN`GET`LOCKNAMES:
        value: |-
          setqm(lock_object,extract(%0,2,1,:),
          lock_path,rest(extract(%0,3,1,:),`))[trim(squish([if(strlen(get(%q<lock_object>/LOCK)),LOCK)] [iter(lattr(%q<lock_object>/LOCK`**),if(cand(strlen(get(%q<lock_object>/%i0)),u(%!/FUN`IS`UNDERPATHS,%q<lock_path>,rest(%i0,`))),%i0),%b,%b)]))]
        flags: [funsyntax]
      # A see-also entry naming a topic the reader may not read is left out, so a locked topic's name
      # never reaches them that way either. One that names nothing at all is still shown.
      # %0 records · %1 a topic name as written — whether it names only topics locked to the reader
      FUN`IS`WITHHELD:
        value: |-
          cand(not(words(u(%!/FUN`GET`FOUND,%0,lcstr(%1)))),words(u(%!/FUN`GET`FOUND,u(%!/FUN`GET`RECORDS,all),lcstr(%1))))
        flags: [funsyntax]

      # %0 a record — its source
      FUN`RECORD`SOURCE:
        value: |-
          extract(%0,1,1,:)
        flags: [funsyntax]
      # %0 a record — its bare topic name, backticks read as spaces
      FUN`RECORD`TOPIC:
        value: |-
          lcstr(edit(rest(extract(%0,3,1,:),`),`,%b))
        flags: [funsyntax]
      # %0 a record — its qualified name, <source>/<topic>
      FUN`RECORD`NAME:
        value: |-
          extract(%0,1,1,:)/[u(%!/FUN`RECORD`TOPIC,%0)]
        flags: [funsyntax]
      # Raw, for searching and for +help/write to round-trip. Never u() a body to search it.
      # %0 a record — its body as stored, unevaluated
      FUN`RECORD`BODY:
        value: |-
          get(extract(%0,2,1,:)/[extract(%0,3,1,:)])
        flags: [funsyntax]
      # Evaluated, for reading. See the header on why u() is right here.
      # A body with an escape missing is an authoring mistake like any other, and it stops the
      # expression. Fall back to the stored text so the reader still gets something readable and
      # the author can see what they wrote, rather than the whole topic becoming a #-1.
      # %0 a record — its body, evaluated, or as stored when evaluating it fails
      FUN`RECORD`TEXT:
        value: |-
          if(strmatch(setr(topic_text,u(extract(%0,2,1,:)/[extract(%0,3,1,:)])),#-1*),u(%!/FUN`RECORD`BODY,%0),%q<topic_text>)
        flags: [funsyntax]
      # %0 a source — the line describing it, from its root attribute
      FUN`SOURCE`DESCRIPTION:
        value: |-
          if(isdbref(setr(description_object,first(u(%!/FUN`SOURCE`OBJECTS,%0)))),get(%q<description_object>/HELP))
        flags: [funsyntax]

      # ── Navigation ──────────────────────────────────────────────────────────
      # SUBTOPICS are derived, never declared: HELP`SCENE`JOIN is already a child of HELP`SCENE, so
      # the tree knows the relationship and it cannot drift. A child is a record in the same source
      # whose path is the parent's plus ONE segment — what is left after stripping "<parent>`" is
      # non-empty and holds no further backtick. Written with after() rather than by counting
      # segments, because words() does not split on a backtick: words(HELP`SCENE`JOIN,`) is 1.
      # %0 records · %1 a record — its direct subtopics, in order
      FUN`GET`CHILDREN:
        value: |-
          trim(squish(iter(%0,if(cand(strmatch(extract(%i0,1,1,:),extract(%1,1,1,:)),cand(strlen(setr(child_rest,after(extract(%i0,3,1,:),extract(%1,3,1,:)`))),not(strmatch(%q<child_rest>,*`*)))),%i0),%b,%b)))
        flags: [funsyntax]
      # A topic's own last segment, which is what a subtopic is called under its parent: the child
      # of "scene" called "scene join" lists as "join".
      # %0 a record — its name relative to its parent
      FUN`GET`LEAFNAME:
        value: |-
          lcstr(edit(last(extract(%0,3,1,:),`),`,%b))
        flags: [funsyntax]

      # SEE ALSO is declared, because a pointer at ANOTHER source cannot be derived from the tree.
      # It lives in a parallel SEE tree on the same object, at the same path as the topic, holding a
      # "|"-separated list of topic names — bare or qualified. A separate root keeps HELP purely
      # topics: a SEE leaf must never itself become one.
      # %0 a record — the topics it points at, as written
      FUN`GET`SEE:
        value: |-
          get(extract(%0,2,1,:)/SEE`[rest(extract(%0,3,1,:),`)])
        flags: [funsyntax]
      # %0 records · %1 a record — the topics it points at that the reader may know of, "|"-separated
      FUN`GET`SEEALSO:
        value: |-
          trim(squish(iter(u(%!/FUN`GET`SEE,%1),if(u(%!/FUN`IS`WITHHELD,%0,%i0),,%i0),|,|),|),|)
        flags: [funsyntax]

      # ── Selection ───────────────────────────────────────────────────────────
      # strmatch() glob-matches case-insensitively, so "+help scene*" wildcards for free, the way
      # the engine's own help does.
      # %0 records · %1 a source — the ones belonging to it
      FUN`GET`OF:
        value: |-
          trim(squish(iter(%0,if(strmatch(extract(%i0,1,1,:),%1),%i0),%b,%b)))
        flags: [funsyntax]
      # %0 records · %1 the name attribute to match on · %2 the query
      FUN`GET`MATCHES:
        value: |-
          trim(squish(iter(%0,if(strmatch(u(%!/%1,%i0),%2),%i0),%b,%b)))
        flags: [funsyntax]
      # %0 a query — qualified queries match the qualified name, bare ones the bare name
      FUN`GET`NAMEATTRIBUTE:
        value: |-
          if(strmatch(%0,*/*),FUN`RECORD`NAME,FUN`RECORD`TOPIC)
        flags: [funsyntax]
      # One game-authored topic outranks any number of package ones — the game's own word wins.
      # %0 the matches — narrowed to the game's own topic when it claims the same name
      FUN`GET`RESOLVED:
        value: |-
          if(cand(gt(words(%0),1),words(setr(game_matches,u(%!/FUN`GET`OF,%0,game)))),%q<game_matches>,%0)
        flags: [funsyntax]
      # %0 records · %1 a query — the records it resolves to
      FUN`GET`FOUND:
        value: |-
          u(%!/FUN`GET`RESOLVED,u(%!/FUN`GET`MATCHES,%0,u(%!/FUN`GET`NAMEATTRIBUTE,%1),%1))
        flags: [funsyntax]
      # A source with no topics is not listed: the game's own is empty until someone writes a topic,
      # and an empty row is worse than no row.
      # %0 records — the registered sources that actually have topics
      FUN`GET`LIVESOURCES:
        value: |-
          trim(squish(iter(u(%!/FUN`GET`SOURCES),if(words(u(%!/FUN`GET`OF,%0,%i0)),%i0),%b,%b)))
        flags: [funsyntax]
      # What a reader typed, as a topic name: lower case, and a command typed as one ("+scene" or
      # "+scene/join") read as the topic it names, its switch a word of the topic ("scene join").
      # %0 the query as typed — the topic name it asks for
      FUN`GET`QUERY:
        value: |-
          setq(query_text,lcstr(trim(squish(%0))))[if(strmatch(%q<query_text>,+*),trim(edit(after(%q<query_text>,+),/,%b)),%q<query_text>)]
        flags: [funsyntax]
      # The command a bare word would be: "bug" asks about +bug, "+scene" about itself.
      # %0 the query as typed — the +command it names
      FUN`GET`COMMAND:
        value: |-
          setq(query_text,lcstr(trim(%0)))[if(strmatch(%q<query_text>,+*),%q<query_text>,+%q<query_text>)]
        flags: [funsyntax]
      # A command's topic is the one that documents it, so "+help bug" finds the topic showing `+bug`
      # without the topic having to be called "bug". A topic documents a command when its body names it
      # in code, whole: `+event <id>` documents +event, `+events` does not.
      # %0 records · %1 a +command — the records whose body shows it in code
      FUN`GET`DOCUMENTING:
        value: |-
          trim(squish(iter(%0,if(cor(strmatch(setr(record_body,u(%!/FUN`RECORD`BODY,%i0)),*`%1`*),strmatch(%q<record_body>,*`%1 *),strmatch(%q<record_body>,*`%1/*),strmatch(%q<record_body>,*`%1=*)),%i0),%b,%b)))
        flags: [funsyntax]
      # A word that is no topic's whole name: the topics whose name begins with it, then those holding it.
      # %0 records · %1 a word — the records whose bare name starts with it, then those containing it
      FUN`GET`NEAR:
        value: |-
          setq(near_starts,trim(squish(iter(%0,if(strmatch(u(%!/FUN`RECORD`TOPIC,%i0),%1*),%i0),%b,%b))))[trim(squish(%q<near_starts> [iter(%0,if(cand(strmatch(u(%!/FUN`RECORD`TOPIC,%i0),*%1*),not(member(%q<near_starts>,%i0))),%i0),%b,%b)]))]
        flags: [funsyntax]
      # Every way a name finds topics, in order, stopping at the first that finds any: the name itself
      # (wildcards included), the command it is, then names that start with or contain it. A wildcard
      # or a source/topic name is only ever the first.
      # %0 records · %1 the query as typed — the records it finds, with %q<help_query> the query read as a topic name and %q<help_lookup_kind> set to name, command or near
      FUN`GET`LOOKUP:
        value: |-
          setqm(help_query,u(%!/FUN`GET`QUERY,%1),
          help_lookup_kind,name)[if(words(setr(help_matches,u(%!/FUN`GET`FOUND,%0,%q<help_query>))),%q<help_matches>,if(regmatch(%q<help_query>,\[*?/\]),,if(words(setr(help_matches,u(%!/FUN`GET`DOCUMENTING,%0,u(%!/FUN`GET`COMMAND,%1)))),[setq(help_lookup_kind,command)]%q<help_matches>,[setq(help_lookup_kind,near)][u(%!/FUN`GET`NEAR,%0,%q<help_query>)])))]
        flags: [funsyntax]
      # A page number is a whole number from 1; /0 is a mistake, not page 1.
      # %0 a page number as typed
      FUN`IS`PAGE:
        value: |-
          cand(isint(%0),gt(%0,0))
        flags: [funsyntax]
      # %0 records · %1 the text — records whose name or body contains it
      FUN`GET`SEARCHED:
        value: |-
          trim(squish(iter(%0,if(cor(strmatch(u(%!/FUN`RECORD`NAME,%i0),*%1*),strmatch(u(%!/FUN`RECORD`BODY,%i0),*%1*)),%i0),%b,%b)))
        flags: [funsyntax]

      # ── Paging ──────────────────────────────────────────────────────────────
      # no arguments — listing rows that fit the reader's screen, under the title, headings, rule and footer
      FUN`PAGE`ROWS:
        value: |-
          max(5,sub(height(%#,24),8))
        flags: [funsyntax]
      # %0 records — how many pages the reader's screen splits them into
      FUN`PAGE`COUNT:
        value: |-
          add(1,div(sub(max(1,words(%0)),1),u(%!/FUN`PAGE`ROWS)))
        flags: [funsyntax]
      # %0 records · %1 page number — the records shown on that page
      FUN`PAGE`SLICE:
        value: |-
          extract(%0,add(1,mul(sub(%1,1),u(%!/FUN`PAGE`ROWS))),u(%!/FUN`PAGE`ROWS))
        flags: [funsyntax]

      # ── Display ─────────────────────────────────────────────────────────────
      # cmdlink() names the link; each reader's client writes it in its own dialect (Pueblo XCH_CMD,
      # MXP SEND, the portal's anchor) or shows the bare name, so nothing here asks which client it is.
      # %0 a record — its qualified name, clickable
      FUN`DISPLAY`REF:
        value: |-
          cmdlink(u(%!/FUN`RECORD`NAME,%0),+help [u(%!/FUN`RECORD`NAME,%0)])
        flags: [funsyntax]
      # The width a markdown body is rendered at: the whole line, since a screen's box has no sides
      # (FUN`GET`FRAME). rendermarkdown() refuses a width under 10.
      # no arguments — the reader's width
      FUN`GET`BODYWIDTH:
        value: |-
          max(10,width(%#,78))
        flags: [funsyntax]
      # Every screen is a box() with no sides, corners or tees: a titled line across the top, the
      # dividers and bottom line across the whole width, and nothing beside the text, so a line copied
      # from a terminal carries no |. The portal draws its usual card. Table headings are bold rather
      # than ruled off, since a heading rule spans only the table, not the screen.
      # no arguments — the options every screen's box is drawn with
      FUN`GET`FRAME:
        value: |-
          json(object,side,json(string,),corner,json(string,),teel,json(string,),teer,json(string,),pad,0)
        flags: [funsyntax]
      # %0 a record — its first paragraph that is not a heading, rendered and on one line. The listing's
      # Summary column wraps it to the reader's width.
      FUN`DISPLAY`SUMMARY:
        value: |-
          squish(edit(rendermarkdowncustom(before(regedit(regeditall(%r[u(%!/FUN`RECORD`TEXT,%0)],%r#+ .*,),^%r+,),%r%r),%!,1000),%r,%b))
        flags: [funsyntax]
      # %0 sources — the descriptive table on +help/sources. Cells are joined with %r and
      # split on a newline, so a description holding a | stays one cell
      FUN`DISPLAY`SOURCETABLE:
        value: |-
          datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1),min,json(string,%r20),grow,json(string,%r1)),[tone(strong,Source)]%r[iter(%0,cmdlink(%i0,+help/list %i0),%b,%r)],[tone(strong,Covers)]%r[iter(%0,edit(u(%!/FUN`SOURCE`DESCRIPTION,%i0),%r,%b),%b,%r)])
        flags: [funsyntax]
      # %0 live sources — short clickable names flow into as many columns as each reader can fit.
      # Leave width to the layout renderer so the portal can reflow the same grid responsively.
      FUN`DISPLAY`SOURCEGRID:
        value: |-
          grid(iter(%0,cmdlink(%i0,+help/list %i0),%b,%r),%r)
        flags: [funsyntax]
      # no arguments — the one line that tells a reader what else to type, kept under 78 columns
      FUN`DISPLAY`SYNTAX:
        value: |-
          +help <topic>%b·%b+help/list \[<source>\]%b·%b+help/search <text>%b·%b+help/sources
        flags: [funsyntax]
      # The front page is a TOPIC, not a string in here: "index", resolved the ordinary way, so a
      # game overrides the shipped text by writing its own with +help/write and nothing new is
      # needed to let it. Below it, what this game actually has installed — no counts, because a
      # reader choosing where to look is not helped by knowing one source has four topics.
      # %0 every record — the whole front page
      FUN`DISPLAY`INDEX:
        value: |-
          box(if(words(setr(index_records,u(%!/FUN`GET`FOUND,%0,index))),rendermarkdowncustom(u(%!/FUN`RECORD`TEXT,%q<index_records>),%!,u(%!/FUN`GET`BODYWIDTH))%r)[rule(Available help)]%r[u(%!/FUN`DISPLAY`SOURCEGRID,u(%!/FUN`GET`LIVESOURCES,%0))],Help,,u(%!/FUN`GET`FRAME))%r[u(%!/FUN`DISPLAY`SYNTAX)]
        flags: [funsyntax]
      # named: title · list the records · page · pages how many · head the command and its switches · tail
      # what follows them. The next page is head/<n> tail.
      FUN`DISPLAY`LISTING:
        value: |-
          setq(listing_slice,u(%!/FUN`PAGE`SLICE,%<list>,%<page>))[box(datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1),min,json(string,%r20),grow,json(string,%r1)),[tone(strong,Topic)]%r[iter(%q<listing_slice>,u(%!/FUN`DISPLAY`REF,%i0),%b,%r)],[tone(strong,Summary)]%r[iter(%q<listing_slice>,u(%!/FUN`DISPLAY`SUMMARY,%i0),%b,%r)]),%<title>,,u(%!/FUN`GET`FRAME))]%r[words(%<list>)] [if(eq(words(%<list>),1),topic,topics)]%b-%bpage %<page> of %<pages>[if(lt(%<page>,%<pages>),%b-%b%<head>/[add(%<page>,1)][if(strlen(%<tail>),%b%<tail>)])]
        flags: [funsyntax]
      # One subtopic, named as it is known under its parent, running the full +help for it.
      # %0 a child record — its short name, clickable
      FUN`DISPLAY`CHILD:
        value: |-
          cmdlink(u(%!/FUN`GET`LEAFNAME,%0),+help [u(%!/FUN`RECORD`NAME,%0)])
        flags: [funsyntax]
      # One see-also entry. The name is as the author wrote it — bare or qualified — and is shown
      # that way; a name nothing resolves to is still listed, because saying so is more use to a
      # reader than dropping it silently.
      # %0 a topic name as written
      FUN`DISPLAY`SEEONE:
        value: |-
          cmdlink(%0,+help %0)
        flags: [funsyntax]
      # %0 records · %1 a record — the subtopic and see-also lines after a blank line, each omitted when empty
      FUN`DISPLAY`NAV:
        value: |-
          if(words(setr(nav_children,u(%!/FUN`GET`CHILDREN,%0,%1))),%r%r[tone(strong,Subtopics:)] [iter(%q<nav_children>,u(%!/FUN`DISPLAY`CHILD,%i0),%b,tone(muted,%b·%b))])[if(strlen(setr(nav_see_also,u(%!/FUN`GET`SEEALSO,%0,%1))),%r[if(words(%q<nav_children>),,%r)][tone(strong,See also:)] [iter(%q<nav_see_also>,u(%!/FUN`DISPLAY`SEEONE,%i0),|,tone(muted,%b·%b))])]
        flags: [funsyntax]
      # The body is markdown, rendered against this object's own RENDERMARKUP templates so a topic's
      # [cross-reference] becomes a live +help — see RENDERMARKUP`LINK.
      # %0 records · %1 a record — the whole topic, titled with its name
      FUN`DISPLAY`TOPIC:
        value: |-
          box(rendermarkdowncustom(u(%!/FUN`RECORD`TEXT,%1),%!,u(%!/FUN`GET`BODYWIDTH))[u(%!/FUN`DISPLAY`NAV,%0,%1)][u(%!/FUN`DISPLAY`LOCKS,%1)],u(%!/FUN`RECORD`NAME,%1),,u(%!/FUN`GET`FRAME))%r+help/list [u(%!/FUN`RECORD`SOURCE,%1)]
        flags: [funsyntax]
      # A reader who sees a locked topic passed its lock; the line tells them, and staff checking a
      # topic, who else does.
      # %0 a record — the locks it is shown behind after a blank line, or nothing when it has none
      FUN`DISPLAY`LOCKS:
        value: |-
          if(words(setr(topic_locks,u(%!/FUN`GET`LOCKNAMES,%0))),%r%r[tone(muted,Shown only to: [iter(%q<topic_locks>,get(extract(%0,2,1,:)/%i0),%b,%band%b)])])
        flags: [funsyntax]
      # %0 a source — the object carrying its topics, or nothing when that object is gone
      FUN`DISPLAY`SOURCEOBJECT:
        value: |-
          if(isdbref(setr(source_object,first(u(%!/FUN`SOURCE`OBJECTS,%0)))),%q<source_object>)
        flags: [funsyntax]
      # %0 every record — the registry and what each entry contributes; a source whose object is gone is said
      # to be missing rather than shown a #-1
      FUN`DISPLAY`SOURCES:
        value: |-
          setq(source_names,u(%!/FUN`GET`SOURCES))[box(u(%!/FUN`DISPLAY`SOURCETABLE,%q<source_names>)%r[rule(Registry)]%r[datacolumns(json(object,rule,json(string,),delim,json(string,%r),nowrap,json(string,1%r2%r4),priority,json(string,1%r2%r1%r1),grow,json(string,%r%r1)),[tone(strong,Source)]%r[iter(%q<source_names>,%i0,%b,%r)],[tone(strong,Object)]%r[iter(%q<source_names>,firstof(num(u(%!/FUN`DISPLAY`SOURCEOBJECT,%i0)),-),%b,%r)],[tone(strong,Name)]%r[iter(%q<source_names>,firstof(name(u(%!/FUN`DISPLAY`SOURCEOBJECT,%i0)),object is missing),%b,%r)],>[tone(strong,Topics)]%r[iter(%q<source_names>,words(u(%!/FUN`GET`OF,%0,%i0)),%b,%r)])],Help sources,,u(%!/FUN`GET`FRAME))]%r+help/source <name>=<object>
        flags: [funsyntax]

      # ── Markdown rendering ──────────────────────────────────────────────────
      # A RENDERMARKUP template is evaluated with the CALLER as executor, so %! is NOT this object
      # inside one — and a manifest {{ref}} is no help either, since it installs as a
      # [v(PM`REFS`NAME)] recall that resolves against the executor too. So no template may reach
      # back into the librarian by either route. A global @function is the way out: it runs as ITS
      # backing object whoever calls it, which is why LINK below uses helplink() — the reader has no
      # Send_OOB for cmdlink(), and the librarian does.
      RENDERMARKUP`H1:
        value: |-
          tone(strong,%0)
        flags: [funsyntax]
      RENDERMARKUP`H2:
        value: |-
          tone(primary,%0)
        flags: [funsyntax]
      RENDERMARKUP`H3:
        value: |-
          tone(secondary,%0)
        flags: [funsyntax]
      RENDERMARKUP`LISTITEM:
        value: |-
          tone(primary,if(%0,%1.,*)) %2
        flags: [funsyntax]
      RENDERMARKUP`QUOTE:
        value: |-
          tone(muted,%0)
        flags: [funsyntax]
      # The engine renders a bare [topic] as a command link running "help <topic>" — right for the
      # engine's corpus, wrong inside +help, where a cross-reference means the game's own topic. %1
      # is that command and %2 says it is one, so the prefix is rewritten and [join] in a topic body
      # is a live "+help join". A topic that means the ENGINE's help says so in prose.
      RENDERMARKUP`LINK:
        value: |-
          if(cand(%2,strmatch(%1,help *)),tone(info,helplink(%0,after(%1,help%b))),%0)
        flags: [funsyntax]

      # helplink(<text>, <topic>) — registered globally by STARTUP, so it runs as this librarian for
      # any caller. It can only ever write a link running "+help <topic>", which is why lending the
      # librarian's Send_OOB to every caller through it lends nothing more.
      # %0 the text · %1 a +help topic — a link running +help <topic>
      FUN`LINK`HELP:
        value: |-
          cmdlink(%0,+help %1)
        flags: [funsyntax]
      AINSTALL: |-
        @trigger %!/STARTUP
      AUPDATE: |-
        @trigger %!/STARTUP
      STARTUP: |-
        @function helplink=%!,FUN`LINK`HELP,2,2

      # ── Shared command steps ────────────────────────────────────────────────
      # %0 the message — a mistake in what was typed, reported as a warning.
      INC`DISPLAY`WARN:
        value: |-
          @pemit %#=notice(HELP,%0,warn)
        flags: [cmdsyntax]
      # %0 the message — a refusal for want of permission, reported as an error.
      INC`DISPLAY`DENIED:
        value: |-
          @pemit %#=notice(HELP,%0,error)
        flags: [cmdsyntax]
      # %0 the message — for an empty result, which is not a failure.
      INC`DISPLAY`INFO:
        value: |-
          @pemit %#=notice(HELP,%0)
        flags: [cmdsyntax]
      # The miss points at the engine's corpus rather than silently rendering it: +help stays able to
      # answer "does this GAME document this?", which a fallthrough would cost.
      # No arguments: %q<help_query> matched nothing.
      INC`DISPLAY`MISS:
        value: |-
          @pemit %#=notice(HELP,No local topic '%q<help_query>'. Try [cmdlink(help %q<help_query>,help %q<help_query>)] or [cmdlink(+help/search %q<help_query>,+help/search %q<help_query>)].,warn)
        flags: [cmdsyntax]
      # A usage line names the switch as typed in full, so a reader who wrote /lis sees /list.
      # No arguments: the usage of switch %q<cmd_switch>.
      INC`DISPLAY`USAGE:
        value: |-
          @pemit %#=notice(HELP,Usage: +help/[u(%!/FUN`GET`USAGE,%q<cmd_switch>)],warn)
        flags: [cmdsyntax]
      # A switch that names none, or several, says which it could be and what there is.
      # No arguments: %q<cmd_typed> is a switch naming no single one.
      INC`DISPLAY`BADSWITCH:
        value: |-
          @pemit %#=notice(HELP,[if(not(strlen(%q<cmd_typed>)),+help/ needs a switch.,if(words(setr(switch_candidates,graball(u(%!/FUN`GET`SWITCHES),%q<cmd_typed>*))),+help/%q<cmd_typed> could be [itemize(iter(%q<switch_candidates>,/%i0,%b,|),|,or)].,+help has no /%q<cmd_typed> switch.))] Switches: [iter(u(%!/FUN`GET`SWITCHES,%#),cmdlink(/%i0,+help/%i0),%b,%b)],warn)
        flags: [cmdsyntax]
      # No arguments: writing help is a staff verb, checked against the caller's flags.
      INC`IS`STAFF:
        value: |-
          @assert orflags(%#,Wr)=@include %!/INC`DISPLAY`DENIED=Staff only.
        flags: [cmdsyntax]
      # Two checks, in the order the name is transformed. First what +help reserves — "/" separates
      # source from topic, "*" and "?" are its wildcards — then whether the derived PATH can be
      # stored, asked of valid(attrname) rather than restated in a character class here.
      #
      # regmatch() is an unanchored search (help REGMATCH), so the reserved test anchors itself to
      # say what the whole name may be made OF — without ^...$ it would match any run of safe
      # characters and pass "BAD/NAME" on the strength of "BAD". CMD`SOURCE anchors the same way.
      # Its brackets are escaped or "[" opens an evaluation bracket instead.
      #
      # topic is the caller's trimmed, upper-cased name, passed by name; this leaves %q<topic_object> and
      # %q<topic_attribute> set.
      # named: topic — validates the staged, trimmed, upper-cased name.
      INC`IS`TOPICNAME:
        value: |-
          @assert strlen(%<topic>)=@include %!/INC`DISPLAY`WARN=Which topic?; @assert regmatch(%<topic>,^\[^*?/\]+$)=@include %!/INC`DISPLAY`WARN=A topic name cannot contain * ? or / — +help reads those as wildcards and the source separator.; think setq(topic_attribute,HELP`[edit(trim(squish(%<topic>)),%b,`)]); @assert valid(attrname,%q<topic_attribute>)=@include %!/INC`DISPLAY`WARN=A topic name has to be storable as an attribute name.; think setq(topic_object,u(%!/SRC`GAME))
        flags: [cmdsyntax]
      # Takes its arguments by name (@include/args), so a title carrying what the reader typed, commas
      # and all, arrives whole and nothing is left behind in a register.
      # named: list the records · title · page · head and tail, the next page being head/<n> tail.
      INC`DO`LISTING:
        value: |-
          @assert words(%<list>)=@include %!/INC`DISPLAY`INFO=Nothing to show.; think setq(page_count,u(%!/FUN`PAGE`COUNT,%<list>)); @assert lte(%<page>,%q<page_count>)=@include %!/INC`DISPLAY`WARN=There [if(gt(%q<page_count>,1),are %q<page_count> pages,is one page)] — you asked for page %<page>.; @pemit %#=uargs(%!/FUN`DISPLAY`LISTING,title,%<title>,list,%<list>,page,%<page>,pages,%q<page_count>,head,%<head>,tail,%<tail>)
        flags: [cmdsyntax]
      # A topic match wins; a source with readable records lists through the same renderer as
      # +help/list. Empty, unavailable and inaccessible sources keep the ordinary topic miss.
      # named: query as typed · page, for several matches.
      INC`DO`SHOW:
        value: |-
          @assert strlen(trim(%<query>))=@include %!/INC`DISPLAY`WARN=Which topic? Try +help for the index.; think setq(help_records,u(%!/FUN`GET`RECORDS))[setq(help_matches,u(%!/FUN`GET`LOOKUP,%q<help_records>,%<query>))]; @break cand(not(words(%q<help_matches>)),words(setr(source_matches,u(%!/FUN`GET`OF,%q<help_records>,lcstr(trim(%<query>))))))={@include/args %!/INC`DO`LISTING=list,%q<source_matches>,title,Topics: [lcstr(trim(%<query>))],head,+help/list,tail,lcstr(trim(%<query>)),page,%<page>}; @assert words(%q<help_matches>)=@include %!/INC`DISPLAY`MISS; @break gt(words(%q<help_matches>),1)={@include/args %!/INC`DO`LISTING=list,%q<help_matches>,title,switch(%q<help_lookup_kind>,command,Topics about [u(%!/FUN`GET`COMMAND,%<query>)],near,Topics with '%q<help_query>' in their names,Topics matching '%q<help_query>'),head,+help,tail,trim(%<query>),page,%<page>}; @assert lte(%<page>,1)=@include %!/INC`DISPLAY`WARN=There is one page — you asked for page %<page>.; @pemit %#=u(%!/FUN`DISPLAY`TOPIC,%q<help_records>,%q<help_matches>)
        flags: [cmdsyntax]

      # ── Commands ────────────────────────────────────────────────────────────
      # Regex patterns: a non-capturing group is written "(?\:" — a bare colon would end the pattern.
      CMD`INDEX:
        value: |-
          $^\+help\s*$:@pemit %#=u(%!/FUN`DISPLAY`INDEX,u(%!/FUN`GET`RECORDS))
        flags: [regexp, cmdsyntax]
      # A page of several matches is asked for as +help/<n> <topic>, through CMD`SWITCH.
      CMD`TOPIC:
        value: |-
          $(?s)^\+help\s+(?<q>.*?)\s*$:@include/args %!/INC`DO`SHOW=query,%<q>,page,1
        flags: [regexp, cmdsyntax]
      # Every switch comes through here, named in full or by any beginning only it has (/l is /list),
      # and runs its INC`SWITCH leaf with %q<cmd_rest>, whatever followed the switch. Matching every switch in
      # one pattern is what lets a mistyped one answer rather than fall through to Huh?. A page is a
      # last switch of digits: +help/list/2, and +help/2 <topic> for a topic several match.
      CMD`SWITCH:
        value: |-
          $(?s)^\+help/(?<sw>[^\s=]*)(?<rest>.*)$:think u(%!/FUN`COMMAND`PARSE,r(sw,args),r(rest,args)); @break cand(strlen(%q<cmd_page>),not(strlen(%q<cmd_typed>)))={@assert u(%!/FUN`IS`PAGE,%q<cmd_page>)=@pemit %#=notice(HELP,Usage: +help%[/<page>%] <topic>,warn); @include/args %!/INC`DO`SHOW=query,%q<cmd_rest>,page,%q<cmd_page>}; @assert strlen(%q<cmd_switch>)=@include %!/INC`DISPLAY`BADSWITCH; @assert cor(not(strlen(%q<cmd_page>)),u(%!/FUN`IS`PAGED,%q<cmd_switch>))=@include %!/INC`DISPLAY`WARN=+help/%q<cmd_switch> takes no page number.; @assert u(%!/FUN`IS`PAGE,setr(cmd_page,strfirstof(%q<cmd_page>,1)))=@include %!/INC`DISPLAY`USAGE; @include %!/INC`SWITCH`[ucstr(%q<cmd_switch>)]
        flags: [regexp, cmdsyntax]
      # %0 the switches as typed, %1 what followed them: sets cmd_typed (the switches without the page),
      # cmd_rest, cmd_page (the page they end with, or nothing) and cmd_switch (the switch they name).
      FUN`COMMAND`PARSE:
        value: |-
          setqm(cmd_typed,lcstr(%0),
          cmd_rest,%1,
          cmd_page,u(%!/FUN`GET`PAGE,%q<cmd_typed>),
          cmd_typed,if(strlen(%q<cmd_page>),if(strmatch(%q<cmd_typed>,*/*),before(%q<cmd_typed>,/)),%q<cmd_typed>),
          cmd_switch,u(%!/FUN`GET`SWITCH,%q<cmd_typed>))
        flags: [funsyntax]
      # The order a reader is shown them in; the staff verbs only to staff.
      # %0 the reader, optional — the switches, the staff ones too when %0 is staff or not given
      FUN`GET`SWITCHES:
        value: |-
          list search sources[if(cor(not(strlen(%0)),orflags(%0,Wr)),%bwrite delete restrict unrestrict source unsource)]
        flags: [funsyntax]
      # %0 a switch as typed — the one it names, whole or by a beginning no other switch has, or nothing
      # · %1 the switches to choose from, optional: this object's own when not given. wiki-reader passes
      # its own.
      FUN`GET`SWITCH:
        value: |-
          if(regmatch(%0,^\[a-z\]+$),if(member(setr(switch_list,strfirstof(%1,u(%!/FUN`GET`SWITCHES))),%0),%0,if(eq(words(setr(switch_candidates,graball(%q<switch_list>,%0*))),1),%q<switch_candidates>)))
        flags: [funsyntax]
      # %0 a switch — how it is typed, after +help/
      FUN`GET`USAGE:
        value: |-
          switch(%0,list,list\[/<page>\] \[<source>\],search,search\[/<page>\] <text>,sources,sources,write,write <topic>=<text>,delete,delete <topic>,restrict,restrict <topic>=<lock>,unrestrict,unrestrict <topic>,source,source <name>=<object>,unsource,unsource <name>)
        flags: [funsyntax]
      # %0 a switch — whether what it lists comes in pages
      FUN`IS`PAGED:
        value: |-
          t(member(list search,%0))
        flags: [funsyntax]
      # The page is the last switch, and digits only: +help/list/2. Nothing when there is none.
      # %0 the switches as typed — the page they end with, or nothing
      FUN`GET`PAGE:
        value: |-
          if(cor(regmatch(%0,^\[0-9\]+$),regmatch(%0,^\[a-z\]+/\[0-9\]+$)),last(%0,/))
        flags: [funsyntax]
      # %q<cmd_rest> — [<source>] · %q<cmd_page> the page.
      INC`SWITCH`LIST:
        value: |-
          think setq(list_source,lcstr(trim(%q<cmd_rest>))); @assert lte(words(%q<list_source>),1)=@include %!/INC`DISPLAY`USAGE; think setq(help_records,u(%!/FUN`GET`RECORDS)); @assert cor(not(strlen(%q<list_source>)),words(u(%!/FUN`GET`OF,%q<help_records>,%q<list_source>)))=@include %!/INC`DISPLAY`WARN=No such help source: %q<list_source>. Try +help/sources.; @include/args %!/INC`DO`LISTING=list,if(strlen(%q<list_source>),u(%!/FUN`GET`OF,%q<help_records>,%q<list_source>),%q<help_records>),title,Topics[if(strlen(%q<list_source>),: %q<list_source>)],head,+help/list,tail,%q<list_source>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # %q<cmd_rest> — <text> · %q<cmd_page> the page.
      INC`SWITCH`SEARCH:
        value: |-
          think setq(search_text,lcstr(trim(%q<cmd_rest>))); @assert strlen(%q<search_text>)=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`DO`LISTING=list,u(%!/FUN`GET`SEARCHED,u(%!/FUN`GET`RECORDS),%q<search_text>),title,Search: %q<search_text>,head,+help/search,tail,%q<search_text>,page,%q<cmd_page>
        flags: [cmdsyntax]
      # %q<cmd_rest> — nothing.
      INC`SWITCH`SOURCES:
        value: |-
          @assert not(strlen(trim(%q<cmd_rest>)))=@include %!/INC`DISPLAY`USAGE; @pemit %#=u(%!/FUN`DISPLAY`SOURCES,u(%!/FUN`GET`RECORDS))
        flags: [cmdsyntax]
      # attrib_set() rather than "&": the attribute NAME is computed here, and @set obj/attr= sets
      # attribute FLAGS on this engine rather than a value, so it is not an option at all. The body
      # arrives already evaluated once — the line staff typed was evaluated on its way in, exactly
      # as it is for "&attr obj=..." — and a %q substitution is not re-scanned, so what lands in the
      # attribute is what they typed. Staff escape anything meant for the reader; see HELP`WRITE.
      #
      # attrib_set() is a side-effect function, so a game that sets function_side_effects=no loses
      # +help/write. That is the trade for a computed attribute name; nothing else here needs it.
      # %q<cmd_rest> — <topic>=<text>.
      INC`SWITCH`WRITE:
        value: |-
          @include %!/INC`IS`STAFF; @assert cand(strmatch(%q<cmd_rest>,*=*),strlen(trim(before(%q<cmd_rest>,=))))=@include %!/INC`DISPLAY`USAGE; think setq(topic,ucstr(trim(before(%q<cmd_rest>,=)))); @include/args %!/INC`IS`TOPICNAME=topic,%q<topic>; @assert strlen(setr(topic_body,after(%q<cmd_rest>,=)))=@include %!/INC`DISPLAY`WARN=A topic needs a body. Use +help/delete to remove one.; think attrib_set(%q<topic_object>/%q<topic_attribute>,%q<topic_body>); @pemit %#=notice(HELP,Wrote game/[lcstr(edit(squish(%q<topic>),%b,%b))].,ok)
        flags: [cmdsyntax]
      # %q<cmd_rest> — <topic>.
      INC`SWITCH`DELETE:
        value: |-
          @include %!/INC`IS`STAFF; @assert strlen(setr(topic,ucstr(trim(%q<cmd_rest>))))=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`IS`TOPICNAME=topic,%q<topic>; @assert strlen(get(%q<topic_object>/%q<topic_attribute>))=@include %!/INC`DISPLAY`WARN=No game topic by that name.; think attrib_set(%q<topic_object>/%q<topic_attribute>); @pemit %#=notice(HELP,Deleted game/[lcstr(edit(squish(%q<topic>),%b,%b))].,ok)
        flags: [cmdsyntax]
      # A game topic's lock is a LOCK leaf on Game Help at the topic's path, as a package declares
      # one. The key is tried on the writer first, so one that does not parse is refused rather than
      # stored to hide the topic from everyone.
      # %q<cmd_rest> — <topic>=<lock>.
      INC`SWITCH`RESTRICT:
        value: |-
          @include %!/INC`IS`STAFF; @assert cand(strmatch(%q<cmd_rest>,*=*),strlen(trim(before(%q<cmd_rest>,=))),strlen(setr(topic_lock,trim(after(%q<cmd_rest>,=)))))=@include %!/INC`DISPLAY`USAGE; think setq(topic,ucstr(trim(before(%q<cmd_rest>,=)))); @include/args %!/INC`IS`TOPICNAME=topic,%q<topic>; @assert words(lattr(%q<topic_object>/%q<topic_attribute>*))=@include %!/INC`DISPLAY`WARN=No game topic by that name.; @assert not(strmatch(testlock(%q<topic_lock>,%#),#-1*))=@include %!/INC`DISPLAY`WARN=That is not a lock: %q<topic_lock>; think attrib_set(%q<topic_object>/LOCK`[after(%q<topic_attribute>,`)],%q<topic_lock>); @pemit %#=notice(HELP,game/[lcstr(edit(squish(%q<topic>),%b,%b))] is now shown only to: %q<topic_lock>,ok)
        flags: [cmdsyntax]
      # %q<cmd_rest> — <topic>.
      INC`SWITCH`UNRESTRICT:
        value: |-
          @include %!/INC`IS`STAFF; @assert strlen(setr(topic,ucstr(trim(%q<cmd_rest>))))=@include %!/INC`DISPLAY`USAGE; @include/args %!/INC`IS`TOPICNAME=topic,%q<topic>; think setq(topic_lock_attribute,LOCK`[after(%q<topic_attribute>,`)]); @assert strlen(get(%q<topic_object>/%q<topic_lock_attribute>))=@include %!/INC`DISPLAY`WARN=That game topic has no lock.; think attrib_set(%q<topic_object>/%q<topic_lock_attribute>); @pemit %#=notice(HELP,game/[lcstr(edit(squish(%q<topic>),%b,%b))] has no lock of its own now.,ok)
        flags: [cmdsyntax]
      # The escape hatch for a system no package installed. A package that ships a manifest should
      # attach its SRC leaf instead, so that uninstalling it takes the registration with it.
      # %q<cmd_rest> — <name>=<object>.
      INC`SWITCH`SOURCE:
        value: |-
          @include %!/INC`IS`STAFF; @assert cand(strlen(trim(before(%q<cmd_rest>,=))),strlen(trim(after(%q<cmd_rest>,=))))=@include %!/INC`DISPLAY`USAGE; think setq(source_name,ucstr(trim(before(%q<cmd_rest>,=)))); @assert regmatch(%q<source_name>,^\[A-Z0-9_.-\]+$)=@include %!/INC`DISPLAY`WARN=A source name is made of letters and digits and _ . -; @assert isdbref(setr(source_object,locate(%#,trim(after(%q<cmd_rest>,=)),*)))=@include %!/INC`DISPLAY`WARN=I cannot find that object.; think attrib_set(%!/SRC`%q<source_name>,objid(%q<source_object>)); @pemit %#=notice(HELP,[lcstr(%q<source_name>)] now reads help from [name(%q<source_object>)] - [words(lattr(%q<source_object>/HELP`**))] topics.,ok)
        flags: [cmdsyntax]
      # %q<cmd_rest> — <name>.
      INC`SWITCH`UNSOURCE:
        value: |-
          @include %!/INC`IS`STAFF; @assert strlen(setr(source_name,ucstr(trim(%q<cmd_rest>))))=@include %!/INC`DISPLAY`USAGE; @assert strlen(get(%!/SRC`%q<source_name>))=@include %!/INC`DISPLAY`WARN=No such help source: [lcstr(%q<source_name>)]; think attrib_set(%!/SRC`%q<source_name>); @pemit %#=notice(HELP,Dropped help source [lcstr(%q<source_name>)].,ok)
        flags: [cmdsyntax]

  # ---- this package's own topics ---------------------------------------------
  # A source like any other: an ordinary object with a HELP tree, pointed at by SRC`PLUS-HELP. It is
  # deliberately NOT the librarian — the librarian carries the registry, the commands and the
  # rendering, and no content at all, so that reading a topic is one code path whoever wrote it.
  - ref: plus_help_own
    type: thing
    name: Help Librarian's Help
    attributes:
      HELP:
        value: |-
          Reading and writing this game's help.
      # The front page +help renders above the source list. A game replaces it wholesale with
      # `+help/write index=...`: the game source outranks a package's, so its own "index" wins the
      # name and no other mechanism is needed.
      HELP`INDEX:
        value: |-
          **`+help` is this game's own help** — what the systems installed here do, and whatever
          its staff have written down. The server's own commands are documented separately, under
          `help`.

          Everything below is what this game actually has installed. Read a topic by name:
          `+help scene`, or `+help scene join` for a topic several words long.

          Staff: this page is itself a topic. Replace it with `+help/write index=<text>`, and add
          your own with `+help/write <topic>=<text>` — see \[write\].
      HELP`HELP:
        value: |-
          `+help` is this game's own help: the topics its installed packages carry, and the ones its
          staff have written. The engine's built-in commands are documented separately, under `help`.

          ## Reading

          - `+help` — a compact grid of source links
          - `+help <topic>` — a topic; `*` and `?` wildcard, so `+help scene*` works
          - `+help <source>` — its topic list when no topic matches the name
          - `+help <source>/<topic>` — when two sources claim the same name
          - `+help/list \[<source>\]` — every topic, or one source's
          - `+help/search <text>` — topic names and bodies containing the text
          - `+help/sources` — source descriptions, registry objects and topic counts

          A topic name can be several words: `+help scene join`. A command finds the topic that
          shows it, so `+help +scene/join`, `+help event` and `+help +events` all work. A word that
          is no topic's name finds the topics whose names start with it or hold it: `+help join`.
          When several match, they are listed, and `+help/2 <topic>` shows the next page.

          A long listing comes in pages, and the page is a last switch: `+help/list/2`,
          `+help/search/3 combat`. Without one, you get the first.

          A switch can be cut short to any beginning no other switch has: `+help/l` is `+help/list`.
      HELP`SEARCH:
        value: |-
          `+help/search <text>` lists every topic whose name or body contains `<text>`, as stored —
          the search reads bodies without evaluating them, so it matches what an author typed rather
          than what a reader would see.

          `<text>` may contain `*` and `?`. Long results page: `+help/search/2 combat`.

          To narrow by source instead, use `+help/list <source>`.
      SEE:
        value: |-
          Cross-references, one leaf per topic at the same path it sits at under HELP. A
          "|"-separated list of topic names, bare or qualified. Subtopics are NOT listed here:
          those come from the tree.
        flags: [no_command]
      SEE`HELP:
        value: |-
          write|search|sources|locks
      SEE`SEARCH:
        value: |-
          help|write
      SEE`SOURCES:
        value: |-
          write|help
      SEE`WRITE:
        value: |-
          sources|help|locks
      SEE`LOCKS:
        value: |-
          write|sources
      HELP`WRITE:
        value: |-
          Staff write this game's own topics in-game, rather than by editing a file:

          - `+help/write <topic>=<text>` — create or replace a topic
          - `+help/delete <topic>` — remove one
          - `+help/restrict <topic>=<lock>` — show it, and its subtopics, only to those passing the lock
          - `+help/unrestrict <topic>` — take its own lock off; a lock above it still applies

          A topic name is words of letters, digits, and `_ . -`. Several words make a multi-word
          topic: `+help/write house rules=...` is then read by `+help house rules`.

          `<text>` is markdown, and it is **evaluated when it is read**, so a topic can carry
          colour or the reader's own name: `\[tone(info,...)\]` and `\[name(%%#)\]` both work. Because it
          is evaluated, writing help is a staff verb.

          The line you type is evaluated once on its way in, exactly as `&attr obj=...` is, so you
          choose what happens when: leave code unescaped and it resolves as you type it, escape it
          and it resolves for each reader instead. A backslash before a `\[`, `\(` or `\)` shows the
          character; `%%%%` shows a `%%`.

          A topic's name in brackets is a clickable link to it, once the brackets reach the reader.
          They are escaped twice for that: typing `\\\\\\\[write\\\\\\\]` stores `\\\[write\\\]`, which reads as
          a link to write.

          Game-authored topics live in the source `game`, and a `game` topic outranks a package's
          when both claim the same name.
      HELP`SOURCES:
        value: |-
          The front page lists source names as links to their topics. `+help/sources` describes what each
          covers and shows the registry objects and topic counts, including empty or missing sources.

          **Every source is an object with a `HELP` tree**, including this package's own topics and
          the game's. A package registers its object with the librarian in its manifest. The package
          manager writes that registration on install and clears it on uninstall, so a package's
          topics appear and disappear with the package itself.

          **The game keeps the rest.** House rules, policy, how to apply — anything belonging to no
          package — live on the Game Help object and are written with \[write\].

          For a system no package installed, staff can register it by hand:

          - `+help/source <name>=<object>` — read `<object>`'s HELP tree as source `<name>`
          - `+help/unsource <name>` — stop reading it

      HELP`LOCKS:
        value: |-
          A topic can be for some readers only. A reader who fails its lock never meets it: not on the
          front page, in a listing, a search or a see-also line, nor by typing its name.

          A source declares its locks in a `LOCK` tree on the same object as its `HELP` tree:

          - `LOCK` locks every topic the object carries, which hides the whole source.
          - `` LOCK`<path> `` locks the topic at `` HELP`<path> `` and every subtopic below it.

          The value is a lock key, as `@lock` takes: `perm^config.admin`, `role^wizard|role^royalty`
          or `flag^builder`. A key that cannot be read hides the topic from everyone.

          ```
          &LOCK`CONFIG Config Help=perm^config.admin
          ```

          Output: nothing; `+help config` and its subtopics are now hidden from anyone without
          `config.admin`.

          Staff lock the game's own topics with `+help/restrict <topic>=<lock>` and free one with
          `+help/unrestrict <topic>`. A reader who passes a lock sees `Shown only to:` and the lock
          at the foot of the topic.

  # ---- the game's own topics --------------------------------------------------
  # Ships empty but for its description: +help/write fills it in-game. The manifest manages only the
  # HELP root, so a staff-written leaf is never drift against the package baseline and an upgrade
  # never overwrites one. no_command propagates from the root, so a topic body that happens to begin
  # with "$" cannot become an accidental $-command.
  - ref: game_help
    type: thing
    name: Game Help
    # MISTRUST: a topic body runs as this object, and without it this object would control every
    # other object the Package Manager owns (the librarian among them), which royalty do not.
    flags: [MISTRUST]
    attributes:
      HELP:
        value: |-
          This game's own help: house rules, policy, and anything belonging to no package.
        flags: [no_command]

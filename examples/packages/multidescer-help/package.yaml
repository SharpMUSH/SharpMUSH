format: "1.20"
package: multidescer-help
title: "Multi-descer: +help topics"
version: 1.0.0
authors: [SharpMUSH]
description: "Puts the Multi-descer topics into +help: registers the multidescer package's help with the +help librarian."
license: MIT
homepage: https://github.com/SharpMUSH/SharpMUSH
keywords: [desc, help, bridge]
category: Characters
bridge: true
requires_server: ">=0.1"

# A bridge: it joins two packages that do not know about each other. multidescer keeps its topics on its own help
# object, and plus-help reads any object registered with its librarian. This package is only that registration;
# uninstalling it takes the topics out of +help, and neither package changes.
depends:
  - package: multidescer
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/multidescer/
      branch: main
  - package: plus-help
    version: ">=1.0"
    source:
      repo: https://github.com/SharpMUSH/SharpMUSH
      path: examples/packages/plus-help/
      branch: main

objects:
  - ref: multidescer_help_registration
    target: "{{plus-help/librarian}}"
    attributes:
      SRC`MULTIDESCER: |-
        {{multidescer/multidescer_help}}

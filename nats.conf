# NATS server configuration shared by every SharpMUSH deployment. The Kubernetes manifest
# carries the same value in a ConfigMap (kubernetes/dev-k8s.yaml) because a pod cannot
# bind-mount a file from the repo.
#
# max_payload is a SERVER-level limit and has no command-line flag — it can only be set
# from a config file, which is the whole reason this file exists. NatsOptions.MaxMsgSize
# sets the JetStream *stream* limit to the same 6 MB, but a stream limit is never reached:
# the server rejects an oversized publish before the message ever gets to the stream. Left
# at the 1 MB default, a single `@wiki` page of syntax-highlighted markup serialises past
# it and the command fails with NatsPayloadTooLargeException.
#
# Keep this value in sync with:
#   SharpMUSH.Messaging/NATS/NatsOptions.cs           (MaxMsgSize)
#   SharpMUSH.Messaging/NATS/Strategy/NatsTestContainerStrategy.cs (MaxPayloadBytes)
#   SharpMUSH.Tests.Infrastructure/NatsTestServer.cs  (MaxPayloadBytes)
#   SharpMUSH.Benchmarks/BenchmarkHelpers.cs          (MaxPayloadBytes)
max_payload: 6291456

# JetStream's server-wide storage budget. Each SharpMUSH stream carries its own byte budget
# (bus streams SHARPMUSH-CS / SHARPMUSH-MS: SHARPMUSH_NATS_MAX_BYTES, 512 MiB each; browser replay
# TERMINAL_REPLAY_V2: Replay:MaxBytes, 2 GiB), plus the small connection-state, resume-token and
# descriptor KV buckets. This caps the total so a forgotten stream or bucket cannot fill the disk:
# keep it above the sum of the stream budgets and below the volume it lives on (the Kubernetes
# PVC is 8Gi). The broker refuses writes past it, which shows up as rejected publications
# (sharpmush.messaging.publish.rejected) and in /jsz on the monitoring port.
#
# The command line's -js / -sd flags still enable JetStream and choose the store directory; these
# limits merge with them. Keep in sync with kubernetes/dev-k8s.yaml.
jetstream {
  max_memory_store: 64MB
  max_file_store: 6GB
}

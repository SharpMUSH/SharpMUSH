name: Release preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Intended release version without v (for example 1.2.3 or 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release preflight
        run: python3 -m unittest discover -s .github/scripts -p test_release_preflight.py -v
      - name: Check candidate metadata
        env:
          INTENDED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 .github/scripts/release_preflight.py "$INTENDED_VERSION"
          else
            python3 .github/scripts/release_preflight.py
          fi
          echo "Validated checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

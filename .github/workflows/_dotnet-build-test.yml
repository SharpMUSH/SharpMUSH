name: .NET Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      # Folder mode, not solution mode: `dotnet format` cannot load the solution on the
      # .NET 11 SDK (the MSBuild build host crashes), and whitespace rules are purely
      # syntactic anyway. Takes ~2s for the whole repo.
      #
      # To fix locally, run the same command without --verify-no-changes. The formatter
      # needs two passes to converge, so run it until it reports no changes.
      - name: Verify formatting matches .editorconfig
        run: |
          dotnet format whitespace --folder . \
            --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**' \
            --verify-no-changes || {
              echo "::error::Formatting does not match .editorconfig. Run: dotnet format whitespace --folder . --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**'"
              exit 1
            }

      # The MarkupString packages promise IsAotCompatible. Publishing the smoke app with
      # PublishAot is the only thing that proves it: the trimmer roots all three assemblies, so a
      # trim-hostile corner anywhere in their public surface shows up as an IL2xxx/IL3xxx warning
      # here rather than in a consumer's app. Running the binary then checks the library still
      # renders and round-trips once ILC has been over it.
      #
      # This job, not `build`: it is a fast standalone publish that needs no database, and the
      # format job is already the cheap "does the tree hold together" gate.
      - name: AOT smoke test
        shell: bash
        run: |
          dotnet publish SharpMUSH.MarkupString.AotSmoke -c Release -r linux-x64 \
            -p:SkipFormatVerification=true 2>&1 | tee aot.log
          if grep -E 'IL[0-9]{4}' aot.log; then
            echo "::error::Trim/AOT warnings from the MarkupString packages (see the lines above)"
            exit 1
          fi
          ./SharpMUSH.MarkupString.AotSmoke/bin/Release/net10.0/linux-x64/publish/SharpMUSH.MarkupString.AotSmoke

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

  test:
    needs: [build]
    runs-on: ubuntu-latest
    # Backstop only. It must clear the retry budget below (3 x 20 minutes) plus ~3 minutes of
    # checkout, restore and build, or it would truncate the third attempt — reintroducing the
    # killed-mid-run failure this timeout exists to prevent.
    timeout-minutes: 70
    strategy:
      matrix:
        database: [arangodb, memgraph, surrealdb]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          # The surrealdb leg runs 6-10 minutes depending on runner contention — it has been in that
          # band since July, and arangodb/memgraph sit at 5.5-7.5 on the same suite. A 10 minute
          # timeout was inside that range, so a slow-but-healthy run got killed rather than finishing.
          #
          # That kill is not a clean abort: it disposes the host's IServiceProvider underneath the
          # tests still running, and every in-flight parse then fails resolving a service. Run
          # 31890423646 reported 98 failures, all ObjectDisposedException/BeforeTest hook failures
          # stamped one second past the ten minute mark. Nothing was wrong with the tests.
          #
          # 20 minutes puts the wall clear of the band instead of inside it.
          timeout_minutes: 20
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests --no-build --verbosity normal -- --output Detailed

      - name: Publish Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry.md ]; then
            cat test-telemetry.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Telemetry Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-${{ matrix.database }}
          path: test-telemetry.md
          if-no-files-found: ignore

  test-bunit:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: BUnit Tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.BUnit --no-build --verbosity normal -- --output Detailed

  test-integration:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [arangodb, memgraph, surrealdb]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: Integration Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry-integration.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.Integration --no-build --verbosity normal -- --output Detailed

      - name: Publish Integration Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry-integration.md ]; then
            cat test-telemetry-integration.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Integration Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Integration Telemetry Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-integration-${{ matrix.database }}
          path: test-telemetry-integration.md
          if-no-files-found: ignore

      - name: Upload Generated Myrddin BBS Package Manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myrddin-bbs-package-${{ matrix.database }}
          path: '**/MyrddinBBS_GeneratedPackage.yaml'
          if-no-files-found: warn

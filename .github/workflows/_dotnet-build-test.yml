name: .NET Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Folder mode, not solution mode. Whitespace rules are purely syntactic, so folder
      # mode loses nothing, covers every file and takes ~2s for the whole repo. Solution
      # mode takes ~14s and still exits 0 when MSBuild fails to load a project, which
      # would silently drop that project's files out of the gate.
      #
      # To fix locally, run the same command without --verify-no-changes. The formatter
      # needs two passes to converge, so run it until it reports no changes.
      - name: Verify formatting matches .editorconfig
        run: |
          dotnet format whitespace --folder . \
            --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**' \
            --verify-no-changes || {
              echo "::error::Formatting does not match .editorconfig. Run: dotnet format whitespace --folder . --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**'"
              exit 1
            }

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Test portal startup helpers
        run: node --test tools/client-tests/*.test.mjs

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: Package test build outputs
        run: bash .github/scripts/pack-test-build.sh "$RUNNER_TEMP/test-build"

      - name: Upload unit test build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SharpMUSH.Tests
          path: ${{ runner.temp }}/test-build/SharpMUSH.Tests.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload BUnit test build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SharpMUSH.Tests.BUnit
          path: ${{ runner.temp }}/test-build/SharpMUSH.Tests.BUnit.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload scene plugin test build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SharpMUSH.Tests.ScenePlugin
          path: ${{ runner.temp }}/test-build/SharpMUSH.Tests.ScenePlugin.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload integration test build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SharpMUSH.Tests.Integration
          path: ${{ runner.temp }}/test-build/SharpMUSH.Tests.Integration.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload shared test build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-build-support
          path: ${{ runner.temp }}/test-build/test-build-support.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  test:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Detailed console output and TRX retain results without the optional HTML report.
      TUNIT_DISABLE_HTML_REPORTER: "true"
    # Backstop only. It must clear the retry budget below (2 x 30 minutes) plus ~3 minutes of
    # checkout and artifact download, or it would truncate the second attempt — reintroducing the
    # killed-mid-run failure this timeout exists to prevent.
    timeout-minutes: 70
    strategy:
      matrix:
        # SurrealDB execution is paused while provider cost and test isolation are addressed.
        database: [lightning]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Download test build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SharpMUSH.Tests
          path: ${{ runner.temp }}/test-build

      - name: Download shared test build support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-build-support
          path: ${{ runner.temp }}/test-build

      - name: Restore build outputs and verify cached dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/test-build/test-build-support.tar.gz"
          tar -xzf "$RUNNER_TEMP/test-build/SharpMUSH.Tests.tar.gz"
          python3 .github/scripts/ensure-test-packages.py

      - name: Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          # Retain the retry budget while test isolation is repaired.
          timeout_minutes: 30
          max_attempts: 2
          # Exclude standalone embedded SurrealDB fixtures as well as the disabled provider matrix entry.
          # Keep the existing concurrency and execution deadlines.
          command: dotnet run --project SharpMUSH.Tests --no-build --no-restore --verbosity normal -- --output Detailed --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/unit" --maximum-parallel-tests 8 --treenode-filter '/*/(*)&(!SharpMUSH.Tests.Database.SurrealDB)/(*)&(!Surreal*)/*'

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-unit-${{ matrix.database }}
          path: TestResults/unit/**/*.trx
          retention-days: 7
          if-no-files-found: warn

      - name: Publish Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry.md ]; then
            cat test-telemetry.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Telemetry Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-telemetry-${{ matrix.database }}
          path: test-telemetry.md
          if-no-files-found: ignore

  test-bunit:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Detailed console output and TRX retain results without the optional HTML report.
      TUNIT_DISABLE_HTML_REPORTER: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Download test build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SharpMUSH.Tests.BUnit
          path: ${{ runner.temp }}/test-build

      - name: Download shared test build support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-build-support
          path: ${{ runner.temp }}/test-build

      - name: Restore build outputs and verify cached dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/test-build/test-build-support.tar.gz"
          tar -xzf "$RUNNER_TEMP/test-build/SharpMUSH.Tests.BUnit.tar.gz"
          python3 .github/scripts/ensure-test-packages.py

      - name: BUnit Tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.BUnit --no-build --no-restore --verbosity normal -- --output Detailed --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/bunit"

      - name: Upload bunit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-bunit
          path: TestResults/bunit/**/*.trx
          retention-days: 7
          if-no-files-found: warn

  test-scene-plugin:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Detailed console output and TRX retain results without the optional HTML report.
      TUNIT_DISABLE_HTML_REPORTER: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Download test build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SharpMUSH.Tests.ScenePlugin
          path: ${{ runner.temp }}/test-build

      - name: Download shared test build support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-build-support
          path: ${{ runner.temp }}/test-build

      - name: Restore build outputs and verify cached dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/test-build/test-build-support.tar.gz"
          tar -xzf "$RUNNER_TEMP/test-build/SharpMUSH.Tests.ScenePlugin.tar.gz"
          python3 .github/scripts/ensure-test-packages.py

      # Keep provider-independent scene coverage; the membership fixture boots embedded SurrealDB.
      - name: Scene plugin tests (without SurrealDB)
        run: dotnet run --project SharpMUSH.Tests.ScenePlugin --no-build --no-restore -- --output Detailed --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/scene-plugin" --treenode-filter '/*/*/(*)&(!SurrealSceneMembershipTests)/*'

      - name: Upload scene-plugin test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-scene-plugin
          path: TestResults/scene-plugin/**/*.trx
          retention-days: 7
          if-no-files-found: warn

  test-integration:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      # Detailed console output and TRX retain results without the optional HTML report.
      TUNIT_DISABLE_HTML_REPORTER: "true"
    strategy:
      matrix:
        # SurrealDB execution is paused while provider cost and test isolation are addressed.
        database: [lightning]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Download test build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: SharpMUSH.Tests.Integration
          path: ${{ runner.temp }}/test-build

      - name: Download shared test build support
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-build-support
          path: ${{ runner.temp }}/test-build

      - name: Restore build outputs and verify cached dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/test-build/test-build-support.tar.gz"
          tar -xzf "$RUNNER_TEMP/test-build/SharpMUSH.Tests.Integration.tar.gz"
          python3 .github/scripts/ensure-test-packages.py

      - name: Integration Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry-integration.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.Integration --no-build --no-restore --verbosity normal -- --output Detailed --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults/integration" --maximum-parallel-tests 8

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-integration-${{ matrix.database }}
          path: TestResults/integration/**/*.trx
          retention-days: 7
          if-no-files-found: warn

      - name: Publish Integration Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry-integration.md ]; then
            cat test-telemetry-integration.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Integration Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Integration Telemetry Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-telemetry-integration-${{ matrix.database }}
          path: test-telemetry-integration.md
          if-no-files-found: ignore

      - name: Upload Generated Myrddin BBS Package Manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: myrddin-bbs-package-${{ matrix.database }}
          path: '**/MyrddinBBS_GeneratedPackage.yaml'
          if-no-files-found: warn

name: .NET Build and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Folder mode, not solution mode. Whitespace rules are purely syntactic, so folder
      # mode loses nothing, covers every file and takes ~2s for the whole repo. Solution
      # mode takes ~14s and still exits 0 when MSBuild fails to load a project, which
      # would silently drop that project's files out of the gate.
      #
      # To fix locally, run the same command without --verify-no-changes. The formatter
      # needs two passes to converge, so run it until it reports no changes.
      - name: Verify formatting matches .editorconfig
        run: |
          dotnet format whitespace --folder . \
            --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**' \
            --verify-no-changes || {
              echo "::error::Formatting does not match .editorconfig. Run: dotnet format whitespace --folder . --exclude '**/bin/**' --exclude '**/obj/**' --exclude '**/TestResults/**'"
              exit 1
            }

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Test portal startup helpers
        run: node --test tools/client-tests/*.test.mjs

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

  test:
    needs: [build]
    runs-on: ubuntu-latest
    # Backstop only. It must clear the retry budget below (2 x 30 minutes) plus ~3 minutes of
    # checkout, restore and build, or it would truncate the second attempt — reintroducing the
    # killed-mid-run failure this timeout exists to prevent.
    timeout-minutes: 70
    strategy:
      matrix:
        # SurrealDB execution is paused while provider cost and test isolation are addressed.
        database: [lightning]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          # Retain the retry budget while test isolation is repaired.
          timeout_minutes: 30
          max_attempts: 2
          # Exclude standalone embedded SurrealDB fixtures as well as the disabled provider matrix entry.
          # Keep the existing concurrency and execution deadlines.
          command: dotnet run --project SharpMUSH.Tests --no-build --verbosity normal -- --output Detailed --maximum-parallel-tests 8 --parallelism-strategy fixed --treenode-filter '/*/(*)&(!SharpMUSH.Tests.Database.SurrealDB)/(*)&(!Surreal*)/*'

      - name: Publish Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry.md ]; then
            cat test-telemetry.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Telemetry Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-${{ matrix.database }}
          path: test-telemetry.md
          if-no-files-found: ignore

  test-bunit:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: BUnit Tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.BUnit --no-build --verbosity normal -- --output Detailed

  test-scene-plugin:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Keep provider-independent scene coverage; the membership fixture boots embedded SurrealDB.
      - name: Scene plugin tests (without SurrealDB)
        run: dotnet run --project SharpMUSH.Tests.ScenePlugin -p:SkipFormatVerification=true -- --output Detailed --treenode-filter '/*/*/(*)&(!SurrealSceneMembershipTests)/*'

  test-integration:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # SurrealDB execution is paused while provider cost and test isolation are addressed.
        database: [lightning]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:SkipFormatVerification=true

      - name: Integration Test (${{ matrix.database }})
        uses: nick-fields/retry@v4
        env:
          SHARPMUSH_ENABLE_TEST_TELEMETRY: true
          SHARPMUSH_TELEMETRY_OUTPUT_PATH: ${{ github.workspace }}/test-telemetry-integration.md
          SHARPMUSH_DATABASE_PROVIDER: ${{ matrix.database }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: dotnet run --project SharpMUSH.Tests.Integration --no-build --verbosity normal -- --output Detailed --maximum-parallel-tests 8 --parallelism-strategy fixed

      - name: Publish Integration Telemetry to Summary
        if: always()
        run: |
          if [ -f test-telemetry-integration.md ]; then
            cat test-telemetry-integration.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📊 Integration Test Telemetry Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No telemetry data was recorded." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Integration Telemetry Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-telemetry-integration-${{ matrix.database }}
          path: test-telemetry-integration.md
          if-no-files-found: ignore

      - name: Upload Generated Myrddin BBS Package Manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: myrddin-bbs-package-${{ matrix.database }}
          path: '**/MyrddinBBS_GeneratedPackage.yaml'
          if-no-files-found: warn

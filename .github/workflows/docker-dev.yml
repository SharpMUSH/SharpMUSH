name: Publish Dev Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Force-publish images regardless of detected changes (recovery for a failed
          publish run or refresh independently updated base images).
        type: choice
        options: [all, server, connectionserver, socketserver]
        default: all

permissions:
  contents: read

jobs:
  quiet-period:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only replace the waiting job. Active validation/publication stays intact.
    concurrency:
      group: docker-dev-quiet-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Wait for ten minutes without a newer push
        if: github.event_name == 'push'
        run: sleep 600

  publish:
    needs: [quiet-period]
    # Serialize validation and publication as one unit, retaining only the latest
    # pending call. This group is separate from the cancellable quiet-period job.
    concurrency:
      group: docker-dev-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/_docker-dev-publish.yml
    with:
      publish: ${{ inputs.publish || 'all' }}
    secrets: inherit

name: Publish Dev Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Force-publish images regardless of detected changes (recovery for a failed
          publish run or refresh independently updated base images).
        type: choice
        options: [all, server, renderer, socketserver, edge, allinone]
        default: all

permissions:
  contents: read

jobs:
  quiet-period:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only replace the waiting job. Active validation/publication stays intact.
    concurrency:
      group: docker-dev-quiet-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    steps:
      - name: Wait for ten minutes without a newer push
        if: github.event_name == 'push'
        run: sleep 600

  publish:
    needs: [quiet-period]
    # Serialize validation and publication as one unit with prerelease promotion.
    # Retain pending calls: a delayed prerelease must not cancel a newer main build.
    # GitHub allows 100 pending jobs; arrivals beyond that cap need a manual rerun.
    # Keep this policy in sync with docker-publish.yml move-dev.
    concurrency:
      group: docker-dev-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/_docker-dev-publish.yml
    with:
      publish: ${{ inputs.publish || 'all' }}
    secrets: inherit

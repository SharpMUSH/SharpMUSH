name: Publish Docker Images

# Publishing a GitHub Release whose tag is vX.Y.Z (Releases > Draft a new release) builds the
# images at that tag and pushes them as :X.Y.Z, plus :X.Y, :X and :latest while it is the newest
# release under each (.github/scripts/release_images.py). A prerelease pushes only :X.Y.Z-rc.N.
# Releases with other tags (plugin-nuget/v*, sharpmush-templates/v*) are left to their own workflows.
on:
  release:
    types: [published]
  workflow_dispatch:  # Run on a v* tag to publish that release again

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/_dotnet-build-test.yml

  build-and-push:
    needs: [build-and-test]
    runs-on: ubuntu-latest
    # Releases published close together push one after the other, so the moving tags end on the
    # newest. GitHub keeps one run waiting per group: a third release published while one runs and
    # one waits replaces the waiting one, which then needs a manual run on its tag. Set on the job,
    # so releases this workflow skips never join the queue.
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # arm64 images run on Oracle Cloud's free tier and ARM servers. The .NET build stages run on
      # the runner's own platform; emulation only carries each image's last few steps.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag is the version: v1.0.0 builds 1.0.0 (passed into the server as SharpMUSHVersion, which
      # version(), @version and MSSP report). A release event checks out its tag; a manual run must be
      # started on one.
      - name: Read version from tag
        id: meta
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow on a v* tag; $GITHUB_REF is not one."
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          # A manual run carries no release event: read the tag's published release instead.
          if [[ -z "$PRERELEASE" ]]; then
            if ! PRERELEASE=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" |
                python3 -c 'import json, sys; print(str(json.load(sys.stdin)["prerelease"]).lower())'); then
              echo "::error::v$VERSION has no published GitHub Release; publish one instead of running this by hand."
              exit 1
            fi
          fi
          if [[ "$PRERELEASE" == true && "$VERSION" != *-* ]]; then
            echo "::error::A prerelease's tag needs a suffix, like v$VERSION-rc.1, so it cannot move :latest."
            exit 1
          fi
          python3 .github/scripts/release_images.py tags "$VERSION"

      - name: Build and push SharpMUSH Server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          build-args: |
            SHARPMUSH_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.server }}
          labels: |
            org.opencontainers.image.title=SharpMUSH Server
            org.opencontainers.image.description=Modern MUSH server implementation
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push rendering worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./SharpMUSH.RenderingWorker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.renderer }}
          labels: |
            org.opencontainers.image.title=SharpMUSH Renderer
            org.opencontainers.image.description=Rendering worker for SharpMUSH
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SocketServer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./SharpMUSH.SocketServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.socketserver }}
          labels: |
            org.opencontainers.image.title=SharpMUSH SocketServer
            org.opencontainers.image.description=Stable socket owner for SharpMUSH
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push edge image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./deploy/fly/Dockerfile
          target: edge
          push: true
          pull: true
          build-args: |
            SHARPMUSH_IMAGE_TAG=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.edge }}
          labels: |
            org.opencontainers.image.title=SharpMUSH edge
            org.opencontainers.image.description=Caddy, NATS and the socket server, for split one-container hosts
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./deploy/fly/Dockerfile
          push: true
          pull: true
          build-args: |
            SHARPMUSH_IMAGE_TAG=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.allinone }}
          labels: |
            org.opencontainers.image.title=SharpMUSH all-in-one
            org.opencontainers.image.description=SharpMUSH in one container, for one-container hosts
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        env:
          SUFFIXES: ${{ steps.meta.outputs.suffixes }}
        run: |
          {
            echo "## Docker images published"
            echo ""
            for image in server renderer socketserver edge allinone; do
              line="- \`sharpmush/sharpmush-$image\`:"
              for tag in $SUFFIXES; do line="$line \`$tag\`"; done
              echo "$line"
            done
            echo ""
            echo "Replacing the socketserver or edge image drops live connections."
            if [[ " $SUFFIXES " == *" latest "* ]]; then
              echo ""
              echo "Next: open a pull request that moves the deploy files to this release:"
              echo "\`python3 .github/scripts/release_images.py bump ${SUFFIXES%% *}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

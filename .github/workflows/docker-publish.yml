name: Publish Docker Images

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_dotnet-build-test.yml

  build-and-push:
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # arm64 images run on Oracle Cloud's free tier and ARM servers. The .NET build stages run on
      # the runner's own platform; emulation only carries each image's last few steps.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag is the version: v1.0.0 builds 1.0.0 (passed into the server as SharpMUSHVersion, which
      # version(), @version and MSSP report). A manual run must be started on a tag too.
      - name: Extract version from tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow on a v* tag; $GITHUB_REF is not one."
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A prerelease (1.0.0-rc.1) does not move :latest.
          if [[ "$VERSION" == *-* ]]; then echo "latest=false" >> "$GITHUB_OUTPUT"; else echo "latest=true" >> "$GITHUB_OUTPUT"; fi
          echo "Building version: $VERSION"

      - name: Build and push SharpMUSH Server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile
          push: true
          build-args: |
            SHARPMUSH_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            sharpmush/sharpmush-server:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'sharpmush/sharpmush-server:latest' || '' }}
          labels: |
            org.opencontainers.image.title=SharpMUSH Server
            org.opencontainers.image.description=Modern MUSH server implementation
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push rendering worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./SharpMUSH.RenderingWorker/Dockerfile
          push: true
          tags: |
            sharpmush/sharpmush-renderer:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'sharpmush/sharpmush-renderer:latest' || '' }}
          labels: |
            org.opencontainers.image.title=SharpMUSH Renderer
            org.opencontainers.image.description=Rendering worker for SharpMUSH
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SocketServer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./SharpMUSH.SocketServer/Dockerfile
          push: true
          tags: |
            sharpmush/sharpmush-socketserver:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'sharpmush/sharpmush-socketserver:latest' || '' }}
          labels: |
            org.opencontainers.image.title=SharpMUSH SocketServer
            org.opencontainers.image.description=Stable socket owner for SharpMUSH
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./deploy/fly/Dockerfile
          push: true
          pull: true
          build-args: |
            SHARPMUSH_IMAGE_TAG=${{ steps.meta.outputs.version }}
          tags: |
            sharpmush/sharpmush-allinone:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'sharpmush/sharpmush-allinone:latest' || '' }}
          labels: |
            org.opencontainers.image.title=SharpMUSH all-in-one
            org.opencontainers.image.description=SharpMUSH in one container, for one-container hosts
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "## 🐳 Docker Images Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Successfully built and pushed images to DockerHub:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SharpMUSH Server" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-server:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-server:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Renderer" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-renderer:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-renderer:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SocketServer — replacement drops live connections" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-socketserver:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-socketserver:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### All-in-one" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-allinone:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sharpmush/sharpmush-allinone:latest\`" >> "$GITHUB_STEP_SUMMARY"

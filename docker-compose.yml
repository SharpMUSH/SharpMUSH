services:
  nats:
    image: nats:2-alpine
    container_name: sharpmush-nats
    # -c: max_payload (6 MB) — a server-level limit with no CLI flag, so it needs a config file.
    command: ["-js", "-sd", "/data", "-m", "8222", "-c", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"   # NATS client port
      - "8222:8222"   # NATS monitoring port
    networks:
      - sharpmush-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:8222/healthz -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  connectionserver:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: SharpMUSH.SocketServer/Dockerfile
    # Deliberately NOT a watchtower target: this service owns every telnet and /ws kernel socket,
    # so recreating it disconnects everyone who is logged in. Engine and renderer updates are the
    # ones that can be unattended — those keep the sockets. See deploy/connection-updates.md.
    labels:
      - com.centurylinklabs.watchtower.enable=false
    stop_grace_period: 60s
    volumes:
      - render-socket:/run/sharpmush
    environment:
      - Rendering__SocketPath=/run/sharpmush/render.sock
      - NATS_URL=nats://nats:4222
    depends_on:
      renderer:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "4201:4201" # Telnet
      - "4202:4202" # SocketServer WebSocket API
      - "9091:9091" # Metrics endpoint (for external monitoring tools)
    networks:
      - sharpmush-net

  # Rendering can restart independently; the stable connectionserver service owns client sockets.
  renderer:
    build:
      context: ./
      dockerfile: SharpMUSH.RenderingWorker/Dockerfile
    stop_grace_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - Rendering__SocketPath=/run/sharpmush/render.sock
    volumes:
      - render-socket:/run/sharpmush
    # A network of its own, so it can fetch the pictures terminals draw (SOCKSET graphics) while reaching
    # none of the other services. The fetch also refuses private and loopback addresses.
    networks:
      - renderer-egress
    restart: unless-stopped

  sharpmush-server:
    restart: unless-stopped
    stop_grace_period: 60s
    build:
      context: ./
      dockerfile: Dockerfile
    # Safe to update unattended: the engine going down and coming back sends players a restart
    # notice and leaves the socket owner — and so their connections — untouched.
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # Embedded LMDB world on the app-data volume; no database container needed. See deploy/README.md
      # for the durability setting and the map-size ceiling.
      - SHARPMUSH_LIGHTNING_PATH=data/lightning
      - SHARPMUSH_LIGHTNING_SYNC=periodic
      - NATS_URL=nats://nats:4222
      # Plain HTTP on 8080, published below, so the portal is at http://localhost:8080. The image
      # also names a dev certificate for HTTPS on 8081 that a fresh checkout does not have, and
      # Kestrel loads a configured default certificate even when nothing listens on HTTPS, so the
      # path is cleared as well.
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=
      - ASPNETCORE_Kestrel__Certificates__Default__Password=
    depends_on:
      nats:
        condition: service_healthy
      connectionserver:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080" # Portal, REST API and live updates; loopback only, so nobody else can claim /setup
      - "9092:9092" # Metrics endpoint (for external monitoring tools)
    volumes:
      - app-data:/app/data
    networks:
      - sharpmush-net

volumes:
  nats-data: # Durable connection state, resume credentials and replay
  render-socket: # Private Unix socket shared only by socket owner and rendering worker
  app-data:   # LMDB world + wiki assets

networks:
  renderer-egress:
    driver: bridge
  sharpmush-net:
    driver: bridge

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SharpMUSH.Client</title>
    <base href="/" />
    <link rel="preload" as="style" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg" href="assets/Logo.svg" />
    <link rel="preload" href="/fonts/cascadia-mono.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link href="css/custom.css" rel="stylesheet" />
    <link href="SharpMUSH.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="position: fixed; height: 100%; width: 100%; margin: 0; background-color: var(--mud-palette-appbar-background); background-image: var(--mud-palette-navbar-gradient); ">
            <div style="display: flex; justify-content: center; align-items:center; height:100%; width:100%;">
                <div class="b-demo-loading">
                    <img src="assets/Logo.svg" style="height: 500px;"  alt="Logo"/>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Third-party JS that Blazor components invoke via JSInterop must be loaded BEFORE
         blazor.webassembly.js: Blazor WASM boots asynchronously (WASM fetch + compile), but
         OnAfterRenderAsync can fire before scripts placed after the boot script are evaluated,
         causing ReferenceErrors. That constraint is why the heavy editors used to be here too —
         Monaco (3.67 MB) and Mermaid (2.57 MB) were fetched by every visitor of the home page,
         who mostly never opens the softcode editor or a wiki diagram. They load on demand now,
         through the loader below, and the pages that need them await it before rendering. -->
    <script src="js/lazy-assets.js"></script>
    <!-- Terminal grid measurement and resize observer -->
    <script src="js/terminalMetrics.js"></script>
    <script src="js/layout.js"></script>
    <!-- The wiki post-render pass (mermaid run + anchor scroll). Mermaid itself is fetched by this
         script only when a page actually contains a diagram. -->
    <script src="js/wiki-render.js"></script>
    <!-- Manual start so the runtime knows the culture BEFORE boot: with sharded ICU (we ship no
         full globalization data), Blazor hard-errors if the culture changes during startup.
         Program.cs applies the same locale afterwards, which is then a no-op rather than a
         "change". Offered locales (en, fr — see LanguagePicker) both live in the EFIGS shard. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        const locale = (() => {
            try {
                const stored = localStorage.getItem('locale');
                if (stored === 'en' || stored === 'fr') return stored;
            } catch { /* storage unavailable — fall through */ }
            return 'en';
        })();
        Blazor.start({ applicationCulture: locale });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

</body>

</html>

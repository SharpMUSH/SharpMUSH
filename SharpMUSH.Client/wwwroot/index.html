<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SharpMUSH.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- custom.css pulls these in with @import (that is how each lands in its cascade layer), and an
         @import is only discovered once custom.css itself has arrived and been parsed — a second
         round trip before first paint. Preloading them with the exact URLs the imports resolve to
         fetches all of them alongside custom.css instead. -->
    <link rel="preload" as="style" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="preload" as="style" href="css/tokens.css" />
    <link rel="preload" as="style" href="css/shell.css" />
    <link rel="preload" as="style" href="css/mush-syntax.css" />
    <link rel="preload" as="style" href="css/globals.css" />
    <link rel="preload" as="style" href="css/utilities.css" />
    <link rel="icon" type="image/svg" href="assets/Logo.svg" />
    <link rel="preload" href="/fonts/cascadia-mono.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link href="css/custom.css" rel="stylesheet" />
    <link href="SharpMUSH.Client.styles.css" rel="stylesheet" />
    <!-- The theme this browser last used (ThemeService.CacheKey), applied before the runtime starts so the
         loading screen and the first render are already in it. ThemeProvider's own copy follows in the body
         and overrides this one once the game's themes and the character's accent are read. -->
    <script>
        try {
            const theme = JSON.parse(localStorage.getItem('sharp-theme') || 'null');
            if (theme && typeof theme.Css === 'string') {
                const style = document.createElement('style');
                style.id = 'sharp-theme-boot';
                style.textContent = theme.Css;
                document.head.appendChild(style);
            }
        } catch { /* storage unavailable or unreadable: tokens.css stands */ }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="position: fixed; height: 100%; width: 100%; margin: 0; background-color: var(--mud-palette-appbar-background); background-image: var(--mud-palette-navbar-gradient); ">
            <div style="display: flex; justify-content: center; align-items:center; height:100%; width:100%;">
                <div class="b-demo-loading">
                    <img src="assets/Logo.svg" style="height: 500px;"  alt="Logo"/>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Third-party JS that Blazor components invoke via JSInterop must be loaded BEFORE
         blazor.webassembly.js: Blazor WASM boots asynchronously (WASM fetch + compile), but
         OnAfterRenderAsync can fire before scripts placed after the boot script are evaluated,
         causing ReferenceErrors. That constraint is why the heavy editors used to be here too —
         Monaco (3.67 MB) and Mermaid (2.57 MB) were fetched by every visitor of the home page,
         who mostly never opens the softcode editor or a wiki diagram. They load on demand now,
         through the loader below, and the pages that need them await it before rendering. -->
    <script src="js/lazy-assets#[.{fingerprint}].js"></script>
    <script src="js/portal-interop#[.{fingerprint}].js"></script>
    <!-- Terminal grid measurement and resize observer -->
    <script src="js/terminalMetrics#[.{fingerprint}].js"></script>
    <!-- A terminal's resume point in sessionStorage, so a reload resumes the game session -->
    <script src="js/terminal-resume#[.{fingerprint}].js"></script>
    <script src="js/layout#[.{fingerprint}].js"></script>
    <!-- Passkey (WebAuthn) prompts for sign-in and the account page -->
    <script src="js/passkeys#[.{fingerprint}].js"></script>
    <!-- The wiki post-render pass (mermaid run + anchor scroll). Mermaid itself is fetched by this
         script only when a page actually contains a diagram. -->
    <script src="js/wiki-render#[.{fingerprint}].js"></script>
    <!-- Manual start so the runtime boots in the visitor's culture. Blazor fetches the satellite
         (translation) assemblies for applicationCulture alongside the rest of the boot resources;
         a culture that only arrives later, when Program.cs applies the stored locale, has its
         satellites fetched one after another before the first render instead. So every locale the
         picker offers belongs in this list — PortalSurfacesTests keeps it in step with
         PortalLocales.Codes. Anything else (a stale or hand-edited value) boots in English, and
         Program.cs resets it the same way. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        const portalLocales = ["en", "bg", "da", "de", "es", "fr", "hr", "hu", "nb", "nl", "pl", "pt-BR", "ro", "ru", "sv", "zh-Hans"];
        const locale = (() => {
            try {
                const stored = localStorage.getItem('locale');
                if (portalLocales.includes(stored)) return stored;
            } catch { /* storage unavailable — fall through */ }
            return 'en';
        })();
        Blazor.start({ applicationCulture: locale });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

</body>

</html>
